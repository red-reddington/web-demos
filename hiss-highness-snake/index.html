          this.updateBlink(dt);
          this.updatePupils(dt, this.externalLookTarget);
          this.externalLookTarget = null; // Clear after use
          this.updateJaw(dt);

        updateTongue(dt, isMoving) {
          this.tongueTimer += dt;

          if (
            this.tongueState === "idle" &&
            Math.random() < (isMoving ? 0.02 : 0.008)
          ) {
            this.tongueState = "out";
            this.tongueTimer = 0;
          }

          if (this.tongueState === "out") {
            this.tongueOut = Math.min(1, this.tongueOut + dt * 8);
            if (this.tongueOut >= 1) this.tongueState = "flick";
          }

          if (this.tongueState === "flick") {
            const flickAmount = Math.sin(this.tongueTimer * 25) * 0.15;
            this.tongueFlick = flickAmount;
            if (this.tongueTimer > 0.3) this.tongueState = "in";
          }

          if (this.tongueState === "in") {
            this.tongueOut = Math.max(0, this.tongueOut - dt * 6);
            this.tongueFlick *= 0.9;
            if (this.tongueOut <= 0) this.tongueState = "idle";
          }

          // Apply 3D tongue animation
          this.tongueGroup.visible = this.tongueOut > 0;
          if (this.tongueGroup.visible) {
            this.tongueGroup.position.z = -0.2 + this.tongueOut * 0.25;

            // 3D flick
            this.tongueGroup.rotation.y = this.tongueFlick; // left/right
            this.tongueGroup.rotation.x =
              Math.sin(this.tongueTimer * 10) * 0.06; // up/down
            this.tongueGroup.rotation.z = Math.sin(this.tongueTimer * 12) * 0.1; // slight roll

            // Fork wiggle
            this.tongueForkLeft.rotation.y =
              0.25 + Math.sin(this.tongueTimer * 30) * 0.15;
            this.tongueForkRight.rotation.y =
              -0.25 - Math.sin(this.tongueTimer * 30) * 0.15;

        updateBlink(dt) {
          this.blinkTimer -= dt;

          if (
            this.blinkTimer <= 0 &&
            this.blinkLeft === 0 &&
            this.blinkRight === 0
          ) {
            this.blinkTimer = 5 + Math.random() * 8;
            this.blinkLeft = 1;
            this.blinkRight = 1;
          }

          // Slow blink down then up
          if (this.blinkLeft > 0) {
            this.blinkLeft = Math.max(0, this.blinkLeft - dt * 1.5);
          }
          if (this.blinkRight > 0) {
            this.blinkRight = Math.max(0, this.blinkRight - dt * 1.5);
          }

          const leftLid = this.eyeLeft.userData.lid;
          const rightLid = this.eyeRight.userData.lid;
          const leftOpen = this.eyeLeft.userData.lidOpenRotation;
          const leftClosed = this.eyeLeft.userData.lidClosedRotation;
          const rightOpen = this.eyeRight.userData.lidOpenRotation;
          const rightClosed = this.eyeRight.userData.lidClosedRotation;

          // Blink curve: quick close, slow open
          const blinkCurve = (t) => (t > 0.5 ? (1 - t) * 2 : t * 2);

          const leftAmount = blinkCurve(this.blinkLeft);
          const rightAmount = blinkCurve(this.blinkRight);

          leftLid.visible = true;
          rightLid.visible = true;

          // Rotate lid around X axis to close over the eye
          leftLid.rotation.x = THREE.MathUtils.lerp(
            leftOpen,
            leftClosed,
            leftAmount
          );
          rightLid.rotation.x = THREE.MathUtils.lerp(
            rightOpen,
            rightClosed,
            rightAmount
          );

        updatePupils(dt, externalTarget = null) {

            leftPupil.rotation.x = this.lookCurrentY;

          if (rightPupil) {

            rightPupil.rotation.x = this.lookCurrentY;

          this.fangRight.visible = showTeeth;

      }

      const snakeHead = new SnakeHead();

      // ==========================================================================

      const mice = [];

      const maxEatParticles = 100;

      eatParticleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      eatParticleMesh.count = 0;
      eatParticleMesh.frustumCulled = false;
      scene.add(eatParticleMesh);

      // Pre-allocated pool

      for (let i = 0; i < maxEatParticles; i++) {

      function getRandomSpawnPosition() {

        let x, z, valid;

        do {
          x = (Math.random() - 0.5) * 2 * maxX;
          z = (Math.random() - 0.5) * 2 * maxZ;
          valid = true;

          // Check distance from obstacles
          for (const obs of obsData) {
            const dx = x - obs.x;
            const dz = z - obs.z;
            if (Math.sqrt(dx * dx + dz * dz) < obs.r + 2) {

          // Check distance from snake head

          const dsz = z - snake.headPos.z;

              if (mouse.runAction && mouse.currentAction !== mouse.runAction) {
                mouse.currentAction?.fadeOut(0.3);
                mouse.runAction.reset().fadeIn(0.3).play();
                mouse.runAction.timeScale = 1.0;
                mouse.currentAction = mouse.runAction;
              }
            }
            break;
          }

          case MOUSE_STATE.WANDERING: {
            mouse.speed = CONFIG.MOUSE.WANDER_SPEED;
            mouse.stateTimer -= dt;
            mouse.wanderTimer -= dt;

            // Change direction occasionally
            if (mouse.wanderTimer <= 0) {
              mouse.wanderTimer =
                CONFIG.MOUSE.WANDER_CHANGE_TIME * (0.5 + Math.random());
              mouse.targetHeading =
                mouse.heading + (Math.random() - 0.5) * Math.PI * 0.8;
            }

            // Smoothly turn toward target heading
            const headingDiff = mouse.targetHeading - mouse.heading;
            const normalizedDiff = Math.atan2(
              Math.sin(headingDiff),
              Math.cos(headingDiff)
            );
            mouse.heading += normalizedDiff * 3 * dt;

            // Set animation speed
            if (mouse.runAction) {
              mouse.runAction.timeScale = 1.0;
            }

            // Transition back to idle
            if (mouse.stateTimer <= 0) {
              mouse.state = MOUSE_STATE.IDLE;
              mouse.stateTimer = 1 + Math.random() * 2;

              // Switch to idle animation
              if (
                mouse.idleAction &&
                mouse.currentAction !== mouse.idleAction
              ) {
                mouse.currentAction?.fadeOut(0.3);
                mouse.idleAction.reset().fadeIn(0.3).play();
                mouse.currentAction = mouse.idleAction;
              }
            }
            break;
          }

          case MOUSE_STATE.FLEEING: {
            mouse.speed = CONFIG.MOUSE.FLEE_SPEED;
            mouse.fleeTimer -= dt;

            // Run directly away from snake
            _mouseFleeDir.subVectors(mouse.mesh.position, snake.headPos);
            _mouseFleeDir.y = 0;
            _mouseFleeDir.normalize();

            mouse.targetHeading = Math.atan2(_mouseFleeDir.x, _mouseFleeDir.z);

            // Fast turning when fleeing
            const headingDiff = mouse.targetHeading - mouse.heading;
            const normalizedDiff = Math.atan2(
              Math.sin(headingDiff),
              Math.cos(headingDiff)
            );
            mouse.heading += normalizedDiff * 8 * dt;

            // Set animation speed (fast)
            if (mouse.runAction) {
              mouse.runAction.timeScale = 2.5;
            }

            // Check if still can see snake or if timer expired
            if (mouse.fleeTimer <= 0 && !canMouseSeeSnake(mouse)) {
              mouse.state = MOUSE_STATE.WANDERING;
              mouse.stateTimer = 2 + Math.random() * 2;
              mouse.showFear = false;

              if (mouse.runAction) {
                mouse.runAction.timeScale = 1.0;
              }
            } else if (canMouseSeeSnake(mouse)) {
              // Reset flee timer if still can see snake
              mouse.fleeTimer = Math.max(mouse.fleeTimer, 1.0);
            }
            break;
          }
        }

        // Apply movement
        if (mouse.speed > 0) {
          const moveX = Math.sin(mouse.heading) * mouse.speed * dt;
          const moveZ = Math.cos(mouse.heading) * mouse.speed * dt;

          let newX = mouse.mesh.position.x + moveX;
          let newZ = mouse.mesh.position.z + moveZ;

          // Boundary check
          const margin = CONFIG.MOUSE.SPAWN_MARGIN;
          const maxX = tw / 2 - margin;
          const maxZ = th / 2 - margin;

          if (Math.abs(newX) > maxX || Math.abs(newZ) > maxZ) {
            // Turn around
            mouse.targetHeading = mouse.heading + Math.PI;
            newX = THREE.MathUtils.clamp(newX, -maxX, maxX);
            newZ = THREE.MathUtils.clamp(newZ, -maxZ, maxZ);
          }

          // Obstacle avoidance with sliding
          for (let oi = 0; oi < obsData.length; oi++) {
            const obs = obsData[oi];
            const dx = newX - obs.x;
            const dz = newZ - obs.z;
            const minDist = obs.r + 0.5;
            const minDistSq = minDist * minDist;
            const distSq = dx * dx + dz * dz;

            if (distSq < minDistSq && distSq > 0.000001) {
              const dist = Math.sqrt(distSq);
              // Push out of collision
              const nx = dx / dist;
              const nz = dz / dist;
              const pen = minDist - dist;
              newX += nx * pen;
              newZ += nz * pen;

              // Slide along the collision normal instead of stopping
              // Project velocity onto tangent (perpendicular to normal)
              const velX = Math.sin(mouse.heading) * mouse.speed * dt;
              const velZ = Math.cos(mouse.heading) * mouse.speed * dt;
              const dot = velX * nx + velZ * nz;
              const slideX = velX - dot * nx;
              const slideZ = velZ - dot * nz;

              // Apply sliding motion
              newX += slideX * 0.8;
              newZ += slideZ * 0.8;

              // Gradually turn away from obstacle (smoother than instant)
              const awayAngle = Math.atan2(dx, dz);
              const angleDiff = awayAngle - mouse.targetHeading;
              const normalizedDiff = Math.atan2(
                Math.sin(angleDiff),
                Math.cos(angleDiff)
              );
              mouse.targetHeading += normalizedDiff * 0.3;
            }
          }

          mouse.mesh.position.x = newX;
          mouse.mesh.position.z = newZ;
        }

        // Update Y position to terrain
        const terrainY = getTerrainHeight(
          mouse.mesh.position.x,
          mouse.mesh.position.z
        );
        mouse.mesh.position.y = terrainY;

        // Update rotation
        mouse.mesh.rotation.y = mouse.heading;
      }

      function updateMice(dt, time) {
        // Update shared mixer ONCE
        if (mouseMixer) {
          mouseMixer.update(dt);
        }

        // Update frustums from both cameras
        _projScreenMatrix.multiplyMatrices(
          camera.projectionMatrix,
          camera.matrixWorldInverse
        );
        _frustum.setFromProjectionMatrix(_projScreenMatrix);
        _projScreenMatrix2.multiplyMatrices(
          faceCamera.projectionMatrix,
          faceCamera.matrixWorldInverse
        );
        _frustum2.setFromProjectionMatrix(_projScreenMatrix2);

        const detectionRangeSq = CONFIG.MOUSE.DETECTION_RANGE_SQ;
        const eatRadiusSq = CONFIG.MOUSE.EAT_RADIUS_SQ;

        for (const mouse of mice) {
          if (mouse.state === MOUSE_STATE.EATEN) continue;

          const distSq = mouse.mesh.position.distanceToSquared(snake.headPos);

          // Eating check first - very cheap
          if (distSq < eatRadiusSq) {
            // Eaten!
            mouse.state = MOUSE_STATE.EATEN;
            mouse.mesh.visible = false;
            mouse.fearIndicator.visible = false;
            spawnEatParticles(mouse.mesh.position);

            // Score popup
            const screenPos = mouse.mesh.position.clone().project(camera);
            const screenX = ((screenPos.x + 1) / 2) * window.innerWidth;
            const screenY = ((-screenPos.y + 1) / 2) * window.innerHeight;
            showScorePopup(screenX, screenY, 1);
            updateScore(1);

            setTimeout(() => respawnMouse(mouse), 2000);
            continue;
          }

          const nearSnake = distSq < detectionRangeSq;
          const inView =
            _frustum.containsPoint(mouse.mesh.position) ||
            _frustum2.containsPoint(mouse.mesh.position);

          // Only update if visible OR near snake
          if (inView || nearSnake) {
            updateMouse(mouse, dt, time, inView);
          }
        }

        updateEatParticles(dt);
      }

      // Load mouse model
      async function loadMouseModel() {
        const loader = new GLTFLoader();
        try {
          // from https://sketchfab.com/3d-models/mouse-bf516bd5a93341b194976f6f391d1e30
          const gltf = await loader.loadAsync(
            "https://raw.githubusercontent.com/red-reddington/public-assets/main/mouse.glb"
          );

          baseMouseModel = gltf.scene;
          baseMouseAnims = gltf.animations;

          // Scale and setup base model
          const box = new THREE.Box3().setFromObject(baseMouseModel);
          const size = box.getSize(new THREE.Vector3());
          const scale = 1.0 / Math.max(size.x, size.y, size.z);
          baseMouseModel.scale.setScalar(scale);

          baseMouseModel.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = true;
            }
          });

          // Create ONE shared mixer for all mice
          mouseMixer = new THREE.AnimationMixer(baseMouseModel);

          // Find and cache animations
          for (const anim of baseMouseAnims) {
            const name = anim.name.toLowerCase();
            if (name.includes("idle")) mouseIdleAnim = anim;
            else if (name.includes("run")) mouseRunAnim = anim;
          }
          // Fallback
          if (!mouseIdleAnim) mouseIdleAnim = baseMouseAnims[0];
          if (!mouseRunAnim)
            mouseRunAnim =
              baseMouseAnims.length > 1 ? baseMouseAnims[1] : baseMouseAnims[0];

          console.log(
            "Mouse model loaded with",
            baseMouseAnims.length,
            "animations:"
          );
          baseMouseAnims.forEach((anim, i) =>
            console.log(`  ${i}: ${anim.name}`)
          );

          // Spawn initial mice
          for (let i = 0; i < CONFIG.MOUSE.COUNT; i++) {
            spawnMouse();
          }

          // Enable click-to-start on splash
          const splash = document.getElementById("splash");
          if (splash) {
            splash.style.cursor = "pointer";
            splash.addEventListener(
              "click",
              () => {
                splash.classList.add("hidden");
                setTimeout(() => splash.remove(), 500);
              },
              { once: true }
            );
          }
        } catch (e) {
          console.error("Could not load mouse.glb:", e);
        }
      }

      // Start loading mice
      loadMouseModel();

      // Move forward one frame to create natural starting curve
      input.forward = true;
      snake.update(0.5);
      input.forward = false;

      // ==========================================================================
      // EVENTS
      // ==========================================================================
      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      addEventListener("contextmenu", (e) => e.preventDefault());

      container.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          mainZoom = THREE.MathUtils.clamp(
            mainZoom - e.deltaY * CONFIG.ZOOM_PER_SCROLL_TICK,
            CONFIG.MIN_ZOOM,
            CONFIG.MAX_ZOOM
          );
          camera.zoom = mainZoom;
          camera.updateProjectionMatrix();
        },
        { passive: false }
      );

      facecam.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          faceZoom = THREE.MathUtils.clamp(
            faceZoom - e.deltaY * CONFIG.ZOOM_PER_SCROLL_TICK,
            CONFIG.MIN_ZOOM,
            CONFIG.MAX_ZOOM
          );
          faceCamera.zoom = faceZoom;
          faceCamera.updateProjectionMatrix();
        },
        { passive: false }
      );

      // ==========================================================================
      // RENDER LOOP
      // ==========================================================================
      let lastTime = 0;

      function animate(time) {
        requestAnimationFrame(animate);
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;

        snake.update(dt);

        // Calculate actual head facing direction from head-to-neck
        const head = snake.pos[0];
        const neck = snake.pos[1];
        const actualYaw = Math.atan2(neck.x - head.x, neck.z - head.z);

        // Smoothly blend toward actual head orientation
        const yawDiff = actualYaw - snake.yaw;
        // Normalize angle difference to -PI to PI
        const normalizedDiff = Math.atan2(Math.sin(yawDiff), Math.cos(yawDiff));

        // Always sync snake.yaw to actual head direction (smoothly)
        snake.yaw += normalizedDiff * 0.1;

        const camYaw = snake.yaw;

        // Main camera - behind snake's head
        const camDist = 12,
          camH = 6;
        _v1.set(
          snake.headPos.x + Math.sin(camYaw) * camDist,
          snake.headPos.y + camH,
          snake.headPos.z + Math.cos(camYaw) * camDist
        );

        if (!controls.enabled) {
          camera.position.copy(_v1);
          camera.lookAt(snake.headPos);
        }

        // Update snake head
        const isMoving =
          input.forward ||
          input.backward ||
          input.left ||
          input.right ||
          Math.abs(joystickMove.x) > 0.01 ||
          Math.abs(joystickMove.y) > 0.01;
        snakeHead.update(dt, snake.pos, snake.yaw, isMoving);

        // Eyes track camera when orbit is enabled
        if (controls.enabled) {
          snakeHead.lookAt(camera.position);
        }

        // Update mice
        updateMice(dt, time);

        // Face camera - IN FRONT of snake looking AT head
        const faceDist = 2.5;
        _v2.set(
          snake.headPos.x - Math.sin(camYaw) * faceDist,
          snake.headPos.y + 0.3,
          snake.headPos.z - Math.cos(camYaw) * faceDist
        );
        faceCamera.position.copy(_v2);
        faceCamera.lookAt(snake.headPos);

        updateSunShadow(snake.headPos);

        renderer.render(scene, camera);
        if (CONFIG.FACECAM_SHOW) faceCamRenderer.render(scene, faceCamera);

        if (CONFIG.STATS) statsGL.update();
      }

      animate(0);
      
      ['touchstart', 'touchend'].forEach(ev => renderer.domElement.addEventListener(ev, e => e.preventDefault(), { passive: false })); // kill iOS double-tap zoom on canvas
    </script>
  </body>
</html>
