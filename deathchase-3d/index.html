              this._engineId = null;
            }
            SOUND.play("crash");
          }

          // Particle burst at bike's world position
          _v3a.set(this.bike.worldX, 1.0, this.bike.worldZ);
          this.particles.burst(_v3a, 60);
          this._showPopup("CRASHED!", "#ff3030");

          this.state = GameState.DEAD;
          this._stateTimer = 2.0;
        }

        _enterGameOver() {
          this.state = GameState.GAME_OVER;
          this.hud.goSub.textContent = `FINAL SCORE: $${this.score.toLocaleString()}`;
          this.hud.gameover.classList.add("show");

          // Audio: silence everything. Player engine, any lingering enemy engines, ambient noise. The next thing the player hears should be a hard cut to the game-over UI.
          if (SOUND) {
            if (this._engineId != null) {
              SOUND.stopLoop("engine_player", this._engineId);
              this._engineId = null;
            }
            for (const e of this.enemies) {
              if (e._engineId != null) {
                SOUND.stopLoop("engine_enemy", e._engineId);
                e._engineId = null;
              }
            }
          }
        }

        _updateHUD(speed) {
          // Score is the only field left in the corner HTML overlay.
          // Speed, throttle, lives, targets, ODO all live on the in-bike dashboard (BikeHUD).
          this.hud.score.textContent = `$${this.score.toLocaleString()}`;
        }

        /* ------------------------------------------------------------------
         * Render
         * ------------------------------------------------------------------ */
        render() {
          this.renderer.render(this.scene, this.camera);
        }

        resize(w, h) {
          this.renderer.setSize(w, h);
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
        }
      }

      /* ============================================================================
       * BOOTSTRAP
       * Single global init — wire DOM, kick frame loop with fixed-step accumulator.
       * ============================================================================ */
      function init() {
        const container = document.getElementById("container");
        const splash = document.getElementById("splash");

        // CTA text reflects device: same touch-only check Input will use later.
        if (isTouchOnly()) {
          document.getElementById("splashCTA").textContent = "TAP TO START";
        }

        // Splash gate: do nothing until the player clicks/taps. The click resumes the suspended AudioContext (gesture requirement) and gives the player a clean "ready?" beat before gameplay.
        const startGame = () => {
          SOUND = new SoundManager();
          if (Howler.ctx && Howler.ctx.state === "suspended") {
            Howler.ctx.resume().catch(() => {});
          }

          // Intro voice ("DEATH CHASE" in MK announcer style). One-shot, missing file falls back to silence.
          SOUND.play("intro_voice");

          const muteBtn = document.getElementById("muteBtn");
          if (muteBtn && SOUND.isMuted) muteBtn.classList.add("muted");

          splash.classList.add("hidden");
          setTimeout(() => splash.remove(), 600);

          startBootstrap();
        };
        splash.addEventListener("pointerdown", startGame, { once: true });
      }

      function startBootstrap() {
        const container = document.getElementById("container");
        const game = new Game(container);

        // Expose for the icon-button handlers below.
        window.__game = game;

        // Resize handling — debounced via rAF so no thrash on drag.
        let resizePending = false;
        const onResize = () => {
          if (resizePending) return;
          resizePending = true;
          requestAnimationFrame(() => {
            game.resize(window.innerWidth, window.innerHeight);
            resizePending = false;
          });
        };
        window.addEventListener("resize", onResize);
        onResize();

        initFullscreen();

        // Mute button: click toggles, key M toggles.
        const muteBtn = document.getElementById("muteBtn");
        const applyMute = () => {
          const muted = SOUND.toggleMute();
          muteBtn.classList.toggle("muted", muted);
        };
        muteBtn.addEventListener("click", applyMute);
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyM" && !e.repeat) {
            applyMute();
            e.preventDefault();
          }
        });

        // H key toggles the help flyout (mirrors the ? icon).
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyH" && !e.repeat) {
            const panel = document.getElementById("helpPanel");
            if (panel) panel.classList.toggle("show");
            e.preventDefault();
          }
        });

        // Frame loop. I use Timer (updated each frame) with a clamped delta-time (cap dt at 1/30s) so that tab-switches and long pauses don't produce a huge spike on resume.
        const timer = new Timer();
        let prevTime = 0;

        // FPS + extra stats (DC = draw calls, TRI = rendered triangles, GEO = live geometries, TEX = live textures, PRG = compiled shader programs). FPS updates twice a second; extras update once a second. Each metric is diff-gated — I only touch the DOM when the value actually changes.
        let fpsAcc = 0,
          fpsFrames = 0,
          extraAcc = 0,
          lastFps = -1,
          lastDC = -1,
          lastTRI = -1,
          lastGEO = -1,
          lastTEX = -1,
          lastPRG = -1;
        const statsEl = document.getElementById("stats");
        const statsFps = document.getElementById("statsFps");
        const statsExtra = document.getElementById("statsExtra");

        // Tap/click toggles the expanded panel. pointerdown for instant response on touch (avoids ~300ms tap delay on some browsers).
        // The element sits on top of #firePad in the bottom-right corner — taps inside stats hit this handler; taps elsewhere fall through to firePad (separate DOM siblings, no propagation between them).
        if (statsEl) {
          statsEl.addEventListener("pointerdown", (e) => {
            statsEl.classList.toggle("expanded");
            e.preventDefault();
          });
        }

        const fmtN = (n) =>
          n >= 1e6
            ? (n / 1e6).toFixed(1) + "M"
            : n >= 1e3
              ? (n / 1e3).toFixed(1) + "K"
              : String(n);

        // ---- Help icon flyout ----
        // The "?" icon next to fullscreen reveals the controls list.
        // Click toggles the panel; tapping outside closes it.
        const helpBtn = document.getElementById("helpBtn");
        const helpPanel = document.getElementById("helpPanel");
        if (helpBtn && helpPanel) {
          helpBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            helpPanel.classList.toggle("show");
          });
          document.addEventListener("pointerdown", (e) => {
            if (
              !helpPanel.contains(e.target) &&
              !helpBtn.contains(e.target) &&
              helpPanel.classList.contains("show")
            ) {
              helpPanel.classList.remove("show");
            }
          });
        }

        // ---- Pause System ----
        // ESC (desktop) and tap (mobile) to toggle pause.
        // Auto-pauses on tab switch / window blur.
        const pauseOverlay = document.getElementById("pauseOverlay");
        const pauseHint = document.getElementById("pauseHint");

        const pausableState = () =>
          game.state === GameState.PLAYING ||
          game.state === GameState.STAGE_INTRO;

        let resumeReseed = false;

        const resetClockOnNextFrame = () => {
          resumeReseed = true;
        };

        const setPaused = (p) => {
          if (game.paused === p) return; // prevent duplicate calls / state glitches

          game.paused = p;
          pauseOverlay.classList.toggle("show", p);

          // Hide the in-world reticle while paused — it's an aiming aid, and seeing it floating during a pause feels off.
          if (game.bike && game.bike._reticle) {
            game.bike._reticle.visible = !p;
          }

          // Audio: suspend / resume the entire AudioContext on pause.
          // Cheaper than stopping every loop and restarting — engines pick up exactly where they left off. Doesn't conflict with the player's M-key mute (that's a separate Howler.mute()).
          if (Howler.ctx) {
            if (p && Howler.ctx.state === "running") {
              Howler.ctx.suspend().catch(() => {});
            } else if (!p && Howler.ctx.state === "suspended") {
              Howler.ctx.resume().catch(() => {});
            }
          }

          if (!p) {
            resetClockOnNextFrame(); // prevent huge dt spike on resume
          }
        };

        // Update pause hint for touch devices
        if (game.input && game.input.touchOnly) {
          pauseHint.innerHTML = "tap to resume";
        }

        // ESC: when paused, always unpause (regardless of state). When unpaused, only enter pause if in a pausable state.
        // The exit-pause path is unconditional so the player can NEVER get stuck on the pause overlay — e.g. if the game paused during DEAD/STAGE_CLEARED/GAME_OVER via visibilitychange/blur, an earlier version would refuse to unpause because those states aren't pausable.
        window.addEventListener("keydown", (e) => {
          if (e.code === "Escape") {
            if (game.paused) {
              setPaused(false);
              e.preventDefault();
            } else if (pausableState()) {
              setPaused(true);
              e.preventDefault();
            }
          }
        });

        // Click anywhere on the visible pause overlay → unpause.
        // Unconditional: if the overlay is visible the player wants out, no matter what game state we're in underneath.
        if (pauseOverlay) {
          pauseOverlay.addEventListener("pointerdown", (e) => {
            if (game.paused) {
              setPaused(false);
              e.preventDefault();
            }
          });
        }

        // Touch fire pad: tap-to-resume on mobile. Same rationale as above — unconditional unpause when paused.
        if (game.input && game.input.touchOnly) {
          const firePad = document.getElementById("firePad");
          if (firePad) {
            firePad.addEventListener(
              "pointerdown",
              (e) => {
                if (game.paused) {
                  setPaused(false);
                  e.stopImmediatePropagation();
                }
              },
              { capture: true },
            );
          }
        }

        // System-level pause: only triggers in pausable states. No point auto-pausing during DEAD/STAGE_CLEARED/GAME_OVER — those are transient or terminal screens with no input to protect. Also avoids "pause stuck on game-over" weirdness.
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (pausableState()) setPaused(true);
          } else {
            resetClockOnNextFrame();
          }
        });

        window.addEventListener("blur", () => {
          if (pausableState()) setPaused(true);
        });
        window.addEventListener("focus", resetClockOnNextFrame);

        function tick() {
          requestAnimationFrame(tick);

          timer.update(); // REQUIRED each frame

          let elapsed = timer.getElapsed();

          if (resumeReseed) {
            // Re-anchor prevTime to current elapsed (from Timer) so dt becomes ~0 next read.
            prevTime = elapsed;
            resumeReseed = false;
          }

          let dt = elapsed - prevTime;
          prevTime = elapsed;
          // Clamp dt to avoid simulation explosion on tab-resume
          if (dt > 1 / 30) dt = 1 / 30;

          if (!game.paused) {
            game.update(dt, elapsed);
          }
          game.render();

          // FPS smoothed every ~0.5s. Frozen while paused — no meaningful per-frame work to measure when update() is being skipped, and a non-changing number reads better in a pause overlay than a slowly drifting one. Writes gated by a diff check (a 60→60 textContent assignment still triggers a style/layout pass on most browsers).
          if (!game.paused) {
            fpsAcc += dt;
            fpsFrames++;
            if (fpsAcc >= 0.5) {
              const fps = (fpsFrames / fpsAcc) | 0;
              if (fps !== lastFps) {
                statsFps.textContent = `${fps} fps`;
                lastFps = fps;
              }
              fpsAcc = 0;
              fpsFrames = 0;
            }
            // Extra stats once per second; only when expanded so I don't pay even the read+diff cost when hidden.
            // PRG (compiled shader programs) is the cheapest leak detector — every accidentally-created Material recompiles a program.
            if (statsEl.classList.contains("expanded")) {
              extraAcc += dt;
              if (extraAcc >= 1.0) {
                const r = game.renderer.info.render;
                const m = game.renderer.info.memory;
                const prg = game.renderer.info.programs?.length || 0;
                // Same diff gate as FPS — only touch DOM if values changed.
                if (
                  r.calls !== lastDC ||
                  r.triangles !== lastTRI ||
                  m.geometries !== lastGEO ||
                  m.textures !== lastTEX ||
                  prg !== lastPRG
                ) {
                  statsExtra.textContent =
                    `\nDC: ${fmtN(r.calls)}` +
                    `\nTRI: ${fmtN(r.triangles)}` +
                    `\nGEO: ${m.geometries}` +
                    `\nTEX: ${m.textures}` +
                    `\nPRG: ${prg}`;
                  lastDC = r.calls;
                  lastTRI = r.triangles;
                  lastGEO = m.geometries;
                  lastTEX = m.textures;
                  lastPRG = prg;
                }
                extraAcc = 0;
              }
            }
          }
        }
        tick();
      }

      init();
    </script>
  </body>
</html>
