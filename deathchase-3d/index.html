                float edgeDist = max(abs(pos.x), abs(pos.y)) * 2.0;
                pos.x += instanceWobbleX * edgeDist;
                pos.y += instanceWobbleY * edgeDist;
                pos.x += pos.y * 0.08 * instanceWobbleX;
                pos *= 0.94 + instanceRandom * 0.12;
                if (dist < ${C.LOD_SWAY_DISTANCE.toFixed(1)}) {
                  float swayFactor = clamp(1.0 - (dist - ${C.LOD_SWAY_FADE_START.toFixed(1)})
                                           / ${(C.LOD_SWAY_DISTANCE - C.LOD_SWAY_FADE_START).toFixed(1)},
                                           0.0, 1.0);
                  float s = sin(time * 1.2 + instanceSwayPhase);
                  pos.x += s * 0.08 * swayFactor;
                  pos.z += s * 0.05 * swayFactor;
                }
                vec4 worldPos = modelMatrix * instanceMatrix * vec4(pos, 1.0);
                vWorldPosition = worldPos.xyz;
                vNormal = normalize((modelMatrix * instanceMatrix * vec4(normal, 0.0)).xyz);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
              }
            `,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D leafTexture;
              uniform vec3 sunDirection;
              uniform vec3 sunColor;
              uniform vec3 ambientLight;
              varying vec2 vUv;
              varying vec3 vColor;
              varying vec3 vWorldPosition;
              varying vec3 vNormal;
              varying float vRandom;
              void main() {
                vec4 texColor = texture2D(leafTexture, vUv);
                if (texColor.a < 0.5) discard;
                vec3 N = normalize(vNormal);
                vec3 L = normalize(sunDirection);
                vec3 V = normalize(cameraPosition - vWorldPosition);
                if (!gl_FrontFacing) N = -N;
                float NdotL = max(dot(N, L), 0.0);
                float leafShadow = smoothstep(0.0, 1.0, dot(N, L) * 0.5 + 0.5);
                float diffuse = NdotL * 0.8 * leafShadow;
                float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.0) * 0.1;
                float sss = pow(max(dot(-N, L), 0.0), 2.0) * 0.35;
                vec3 baseColor = vColor * texColor.rgb;
                baseColor *= 0.92 + vRandom * 0.16;
                float ao = exp(-vWorldPosition.y * 0.1);
                baseColor *= 0.85 + 0.15 * ao;
                vec3 litColor = baseColor *
                  (ambientLight + sunColor * (diffuse + sss)) +
                  fresnel * vec3(0.7, 0.8, 0.6);
                gl_FragColor = vec4(litColor, 1.0);
              }
            `,
            side: DoubleSide,
          });

          const leafGeo = this._leafGeo;
          const leafMesh = new InstancedMesh(
            leafGeo,
            leafMat,
            this.leafMatrices.length,
          );
          leafMesh.instanceMatrix.setUsage(DynamicDrawUsage);
          leafMesh.frustumCulled = false;
          leafMesh.castShadow = true;
          leafMesh.receiveShadow = false;
          for (let i = 0; i < this.leafMatrices.length; i++) {
            leafMesh.setMatrixAt(i, this.leafMatrices[i]);
          }
          leafMesh.instanceMatrix.needsUpdate = true;

          leafMesh.geometry.setAttribute(
            "instanceColorAttr",
            new InstancedBufferAttribute(new Float32Array(this.leafColors), 3),
          );
          leafMesh.geometry.setAttribute(
            "instanceRandom",
            new InstancedBufferAttribute(new Float32Array(this.leafRandoms), 1),
          );
          leafMesh.geometry.setAttribute(
            "instanceWobbleX",
            new InstancedBufferAttribute(new Float32Array(this.leafWobbleX), 1),
          );
          leafMesh.geometry.setAttribute(
            "instanceWobbleY",
            new InstancedBufferAttribute(new Float32Array(this.leafWobbleY), 1),
          );
          leafMesh.geometry.setAttribute(
            "instanceSwayPhase",
            new InstancedBufferAttribute(
              new Float32Array(this.leafSwayPhase),
              1,
            ),
          );

          this.group.add(leafMesh);
          this.meshes.leaves = leafMesh;
          this.leafMat = leafMat;
        }

        /**
         * Build per-tree contiguous index ranges into branch/leaf arrays.
         * I need these to recycle a tree by translating ALL its branches and leaves at once.
         */
        _buildTreeRanges() {
          const branchByTree = new Array(this.treeCount);
          const leafByTree = new Array(this.treeCount);
          for (let i = 0; i < this.treeCount; i++) {
            branchByTree[i] = [];
            leafByTree[i] = [];
          }
          for (let i = 0; i < this.branchTreeIds.length; i++) {
            branchByTree[this.branchTreeIds[i]].push(i);
          }
          for (let i = 0; i < this.leafTreeIds.length; i++) {
            leafByTree[this.leafTreeIds[i]].push(i);
          }
          // Convert to typed arrays for cache locality during recycling.
          this.treeBranchRanges = branchByTree.map((a) => new Uint32Array(a));
          this.treeLeafRanges = leafByTree.map((a) => new Uint32Array(a));
        }

        /**
         * Cache the BASE matrices (initial bake) as a flat Float32Array so I can compute "translated" matrices on the fly during recycling without alloc.
         * I need this because once a tree is recycled, its instance matrices in the InstancedMesh have moved — but the next recycle should be relative to the ORIGINAL base, not the current location.
         * I store the original tree-relative offset in `branchOffsetX/Z` (translation only, since recycling only translates in XZ).
         */
        _cacheBaseMatrices() {
          const n = this.branchMatrices.length;
          // For each branch, store its X,Z offset RELATIVE to its tree's origin.
          // That way recycling = newTreeX + offsetX, no matter where the tree was before. (Branch rotations and Y are unchanged by recycling.)
          this._branchOffsetX = new Float32Array(n);
          this._branchOffsetZ = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const treeId = this.branchTreeIds[i];
            const tx = this.treePosX[treeId];
            const tz = this.treePosZ[treeId];
            const m = this.branchMatrices[i];
            // Matrix.elements[12]=x, [14]=z (column-major translation column).
            this._branchOffsetX[i] = m.elements[12] - tx;
            this._branchOffsetZ[i] = m.elements[14] - tz;
          }
          const m_ = this.leafMatrices.length;
          this._leafOffsetX = new Float32Array(m_);
          this._leafOffsetZ = new Float32Array(m_);
          for (let i = 0; i < m_; i++) {
            const treeId = this.leafTreeIds[i];
            const m = this.leafMatrices[i];
            this._leafOffsetX[i] = m.elements[12] - this.treePosX[treeId];
            this._leafOffsetZ[i] = m.elements[14] - this.treePosZ[treeId];
          }
          // After this, branchMatrices/leafMatrices are no longer the source of truth — the InstancedMesh instanceMatrix array is. Free the JS Matrix4 arrays for GC.
          this.branchMatrices = null;
          this.leafMatrices = null;
          this.leafColors = null; // no longer needed past attribute build
          this.leafRandoms = null;
          this.leafWobbleX = null;
          this.leafWobbleY = null;
          this.leafSwayPhase = null;
        }

        /**
         * Force-redistribute every tree in a uniform annulus around (bx, bz).
         * Used mainly after player death/respawn. Uses deterministic seeded PRNG so the forest layout feels consistent and "fixed" in the world.
         */
        redistributeAround(bx, bz) {
          const CLEAR_RADIUS = 12;
          const rMinSq = CLEAR_RADIUS * CLEAR_RADIUS;
          const rMaxSq = this.forestRadius * this.forestRadius;

          const barkMesh = this.meshes.bark;
          const leafMesh = this.meshes.leaves;
          const barkArr = barkMesh.instanceMatrix.array;
          const leafArr = leafMesh.instanceMatrix.array;

          // Use a stable seed based on position so the same area always looks similar
          const gridX = Math.floor(bx / 60);
          const gridZ = Math.floor(bz / 60);
          const baseSeed = this.seed + gridX * 157 + gridZ * 283;

          const rand = mulberry32(baseSeed);

          for (let t = 0; t < this.treeCount; t++) {
            // Each tree gets its own stable variation
            const treeSeed = baseSeed + t * 7919;
            const treeRand = mulberry32(treeSeed);

            const u = treeRand();
            const r = Math.sqrt(rMinSq + u * (rMaxSq - rMinSq));
            const theta = treeRand() * Math.PI * 2;

            const newX = bx + r * Math.cos(theta);
            const newZ = bz + r * Math.sin(theta);

            const dx = newX - this.treePosX[t];
            const dz = newZ - this.treePosZ[t];

            this.treePosX[t] = newX;
            this.treePosZ[t] = newZ;

            // Translate the tree's branches and leaves
            const branchIdx = this.treeBranchRanges[t];
            for (let i = 0; i < branchIdx.length; i++) {
              const off = branchIdx[i] * 16;
              barkArr[off + 12] += dx;
              barkArr[off + 14] += dz;
            }
            const leafIdx = this.treeLeafRanges[t];
            for (let i = 0; i < leafIdx.length; i++) {
              const off = leafIdx[i] * 16;
              leafArr[off + 12] += dx;
              leafArr[off + 14] += dz;
            }
          }

          barkMesh.instanceMatrix.needsUpdate = true;
          leafMesh.instanceMatrix.needsUpdate = true;
        }

        /**
         * Per-frame tree streaming. Trees outside the disc of `forestRadius` get repositioned to a fresh spot on the LEADING hemisphere at fog distance, so they drift toward the bike rather than popping in at the disc rim. Recycle positions are seeded by (treeId, grid cell), so a stopped player sees a stable forest.
         */
        recycleBehind2D(bikeX, bikeZ, heading) {
          const radius = this.forestRadius;
          const radiusSq = radius * radius;
          // Recycled trees land in a thin band at the disc's outer edge so they appear at fog distance and fade in smoothly.
          const ringInner = radius * 0.95;
          const ringInnerSq = ringInner * ringInner;

          // Stable per-cell seed source: when the bike is in grid cell (gx, gz), all recycle decisions in this frame draw from the same seed sequence. As long as the bike stays in this cell, recycled trees keep the same world positions.
          const gridX = Math.floor(bikeX / 45);
          const gridZ = Math.floor(bikeZ / 45);
          const baseSeed = gridX * 173 + gridZ * 397;

          const barkMesh = this.meshes.bark;
          const leafMesh = this.meshes.leaves;
          const barkArr = barkMesh.instanceMatrix.array;
          const leafArr = leafMesh.instanceMatrix.array;
          let anyChanged = false;

          for (let t = 0; t < this.treeCount; t++) {
            const dx = this.treePosX[t] - bikeX;
            const dz = this.treePosZ[t] - bikeZ;
            const distSq = dx * dx + dz * dz;

            // KEEP if still within the disc. The only test — trees outside the player's view but inside the disc stay where they are.
            if (distSq < radiusSq) continue;

            // Tree has left the disc. Recycle to a deterministic position on the leading hemisphere at fog distance.
            const seed = t * 73891 + baseSeed;
            const rand = mulberry32(seed);

            // Angle in the LEADING hemisphere — heading ± π/2 (180° wide).
            // This keeps recycled trees in front of the bike so they drift through the disc rather than appearing behind.
            const newAngle = heading + (rand() * 2 - 1) * (Math.PI * 0.5);
            // Distance: outer ring only, fog-edge.
            const newDist = Math.sqrt(
              ringInnerSq + rand() * (radiusSq - ringInnerSq),
            );

            // heading 0 → forward = (sin h, -cos h). Convert (angle, dist) to world XZ using the same convention.
            const newX = bikeX + Math.sin(newAngle) * newDist;
            const newZ = bikeZ - Math.cos(newAngle) * newDist;

            const moveDx = newX - this.treePosX[t];
            const moveDz = newZ - this.treePosZ[t];
            this.treePosX[t] = newX;
            this.treePosZ[t] = newZ;

            // Translate this tree's branch + leaf instances by the same delta.
            const branchIdx = this.treeBranchRanges[t];
            for (let i = 0; i < branchIdx.length; i++) {
              const off = branchIdx[i] * 16;
              barkArr[off + 12] += moveDx;
              barkArr[off + 14] += moveDz;
            }
            const leafIdx = this.treeLeafRanges[t];
            for (let i = 0; i < leafIdx.length; i++) {
              const off = leafIdx[i] * 16;
              leafArr[off + 12] += moveDx;
              leafArr[off + 14] += moveDz;
            }
            anyChanged = true;
          }

          if (anyChanged) {
            barkMesh.instanceMatrix.needsUpdate = true;
            leafMesh.instanceMatrix.needsUpdate = true;
          }
        }

        /**
         * Update leaf sway time uniform.
         */
        updateTime(elapsed) {
          if (this.leafMat) this.leafMat.uniforms.time.value = elapsed;
        }

        dispose() {
          for (const mesh of Object.values(this.meshes)) {
            if (mesh) {
              mesh.geometry.dispose();
              mesh.material.dispose();
            }
          }
        }

        // True iff (x, z) is at least `radius` away from every tree.
        // Used by enemy spawn placement to avoid putting bikes inside trunks (which would cause instant suicide on respawn).
        isClearAt(x, z, radius) {
          const SEARCH_R = radius + 2.0;
          for (let t = 0; t < this.treeCount; t++) {
            const dx = this.treePosX[t] - x;
            if (dx > SEARCH_R || dx < -SEARCH_R) continue;
            const dz = this.treePosZ[t] - z;
            if (dz > SEARCH_R || dz < -SEARCH_R) continue;
            const r = this.treeRadius[t] + radius;
            if (dx * dx + dz * dz < r * r) return false;
          }
          return true;
        }
      }

      /* ============================================================================
       * PROCEDURAL TEXTURES (leaf, bark)
       * Cached in canvas, generated once at startup.
       * ============================================================================ */
      function createLeafTexture() {
        const size = 128;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, size, size);

        const leafPath = () => {
          ctx.beginPath();
          ctx.moveTo(size * 0.5, size * 0.03);
          ctx.bezierCurveTo(
            size * 0.78,
            size * 0.18,
            size * 0.82,
            size * 0.65,
            size * 0.5,
            size * 0.97,
          );
          ctx.bezierCurveTo(
            size * 0.18,
            size * 0.65,
            size * 0.22,
            size * 0.18,
            size * 0.5,
            size * 0.03,
          );
        };

        const gradient = ctx.createLinearGradient(0, 0, 0, size);
        gradient.addColorStop(0, "#6ab560");
        gradient.addColorStop(0.3, "#5aa052");
        gradient.addColorStop(0.7, "#4a9045");
        gradient.addColorStop(1, "#3d8038");
        leafPath();
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.globalCompositeOperation = "overlay";
        for (let i = 0; i < 600; i++) {
          const x = Math.random() * size,
            y = Math.random() * size;
          const b = Math.random() * 40 - 20;
          ctx.fillStyle = `rgba(${128 + b},${128 + b},${128 + b},0.04)`;
          ctx.fillRect(x, y, 3, 3);
        }
        ctx.globalCompositeOperation = "source-over";

        ctx.save();
        leafPath();
        ctx.clip();
        ctx.strokeStyle = "rgba(35, 60, 30, 0.18)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(size * 0.5, size * 0.08);
        ctx.quadraticCurveTo(size * 0.5, size * 0.5, size * 0.5, size * 0.92);
        ctx.stroke();
        ctx.restore();

        const tex = new CanvasTexture(canvas);
        tex.colorSpace = SRGBColorSpace;
        tex.minFilter = LinearMipmapLinearFilter;
        return tex;
      }

      /**
       * Procedural ground normal map. Summed-octave value noise generates a heightfield; central differences give per-pixel normals encoded to RGB. ~3ms one-time CPU pass; texture is sampled by standard normal-mapping shader after.
       */
      function createGroundNormalMap() {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        const img = ctx.createImageData(size, size);

        // Build a coarse 32×32 random grid then bilinearly upsample + add a finer octave on top. Two octaves are plenty for ground bump detail; three is overkill and the higher frequencies just look like noise on the GPU.
        const coarse = new Float32Array(32 * 32);
        for (let i = 0; i < coarse.length; i++) coarse[i] = Math.random();
        const fine = new Float32Array(64 * 64);
        for (let i = 0; i < fine.length; i++) fine[i] = Math.random();

        const sample = (grid, gridSize, fx, fy) => {
          // Bilinear sample with wrap-around (matches RepeatWrapping at runtime).
          const x = (((fx % 1) + 1) % 1) * gridSize;
          const y = (((fy % 1) + 1) % 1) * gridSize;
          const x0 = Math.floor(x),
            y0 = Math.floor(y);
          const x1 = (x0 + 1) % gridSize,
            y1 = (y0 + 1) % gridSize;
          const tx = x - x0,
            ty = y - y0;
          const a = grid[y0 * gridSize + x0],
            b = grid[y0 * gridSize + x1];
          const c = grid[y1 * gridSize + x0],
            d = grid[y1 * gridSize + x1];
          return (
            (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty
          );
        };

        const height = (x, y) => {
          const fx = x / size,
            fy = y / size;
          return (
            sample(coarse, 32, fx, fy) * 0.7 +
            sample(fine, 64, fx * 2, fy * 2) * 0.3
          );
        };

        // Central-difference gradient → surface normal. Larger `nz` = flatter terrain; smaller = exaggerated bumps. ~3 reads as subtle but visible under raking light.
        const NZ = 3.0;
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const dx =
              height((x + 1) % size, y) - height((x - 1 + size) % size, y);
            const dy =
              height(x, (y + 1) % size) - height(x, (y - 1 + size) % size);
            // Normalize (-dx, -dy, NZ)
            const len = Math.hypot(dx, dy, NZ);
            const nx = -dx / len,
              ny = -dy / len,
              nz = NZ / len;
            const i = (y * size + x) * 4;
            img.data[i] = (nx * 0.5 + 0.5) * 255;
            img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
            img.data[i + 2] = nz * 255;
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);

        const tex = new CanvasTexture(canvas);
        // Normal maps must be in linear space (NOT sRGB) — they encode vectors, not colors. The GPU's normal-map pathway samples them linearly.
        tex.colorSpace = NoColorSpace;
        tex.minFilter = LinearMipmapLinearFilter;
        tex.magFilter = LinearFilter;
        return tex;
      }

      function createBarkTexture() {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#4a3520";
        ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 40; i++) {
          const x = Math.random() * size;
          const w = 1 + Math.random() * 4;
          const l = Math.random() > 0.5 ? 25 : -25;
          ctx.fillStyle = `rgba(${100 + l},${60 + l},${30 + l},0.4)`;
          ctx.fillRect(x, 0, w, size);
        }
        for (let i = 0; i < 20; i++) {
          const y = Math.random() * size;
          ctx.strokeStyle = `rgba(0,0,0,${0.15 + Math.random() * 0.25})`;
          ctx.lineWidth = 1 + Math.random() * 2;
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x < size; x += 8)
            ctx.lineTo(x, y + (Math.random() - 0.5) * 6);
          ctx.stroke();
        }
        for (let i = 0; i < 800; i++) {
          const x = Math.random() * size,
            y = Math.random() * size;
          const b = Math.random() > 0.5 ? 35 : -35;
          ctx.fillStyle = `rgba(${100 + b},${65 + b},${35 + b},0.15)`;
          ctx.fillRect(x, y, 2, 2);
        }
        const tex = new CanvasTexture(canvas);
        tex.wrapS = RepeatWrapping;
        tex.wrapT = RepeatWrapping;
        tex.colorSpace = SRGBColorSpace;
        tex.minFilter = LinearMipmapLinearFilter;
        return tex;
      }

      /* ============================================================================
       * BULLET TRAIL MANAGER
       * GPU-instanced billboard trails — each Trail occupies SEGMENTS_PER_TRAIL slots in a single InstancedBufferGeometry.
       * `fire(origin, target)` finds an inactive Trail and starts it.
       *
       * For Deathchase the Trail is purely VISUAL — gameplay collision lives in `Bullet` (a parallel system below).
       * I call `bulletTrails.fire(...)` once per shot to spawn the visual; the trail flies at `BULLET_SPEED` toward the target and fades after impact.
       * ============================================================================ */
      const bulletTrailVertexShader = /* glsl */ `
        uniform vec2 playerPositionXZ;
        attribute vec3 instanceOffset;
        attribute vec3 instanceDirection;
        attribute vec2 instanceScale;
        attribute vec4 instanceColor;
        attribute float instanceT;
        varying vec4 vColor;
        varying vec2 vUv;
        varying float vFogDepth;
        const float EPS = 1e-5;
        void main() {
          vColor = instanceColor;
          vUv = vec2(uv.x, instanceT);
          // Right-axis from forward × world-up (instanceOffset is in worldGroup-local, not scene world; cameraPosition-based billboarding would mix frames). Quad lies in the horizontal plane with width perpendicular to flight — not strictly camera-facing but always visible.
          vec3 forward = normalize(instanceDirection);
          vec3 worldUp = vec3(0.0, 1.0, 0.0);
          vec3 rawRight = cross(worldUp, forward);
          float rlen = length(rawRight);
          vec3 right = rlen < EPS
            ? normalize(cross(forward, vec3(1.0, 0.0, 0.0)))
            : rawRight / rlen;
          vec3 up = cross(forward, right);
          mat3 rotMatrix = mat3(right, up, forward);
          vec3 localPos = vec3(position.x * instanceScale.x, 0.0, position.y * instanceScale.y);
          vec3 worldPos = instanceOffset + rotMatrix * localPos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
          vFogDepth = distance(worldPos.xz, playerPositionXZ);
        }
      `;
      const bulletTrailFragmentShader = /* glsl */ `
        uniform float fogNear;
        uniform float fogFar;
        varying vec4 vColor;
        varying vec2 vUv;
        varying float vFogDepth;
        void main() {
          float side = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float sideFade = smoothstep(0.0, 0.45, side);
          float headFall = smoothstep(0.0, 0.15, 1.0 - vUv.y);
          float lengthFade = headFall * (1.0 - pow(vUv.y, 1.5));
          float alpha = vColor.a * sideFade * lengthFade;
          if (alpha <= 0.0001) discard;
          float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
          alpha *= (1.0 - fogFactor);
          if (alpha <= 0.0001) discard;
          gl_FragColor = vec4(vColor.rgb, alpha);
        }
      `;

      class Trail {
        constructor(index, segmentsPerTrail) {
          this.index = index;
          this.segmentCount = segmentsPerTrail;
          this.baseInstance = index * segmentsPerTrail;
          this.active = false;
          this.origin = new Vector3();
          this.target = new Vector3();
          this.direction = new Vector3();
          this.distance = 0;
          this.progress = 0;
          this.phase = "flying";
          this.fadeProgress = 0;
          this.startTime = 0;
          this.hitTime = 0;
        }
        fire(origin, target, now) {
          this.origin.copy(origin);
          this.target.copy(target);
          this.direction.subVectors(target, origin).normalize();
          this.distance = origin.distanceTo(target);
          this.progress = 0;
          this.phase = "flying";
          this.fadeProgress = 0;
          this.startTime = now;
          this.hitTime = 0;
          this.active = true;
        }
        update(
          now,
          bulletSpeed,
          offsetAttr,
          dirAttr,
          scaleAttr,
          colorAttr,
          tAttr,
          _trailPos,
        ) {
          if (!this.active) return false;
          const cfg = CONFIG.BULLET_TRAILS;
          if (this.phase === "flying") {
            const elapsed = (now - this.startTime) / 1000;
            const headDist = elapsed * bulletSpeed;
            this.progress = Math.min(headDist / this.distance, 1);
            if (this.progress >= 1) {
              this.phase = "fading";
              this.hitTime = now;
            }
          } else {
            const fadeElapsed = now - this.hitTime;
            this.fadeProgress = Math.min(fadeElapsed / cfg.LIFETIME_MS, 1);
            if (this.fadeProgress >= 1) {
              this.active = false;
              this._hideSegments(scaleAttr);
              return false;
            }
          }
          const headDist = this.progress * this.distance;
          const tailDist = Math.max(0, headDist - cfg.TRAIL_LENGTH);
          let effectiveTailDist = tailDist;
          if (this.phase === "fading") {
            effectiveTailDist = tailDist + this.fadeProgress * cfg.TRAIL_LENGTH;
          }
          const segmentLength =
            (headDist - effectiveTailDist) / Math.max(this.segmentCount - 1, 1);
          const fadeMult = 1 - this.fadeProgress;

          for (let i = 0; i < this.segmentCount; i++) {
            const t = i / (this.segmentCount - 1);
            const segDist = headDist - t * (headDist - effectiveTailDist);
            _trailPos
              .copy(this.origin)
              .addScaledVector(this.direction, segDist);
            const idx = this.baseInstance + i;
            offsetAttr.setXYZ(idx, _trailPos.x, _trailPos.y, _trailPos.z);
            dirAttr.setXYZ(
              idx,
              this.direction.x,
              this.direction.y,
              this.direction.z,
            );
            const width =
              cfg.WIDTH_HEAD + (cfg.WIDTH_TAIL - cfg.WIDTH_HEAD) * t;
            const length = Math.max(segmentLength, 0.01);
            scaleAttr.setXY(idx, width, length);

            let r, g, b, a;
            if (t < 0.5) {
              const lt = t * 2;
              r = cfg.COLOR_HEAD.r + (cfg.COLOR_MID.r - cfg.COLOR_HEAD.r) * lt;
              g = cfg.COLOR_HEAD.g + (cfg.COLOR_MID.g - cfg.COLOR_HEAD.g) * lt;
              b = cfg.COLOR_HEAD.b + (cfg.COLOR_MID.b - cfg.COLOR_HEAD.b) * lt;
              a = cfg.COLOR_HEAD.a + (cfg.COLOR_MID.a - cfg.COLOR_HEAD.a) * lt;
            } else {
              const lt = (t - 0.5) * 2;
              r = cfg.COLOR_MID.r + (cfg.COLOR_TAIL.r - cfg.COLOR_MID.r) * lt;
              g = cfg.COLOR_MID.g + (cfg.COLOR_TAIL.g - cfg.COLOR_MID.g) * lt;
              b = cfg.COLOR_MID.b + (cfg.COLOR_TAIL.b - cfg.COLOR_MID.b) * lt;
              a = cfg.COLOR_MID.a + (cfg.COLOR_TAIL.a - cfg.COLOR_MID.a) * lt;
            }
            colorAttr.setXYZW(idx, r, g, b, a * fadeMult);
            if (tAttr) tAttr.setX(idx, t);
          }
          return true;
        }
        _hideSegments(scaleAttr) {
          for (let i = 0; i < this.segmentCount; i++) {
            scaleAttr.setXY(this.baseInstance + i, 0, 0);
          }
        }
      }

      class BulletTrailManager {
        /**
         * @param {THREE.Object3D} parent  Node to attach the trail mesh to.
         *   Pass `worldGroup` so trails sit in WORLD space — fired-and-forget, not stuck to the bike's frame. The bike's pose-inverse on worldGroup will correctly transform world-space trail positions to scene-space each frame.
         */
        constructor(parent) {
          this.parent = parent;
          this.trails = [];
          this.enabled = CONFIG.BULLET_TRAILS.ENABLED;
          if (!this.enabled) return;

          const cfg = CONFIG.BULLET_TRAILS;
          const total = cfg.MAX_TRAILS * cfg.SEGMENTS_PER_TRAIL;
          const geo = new PlaneGeometry(1, 1);

          this.offsetAttr = new InstancedBufferAttribute(
            new Float32Array(total * 3),
            3,
          );
          this.dirAttr = new InstancedBufferAttribute(
            new Float32Array(total * 3),
            3,
          );
          this.scaleAttr = new InstancedBufferAttribute(
            new Float32Array(total * 2),
            2,
          );
          this.colorAttr = new InstancedBufferAttribute(
            new Float32Array(total * 4),
            4,
          );
          this.tAttr = new InstancedBufferAttribute(new Float32Array(total), 1);
          [
            this.offsetAttr,
            this.dirAttr,
            this.scaleAttr,
            this.colorAttr,
            this.tAttr,
          ].forEach((a) => a.setUsage(DynamicDrawUsage));

          this.material = new ShaderMaterial({
            vertexShader: bulletTrailVertexShader,
            fragmentShader: bulletTrailFragmentShader,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            side: DoubleSide,
            blending: AdditiveBlending,
            uniforms: {
              fogNear: { value: 80 },
              fogFar: { value: 200 },
              playerPositionXZ: { value: new Vector2(0, 0) },
            },
          });

          const instGeo = new InstancedBufferGeometry();
          instGeo.index = geo.index;
          instGeo.attributes.position = geo.attributes.position;
          instGeo.attributes.uv = geo.attributes.uv;
          instGeo.attributes.normal = geo.attributes.normal;
          instGeo.setAttribute("instanceOffset", this.offsetAttr);
          instGeo.setAttribute("instanceDirection", this.dirAttr);
          instGeo.setAttribute("instanceScale", this.scaleAttr);
          instGeo.setAttribute("instanceColor", this.colorAttr);
          instGeo.setAttribute("instanceT", this.tAttr);
          instGeo.instanceCount = total;

          this.mesh = new Mesh(instGeo, this.material);
          this.mesh.frustumCulled = false;
          this.mesh.renderOrder = 100000;
          parent.add(this.mesh);

          for (let i = 0; i < cfg.MAX_TRAILS; i++) {
            this.trails.push(new Trail(i, cfg.SEGMENTS_PER_TRAIL));
          }

          // Hot-path scratch — reused inside update()
          this._trailScratch = new Vector3();
        }

        setPlayerXZ(x, z) {
          if (this.material)
            this.material.uniforms.playerPositionXZ.value.set(x, z);
        }

        /**
         * @param {THREE.Vector3} origin world muzzle position
         * @param {THREE.Vector3} target world hit (or max-range) point
         */
        fire(origin, target) {
          if (!this.enabled) return null;
          const trail = this.trails.find((t) => !t.active);
          if (!trail) return null;
          trail.fire(origin, target, performance.now());
          return trail;
        }

        update() {
          if (!this.enabled) return;
          const now = performance.now();
          const speed = CONFIG.BULLET_TRAILS.BULLET_SPEED;
          let any = false;
          for (const t of this.trails) {
            if (t.active) {
              t.update(
                now,
                speed,
                this.offsetAttr,
                this.dirAttr,
                this.scaleAttr,
                this.colorAttr,
                this.tAttr,
                this._trailScratch,
              );
              any = true;
            }
          }
          if (any) {
            this.offsetAttr.needsUpdate = true;
            this.dirAttr.needsUpdate = true;
            this.scaleAttr.needsUpdate = true;
            this.colorAttr.needsUpdate = true;
            this.tAttr.needsUpdate = true;
          }
        }
      }

      /* ============================================================================
       * EXPLOSION PARTICLES — GPU-resident sparks.
       *
       * Single InstancedMesh of camera-facing additive billboards. Each spark is one instance slot with per-instance attributes (iVel, iStart, iLife).
       * Vertex shader integrates physics from those + uTime; CPU does nothing after spawn. Round-robin allocator: when the pool wraps, oldest spark is overwritten.
       * ============================================================================ */
      class ParticleSystem {
        constructor(scene) {
          const C = CONFIG.PARTICLES;

          // Park dead instance slots far off-camera; I never resize mesh.count so the GPU doesn't skip particles at high indices.
          const _hidden = new Matrix4().makeTranslation(0, -10000, 0);

          const sparkGeo = new PlaneGeometry(0.18, 0.18);
          const vel = new Float32Array(C.SPARK_MAX * 3);
          const start = new Float32Array(C.SPARK_MAX);
          const life = new Float32Array(C.SPARK_MAX);
          start.fill(-99999); // all inactive
          sparkGeo.setAttribute("iVel", new InstancedBufferAttribute(vel, 3));
          sparkGeo.setAttribute(
            "iStart",
            new InstancedBufferAttribute(start, 1),
          );
          sparkGeo.setAttribute("iLife", new InstancedBufferAttribute(life, 1));

          const sparkMat = new ShaderMaterial({
            uniforms: {
              uTime: { value: 0 },
              uGravity: { value: 14 },
              uDrag: { value: 1.8 },
              uColor: { value: new Color(0xffaa30) },
            },
            vertexShader: ParticleSystem._sparkVertexShader(),
            fragmentShader: ParticleSystem._sparkFragmentShader(),
            transparent: true,
            depthWrite: false,
            blending: AdditiveBlending,
          });

          this.sparkMesh = new InstancedMesh(sparkGeo, sparkMat, C.SPARK_MAX);
          this.sparkMesh.frustumCulled = false;
          for (let i = 0; i < C.SPARK_MAX; i++) {
            this.sparkMesh.setMatrixAt(i, _hidden);
          }
          this.sparkMesh.instanceMatrix.needsUpdate = true;
          scene.add(this.sparkMesh);

          this._sparkMat = sparkMat;
          this._sparkWrite = 0;
          this._uTime = 0;
        }

        // Burst N sparks at a world position. Round-robin overwrites oldest on pool wrap.
        burst(pos, sparks = 30) {
          if (sparks <= 0) return;
          const C = CONFIG.PARTICLES;
          const t = this._uTime;
          const geo = this.sparkMesh.geometry;
          const vel = geo.attributes.iVel;
          const start = geo.attributes.iStart;
          const life = geo.attributes.iLife;

          for (let k = 0; k < sparks; k++) {
            const i = this._sparkWrite;
            this._sparkWrite = (this._sparkWrite + 1) % C.SPARK_MAX;

            vel.setXYZ(
              i,
              (Math.random() - 0.5) * 18,
              4 + Math.random() * 14,
              (Math.random() - 0.5) * 18,
            );
            start.setX(i, t);
            life.setX(i, 0.6 + Math.random() * 0.4);

            _matA.makeTranslation(pos.x, pos.y, pos.z);
            this.sparkMesh.setMatrixAt(i, _matA);
          }

          vel.needsUpdate = true;
          start.needsUpdate = true;
          life.needsUpdate = true;
          this.sparkMesh.instanceMatrix.needsUpdate = true;
        }

        // Per-frame: bump uTime. No CPU physics, no buffer re-upload.
        update(elapsed) {
          this._uTime = elapsed;
          this._sparkMat.uniforms.uTime.value = elapsed;
        }

        static _sparkVertexShader() {
          return /* glsl */ `
            attribute vec3 iVel;
            attribute float iStart;
            attribute float iLife;
            uniform float uTime;
            uniform float uGravity;
            uniform float uDrag;
            varying float vAlpha;
            void main() {
              float elapsed = uTime - iStart;
              float alive = step(0.0, elapsed) * step(elapsed, iLife);

              // Drag: exponential velocity decay.
              float decay = exp(-uDrag * elapsed);
              vec3 vel = iVel * decay;
              vel.y -= uGravity * elapsed;
              vec3 offset = vel * elapsed;

              // Billboard scale shrinks over life.
              float lifeT = 1.0 - (elapsed / iLife);
              float s = mix(0.6, 1.4, fract(iStart * 13.31)) * lifeT;

              vec4 worldCenter = modelMatrix * instanceMatrix
                * vec4(offset, 1.0);
              vec4 mvCenter = viewMatrix * worldCenter;
              mvCenter.xy += position.xy * s;
              gl_Position = projectionMatrix * mvCenter;

              vAlpha = alive * smoothstep(0.0, 0.15, lifeT);
            }
          `;
        }

        static _sparkFragmentShader() {
          return /* glsl */ `
            uniform vec3 uColor;
            varying float vAlpha;
            void main() {
              if (vAlpha < 0.01) discard;
              gl_FragColor = vec4(uColor, vAlpha);
            }
          `;
        }
      }

      /* ============================================================================
       * BIKE HUD — cockpit dashboard overlay.
       * CanvasTexture on a small plane aligned with the bike's dash LCD.
       * Shows speed, throttle, odometer, lives, targets. 10Hz redraw gated by a diff check. Unlit material with polygonOffset to win z-fight against the bezel.
       * ============================================================================ */
      class BikeHUD {
        /**
         * @param {THREE.Object3D} parent  The Bike's local group.
         */
        constructor(parent) {
          const cfg = CONFIG.HUD;

          // 4:3 canvas matching the plane aspect.
          this.canvas = document.createElement("canvas");
          // Canvas aspect roughly matches the plane (66:54 = 1.222:1).
          // 512x416 ≈ 1.231:1 — close enough that text doesn't visibly stretch, and keeps clean dimensions for a modern GPU's texture allocator.
          this.canvas.width = 512;
          this.canvas.height = 416;
          this.ctx = this.canvas.getContext("2d");

          this.texture = new CanvasTexture(this.canvas);
          this.texture.minFilter = LinearFilter;
          this.texture.magFilter = LinearFilter;
          this.texture.colorSpace = SRGBColorSpace;

          const mat = new MeshBasicMaterial({
            map: this.texture,
            transparent: false,
            depthWrite: true,
            side: DoubleSide, // defensive: keep visible from any tune
            // polygonOffset so the plane wins against the bezel behind it without millimeter position tuning.
            polygonOffset: true,
            polygonOffsetFactor: -2,
            polygonOffsetUnits: -2,
          });

          const geo = new PlaneGeometry(cfg.WIDTH, cfg.HEIGHT);
          this.mesh = new Mesh(geo, mat);
          this.mesh.position.set(cfg.POS.x, cfg.POS.y, cfg.POS.z);
          this.mesh.rotation.x = cfg.TILT_X;
          parent.add(this.mesh);

          this._refreshT = 0;
          this._refreshInterval = 1 / cfg.REDRAW_HZ;
          this._lastSpeed = -1;
          this._lastOdoTenth = -1;
          this._lastTripTenth = -1;
          this._lastThrottleTwentieth = -1;
          this._lastStage = -1;
          this._lastLives = -1;
          this._lastTargets = -1;
          this._lastTimeStr = "";

          // Force first draw so the HUD shows something even when stationary.
          this._draw(0, 0, 0, {
            stage: 1,
            lives: CONFIG.GAME.LIVES,
            targets: CONFIG.ENEMY.COUNT_PER_STAGE,
            timeStr: "--:--",
            tripStr: "0.0km",
          });
          this.texture.needsUpdate = true;
        }

        /**
         * @param {number} dt
         * @param {number} speedMs current bike speed in m/s
         * @param {object} status   { odoMeters, tripMeters, timeStr, stage, lives, targets }
         */
        update(dt, speedMs, status) {
          this._refreshT += dt;
          if (this._refreshT < this._refreshInterval) return;
          this._refreshT = 0;

          // Quantize for change detection so I don't redraw when only sub-pixel changes happened.
          const speedKmh = Math.round(speedMs * 3.6);
          const odoTenth = Math.floor(status.odoMeters / 100); // 0.1 km units
          const tripTenth = Math.floor(status.tripMeters / 100);
          const throttleFrac = Math.max(
            0,
            Math.min(1, speedMs / CONFIG.BIKE.SPEED_MAX),
          );
          const throttleTwentieth = Math.floor(throttleFrac * 20); // 5% bands

          if (
            speedKmh === this._lastSpeed &&
            odoTenth === this._lastOdoTenth &&
            tripTenth === this._lastTripTenth &&
            throttleTwentieth === this._lastThrottleTwentieth &&
            status.stage === this._lastStage &&
            status.lives === this._lastLives &&
            status.targets === this._lastTargets &&
            status.timeStr === this._lastTimeStr
          )
            return;

          this._lastSpeed = speedKmh;
          this._lastOdoTenth = odoTenth;
          this._lastTripTenth = tripTenth;
          this._lastThrottleTwentieth = throttleTwentieth;
          this._lastStage = status.stage;
          this._lastLives = status.lives;
          this._lastTargets = status.targets;
          this._lastTimeStr = status.timeStr;

          // Pre-format trip string so _draw can use it directly.
          status.tripStr = `${(tripTenth / 10).toFixed(1)}km`;
          this._draw(speedKmh, odoTenth, throttleFrac, status);
          this.texture.needsUpdate = true;
        }

        _draw(speedKmh, odoTenth, throttleFrac, status) {
          const ctx = this.ctx;
          const w = this.canvas.width;
          const h = this.canvas.height;

          // Backdrop: deep dark with a subtle blue-grey tint, like a backlit LCD seen through a tinted lens.
          ctx.fillStyle = "#0a0d12";
          ctx.fillRect(0, 0, w, h);

          // Outer bezel border for depth.
          ctx.strokeStyle = "#1a1f28";
          ctx.lineWidth = 6;
          ctx.strokeRect(3, 3, w - 6, h - 6);

          // ---- Speed (big, dominant) ----
          // Mint LCD digits, 3-char padded so the number doesn't reflow as it grows from one to two to three digits. KM/H label is tucked tight to the right of the digits at baseline level so it reads as a unit suffix, not a separate row — frees the vertical space for bigger labels and values below.
          ctx.fillStyle = "#7fffd4";
          ctx.font = "bold 200px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const speedY = h * 0.28;
          const speedText = String(speedKmh).padStart(3, " ");
          ctx.fillText(speedText, w / 2, speedY);

          // Inline unit. Position it relative to the right edge of the speed digits, slightly below the digit baseline so it reads as a subscript-style annotation.
          const speedW = ctx.measureText(speedText).width;
          ctx.fillStyle = "#3a5060";
          ctx.font = "600 24px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "left";
          ctx.fillText("KM/H", w / 2 + speedW / 2 + 12, speedY + 50);

          // ---- Throttle bar ----
          const barX = 40;
          const barY = h * 0.5;
          const barW = w - 80;
          const barH = 28;
          ctx.fillStyle = "#15191f";
          ctx.fillRect(barX, barY, barW, barH);
          ctx.strokeStyle = "#2a3038";
          ctx.lineWidth = 2;
          ctx.strokeRect(barX, barY, barW, barH);
          if (throttleFrac > 0) {
            const filled = Math.floor(barW * throttleFrac);
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0.0, "#3eff7a");
            grad.addColorStop(0.6, "#ffd633");
            grad.addColorStop(1.0, "#ff4040");
            ctx.fillStyle = grad;
            ctx.fillRect(barX + 2, barY + 2, filled - 4, barH - 4);
          }

          // ---- TIME / TRIP row ----
          // In-world readouts: the in-game clock (matches the sun position in the skybox) and the current-stage trip distance. Sized below the speed/throttle but above the bottom status row so it has its own breathing room without competing with the speedo.
          const midRowY = h * 0.69;
          const labelFont = "600 22px 'SF Mono', 'Menlo', monospace";
          const valueFont = "bold 28px 'SF Mono', 'Menlo', monospace";

          // Faint dividers framing the row
          ctx.strokeStyle = "#161b22";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(20, h * 0.625);
          ctx.lineTo(w - 20, h * 0.625);
          ctx.moveTo(20, h * 0.755);
          ctx.lineTo(w - 20, h * 0.755);
          ctx.stroke();

          // TIME (left)
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          ctx.fillStyle = "#3a5060";
          ctx.font = labelFont;
          ctx.fillText("TIME", 30, midRowY);
          ctx.fillStyle = "#cfd8e0";
          ctx.font = valueFont;
          ctx.fillText(status.timeStr, 100, midRowY);

          // TRIP (right). Label sits to the LEFT of the value so the value column right-aligns to the bezel edge — matches how the bottom-row status values right-align in their columns.
          ctx.textAlign = "right";
          ctx.fillStyle = "#cfd8e0";
          ctx.font = valueFont;
          const tripValW = ctx.measureText(status.tripStr).width;
          ctx.fillText(status.tripStr, w - 30, midRowY);
          ctx.fillStyle = "#3a5060";
          ctx.font = labelFont;
          ctx.fillText("TRIP", w - 30 - tripValW - 14, midRowY);

          // ---- Status row (stage, lives, targets, odo) ----
          // Layout: 4 columns, evenly spaced. Each column has a small dim label above and the value below. This reads as "instrument cluster" rather than "list of stats."
          const labelY = h * 0.835;
          const valueY = h * 0.93;
          const colW = w / 4;

          ctx.font = labelFont;
          ctx.textBaseline = "middle";
          ctx.textAlign = "center";

          const valueFontStatus = "bold 32px 'SF Mono', 'Menlo', monospace";

          // Helper to draw a labeled column.
          const drawCol = (i, label, valueText, valueColor) => {
            const cx = colW * (i + 0.5);
            ctx.fillStyle = "#3a5060";
            ctx.font = labelFont;
            ctx.fillText(label, cx, labelY);
            ctx.fillStyle = valueColor;
            ctx.font = valueFontStatus;
            ctx.fillText(valueText, cx, valueY);
          };

          // STG (stage)
          drawCol(0, "STG", String(status.stage), "#cfd8e0");

          // LIVES — render as up to N dots (●) with dim placeholders so count is glanceable without parsing a number.
          const livesCx = colW * 1.5;
          ctx.fillStyle = "#3a5060";
          ctx.font = labelFont;
          ctx.textAlign = "center";
          ctx.fillText("LIVES", livesCx, labelY);
          const maxLives = CONFIG.GAME.LIVES;
          const pipR = 9;
          const pipGap = 8;
          const totalW = maxLives * (pipR * 2) + (maxLives - 1) * pipGap;
          const pipStart = livesCx - totalW / 2 + pipR;
          for (let i = 0; i < maxLives; i++) {
            ctx.beginPath();
            ctx.arc(
              pipStart + i * (pipR * 2 + pipGap),
              valueY,
              pipR,
              0,
              Math.PI * 2,
            );
            ctx.fillStyle = i < status.lives ? "#7fffd4" : "#1a2530";
            ctx.fill();
          }

          // TGT (targets remaining) — amber as "active threat"
          const tgtColor = status.targets > 0 ? "#ffaa33" : "#3a5060";
          drawCol(2, "TGT", String(status.targets), tgtColor);

          // ODO (lifetime distance)
          drawCol(3, "ODO", `${(odoTenth / 10).toFixed(1)}km`, "#cfd8e0");
        }
      }

      /* ============================================================================
       * BIKE (PLAYER)
       * 2D world pose (worldX, worldZ, heading). Forward speed integrates along heading vector (handlebars feel). Mesh stays at scene origin facing -Z; world moves around it.
       * ============================================================================ */
      class Bike {
        constructor() {
          this.worldX = 0;
          this.worldZ = 0;
          this.heading = 0; // yaw in radians; 0 = facing -Z
          this.turnRate = 0;
          this.speed = CONFIG.BIKE.SPEED_INIT;
          this.lean = 0; // visual bike roll (radians, lerped)
          this.targetLean = 0;
          this.fireCooldown = 0;
          this.alive = true;

          // The bike is a Group containing: (a) the GLB model holder (populated asynchronously by setModel), and (b) the headlight rig built below.
          // Bike sits at scene origin; its visual lean is applied via group.rotation.z.
          this.group = new Group();
          this._modelHolder = new Group();
          this.group.add(this._modelHolder);

          // Headlight rig: lens disc + two additive glow billboards (fake flare) + two volumetric cones + a SpotLight. SpotLight casts no shadow; trees use custom shaders that don't read scene lights, so the beam lights the ground + bike + enemies — enough to sell the effect without bark/leaf shader integration.

          const headlightMat = new MeshBasicMaterial({
            color: 0xffffcc,
            transparent: true,
            depthWrite: false,
          });
          const headlight = new Mesh(new CircleGeometry(0.1, 16), headlightMat);
          headlight.position.set(0, 0.7, -1.0);
          headlight.rotation.y = Math.PI;
          this.group.add(headlight);
          this._headlightMat = headlightMat;

          // Glow halo: two stacked additive billboards behind the lens disc, each textured with a radial-gradient alpha so they read as soft bloom.
          const glowTex = Bike._makeGlowTexture();
          const glowInner = new Mesh(
            new PlaneGeometry(0.5, 0.5),
            new MeshBasicMaterial({
              map: glowTex,
              color: 0xffeebb,
              transparent: true,
              blending: AdditiveBlending,
              depthWrite: false,
            }),
          );
          glowInner.position.set(0, 0.31, -0.72);
          glowInner.renderOrder = 5;
          this.group.add(glowInner);
          this._glowInner = glowInner;

          const glowOuter = new Mesh(
            new PlaneGeometry(1.6, 1.6),
            new MeshBasicMaterial({
              map: glowTex,
              color: 0xffd680,
              transparent: true,
              blending: AdditiveBlending,
              depthWrite: false,
              opacity: 0.6,
            }),
          );
          glowOuter.position.set(0, 0.31, -0.71);
          glowOuter.renderOrder = 4;
          this.group.add(glowOuter);
          this._glowOuter = glowOuter;

          // Volumetric beam: TWO stacked additive cones. Inner cone (~3° half- angle) provides the sharp bright spine; outer (~11°, longer, soft) provides the halo. Single soft cone alone reads as a vague blob; the inner spine gives the beam structure.
          // Hollow ConeGeometry (open), apex at origin via translate, then rotated to align with -Z.
          const _makeBeamCone = (length, endRadius, segments) => {
            const g = new ConeGeometry(endRadius, length, segments, 1, true);
            g.translate(0, length / 2, 0);
            g.rotateX(Math.PI / 2);
            return g;
          };

          // Shader: bright at apex, fades along length AND fades at the radial "rim" of the cone (because the rim is, in volumetric terms, where light scatter is least dense). Edge-softening via grazing-angle dot hides the cone-surface silhouette so it reads as airborne glow rather than a piece of geometry.
          const _beamMaterial = (
            color,
            intensity,
            length,
            headPower,
            edgePower,
          ) =>
            new ShaderMaterial({
              uniforms: {
                uColor: { value: new Color(color) },
                uIntensity: { value: 0.0 },
                uLen: { value: length },
                uHeadPow: { value: headPower }, // higher = more concentrated near apex
                uEdgePow: { value: edgePower }, // higher = sharper grazing fade
              },
              vertexShader: `
                varying vec3 vLocal;
                varying vec3 vViewDir;
                void main() {
                  vLocal = position;
                  vec4 wp = modelMatrix * vec4(position, 1.0);
                  vViewDir = normalize(cameraPosition - wp.xyz);
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
              `,
              fragmentShader: `
                uniform vec3 uColor;
                uniform float uIntensity;
                uniform float uLen;
                uniform float uHeadPow;
                uniform float uEdgePow;
                varying vec3 vLocal;
                varying vec3 vViewDir;
                void main() {
                  // Length fade: how far down the cone (0 = apex, 1 = open end).
                  float t = clamp(-vLocal.z / uLen, 0.0, 1.0);

                  // Bright near the apex, drops off — controllable curve via uHeadPow.
                  float lengthFade = pow(1.0 - t, uHeadPow);

                  // Grazing-angle fade: hides the cone's geometric silhouette by making fragments dim when seen edge-on. The cone's outward normal at any point is purely radial in local XY (no Z), so I build a synthetic radial normal rather than trusting per-vertex.
                  vec3 outwardNormal = normalize(vec3(vLocal.x, vLocal.y, 0.0));
                  float edgeFade = pow(abs(dot(outwardNormal, vViewDir)), uEdgePow);
                  // Don't fully zero-out the beam along its length, but near the apex I still apply a small fade to avoid camera-inside-beam artifacts.
                  edgeFade = mix(1.0, edgeFade, t);

                  float nearFade = smoothstep(0.02, 0.12, t);
                  float a = lengthFade * edgeFade * nearFade * uIntensity;
                  if (a < 0.003) discard;
                  // Add a subtle warm-up at the apex so the brightest bit slightly shifts toward white rather than straight color.
                  vec3 col = mix(uColor, vec3(1.0), lengthFade * 0.35);
                  gl_FragColor = vec4(col, a);
                }
              `,
              transparent: true,
              depthWrite: false,
              blending: AdditiveBlending,
              side: FrontSide,
            });

          // ---- Outer halo: long, wide, soft ----
          const OUTER_LEN = 30;
          const OUTER_R = 5.5;
          const beamOuterMat = _beamMaterial(
            0xffd680,
            0.0,
            OUTER_LEN,
            1.6,
            1.4,
          );
          const beamOuter = new Mesh(
            _makeBeamCone(OUTER_LEN, OUTER_R, 28),
            beamOuterMat,
          );
          // Slight forward offset so the beam doesn't start exactly at the camera or clip into the bike geometry. Prevents "engulfing" artifacts when the camera is near the light source (common volumetric beam trick).
          beamOuter.position.set(0, 0.4, -0.7);
          beamOuter.rotation.x = -0.04; // tiny downward tilt
          beamOuter.frustumCulled = false;
          beamOuter.renderOrder = 5;
          this.group.add(beamOuter);
          this._beamOuter = beamOuter;

          // ---- Inner core: short, narrow, bright ----
          // Sits inside the outer halo; gives the "sharp bright spine" of the beam.
          const INNER_LEN = 22;
          const INNER_R = 1.6;
          const beamInnerMat = _beamMaterial(
            0xfff7d6,
            0.0,
            INNER_LEN,
            1.0,
            0.9,
          );
          const beamInner = new Mesh(
            _makeBeamCone(INNER_LEN, INNER_R, 24),
            beamInnerMat,
          );
          beamInner.position.set(0, 0.4, -0.7);
          beamInner.rotation.x = -0.04;
          beamInner.frustumCulled = false;
          beamInner.renderOrder = 6;
          this.group.add(beamInner);
          this._beamInner = beamInner;

          // ------ SpotLight (illuminates the ground in the beam path) ------
          // The volumetric beam meshes above are the VISUAL only; this SpotLight is what actually contributes lighting to the ground, bike, and enemies. Construction shared with EnemyBike via attachBikeSpotlight (see helper for tuning rationale).
          this._headlightSpot = attachBikeSpotlight(this.group);

          // 1. Initialize steering offset
          this._lightTargetX = 0;

          // 2. Create 3D Reticle (Replaces CSS)
          const crossTex = new CanvasTexture(this._createCrosshairCanvas());
          const crossMat = new SpriteMaterial({
            map: crossTex,
            transparent: true,
            depthTest: false,
          });
          this._reticle = new Sprite(crossMat);
          this._reticle.scale.set(1.2, 1.2, 1);
          this.group.add(this._reticle);

          // Feedback timers (in seconds)
          this._reticleEffectTimer = 0;
          this._reticleColorBase = new Color(0xffffff);
          this._reticleColorFire = new Color(0xff0000);
          this._reticleColorHit = new Color(0x00ff00);

          // Defaults: full headlight off (day mode). Switched by setNightMode().
          this._isNight = false;
          this.setNightMode(false);

          // Cockpit HUD overlay — speedometer, throttle, lifetime ODO.
          // Parented to the bike's local group so it bobs and leans with the bike. Lifetime odometer is owned by Game (passed in each update); the HUD is purely a renderer.
          this.hud = new BikeHUD(this.group);

          // Cached forward vector (bike points down -Z)
          this._forward = new Vector3(0, 0, -1);
        }

        /**
         * Switch headlight intensity for day/night. Called from the day-night orchestrator (Skybox.onTimeOfDayChanged in the Game class).
         */
        setNightMode(isNight) {
          this._isNight = isNight;
          if (isNight) {
            this._headlightMat.color.setHex(0xffffff);
            this._headlightMat.opacity = 1.0;
            this._glowInner.material.opacity = 1.0;
            this._glowInner.visible = true;
            this._glowOuter.material.opacity = 0.65;
            this._glowOuter.visible = true;
            this._headlightSpot.intensity = 9;
            this._beamInner.visible = true;
            this._beamInner.material.uniforms.uIntensity.value = 1.6;
            this._beamOuter.visible = true;
            this._beamOuter.material.uniforms.uIntensity.value = 0.45;
          } else {
            this._headlightMat.color.setHex(0xffffaa);
            this._headlightMat.opacity = 0.85;
            this._glowInner.visible = false;
            this._glowOuter.visible = false;
            this._headlightSpot.intensity = 0;
            this._beamInner.visible = false;
            this._beamInner.material.uniforms.uIntensity.value = 0;
            this._beamOuter.visible = false;
            this._beamOuter.material.uniforms.uIntensity.value = 0;
          }
        }

        _createCrosshairCanvas() {
          const canvas = document.createElement("canvas");
          canvas.width = 64;
          canvas.height = 64;
          const ctx = canvas.getContext("2d");
          ctx.strokeStyle = "#ff5050";
          ctx.lineWidth = 4;
          // Draw Circle
          ctx.beginPath();
          ctx.arc(32, 32, 20, 0, Math.PI * 2);
          ctx.stroke();
          // Draw Center Dot
          ctx.fillStyle = "#ff5050";
          ctx.fillRect(30, 30, 4, 4);
          return canvas;
        }

        /**
         * Build a radial-gradient alpha texture once and cache on the class.
         * Used by the glow halo billboards.
         */
        static _makeGlowTexture() {
          if (Bike._cachedGlowTex) return Bike._cachedGlowTex;
          const size = 128;
          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          const grad = ctx.createRadialGradient(
            size / 2,
            size / 2,
            0,
            size / 2,
            size / 2,
            size / 2,
          );
          grad.addColorStop(0.0, "rgba(255,255,255,1.0)");
          grad.addColorStop(0.25, "rgba(255,240,200,0.65)");
          grad.addColorStop(0.6, "rgba(255,200,100,0.18)");
          grad.addColorStop(1.0, "rgba(255,180, 60,0.0)");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, size, size);
          const tex = new CanvasTexture(canvas);
          tex.colorSpace = SRGBColorSpace;
          tex.minFilter = LinearFilter;
          tex.magFilter = LinearFilter;
          Bike._cachedGlowTex = tex;
          return tex;
        }

        /**
         * Per-frame update. Inputs is `{steer:[-1,1], throttle:[-1,1], fire:bool}`.
         * Returns the bike's forward speed in m/s (used by camera / forest).
         */
        update(dt, inputs) {
          if (!this.alive) {
            // Slow down on death; bike falls over visually
            this.speed = Math.max(0, this.speed - 30 * dt);
            this.lean = lerp(
              this.lean,
              (Math.PI / 2) * Math.sign(this.lean || 1),
              4 * dt,
            );
            this.group.rotation.z = this.lean;
            return this.speed;
          }

          const C = CONFIG.BIKE;

          // ------ Throttle ------
          const t = inputs.throttle;
          if (t > 0) {
            this.speed += C.ACCEL * t * dt;
          } else if (t < 0) {
            this.speed += C.DECEL * t * dt; // negative t — decelerate
          } else {
            // Constant drag toward MIN (the bike never fully stops on its own unless the player brakes).
            if (this.speed > C.SPEED_MIN) this.speed -= C.DRAG * dt;
          }
          this.speed = clamp(this.speed, C.SPEED_MIN, C.SPEED_MAX);

          // ------ Steering (yaw-rate based) ------
          // Input drives the TARGET yaw rate; the actual yaw rate eases toward it
          const speedFraction =
            (this.speed - C.SPEED_MIN) / (C.SPEED_MAX - C.SPEED_MIN);
          const speedFactor =
            C.TURN_RATE_MIN_FACTOR +
            (1 - C.TURN_RATE_MIN_FACTOR) * clamp(speedFraction, 0, 1);

          const targetTurnRate = inputs.steer * C.TURN_RATE_MAX * speedFactor;
          const tk = 1 - Math.exp(-C.TURN_LERP * dt);
          this.turnRate += (targetTurnRate - this.turnRate) * tk;

          // Integrate heading
          this.heading += this.turnRate * dt;

          // ------ Forward motion along heading ------
          const fwdX = Math.sin(this.heading);
          const fwdZ = -Math.cos(this.heading);
          this.worldX += fwdX * this.speed * dt;
          this.worldZ += fwdZ * this.speed * dt;

          // ------ Visual lean ------
          this.targetLean =
            -clamp(this.turnRate / C.TURN_RATE_MAX, -1, 1) * C.LEAN_MAX;
          this.lean = lerp(this.lean, this.targetLean, C.LEAN_LERP * dt);

          // Apply visuals to mesh
          this.group.position.set(0, 0, 0);
          this.group.rotation.z = this.lean;

          // Headlight + reticle aiming: turnRate → horizontal offset at the 30m look point. Magnitude 8.0 → ~15° aim sweep at full cornering. Lights and reticle share the same target so they always agree.
          const turnIntensity = this.turnRate / C.TURN_RATE_MAX;
          this._lightTargetX = turnIntensity * 8.0;

          // 2. Lock Reticle and Light Target to the EXACT same spot
          const targetY = 0.4;
          const targetZ = -30.0;

          this._headlightSpot.target.position.set(
            this._lightTargetX,
            targetY,
            targetZ,
          );
          this._reticle.position.set(this._lightTargetX, targetY, targetZ);

          // 3. Update visual beam rotations to match this geometry
          const beamAngle = Math.atan2(this._lightTargetX, Math.abs(targetZ));
          this._beamInner.rotation.y = -beamAngle;
          this._beamOuter.rotation.y = -beamAngle;

          // 5. APPLY POSITION to the Lens Glow (Subtle detail)
          this._glowInner.position.x = inputs.steer * 0.05;
          this._glowOuter.position.x = inputs.steer * 0.05;

          // Update Reticle Visual State (Feedback)
          if (this._reticleEffectTimer > 0) {
            this._reticleEffectTimer -= dt;
            if (this._reticleEffectTimer <= 0) {
              this._reticle.scale.set(1.2, 1.2, 1);
              this._reticle.material.color.copy(this._reticleColorBase);
            }
          }

          // ------ Fire cooldown ------
          if (this.fireCooldown > 0) this.fireCooldown -= dt;

          return this.speed;
        }

        /**
         * Swap in a GLTF subtree as the bike's visible body. Called once when the shared GLB resolves. The subtree is reparented (caller has already cloned it if needed); the model holder applies SCALE, Y_OFFSET, and HEADING_CORRECTION from CONFIG.PLAYER_MODEL.
         *
         * @param {THREE.Object3D} subtree
         */
        setModel(subtree) {
          // Clear out anything previously in the holder (idempotent).
          while (this._modelHolder.children.length > 0) {
            this._modelHolder.remove(this._modelHolder.children[0]);
          }
          // Recenter on (0,0,0) and apply axis correction BEFORE parenting.
          centerBikeSubtree(subtree);

          const cfg = CONFIG.PLAYER_MODEL;
          this._modelHolder.add(subtree);
          this._modelHolder.scale.setScalar(cfg.SCALE);
          this._modelHolder.position.y = cfg.Y_OFFSET;
          this._modelHolder.rotation.y = cfg.HEADING_CORRECTION;

          // Apply the player's fixed identity color to Mat_Body. Same material-cloning trick as enemy randomization: find the shared "Mat_Body" material, clone it once, set the color, and reassign per-mesh so other bikes using the same source material aren't repainted.
          let bodyMaterial = null;
          subtree.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = false;
              const mats = Array.isArray(node.material)
                ? node.material
                : [node.material];
              for (const mat of mats) {
                if (!mat) continue;
                mat.side = FrontSide;
                if (mat.name === "Mat_Body") {
                  if (!bodyMaterial) {
                    bodyMaterial = mat.clone();
                    bodyMaterial.color.setHex(cfg.BODY_COLOR);
                  }
                  if (Array.isArray(node.material)) {
                    const idx = node.material.indexOf(mat);
                    if (idx !== -1) node.material[idx] = bodyMaterial;
                  } else {
                    node.material = bodyMaterial;
                  }
                }
              }
            }
          });
        }

        /**
         * Returns true if a fire input would actually emit a bullet (cooldown ok).
         * Also resets the cooldown.
         */
        tryFire() {
          if (!this.alive || this.fireCooldown > 0) return false;
          this.fireCooldown = CONFIG.BULLET.FIRE_COOLDOWN;
          return true;
        }

        /** Get world-space muzzle position. Output written to `out`. */
        getMuzzle(out) {
          out.set(
            this.group.position.x,
            CONFIG.BULLET.MUZZLE_HEIGHT,
            this.group.position.z + CONFIG.BULLET.MUZZLE_FORWARD * -1,
          );
          // Convert "local" muzzle Z into world Z by adding the streaming offset.
          // Bullets live in WORLD coordinates: their Z anchors to the bike's worldZ.
          out.z = -CONFIG.BULLET.MUZZLE_FORWARD; // local-z forward of bike-at-origin
          return out;
        }

        kill() {
          if (!this.alive) return;
          this.alive = false;
          // Hard crash: come to a complete stop in this same frame. Otherwise theforest, sky, and ground texture (all driven by `speed` or `worldX/Z` delta) keep streaming past for ~1-2 seconds while the bike visually appears wrecked — a jarring perceptual disconnect ("I crashed but everything's still moving").
          this.speed = 0;
          this.turnRate = 0;
          // Choose a lean direction for the death animation
          if (this.lean === 0) this.lean = 0.001;
        }
      }

      /* ============================================================================
       * GLTF MODEL LOADER (shared between Bike and EnemyBike).
       * Returns gltf.scene as the bike root in a 1-element array. Caller clones for each consumer.
       * ============================================================================ */
      function loadBikeModelsAsync(url) {
        return new Promise((resolve, reject) => {
          gltfLoader.load(
            url,
            (gltf) => {
              if (!gltf.scene) {
                reject(new Error("No scene in " + url));
                return;
              }
              resolve([gltf.scene]);
            },
            undefined,
            (err) => {
              console.error("Bike model failed to load:", url, err);
              reject(err);
            },
          );
        });
      }

      /**
       * Load a cosmetic GLB (no bike-specific subtree descent) and return its root Object3D. Resolves to null on failure so the game keeps working without it — useful for the player arms and the enemy rider, both of which are eye-candy.
       *
       * Caller is responsible for cloning the returned scene if it needs multiple instances (e.g. one rider per enemy bike).
       */
      function loadGlbAsync(url) {
        return new Promise((resolve) => {
          gltfLoader.load(
            url,
            (gltf) => resolve(gltf.scene),
            undefined,
            (err) => {
              console.warn("GLB failed to load:", url, err);
              resolve(null);
            },
          );
        });
      }

      /**
       * Hue-rotate the rider suit via GLSL fragment hook.
       * The rider GLB has one textured material; a plain material.color tint would also recolor helmet and skin.
       * I instead recolor only saturated mid-tones via an HSV mask.
       * One compiled shader serves all riders (stable cache key); per-rider variation lives in the uniforms.
       *
       * @param {THREE.Material} material  Per-rider clone.
       * @param {number} hueShift  [0,1) offset added to suit hue.
       * @param {boolean} blackSuit  If true, desaturate the suit to near-black instead of shifting hue.
       */
      function applyRiderSuitTint(material, hueShift, blackSuit) {
        material.onBeforeCompile = (shader) => {
          shader.uniforms.uHueShift = { value: hueShift };
          shader.uniforms.uBlackSuit = { value: blackSuit ? 1.0 : 0.0 };

          // Inject HSV helpers + uniforms after the common include.
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <common>",
            `#include <common>
            uniform float uHueShift;
            uniform float uBlackSuit;
            vec3 _rgb2hsv(vec3 c) {
              vec4 K = vec4(0.0, -1.0/3.0, 2.0/3.0, -1.0);
              vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
              vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
              float d = q.x - min(q.w, q.y);
              float e = 1.0e-10;
              return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + e)), d / (q.x + e), q.x);
            }
            vec3 _hsv2rgb(vec3 c) {
              vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
              vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
              return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
            }`,
          );

          // After the texture has been mixed into diffuseColor, build a mask: only highly-saturated mid-tones get recolored.
          // Skin is low-sat (~0.2), helmet is low-value (~0.1), both fall below the smoothstep thresholds.
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <map_fragment>",
            `#include <map_fragment>
            {
              vec3 _hsv = _rgb2hsv(diffuseColor.rgb);
              float _mask =
                smoothstep(0.30, 0.45, _hsv.y) *
                smoothstep(0.08, 0.20, _hsv.z);
              if (uBlackSuit > 0.5) {
                vec3 _black = vec3(_hsv.x, 0.0, _hsv.z * 0.15);
                _hsv = mix(_hsv, _black, _mask);
              } else {
                _hsv.x = fract(_hsv.x + uHueShift * _mask);
              }
              diffuseColor.rgb = _hsv2rgb(_hsv);
            }`,
          );
        };
        // Stable cache key → all riders share one compiled program, distinguished only by their uniforms. Without this Three.js compiles a fresh program per material.
        material.customProgramCacheKey = () => "rider_suit_tint_v1";
        material.needsUpdate = true;
      }

      /**
       * Recenter + axis-correct a GLB bike subtree so wheels rest on Y=0 and centroid XZ is at origin. Axis correction (CONFIG.BIKE_AXIS_FIX) applied first, then AABB-based recenter on the corrected pose.
       */
      function centerBikeSubtree(subtree) {
        // Hide the rider mesh that ships baked into the Sketchfab bike.
        // Must run BEFORE the AABB pass so recenter ignores rider volume.
        subtree.traverse((node) => {
          if (node.isMesh && node.name && node.name.includes("Jack")) {
            node.visible = false;
          }
        });

        const fix = CONFIG.BIKE_AXIS_FIX;
        if (fix.PITCH) subtree.rotateX(fix.PITCH);
        if (fix.ROLL) subtree.rotateZ(fix.ROLL);

        subtree.updateMatrixWorld(true);
        const box = new Box3().setFromObject(subtree);
        if (box.isEmpty()) return;
        const center = new Vector3();
        box.getCenter(center);
        subtree.position.x -= center.x;
        subtree.position.y -= box.min.y;
        subtree.position.z -= center.z;
      }

      /**
      /**
       * Attach a forward-pointing SpotLight parented to a bike's group.
       * Used by player and enemies for night illumination. The player's class adds visible beam rig on top (lens, halos, volumetric cones, reticle); enemies get just the light.
       *
       * @param {THREE.Group} group  Bike's local group (origin = bike center, -Z forward).
       * @returns {THREE.SpotLight}  Returned so setNightMode can toggle intensity.
       */
      function attachBikeSpotlight(group) {
        const spot = new SpotLight(
          0xffeebb, // warm white
          0, // intensity (set by setNightMode)
          60, // distance
          MathUtils.degToRad(26),
          0.7, // penumbra
          0.4, // decay (gentle; physically-correct 2 reads too dim here)
        );
        spot.position.set(0, 0.4, -0.7);
        spot.target.position.set(0, -0.4, -30.0);
        spot.castShadow = false;
        group.add(spot);
        group.add(spot.target);
        return spot;
      }

      /* ============================================================================
       * ENEMY BIKES
       * Two AI riders. Same 2D pose model as the player (worldX, worldZ, heading, turnRate).
       * Per-frame AI:
       *   1. Compute a target position: lead distance ahead of player + sinusoidal
       *      perpendicular weave.
       *   2. Steer turnRate toward the bearing of that target.
       *   3. Integrate heading, advance forward at speed.
       * Mesh loaded as a clone of the shared bike GLB.
       * ============================================================================ */
      class EnemyBike {
        constructor(weaveSeed) {
          this.alive = true;

          // World pose — same conventions as Bike
          this.worldX = 0;
          this.worldZ = 0;
          this.heading = 0;
          this.turnRate = 0;

          // Visual lean (derived from turnRate, lerped)
          this.lean = 0;

          // AI parameters: each enemy weaves with its own frequency / amplitude / phase to keep the two bikes from synchronising.
          this.speed = CONFIG.ENEMY.SPEED;
          this.weaveSeed = weaveSeed;
          this.weaveAmplitude =
            CONFIG.ENEMY.WEAVE_AMPLITUDE * (0.6 + Math.random() * 0.7);
          this.weaveFreq =
            CONFIG.ENEMY.WEAVE_FREQ_MIN +
            Math.random() *
              (CONFIG.ENEMY.WEAVE_FREQ_MAX - CONFIG.ENEMY.WEAVE_FREQ_MIN);
          this.weavePhase = Math.random() * Math.PI * 2;
          this.weaveOffset = (Math.random() * 2 - 1) * 4; // base lateral offset

          // Audio: spatial engine loop id. Started in respawn(), stopped when the bike is killed. Stays null while inactive.
          this._engineId = null;

          // Time spent trailing the player. Used to gate the auto-slingshot — see Game.update enemy loop. Reset to 0 each frame the enemy is in front of the player.
          this._behindTimer = 0;

          // Cloned-once body material (lazy on first randomizeBodyColor).
          // Reused on every subsequent respawn so materials don't leak.
          this._bodyMatClone = null;

          // Mesh group — populated by setModel() once the GLB loads. Until then the enemy is invisible; the AI still updates its position so when the mesh arrives it slots in seamlessly.
          this.group = new Group();
          this._modelHolder = new Group();
          this.group.add(this._modelHolder);
          this.group.visible = false; // hidden until model loads

          // Headlight spotlight — same construction as the player's. Adds a real lighting cone in front of the AI bike so it illuminates ground / nearby trees at night, completing the "everyone has headlights" effect. No volumetric visual beam (player only).
          this._headlightSpot = attachBikeSpotlight(this.group);

          // Bounding sphere for bullet collision (in WORLD coordinates)
          this.boundsCenter = new Vector3();
          this.boundsRadius = CONFIG.ENEMY.HIT_RADIUS;
        }

        /**
