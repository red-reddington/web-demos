<!-- https://codepen.io/the-red-reddington/full/ZYBLxdp -->
<!-- https://discourse.threejs.org/t/deathchase-3d-three-js-homage-to-the-1983-zx-spectrum-game-classic/91664 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      Deathchase 3D: Three.js homage to the 1983 ZX Spectrum game classic
    </title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: "SF Mono", "Fira Code", Menlo, monospace;
        color: #e0e0e0;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      #container {
        position: absolute;
        inset: 0;
      }
      #joy,
      #firePad {
        position: absolute;
        z-index: 9;
        touch-action: none;
        display: none;
      }
      /* #joy is a small box around the joystick. */
      #joy {
        left: min(10px, 10%);
        bottom: min(120px, 15%);
        width: 180px;
        height: 180px;
      }
      /* firePad covers the entire screen at a lower z-index. #joy sits on top in its corner; taps outside that small area fall through to firePad → fire. */
      #firePad {
        inset: 0;
        z-index: 8;
      }

      #hud {
        position: absolute;
        left: 14px;
        top: 12px;
        z-index: 10;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #fff;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      #hud .v {
        color: #f9a86f;
        font-weight: bold;
      }

      /* Hit-flash overlay - red vignette when player crashes */
      #flash {
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 30%,
          rgba(255, 0, 0, 0.6) 100%
        );
        opacity: 0;
        transition: opacity 0.4s ease-out;
      }
      #flash.on {
        opacity: 1;
      }

      /* Floating "+1000" / "BONUS: $2500" popups */
      .popup {
        position: absolute;
        left: 50%;
        z-index: 11;
        pointer-events: none;
        font-size: 20px;
        font-weight: bold;
        color: #ffd000;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
        text-align: center;
        white-space: nowrap;
        transform: translateX(-50%);
        animation: popup 1.2s ease-out forwards;
      }
      @keyframes popup {
        0% {
          opacity: 0;
          transform: translate(-50%, 0) scale(0.6);
        }
        20% {
          opacity: 1;
          transform: translate(-50%, -20px) scale(1.1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -80px) scale(1);
        }
      }

      /* Stage banner - "STAGE 2 - NIGHT PATROL" */
      #banner {
        position: absolute;
        left: 50%;
        top: 35%;
        transform: translate(-50%, -50%);
        z-index: 11;
        pointer-events: none;
        font-size: 36px;
        font-weight: bold;
        color: #fff;
        text-align: center;
        text-shadow:
          0 0 12px #000,
          0 0 24px rgba(255, 80, 80, 0.6);
        letter-spacing: 4px;
        opacity: 0;
        transition: opacity 0.6s;
      }
      #banner.show {
        opacity: 1;
      }
      #banner small {
        display: block;
        font-size: 14px;
        color: #ff8080;
        letter-spacing: 8px;
        margin-top: 8px;
      }

      /* Game-over overlay */
      #gameover {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }
      #gameover.show {
        display: flex;
      }
      #gameover h1 {
        margin: 0;
        font-size: 48px;
        color: #ff3030;
        letter-spacing: 6px;
      }
      #gameover p {
        margin: 0;
        font-size: 18px;
        color: #aaa;
      }
      #gameover button {
        margin-top: 14px;
        padding: 12px 28px;
        background: #ff3030;
        color: #000;
        border: 0;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 2px;
        cursor: pointer;
        border-radius: 4px;
      }
      #gameover button:hover {
        background: #ff5050;
      }

      /* Pause overlay - shown when game.paused is true */
      #pauseOverlay {
        position: absolute;
        inset: 0;
        z-index: 13;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(3px);
        flex-direction: column;
        gap: 14px;
        text-align: center;
        pointer-events: none;
      }
      #pauseOverlay.show {
        display: flex;
        pointer-events: auto;
        cursor: pointer;
      }
      #pauseOverlay h1 {
        margin: 0;
        font-size: 56px;
        color: #fff;
        letter-spacing: 10px;
      }
      #pauseOverlay p {
        margin: 0;
        font-size: 14px;
        color: #aaa;
        letter-spacing: 4px;
      }
      .overlayBrand {
        font-size: 11px;
        letter-spacing: 6px;
        color: #ff5050;
        opacity: 0.85;
        margin-bottom: -6px;
      }
      #pauseOverlay b {
        color: #ff5050;
      }

      /* Click-to-start splash. Removed from the DOM after the first click (which also resumes the AudioContext). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 16px;
        text-align: center;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0.85) 0%,
          rgba(0, 0, 0, 0.98) 100%
        );
        cursor: pointer;
        transition: opacity 0.5s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splashBrand {
        font-size: 56px;
        font-weight: bold;
        letter-spacing: 10px;
        color: #ff5050;
        text-shadow: 0 0 24px rgba(255, 80, 80, 0.4);
      }
      #splash .splashTagline {
        font-size: 12px;
        letter-spacing: 4px;
        color: #888;
      }
      #splash .splashByline {
        font-size: 11px;
        letter-spacing: 2px;
        color: #666;
        font-style: italic;
        margin-top: -8px;
      }
      /* Narrow viewports: scale the brand down + tighten letter-spacing so "DEATHCHASE 3D" and the tagline fit on one line on iPhones. */
      @media (max-width: 480px) {
        #splash .splashBrand {
          font-size: 36px;
          letter-spacing: 6px;
        }
        #splash .splashTagline {
          font-size: 10px;
          letter-spacing: 2px;
        }
      }
      #splash .splashCTA {
        margin-top: 32px;
        font-size: 14px;
        letter-spacing: 6px;
        color: #fff;
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      /* Top-right icon strip (right-to-left): mute | ? | fullscreen. */
      #helpBtn,
      #muteBtn {
        position: fixed;
        top: 10px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        transition: all 0.15s ease;
        padding: 0;
        z-index: 11;
      }
      #muteBtn {
        right: 10px;
      }
      #helpBtn {
        right: 42px;
      }
      /* Muted state */
      #muteIcon .slash {
        opacity: 0;
      }
      #muteBtn.muted #muteIcon .wave {
        opacity: 0.15;
      }
      #muteBtn.muted #muteIcon .slash {
        opacity: 1;
      }
      #muteBtn.muted #muteIcon {
        color: #c44;
      }

      /* Controls flyout — text only, dark backdrop only when visible */
      #helpPanel {
        position: fixed;
        top: 44px;
        right: 10px;
        z-index: 11;
        font-size: 11px;
        line-height: 1.7;
        color: #aaa;
        background: rgba(0, 0, 0, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 14px;
        border-radius: 6px;
        text-align: left;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition:
          opacity 0.18s ease-out,
          transform 0.18s ease-out;
      }
      #helpPanel.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
      #helpPanel b {
        color: #fff;
      }

      /* Debug stats (FPS + optional draw call / triangle / memory). Click to toggle expanded on desktop. Touch-only devices stay minimal so the fire pad isn't blocked. */
      #stats {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        font-size: 10px;
        line-height: 1.3;
        color: #fff;
        text-align: right;
        white-space: normal;
        mix-blend-mode: difference;
        cursor: pointer;
        user-select: none;
        padding: 2px 4px;
      }
      /* Portrait: keep `\n` line breaks so the extra metrics stack vertically. Landscape collapses them so the stats read as a single line — saves vertical space on wide displays. */
      @media (orientation: portrait) {
        #stats {
          white-space: pre-line;
        }
      }
      #stats .extra {
        display: none;
      }
      #stats.expanded .extra {
        display: block;
      }

      /* Top-right icons: fullscreen, help, mute.  */
      #fullscreenBtn,
      #helpBtn,
      #muteBtn {
        color: #fff;
        mix-blend-mode: difference;
      }
      #fullscreenBtn {
        position: fixed;
        top: 10px;
        right: 74px;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        vertical-align: middle;
        background: none;
        border: none;
        cursor: pointer;
        transition: all 0.15s ease;
        padding: 0;
      }
      #fullscreenBtn:hover,
      #helpBtn:hover,
      #muteBtn:hover {
        transform: scale(1.15);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
          "nipplejs": "https://cdn.jsdelivr.net/npm/nipplejs@1.0.1/+esm",
          "howler": "https://cdn.jsdelivr.net/npm/howler@2.2.4/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div id="container"></div>

    <button id="fullscreenBtn" title="Toggle Fullscreen (Alt+Enter)">
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="3 9 3 3 9 3"></polyline>
        <polyline points="21 9 21 3 15 3"></polyline>
        <polyline points="3 15 3 21 9 21"></polyline>
        <polyline points="21 15 21 21 15 21"></polyline>
      </svg>
    </button>

    <!-- Mute toggle. Persisted via localStorage. -->
    <button id="muteBtn" title="Mute (M)">
      <svg
        id="muteIcon"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" class="wave wave-far"></path>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" class="wave wave-near"></path>
        <!-- Slash overlay. Hidden until the parent gets .muted. -->
        <line x1="14" y1="6" x2="22" y2="18" class="slash"></line>
        <line x1="22" y1="6" x2="14" y2="18" class="slash"></line>
      </svg>
    </button>

    <!-- Touch zones (touch-only devices). Hidden until Input detects mobile. #joy hosts the nipplejs static joystick (lower-left, steer + throttle); #firePad covers the right half for tap-to-fire. Two independent zones so the player can drive and shoot simultaneously. -->
    <div id="joy"></div>
    <div id="firePad"></div>

    <!-- Score: floating text in the top-left -->
    <div id="hud">SCORE <span class="v" id="hScore">$0</span></div>

    <!-- Help icon (?). Hover or tap to reveal the controls panel -->
    <button id="helpBtn" title="Controls">
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <div id="helpPanel">
      <b>A/D</b> or <b>←/→</b> &nbsp;steer<br />
      <b>W/S</b> or <b>↑/↓</b> &nbsp;throttle<br />
      <b>SPACE</b> &nbsp;fire<br />
      <b>ESC</b> &nbsp;pause
    </div>

    <div id="flash"></div>
    <div id="banner"></div>

    <div id="pauseOverlay">
      <div class="overlayBrand">DEATHCHASE 3D</div>
      <h1>PAUSED</h1>
      <!-- Text is swapped on touch-only devices to "tap to resume" by Input. -->
      <p id="pauseHint">press <b>ESC</b> or click to resume</p>
    </div>

    <div id="gameover">
      <div class="overlayBrand">DEATHCHASE 3D</div>
      <h1 id="goTitle">GAME OVER</h1>
      <p id="goSub">FINAL SCORE: $0</p>
      <button onclick="location.reload()">RESTART</button>
    </div>

    <div id="stats" title="click for extra stats">
      <span id="statsFps">— fps</span
      ><span class="extra" id="statsExtra"></span>
    </div>

    <!-- Click-to-start splash. Required for WebAudio: browsers suspend AudioContext until a user gesture, so I gate the whole game on a deliberate pointerdown -->
    <div id="splash">
      <div class="splashBrand">DEATHCHASE 3D</div>
      <div class="splashTagline">A 1983 ZX SPECTRUM CLASSIC, REIMAGINED</div>
      <div class="splashByline">by Red-Reddington</div>
      <div class="splashCTA" id="splashCTA">CLICK TO START</div>
    </div>

    <script type="module">
      /* ============================================================================
       * DEATHCHASE 3D — Three.js homage to the 1983 ZX Spectrum game by Mervyn Estcourt (Micromega).
       * ============================================================================
       */

      import {
        ACESFilmicToneMapping,
        AdditiveBlending,
        AmbientLight,
        BackSide,
        Box3,
        BoxGeometry,
        BufferAttribute,
        BufferGeometry,
        CanvasTexture,
        CircleGeometry,
        Color,
        ConeGeometry,
        CylinderGeometry,
        DirectionalLight,
        DoubleSide,
        DynamicDrawUsage,
        Euler,
        FrontSide,
        Group,
        HemisphereLight,
        InstancedBufferAttribute,
        InstancedBufferGeometry,
        InstancedMesh,
        LinearFilter,
        LinearMipmapLinearFilter,
        Material,
        MathUtils,
        Matrix4,
        Mesh,
        MeshBasicMaterial,
        MeshStandardMaterial,
        NoColorSpace,
        Object3D,
        PCFShadowMap,
        PerspectiveCamera,
        PlaneGeometry,
        Points,
        Quaternion,
        RepeatWrapping,
        Scene,
        ShaderMaterial,
        SpotLight,
        Sprite,
        SpriteMaterial,
        SRGBColorSpace,
        Timer,
        Vector2,
        Vector3,
        WebGLRenderer,
      } from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import nipplejs from "nipplejs";
      import { Howl, Howler } from "howler";

      const dracoLoader = new DRACOLoader().setDecoderPath(
        "https://www.gstatic.com/draco/v1/decoders/",
      );

      const ktx2Loader = new KTX2Loader().setTranscoderPath(
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/libs/basis/",
      );

      const gltfLoader = new GLTFLoader()
        .setDRACOLoader(dracoLoader)
        .setKTX2Loader(ktx2Loader)
        .setMeshoptDecoder(MeshoptDecoder);

      function attachKTX2Renderer(renderer) {
        ktx2Loader.detectSupport(renderer);
      }

      /* ============================================================================
       * CONFIG
       * ============================================================================ */
      const CONFIG = {
        // Prepended to every GLB / MP3 path. Leave empty for same-origin (files served alongside this HTML). Set to a CDN/host URL with trailing slash (e.g. "https://cdn.example.com/deathchase/") to serve assets remotely. Applied via assetURL() helper.
        ASSET_BASE:
          "https://raw.githubusercontent.com/red-reddington/web-demos/main/deathchase-3d/",

        // ------ World / camera ------
        WORLD: {
          // Sized to match fog far (~200m) so recycled trees land inside the visible band, none wasted in unrendered fog.
          FOREST_RADIUS: 180,
          TREE_COUNT_BASE: 100,
          TREE_COUNT_PER_STAGE: 25,
          TREE_COUNT_MAX: 280,
        },

        CAMERA: {
          FOV: 60,
          NEAR: 0.1,
          FAR: 1500,
          // Chase offsets relative to the bike at scene origin facing -Z.
          HEIGHT: 0.8,
          BACK: 0.09,
          LOOK_AHEAD: 25,
          LOOK_HEIGHT: 0.8,
        },

        // ------ Bike / player ------
        BIKE: {
          SPEED_MIN: 8,
          SPEED_MAX: 35,
          SPEED_INIT: 18,
          ACCEL: 8,
          DECEL: 18,
          DRAG: 3,
          TURN_RATE_MAX: 1.0,
          TURN_RATE_MIN_FACTOR: 0.35,
          TURN_LERP: 5,
          LEAN_MAX: 0.5,
          LEAN_LERP: 7,
        },

        // Player bike. Fixed red. Enemies exclude this hue range when randomizing.
        PLAYER_MODEL: {
          SCALE: 1.0,
          Y_OFFSET: -0.03,
          HEADING_CORRECTION: -Math.PI,
          BODY_COLOR: 0xc83232,
        },

        // Cockpit HUD overlay — small lit-LCD plane flush with the bike's dashboard bezel. Material uses polygonOffset to win z-fighting against the bezel surface.
        HUD: {
          POS: { x: 0, y: 0.658, z: -0.264 },
          TILT_X: -0.75,
          WIDTH: 0.066,
          HEIGHT: 0.054,
          REDRAW_HZ: 10,
        },

        // Axis correction applied to GLB bike subtrees before recentering
        BIKE_AXIS_FIX: {
          PITCH: 0, // X rotation
          ROLL: 0, // Z rotation
        },

        // Ortho shadow camera offset by FRUSTUM_FORWARD along -Z so resolution lands on the visible ground ahead of the bike.
        SHADOW: {
          MAP_SIZE: 2048,
          HALF_WIDTH: 22,
          HALF_HEIGHT: 32,
          FRUSTUM_FORWARD: 18,
        },

        // ------ Enemy bikes ------
        ENEMY: {
          COUNT_PER_STAGE: 2,
          SPEED: 26, // m/s base (stage 1), slightly under player max
          SPEED_VAR: 3,
          // Per-stage scaling. Both clamp at their CAP so difficulty plateaus rather than becoming impossible.
          // Speed cap is BIKE.SPEED_MAX - SPEED_CHASE_HEADROOM so the player can always catch up.
          SPEED_PER_STAGE: 0.8,
          SPEED_CHASE_HEADROOM: 3, // m/s gap below player max
          WEAVE_AMPLITUDE: 4.0,
          WEAVE_AMP_PER_STAGE: 0.4,
          WEAVE_AMP_CAP: 8.0,
          // Lead distance ahead of the bike at spawn. Tuned so the chase distance is meaningful (player must close to fire effectively) but enemies aren't so far they vanish into fog.
          LEAD_DISTANCE_MIN: 90,
          LEAD_DISTANCE_MAX: 130,
          WEAVE_FREQ_MIN: 0.35,
          WEAVE_FREQ_MAX: 0.7,
          // Slower than player's max so AI tracks gentle arcs rather than snapping to the player's heading.
          TURN_RATE_MAX: 0.6,
          // Tight collision radius rewards precise tracking aim over spray-in-direction.
          HIT_RADIUS: 0.5,
          MODEL: {
            URL: "assets/models/motorcycle_compressed.glb",
            SCALE: 1.0,
            Y_OFFSET: -0.031,
            HEADING_CORRECTION: -Math.PI,
          },
        },

        // Player arms — parented to bike.group so they bob/lean/turn with the bike.
        ARMS: {
          URL: "assets/models/arms_compressed.glb",
          POS: { x: 0, y: -0.149, z: -0.43 },
          ROT: { x: 0.55, y: -Math.PI, z: 0 },
          SCALE: 0.65,
        },

        // Enemy rider; cloned once per enemy bike so each can transform independently. Never attached to the player (cockpit view).
        RIDER: {
          URL: "assets/models/rider_compressed.glb",
          POS: { x: 0, y: 0.25, z: -0.05 },
          ROT: { x: 0, y: -Math.PI, z: 0 },
          SCALE: 1.0,
        },

        // ------ Bullets ------
        BULLET: {
          POOL: 16,
          // SPEED slow enough to force aim leading (100m shot at 26 m/s target = target moves ~24m before arrival)
          // MUST match BULLET_TRAILS.BULLET_SPEED so visual hit and logical hit arrive simultaneously.
          SPEED: 110,
          MAX_RANGE: 140, // covers all visible enemies (spawn at 90-130m)
          LIFETIME: 1.5,
          MUZZLE_FORWARD: 0.4,
          MUZZLE_HEIGHT: 0.5,
          FIRE_COOLDOWN: 0.18,
        },

        // ------ Visual subsystems ------
        FOREST: {
          TRUNK_LENGTH_MIN: 4,
          TRUNK_LENGTH_MAX: 7,
          TRUNK_RADIUS_MIN: 0.18,
          TRUNK_RADIUS_MAX: 0.35,
          BRANCH_LEVELS: 4,
          BRANCH_ANGLE: 0.55,
          BRANCH_ANGLE_VARIANCE: 0.25,
          LENGTH_FALLOFF: 0.68,
          RADIUS_FALLOFF: 0.55,
          BRANCHES_PER_NODE: 3,
          TWIST: 0.5,
          LEAF_SIZE: 0.8,
          LEAF_DENSITY: 4,
          LEAF_SPREAD: 0.8,
          BARK_COLOR: [0.24, 0.16, 0.09],
          BARK_DISTANT_TINT: [0.42, 0.45, 0.48],
          LEAF_HUE_MIN: 0.25,
          LEAF_HUE_MAX: 0.35,
          LEAF_SATURATION: 0.55,
          LEAF_LIGHTNESS_MIN: 0.35,
          LEAF_LIGHTNESS_MAX: 0.5,
          LEAF_TINGE_PERCENT: 0.15,
          LEAF_TINGE_YELLOW_CHANCE: 0.5,
          LEAF_TINGE_HUE_SHIFT: 0.03,
          LEAF_TINGE_SAT_SHIFT: 0.28,
          LEAF_TINGE_LIGHT_SHIFT: 0.09,
          LOD_FADE_START: 90,
          LOD_MAX_DISTANCE: 145,
          LOD_SWAY_DISTANCE: 50,
          LOD_SWAY_FADE_START: 30,
          ROOT_SPREAD_MIN: 0.2,
          ROOT_SPREAD_MAX: 0.6,
          ROOT_HEIGHT_MIN: 0.3,
          ROOT_HEIGHT_MAX: 0.6,
          ROOT_BUMPS_MIN: 2,
          ROOT_BUMPS_MAX: 5,
          BARK_SEGMENTS: 8,
          SUN_INTENSITY: 1.6,
          AMBIENT_INTENSITY: 0.7,
          EXPOSURE: 1.4,
          // Tree collision: extra padding around the trunk to account for branches / lower bough wedges. Total collide-radius = trunkRadius + COLLISION_RADIUS + bike's lateral half-width.
          COLLISION_RADIUS: 0.4,
        },

        BULLET_TRAILS: {
          ENABLED: true,
          MAX_TRAILS: 16,
          SEGMENTS_PER_TRAIL: 16,
          TRAIL_LENGTH: 18,
          LIFETIME_MS: 280,
          BULLET_SPEED: 110,
          WIDTH_HEAD: 0.04,
          WIDTH_TAIL: 0.14,
          MUZZLE_OFFSET_FORWARD: 0.6,
          MUZZLE_OFFSET_RIGHT: 0.0,
          MUZZLE_OFFSET_DOWN: -0.6,
          COLOR_HEAD: { r: 1.0, g: 0.95, b: 0.7, a: 1.0 },
          COLOR_MID: { r: 1.0, g: 0.5, b: 0.15, a: 0.55 },
          COLOR_TAIL: { r: 0.3, g: 0.1, b: 0.05, a: 0.05 },
        },

        PARTICLES: {
          SPARK_MAX: 240,
        },

        // ------ Game tuning ------
        GAME: {
          LIVES: 3,
          POINTS_PER_KILL: 1000,
        },
      };

      /* ============================================================================
       * HOT-PATH TEMPORARIES
       * Reusable objects for per-frame work. Subsystems use these as locals; never `new` an equivalent inside an update method.
       * ============================================================================ */
      const _v3a = new Vector3();
      const _quatA = new Quaternion();
      const _matA = new Matrix4();
      const _eulerA = new Euler();

      /* ============================================================================
       * UTILITIES
       * ============================================================================ */
      // Prevent iOS Safari double-tap zoom WITHOUT interfering with joystick movement, multi-touch, or normal taps.
      // Only cancel the SECOND tap of a rapid double-tap gesture.
      let __lastTouchEnd = 0;

      document.addEventListener(
        "touchend",
        (e) => {
          const now = performance.now();

          if (now - __lastTouchEnd <= 300) {
            e.preventDefault();
          }

          __lastTouchEnd = now;
        },
        { passive: false },
      );

      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const lerp = (a, b, t) => a + (b - a) * t;
      // Resolve an asset path against CONFIG.ASSET_BASE. Absolute URLs (http://, https://, //) pass through unchanged.
      const assetURL = (path) => {
        if (/^(https?:)?\/\//i.test(path)) return path;
        return CONFIG.ASSET_BASE + path;
      };
      // Touch-only check (no mouse-capable pointer). Used by splash, Input, pause hint — anywhere copy needs to swap based on device class.
      const isTouchOnly = () =>
        ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
        !matchMedia("(pointer:fine)").matches;
      // Deterministic PRNG (mulberry32). Forest uses this for repeatable layouts.
      function mulberry32(seed) {
        return () => {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      /* ============================================================================
       * FULLSCREEN
       * ============================================================================ */
      function toggleFullscreen() {
        const doc = document;
        const elem = document.documentElement;
        const isFs =
          doc.fullscreenElement ||
          doc.webkitFullscreenElement ||
          doc.msFullscreenElement ||
          doc.mozFullScreenElement;
        if (!isFs) {
          (
            elem.requestFullscreen ||
            elem.webkitRequestFullscreen ||
            elem.msRequestFullscreen ||
            elem.mozRequestFullScreen
          )?.call(elem);
        } else {
          (
            doc.exitFullscreen ||
            doc.webkitExitFullscreen ||
            doc.msExitFullscreen ||
            doc.mozCancelFullScreen
          )?.call(doc);
        }
      }

      function initFullscreen() {
        const elem = document.documentElement;
        const capable = !!(
          elem.requestFullscreen ||
          elem.webkitRequestFullscreen ||
          elem.msRequestFullscreen ||
          elem.mozRequestFullScreen
        );
        if (!capable) {
          document
            .getElementById("fullscreenBtn")
            ?.style.setProperty("display", "none");
          return;
        } else {
          document
            .getElementById("fullscreenBtn")
            .addEventListener("click", () => {
              toggleFullscreen();
            });
        }
      }

      /* ============================================================================
       * SOUND MANAGER — thin wrapper over Howler.
       * Manifest-driven, spatial via WebAudio listener, mute persisted.
       * Allocation-free hot paths. Audio context unlocked by splash click.
       * ============================================================================ */
      const SOUND_MANIFEST = {
        // Player photon zap.
        shot: { src: "assets/sounds/gunshot.mp3", vol: 0.6, rate: 1.0 },
        // Enemy kill BOOM. Spatial; aggressive falloff because transient sounds are perceived by peak level — half-volume still hits hard. Silent past 90m so distant kills don't dominate.
        explosion: {
          src: "assets/sounds/explosion.mp3",
          vol: 0.9,
          spatial: true,
          refDistance: 10,
          maxDistance: 90,
          rolloff: 1.0,
        },
        // Player crash. Head-centered.
        crash: { src: "assets/sounds/crash.mp3", vol: 0.85 },
        // Player engine: head-centered, pitch modulated by speed.
        engine_player: {
          src: "assets/sounds/engine_loop.mp3",
          vol: 0.45,
          loop: true,
        },
        // Enemy engine: per-instance spatial loop, position updated per frame.
        engine_enemy: {
          src: "assets/sounds/engine_loop.mp3",
          vol: 0.7,
          loop: true,
          spatial: true,
          refDistance: 15,
          maxDistance: 160,
          rolloff: 1.0,
        },
        // Stage-clear chime. Missing file → silent fallback.
        stage_clear: { src: "assets/sounds/stage_clear.mp3", vol: 0.7 },
        // Tree graze scrape. Mid-volume metal-on-wood scrape, much softer than crash. Optional — missing file falls back to silence.
        graze: { src: "assets/sounds/scrape.mp3", vol: 0.55 },
        // Splash intro voice. Plays once when the player clicks the splash. Missing file falls back to silence.
        intro_voice: { src: "assets/sounds/deathchase.mp3", vol: 0.9 },
      };

      class SoundManager {
        constructor() {
          this.sounds = {};
          this.isMuted = false;

          for (const key in SOUND_MANIFEST) {
            const cfg = SOUND_MANIFEST[key];
            const howl = new Howl({
              src: [assetURL(cfg.src)],
              volume: cfg.vol,
              loop: !!cfg.loop,
              rate: cfg.rate || 1.0,
              preload: true,
              onloaderror: () => {
                howl._broken = true;
              },
            });
            if (cfg.spatial) {
              // Linear distance model so far-off sources truly silence.
              // Inverse asymptotes near zero but stays audible, making distant explosions feel "always close" in a chase game.
              howl.pannerAttr({
                panningModel: "HRTF",
                distanceModel: "linear",
                refDistance: cfg.refDistance ?? 8,
                maxDistance: cfg.maxDistance ?? 100,
                rolloffFactor: cfg.rolloff ?? 1.0,
                coneInnerAngle: 360,
                coneOuterAngle: 360,
                coneOuterGain: 0,
              });
              howl._spatial = true;
            }
            this.sounds[key] = howl;
          }

          try {
            if (localStorage.getItem("dc_muted") === "1") {
              this.isMuted = true;
              Howler.mute(true);
            }
          } catch {}
        }

        // Listener lives in the SAME frame as sound source positions (world space). Camera always sits near scene origin while the bike roams world space — using camera.position would push every source past maxDistance.
        updateListener(x, y, z, fwdX, fwdZ) {
          Howler.pos(x, y, z);
          Howler.orientation(fwdX, 0, fwdZ, 0, 1, 0);
        }

        // Howler creates the PannerNode lazily on play; apply pos both immediately and on the 'play' event so both warm- and cold- panner cases are covered.
        _applyPos(s, id, x, y, z) {
          s.pos(x, y, z, id);
          s.once(
            "play",
            () => {
              try {
                s.pos(x, y, z, id);
              } catch {}
            },
            id,
          );
        }

        play(key) {
          if (this.isMuted) return null;
          const s = this.sounds[key];
          if (!s || s._broken) return null;
          try {
            return s.play();
          } catch {
            return null;
          }
        }

        playAt(key, x, y, z) {
          if (this.isMuted) return null;
          const s = this.sounds[key];
          if (!s || s._broken) return null;
          try {
            const id = s.play();
            if (s._spatial) this._applyPos(s, id, x, y, z);
            return id;
          } catch {
            return null;
          }
        }

        startLoop(key, x, y, z) {
          if (this.isMuted) return null;
          const s = this.sounds[key];
          if (!s || s._broken) return null;
          try {
            const id = s.play();
            if (s._spatial && x !== undefined) this._applyPos(s, id, x, y, z);
            return id;
          } catch {
            return null;
          }
        }

        stopLoop(key, id) {
          if (id == null) return;
          const s = this.sounds[key];
          if (!s) return;
          try {
            s.stop(id);
          } catch {}
        }

        updateLoopPos(key, id, x, y, z) {
          if (id == null) return;
          const s = this.sounds[key];
          if (s && s._spatial) {
            try {
              s.pos(x, y, z, id);
            } catch {}
          }
        }

        setRate(key, id, rate) {
          if (id == null) return;
          const s = this.sounds[key];
          if (!s) return;
          try {
            s.rate(rate, id);
          } catch {}
        }

        toggleMute() {
          this.isMuted = !this.isMuted;
          Howler.mute(this.isMuted);
          try {
            localStorage.setItem("dc_muted", this.isMuted ? "1" : "0");
          } catch {}
          return this.isMuted;
        }
      }

      // Module-scope singleton — created on splash click after audio context is unlocked.
      let SOUND = null;

      /* ============================================================================
       * SKYBOX SHADER
       * ============================================================================ */
      const SkyShader = {
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            vec4 pos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_Position = pos.xyww;
          }
        `,
        fragmentShader: `
          precision mediump float;
          varying vec3 vWorldPosition;
          uniform float uSunAzimuth;
          uniform float uSunElevation;
          uniform vec3 uSunColor;
          uniform vec3 uSkyColorLow;
          uniform vec3 uSkyColorHigh;
          uniform float uSunSize;
          void main() {
            vec3 direction = normalize(vWorldPosition);
            vec3 skyColor = mix(uSkyColorLow, uSkyColorHigh,
                                clamp(direction.y * 0.5 + 0.5, 0.0, 1.0));
            float azimuth = radians(uSunAzimuth);
            float elevation = radians(uSunElevation);
            vec3 sunDirection = normalize(vec3(
              cos(elevation) * sin(azimuth),
              sin(elevation),
              cos(elevation) * cos(azimuth)
            ));
            float sunIntensity = pow(max(dot(direction, sunDirection), 0.0),
                                      1000.0 / uSunSize);
            gl_FragColor = vec4(skyColor + uSunColor * sunIntensity, 1.0);
          }
        `,
      };

      const CloudsShader = {
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec4 pos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_Position = pos.xyww;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uCloudColor;
          uniform vec3 cameraPos;
          varying vec2 vUv;
          vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
          float snoise(vec2 v){
            const vec4 C = vec4(0.211324865405187,0.366025403784439,
                                -0.577350269189626,0.024390243902439);
            vec2 i = floor(v + dot(v,C.yy));
            vec2 x0 = v - i + dot(i,C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
            vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0))
                                    + i.x + vec3(0.0,i1.x,1.0));
            vec3 m = max(0.5 - vec3(dot(x0,x0),dot(x12.xy,x12.xy),
                                    dot(x12.zw,x12.zw)), 0.0);
            m = m*m; m = m*m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
            vec3 g;
            g.x  = a0.x  * x0.x + h.x * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
          }
          void main() {
            vec2 cloudUV = vUv * 6.0 + vec2(
              cameraPos.x / 1000.0 + uTime / 100.0,
              cameraPos.z / 1000.0
            );
            float n = snoise(cloudUV * 3.0 + uTime / 50.0) * 0.6
                    + snoise(cloudUV * 6.0 + uTime / 40.0) * 0.3
                    + snoise(cloudUV * 12.0 + uTime / 30.0) * 0.1;
            float cloudDensity = smoothstep(0.1, 0.9, 0.5 * n + 0.5);
            float horizonFade = smoothstep(0.0, 0.3, 1.0 - abs(vUv.y - 0.5) * 2.0);
            float edgeFade = (1.0 - pow(abs(vUv.x - 0.5) * 2.0, 2.0))
                           * (1.0 - pow(abs(vUv.y - 0.5) * 2.0, 2.0));
            float a = cloudDensity * horizonFade * edgeFade * 0.7;
            if (a < 0.01) discard;
            gl_FragColor = vec4(uCloudColor, a);
          }
        `,
      };

      const StarsShader = {
        vertexShader: `
          attribute float size;
          attribute vec3 color;
          attribute float phase;
          attribute float freq;
          varying vec3 vColor;
          varying float vDepth;
          uniform float time;
          void main() {
            vColor = color;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vDepth = mv.z;
            float twinkle = sin(time * freq + phase) * 0.2 + 0.8;
            gl_PointSize = size * twinkle;
            vec4 pos = projectionMatrix * mv;
            pos.z = pos.w * 0.999999;
            gl_Position = pos;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vDepth;
          void main() {
            vec2 c = gl_PointCoord - vec2(0.5);
            float d = length(c) * 2.0;
            float core = (1.0 - smoothstep(0.0, 0.2, d)) * 0.8;
            float glow = (1.0 - smoothstep(0.2, 0.5, d)) * 0.1;
            float b = core + glow;
            vec3 finalColor = mix(vec3(1.0), vColor, 0.8) * 0.6;
            float refl = smoothstep(0.0, -1000.0, vDepth) * 0.5;
            gl_FragColor = vec4(finalColor, b * refl);
          }
        `,
      };

      /* ============================================================================
       * SKYBOX CLASS
       * Day/night cycle driven by a JS Date input. Owns its own DirectionalLight (`this.sun`) which is added to the scene separately so it can cast shadows on the bike and ground.
       *
       * Pre-allocated all per-frame Vector3/Color allocations into instance fields.
       * ============================================================================ */
      class Skybox extends Mesh {
        constructor() {
          const geometry = new BoxGeometry(1, 1, 1);
          const material = new ShaderMaterial({
            vertexShader: SkyShader.vertexShader,
            fragmentShader: SkyShader.fragmentShader,
            uniforms: {
              uSunAzimuth: { value: 216 },
              uSunElevation: { value: 25 },
              uSunColor: { value: new Color(0xffe5b0) },
              uSkyColorLow: { value: new Color(0x6fa2ef) },
              uSkyColorHigh: { value: new Color(0x2053ff) },
              uSunSize: { value: 1 },
            },
            side: BackSide,
            depthWrite: false,
            fog: false,
          });
          super(geometry, material);

          // Skybox is huge — 100,000 units. Camera far plane sees through it via the trick `gl_Position.z = w` in the vertex shader, which always pushes sky to the far plane regardless of actual distance.
          this.SKYBOX_SCALE = 100000;
          this.scale.setScalar(this.SKYBOX_SCALE);

          this.sunElevation = 25;
          this.sunAzimuth = 216;
          this.targetElevation = this.sunElevation;
          this.targetAzimuth = this.sunAzimuth;
          this.lerpSpeed = 0.05;
          this._initialPositionSet = false;
          this._timeOfDay = null;

          // Cached Vec3s for hot path (avoid alloc in update())
          this._sunPosition = new Vector3();
          this._sunDirection = new Vector3();

          // Color cache — these are constants but Color.clone() allocates
          this._cWhite = new Color(0xffffff);
          this._cOrange = new Color(0xff4500);
          this._cYellow = new Color(0xffd700);
          this._cRed = new Color(0xff6347);
          this._cDarkRed = new Color(0xd32f2f);
          this._cSkyBlue = new Color(0x87ceeb);
          this._cDarkSky = new Color(0x0d1321);
          this._cNightSky = new Color(0x1c2331);
          this._cMoon = new Color(0xe6e8fa);
          this._cTmpHorizon = new Color();

          // Sun light — owned by skybox but added to scene by caller.
          this.sun = new DirectionalLight(0xffe5b0, 1);
          this.sun.castShadow = true;
          this.sun.shadow.mapSize.set(
            CONFIG.SHADOW.MAP_SIZE,
            CONFIG.SHADOW.MAP_SIZE,
          );
          this.sun.shadow.radius = 2;
          this.sun.shadow.normalBias = 0.02;
          this.sun.shadow.bias = -0.0002;
          // Shadow frustum is biased FORWARD of the bike at runtime (see comment in `update()` below). The orthographic bounds here define the size of the covered region:
          //   X-axis (left/right): screen-space horizontal extent at ~25m ahead
          //   Y-axis (top/bottom): tall enough to fit trees + sky-side margin
          const FX = CONFIG.SHADOW.HALF_WIDTH;
          const FY = CONFIG.SHADOW.HALF_HEIGHT;
          this.sun.shadow.camera.left = -FX;
          this.sun.shadow.camera.right = FX;
          this.sun.shadow.camera.top = FY;
          this.sun.shadow.camera.bottom = -FY;
          this.sun.shadow.camera.near = 0.5;
          this.sun.shadow.camera.far = 500;
          this.sun.shadow.camera.updateProjectionMatrix();

          this.ambientLight = new AmbientLight(0xffffff, 0.6);
          this.add(this.ambientLight);

          this.onTimeOfDayChanged = null;
          this.updateSunPosition(true);
        }

        /**
         * Drive the sun position and sky colors from a JS Date.
         * Daytime is 6:00-21:00 wall-clock, night otherwise.
         * @param {Date} currentTime
         * @param {THREE.Vector3} bikePosition - so the shadow camera follows
         */
        update(currentTime, bikePosition, bikeHeading) {
          const SUNRISE = 6,
            SUNSET = 21;
          const DARKNESS_START = 20.42,
            DARKNESS_END = 6.58;
          const maxElevation = 42;

          const hours = currentTime.getHours();
          const minutes = currentTime.getMinutes();
          const t_h = hours + minutes / 60;

          const isInDarkTransition =
            (t_h >= DARKNESS_START && t_h <= SUNSET) ||
            (t_h >= SUNRISE && t_h <= DARKNESS_END);
          const isDaytime = t_h >= SUNRISE && t_h <= SUNSET;
          const wasNighttime = this._timeOfDay === "Nighttime";

          let normalizedTime;
          if (isDaytime) {
            normalizedTime = (t_h - SUNRISE) / (SUNSET - SUNRISE);
          } else {
            const nightHour = t_h >= SUNSET ? t_h : t_h + 24;
            normalizedTime = (nightHour - SUNSET) / (24 - SUNSET + SUNRISE);
          }

          let sunElevation =
            Math.cos(Math.PI * (normalizedTime - 0.5)) * maxElevation - 5;
          const sunAzimuth = 180 + 180 * normalizedTime;

          let timeOfDay = "Nighttime";
          if (isDaytime) {
            if (normalizedTime <= 0.25) timeOfDay = "Sunrise";
            else if (normalizedTime <= 0.75) timeOfDay = "Midday";
            else timeOfDay = "Sunset";
          }

          const isNowNighttime = timeOfDay === "Nighttime";
          let isInstantTransition = wasNighttime !== isNowNighttime;
          if (!this._initialPositionSet) {
            this._initialPositionSet = true;
            isInstantTransition = true;
          }

          if (isDaytime) {
            const normalizedElevation = Math.min(
              sunElevation / maxElevation,
              1,
            );
            const t = Math.pow(1 - normalizedElevation, 3);
            this.material.uniforms.uSunColor.value.lerpColors(
              this._cWhite,
              this._cOrange,
              t,
            );

            // Build horizon color in cached temp instead of cloning.
            this._cTmpHorizon.copy(this._cSkyBlue);
            if (timeOfDay === "Sunrise") {
              this._cTmpHorizon
                .copy(this._cYellow)
                .lerp(this._cRed, normalizedTime / 0.25);
            } else if (timeOfDay === "Sunset") {
              this._cTmpHorizon
                .copy(this._cRed)
                .lerp(this._cDarkRed, (normalizedTime - 0.75) / 0.25);
            }
            this.material.uniforms.uSkyColorLow.value.copy(this._cTmpHorizon);
            this.material.uniforms.uSkyColorHigh.value.lerpColors(
              this._cSkyBlue,
              this._cDarkSky,
              t,
            );

            this.sun.intensity = isInDarkTransition
              ? 0.1
              : Math.min(4, Math.pow(normalizedElevation, 1.2) * 4);
          } else {
            sunElevation *= 0.5;
            this.material.uniforms.uSunColor.value
              .copy(this._cMoon)
              .multiplyScalar(1.8);
            this.material.uniforms.uSkyColorLow.value.copy(this._cDarkSky);
            this.material.uniforms.uSkyColorHigh.value.copy(this._cNightSky);
            this.sun.intensity = 0.5;
          }

          this.targetElevation = sunElevation;
          this.targetAzimuth = sunAzimuth;
          this.updateSunPosition(isInstantTransition, bikeHeading);

          if (timeOfDay !== this._timeOfDay) {
            if (this.onTimeOfDayChanged) this.onTimeOfDayChanged(timeOfDay);
            this._timeOfDay = timeOfDay;
          }

          // Bias shadow frustum forward so the ortho camera covers the visible ground ahead of the bike instead of wasting resolution on the area behind. Shift target and light position by the same offset to keep the sun direction unchanged.
          if (bikePosition) {
            const sunDir = this._sunDirection;
            const dist = 200;
            const FX = 0,
              FY = 0,
              FZ = -CONFIG.SHADOW.FRUSTUM_FORWARD;
            this.sun.position.set(
              bikePosition.x + sunDir.x * dist + FX,
              bikePosition.y + sunDir.y * dist + FY,
              bikePosition.z + sunDir.z * dist + FZ,
            );
            this.sun.target.position.set(
              bikePosition.x + FX,
              bikePosition.y + FY,
              bikePosition.z + FZ,
            );
            this.sun.target.updateMatrixWorld();
          }
        }

        updateSunPosition(instant = false, bikeHeading = 0) {
          if (instant) {
            this.sunElevation = this.targetElevation;
            this.sunAzimuth = this.targetAzimuth;
          } else {
            this.sunElevation +=
              (this.targetElevation - this.sunElevation) * this.lerpSpeed;
            this.sunAzimuth +=
              (this.targetAzimuth - this.sunAzimuth) * this.lerpSpeed;
          }

          // ---- WORLD-SPACE sun direction (for the DirectionalLight) ----
          // The sun light is in scene root (not under skyGroup), so its world direction is purely a function of time-of-day, NOT bike heading.
          {
            const az = MathUtils.degToRad(
              ((270 - this.sunAzimuth) % 360) - 180,
            );
            const el = MathUtils.degToRad(this.sunElevation);
            const r = 0.5;
            this._sunPosition.set(
              r * Math.cos(el) * Math.sin(az),
              r * Math.sin(el),
              r * Math.cos(el) * Math.cos(az),
            );
            this._sunDirection.copy(this._sunPosition).normalize();
          }

          // ---- CUBE-SPACE sun direction (for the skybox shader) ----
          // The skybox cube is under skyGroup which rotates by +bikeHeading.
          // To keep the rendered sun disc fixed in WORLD space, the shader's sun direction (in cube-local) must rotate the OPPOSITE way as the cube — i.e. subtract the heading from the azimuth uniform.
          const headingDeg = MathUtils.radToDeg(bikeHeading);
          const adjustedAzimuth = this.sunAzimuth - headingDeg;
          this.material.uniforms.uSunAzimuth.value =
            ((270 - adjustedAzimuth) % 360) - 180;
          this.material.uniforms.uSunElevation.value = this.sunElevation;
        }
      }

      /* ============================================================================
       * CLOUDS — Big horizontal plane far overhead with a procedural cloud-noise shader. Tracks camera so clouds appear infinite.
       * ============================================================================ */
      class Clouds extends Mesh {
        constructor() {
          const geometry = new PlaneGeometry(2, 2);
          const material = new ShaderMaterial({
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: AdditiveBlending,
            side: FrontSide,
            uniforms: {
              uTime: { value: 0 },
              uCloudColor: { value: new Color(1, 1, 1) },
              cameraPos: { value: new Vector3() },
            },
            vertexShader: CloudsShader.vertexShader,
            fragmentShader: CloudsShader.fragmentShader,
          });
          super(geometry, material);
          this.frustumCulled = false;
          this.renderOrder = -1;
          this.rotation.x = Math.PI / 2;
          this.position.set(0, 400, 0);
          this.scale.setScalar(15000);
          this._t = 0;
        }
        update(dt, cameraPosition) {
          this._t += dt * 1.0;
          this.material.uniforms.uTime.value = this._t;
          this.material.uniforms.cameraPos.value.copy(cameraPosition);
        }
        setCloudColor(c) {
          this.material.uniforms.uCloudColor.value.copy(c);
        }
        setVisible(v) {
          this.visible = v;
        }
      }

      /* ============================================================================
       * STARS — Top hemisphere of stars mirrored to bottom.
       * ============================================================================ */
      class Stars extends Points {
        constructor(count = 4000) {
          const half = Math.floor(count / 2);
          const top = Stars._gen(half);
          const positions = new Float32Array(half * 6);
          const colors = new Float32Array(half * 6);
          const sizes = new Float32Array(half * 2);
          const phases = new Float32Array(half * 2);
          const freqs = new Float32Array(half * 2);

          // Top hemisphere
          for (let i = 0; i < half; i++) {
            positions.set(top.pos.subarray(i * 3, i * 3 + 3), i * 3);
            colors.set(top.col.subarray(i * 3, i * 3 + 3), i * 3);
            sizes[i] = top.siz[i];
            phases[i] = top.pha[i];
            freqs[i] = top.frq[i];
          }
          // Mirror to bottom (negate Y)
          for (let i = 0; i < half; i++) {
            positions[(half + i) * 3 + 0] = top.pos[i * 3 + 0];
            positions[(half + i) * 3 + 1] = -top.pos[i * 3 + 1];
            positions[(half + i) * 3 + 2] = top.pos[i * 3 + 2];
            colors.set(top.col.subarray(i * 3, i * 3 + 3), (half + i) * 3);
            sizes[half + i] = top.siz[i];
            phases[half + i] = top.pha[i];
            freqs[half + i] = top.frq[i];
          }

          const geometry = new BufferGeometry();
          geometry.setAttribute("position", new BufferAttribute(positions, 3));
          geometry.setAttribute("color", new BufferAttribute(colors, 3));
          geometry.setAttribute("size", new BufferAttribute(sizes, 1));
          geometry.setAttribute("phase", new BufferAttribute(phases, 1));
          geometry.setAttribute("freq", new BufferAttribute(freqs, 1));

          const material = new ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: StarsShader.vertexShader,
            fragmentShader: StarsShader.fragmentShader,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: AdditiveBlending,
          });
          super(geometry, material);
          this.renderOrder = -1;
          this.frustumCulled = false;
          this.matrixAutoUpdate = false;
          this.scale.setScalar(100000);
          this.updateMatrix();
        }
        static _gen(n) {
          const pos = new Float32Array(n * 3);
          const col = new Float32Array(n * 3);
          const siz = new Float32Array(n);
          const pha = new Float32Array(n);
          const frq = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            // Uniform on top hemisphere
            const u = Math.random();
            const v = Math.random() * 0.5 + 0.5;
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            pos[i * 3 + 0] = Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = Math.cos(phi);
            pos[i * 3 + 2] = Math.sin(phi) * Math.sin(theta);
            // Color tinted: 15% blueish, 15% yellowish, rest white
            const r = Math.random();
            const c =
              r < 0.15
                ? [0.8, 0.85, 1.0]
                : r < 0.3
                  ? [1.0, 0.95, 0.8]
                  : [1.0, 1.0, 1.0];
            col.set(c, i * 3);
            // Size distribution favors small with rare large stars
            const sr = Math.random();
            siz[i] =
              sr < 0.01
                ? 40 + Math.random() * 20
                : sr < 0.05
                  ? 25 + Math.random() * 15
                  : sr < 0.2
                    ? 15 + Math.random() * 10
                    : 5 + Math.random() * 5;
            pha[i] = Math.random() * Math.PI * 2;
            frq[i] = 1.0 + Math.random() * 2.0;
          }
          return { pos, col, siz, pha, frq };
        }
        update(elapsed) {
          this.material.uniforms.time.value = elapsed;
        }
        setVisible(v) {
          this.visible = v;
        }
      }

      /* ============================================================================
       * INSTANCED FOREST — adapted
       * Procedurally generates trees as instanced meshes; vertex shader does LOD, sway, root flares.
       *
       * Deathchase additions:
       *   - flat Float32Arrays for tree positions so I can move them without rebuilding instance matrices each time
       *   - uniform-area annulus distribution around the bike (CLEAR_RADIUS keeps the start clear)
       *   - recycleBehind2D() relocates trees outside the visible cone
       *   - redistributeAround() force-resamples on respawn
       * ============================================================================ */
      class InstancedForest {
        constructor(treeCount, forestRadius, seed = 1) {
          this.treeCount = treeCount;
          this.forestRadius = forestRadius;
          this.seed = seed;

          // Per-tree spatial data (the source of truth that recycling rewrites).
          // I keep these as flat Float32Arrays for cache-friendly iteration.
          this.treePosX = new Float32Array(treeCount);
          this.treePosZ = new Float32Array(treeCount);
          this.treeRadius = new Float32Array(treeCount); // for collision (XZ)
          this.treeBoundY = new Float32Array(treeCount); // sphere center Y
          this.treeBoundR = new Float32Array(treeCount); // sphere radius

          // Branch/leaf data — built during generate(), not mutated after.
          // For recycling I directly update the InstancedMesh `instanceMatrix` instead of rebuilding `branchMatrices`.
          this.branchMatrices = []; // Matrix4[] — initial matrices (transient build)
          this.branchTreeIds = []; // Uint16-equivalent: which tree each branch belongs to
          this.leafMatrices = [];
          this.leafTreeIds = [];
          this.leafColors = [];
          this.leafRandoms = [];
          this.leafWobbleX = [];
          this.leafWobbleY = [];
          this.leafSwayPhase = [];

          // Per-tree contiguous ranges in branch/leaf arrays.
          this.treeBranchRanges = [];
          this.treeLeafRanges = [];

          this.group = new Group();
          this.meshes = {};

          // Build temporaries — only used during _generate, never per-frame.
          this._mTmp = new Matrix4();
          this._qTmp = new Quaternion();
          this._sTmp = new Vector3();
          this._up = new Vector3(0, 1, 0);
          this._cTmp = new Color();

          this._leafGeo = new PlaneGeometry(1, 1);
          this._leafGeo.computeBoundingBox();
          this._leafBottomY = this._leafGeo.boundingBox.min.y;

          // Recycling temporaries
          this._recBranchVec = new Vector3();
          this._recLeafVec = new Vector3();
        }

        build(leafTexture, barkTexture) {
          const C = CONFIG.FOREST;
          const rand = mulberry32(this.seed);

          const treeTypes = [
            {
              levels: 4,
              branchAngle: 0.5,
              lengthFalloff: 0.7,
              radiusFalloff: 0.55,
              branches: 3,
            },
            {
              levels: 5,
              branchAngle: 0.4,
              lengthFalloff: 0.65,
              radiusFalloff: 0.5,
              branches: 2,
            },
            {
              levels: 4,
              branchAngle: 0.65,
              lengthFalloff: 0.72,
              radiusFalloff: 0.6,
              branches: 4,
            },
            {
              levels: 3,
              branchAngle: 0.55,
              lengthFalloff: 0.75,
              radiusFalloff: 0.58,
              branches: 3,
            },
            {
              levels: 4,
              branchAngle: 0.48,
              lengthFalloff: 0.68,
              radiusFalloff: 0.52,
              branches: 3,
            },
          ];

          // RADIAL DISTRIBUTION: trees go in a disc around the bike's start point.
          // The bike now has full 2D heading and can drive in any direction, so a forward-only corridor would leave gaps when the player turns.
          // The recycle pass reorganizes trees ahead of the bike's current heading; initial layout just needs to be roughly uniform in all directions.
          //
          // I carve a CLEARING at the center: no tree closer than CLEAR_RADIUS metres from origin, so the bike has a generous spawn pocket and you can clearly see you're starting "in the middle" of the forest.
          const CLEAR_RADIUS = 12;
          const innerArea = Math.PI * CLEAR_RADIUS * CLEAR_RADIUS;
          const outerArea = Math.PI * this.forestRadius * this.forestRadius;
          // Sample r in the annulus [CLEAR_RADIUS, forestRadius] with uniform area:
          //   r² uniform in [CLEAR_RADIUS², forestRadius²]
          const rMinSq = CLEAR_RADIUS * CLEAR_RADIUS;
          const rMaxSq = this.forestRadius * this.forestRadius;
          for (let i = 0; i < this.treeCount; i++) {
            const u = rand();
            const r = Math.sqrt(rMinSq + u * (rMaxSq - rMinSq));
            const theta = rand() * Math.PI * 2;
            const tx = r * Math.cos(theta);
            const tz = r * Math.sin(theta);

            const treeRotation = rand() * Math.PI * 2;
            const treeType = treeTypes[Math.floor(rand() * treeTypes.length)];

            const treeScale = 0.6 + rand() * 0.8;
            const leafHue =
              C.LEAF_HUE_MIN + rand() * (C.LEAF_HUE_MAX - C.LEAF_HUE_MIN);
            const leafLightness =
              C.LEAF_LIGHTNESS_MIN +
              rand() * (C.LEAF_LIGHTNESS_MAX - C.LEAF_LIGHTNESS_MIN);
            const trunkLength =
              (C.TRUNK_LENGTH_MIN +
                rand() * (C.TRUNK_LENGTH_MAX - C.TRUNK_LENGTH_MIN)) *
              treeScale;
            const trunkRadius =
              (C.TRUNK_RADIUS_MIN +
                rand() * (C.TRUNK_RADIUS_MAX - C.TRUNK_RADIUS_MIN)) *
              treeScale;

            this.treePosX[i] = tx;
            this.treePosZ[i] = tz;
            // Collision radius: the trunk's actual physical radius plus a small fudge for branches/visual fairness. Combined at runtime with the bike's hit-half-width (see _checkTreeCollision).
            this.treeRadius[i] = trunkRadius + C.COLLISION_RADIUS;

            // Estimated tree height for bounding sphere
            const estimatedHeight =
              trunkLength *
              (1 +
                treeType.lengthFalloff +
                treeType.lengthFalloff * treeType.lengthFalloff);
            this.treeBoundY[i] = estimatedHeight * 0.45;
            this.treeBoundR[i] =
              Math.max(estimatedHeight * 0.6, trunkLength) * treeScale;

            this._generateTree(
              i,
              tx,
              tz,
              treeRotation,
              treeScale,
              leafHue,
              leafLightness,
              trunkLength,
              trunkRadius,
              treeType,
              rand,
            );
          }

          this._buildMeshes(leafTexture, barkTexture);
          this._buildTreeRanges();
          this._cacheBaseMatrices();
        }

        _generateTree(
          treeIndex,
          x,
          z,
          rotation,
          scale,
          leafHue,
          leafLightness,
          trunkLength,
          trunkRadius,
          treeType,
          rand,
        ) {
          const origin = new Vector3(x, 0, z);
          const direction = new Vector3(0, 1, 0);
          direction.x += (rand() - 0.5) * 0.12;
          direction.z += (rand() - 0.5) * 0.12;
          direction.normalize();

          this._branch(
            origin,
            direction,
            trunkLength,
            trunkRadius,
            0,
            rotation,
            scale,
            leafHue,
            leafLightness,
            treeType,
            treeIndex,
            rand,
          );
        }

        _branch(
          start,
          direction,
          length,
          radius,
          level,
          treeRotation,
          treeScale,
          leafHue,
          leafLightness,
          treeType,
          treeIndex,
          rand,
        ) {
          if (level > treeType.levels || radius < 0.012) return;

          const end = start.clone().addScaledVector(direction, length);
          const mid = start.clone().lerp(end, 0.5);

          this._qTmp.setFromUnitVectors(
            this._up,
            direction.clone().normalize(),
          );
          const topRadius = radius * treeType.radiusFalloff;
          const avgRadius = (radius + topRadius) * 0.5;
          this._sTmp.set(avgRadius, length, avgRadius);
          this._mTmp.compose(mid, this._qTmp, this._sTmp);
          this.branchMatrices.push(this._mTmp.clone());
          this.branchTreeIds.push(treeIndex);

          // Leaves at terminal branches
          if (level >= treeType.levels - 1) {
            this._addLeaves(
              end,
              direction,
              treeScale,
              leafHue,
              leafLightness,
              rand,
              topRadius,
              level,
              treeType.levels,
              treeIndex,
            );
          }

          if (level < treeType.levels) {
            const numChildren =
              level === 0
                ? treeType.branches + Math.floor(rand() * 2)
                : Math.max(1, treeType.branches - Math.floor(level * 0.3));

            for (let i = 0; i < numChildren; i++) {
              const twistAngle =
                (i / numChildren) * Math.PI * 2 +
                rand() * CONFIG.FOREST.TWIST +
                treeRotation;
              const bendAngle =
                treeType.branchAngle +
                (rand() - 0.5) * CONFIG.FOREST.BRANCH_ANGLE_VARIANCE * 2;

              const perp = new Vector3(1, 0, 0);
              if (Math.abs(direction.y) < 0.9) {
                perp.crossVectors(this._up, direction).normalize();
              } else {
                perp.crossVectors(new Vector3(0, 0, 1), direction).normalize();
              }

              const childDir = direction.clone();
              childDir.applyAxisAngle(perp, bendAngle);
              childDir.applyAxisAngle(direction, twistAngle);
              childDir.normalize();

              const startT = 0.4 + rand() * 0.5;
              const childStart = start.clone().lerp(end, startT);
              const childLength =
                length * treeType.lengthFalloff * (0.8 + rand() * 0.4);
              const childRadius = radius * treeType.radiusFalloff;

              this._branch(
                childStart,
                childDir,
                childLength,
                childRadius,
                level + 1,
                treeRotation,
                treeScale,
                leafHue,
                leafLightness,
                treeType,
                treeIndex,
                rand,
              );
            }
          }
        }

        _addLeaves(
          branchEnd,
          branchDir,
          treeScale,
          leafHue,
          leafLightness,
          rand,
          topRadius,
          level,
          maxLevel,
          treeIndex,
        ) {
          const C = CONFIG.FOREST;
          const count = C.LEAF_DENSITY + Math.floor(rand() * 3);
          const size = C.LEAF_SIZE * treeScale;
          const spread = C.LEAF_SPREAD * treeScale;

          const perp1 = new Vector3(1, 0, 0);
          if (Math.abs(branchDir.y) > 0.9) perp1.set(0, 0, 1);
          perp1.crossVectors(branchDir, perp1).normalize();
          const perp2 = new Vector3()
            .crossVectors(branchDir, perp1)
            .normalize();

          for (let i = 0; i < count; i++) {
            const aroundAngle = rand() * Math.PI * 2;
            const outward = new Vector3()
              .addScaledVector(perp1, Math.cos(aroundAngle))
              .addScaledVector(perp2, Math.sin(aroundAngle))
              .normalize();
            const branchRadius = topRadius;
            const attachPoint = branchEnd
              .clone()
              .addScaledVector(outward, branchRadius);

            const stemDir = new Vector3()
              .addScaledVector(outward, 0.5 + rand() * 0.3)
              .addScaledVector(branchDir, 0.3 + rand() * 0.4)
              .add(new Vector3(0, 0.2 + rand() * 0.3, 0))
              .normalize();
            const leafUp = stemDir.clone();
            let leafNormal = new Vector3(0, 1, 0).addScaledVector(
              outward,
              (rand() - 0.5) * 0.5,
            );
            leafNormal
              .sub(leafUp.clone().multiplyScalar(leafNormal.dot(leafUp)))
              .normalize();
            if (leafNormal.lengthSq() < 0.1) {
              leafNormal.copy(outward);
              leafNormal
                .sub(leafUp.clone().multiplyScalar(leafNormal.dot(leafUp)))
                .normalize();
            }
            const leafRight = new Vector3()
              .crossVectors(leafUp, leafNormal)
              .normalize();
            leafNormal.crossVectors(leafRight, leafUp).normalize();

            const rotMatrix = new Matrix4();
            rotMatrix.makeBasis(leafRight, leafUp, leafNormal);

            const jitterQuat = new Quaternion().setFromEuler(
              new Euler(
                (rand() - 0.5) * 0.3,
                (rand() - 0.5) * 0.3,
                (rand() - 0.5) * 0.2,
              ),
            );
            const leafQuat = new Quaternion().setFromRotationMatrix(rotMatrix);
            leafQuat.multiply(jitterQuat);

            const localBottom = new Vector3(0, this._leafBottomY, 0);
            const rotatedBottom = localBottom.clone().applyQuaternion(leafQuat);
            const taperFactor = 0.8 + 0.2 * (1 - level / maxLevel);
            const leafScale = size * (0.5 + rand() * 0.5) * taperFactor;
            const leafPos = attachPoint
              .clone()
              .sub(rotatedBottom.clone().multiplyScalar(leafScale));

            this._sTmp.set(leafScale, leafScale, leafScale);
            this._mTmp.compose(leafPos, leafQuat, this._sTmp);
            this.leafMatrices.push(this._mTmp.clone());
            this.leafTreeIds.push(treeIndex);

            let h = leafHue + (rand() - 0.5) * 0.05;
            let s = C.LEAF_SATURATION + rand() * 0.15;
            let l = leafLightness + (rand() - 0.5) * 0.08;
            if (rand() < C.LEAF_TINGE_PERCENT) {
              if (rand() < C.LEAF_TINGE_YELLOW_CHANCE) {
                h += C.LEAF_TINGE_HUE_SHIFT;
                l = Math.min(1.0, l + C.LEAF_TINGE_LIGHT_SHIFT);
              } else {
                s = Math.max(0.0, s - C.LEAF_TINGE_SAT_SHIFT);
                l = Math.max(0.0, l - C.LEAF_TINGE_LIGHT_SHIFT);
              }
            }
            this._cTmp.setHSL(h, s, l);
            this.leafColors.push(this._cTmp.r, this._cTmp.g, this._cTmp.b);
            this.leafRandoms.push(rand());
            this.leafWobbleX.push((rand() - 0.5) * 0.12);
            this.leafWobbleY.push((rand() - 0.5) * 0.12);
            this.leafSwayPhase.push(rand() * Math.PI * 2);
          }
        }

        _buildMeshes(leafTexture, barkTexture) {
          const C = CONFIG.FOREST;

          // ---- BARK ----
          const barkGeo = new CylinderGeometry(1, 1, 1, C.BARK_SEGMENTS, 1);
          const barkMat = new ShaderMaterial({
            uniforms: {
              barkTexture: { value: barkTexture },
              barkColor: { value: new Color(...C.BARK_COLOR) },
              leafTintColor: { value: new Color(...C.BARK_DISTANT_TINT) },
              sunDirection: {
                value: new Vector3(0.5, 1.0, 0.3).normalize(),
              },
              sunColor: { value: new Color(1.0, 0.98, 0.9) },
              ambientLight: { value: new Color(0.5, 0.52, 0.48) },
              leafFadeStart: { value: C.LOD_FADE_START },
              maxLeafDistance: { value: C.LOD_MAX_DISTANCE },
              rootSpreadMin: { value: C.ROOT_SPREAD_MIN },
              rootSpreadMax: { value: C.ROOT_SPREAD_MAX },
              rootHeightMin: { value: C.ROOT_HEIGHT_MIN },
              rootHeightMax: { value: C.ROOT_HEIGHT_MAX },
              rootBumpsMin: { value: C.ROOT_BUMPS_MIN },
              rootBumpsMax: { value: C.ROOT_BUMPS_MAX },
            },
            vertexShader: `
              uniform float leafFadeStart;
              uniform float maxLeafDistance;
              uniform float rootSpreadMin;
              uniform float rootSpreadMax;
              uniform float rootHeightMin;
              uniform float rootHeightMax;
              uniform float rootBumpsMin;
              uniform float rootBumpsMax;
              varying vec3 vNormal;
              varying vec3 vWorldPosition;
              varying float vLeafTint;
              varying vec2 vUv;
              varying float vTreeRand;
              void main() {
                vec3 pos = position;
                // Two centers: instanceLocalCenter is stable per-tree (used to seed the procedural root-flare noise — must NOT change frame-to-frame or roots will wobble as the forest streams). worldPos / instance.
                // Center include modelMatrix and reflect the rendered position.
                vec4 instanceLocalCenter = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                vec4 worldPos = modelMatrix * instanceMatrix * vec4(pos, 1.0);
                vec4 instanceCenter = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);

                float treeRand1 = fract(sin(instanceLocalCenter.x * 12.9898 + instanceLocalCenter.z * 78.233) * 43758.5453);
                float treeRand2 = fract(sin(instanceLocalCenter.x * 63.7264 + instanceLocalCenter.z * 10.873) * 43758.5453);
                float treeRand3 = fract(sin(instanceLocalCenter.x * 36.1734 + instanceLocalCenter.z * 91.147) * 43758.5453);

                float rootSpread = mix(rootSpreadMin, rootSpreadMax, treeRand1);
                float rootHeight = mix(rootHeightMin, rootHeightMax, treeRand2);
                float rootBumps  = floor(mix(rootBumpsMin, rootBumpsMax + 1.0, treeRand3));

                if (worldPos.y < rootHeight) {
                  float rootFactor = 1.0 - (worldPos.y / rootHeight);
                  rootFactor = rootFactor * rootFactor;
                  vec2 outwardDir = worldPos.xz - instanceCenter.xz;
                  float outwardLen = length(outwardDir);
                  outwardDir = outwardLen > 0.001 ? outwardDir / outwardLen : vec2(1.0, 0.0);
                  float angle = atan(worldPos.z - instanceCenter.z, worldPos.x - instanceCenter.x);
                  float treeSeed = fract(instanceLocalCenter.x * 12.9898 + instanceLocalCenter.z * 78.233) * 6.28;
                  float bumpiness = 1.0 + 0.7 * sin(angle * rootBumps + treeSeed);
                  float spreadAmount = rootFactor * rootSpread * bumpiness * outwardLen * 3.0;
                  worldPos.xz += outwardDir * spreadAmount;
                  worldPos.y -= rootFactor * 0.15;
                }

                vWorldPosition = worldPos.xyz;
                vec3 toVertex = worldPos.xyz - instanceCenter.xyz;
                vec3 approxNormal = normalize(vec3(toVertex.x, 0.0, toVertex.z));
                if (abs(normal.y) > 0.9) approxNormal = vec3(0.0, sign(normal.y), 0.0);
                vNormal = approxNormal;

                float dist = length(cameraPosition - vWorldPosition);
                float safeFadeStart = min(leafFadeStart, maxLeafDistance - 1.0);
                vLeafTint = smoothstep(safeFadeStart, maxLeafDistance, dist);

                float uvAngle = atan(worldPos.z - instanceCenter.z, worldPos.x - instanceCenter.x);
                vUv = vec2(uvAngle * 1.5, worldPos.y * 0.5);
                vTreeRand = treeRand1;
                // worldPos already includes modelMatrix * instanceMatrix above.
                gl_Position = projectionMatrix * viewMatrix * worldPos;
              }
            `,
            fragmentShader: `
              uniform sampler2D barkTexture;
              uniform vec3 barkColor;
              uniform vec3 leafTintColor;
              varying vec3 vNormal;
              varying vec3 vWorldPosition;
              varying float vLeafTint;
              varying vec2 vUv;
              varying float vTreeRand;
              void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(vec3(0.5, 1.0, 0.3));
                float NdotL = max(dot(N, L), 0.0);
                vec2 wrappedUV = fract(vUv);
                vec3 texColor = texture2D(barkTexture, wrappedUV).rgb;
                float brightness = 0.85 + vTreeRand * 0.3;
                vec3 baseColor = mix(barkColor, texColor, 0.7) * 1.8 * brightness;
                baseColor *= vec3(1.0 + (vTreeRand - 0.5) * 0.1, 1.0, 1.0 - (vTreeRand - 0.5) * 0.1);
                baseColor = mix(baseColor, leafTintColor, vLeafTint * 0.4);
                vec3 litColor = baseColor * (0.3 + NdotL * 0.7);
                gl_FragColor = vec4(litColor, 1.0);
              }
            `,
          });

          const barkMesh = new InstancedMesh(
            barkGeo,
            barkMat,
            this.branchMatrices.length,
          );
          barkMesh.instanceMatrix.setUsage(DynamicDrawUsage);
          barkMesh.frustumCulled = false; // drive visibility via streaming
          barkMesh.castShadow = true;
          barkMesh.receiveShadow = true;
          for (let i = 0; i < this.branchMatrices.length; i++) {
            barkMesh.setMatrixAt(i, this.branchMatrices[i]);
          }
          barkMesh.instanceMatrix.needsUpdate = true;
          this.group.add(barkMesh);
          this.meshes.bark = barkMesh;
          this.barkMat = barkMat;

          // ---- LEAVES ----
          const leafMat = new ShaderMaterial({
            uniforms: {
              leafTexture: { value: leafTexture },
              sunDirection: {
                value: new Vector3(0.5, 1.0, 0.3).normalize(),
              },
              sunColor: { value: new Color(1.0, 0.98, 0.9) },
              ambientLight: { value: new Color(0.65, 0.7, 0.6) },
              time: { value: 0 },
              maxLeafDistance: { value: C.LOD_MAX_DISTANCE },
              leafFadeStart: { value: C.LOD_FADE_START },
            },
            vertexShader: `
              attribute vec3 instanceColorAttr;
              attribute float instanceRandom;
              attribute float instanceWobbleX;
              attribute float instanceWobbleY;
              attribute float instanceSwayPhase;
              uniform float time;
              uniform float maxLeafDistance;
              uniform float leafFadeStart;
              varying vec2 vUv;
              varying vec3 vColor;
              varying vec3 vWorldPosition;
              varying vec3 vNormal;
              varying float vRandom;
              void main() {
                // Instance world position must include the forest group's streaming transform (modelMatrix). Otherwise LOD culling sees stale baked positions and the leaves render in the wrong place.
                vec4 instanceCenter = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
                vec3 instancePos = instanceCenter.xyz;
                float dist = length(cameraPosition - instancePos);
                if (dist > maxLeafDistance) {
                  // Collapse to degenerate triangle - skips raster entirely.
                  gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                  return;
                }
                float safeFadeStart = min(leafFadeStart, maxLeafDistance - 1.0);
                float lodScale = 1.0 - smoothstep(safeFadeStart, maxLeafDistance, dist) * 0.5;
                vUv = uv;
                vColor = instanceColorAttr;
                vRandom = instanceRandom;
                vec3 pos = position * lodScale;
