         * Toggle the headlight intensity for day/night. Mirrors the player's Bike.setNightMode signature so the same orchestrator code can call both without branching.
         */
        setNightMode(isNight) {
          this._headlightSpot.intensity = isNight ? 9 : 0;
        }

        /**
         * Swap in a GLTF subtree as the bike's visible body. Same conventions as Bike.setModel; uses CONFIG.ENEMY.MODEL for the holder transform.
         *
         * @param {THREE.Object3D} subtree
         */
        setModel(subtree) {
          while (this._modelHolder.children.length > 0) {
            this._modelHolder.remove(this._modelHolder.children[0]);
          }
          // Recenter on (0,0,0) before parenting. See centerBikeSubtree for why.
          centerBikeSubtree(subtree);

          const cfg = CONFIG.ENEMY.MODEL;
          this._modelHolder.add(subtree);
          this._modelHolder.scale.setScalar(cfg.SCALE);
          this._modelHolder.position.y = cfg.Y_OFFSET;
          this._modelHolder.rotation.y = cfg.HEADING_CORRECTION;

          // === RANDOM BODY COLOR FOR EACH ENEMY ===
          // Applies the SAME random color to ALL meshes using "Mat_Body"
          this.randomizeBodyColor();

          subtree.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = true;
              node.receiveShadow = false;
              if (node.material) {
                if (Array.isArray(node.material)) {
                  for (const m of node.material) m.side = FrontSide;
                } else {
                  node.material.side = FrontSide;
                }
              }
            }
          });

          this.group.visible = true;
        }

        /**
         * Apply the same random color to every mesh using "Mat_Body".
         * Hue is generated in [0.08, 0.92] — excludes the ±30° red band the player bike occupies so enemies are visually distinct.
         *
         * The bike GLB ships with a shared "Mat_Body" material. I clone it once per enemy on first call, then recolor the existing clone on subsequent respawns. Cloning every respawn would leak Material instances (and their compiled shader programs) into Three.js's internal caches.
         */
        randomizeBodyColor() {
          const hue = 0.08 + Math.random() * 0.84;
          const saturation = 0.75 + Math.random() * 0.25;
          const lightness = 0.52 + Math.random() * 0.28;
          this._bikeHue = hue;

          // Fast path: I already have my own cloned material — just recolor it.
          if (this._bodyMatClone) {
            this._bodyMatClone.color.setHSL(hue, saturation, lightness);
            return;
          }

          // First call: find the shared Mat_Body, clone once, repoint every mesh that uses it to my clone.
          let cloned = null;
          this.group.traverse((node) => {
            if (!node.isMesh || !node.material) return;
            const materials = Array.isArray(node.material)
              ? node.material
              : [node.material];
            for (const mat of materials) {
              if (
                mat &&
                mat.name === "Mat_Body" &&
                !mat.userData._isEnemyClone
              ) {
                if (!cloned) {
                  cloned = mat.clone();
                  cloned.userData._isEnemyClone = true;
                  cloned.color.setHSL(hue, saturation, lightness);
                }
                if (Array.isArray(node.material)) {
                  const idx = node.material.indexOf(mat);
                  if (idx !== -1) node.material[idx] = cloned;
                } else {
                  node.material = cloned;
                }
              }
            }
          });
          this._bodyMatClone = cloned;
        }

        /**
         * Spawn (or respawn) ahead of the bike. Inherits bike's heading so the enemy travels in the same general direction. Also randomizes body color on every respawn (new stage or after death).
         */
        respawn(bikeX, bikeZ, bikeHeading, forest, laneHint, stage) {
          const fwdX = Math.sin(bikeHeading);
          const fwdZ = -Math.cos(bikeHeading);
          const rightX = fwdZ;
          const rightZ = -fwdX;

          // Pick a spawn that isn't inside a tree. Each candidate randomizes lead distance + lateral offset within its lane.
          // `laneHint` ∈ {-1, +1} biases the lateral pick to opposite sides so the two enemies of a stage don't stack up.
          const C = CONFIG.ENEMY;
          const leadSpan = C.LEAD_DISTANCE_MAX - C.LEAD_DISTANCE_MIN;
          const LANE_WIDE = 12;
          const SPAWN_R = 1.0;

          // Per-stage difficulty. Speed capped at SPEED_MAX - HEADROOM so the player always has a closing rate. Weave capped so the lateral sweep stays trackable.
          const s = Math.max(1, stage || 1);
          const speedCap = CONFIG.BIKE.SPEED_MAX - C.SPEED_CHASE_HEADROOM;
          const stageSpeed = Math.min(
            speedCap,
            C.SPEED + (s - 1) * C.SPEED_PER_STAGE,
          );
          const stageWeaveAmp = Math.min(
            C.WEAVE_AMP_CAP,
            C.WEAVE_AMPLITUDE + (s - 1) * C.WEAVE_AMP_PER_STAGE,
          );

          let placed = false;
          let lead = 0,
            lateralOffset = 0;
          for (let attempt = 0; attempt < 8; attempt++) {
            lead = C.LEAD_DISTANCE_MIN + Math.random() * leadSpan;
            // Per-attempt lateral. With laneHint I keep the bike to a preferred side but still jitter inside it.
            const r = Math.random();
            if (laneHint === undefined) {
              lateralOffset = (r * 2 - 1) * LANE_WIDE;
            } else {
              lateralOffset = laneHint * (2 + r * (LANE_WIDE - 2));
            }
            const cx = bikeX + fwdX * lead + rightX * lateralOffset;
            const cz = bikeZ + fwdZ * lead + rightZ * lateralOffset;
            if (!forest || forest.isClearAt(cx, cz, SPAWN_R)) {
              this.worldX = cx;
              this.worldZ = cz;
              placed = true;
              break;
            }
          }
          // Fallback if 8 random tries failed (very dense forest stage): accept whatever the last attempt produced. Better to spawn possibly-overlapped than to skip spawning entirely.
          if (!placed) {
            this.worldX = bikeX + fwdX * lead + rightX * lateralOffset;
            this.worldZ = bikeZ + fwdZ * lead + rightZ * lateralOffset;
          }
          this.heading = bikeHeading;
          this.turnRate = 0;
          this.lean = 0;
          this.weaveOffset = (Math.random() * 2 - 1) * 4;
          this.weavePhase = Math.random() * Math.PI * 2;
          this.alive = true;
          this.group.visible = true;
          this.speed = stageSpeed + (Math.random() - 0.5) * 2 * C.SPEED_VAR;
          // Per-respawn weave reroll, scaled to current stage. Keep the ±jitter so the two enemies don't sync up.
          this.weaveAmplitude = stageWeaveAmp * (0.6 + Math.random() * 0.7);

          this.randomizeBodyColor();

          // Per-enemy engine: stop any prior loop (defensive against double-respawn), then start with a randomized pitch so multiple enemies sound distinct.
          if (SOUND) {
            if (this._engineId != null) {
              SOUND.stopLoop("engine_enemy", this._engineId);
            }
            this._engineId = SOUND.startLoop(
              "engine_enemy",
              this.worldX,
              0.5,
              this.worldZ,
            );
            const enginePitch = 0.82 + Math.random() * 0.36;
            SOUND.setRate("engine_enemy", this._engineId, enginePitch);
          }
        }
        /**
         * Per-frame AI + physics integration. AI behavior:
         *   1. Steer toward bearing-to-player, but only if player is ahead (avoids jarring U-turns; respawn catches lagging enemies).
         *   2. Smooth yaw at capped rate — banked turns, no instant flips.
         *   3. Sinusoidal weave added to yaw (not target position) for side-to-side snake without lateral teleport.
         *   4. Forward motion always along current heading.
         *   5. Tree avoidance: forward-cone query, strong avoidance yaw when something's in the path.
         */
        update(dt, elapsed, bikeX, bikeZ, bikeHeading, forest, enemies) {
          if (!this.alive) return;

          const C = CONFIG.ENEMY;
          const BC = CONFIG.BIKE;

          // ---- 1. Bearing from AI to player ----
          // The angle the AI would need to face to point at the player.
          // heading convention: 0 = -Z, increases clockwise.
          const dx = bikeX - this.worldX;
          const dz = bikeZ - this.worldZ;
          const bearingToPlayer = Math.atan2(dx, -dz);

          // Shortest-arc delta from AI's current heading to that bearing.
          let dH = bearingToPlayer - this.heading;
          while (dH > Math.PI) dH -= 2 * Math.PI;
          while (dH < -Math.PI) dH += 2 * Math.PI;

          // ---- 2. Decide whether to chase ----
          // If the player is BEHIND the AI (|dH| > π/2), keep going forward. Real motorcycles don't U-turn at speed; they curve gently. The respawn logic will reposition the AI ahead when it falls too far behind.
          let targetTurnRate = 0;
          if (Math.abs(dH) < Math.PI * 0.5) {
            // Player ahead-ish — steer gently toward them. Gain is much softer than the player's bike (player is responsive; AI is smooth) so the path looks deliberate, not twitchy.
            const TURN_GAIN = 1.2;
            targetTurnRate = clamp(
              dH * TURN_GAIN,
              -C.TURN_RATE_MAX,
              C.TURN_RATE_MAX,
            );
          }

          // ---- 3. Add weave on top of the chase yaw ----
          // Proximity-aware: when the player gets close, the AI rider knows they're a target and starts swerving harder. Far away, the weave is gentle so they look like cruising bikes; once the player closes inside ~50m, both amplitude AND frequency ramp up — the bike "panics" and is harder to lead.
          const distToPlayer = Math.hypot(dx, dz);
          // 0 = far (>=80m, calm), 1 = right on top (<=15m, max panic)
          const panic = clamp(1 - (distToPlayer - 15) / 65, 0, 1);
          const weaveAmpFactor = 0.2 + panic * 0.65; // 20% calm → 85% panic
          const weaveFreqMul = 1 + panic * 1.6; // up to 2.6× faster
          const weaveYaw =
            Math.sin(
              elapsed * this.weaveFreq * weaveFreqMul * Math.PI * 2 +
                this.weavePhase,
            ) *
            C.TURN_RATE_MAX *
            weaveAmpFactor;
          targetTurnRate += weaveYaw;

          // ---- 3.5. Obstacle avoidance (trees + peer AI bikes) ----
          // Two-stage filter: axis-aligned bounds reject most candidates; survivors get a dot-product cone test. Closest threat ahead contributes an avoidance yaw added to the target turn rate.
          // Trees and peer enemies share the same path — whichever is closer wins (also prevents AI bikes from sliding through each other).
          {
            const fwdAheadX = Math.sin(this.heading);
            const fwdAheadZ = -Math.cos(this.heading);
            const rightX = -fwdAheadZ;
            const rightZ = fwdAheadX;
            // ~1.0s of travel-time lookahead with an 8m floor. Generous foresight is what makes avoidance feel smart vs reactive.
            const lookahead = Math.max(8, this.speed * 1.0);
            // Lateral threat envelope — wider than the bike (~0.9m) so the AI considers trees just outside its direct path and pre-steers through gaps.
            const sideEnvelope = 3.5;
            const boxR = lookahead;

            let nearestForward = Infinity;
            let nearestRight = 0; // sign tells us which way to dodge
            let nearestEffective = 0; // weighted threat for the chosen obstacle

            // ---- 3.5a. Trees ----
            if (forest) {
              for (let t = 0; t < forest.treeCount; t++) {
                const tdx = forest.treePosX[t] - this.worldX;
                if (tdx > boxR || tdx < -boxR) continue;
                const tdz = forest.treePosZ[t] - this.worldZ;
                if (tdz > boxR || tdz < -boxR) continue;

                const dForward = tdx * fwdAheadX + tdz * fwdAheadZ;
                if (dForward <= 0 || dForward > lookahead) continue;
                const dRight = tdx * rightX + tdz * rightZ;
                const clearance = forest.treeRadius[t] + 0.45;
                if (dRight > sideEnvelope + clearance) continue;
                if (dRight < -sideEnvelope - clearance) continue;

                if (dForward < nearestForward) {
                  nearestForward = dForward;
                  nearestRight = dRight;
                  nearestEffective = clearance;
                }
              }
            }

            // ---- 3.5b. Other AI bikes ----
            // Two enemy bikes can chase the same player along converging paths and end up colliding. Treat each peer as an obstacle: same bounding box + cone test. Clearance is the sum of both bikes' half-widths (~0.45m each).
            if (enemies) {
              const peerClearance = 0.9; // 0.45m * 2
              for (let i = 0; i < enemies.length; i++) {
                const peer = enemies[i];
                if (peer === this || !peer.alive) continue;
                const tdx = peer.worldX - this.worldX;
                if (tdx > boxR || tdx < -boxR) continue;
                const tdz = peer.worldZ - this.worldZ;
                if (tdz > boxR || tdz < -boxR) continue;

                const dForward = tdx * fwdAheadX + tdz * fwdAheadZ;
                if (dForward <= 0 || dForward > lookahead) continue;
                const dRight = tdx * rightX + tdz * rightZ;
                if (dRight > sideEnvelope + peerClearance) continue;
                if (dRight < -sideEnvelope - peerClearance) continue;

                if (dForward < nearestForward) {
                  nearestForward = dForward;
                  nearestRight = dRight;
                  nearestEffective = peerClearance;
                }
              }
            }

            let avoidanceMagnitude = 0;
            if (nearestForward < Infinity) {
              // Steer AWAY: if obstacle is to the AI's right (dRight > 0), I turn LEFT (negative yaw). Closer in dForward = more urgent.
              const urgency = 1 - nearestForward / lookahead;
              const lateralBudget =
                nearestEffective + sideEnvelope - Math.abs(nearestRight);
              const lateralUrgency = clamp(
                lateralBudget / (nearestEffective + sideEnvelope),
                0,
                1,
              );
              const avoidanceYaw =
                -Math.sign(nearestRight || 1) *
                urgency *
                lateralUrgency *
                C.TURN_RATE_MAX *
                2.0;
              targetTurnRate += avoidanceYaw;
              avoidanceMagnitude = urgency * lateralUrgency;
            }
            // Stash for the clamp below — accessed AFTER this scope ends.
            this._lastAvoidanceMag = avoidanceMagnitude;
          }

          // Adaptive turn-rate cap. Normally TURN_RATE_MAX; during a high-urgency dodge the AI gets up to 2× authority.
          // Without this expansion the avoidance yaw saturates at the same rate as chase steer → bike can't dodge tightly-spaced trees → AI splatters itself on the forest.
          // With it, the AI can crank hard when a collision is imminent, like a real rider counter-steering. Mag is 0 when avoidance is inactive, so cap collapses back to TURN_RATE_MAX during normal chase.
          const adaptiveCap =
            C.TURN_RATE_MAX * (1 + (this._lastAvoidanceMag || 0));
          targetTurnRate = clamp(targetTurnRate, -adaptiveCap, adaptiveCap);

          // ---- 4. Lerp yaw rate toward target (visible lean buildup) ----
          const tk = 1 - Math.exp(-BC.TURN_LERP * dt);
          this.turnRate += (targetTurnRate - this.turnRate) * tk;

          // ---- 5. Integrate heading and forward motion ----
          this.heading += this.turnRate * dt;
          const fwdX = Math.sin(this.heading);
          const fwdZ = -Math.cos(this.heading);
          this.worldX += fwdX * this.speed * dt;
          this.worldZ += fwdZ * this.speed * dt;

          // ---- 6. Render transforms (in SCENE frame, not world) ----
          // Enemies are parented to scene (not worldGroup), same as the player.
          // I must apply the bike-pose-inverse manually here so the enemy appears at the correct scene position.
          //
          // Scene position: R(+bikeH) · (worldPos - bikePos), using the same convention as worldGroup. (See Game.update for derivation.)
          const cosH = Math.cos(bikeHeading);
          const sinH = Math.sin(bikeHeading);
          const relX = this.worldX - bikeX;
          const relZ = this.worldZ - bikeZ;
          const sceneX = cosH * relX + sinH * relZ;
          const sceneZ = -sinH * relX + cosH * relZ;
          this.group.position.set(sceneX, 0, sceneZ);

          // Scene rotation: bike's heading minus enemy's world heading.
          // (The bike's heading "rotates the camera"; the enemy's heading is relative to the world, so its scene yaw is the inverse.)
          // The HEADING_CORRECTION (-π) on _modelHolder is unchanged.
          this.group.rotation.y = bikeHeading - this.heading;

          // Visual lean derived from current turn rate (same as player).
          const targetLean =
            -clamp(this.turnRate / C.TURN_RATE_MAX, -1, 1) * BC.LEAN_MAX;
          this.lean = lerp(this.lean, targetLean, BC.LEAN_LERP * dt);
          this.group.rotation.z = this.lean;

          // Update bullet-collision bounds (still in WORLD coords for the Bullet class which works in world space).
          this.boundsCenter.set(this.worldX, 1.0, this.worldZ);
        }

        /** True if the enemy is currently in the visible/playable corridor. */
        isInRange(bikeX, bikeZ, bikeHeading) {
          const fwdX = Math.sin(bikeHeading);
          const fwdZ = -Math.cos(bikeHeading);
          // dForward > 0 = ahead of bike, < 0 = behind.
          const dForward =
            (this.worldX - bikeX) * fwdX + (this.worldZ - bikeZ) * fwdZ;
          return dForward < CONFIG.WORLD.FOREST_RADIUS * 1.5 && dForward > -20;
        }
      }

      /* ============================================================================
       * BULLETS (gameplay simulation). Pooled. Position + locked direction + lifetime; flies at BULLET.SPEED. Direction is locked at fire time (no bending in flight) — feels less arcadey than the original.
       * Visual is a Trail; trail speed matches BULLET.SPEED so visual and logical hits register together.
       * ============================================================================ */
      class Bullet {
        constructor() {
          this.active = false;
          this.worldX = 0;
          this.worldZ = 0;
          // Previous-frame position lets the update do a segment-vs-tree test (catches bullets that would tunnel through a thin trunk at ~1.8m per frame).
          this.prevX = 0;
          this.prevZ = 0;
          this.dirX = 0;
          this.dirZ = -1;
          this.life = 0;
          // Skip tree-collision test for one update after fire so a bullet fired while grazing a tree doesn't instantly die inside the bike's own graze zone.
          this.justFired = false;
        }
        fire(originX, originZ, dirX, dirZ) {
          this.active = true;
          this.worldX = originX;
          this.worldZ = originZ;
          this.prevX = originX;
          this.prevZ = originZ;
          this.dirX = dirX;
          this.dirZ = dirZ;
          this.life = CONFIG.BULLET.LIFETIME;
          this.justFired = true;
        }
        update(dt) {
          if (!this.active) return;
          this.prevX = this.worldX;
          this.prevZ = this.worldZ;
          const v = CONFIG.BULLET.SPEED * dt;
          this.worldX += this.dirX * v;
          this.worldZ += this.dirZ * v;
          this.life -= dt;
          if (this.life <= 0) this.active = false;
        }
      }

      /* ============================================================================
       * INPUT
       * Mode-aware:
       *   - Desktop (pointer:fine + no touch): keyboard only. No pointer listeners are installed, so menu/HUD clicks don't accidentally fire bullets.
       *   - Touch-only: split-screen — fixed-position nipplejs joystick (#joy) in the lower-left for steering/throttle, tap-to-fire (#firePad) over the right half. Independent multi-touch.
       *
       * Both modes return the same `poll()` shape: {steer, throttle, fire}.
       * ============================================================================ */
      class Input {
        constructor() {
          this.keys = Object.create(null);
          this.firePressed = false; // edge-triggered (one-shot)
          this._joySteer = 0;
          this._joyThrottle = 0;

          // Smoothed analog values — keyboard is binary (key down = ±1) which feels jarring when you tap-and-release.
          // I low-pass it through these so a key press ramps up to ±1 over a short rise time, and release decays back to 0 over a fall time.
          // Joystick / nipple already gives analog values, so I bypass smoothing when those are active.
          this._smoothedSteer = 0;
          this._smoothedThrottle = 0;

          this.touchOnly = isTouchOnly();

          // Keyboard listeners — always installed (a touch-only device with a bluetooth keyboard still works fine).
          window.addEventListener("keydown", (e) => {
            if (e.altKey && e.code.toLowerCase() === "enter") {
              e.preventDefault();
              toggleFullscreen();
            }

            if (
              [
                "Space",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
              ].includes(e.code)
            ) {
              e.preventDefault();
            }
            if (!this.keys[e.code] && e.code === "Space") {
              this.firePressed = true; // edge-trigger on press transition
            }
            this.keys[e.code] = true;
          });
          window.addEventListener("keyup", (e) => {
            this.keys[e.code] = false;
          });

          if (this.touchOnly) {
            const help = document.getElementById("helpPanel");
            if (help) {
              help.innerHTML =
                "<b>joystick (lower-left):</b> steer / throttle<br />" +
                "tap anywhere else to fire";
            }
            this._initNipple();
          }
        }

        /**
         * Touch mode: fixed-position nipplejs joystick in the lower-left for steering and throttling; tap anywhere on the right half to fire. Two independent zones so the player can drive and shoot simultaneously with both thumbs.
         */
        _initNipple() {
          const joyEl = document.getElementById("joy");
          const fireEl = document.getElementById("firePad");
          if (!joyEl || !fireEl) {
            console.warn("Input: touch zones missing; touch input disabled.");
            return;
          }
          joyEl.style.display = "block";
          fireEl.style.display = "block";

          // nipplejs static mode: one joystick, placed at `position` within the zone. The zone's CSS (lower-left of screen) handles screen placement; `position` centers the joystick inside the zone.
          const joy = nipplejs.create({
            zone: joyEl,
            mode: "static",
            position: { left: "50%", top: "50%" },
            restJoystick: true,
            color: {
              front: "linear-gradient(135deg, #818cf8, #38bdf8)",
              back: "rgba(99, 102, 241, 0.12)",
            },
            size: 110,
            threshold: 0.1,
            fadeTime: 150,
          });
          joy.on("move", (evt) => {
            const v = evt.data && evt.data.vector;
            if (!v) return;
            // nipplejs: x ∈ [-1,1] right, y ∈ [-1,1] up.
            this._joySteer = clamp(v.x, -1, 1);
            this._joyThrottle = clamp(v.y, -1, 1);
          });
          let joyTouches = 0;
          const onTouchStart = (e) => {
            joyTouches += e.changedTouches.length;
          };
          const onTouchEndOrCancel = (e) => {
            joyTouches = Math.max(0, joyTouches - e.changedTouches.length);
            if (joyTouches === 0) {
              this._joySteer = 0;
              this._joyThrottle = 0;
            }
          };
          joyEl.addEventListener("touchstart", onTouchStart, { passive: true });
          joyEl.addEventListener("touchend", onTouchEndOrCancel, {
            passive: true,
          });
          joyEl.addEventListener("touchcancel", onTouchEndOrCancel, {
            passive: true,
          });

          // Fire pad: tap to fire. changedTouches filter so a joystick finger drifting over the right half doesn't trigger a shot.
          fireEl.addEventListener(
            "touchstart",
            (e) => {
              for (const t of e.changedTouches) {
                if (t.target === fireEl) {
                  this.firePressed = true;
                  break;
                }
              }
            },
            { passive: true },
          );
        }

        /**
         * Returns the current input state and CLEARS edge-triggered events.
         * @param {number} dt time since last frame in seconds, used to smooth keyboard input toward target ±1.
         */
        poll(dt) {
          const k = this.keys;
          let rawSteer = 0,
            rawThrottle = 0;
          if (k.KeyA || k.ArrowLeft) rawSteer -= 1;
          if (k.KeyD || k.ArrowRight) rawSteer += 1;
          if (k.KeyW || k.ArrowUp) rawThrottle += 1;
          if (k.KeyS || k.ArrowDown) rawThrottle -= 1;

          // Smooth keyboard inputs toward the raw target. Time constants:
          //   STEER_RISE  : seconds to go from 0 to ~63% of full deflection
          //   STEER_FALL  : seconds for the bike to "let off" when key released
          // Throttle uses similar but slightly longer constants since it's less twitchy by nature. Frame-rate-independent via 1 - exp(-k·dt).
          const STEER_K = 12; // 1/STEER_K ≈ 83ms to reach 63% — feels analog
          const THROT_K = 6; // ~167ms — matches engine response feel
          const sk = 1 - Math.exp(-STEER_K * dt);
          const tk = 1 - Math.exp(-THROT_K * dt);
          this._smoothedSteer += (rawSteer - this._smoothedSteer) * sk;
          this._smoothedThrottle += (rawThrottle - this._smoothedThrottle) * tk;

          // Joystick (touch / gamepad) takes precedence and bypasses smoothing.
          // Nipple already returns smooth analog values; stacking smoothing on top would feel sluggish.
          let steer = this._smoothedSteer;
          let throttle = this._smoothedThrottle;
          if (this._joySteer !== 0) steer = this._joySteer;
          if (this._joyThrottle !== 0) throttle = this._joyThrottle;

          const fire = this.firePressed;
          this.firePressed = false;

          // NO AUTO-FIRE ANYWHERE
          // Must tap Space (keyboard) or tap the fire pad (mobile) for every single shot.
          // Holding Space or holding on the fire pad will NOT fire continuously.
          return {
            steer: clamp(steer, -1, 1),
            throttle: clamp(throttle, -1, 1),
            fire: fire, // edge-triggered only
          };
        }
      }

      /* ============================================================================
       * CHASE CAMERA
       * Camera is FIXED in scene space because the bike sits at scene origin and the world rotates around it. Camera lives at (0, height, BACK) looking down -Z.
       * As the player steers, the world rotates — the camera doesn't have to chase anything. Just a small bob and a roll-with-lean for chase-cam feel.
       * ============================================================================ */
      class ChaseCamera {
        constructor(camera) {
          this.camera = camera;
          this._lookAt = new Vector3();
          this._bobT = 0;
          this._engT = 0;
          this._pitch = 0;
          this._prevSpeed = 0;
          // Impact kick: decaying offset applied each frame from a graze or collision. Set by kick(); decays at ~12/s (≈80ms half-life) so a single jolt is felt and gone fast.
          this._kickX = 0;
          this._kickY = 0;
        }

        // Apply an impact impulse. dx/dy in meters; gets added to the camera offset and decays each frame. Cheap, allocation-free.
        kick(dx, dy) {
          this._kickX += dx;
          this._kickY += dy;
        }

        update(dt, bikeSpeed, bikeLean) {
          const C = CONFIG.CAMERA;
          const speedFrac = bikeSpeed / CONFIG.BIKE.SPEED_MAX;

          const bodyRate = 2.0 + Math.sqrt(Math.max(0, bikeSpeed)) * 1.1;
          this._bobT += dt * bodyRate;
          const bodyBob = Math.sin(this._bobT) * 0.022 * speedFrac;

          this._engT += dt * 18;
          const engineVib = Math.sin(this._engT) * 0.003 * (0.4 + speedFrac);

          const roadBucket = ((this._bobT * 4) | 0) ^ 0x9e3779b9;
          const r =
            ((roadBucket * 1664525 + 1013904223) >>> 0) / 0xffffffff - 0.5;
          const roadKick = r * 0.006 * speedFrac;

          const accel = (bikeSpeed - this._prevSpeed) / Math.max(dt, 1e-3);
          this._prevSpeed = bikeSpeed;
          const targetPitch = clamp(accel * 0.008, -0.06, 0.06);
          this._pitch += (targetPitch - this._pitch) * Math.min(1, dt * 6);

          // Impact kick decay (exp falloff).
          const kickDecay = Math.exp(-dt * 12);
          this._kickX *= kickDecay;
          this._kickY *= kickDecay;

          this.camera.position.set(
            this._kickX,
            C.HEIGHT + bodyBob + engineVib + roadKick + this._kickY,
            C.BACK,
          );

          this._lookAt.set(
            0,
            C.LOOK_HEIGHT + this._pitch * C.LOOK_AHEAD,
            -C.LOOK_AHEAD,
          );
          this.camera.lookAt(this._lookAt);
          this.camera.rotation.z = bikeLean * 0.15;
        }
      }

      /* ============================================================================
       * GAME — top-level state machine and scene orchestration.
       *
       * Owns: scene, renderer, camera, all subsystems. The frame loop calls `update(dt, elapsed)` then `render()` in that order.
       *
       * State machine:
       *   STAGE_INTRO → PLAYING → STAGE_CLEARED → (next stage) STAGE_INTRO
       *                       ↘ DEAD → GAME_OVER
       * ============================================================================ */
      const GameState = {
        STAGE_INTRO: "STAGE_INTRO",
        PLAYING: "PLAYING",
        STAGE_CLEARED: "STAGE_CLEARED",
        DEAD: "DEAD",
        GAME_OVER: "GAME_OVER",
      };

      class Game {
        constructor(container) {
          this.container = container;

          // ---- Renderer ----
          this.renderer = new WebGLRenderer({
            antialias: true,
            precision: "highp",
            powerPreference: "high-performance",
          });
          this.renderer.setSize(container.clientWidth, container.clientHeight);
          this.renderer.physicallyCorrectLights = true;
          this.renderer.outputColorSpace = SRGBColorSpace;
          this.renderer.toneMapping = ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = CONFIG.FOREST.EXPOSURE;
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = PCFShadowMap;
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          container.appendChild(this.renderer.domElement);

          // KTX2Loader needs the renderer to detect which transcoded texture formats this GPU supports (BC7, ASTC, etc). Must be called BEFORE the first GLB load that contains a KTX2 texture.
          attachKTX2Renderer(this.renderer);

          // ---- Scene + Camera ----
          this.scene = new Scene();
          this.camera = new PerspectiveCamera(
            CONFIG.CAMERA.FOV,
            container.clientWidth / container.clientHeight,
            CONFIG.CAMERA.NEAR,
            CONFIG.CAMERA.FAR,
          );
          this.chaseCam = new ChaseCamera(this.camera);

          // ---- Sky system ----
          // Sky / clouds / stars belong in a group that ROTATES with the world (matching worldGroup's rotation) but does NOT translate — they read as infinitely distant from any practical bike position,
          // so translation would be wasted (and at large bike distances introduce precision wobble). Result: as the bike yaws, clouds and stars are "left behind" in the rotation, exactly like real-world horizon parallax.
          this.skyGroup = new Group();
          this.scene.add(this.skyGroup);

          this.skybox = new Skybox();
          this.skyGroup.add(this.skybox);
          // Sun light, however, must stay in scene root — it casts shadows on world objects and its shadow camera is positioned in world space.
          this.scene.add(this.skybox.sun);
          this.scene.add(this.skybox.sun.target);

          // Hemisphere light for ambient bounce — supplements skybox's ambient.
          this.hemiLight = new HemisphereLight(0xa0c0ff, 0x4a5238, 0.6);
          this.scene.add(this.hemiLight);

          this.clouds = new Clouds();
          this.skyGroup.add(this.clouds);
          this.stars = new Stars(3000);
          this.stars.setVisible(false);
          this.skyGroup.add(this.stars);

          // Day/night orchestration
          this.skybox.onTimeOfDayChanged = (tod) => {
            const isNight = tod === "Nighttime";
            this.stars.setVisible(isNight);
            // Hemisphere intensity tracks sky brightness
            this.hemiLight.intensity = isNight ? 0.25 : 0.6;
            // Ground darkens at night. I add a slight emissive so areas outside the headlight cone still read as ground (otherwise night-mode looks like a void with a floating light pool).
            if (this.ground) {
              const m = this.ground.material;
              if (isNight) {
                m.color.setHex(0x3d4a3c);
                m.emissive
                  ? m.emissive.setHex(0x0a0d12)
                  : (m.emissive = new Color(0x0a0d12));
                m.emissiveIntensity = 1.0;
              } else {
                m.color.setHex(0x5a8050);
                if (m.emissive) m.emissive.setHex(0x000000);
              }
            }
            this.clouds.setCloudColor(
              isNight ? new Color(0.15, 0.18, 0.3) : new Color(1.0, 1.0, 1.0),
            );
            // Bike headlights: spotlight + emissive disc + glow halo on at night. Player gets the full rig; enemies get just the spot.
            if (this.bike) this.bike.setNightMode(isNight);
            if (this.enemies) {
              for (const e of this.enemies) e.setNightMode(isNight);
            }
          };

          // ---- World group ----
          // Holds everything that lives in WORLD coordinates (forest, enemies, particles, bullet trails).
          // Each frame I apply the bike's inverse pose to this group: the world rotates around the bike and translates so the bike's worldX/worldZ ends up at scene origin.
          // This makes "the world moves around a stationary bike" trivial — every world-coord subsystem just stores its raw position and the group transform handles render.
          //
          // Things NOT in this group:
          //   - bike mesh (always at scene origin)
          //   - ground (always under the bike — see below)
          //   - skybox / clouds / stars (translate-invariant, scene root)
          this.worldGroup = new Group();
          this.scene.add(this.worldGroup);

          // ---- Ground ----
          // Big circular ground always centered on the bike (which sits at scene origin).
          // The disc geometry NEVER rotates with the bike — it stays in its fixed scene-space orientation.
          // The visible ground motion is produced entirely by manipulating the normalMap's UV transform matrix each frame so a fixed world-point always samples the same texel.
          //
          // Why a manual matrix rather than offset+rotation: Three.js's automatic UV transform composes as a single rotation + scale + translation, but its rotation matrix is clockwise (`[c, s; -s, c]`) and the disc's -π/2 X-flip makes the v-axis of UVs map to world -Z (sign flip on one axis).
          // The combination doesn't fit a clockwise rotation alone — you need an arbitrary 2D affine. So I set `matrixAutoUpdate = false` and write the 3x3 directly.
          const groundGeo = new CircleGeometry(500, 64);
          const normalMap = createGroundNormalMap();
          normalMap.wrapS = normalMap.wrapT = RepeatWrapping;
          normalMap.matrixAutoUpdate = false; // drive matrix manually
          const groundMat = new MeshStandardMaterial({
            color: 0x5a8050,
            roughness: 0.95,
            normalMap,
            normalScale: new Vector2(0.4, 0.4),
          });
          this.ground = new Mesh(groundGeo, groundMat);
          this.ground.rotation.x = -Math.PI / 2;
          this.ground.receiveShadow = true;
          this.scene.add(this.ground);
          this._groundNormalMap = normalMap;

          // ---- Forest ----
          // I rebuild forest per stage (tree count ramps up). Hold a slot.
          this.forest = null;
          this._leafTexture = createLeafTexture();
          this._barkTexture = createBarkTexture();

          // ---- Bike (player) ----
          this.bike = new Bike();
          this.scene.add(this.bike.group);

          // ---- Enemies (pool of 2, instantiated once) ----
          this.enemies = [new EnemyBike(0), new EnemyBike(1)];
          // Enemies are parented directly to the SCENE (not worldGroup) so that there's no double-rotation between worldGroup's bike-pose inverse and the enemy's own heading.
          // Each frame, EnemyBike.update computes scene position/rotation from world-frame state, the same way the player Bike does.
          for (const e of this.enemies) this.scene.add(e.group);

          // ---- Shared GLB model load ----
          // One load services BOTH the player and the AI bikes. The promise resolves with up to 2 subtrees from the GLB; I use index 0 for every bike (cloning per consumer).
          loadBikeModelsAsync(assetURL(CONFIG.ENEMY.MODEL.URL)).then(
            (subtrees) => {
              const src = subtrees[0];
              for (let i = 0; i < this.enemies.length; i++) {
                this.enemies[i].setModel(src.clone(true));
              }
              this.bike.setModel(src.clone(true));
            },
          );

          // Cosmetic GLB attachments — player arms and enemy riders.
          // Both loaded in parallel with the bike. Failures are non-fatal: a missing rider just means enemies look like ghost bikes; a missing arms just means the player has no hands.
          //
          // Helper: take a root Object3D, configure it for use as a bike attachment (no shadows, no transparency sorting issues), apply the placement transform, and parent to a bike's group.
          // Same prep regardless of which character.
          //
          // `alwaysVisible`: skip frustum culling. True for the player's arms (always on-screen in the cockpit view, and a complex rigged mesh confuses Three.js's bounds estimation). False for enemy riders (they go far off-screen — frustum culling wins back GPU draw calls).
          const attachCosmetic = (root, cfg, bikeGroup, alwaysVisible) => {
            root.position.set(cfg.POS.x, cfg.POS.y, cfg.POS.z);
            root.rotation.set(cfg.ROT.x, cfg.ROT.y, cfg.ROT.z);
            root.scale.setScalar(cfg.SCALE);
            root.traverse((node) => {
              if (node.isMesh) {
                node.castShadow = false;
                node.receiveShadow = false;
                node.frustumCulled = !alwaysVisible;
                const mats = Array.isArray(node.material)
                  ? node.material
                  : [node.material];
                for (const m of mats) {
                  if (m) m.depthWrite = true;
                }
              }
            });
            bikeGroup.add(root);
          };

          // Player arms — one instance, parented to the player bike.
          // alwaysVisible=true: cockpit view, must not cull.
          loadGlbAsync(assetURL(CONFIG.ARMS.URL)).then((armsRoot) => {
            if (!armsRoot || !this.bike) return;
            attachCosmetic(armsRoot, CONFIG.ARMS, this.bike.group, true);
            this.bike._arms = armsRoot;
          });

          // Enemy riders — clone one instance per enemy bike. The source scene is the template; each enemy gets a deep clone so they can be transformed and respawned independently. alwaysVisible=false: distant enemies should cull normally.
          //
          // Per-rider unique suit color via applyRiderSuitTint. The hue shift is picked relative to the enemy's bike color so the rider and bike never wear the same shade. A small chance of "black suit" gives some riders a sinister look.
          loadGlbAsync(assetURL(CONFIG.RIDER.URL)).then((riderSrc) => {
            if (!riderSrc) return;
            for (const enemy of this.enemies) {
              const riderInstance = riderSrc.clone(true);

              // Each rider needs its own MATERIAL instance, otherwise they'd all share uniforms and end up the same color. The cheapest approach: clone every material I touch.
              const tintedMaterials = new Set();
              riderInstance.traverse((node) => {
                if (!node.isMesh || !node.material) return;
                if (Array.isArray(node.material)) {
                  node.material = node.material.map((m) => {
                    if (!m) return m;
                    const c = m.clone();
                    tintedMaterials.add(c);
                    return c;
                  });
                } else {
                  node.material = node.material.clone();
                  tintedMaterials.add(node.material);
                }
              });

              // Pick a suit treatment.
              //   ~15% of riders get a black suit (no hue shift used). The rest get a hue shift chosen to differ from the bike's hue by at least 0.18 (~65° on the wheel) so bike and rider read as distinct.
              const blackSuit = Math.random() < 0.15;
              let hueShift = 0;
              if (!blackSuit) {
                // Source suit is reddish (~hue 0.0). hueShift is added to that, so final suit hue ≈ hueShift. Pick anywhere on the wheel, then nudge if too close to the bike.
                hueShift = Math.random();
                const bikeHue = enemy._bikeHue;
                if (bikeHue !== undefined) {
                  let dist = Math.abs(hueShift - bikeHue);
                  if (dist > 0.5) dist = 1 - dist; // wheel wrap
                  if (dist < 0.18) {
                    // Push 0.25 around the wheel from the bike hue.
                    hueShift = (bikeHue + 0.25 + Math.random() * 0.5) % 1;
                  }
                }
              }

              for (const m of tintedMaterials) {
                applyRiderSuitTint(m, hueShift, blackSuit);
              }

              attachCosmetic(riderInstance, CONFIG.RIDER, enemy.group, false);
              enemy._rider = riderInstance;
            }
          });

          // ---- Bullets ----
          this.bullets = [];
          for (let i = 0; i < CONFIG.BULLET.POOL; i++)
            this.bullets.push(new Bullet());

          // ---- Visual subsystems ----
          // Bullet trails: parented to worldGroup so they sit in WORLD space.
          // Each fire stores muzzle/target in world coords; once a shot leaves the gun, its visual stays world-fixed even as the bike turns around. Worldgroup's per-frame bike-pose-inverse converts those world coords to the correct scene render position.
          this.bulletTrails = new BulletTrailManager(this.worldGroup);
          // Particles also ARE in world space — they should appear at world crash/kill positions and move with the world as you turn.
          this.particles = new ParticleSystem(this.worldGroup);

          // ---- Input ----
          this.input = new Input();

          // ---- Game state ----
          this.state = GameState.STAGE_INTRO;
          this.stage = 1;
          this.score = 0;
          this.lives = CONFIG.GAME.LIVES;
          this.kills = 0;
          this.targetsRemaining = CONFIG.ENEMY.COUNT_PER_STAGE;
          this.elapsed = 0;
          this._stateTimer = 0;
          this._gameTime = new Date(); // wall-clock used by skybox
          // Lifetime odometer in meters. Accumulates while bike is alive and game is in PLAYING / STAGE_CLEARED states. Persists across stage transitions and respawns; only zeroed by a fresh game.
          this._odoMeters = 0;
          // Per-stage trip distance (meters). Resets at the start of each stage (via _beginStage / _advanceStage) and on respawn.
          this._tripMeters = 0;
          // Pause flag — when true, frame loop skips update() but still renders.
          // Toggled by ESC in the bootstrap; auto-set on visibilitychange/blur.
          this.paused = false;

          // Audio: player engine loop id is set lazily on first audio frame and persists across the whole game; pitch is modulated each frame. The listener position is recomputed from the bike's worldX/Z each frame (no scratch needed).
          this._engineId = null;

          // Tree graze tracking — see _checkTreeCollision. -1 = no tree currently within the outer ring.
          this._lastGrazedTreeIdx = -1;
          this._grazeRefractory = 0;

          // Corner HTML HUD refs — only the elements that remain in the overlay (score + flash banners). Stage / lives / targets / speed all live on the in-bike dashboard now.
          this.hud = {
            score: document.getElementById("hScore"),
            crosshair: document.getElementById("crosshair"),
            flash: document.getElementById("flash"),
            banner: document.getElementById("banner"),
            gameover: document.getElementById("gameover"),
            goSub: document.getElementById("goSub"),
            stats: document.getElementById("stats"),
          };

          // Hot-path scratch — vectors used inside update()/render()
          this._sMuzzle = new Vector3();
          this._sBulletPos = new Vector3();
          this._sTrailTarget = new Vector3();
          this._sCamWorld = new Vector3();

          // FPS smoothing
          this._frameAcc = 0;
          this._frameCount = 0;

          // Start stage 1
          this._beginStage(1);
        }

        /* ------------------------------------------------------------------
         * Stage lifecycle
         * ------------------------------------------------------------------ */

        // Time-of-day check. Used for banner subtitle and any other gameplay that branches on dark/light hours. Game clock advances continuously via TIME_SCALE in update().
        _isNightHr() {
          const hr = this._gameTime.getHours();
          return hr < 6 || hr >= 21;
        }

        // Spawn (or respawn) all enemies ahead of the bike with alternating left/right lane hints so they don't stack up.
        _spawnEnemiesAhead() {
          for (let i = 0; i < this.enemies.length; i++) {
            this.enemies[i].respawn(
              this.bike.worldX,
              this.bike.worldZ,
              this.bike.heading,
              this.forest,
              i % 2 === 0 ? -1 : 1,
              this.stage,
            );
          }
        }

        // Stage entry. Single source of truth for both "new game / after death" (resetPose=true, also seeds time-of-day on stage 1 and rebuilds forest if tree-count changed) and "stage cleared, keep playing" (resetPose=false, leaves world as-is).
        _enterStage(stageNum, { resetPose, introDur, subtitleStyle }) {
          this.stage = stageNum;
          this.targetsRemaining = CONFIG.ENEMY.COUNT_PER_STAGE;
          this._tripMeters = 0;

          if (!this._gameTime) this._gameTime = new Date();
          if (resetPose && stageNum === 1) {
            this._gameTime.setHours(2, 0, 0, 0);
          }

          if (resetPose) {
            const treeCount = Math.min(
              CONFIG.WORLD.TREE_COUNT_BASE +
                (stageNum - 1) * CONFIG.WORLD.TREE_COUNT_PER_STAGE,
              CONFIG.WORLD.TREE_COUNT_MAX,
            );
            if (!this.forest || this.forest.treeCount !== treeCount) {
              if (this.forest) {
                this.worldGroup.remove(this.forest.group);
                this.forest.dispose();
              }
              this.forest = new InstancedForest(
                treeCount,
                CONFIG.WORLD.FOREST_RADIUS,
                stageNum,
              );
              this.forest.build(this._leafTexture, this._barkTexture);
              this.worldGroup.add(this.forest.group);
            } else if (this.state === GameState.DEAD) {
              this.forest.redistributeAround(0, 0);
            }

            this.bike.worldX = 0;
            this.bike.worldZ = 0;
            this.bike.heading = 0;
            this.bike.turnRate = 0;
            this.bike.speed = CONFIG.BIKE.SPEED_INIT;
            this.bike.alive = true;
            this.bike.lean = 0;
            this.bike.group.rotation.z = 0;
            this.bike.group.visible = true;
          }

          this._spawnEnemiesAhead();

          // Banner subtitle differs between modes: a verbose "DAY/NIGHT PATROL" on full stage starts, a terser "DAY/NIGHT" on mid-game transitions (player is already engaged, less ceremony).
          const night = this._isNightHr();
          const sub =
            subtitleStyle === "verbose"
              ? night
                ? "NIGHT PATROL"
                : "DAY PATROL"
              : night
                ? "NIGHT"
                : "DAY";
          this._showBanner(`STAGE ${stageNum}`, sub);

          this.state = GameState.STAGE_INTRO;
          this._stateTimer = introDur;
        }

        _beginStage(stageNum) {
          this._enterStage(stageNum, {
            resetPose: true,
            introDur: 2.0,
            subtitleStyle: "verbose",
          });
        }

        _advanceStage() {
          this._enterStage(this.stage + 1, {
            resetPose: false,
            introDur: 1.0,
            subtitleStyle: "terse",
          });
        }

        _showBanner(title, sub) {
          const el = this.hud.banner;
          el.innerHTML = title + (sub ? `<small>${sub}</small>` : "");
          el.classList.add("show");
          clearTimeout(this._bannerTimer);
          this._bannerTimer = setTimeout(
            () => el.classList.remove("show"),
            1800,
          );
        }

        _showPopup(text, color = "#ffd000") {
          const el = document.createElement("div");
          el.className = "popup";
          el.textContent = text;
          // Vertical position only — horizontal centering is handled by CSS (.popup { left: 50%; transform: translateX(-50%) }).
          el.style.top = window.innerHeight * 0.45 + "px";
          el.style.color = color;
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1300);
        }

        _flashHit() {
          this.hud.flash.classList.add("on");
          setTimeout(() => this.hud.flash.classList.remove("on"), 350);
        }

        /* ------------------------------------------------------------------
         * Frame update — fixed call order. Hot path.
         * ------------------------------------------------------------------ */
        update(dt, elapsed) {
          this.elapsed = elapsed;
          this._stateTimer -= dt;

          // ---- TIME-OF-DAY ADVANCE ----
          // Game-time ticks faster than wall time so a full day/night cycle unfolds during play. Two scales:
          //   - PLAYING:    240x → full 24h cycle takes 6 minutes
          //   - TRANSITION: 5400x → ~5 game-hours pass in ~3.3 real seconds (fast enough to feel like "time is jumping forward", slow enough that the sky smoothly animates rather than snapping)
          //   - DEAD / GAME_OVER: 0 (frozen). The bike is stationary; I don't want sun-direction lerps drifting the shadows while everything else is still — that reads as a creepy "world breathing" bug.
          // The skybox reads this._gameTime each frame and updates sun position, sky colors, and triggers onTimeOfDayChanged at threshold crossings.
          let TIME_SCALE = 240;
          if (this.state === GameState.STAGE_CLEARED) TIME_SCALE = 5400;
          else if (
            this.state === GameState.DEAD ||
            this.state === GameState.GAME_OVER
          )
            TIME_SCALE = 0;
          this._gameTime = new Date(
            this._gameTime.getTime() + dt * 1000 * TIME_SCALE,
          );
          // Day/night reads from the world lighting itself; no separate overlay text to keep in sync.
          // ---- 1. INPUT ----
          const inputs = this.input.poll(dt);

          // ---- 2. STATE TRANSITIONS ----
          switch (this.state) {
            case GameState.STAGE_INTRO:
              if (this._stateTimer <= 0) this.state = GameState.PLAYING;
              // Don't fire during intro
              inputs.fire = false;
              break;

            case GameState.STAGE_CLEARED:
              // Coast for a moment, then begin next stage WITHOUT teleporting the bike. The player just earned the right to keep their momentum and direction; only the enemies should reset.
              if (this._stateTimer <= 0) {
                this._advanceStage();
              }
              inputs.fire = false;
              break;

            case GameState.DEAD:
              if (this._stateTimer <= 0) {
                if (this.lives <= 0) {
                  this._enterGameOver();
                } else {
                  // Respawn — keep stage/score, restart enemies
                  this._beginStage(this.stage);
                }
              }
              inputs.fire = false;
              inputs.steer = 0;
              inputs.throttle = -1; // brake
              break;

            case GameState.GAME_OVER:
              // Frozen
              inputs.fire = false;
              inputs.steer = 0;
              inputs.throttle = 0;
              return;
          }

          // ---- 3. BIKE ----
          const speed = this.bike.update(dt, inputs);
          const bikeX = this.bike.worldX;
          const bikeZ = this.bike.worldZ;
          const bikeH = this.bike.heading;
          // Bike's forward unit vector in world space
          const bikeFwdX = Math.sin(bikeH);
          const bikeFwdZ = -Math.cos(bikeH);

          // Lifetime odometer + per-stage trip: only accumulate while alive in PLAYING / STAGE_CLEARED / STAGE_INTRO. Crashed/dying bike's coast doesn't count.
          if (
            this.bike.alive &&
            (this.state === GameState.PLAYING ||
              this.state === GameState.STAGE_CLEARED ||
              this.state === GameState.STAGE_INTRO)
          ) {
            const ds = speed * dt;
            this._odoMeters += ds;
            this._tripMeters += ds;
          }

          // Cockpit HUD redraw (gated to ~10Hz internally).
          if (this.bike.hud) {
            // Format in-game time as 24h "HH:MM" — ties visually to the skybox sun position. Use _gameTime which the skybox also reads from, so the dash and world stay in lockstep.
            const t = this._gameTime;
            const hh = String(t.getHours()).padStart(2, "0");
            const mm = String(t.getMinutes()).padStart(2, "0");
            const timeStr = `${hh}:${mm}`;
            this.bike.hud.update(dt, speed, {
              odoMeters: this._odoMeters,
              tripMeters: this._tripMeters,
              timeStr,
              stage: this.stage,
              lives: this.lives,
              targets: this.targetsRemaining,
            });
          }

          // ---- 8. FIRE ----
          if (inputs.fire && this.bike.tryFire()) {
            const fwdX = Math.sin(this.bike.heading);
            const fwdZ = -Math.cos(this.bike.heading);
            this._fireBullet(this.bike.worldX, this.bike.worldZ, fwdX, fwdZ);
          }

          // ---- 5. BULLETS ----
          // Direction locked at fire time. Despawn past MAX_RANGE so hits never register beyond where the visual trail ends. Tree collision uses 3-sample segment-vs-tree (a 110 m/s bullet moves ~1.8m per frame and trees are ~0.6m wide — single-point tests could tunnel).
          const forest = this.forest;
          const maxRange = CONFIG.BULLET.MAX_RANGE;
          const maxRangeSq = maxRange * maxRange;
          const BULLET_R = 0.08;
          for (const b of this.bullets) {
            if (!b.active) continue;
            b.update(dt);
            const dx = b.worldX - bikeX,
              dz = b.worldZ - bikeZ;
            if (dx * dx + dz * dz > maxRangeSq) {
              b.active = false;
              continue;
            }
            // Spawn-frame skip: bullet may still be inside bike's graze zone.
            if (b.justFired) {
              b.justFired = false;
              continue;
            }
            if (forest) {
              const midX = (b.prevX + b.worldX) * 0.5;
              const midZ = (b.prevZ + b.worldZ) * 0.5;
              if (
                !forest.isClearAt(b.worldX, b.worldZ, BULLET_R) ||
                !forest.isClearAt(midX, midZ, BULLET_R) ||
                !forest.isClearAt(b.prevX, b.prevZ, BULLET_R)
              ) {
                b.active = false;
              }
            }
          }

          // ---- 6. ENEMIES + BULLET COLLISIONS + TREE COLLISIONS ----
          const ENEMY_BIKE_R = 0.35;
          const ENEMY_SEARCH_R = 2.0;

          for (const e of this.enemies) {
            if (!e.alive) continue;
            e.update(dt, elapsed, bikeX, bikeZ, bikeH, forest, this.enemies);

            // Auto-slingshot: an enemy that's fallen behind the player eventually teleports ahead so the chase keeps going. I gate this on BOTH distance AND time so the player can briefly outrun an enemy and turn back to engage them before they disappear.
            // The trigger is:
            //   - 50m behind (vs old 30m), OR
            //   - 4s of being behind us
            // The time gate lets the player slow-cruise and re-pass the enemy without it vanishing.
            const ex = e.worldX - bikeX,
              ez = e.worldZ - bikeZ;
            const dForward = ex * bikeFwdX + ez * bikeFwdZ;
            if (dForward < 0) {
              e._behindTimer = (e._behindTimer || 0) + dt;
            } else {
              e._behindTimer = 0;
            }
            if (dForward < -50 || e._behindTimer > 4) {
              const lane = this.enemies.indexOf(e) % 2 === 0 ? -1 : 1;
              e.respawn(bikeX, bikeZ, bikeH, forest, lane, this.stage);
              e._behindTimer = 0;
              continue;
            }

            // Bullet collision in WORLD coords (both bullets and enemies live there).
            let killed = false;
            for (const b of this.bullets) {
              if (!b.active) continue;
              const dxb = b.worldX - e.boundsCenter.x;
              const dzb = b.worldZ - e.boundsCenter.z;
              // Vertical check: bullets fly at ~MUZZLE_HEIGHT, enemy bounds at 1.0 — close enough
              if (dxb * dxb + dzb * dzb < e.boundsRadius * e.boundsRadius) {
                this._killEnemy(e);
                b.active = false;
                killed = true;
                break;
              }
            }
            if (killed) continue;

            // Enemy ↔ tree collision. AI bikes wreck on tree contact, but the player gets NO credit (no score, no stage progress) — the enemy just respawns ahead, fresh target. Otherwise a patient player could let the trees do all the work.
            if (forest) {
              const exw = e.worldX;
              const ezw = e.worldZ;
              for (let t = 0; t < forest.treeCount; t++) {
                const dx = forest.treePosX[t] - exw;
                if (dx > ENEMY_SEARCH_R || dx < -ENEMY_SEARCH_R) continue;
                const dz = forest.treePosZ[t] - ezw;
                if (dz > ENEMY_SEARCH_R || dz < -ENEMY_SEARCH_R) continue;
                const r = forest.treeRadius[t] + ENEMY_BIKE_R;
                if (dx * dx + dz * dz < r * r) {
                  this._enemySelfDestruct(e);
                  break;
                }
              }
            }
          }

          // ---- 6.5. PLAYER ↔ ENEMY COLLISION ----
          // Ramming an enemy at speed: both bikes go down. Player loses a life (standard DEAD path), enemy is killed (counts as a target toward stage completion — the player technically "got" them, even if the cost was high). Active during PLAYING and STAGE_CLEARED — same collision window as tree collisions.
          if (
            this.bike.alive &&
            (this.state === GameState.PLAYING ||
              this.state === GameState.STAGE_CLEARED)
          ) {
            const COMBINED_R = 0.35 + 0.45; // bike half-width + enemy half-width
            const COMBINED_R_SQ = COMBINED_R * COMBINED_R;
            for (const e of this.enemies) {
              if (!e.alive) continue;
              const dxp = e.worldX - bikeX;
              const dzp = e.worldZ - bikeZ;
              if (dxp * dxp + dzp * dzp < COMBINED_R_SQ) {
                this._killEnemy(e); // enemy goes boom (target counted)
                this._crashIntoTree(); // player goes down (life lost)
                break; // can only collide once per frame
              }
            }
          }

          // Active during PLAYING and STAGE_CLEARED — the post-victory coast isn't a free pass; you can still wreck your bike.
          if (
            this.bike.alive &&
            (this.state === GameState.PLAYING ||
              this.state === GameState.STAGE_CLEARED)
          ) {
            this._checkTreeCollision();
          }

          // ---- 8. WORLD STREAMING ----
          // Apply the bike's INVERSE POSE to the world group. I want a world point `w` to render at  R(heading) * (w - bikePos), so that:
          //   - the bike's worldX/worldZ ends up at scene origin,
          //   - the bike's heading direction aligns with screen-forward (-Z).
          //
          // Three.js applies a group's matrix as `T_group + R_group * child`. To get `R(h)*w - R(h)*bikePos`:
          //   R_group = R(heading)         → group.rotation.y = heading
          //   T_group = -R(heading)*bikePos
          if (this.forest) {
            const wg = this.worldGroup;
            wg.rotation.y = bikeH;
            const cosH = Math.cos(bikeH),
              sinH = Math.sin(bikeH);
            // R_y(h) * (bx, 0, bz) =  (cosH*bx + sinH*bz, 0, -sinH*bx + cosH*bz)
            wg.position.x = -(cosH * bikeX + sinH * bikeZ);
            wg.position.z = -(-sinH * bikeX + cosH * bikeZ);
            // Recycle trees that have fallen behind the bike (in 2D this time).
            this.forest.recycleBehind2D(bikeX, bikeZ, bikeH);
          }
          // Sky group rotates with the bike's heading too — but NO translation, so clouds and stars appear infinitely distant. As the bike yaws, the sky sweeps past the camera (parallax-correct).
          this.skyGroup.rotation.y = bikeH;

          // Ground UV transform — written as a manual 3×3 matrix each frame so a fixed world-point always samples the same texel regardless of bike position or heading. Disc geometry stays in its fixed orientation (no rotation.y); all motion is expressed in the texture matrix.
          //
          // Derivation. A disc vertex at scene origin's render-space `(g_x, 0, -g_y)` (after the disc's -π/2 X-flip) corresponds to world point
          //
          //   W = bikePos + R(-h) · scene
          //
          // where R(-h) is the inverse worldGroup Y-rotation. Working through the rotation in Three.js's right-handed convention:
          //
          //   W_x = bikeX + g_x·cos(h) + g_y·sin(h)
          //   W_z = bikeZ + g_x·sin(h) - g_y·cos(h)
          //
          // I want each disc vertex to sample texel `(W_x/TILE, -W_z/TILE)` so the pattern is locked to world coordinates (the v negation makes forward motion = positive v scroll = texels flowing toward camera).
          //
          // With `g_x = 2r(u-0.5)`, `g_y = 2r(v-0.5)`, `R = 2r/TILE`, the resulting affine on `[u, v, 1]` is:
          //
          //   sampled_u =  R·cos(h)·u + R·sin(h)·v + (bikeX/TILE + 0.5·(1 - R·cos h - R·sin h))
          //   sampled_v = -R·sin(h)·u + R·cos(h)·v + (-bikeZ/TILE + 0.5·(1 + R·sin h - R·cos h))
          //
          // Properties (matching the user's mental model exactly):
          //   - speed=0, h changes: bikeX/bikeZ constant. World point's sampled_u = R·cos(h)·u_old + R·sin(h)·v_old + const. As h rotates, the (u,v) of the vertex sitting over a fixed world point ALSO rotates such that the combination `R·cos·u + R·sin·v` stays constant → same texel. Pattern stays world-fixed. ✓
          //   - speed>0, h=0: bikeZ decreases each frame → -bikeZ/TILE increases → sampled_v at every vertex increases → texels appear at lower v (closer to camera). Forward motion = texels flow toward you. ✓
          //   - 180° turn + drive back: bikeX/Z return to a previous value, h+π rotation block produces same sampled_uv at the original world point → red dot reappears in the same world position. ✓
          const r = 500,
            RR = 80; // 80 repeats across diameter — 12.5m/tile
          const TILE = (2 * r) / RR;
          const cosH = Math.cos(bikeH),
            sinH = Math.sin(bikeH);
          const a = RR * cosH;
          const b = RR * sinH;
          const c = bikeX / TILE + 0.5 * (1 - RR * cosH - RR * sinH);
          const d = -RR * sinH;
          const e = RR * cosH;
          const f = -bikeZ / TILE + 0.5 * (1 + RR * sinH - RR * cosH);
          this._groundNormalMap.matrix.set(a, b, c, d, e, f, 0, 0, 1);

          // ---- 9. VISUAL SUBSYSTEMS ----
          // Bullet trails live in world space (parented to worldGroup), so the fog uniform needs the bike's WORLD position, not (0, 0).
          this.bulletTrails.setPlayerXZ(bikeX, bikeZ);
          this.bulletTrails.update();
          // Particles run entirely on GPU; this just bumps uTime and the player position uniform for fog.
          this.particles.update(elapsed, bikeX, bikeZ);
          if (this.forest) this.forest.updateTime(elapsed);
          this.clouds.update(dt, this.camera.position);
          this.stars.update(elapsed);

          // ---- 10. SKYBOX (after bike position is final) ----
          // Skip during DEAD/GAME_OVER: with `_gameTime` frozen above the lerp would still chase the LAST target for a few frames after the crash, producing a subtle shadow drift while the bike sits still.
          // Snapping means the sun freezes the moment the player crashes.
          if (
            this.state !== GameState.DEAD &&
            this.state !== GameState.GAME_OVER
          ) {
            this.skybox.update(
              this._gameTime,
              this.bike.group.position,
              this.bike.heading,
            );
          }

          // ---- 11. CAMERA ----
          this.chaseCam.update(dt, speed, this.bike.lean);

          // ---- 11.5. AUDIO ----
          // Place the 3D audio listener at the BIKE'S WORLD POSITION facing along the bike's world heading. Spatial sounds live in world coords (`e.worldX, e.worldZ`); listener must too.
          // The camera's scene-space position would be wrong here — the camera always sits near scene origin while the bike is potentially hundreds of meters from world origin.
          if (SOUND) {
            const fwdX = Math.sin(this.bike.heading);
            const fwdZ = -Math.cos(this.bike.heading);
            SOUND.updateListener(
              this.bike.worldX,
              0.8, // listener ~head height
              this.bike.worldZ,
              fwdX,
              fwdZ,
            );

            // Player engine: pitch modulates with speed. Idle ~0.7x, top ~1.5x — sells the throttle position. Only running while the bike is alive; on crash I stop it (see _crashIntoTree) and _beginStage restarts on respawn.
            if (this.bike.alive) {
              if (this._engineId == null) {
                this._engineId = SOUND.startLoop("engine_player");
              }
              const speedFrac = Math.max(0, speed / CONFIG.BIKE.SPEED_MAX);
              SOUND.setRate(
                "engine_player",
                this._engineId,
                0.7 + speedFrac * 0.8,
              );
            }

            // Each enemy bike has its own spatial engine loop. Update position each frame so it pans + attenuates correctly as the player chases them. Started in EnemyBike.respawn, stopped in EnemyBike.die (see _killEnemy).
            for (const e of this.enemies) {
              if (e.alive && e._engineId != null) {
                SOUND.updateLoopPos(
                  "engine_enemy",
                  e._engineId,
                  e.worldX,
                  0.5,
                  e.worldZ,
                );
              }
            }
          }

          // ---- 12. HUD ----
          this._updateHUD(speed);
        }

        _fireBullet(bikeX, bikeZ, fwdX, fwdZ) {
          // Find inactive bullet
          let slot = null;
          for (const b of this.bullets) {
            if (!b.active) {
              slot = b;
              break;
            }
          }
          if (!slot) return;

          // Audio: photon zap. Head-centered — it's the player's own weapon, no spatial pan needed.
          if (SOUND) SOUND.play("shot");

          const muzzleX = bikeX + fwdX * CONFIG.BULLET.MUZZLE_FORWARD;
          const muzzleZ = bikeZ + fwdZ * CONFIG.BULLET.MUZZLE_FORWARD;

          // Calculate the steering skew so the bullet leaves at the same angle the reticle is pointing (lights/reticle swing with turnRate; bullets must match).
          const steerRatio = this.bike._lightTargetX / 30;

          // Apply skew to world-space forward vector, then normalize so bullet speed = CONFIG.BULLET.SPEED regardless of skew magnitude.
          let bulletDX = fwdX + fwdZ * -steerRatio;
          let bulletDZ = fwdZ + fwdX * steerRatio;
          const dlen = Math.hypot(bulletDX, bulletDZ) || 1;
          bulletDX /= dlen;
          bulletDZ /= dlen;

          // Fire the physics bullet
          slot.fire(muzzleX, muzzleZ, bulletDX, bulletDZ);

          // Visual trail in WORLD coords. The bullet's logical and visual representations both live in world space — once fired, the trail stays put as the bike turns around it.
          // The trail mesh is parented to worldGroup, which applies the bike-pose inverse each frame to render the trail at the correct screen location.
          //
          // Trail extends to BULLET.MAX_RANGE — same distance the logical bullet despawns, so the player never gets a "ghost kill" past the visible streak.
          const range = CONFIG.BULLET.MAX_RANGE;
          this._sMuzzle.set(muzzleX, CONFIG.BULLET.MUZZLE_HEIGHT, muzzleZ);
          this._sTrailTarget.set(
            muzzleX + bulletDX * range,
            0.4, // matches reticle Y precisely
            muzzleZ + bulletDZ * range,
          );
          this.bulletTrails.fire(this._sMuzzle, this._sTrailTarget);

          // Visual feedback on fire: Scale up and turn red briefly
          this.bike._reticle.scale.set(1.8, 1.8, 1);
          this.bike._reticle.material.color.copy(this.bike._reticleColorFire);
          this.bike._reticleEffectTimer = 0.08; // 80ms
        }

        _killEnemy(e) {
          e.alive = false;
          e.group.visible = false;

          // Audio: spatial explosion at the enemy's world position. The listener (player camera) will hear it pan left/right depending on the kill direction. Also stop the enemy's engine loop so it doesn't keep humming from beyond.
          if (SOUND) {
            SOUND.playAt("explosion", e.worldX, 0.5, e.worldZ);
            if (e._engineId != null) {
              SOUND.stopLoop("engine_enemy", e._engineId);
              e._engineId = null;
            }
          }

          // Burst at enemy world position (in render space)
          _v3a.copy(e.boundsCenter);
          this.particles.burst(_v3a, 50);

          // Score
          this.kills++;
          this.score += CONFIG.GAME.POINTS_PER_KILL;
          this.targetsRemaining--;

          // Visual feedback on hit: Scale up and turn green
          this.bike._reticle.scale.set(2.2, 2.2, 1);
          this.bike._reticle.material.color.copy(this.bike._reticleColorHit);
          this.bike._reticleEffectTimer = 0.2; // 200ms
          this._showPopup(`+$${CONFIG.GAME.POINTS_PER_KILL}`);

          // Stage clear?
          if (this.targetsRemaining <= 0) {
            this.state = GameState.STAGE_CLEARED;
            this._stateTimer = 4.0;
            this._showBanner("STAGE CLEAR", `BONUS: $${this.stage * 500}`);
            this.score += this.stage * 500;
            // Audio: bonus chime. Best-effort — file may be missing.
            if (SOUND) SOUND.play("stage_clear");
          }
        }

        // Enemy wrecked itself (hit a tree). Visual + audio same as a kill — bike disappears in a burst — but the player gets NO score and the target count stays the same. The enemy immediately respawns ahead so the player has to actually shoot a fresh one.
        _enemySelfDestruct(e) {
          if (SOUND) {
            SOUND.playAt("explosion", e.worldX, 0.5, e.worldZ);
            if (e._engineId != null) {
              SOUND.stopLoop("engine_enemy", e._engineId);
              e._engineId = null;
            }
          }
          _v3a.copy(e.boundsCenter);
          this.particles.burst(_v3a, 50);

          // Respawn ahead of the player on the same lane as before.
          const idx = this.enemies.indexOf(e);
          const lane = idx % 2 === 0 ? -1 : 1;
          e.respawn(
            this.bike.worldX,
            this.bike.worldZ,
            this.bike.heading,
            this.forest,
            lane,
            this.stage,
          );
          e._behindTimer = 0;
        }

        _checkTreeCollision() {
          // Two-zone collision: inner DEATH ring kills like before; outer GRAZE ring scrubs speed for a forgiving "I clipped that one" feel. Total reach grows slightly but the death window shrinks — the player gets more chances to brush trees without dying outright.
          //
          // _lastGrazedTreeIdx + _grazeRefractory prevent re-triggering graze feedback on the same tree (or immediately on its neighbor in a thicket) while the bike is still inside its radius.
          const f = this.forest;
          if (!f) return;

          const bx = this.bike.worldX;
          const bz = this.bike.worldZ;
          const BIKE_CORE_R = 0.05; // inner: dead-center hit on the trunk
          const BIKE_GRAZE_R = 0.55; // outer: fairing/handlebar brush zone
          const SEARCH_R = 2.5;

          if (this._grazeRefractory > 0) this._grazeRefractory -= 1 / 60;

          for (let t = 0; t < f.treeCount; t++) {
            const tx = f.treePosX[t];
            const dx = tx - bx;
            if (dx > SEARCH_R || dx < -SEARCH_R) continue;
            const tz = f.treePosZ[t];
            const dz = tz - bz;
            if (dz > SEARCH_R || dz < -SEARCH_R) continue;
            const trunkR = f.treeRadius[t];
            const deathR = trunkR + BIKE_CORE_R;
            const grazeR = trunkR + BIKE_GRAZE_R;
            const distSq = dx * dx + dz * dz;
            if (distSq < deathR * deathR) {
              this._crashIntoTree();
              return;
            }
            if (
              distSq < grazeR * grazeR &&
              this._grazeRefractory <= 0 &&
              this._lastGrazedTreeIdx !== t
            ) {
              this._grazeTree(t, dx, dz, Math.sqrt(distSq));
              this._lastGrazedTreeIdx = t;
              this._grazeRefractory = 0.3;
              return;
            }
          }
          // Clear last-grazed once we've left ALL trees' graze rings.
          if (this._lastGrazedTreeIdx !== -1) {
            const lt = this._lastGrazedTreeIdx;
            const dx = f.treePosX[lt] - bx;
            const dz = f.treePosZ[lt] - bz;
            const grazeR = f.treeRadius[lt] + BIKE_GRAZE_R;
            if (dx * dx + dz * dz > grazeR * grazeR) {
              this._lastGrazedTreeIdx = -1;
            }
          }
        }

        // Graze: bike clipped a tree but didn't core-hit it. Tactile feedback bundle: push the bike sideways off the trunk, scrub speed, kick the camera, play a scrape, spit a small particle burst at the contact point. No life lost — the cumulative feel of these is the punishment, not a banner.
        _grazeTree(treeIdx, dx, dz, dist) {
          // Contact normal: bike → away from tree center.
          const safeDist = dist > 0.001 ? dist : 1;
          const nx = -dx / safeDist;
          const nz = -dz / safeDist;

          // Lateral push: nudge the bike OFF the trunk along -normal (away from tree). Small displacement so it reads as "bounced" not "teleported." This makes the geometry feel solid.
          const PUSH_DIST = 0.35;
          this.bike.worldX -= nx * PUSH_DIST;
          this.bike.worldZ -= nz * PUSH_DIST;

          // Speed scrub to ~70% of current, floored at SPEED_MIN.
          this.bike.speed = Math.max(
            CONFIG.BIKE.SPEED_MIN,
            this.bike.speed * 0.7,
          );

          // Camera kick: push the camera AWAY from the trunk in bike-local space (i.e. the trunk side feels solid).
          // The bike's forward is (sin h, -cos h); right is (cos h, sin h).
          // I want the kick lateral component — dot the world-space contact direction with the bike's right vector.
          const h = this.bike.heading;
          const rightX = Math.cos(h);
          const rightZ = Math.sin(h);
          const lateralSign = nx * rightX + nz * rightZ; // +right or -left
          // Lateral kick ~6cm + slight upward bump (~2cm) — felt, not jarring.
          this.chaseCam.kick(-lateralSign * 0.06, 0.02);

          // Audio: scrape. Head-centered (no spatial pos needed).
          if (SOUND) SOUND.play("graze");

          // Particle burst at the contact point on the trunk side.
          const trunkR = this.forest.treeRadius[treeIdx];
          _v3a.set(
            this.bike.worldX + nx * trunkR,
            0.8,
            this.bike.worldZ + nz * trunkR,
          );
          this.particles.burst(_v3a, 14);
        }

        _crashIntoTree() {
          if (!this.bike.alive) return;
          this.bike.kill();
          this.lives--;
          this._flashHit();

          // Audio: stop the player's engine loop AND play the crash sound. Head-centered — the player IS the source of the crash. Engine restarts in _beginStage when the bike respawns. Without this stop, the engine keeps droning at idle pitch (0.7x rate) while the bike is wrecked — sounds awful.
          if (SOUND) {
            if (this._engineId != null) {
              SOUND.stopLoop("engine_player", this._engineId);
