          if (spawnData.wire) {
            const p1 = spawnData.wire.particles[spawnData.particleIdx].pos;
            const p2 =
              spawnData.wire.particles[
                Math.min(spawnData.particleIdx + 1, spawnData.wire.segments)
              ].pos;
            bird.heading = Math.atan2(-(p2.z - p1.z), p2.x - p1.x);
          }
        } else {
          action.time = Math.random() * baseAnims[0].duration;
          action.timeScale = 0.8 + Math.random() * 0.4;

          // Spawn directly in flock
          const x = Math.cos(bird.orbitAngle) * bird.orbitRadius;
          const z =
            CONFIG.FLOCK_CENTER_Z +
            Math.sin(bird.orbitAngle) * bird.orbitRadius;
          mesh.position.set(x, bird.baseHeight, z);
          bird.state = STATE.FLYING;
          bird.heading = bird.orbitAngle + Math.PI / 2;
        }

        mesh.rotation.y = bird.heading + Math.PI; // Bird model faces -Z, add PI to face +heading
        //mesh.add(new THREE.AxesHelper(2)); // debug
        scene.add(mesh);
        birds.push(bird);
        updateBirdCount();
        return bird;
      }

      function respawnBird(bird) {
        // Reset bird at wire spawn point - perching
        const spawnData = getRandomWireSpawnPoint();
        bird.mesh.position.copy(spawnData.position);
        bird.state = STATE.PERCHING;
        bird.perchTimer = CONFIG.PERCH_DURATION * (0.5 + Math.random() * 0.5);
        bird.perchWire = spawnData.wire;
        bird.perchT = spawnData.t;
        bird.perchParticleIdx = spawnData.particleIdx;

        // Face along the wire
        if (spawnData.wire) {
          const p1 = spawnData.wire.particles[spawnData.particleIdx].pos;
          const p2 =
            spawnData.wire.particles[
              Math.min(spawnData.particleIdx + 1, spawnData.wire.segments)
            ].pos;
          bird.heading = Math.atan2(-(p2.z - p1.z), p2.x - p1.x);
        }

        bird.mesh.rotation.set(0, bird.heading + Math.PI, 0);
        bird.speed = CONFIG.APPROACH_SPEED + Math.random() * 5;
        bird.falling = false;
        bird.fallVel.set(0, 0, 0);
        bird.rotVel.set(0, 0, 0);
        bird.peckTimer = 1.0 + Math.random() * 2.0; // Reset peck timer

        // Unfold wings when respawning
        setWingsFolded(bird, false);

        // Restart animation but paused for perching
        if (bird.action) {
          bird.action.reset();
          bird.action.play();
          bird.action.timeScale = 0; // Stop flapping while perching
        }
        bird.wingsAreFolded = true;

        // Move from falling to active
        const idx = fallingBirds.indexOf(bird);
        if (idx !== -1) fallingBirds.splice(idx, 1);
        if (!birds.includes(bird)) birds.push(bird);

        updateBirdCount();
      }

      function shootBird(bird, distance) {
        // Capture bird position BEFORE any changes
        const hitPosition = bird.mesh.position.clone();

        // Reset mouth if pecking
        if (bird.mouthBone) bird.mouthBone.rotation.z = 0;

        bird.falling = true;
        bird.fallVel.set(
          (Math.random() - 0.5) * 5,
          Math.random() * 4 + 2,
          (Math.random() - 0.5) * 5
        );
        bird.rotVel.set(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10
        );
        if (bird.action) bird.action.stop();

        // Unfold wings when shot (falling)
        setWingsFolded(bird, false);

        // Spawn particles at the captured hit position
        spawnParticles(hitPosition, "feathers", 25);
        spawnParticles(hitPosition, "blood", 18);

        // Move to falling
        const idx = birds.indexOf(bird);
        if (idx !== -1) birds.splice(idx, 1);
        fallingBirds.push(bird);

        // Calculate points (separate from hits)
        const wasSwooping = bird.state === STATE.SWOOPING;
        let earnedPoints = 1;

        if (wasSwooping) earnedPoints += 1; // +2 total for swoop
        if (distance > CONFIG.LONG_SHOT_DISTANCE)
          earnedPoints += 2; // Sniper bonus
        else if (distance > CONFIG.SNIPER_DISTANCE) earnedPoints += 1; // Long shot bonus

        // Update longest shot
        if (distance > longestShot) longestShot = distance;

        // Respawn after short delay
        setTimeout(() => respawnBird(bird), 300);

        return { earnedPoints, wasSwooping, distance };
      }

      function updateBirdCount() {
        document.getElementById("birds").textContent = birds.length;
        document.getElementById("swooping").textContent = birds.filter(
          (b) => b.state === STATE.SWOOPING
        ).length;
      }

      // Pre-allocate reusable vectors outside the update loop
      const camDir = new THREE.Vector3(); // declare once globally
      const _dxz = new THREE.Vector3();
      const _forward = new THREE.Vector3();

      function updateBirds(dt, time) {
        const swoopingCount = birds.filter(
          (b) => b.state === STATE.SWOOPING
        ).length;
        const peckingCount = birds.filter(
          (b) => b.state === STATE.PECKING
        ).length;

        // Get camera forward direction for swoop targeting
        camera.getWorldDirection(camDir);

        for (let i = 0; i < birds.length; i++) {
          const b = birds[i];
          const mesh = b.mesh;

          // Speed variation over time - never too slow
          if (b.state !== STATE.PECKING) {
            b.speed = Math.max(
              CONFIG.BIRD_SPEED_MIN * 0.8,
              b.baseSpeed + Math.sin(time * 0.5 + i * 0.7) * 3
            );
          }

          switch (b.state) {
            case STATE.PERCHING: {
              // Bird is sitting on wire
              b.perchTimer -= dt;

              // Apply weight to wire particle
              if (
                b.perchWire &&
                b.perchParticleIdx > 0 &&
                b.perchParticleIdx < b.perchWire.segments
              ) {
                const particle = b.perchWire.particles[b.perchParticleIdx];
                if (!particle.fixed) {
                  particle.pos.y -= CONFIG.BIRD_WEIGHT;
                }
              }

              // Update bird position to follow wire movement
              if (b.perchWire) {
                const idx = b.perchParticleIdx;

                // Keep wings folded while perching
                setWingsFolded(b, true);

                const p1 = b.perchWire.particles[idx].pos;
                const p2 =
                  b.perchWire.particles[Math.min(idx + 1, b.perchWire.segments)]
                    .pos;
                const frac = b.perchT * b.perchWire.segments - idx;

                mesh.position.lerpVectors(p1, p2, frac);
                mesh.position.y -= 0.2; // slight offset so feet connect with the wire
              }

              // Time to fly off?
              if (b.perchTimer <= 0) {
                b.state = STATE.APPROACHING;
                b.perchWire = null;

                // Start flapping
                if (b.action) {
                  b.action.paused = false;
                  b.action.timeScale = 0.8 + Math.random() * 0.4;
                }
                b.wingsAreFolded = false;

                // Set heading toward flock
                const dx = -mesh.position.x;
                const dz = CONFIG.FLOCK_CENTER_Z - mesh.position.z;
                b.heading = Math.atan2(-dz, dx);
                b.targetHeading = b.heading;
              }
              break;
            }

            case STATE.APPROACHING: {
              // Fly toward flock area
              const targetX = Math.cos(b.orbitAngle) * b.orbitRadius;
              const targetZ =
                CONFIG.FLOCK_CENTER_Z + Math.sin(b.orbitAngle) * b.orbitRadius;
              const targetY = b.baseHeight;

              _dxz.set(targetX - mesh.position.x, 0, targetZ - mesh.position.z);
              const dist = _dxz.length();

              b.targetHeading = Math.atan2(-_dxz.z, _dxz.x);

              if (dist < 5) {
                b.state = STATE.FLYING;
                b.speed = b.baseSpeed;
              }

              // Height adjustment
              mesh.position.y += (targetY - mesh.position.y) * 2 * dt;
              break;
            }

            case STATE.FLYING: {
              // Horizontal distance check (XZ plane)
              const dx = mesh.position.x - camera.position.x;
              const dz = mesh.position.z - camera.position.z;
              const distXZ = Math.sqrt(dx * dx + dz * dz);

              if (
                distXZ <= CONFIG.SWOOP_XZ_DISTANCE &&
                swoopingCount < CONFIG.MAX_SWOOPING &&
                Math.random() < CONFIG.SWOOP_CHANCE
              ) {
                b.state = STATE.SWOOPING;
                b.speed = CONFIG.SWOOP_SPEED;
                b.swoopTarget.set(
                  camera.position.x + camDir.x * 1.5,
                  camera.position.y + 0.2,
                  camera.position.z + camDir.z * 1.5
                );
                if (b.action) b.action.timeScale = 2.5;
                break;
              }

              // Wander - gentle heading changes
              b.wanderTimer -= dt;
              if (b.wanderTimer <= 0) {
                b.wanderTimer = 0.5 + Math.random() * 1.0;
                b.wanderAngle += (Math.random() - 0.5) * 0.6;
              }

              // Update orbit angle - birds fly along the arc of the poles
              b.orbitAngle += (b.speed / b.orbitRadius) * dt * 0.3;

              // Birds orbit ALONG the pole arc (same arc shape as poles)
              // orbitAngle maps to the arc spread, orbitRadius is distance from that arc
              const arcAngle =
                -CONFIG.POLE_ARC_SPREAD / 2 +
                ((((b.orbitAngle % (Math.PI * 2)) + Math.PI * 2) %
                  (Math.PI * 2)) /
                  (Math.PI * 2)) *
                  CONFIG.POLE_ARC_SPREAD;

              // Base position on the arc (like poles but closer)
              const arcRadius =
                CONFIG.POLE_ARC_RADIUS * 0.6 + b.orbitRadius * 0.5; // Vary distance from camera
              const targetX =
                Math.sin(arcAngle) * arcRadius + Math.sin(b.wanderAngle) * 5;
              const targetZ =
                Math.cos(arcAngle) * arcRadius + Math.cos(b.wanderAngle) * 5;

              // Target heading: direction of movement along the arc
              const nextArcAngle = arcAngle + 0.1;
              const nextX = Math.sin(nextArcAngle) * arcRadius;
              const nextZ = Math.cos(nextArcAngle) * arcRadius;
              b.targetHeading =
                Math.atan2(-(nextZ - targetZ), nextX - targetX) +
                Math.sin(b.wanderAngle) * 0.3;

              // Smoothly move toward target position
              mesh.position.x += (targetX - mesh.position.x) * 2 * dt;
              mesh.position.z += (targetZ - mesh.position.z) * 2 * dt;

              // Height bobbing
              const targetY =
                b.baseHeight + Math.sin(time * b.bobSpeed + b.bobOffset) * 2;
              mesh.position.y += (targetY - mesh.position.y) * 2 * dt;

              break;
            }

            case STATE.SWOOPING: {
              b.swoopTarget.set(
                camera.position.x,
                camera.position.y + 0.1, // eye level
                camera.position.z
              );

              _dxz.set(
                b.swoopTarget.x - mesh.position.x,
                b.swoopTarget.y - mesh.position.y,
                b.swoopTarget.z - mesh.position.z
              );

              b.targetHeading = Math.atan2(-_dxz.z, _dxz.x);

              // Move toward face
              mesh.position.x += _dxz.x * 4 * dt;
              mesh.position.y += _dxz.y * 4 * dt;
              mesh.position.z += _dxz.z * 4 * dt;

              // When close enough, switch to PECKING; max 2 pecking at the same time
              if (_dxz.length() < 0.5 && peckingCount < 2) {
                b.state = STATE.PECKING;
                b.speed = 0;

                if (b.action) {
                  b.action.timeScale = 1.0;
                  b.action.play();
                }
              }
              break;
            }

            case STATE.PECKING: {
              // OPTIMIZED: Use pre-allocated vectors instead of creating new ones
              camera.getWorldDirection(_peckForward);

              // Right vector (perpendicular in XZ plane)
              _peckRight.set(_peckForward.z, 0, -_peckForward.x).normalize();

              // Base position in front of camera
              mesh.position
                .copy(camera.position)
                .addScaledVector(_peckForward, 1.15);
              mesh.position.y = 0.8;

              // Get all pecking birds
              const peckingBirds = birds.filter(
                (bb) => bb.state === STATE.PECKING
              );

              if (peckingBirds.length === 1) {
                // Single bird → centered, no offset
              } else if (peckingBirds.length === 2) {
                // Two birds → assign left/right based on index in array
                const index = peckingBirds.indexOf(b);
                const offset = index === 0 ? -0.4 : 0.4;
                mesh.position.addScaledVector(_peckRight, offset);
              }

              // Compute yaw angle in XZ plane
              const dx = camera.position.x - mesh.position.x;
              const dz = camera.position.z - mesh.position.z;
              let yaw = Math.atan2(dx, dz);
              yaw -= Math.PI / 2;

              mesh.rotation.set(0, yaw, 0);

              // Jitter for pecking
              mesh.position.y += Math.sin(time * 20) * 0.02;

              // Animate mouth
              if (b.mouthBone) {
                b.mouthBone.rotation.z = Math.sin(time * 15) * 0.3;
              }

              // Fold wings while pecking
              setWingsFolded(b, true);

              if (b.action) b.action.timeScale = 2.0;

              b.peckTimer -= dt;
              if (b.peckTimer <= 0) {
                // Unfold wings before recovering
                setWingsFolded(b, false);
                b.state = STATE.RECOVERING;
                b.peckTimer = 1.0 + Math.random() * 2.0;
              }
              break;
            }

            case STATE.RECOVERING: {
              if (b.mouthBone) b.mouthBone.rotation.z = 0;

              const recoverY = b.baseHeight + 15;
              mesh.position.y += (recoverY - mesh.position.y) * 3 * dt;

              _dxz.set(
                -mesh.position.x,
                0,
                CONFIG.FLOCK_CENTER_Z - mesh.position.z
              );
              b.targetHeading = Math.atan2(-_dxz.z, _dxz.x);

              if (mesh.position.y > b.baseHeight + 5) {
                b.state = STATE.FLYING;
                b.speed = b.baseSpeed;
                if (b.action) b.action.timeScale = 0.8 + Math.random() * 0.4;
              }
              break;
            }
          }

          // Skip movement for perching or pecking birds
          if (b.state === STATE.PERCHING || b.state === STATE.PECKING) {
            continue;
          }

          // TURN toward target heading
          let headingDiff = b.targetHeading - b.heading;
          while (headingDiff > Math.PI) headingDiff -= Math.PI * 2;
          while (headingDiff < -Math.PI) headingDiff += Math.PI * 2;

          const maxTurn = CONFIG.TURN_RATE * dt;
          b.heading += THREE.MathUtils.clamp(headingDiff, -maxTurn, maxTurn);

          // TRUE FORWARD VECTOR (XZ plane)
          _forward.set(Math.cos(b.heading), 0, -Math.sin(b.heading));

          // Vertical intent
          if (b.state === STATE.SWOOPING) {
            _forward.y =
              (b.swoopTarget.y - mesh.position.y) /
              Math.max(1, mesh.position.distanceTo(b.swoopTarget));
          } else if (b.state === STATE.RECOVERING) {
            _forward.y = 0.6;
          }

          _forward.normalize();

          // MOVE HEAD-FIRST
          mesh.position.addScaledVector(_forward, b.speed * dt);

          // ROTATE MODEL TO MATCH FORWARD AXIS
          mesh.rotation.y = Math.atan2(-_forward.z, _forward.x);

          // Pitch follows movement
          const pitch = THREE.MathUtils.clamp(-_forward.y * 1.1, -1.0, 1.0);
          mesh.rotation.x = THREE.MathUtils.lerp(
            mesh.rotation.x,
            pitch,
            6 * dt
          );

          // Bank into turns
          const bank = THREE.MathUtils.clamp(headingDiff * 4, -0.7, 0.7);
          mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, bank, 6 * dt);
        }

        // FALLING BIRDS
        for (let i = fallingBirds.length - 1; i >= 0; i--) {
          const b = fallingBirds[i];
          b.fallVel.y += CONFIG.GRAVITY * dt;
          _bVel.copy(b.fallVel).multiplyScalar(dt);
          b.mesh.position.add(_bVel);
          b.mesh.rotation.x += b.rotVel.x * dt;
          b.mesh.rotation.y += b.rotVel.y * dt;
          b.mesh.rotation.z += b.rotVel.z * dt;
        }

        // Warning when swooping
        const currentSwooping = birds.filter(
          (b) => b.state === STATE.SWOOPING
        ).length;
        warningEl.classList.toggle("show", currentSwooping > 0);
        if (currentSwooping > 0 && Math.random() < 0.03) {
          flash.classList.add("warning");
          setTimeout(() => flash.classList.remove("warning"), 100);
        }

        updateBirdCount();
      }

      // ============================================================================
      // RAYCASTING
      // ============================================================================
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function shoot() {
        shots++;
        crosshair.classList.add("shoot");

        // Play gun animation
        playGunAnimation();

        setTimeout(() => crosshair.classList.remove("shoot"), 80);

        mouse.x = (mouseX / innerWidth) * 2 - 1;
        mouse.y = -(mouseY / innerHeight) * 2 + 1;

        gunModel.rotation.y =
          CONFIG.GUN.model.baseRotationY - (mouse.x * Math.PI) / 12; // rotate gun ~15° left/right

        raycaster.setFromCamera(mouse, camera);

        // Store shoot direction for bullet trail
        const _shootDir = raycaster.ray.direction.clone();

        // Check all bird meshes
        const meshes = birds.map((b) => b.mesh);
        const intersects = raycaster.intersectObjects(meshes, true);

        if (intersects.length === 0) {
          // Miss - still spawn bullet trail
          misses++;
          streak = 0;
          updateStats();

          // Spawn bullet trail (miss case)
          if (bulletTrailManager) {
            bulletTrailManager.fire(
              camera,
              _shootDir,
              null,
              CONFIG.GRAPHICS.FOG_FAR
            );
          }
          return;
        }

        // STRICT ray-line piercing (no spherical bullshit)
        const hitBirds = [];
        const rayDir = raycaster.ray.direction.clone().normalize();
        const rayOrigin = raycaster.ray.origin.clone();

        // Sort hits by distance along ray
        intersects.sort((a, b) => a.distance - b.distance);

        const MAX_OFF_AXIS = 0.35; // meters from ray line (tight!)

        for (const intersect of intersects) {
          const hitObj = intersect.object;

          // Find owning bird
          const bird = birds.find(
            (b) => hitObj === b.mesh || isChild(hitObj, b.mesh)
          );
          if (!bird) continue;
          if (hitBirds.some((h) => h.bird === bird)) continue;

          // Check perpendicular distance to ray
          const hitPos = intersect.point;
          const toHit = hitPos.clone().sub(rayOrigin);
          const projectedLen = toHit.dot(rayDir);

          if (projectedLen < 0) break; // behind camera

          const closestPoint = rayDir
            .clone()
            .multiplyScalar(projectedLen)
            .add(rayOrigin);

          const offAxisDist = hitPos.distanceTo(closestPoint);

          if (offAxisDist > MAX_OFF_AXIS) break; // bullet misses alignment → stop piercing

          hitBirds.push({ bird, distance: intersect.distance });
        }

        if (hitBirds.length === 0) {
          misses++;
          streak = 0;
          updateStats();

          // Spawn bullet trail (miss case)
          if (bulletTrailManager) {
            bulletTrailManager.fire(
              camera,
              _shootDir,
              null,
              CONFIG.GRAPHICS.FOG_FAR
            );
          }
          return;
        }

        // Process all kills
        let totalPoints = 0;
        let killCount = hitBirds.length;
        let maxDistance = 0;
        let anySwooping = false;

        for (const { bird, distance } of hitBirds) {
          const result = shootBird(bird, distance);
          totalPoints += result.earnedPoints;
          if (result.distance > maxDistance) maxDistance = result.distance;
          if (result.wasSwooping) anySwooping = true;
        }

        // Multi-kill bonus!
        if (killCount >= 2) {
          const multiBonus = killCount * 2; // +2 per bird in multi-kill
          totalPoints += multiBonus;
        }

        // Update stats
        hits += killCount;
        points += totalPoints;
        streak += killCount;
        if (streak > bestStreak) bestStreak = streak;

        // Build popup text
        let text = `+${totalPoints}`;
        const tags = [];

        if (killCount >= 3) tags.push(`${killCount}X MULTI-KILL!`);
        else if (killCount === 2) tags.push("DOUBLE KILL!");

        if (anySwooping) tags.push("SWOOP");
        if (maxDistance > CONFIG.LONG_SHOT_DISTANCE)
          tags.push(`SNIPER ${maxDistance.toFixed(0)}m`);
        else if (maxDistance > CONFIG.SNIPER_DISTANCE) tags.push("LONG SHOT");

        if (tags.length > 0) text += " " + tags.join(" · ");

        showHit();
        showPopup(mouseX, mouseY, text);
        updateStats();
        updateBirdCount();

        // Spawn bullet trail (hit case)
        // Note: Use the intersection point, not the bird mesh position (bird may be removed)
        if (bulletTrailManager) {
          // Get first intersection point from raycaster results
          const hitPoint =
            intersects.length > 0 ? intersects[0].point.clone() : null;
          bulletTrailManager.fire(
            camera,
            _shootDir,
            hitPoint,
            CONFIG.GRAPHICS.FOG_FAR
          );
        }
      }

      function isChild(obj, parent) {
        let cur = obj.parent;
        while (cur) {
          if (cur === parent) return true;
          cur = cur.parent;
        }
        return false;
      }

      function showHit() {
        crosshair.classList.add("hit");
        flash.classList.add("on");
        setTimeout(() => {
          crosshair.classList.remove("hit");
          flash.classList.remove("on");
        }, 150);
      }

      function showPopup(x, y, text) {
        const p = document.createElement("div");
        p.className = "popup";
        p.textContent = text;
        p.style.left = x + "px";
        p.style.top = y + "px";
        if (text.includes("SWOOP")) p.style.color = "#ffd93d";
        if (text.includes("SNIPER") || text.includes("LONG"))
          p.style.color = "#ff9ff3";
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1200);
      }

      // ============================================================================
      // EVENTS
      // ============================================================================

      function resize() {
        const dpr = Math.min(window.devicePixelRatio, isTouchOnly ? 1 : 1.5);
        renderer.setPixelRatio(dpr);
        renderer.setSize(window.innerWidth, window.innerHeight, true);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        mouseX = centerX();
      }
      addEventListener("resize", resize);

      // Track mouse drag to prevent shooting while rotating camera
      let mouseDownPos = { x: 0, y: 0 };
      let isDragging = false;
      const DRAG_THRESHOLD = 5; // pixels

      addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        crosshair.style.left = mouseX + "px";
        crosshair.style.top = mouseY + "px";

        // Check if dragging
        if (mouseDownPos.x !== 0 || mouseDownPos.y !== 0) {
          const dx = mouseX - mouseDownPos.x;
          const dy = mouseY - mouseDownPos.y;
          if (Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {
            isDragging = true;
          }
        }
      });

      // Keyboard controls for WASD movement and QR rotation
      addEventListener("keydown", (e) => {
        keys[e.code] = true;
      });

      addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      let skipNextClick = false;
      // When window regains focus, mark that the next click should be ignored
      window.addEventListener("focus", () => {
        skipNextClick = true;
      });

      addEventListener("mousedown", (e) => {
        if (e.button === 0) {
          mouseDownPos = { x: e.clientX, y: e.clientY };
          isDragging = false;
        }
      });

      addEventListener("mouseup", (e) => {
        if (e.button === 0) {
          // If we just regained focus, skip this click
          if (skipNextClick) {
            skipNextClick = false; // consume the skip
          } else {
            // Only shoot if we didn't drag
            if (!isDragging) {
              shoot();
            }
          }
          mouseDownPos = { x: 0, y: 0 };
          isDragging = false;
        }
      });

      addEventListener("contextmenu", (e) => e.preventDefault());

      // ============================================================================
      // LOAD MODEL
      // ============================================================================
      const loader = new GLTFLoader();

      async function loadModel() {
        try {
          //https://raw.githubusercontent.com/Data-Bee38/models/main/bird-fly.glb
          const gltf = await loader.loadAsync(
            "https://raw.githubusercontent.com/red-reddington/public-assets/main/raven.glb"
          );

          if (!gltf.animations?.length) {
            loadingEl.textContent = "Model has no animations";
            return;
          }

          baseModel = gltf.scene;
          baseAnims = gltf.animations;

          baseModel.traverse((node) => {
            if (node.isMesh) {
              // Clone the material so we can modify it
              node.material = node.material.clone();
              node.material.side = THREE.DoubleSide;

              // Boost bird visibility - if it's a MeshStandardMaterial, increase roughness and reduce metalness
              if (node.material.isMeshStandardMaterial) {
                node.material.roughness = Math.max(
                  node.material.roughness,
                  0.7
                );
                node.material.metalness = Math.min(
                  node.material.metalness,
                  0.5
                );
                // Add slight emissive to make birds pop
                node.material.emissive = new THREE.Color(0x222222);
                node.material.emissiveIntensity = 0.3;
              }

              node.castShadow = true;
              node.receiveShadow = true;
              node.frustumCulled = true;
            }
          });

          // --- SCALE BASE MODEL ---
          const box = new THREE.Box3().setFromObject(baseModel);
          const size = box.getSize(new THREE.Vector3());
          const scale = CONFIG.BIRD_SCALE / Math.max(size.x, size.y, size.z);
          baseModel.scale.setScalar(scale);
          baseModel.updateMatrixWorld(true);

          // --- ALIGN VISUAL BOTTOM ---
          birdPivot = new THREE.Group();
          birdPivot.add(baseModel);

          // Compute bounding box AFTER scaling
          const bbox = new THREE.Box3().setFromObject(baseModel);
          const minY = bbox.min.y;

          // Shift the whole model up so its bottom sits at y=0
          baseModel.position.y = -minY;

          /*// Debug helper
          scene.add(
            new THREE.Box3Helper(
              new THREE.Box3().setFromObject(baseModel),
              0x00ff00
            )
          );*/

          // --- CREATE MIXER ---
          mixer = new THREE.AnimationMixer(baseModel);

          // --- SPAWN BIRDS ---
          for (let i = 0; i < CONFIG.BIRD_COUNT; i++) {
            spawnBird(i < CONFIG.BIRD_COUNT / 2);
          }

          /*// --- DEBUG CLONE ---
                    const birdMesh = SkeletonUtils.clone(birdPivot);
                    birdMesh.position.set(0, 0, 0);
                    birdMesh.rotation.y = Math.PI;
                    birdMesh.add(new THREE.AxesHelper(2));
                    scene.add(birdMesh);*/

          loadingEl.style.display = "none";
        } catch (e) {
          loadingEl.textContent = "Could not load bird-fly.glb";
          console.error(e);
        }
      }

      loadModel();

      // ============================================================================
      // RENDER LOOP
      // ============================================================================
      const clock = new THREE.Clock();
      const JOYSTICK_LOOK_SPEED = 2.5; // Radians per second at full deflection

      // Helper vectors for movement (pre-allocated to avoid GC)
      const _moveDir = new THREE.Vector3();
      const _moveForward = new THREE.Vector3();
      const _moveRight = new THREE.Vector3();
      const _dir = new THREE.Vector3(); // reused for rotation
      const _right = new THREE.Vector3(); // reused for pitch rotation
      const _up = new THREE.Vector3(0, 1, 0); // constant up vector

      let cameraYaw = 0; // horizontal rotation
      let cameraPitch = 0; // accumulated vertical rotation

      function updatePlayerMovement(dt) {
        // Get camera's forward direction (projected onto XZ plane)
        camera.getWorldDirection(_moveForward);
        _moveForward.y = 0;
        _moveForward.normalize();

        cameraYaw = Math.atan2(_moveForward.x, _moveForward.z);

        // Get right vector
        _moveRight.crossVectors(_moveForward, _up).normalize();

        // Calculate movement input from keyboard
        let moveX = 0;
        let moveZ = 0;

        if (keys["KeyW"] || keys["ArrowUp"]) moveZ += 1;
        if (keys["KeyS"] || keys["ArrowDown"]) moveZ -= 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) moveX -= 1;
        if (keys["KeyD"] || keys["ArrowRight"]) moveX += 1;

        // Add joystick input (left joystick controls movement)
        moveX += joystickMove.x;
        moveZ += joystickMove.y;

        // Calculate rotation input from keyboard (Q/R)
        let rotateInput = 0;
        if (keys["KeyQ"]) rotateInput += 1;
        if (keys["KeyE"]) rotateInput -= 1;

        // Add right joystick for rotation (in touch mode)
        if (cameraMode === "touch") {
          rotateInput -= joystickLook.x;
        }

        // Apply rotation to camera - rotate around Y axis
        if (rotateInput !== 0) {
          const rotateAmount = rotateInput * CONFIG.ROTATE_SPEED * dt;

          _dir.subVectors(controls.target, camera.position);
          const distance = _dir.length();

          _dir.y = 0;
          _dir.normalize();
          _dir.applyAxisAngle(_up, rotateAmount);

          if (cameraMode === "touch") {
            if (Math.abs(joystickLook.y) > DEADZONE) {
              cameraPitch += joystickLook.y * CAMERA_PITCH_SPEED * dt;
              cameraPitch = THREE.MathUtils.clamp(
                cameraPitch,
                CAMERA_PITCH_MIN,
                CAMERA_PITCH_MAX
              );
            }
            _right.crossVectors(_dir, _up).normalize();
            _dir.applyAxisAngle(_right, cameraPitch);
          }

          _dir.setLength(distance);
          controls.target.copy(camera.position).add(_dir);
        }

        // Apply movement if there's input
        if (moveX !== 0 || moveZ !== 0) {
          // Normalize if diagonal
          const inputLength = Math.sqrt(moveX * moveX + moveZ * moveZ);
          if (inputLength > 1) {
            moveX /= inputLength;
            moveZ /= inputLength;
          }

          // Calculate speed (with sprint)
          let speed = CONFIG.MOVE_SPEED;
          if (keys["ShiftLeft"] || keys["ShiftRight"]) {
            speed *= CONFIG.SPRINT_MULTIPLIER;
          }

          // Calculate movement direction
          _moveDir.set(0, 0, 0);
          _moveDir.addScaledVector(_moveForward, moveZ);
          _moveDir.addScaledVector(_moveRight, moveX);
          _moveDir.normalize();

          // Apply movement
          const moveAmount = speed * dt;
          camera.position.x += _moveDir.x * moveAmount;
          camera.position.z += _moveDir.z * moveAmount;
          controls.target.x += _moveDir.x * moveAmount;
          controls.target.z += _moveDir.z * moveAmount;
        }

        // Clamp camera position to world radius
        const distFromCenter = Math.sqrt(
          camera.position.x * camera.position.x +
            camera.position.z * camera.position.z
        );

        if (distFromCenter > CONFIG.WORLD_RADIUS) {
          const scale = CONFIG.WORLD_RADIUS / distFromCenter;
          const dx = camera.position.x - camera.position.x * scale;
          const dz = camera.position.z - camera.position.z * scale;

          camera.position.x *= scale;
          camera.position.z *= scale;
          controls.target.x -= dx;
          controls.target.z -= dz;
        }
      }

      function render() {
        requestAnimationFrame(render);

        const dt = Math.min(clock.getDelta(), 0.05);
        const time = clock.getElapsedTime();

        // Handle player movement (WASD + joystick)
        updatePlayerMovement(dt);

        // Update OrbitControls
        controls.update();

        if (mixer) mixer.update(dt);
        if (gunMixer) gunMixer.update(dt);

        updateWires(dt);
        updateBirds(dt, time);
        updateParticles(dt);
        bulletTrailManager.update();
        bulletTrailManager.setPlayerPosition(
          camera.position.x,
          camera.position.z
        );
        updateSunShadow(dt);
        updateShadowFrustum();

        renderer.render(scene, camera);

        // stats
        if (statsGL) statsGL.update();
      }

      render();
      
      ['touchstart', 'touchend'].forEach(ev => renderer.domElement.addEventListener(ev, e => e.preventDefault(), { passive: false })); // kill iOS double-tap zoom on canvas
    </script>
  </body>
</html>
