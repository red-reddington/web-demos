          joystickMove.y = 0;
          keys.ShiftLeft = false;
        });

        // Right joystick (look)
        rightJoystick = nipplejs.create({
          zone: rightZone,
          mode: "static",
          position: { left: "50%", top: "50%" },
          restJoystick: true,
          size: unitValue * 10,
        });

        rightJoystick.on("move", (evt, data) => {
          joystickLook.x = data.vector.x;
          joystickLook.y = data.vector.y;
        });

        rightJoystick.on("end", () => {
          joystickLook.x = 0;
          joystickLook.y = 0;
        });
      }

      /**
       * Enable/disable touch controls
       */
      function setTouchControls(enabled) {
        touchControlsEnabled = enabled;

        if (enabled) {
          controls.enabled = false; // disable OrbitControls
          keyMappings.style.display = "none";
          touchMappings.style.display = "block";
          mobileControls.style.display = "block";

          if (!leftJoystick && !rightJoystick) {
            initJoysticks();
          }
        } else {
          controls.enabled = true;
          keyMappings.style.display = "block";
          touchMappings.style.display = "none";
          mobileControls.style.display = "none";
          cameraPitch = 0;
        }
      }

      // Auto-enable touch controls on touch-only devices
      if (isTouchOnly) {
        optTouchControls.checked = true;
        setTouchControls(true);
      }

      // ==========================================================================
      // OPTIONS PANEL
      // ==========================================================================

      // Collapse/expand
      optionsHeader.addEventListener("click", () => {
        optionsPanel.classList.toggle("collapsed");
      });

      // Touch controls toggle
      optTouchControls.addEventListener("change", (e) => {
        setTouchControls(e.target.checked);
      });

      // Shadows toggle
      optShadows.addEventListener("change", (e) => {
        renderer.shadowMap.enabled = e.target.checked;
        moonLight.castShadow = e.target.checked;

        // Need to update all objects
        scene.traverse((obj) => {
          if (obj.isMesh) {
            obj.material.needsUpdate = true;
          }
        });
      });

      // ==========================================================================
      // UI EVENT HANDLERS
      // ==========================================================================
      btnRecord.addEventListener("click", () => {
        if (recorder) {
          if (recorder.isRecording) {
            recorder.stop();
          } else {
            ensureAudio();
            recorder.start();
          }
        }
      });

      btnScreenshot.addEventListener("click", () => {
        // Force render to preserve WebGL buffer content
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
        showToast("Capturing screenshot...");
        recorder.screenshot("graveyard");
        showToast("Screenshot saved!");
      });

      btnMute.addEventListener("click", () => {
        ensureAudio();
        toggleMute();
      });

      // ==========================================================================
      // INPUT HANDLING
      // ==========================================================================
      const keys = {};

      window.addEventListener("keydown", (e) => {
        keys[e.code] = true;
      });
      window.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      // Pre-allocated movement vectors
      const _moveDir = new THREE.Vector3();
      const _moveForward = new THREE.Vector3();
      const _moveRight = new THREE.Vector3();
      const _up = new THREE.Vector3(0, 1, 0);
      const _dir = new THREE.Vector3();
      const _right = new THREE.Vector3();

      /**
       * Update player movement from keyboard and joystick input
       */
      function updateMovement(dt) {
        // ------------------------------------------------------------------
        // FLAT forward/right vectors (movement NEVER uses pitch)
        // ------------------------------------------------------------------
        camera.getWorldDirection(_moveForward);
        _moveForward.y = 0;
        _moveForward.normalize();

        _moveRight.crossVectors(_up, _moveForward).normalize();

        // ------------------------------------------------------------------
        // INPUT
        // ------------------------------------------------------------------
        let moveX = 0;
        let moveZ = 0;
        let rotateInput = 0;

        if (keys["KeyW"] || keys["ArrowUp"]) moveZ += 1;
        if (keys["KeyS"] || keys["ArrowDown"]) moveZ -= 1;
        if (keys["KeyA"] || keys["ArrowLeft"]) moveX += 1;
        if (keys["KeyD"] || keys["ArrowRight"]) moveX -= 1;

        if (keys["KeyQ"]) rotateInput += 1;
        if (keys["KeyE"]) rotateInput -= 1;

        // Joystick movement
        moveX -= joystickMove.x;
        moveZ += joystickMove.y;

        // Touch: right joystick rotates
        if (touchControlsEnabled) {
          rotateInput -= joystickLook.x;
        }

        // ------------------------------------------------------------------
        // YAW ROTATION ONLY (no pitch here)
        // ------------------------------------------------------------------
        if (rotateInput !== 0) {
          const rotAmt = rotateInput * CONFIG.ROTATE_SPEED * dt;

          _dir.subVectors(controls.target, camera.position);
          const distance = _dir.length();

          _dir.y = 0;
          _dir.normalize();
          _dir.applyAxisAngle(_up, rotAmt);

          if (touchControlsEnabled) {
            if (Math.abs(joystickLook.y) > CONFIG.DEADZONE) {
              cameraPitch += joystickLook.y * CONFIG.CAMERA_PITCH_SPEED * dt;
              cameraPitch = THREE.MathUtils.clamp(
                cameraPitch,
                CONFIG.CAMERA_PITCH_MIN,
                CONFIG.CAMERA_PITCH_MAX
              );
            }
            _right.crossVectors(_dir, _up).normalize();
            _dir.applyAxisAngle(_right, cameraPitch);
          }

          _dir.setLength(distance);
          controls.target.copy(camera.position).add(_dir);
        }

        // ------------------------------------------------------------------
        // APPLY MOVEMENT (XZ ONLY)
        // ------------------------------------------------------------------
        if (moveX !== 0 || moveZ !== 0) {
          const len = Math.hypot(moveX, moveZ);
          if (len > 1) {
            moveX /= len;
            moveZ /= len;
          }

          let speed = CONFIG.MOVE_SPEED;
          if (keys["ShiftLeft"] || keys["ShiftRight"]) {
            speed *= CONFIG.SPRINT_MULTIPLIER;
          }

          _moveDir.set(0, 0, 0);
          _moveDir.addScaledVector(_moveForward, moveZ);
          _moveDir.addScaledVector(_moveRight, moveX);
          _moveDir.normalize();

          const amt = speed * dt;

          camera.position.x += _moveDir.x * amt;
          camera.position.z += _moveDir.z * amt;

          controls.target.x += _moveDir.x * amt;
          controls.target.z += _moveDir.z * amt;
        }

        // ------------------------------------------------------------------
        // WORLD BOUNDARY CLAMP (XZ ONLY)
        // ------------------------------------------------------------------

        const distFromCenter = Math.sqrt(
          camera.position.x * camera.position.x +
            camera.position.z * camera.position.z
        );

        if (distFromCenter > CONFIG.WORLD_RADIUS) {
          const scale = CONFIG.WORLD_RADIUS / distFromCenter;
          const dx = camera.position.x - camera.position.x * scale;
          const dz = camera.position.z - camera.position.z * scale;

          camera.position.x *= scale;
          camera.position.z *= scale;
          controls.target.x -= dx;
          controls.target.z -= dz;
        }
      }

      // ==========================================================================
      // RESIZE HANDLER
      // ==========================================================================
      function onResize() {
        const dpr = Math.min(devicePixelRatio, isTouchOnly ? 1 : 1.5);
        renderer.setPixelRatio(dpr);
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", onResize);

      // ==========================================================================
      // RENDER LOOP
      // ==========================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        const time = clock.getElapsedTime();

        updateMovement(dt);
        controls.update();

        if (birdMixer) birdMixer.update(dt);
        updateBirds(dt, time);

        renderer.render(scene, camera);
      }

      animate();
      
      ['touchstart', 'touchend'].forEach(ev => renderer.domElement.addEventListener(ev, e => e.preventDefault(), { passive: false })); // kill iOS double-tap zoom on canvas

      // Expose for debugging
      window.recorder = recorder;
      window.THREE = THREE;
    </script>
  </body>
</html>
