            let n = this.forest.nearbyObstacles(x, z, reach, out, 0);
            n = this.boulders.nearbyObstacles(x, z, reach, out, n);
            for (let i = 0; i < n; i++) {
              const o = out[i];
              const dx = x - o.wx,
                dz = z - o.wz;
              const val =
                dx * dx * o.q11 + 2 * dx * dz * o.q12 + dz * dz * o.q22;
              if (val < berth2) return false; // inside the collider (or hugging it) -- reject
            }
            return true;
          };

          // Random anchor for this load.
          const ax = sk.worldX + (Math.random() * 2 - 1) * S.SCATTER;
          const az = sk.worldZ + (Math.random() * 2 - 1) * S.SCATTER;

          // The anchor is clear on almost every load, since scenery covers well under 1% of the plane.
          // On the rare miss, walk a Vogel spiral outward: radius proportional to sqrt(k) gives uniform sample density and the golden angle keeps the probes isotropic and non-repeating, so each one is a brand-new patch of snow and the search converges in a few steps.
          let x = ax,
            z = az;
          if (!isClear(x, z)) {
            const GOLDEN = 2.399963229728653; // golden angle (rad)
            for (let k = 1; k <= S.MAX_PROBES; k++) {
              const rad = S.PROBE_STEP * Math.sqrt(k);
              const ang = k * GOLDEN;
              x = ax + rad * Math.cos(ang);
              z = az + rad * Math.sin(ang);
              if (isClear(x, z)) break; // MAX_PROBES is a rail I never expect to hit
            }
          }

          // Seed both live and previous so frame 0's swept segment is zero-length (no phantom first-frame contact) -- mirrors the invariant set in the Skier ctor.
          sk.worldX = sk.prevX = x;
          sk.worldZ = sk.prevZ = z;
        }

        _sizeFanForFOV() {
          const C = CONFIG.CAMERA;

          // Size the wedge for the widest view the camera can ever present: the FOV at full speed (FOV + FOV_SPEED_ADD), the entire free-look yaw range, and a margin.
          // The fan is still re-aimed at the look azimuth each frame so it stays centred and efficient, but sizing it this generously means the straight edge stays well off screen even with mouse-look pinned to its limit at top speed.
          const maxFov = ((C.FOV + C.FOV_SPEED_ADD) * Math.PI) / 180;
          const aspect = window.innerWidth / window.innerHeight;
          const hHalfMax = Math.atan(Math.tan(maxFov / 2) * aspect);
          STATE.fanHalfAngle = Math.min(
            Math.PI * 0.98,
            hHalfMax + C.LOOK_YAW_MAX + 0.18,
          );
        }

        // Returns the names of the assets that did not arrive, so the splash can say which.
        // Each loader already resolves null rather than rejecting, so one missing file cannot take the others down with it, and the caller decides what a partial load means.
        async _loadModels() {
          const S = CONFIG.SKIER;
          const jobs = [
            ["model", () => loadGlbAsync(assetURL(S.MODEL_URL))],
            ["colour map", () => loadTexAsync(assetURL(S.TEX_COLOR), true)], // srgb
            ["normal map", () => loadTexAsync(assetURL(S.TEX_NORMAL))],
            ["ambient occlusion map", () => loadTexAsync(assetURL(S.TEX_AO))],
          ];
          if (S.GEAR_URL)
            jobs.push([
              "skis and poles",
              () => loadGlbAsync(assetURL(S.GEAR_URL)),
            ]);

          // Progress is counted on settle rather than on bytes: these are five separate requests with no shared total, and a percentage that jumps in fifths is honest where a byte count would be invented.
          let done = 0;
          const failed = [];
          const results = await Promise.all(
            jobs.map(([name, run]) =>
              run().then((v) => {
                if (!v) failed.push(name);
                window.__boot.progress(++done, jobs.length);
                return v;
              }),
            ),
          );

          const [glb, color, normal, ao, gear = null] = results;
          if (glb) this.skier.setModel(glb, { color, normal, ao }, gear);
          return failed;
        }

        // Repaint after the player changes camera framing while the loop is parked.
        // Same problem _onResize has: with the game paused or the splash up, nothing draws, so a wheel notch or a first/third-person toggle sits invisible until play resumes.
        // The camera has to be advanced, not just redrawn -- render() projects whatever the chase rig last placed, so a bare repaint would show the old framing.
        // dt is 0, which makes every eased term a no-op and leaves the discrete work: the chase rig snaps to the new back, and entering first person snaps the eye offset because _fpsInit is false on the way in.
        // _LOOK_ARG still holds the last frame's free-look angles, which is exactly right -- nothing moved the mouse while paused.
        // Deliberately does not re-run the rest of updateView. The ground fan, sky lock and scenery streaming key off the camera and go a few metres stale, which is invisible at their scales (FAN_BEHIND_CAM 6 m, VIEW_RADIUS 340 m) and is corrected on the first real frame. The shadow box does not move at all, since it is fitted to the skier and the skier is not moving while paused. Running the rest here would mean re-running decals, spray and audio for a frame that never advanced.
        refreshFraming() {
          this.chaseCam.update(0, this.skier, _LOOK_ARG);
          this.render();
        }

        _onResize() {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          const oldHalf = STATE.fanHalfAngle;
          this._sizeFanForFOV();
          if (Math.abs(STATE.fanHalfAngle - oldHalf) > 0.03) {
            const oldGeo = this.groundFan.geometry;
            this.groundFan.geometry = makeFanGeometry();
            oldGeo.dispose();
          }

          // setSize clears the drawing buffer, and while the loop is parked (splash up, or paused) nothing repaints it.
          // Repaint via this.render(), not the bare renderer: the scene sits at 1 AU and only render()'s floating-origin rebase makes it draw at all -- a raw renderer.render() projects 1 AU through float32 and the world lands off-screen as noise.
          // Twice, because rAF can be throttled when backgrounded and orientationchange can precede the innerWidth/Height settle on mobile.
          this.render();
          requestAnimationFrame(() => this.render());
        }

        // Obstacle collisions against scenery trees and boulders.
        // Obstacles are regenerated from cell seeds only in the few cells around the skier -- no stored lists, no full scan -- and each candidate is culled by squared distance and by being behind the movement direction before any precise work.
        // Survivors are classified into a central head-on zone (stop dead) or a side zone (bounce off laterally, shed some speed).
        // Sounds differ tree vs boulder and head-on vs glancing.
        _resolveCollisions(dt) {
          const _dt = dt || 1 / 60; // the turn assists below are rates, not per-frame nudges
          const sk = this.skier;
          const SC = CONFIG.COLLIDE;

          // Altitude above the local surface (~0 on the ground).
          // Airborne, I let the skier fly over obstacles shorter than this but still collide with anything taller -- so a jump clears a low boulder yet smacks into a tree.
          // Grounded alt ~ 0, so nothing changes there.
          const alt = sk.worldY - sk.cachedCenterGroundY;
          const fx = sk.fx,
            fz = sk.fz; // forward (unit)
          const rx = -fz,
            rz = fx; // right (unit)
          const out = this._obstacles;

          // Every obstacle is a symmetric 2x2 form Q with the skier radius already folded in: a world offset (dx,dz) from its centre is inside iff dx*dx*q11 + 2*dx*dz*q12 + dz*dz*q22 <= 1.
          // Trees are isotropic (a circle is the equal-axis ellipse); boulders are the exact oriented projection of their 3D ellipsoid onto the ground.
          // One code path serves both.

          // ---- Continuous (swept) detection: the anti-tunnelling guard.
          // --------------------
          // A discrete overlap test only samples the end-of-step position, so a long step can pass clean over an obstacle: at the top speed of 46 m/s a full 1/60 s sim step covers 0.77 m, comparable to a trunk's own diameter.
          // So treat this frame's motion as the segment prev->current, find the first obstacle the path enters, and snap to that contact before the resolver runs.
          // Path-exact, so no step however large can pass through.
          const p0x = sk.prevX,
            p0z = sk.prevZ; // where this frame's motion began
          const p1x = sk.worldX,
            p1z = sk.worldZ; // where the integrator left me (endpoint)
          const segx = p1x - p0x,
            segz = p1z - p0z; // this frame's displacement
          const seg2 = segx * segx + segz * segz; // squared step length

          // Broad-phase gather must cover the whole segment, not just a point.
          // Centre on the segment midpoint and inflate the reach by half the step so every cell the path touches is built.
          const stepLen = Math.sqrt(seg2);
          const midX = (p0x + p1x) * 0.5,
            midZ = (p0z + p1z) * 0.5;
          const reach = SC.REACH + 0.5 * stepLen;
          let n = this.forest.nearbyObstacles(midX, midZ, reach, out, 0);
          n = this.boulders.nearbyObstacles(midX, midZ, reach, out, n);

          // Sweep, contact, slide, re-sweep.
          // For each obstacle the skier began outside of, solve f(t) = 1 along the segment where f(t) = (m0 + t*seg)^T Q (m0 + t*seg), and keep the earliest entry t in [0,1).
          // Obstacles already overlapped at the start of a pass are skipped -- those are resting or sliding contacts the resolver handles, and pulling them back would pin the skier.
          //
          // Seat at the contact, clip the remaining motion into that contact's tangent, and sweep again with what is left.
          // Stopping at the first contact would cost the whole remainder of the step for a graze, and would leave that remainder untested -- exactly what a treeline produces: clip one trunk, keep moving, meet the next.
          // The seat is a hair inside the ellipse (SEPARATION), which gives the resolver a clean unambiguous overlap and means the "started outside" skip stops the next pass re-hitting the obstacle it is resting against, so the loop cannot spin in place.
          //
          // The broad-phase gather above is done once for the whole frame and every pass reuses it, so a pass costs only the narrow-phase quadratic; a pass that finds nothing breaks immediately, so an uncontested frame costs exactly one pass.
          // Remember the squarest obstacle the sweep actually touched: the slide routinely carries me clear before the frame ends, so the end-of-frame overlap loop sees nothing, and without this brushing a trunk at 40 m/s would be free and silent.
          let sweptO = null,
            sweptApproach = -1,
            sweptNX = 0,
            sweptNZ = 0,
            sweptCX = 0,
            sweptCZ = 0;
          if (seg2 > 1e-12) {
            let ax = p0x,
              az = p0z; // where the current pass starts
            let mx = segx,
              mz = segz; // motion still to be spent
            for (let iter = 0; iter < SC.SWEEP_ITERS; iter++) {
              const m2 = mx * mx + mz * mz;
              if (m2 < 1e-12) break; // nothing left to travel
              let hit = null,
                tMin = 1;
              for (let i = 0; i < n; i++) {
                const o = out[i];
                if (alt > o.topH) continue; // already above this one -> can't hit it
                const m0x = ax - o.wx,
                  m0z = az - o.wz;
                const Qm0x = o.q11 * m0x + o.q12 * m0z,
                  Qm0z = o.q12 * m0x + o.q22 * m0z;
                const c0 = m0x * Qm0x + m0z * Qm0z - 1; // f(0) - 1; > 0 means started outside
                if (c0 <= 0) continue;
                const Qdx = o.q11 * mx + o.q12 * mz,
                  Qdz = o.q12 * mx + o.q22 * mz;
                const a2 = mx * Qdx + mz * Qdz; // m^T Q m (> 0)
                const b1 = 2 * (mx * Qm0x + mz * Qm0z); // 2 m^T Q m0
                const disc = b1 * b1 - 4 * a2 * c0;
                if (disc < 0) continue; // path never reaches this ellipse
                const t = (-b1 - Math.sqrt(disc)) / (2 * a2); // entry (smaller root)
                if (t >= 0 && t < tMin) {
                  tMin = t;
                  hit = o;
                }
              }
              if (!hit) {
                // Clear run: spend the remainder and stop.
                ax += mx;
                az += mz;
                break;
              }

              // Advance to the contact, then seat a hair inside along the inward normal.
              ax += mx * tMin;
              az += mz * tMin;
              const qx = ax - hit.wx,
                qz = az - hit.wz;
              const gx = hit.q11 * qx + hit.q12 * qz,
                gz = hit.q12 * qx + hit.q22 * qz; // outward normal dir (gradient of the form)
              const gl = len2(gx, gz) || 1;
              const nx = gx / gl,
                nz = gz / gl;
              // Capture the contact before seating inward: this point is exactly on the surface (f == 1), which is the geometry the classification wants.
              const swAp = -(fx * nx + fz * nz);
              if (swAp > sweptApproach) {
                sweptApproach = swAp;
                sweptO = hit;
                sweptNX = nx;
                sweptNZ = nz;
                sweptCX = ax;
                sweptCZ = az;
              }
              ax -= nx * SC.SEPARATION;
              az -= nz * SC.SEPARATION;

              // Whatever motion is left gets its into-surface component removed -- it slides along the trunk instead of evaporating.
              let rmx = mx * (1 - tMin),
                rmz = mz * (1 - tMin);
              const into = -(rmx * nx + rmz * nz);
              if (into > 0) {
                rmx += into * nx;
                rmz += into * nz;
              }
              mx = rmx;
              mz = rmz;
            }
            sk.worldX = ax;
            sk.worldZ = az;
          }

          // The resolver runs at the (possibly corrected) position -- always at or just inside a genuine contact whenever the path crossed one.
          const px = sk.worldX,
            pz = sk.worldZ;

          // Every contact is recorded, not just the winner.
          // "Slide along a surface" is only well-posed when there is exactly one surface: with two trunks in contact, which one the velocity is clipped against falls out of cell iteration order, so pinned in a gap the resolver picks trunk A, slides cleanly into trunk B, then picks B and slides back into A, forever.
          // The plane list makes the wedged case a constraint set rather than a choice.
          const CT = this._contacts;
          let nc = 0;
          let bestHeadOn = null,
            bestApproach = -1,
            headLat = 0,
            headNX = 0,
            headNZ = 0;
          let glanced = false,
            glanceKind = 0,
            glanceLat = 0,
            glanceNX = 0,
            glanceNZ = 0,
            glanceDeepest = -1; // Deepest glance now wins, not the last one visited -- a real ordering, independent of how the streamer walked its cells
          for (let i = 0; i < n; i++) {
            const o = out[i];
            if (alt > o.topH) continue; // above its top -> fly over it
            const qx = px - o.wx,
              qz = pz - o.wz; // skier relative to obstacle centre
            const Qqx = o.q11 * qx + o.q12 * qz,
              Qqz = o.q12 * qx + o.q22 * qz;
            const f = qx * Qqx + qz * Qqz; // inside the footprint iff <= 1
            if (f > 1) continue; // not touching -> skip (broad)
            // Outward unit normal = normalised gradient of the quadratic form.
            const gl = len2(Qqx, Qqz) || 1e-4;
            const nx = Qqx / gl,
              nz = Qqz / gl;
            // Behind-cull: ignore an obstacle whose centre is clearly behind the heading (already passed), measured against this ellipse's own forward extent.
            const fq =
              fx * (o.q11 * fx + o.q12 * fz) + fz * (o.q12 * fx + o.q22 * fz);
            const rFwd = 1 / Math.sqrt(fq); // footprint half-extent along heading
            const ahead = -(qx * fx + qz * fz); // > 0 if centre is ahead
            if (ahead < -0.5 * rFwd) continue;

            // Resting-contact push-out.
            // Correct only the penetration that exceeds the slop, and only a fraction of it, and never past the surface (no outward epsilon).
            // With a slop band the end-of-frame depth converges to a fixed point and simply holds, so the contact is dead still.
            // Tunnelling is still impossible: the swept test above is what guarantees that, not this push-out.
            const dRad = len2(qx, qz);
            const invs = 1 / Math.sqrt(Math.max(f, 1e-6)); // scale factor to the surface
            const overlap = dRad * (invs - 1); // radial penetration depth
            const corr =
              Math.max(0, overlap - SC.CONTACT_SLOP) * SC.CONTACT_CORRECT;
            sk.worldX += nx * corr;
            sk.worldZ += nz * corr;

            // Head-on vs glancing, from how squarely the heading drives into the surface.
            // approach=1 is dead-on; the per-kind lateral fraction maps to an approach threshold so trees stop me only near dead-centre while boulders stop me across a wider band (unchanged feel).
            const lat = qx * rx + qz * rz; // signed lateral offset of the obstacle centre from the skier
            const approach = -(fx * nx + fz * nz); // 1 = into the face, 0 = tangential
            const frac =
              o.kind === 0 ? SC.TREE_HEADON_LAT : SC.BOULDER_HEADON_LAT;
            const headApproach = Math.sqrt(1 - frac * frac);
            const headOn = ahead > 0 && approach > headApproach;

            // Record the plane.
            // Full list -> keep the deeper contact; a shallow graze has no business displacing a trunk I am buried in.
            {
              let slot = -1;
              if (nc < SC.MAX_CONTACTS) slot = nc++;
              else {
                let worst = overlap;
                for (let k = 0; k < nc; k++)
                  if (CT[k].overlap < worst) {
                    worst = CT[k].overlap;
                    slot = k;
                  }
              }
              if (slot >= 0) {
                const c = CT[slot];
                c.nx = nx;
                c.nz = nz;
                c.overlap = overlap;
              }
            }
            if (headOn) {
              if (approach > bestApproach) {
                bestApproach = approach;
                bestHeadOn = o;
                headLat = -lat;
                headNX = nx;
                headNZ = nz;
              }
            } else if (overlap > glanceDeepest) {
              glanceDeepest = overlap;
              glanced = true;
              glanceKind = o.kind;
              glanceLat = -lat;
              glanceNX = nx;
              glanceNZ = nz;
            }
          }

          // Swept-only contact: the path clipped something, but the slide carried the skier clear before the frame ended, so the loop above found no overlap to classify.
          // Classify it at the contact point instead -- f == 1 exactly there -- under the same head-on/glance rules, so a graze fully resolved inside one frame still sounds, still costs speed, and still constrains which way the remaining speed may point.
          // No push-out: sitting exactly on the surface, there is no penetration to remove.
          if (nc === 0 && sweptO) {
            const o = sweptO;
            const qx = sweptCX - o.wx,
              qz = sweptCZ - o.wz;
            const lat = qx * rx + qz * rz;
            const ahead = -(qx * fx + qz * fz);
            const frac =
              o.kind === 0 ? SC.TREE_HEADON_LAT : SC.BOULDER_HEADON_LAT;
            const headApproach = Math.sqrt(1 - frac * frac);
            const c = CT[nc++];
            c.nx = sweptNX;
            c.nz = sweptNZ;
            c.overlap = 0;
            if (ahead > 0 && sweptApproach > headApproach) {
              bestApproach = sweptApproach;
              bestHeadOn = o;
              headLat = -lat;
              headNX = sweptNX;
              headNZ = sweptNZ;
            } else {
              glanced = true;
              glanceKind = o.kind;
              glanceLat = -lat;
              glanceNX = sweptNX;
              glanceNZ = sweptNZ;
            }
          }

          // Branch brush: feedback only, no physics.
          // TRUNK_RADIUS is a fraction of the painted crown because being stopped by air is a worse failure than clipping foliage.
          // Rides the broad-phase list the sweep already gathered, so it is one distance test per nearby tree.
          let brushDepth = 0,
            brushNX = 0,
            brushNZ = 0;
          if (sk.speed >= SC.BRUSH_MIN_SPEED) {
            for (let i = 0; i < n; i++) {
              const o = out[i];
              if (!o.canopyR || alt > o.topH) continue; // rocks, and crowns I am flying over
              const dx = px - o.wx,
                dz = pz - o.wz;
              const d2 = dx * dx + dz * dz;
              if (d2 >= o.canopyR * o.canopyR) continue;
              const d = Math.sqrt(d2);
              const depth = 1 - d / o.canopyR; // 0 at the crown's edge, 1 at the trunk
              if (depth <= brushDepth) continue; // deepest crown wins, so overlapping trees don't stack
              brushDepth = depth;
              const inv = d > 1e-4 ? 1 / d : 0;
              brushNX = dx * inv;
              brushNZ = dz * inv;
            }
          }
          if (brushDepth > 0) {
            // See CONFIG.COLLIDE.BRUSH_DEPTH_REF: raw depth tops out well below 1, so it is normalised here rather than left to skew every constant downstream.
            const depth = clamp(brushDepth / SC.BRUSH_DEPTH_REF, 0, 1);
            const spd =
              SC.BRUSH_SPEED_FLOOR +
              (1 - SC.BRUSH_SPEED_FLOOR) *
                clamp(sk.speed / CONFIG.SKIER.SPEED_MAX, 0, 1);
            const amt = depth * spd;
            sk.brushPuff = amt; // mailbox; SnowSpray consumes and clears it
            sk.brushNX = brushNX;
            sk.brushNZ = brushNZ;
            // Audio fires on the way IN only.
            // The spray is continuous while inside the crown -- that is what pushing through branches looks like -- but a whoosh re-triggering every frame is a buzz, not a tree.
            if (!this._inCanopy) {
              if (SOUND && amt >= SC.BRUSH_MIN_SOUND)
                SOUND.brush(clamp(amt * SC.BRUSH_VOL, 0.4, 1));
            }
            this._inCanopy = true;
          } else this._inCanopy = false;

          // Sound gating by collision episode.
          // A sound fires once when a hit begins and cannot fire again until the skier has genuinely separated from obstacles for a sustained stretch (CLEAR_FRAMES).
          // Contact flicker from collide-and-slide, and being pinned while gravity holds the skier against the obstacle, never accumulate sustained separation, so they can never re-trigger.
          // The only way to get another sound is to get clear and hit something again.
          // Plus the speed floor, so gentle taps are silent.
          const speedKmh = sk.speed * 3.6;
          const contact = !!bestHeadOn || glanced;
          if (contact) {
            const armed = this._clearFrames >= SC.CLEAR_FRAMES; // was I genuinely separated?
            if (armed && speedKmh >= SC.MIN_SOUND_KMH) {
              if (bestHeadOn && SOUND) SOUND.impact(bestHeadOn.kind, true, 1);
              else if (glanced && SOUND) SOUND.impact(glanceKind, false, 0.8);
            }
            this._clearFrames = 0; // in contact -> reset separation
          } else {
            // Airborne and clear of every (active) obstacle counts as fully separated -- so a hit the instant I touch down still sounds.
            // On the ground, accumulate separation frames normally.
            this._clearFrames = sk.airborne ? 999 : this._clearFrames + 1;
          }

          // Collide-and-slide for the velocity, over every contact plane at once: remove the component going into each surface, keep the tangential part, then re-express as scalar speed along the player-controlled heading.
          // This is what stops clip-through -- at any speed the inward velocity is cancelled every frame, so I can only slide along a surface, never drive into it.
          // Head-on bleeds nearly all of it, glancing keeps most.
          // Which contact decides head-on vs glancing is still the single dominant one; the plane list governs only the direction the surviving speed may point.
          if (bestHeadOn || glanced) {
            const cnX = bestHeadOn ? headNX : glanceNX; // dominant contact normal (outward)
            const cnZ = bestHeadOn ? headNZ : glanceNZ;
            const vx = sk.fx * sk.speed,
              vz = sk.fz * sk.speed;
            const into = -(vx * cnX + vz * cnZ); // how much velocity points into the dominant surface
            // Mid-air hit -> outward knockback so I peel off and fall clear (applied+decayed in the airborne integrator).
            // Keep the strongest pulse so a weak follow-up frame can't erase it.
            // Grounded this never runs (knock stays 0), so resting contacts are completely unchanged.
            if (sk.airborne && into > 0) {
              const kmag = Math.min(into * SC.AIR_BOUNCE, SC.AIR_BOUNCE_MAX);
              if (kmag * kmag > sk.knockX * sk.knockX + sk.knockZ * sk.knockZ) {
                sk.knockX = cnX * kmag;
                sk.knockZ = cnZ * kmag;
              }
            }

            // Clip against all contact planes, repeatedly, until the velocity satisfies every one of them.
            // Clipping into plane A routinely pushes the result through plane B, so one pass is not a fixed point; re-running until a pass changes nothing is.
            let sx = vx,
              sz = vz;
            for (let pass = 0; pass < 2; pass++) {
              let moved = false;
              for (let k = 0; k < nc; k++) {
                const c = CT[k];
                const d = -(sx * c.nx + sz * c.nz);
                if (d > 1e-4) {
                  sx += d * c.nx;
                  sz += d * c.nz;
                  moved = true;
                }
              }
              if (!moved) break;
            }

            // Still violating something after the passes means the planes have closed around the skier.
            // In 3D two planes leave a crease to slide down; in 2D they leave nothing, because the free direction of a corner is the cross product and here it points straight out of the world.
            // So the honest answer to being wedged between two trunks is that you stop, which is also what happens if you try it on a real hill.
            for (let k = 0; k < nc; k++) {
              if (-(sx * CT[k].nx + sz * CT[k].nz) > 1e-3) {
                sx = 0;
                sz = 0;
                break;
              }
            }
            const along = sx * sk.fx + sz * sk.fz; // re-project onto heading
            if (bestHeadOn) {
              sk.speed = Math.max(0, along); // head-on: keep only forward slide (stops)
              // Auto-unstick nudge, only when the player isn't steering (they own the heading otherwise) and only when clearly off-centre, so a dead-centre rest doesn't flip the nudge direction every frame.
              // Either guard alone removes the camera judder; both make it robust and allow simply steering off a face the skier has stopped against.
              if (
                Math.abs(sk.steerInput) < SC.ASSIST_STEER_DB &&
                Math.abs(headLat) > SC.ASSIST_LAT_DB
              ) {
                // Per-frame nudges are per-second rates in disguise: unscaled, this spins twice as fast at 120 fps.
                // Both assists are authored per 60th of a second.
                sk.heading +=
                  (headLat >= 0 ? -1 : 1) * SC.HEADON_TURN_ASSIST * _dt * 60;
              }
            } else {
              // glancing: keep the slide but retain most speed (whoosh past), steer away a touch
              sk.speed =
                Math.max(0, along) * SC.GLANCE_SPEED_KEEP +
                sk.speed * (1 - SC.GLANCE_SPEED_KEEP) * 0.5;
              if (Math.abs(sk.steerInput) < SC.ASSIST_STEER_DB) {
                sk.heading +=
                  (glanceLat >= 0 ? -1 : 1) * SC.GLANCE_TURN * _dt * 60;
              }
            }
          }
        }

        // Simulation ONLY -- substepped, so this may run several times per frame.
        // Nothing that costs render-frame money belongs here; see updateView.
        updateSim(dt, inputs) {
          this.time += dt; // run clock (suspends on pause: updateSim isn't called while paused)

          // ---- Live grade: ease toward the slow-noise target sampled at the skier.
          // ----
          const S = CONFIG.SLOPE;
          const gradeTarget = sampleGradeTarget(
            this.skier.worldX,
            this.skier.worldZ,
          );
          STATE.slopeGrade +=
            (gradeTarget - STATE.slopeGrade) * expK(S.GRADE_LERP, dt);

          this.skier.update(dt, inputs);
          this._resolveCollisions(dt);
          if (this.skier.hopConsumed) this.input.clearHop();

          // Distance (2D horizontal path) + monotonic vertical descent.
          // Vertical drop = grade x (downhill component of movement); only the downhill part is added, so turning across or up the slope never decreases the elevation-lost counter.
          if (this._hasLast) {
            const dx = this.skier.worldX - this._lastX;
            const dz = this.skier.worldZ - this._lastZ;
            this.distM += Math.sqrt(dx * dx + dz * dz);
            const along = dx * CONFIG.SLOPE.DIR_X + dz * CONFIG.SLOPE.DIR_Z; // +ve = downhill
            // The two counters are mirror images and both monotonic: descent takes only the downhill component, ascent only the uphill one, so traversing or switchbacking up a pitch adds to climb without ever eating into vert.
            // Same grade x horizontal-run conversion for both.
            if (along > 0) this.vert += along * STATE.slopeGrade;
            else this.climb += -along * STATE.slopeGrade;
          } else this._hasLast = true;
          this._lastX = this.skier.worldX;
          this._lastZ = this.skier.worldZ;
        }

        // Presentation -- exactly once per rendered frame, on the whole frame's dt.
        //
        // Everything here is a pure function of the simulation's end state, so it runs once no matter how many substeps the frame took.
        // Running it per substep would multiply the frame's visual cost by up to SIM_MAX_STEPS on precisely the hitch frames that caused the substepping: the spiral the step cap exists to prevent, paid for out of the wrong budget.
        //
        // The integrators here are all exponential (1 - exp(-dt/tau)), which compose exactly, so one call on the full dt is identical to N calls on dt/N -- not an approximation of it.
        updateView(dt, inputs) {
          this.skier.syncPose();
          this.skier.applyPoseIK(dt); // legs (terrain split + herringbone gait) + arm counter-lean

          // Ski tracks + herringbone prints, laid off the pose that was just solved.
          this.decals.update(this.skier);

          // Camera next, so the effective view yaw (skier heading + free-look) is known before anything below is aimed by it.
          _LOOK_ARG.yaw = inputs.lookYaw;
          _LOOK_ARG.pitch = inputs.lookPitch;
          this.chaseCam.update(dt, this.skier, _LOOK_ARG);
          const yaw = this.chaseCam.effectiveYaw;
          const vfx = Math.sin(yaw),
            vfz = -Math.cos(yaw); // camera forward on the ground

          // Fan apex is anchored directly behind the camera along the view azimuth, not behind the skier.
          // The camera sits behind the skier along the skier's heading, but the wedge must be symmetric about the look direction.
          // Behind the camera along (vfx,vfz) puts the camera exactly on-axis with zero lateral offset, so both edges stay off-screen at any free-look yaw.
          const fanX =
            this.camera.position.x - vfx * CONFIG.CAMERA.FAN_BEHIND_CAM;
          const fanZ =
            this.camera.position.z - vfz * CONFIG.CAMERA.FAN_BEHIND_CAM;
          this._fanGroup.position.set(fanX, 0, fanZ);
          this._fanGroup.rotation.y = -yaw;
          this.groundFan.updateNoiseWrap(fanX, fanZ);
          this.groundFan.updateSlope(
            fanX,
            fanZ,
            this.skier.worldX,
            this.skier.worldZ,
          );

          // Sun direction into view space (the camera matrix is current after the chase update), plus a clock and the player's world position.
          // Wrapped for the same float32 reason as the cloud clock, and more fragile than it: the shader multiplies uTime by up to 8.5, so quantisation shows in the twinkle phase well before the drift itself stalls.
          // A wrap re-randomises each glint's phase for one frame, which on sub-pixel points is invisible, so this one can wrap aggressively.
          this._clock = pmod(this._clock + dt, SPARKLE_T_WRAP);
          this.camera.updateMatrixWorld();
          this.camera.matrixWorldInverse.copy(this.camera.matrixWorld).invert();
          this._sunView
            .copy(this._sunDir)
            .transformDirection(this.camera.matrixWorldInverse);
          this.groundFan.updateIce(
            this._clock,
            this._sunView,
            this.skier.worldX,
            this.skier.worldZ,
          );

          // Fit the sun's shadow frustum to the camera's view now that the camera is posed.
          this._fitSunShadow();

          // Stream the persistent forest.
          // Trees are culled by distance from the camera, which sits behind the skier, so a tree doesn't pop out just because the skier reached it while it is still on screen.
          // groundY mirrors exactly how the skier and ground compute height (terrain noise plus player-pivoted slope), so trunks sit on the snow and ride the slope identically.
          {
            const px = this.skier.worldX,
              pz = this.skier.worldZ;
            const cam = this.chaseCam.camera.position;
            this._gpx = px;
            this._gpz = pz; // refresh sampler origin (no closure alloc)
            this.forest.update(px, pz, cam.x, cam.z, this._groundAt, this.time);

            // Trees shade the skier even though they no longer cast into the atlas.
            // The forest worked the answer out while placing this frame's shadows, so it costs two dot products per visible tree and, unlike a shadow map, it reaches every tree in the streamer rather than only those inside the box.
            // Eased rather than applied raw: the analytic test is a hard-edged triangle, and a shadow edge arriving at 46 m/s should darken over a few frames, not a single one.
            this._sunShadeEased +=
              (this.forest.sunShade() - this._sunShadeEased) *
              expK(CONFIG.SHADOW.DECAL.SHADE_LERP, dt);
            this.skier.setSunShade(this._sunShadeEased);
            this.boulders.update(px, pz, cam.x, cam.z, this._groundAt);
          }

          // Sky + peaks + snow lock to the camera; snow streaks along the skier velocity.
          // Sky + peaks lock to the camera in X/Z only.
          // Keeping Y fixed means the peak ring sits at a stable world height instead of riding up with the eye.
          this.skyGroup.position.set(
            this.camera.position.x,
            0,
            this.camera.position.z,
          );
          this.peaks.update();
          this.clouds.update(dt, this.camera.position);
          this.snow.update(
            dt,
            this.camera.position,
            this.skier.fx * this.skier.speed,
            this.skier.fz * this.skier.speed,
          );

          // Thrown snow.
          // Runs here, after applyPoseIK has measured the skis and after _sunView is current for this frame, so the emitters sit on the real gear and the forward-scatter is not a frame stale.
          this.spray.update(dt, this.skier, this._sunView);

          // Lens flare: cheap on-screen test, then a short near-field occlusion march.
          // For a near-horizon sun the ray barely climbs, so only close, clearly protruding terrain is allowed to block it, and it fades rather than hard-cutting; otherwise the flare would be perpetually occluded by the gently rising slope ahead.
          // Camera matrices are still the ones built above for the ice pass: nothing between moves the camera, only reads it. Recomputing here would cost a compose and a 4x4 invert every frame for an identical result.
          let flareStrength = 0;
          if (this.lensFlare._projectSun(this.camera, this._sunDir)) {
            flareStrength = 1;
            const cam = this.camera.position,
              sd = this._sunDir,
              px = this.skier.worldX,
              pz = this.skier.worldZ;
            for (let d = 4; d <= 60; d += 4) {
              const wx = cam.x + sd.x * d,
                wz = cam.z + sd.z * d;
              const h = sampleTerrain(wx, wz) + slopeOffset(wx - px, wz - pz);
              const clearance = cam.y + sd.y * d - h;
              if (clearance < 0.3) {
                flareStrength = clamp(clearance / 0.3, 0, 1);
                break;
              }
            }
          }
          this.lensFlare.update(flareStrength);

          if (SOUND) {
            const speedFrac = clamp(
              this.skier.speed / CONFIG.SKIER.SPEED_MAX,
              0,
              1,
            );
            SOUND.update(speedFrac);

            // Carve spray tracks the actual edge bite (smoothed turnRate), not steering intent, and only on the ground -- no spray while airborne.
            const turnNorm = this.skier.airborne
              ? 0
              : clamp(this.skier.turnRate / CONFIG.SKIER.TURN_RATE_MAX, -1, 1);
            SOUND.setCarve(turnNorm, speedFrac, this.skier.brakeBlend * 0.85);
          }
        }

        // Fit the sun's orthographic shadow frustum to the camera's view -- stably.
        //
        // A box whose SIZE never changes (the prerequisite for texel snapping), so I bound the view slice with its sphere instead of its corners:
        // * a sphere's radius is independent of where the camera points, so turning never resizes it;
        // * I size it for the widest fov the speed-punch reaches, so accelerating never resizes it.
        // With a constant size, snapping the centre to the shadow texel grid means the box can only jump in whole-texel steps, so the map re-renders onto the same world texels each frame and edges stop shimmering.
        // A sphere bounds the view a little loosely, so some of the atlas sits outside the strict view; RANGE keeps that modest.
        // All maths is in absolute world space: the rebase in render() shifts the casters and the sun by the same vector, so it cancels out of the shadow projection entirely.
        _fitSunShadow() {
          const SH = CONFIG.SHADOW,
            SL = CONFIG.SLOPE,
            sk = this.skier,
            r = SH.RADIUS;
          // Centred on the skier's middle, not their feet -- see SUBJECT_LIFT.
          const c = this._shTmp.c.set(
            sk.worldX,
            sk.worldY + SH.SUBJECT_LIFT,
            sk.worldZ,
          );

          // Texel-snap the centre in the sun's frame.
          // The box is a constant square, so quantising its centre pins the grid to the world: the box can only move in whole texels, the map re-renders onto the same world texels each frame, and edges stop crawling.
          const xL = this._sunRight,
            yL = this._sunUp,
            zL = this._sunDir;
          const wpt = (2 * r) / SH.MAP; // world units per shadow texel (constant)

          // Snap against the terrain, not against absolute world space, because the terrain is not still.
          // The visible surface is sampleTerrain + slopeOffset, and slopeOffset pivots the fall line on the player: h(p) = noise(p) - grade * dot(p - player, dir), which rearranges to [noise(p) - grade * dot(p, dir)] + grade * dot(player, dir).
          // The bracket is fixed in world space; the second term is a uniform vertical lift of every surface and of everything standing on one, and it changes every frame the player moves along the fall line.
          // Snapping in absolute space therefore pins the grid to a frame the content is sliding through. At 46 m/s the world lifts 0.23 m per frame, which is 2.7 shadow texels of drift the snap never sees, and it scales with speed -- which is why the edges are still when standing and crawl when moving.
          // So lift the centre into the terrain's own frame before quantising and put it back afterwards. The grid then travels with the content, and a given patch of snow lands on the same texel every frame.
          const lift =
            STATE.slopeGrade * (sk.worldX * SL.DIR_X + sk.worldZ * SL.DIR_Z);
          c.y -= lift;

          const lx = c.dot(xL),
            ly = c.dot(yL);
          c.addScaledVector(
            xL,
            Math.round(lx / wpt) * wpt - lx,
          ).addScaledVector(yL, Math.round(ly / wpt) * wpt - ly);

          c.y += lift;

          // Aim the sun at the snapped centre, standing off far enough that the skier clears the near plane.
          const eyeDist = r + SH.NEAR_PAD;
          this.sun.position.copy(c).addScaledVector(zL, eyeDist);
          this.sun.target.position.copy(c);

          const s = this.sun.shadow.camera;
          s.left = -r;
          s.right = r;
          s.bottom = -r;
          s.top = r;
          s.near = 1;
          // Far has to reach past the caster, not just enclose the box: an airborne skier's shadow lands further down the ray, and beyond this plane it stops existing.
          s.far = eyeDist + SH.DEPTH_REACH;
          s.updateProjectionMatrix();
        }

        // Floating-origin rebase -- the keystone that makes stock shadows possible here.
        //
        // Game logic runs in absolute world space and the skier rides at 1 AU to prove the precision holds.
        // That works for the normal render because three composes each modelView as (cameraWorldInverse * objectWorld) in double precision, so the 1 AU cancels before the float32 truncation, and directional lighting needs only a view-space normal.
        // Shadows break it: a receiver must project its world position into light space in the shader, and at 1 AU a float32 has ~18 km between representable values.
        //
        // The fix is a single subtraction.
        // Every visible object hangs off _worldRoot; slide the root and the camera by the same vector each frame -- the camera's own position -- putting the eye at the origin and all geometry within metres of it.
        // Camera and world move together, so it is a rigid translation and the image is byte-for-byte unchanged.
        // But each object's world matrix is now composed as (absolute - origin) in double precision before the float32 truncation, so the position the GPU projects into the shadow map is exact.
        // The sun rig is also on the root, so the depth pass is float-clean for free.
        //
        // Invariant: update() owns absolute world space; the scene is in rebased render space only for the duration of the draw.
        // I restore the camera immediately so the invariant holds.
        render() {
          // Every path in (loop, resize repaint, splash one-shot) funnels through here, so a dead context is checked once rather than at each call site.
          if (this._contextLost) return;
          const O = this._renderOrigin.copy(this.camera.position);

          // The decals' edge-noise field is keyed to absolute world XZ so it stays pinned to the snow.
          // The shader only ever sees rebased positions, so hand back the piece that was subtracted -- reduced modulo the tile period, which is all a repeating texture can distinguish, and which keeps the number small enough to survive the trip as a float32.
          // This is the only per-frame cost the whole effect has: two modulos.
          {
            const u = this.decals.mesh.material.uniforms;
            const P = u.uNoisePeriod.value;
            u.uNoiseOrigin.value.set(pmod(O.x, P), pmod(O.z, P));
          }
          this._worldRoot.position.set(-O.x, -O.y, -O.z);
          this.camera.position.set(0, 0, 0);
          this.renderer.render(this.scene, this.camera);
          this.camera.position.copy(O);
        }
      }

      // ============================================================================
      // Bootstrap
      // ============================================================================
      function init() {
        window.addEventListener("contextmenu", (e) => e.preventDefault());
        const splash = document.getElementById("splash");

        // Capability probe before anything touches the renderer.
        // new WebGLRenderer() throws on a machine without WebGL 2, and an uncaught throw here leaves a blank canvas and a console entry, which is the failure this whole path exists to stop.
        // Cheap enough to be worth doing properly: the probe context is released immediately so it cannot count against the browser's per-page context budget.
        {
          const probe = document.createElement("canvas");
          const gl = probe.getContext("webgl2");
          if (!gl) {
            window.__boot.fatal(
              "WEBGL 2 UNAVAILABLE",
              "This browser or machine cannot provide a WebGL 2 context. On desktop this is usually a disabled GPU, an out-of-date driver or hardware acceleration switched off in the browser settings.",
            );
            return;
          }
          gl.getExtension("WEBGL_lose_context")?.loseContext();
        }

        // Build the game now, at page load, and draw one frame.
        // This costs a single render rather than a running loop, but it means the scene is alive behind the splash and the renderer's stats are populated, so TAB can show real numbers there.
        // The animation loop itself only starts on START.
        try {
          GAME = new Game(document.getElementById("container"));
        } catch (err) {
          window.__boot.fatal(
            "COULD NOT START",
            (err && err.message) || "The renderer failed to initialise.",
          );
          throw err;
        }
        // Before anything drives the sim, so the tests see a clean starting state and their own mutations are rolled back before the player ever touches it.
        if (SELFTEST) SelfTest.run(GAME);
        GAME.render();

        let started = false;
        const startGame = () => {
          if (started) return;
          started = true;
          SOUND = new WindSound();
          SOUND.start();
          const muteBtn = document.getElementById("muteBtn");
          if (SOUND.muted) muteBtn.classList.add("muted");
          splash.style.pointerEvents = "none"; // stop it intercepting the very next click
          splash.classList.add("hidden");
          setTimeout(() => splash.remove(), 600);
          const game = startMainLoop();

          // Request pointer lock from within this user gesture (the start tap/click) -- the only context the browser reliably allows it.
          // Deferred calls get rejected.
          if (game && !game.input.touchOnly) {
            try {
              game.renderer.domElement.requestPointerLock()?.catch?.(() => {});
            } catch (_) {}
          }
        };
        // The splash is not clickable until the assets have settled.
        // Before this, clicking would drop the player into a world with an invisible skier and a console warning as the only clue -- which is exactly what shipping without an assets folder used to do.
        // A missing asset is reported but not fatal. The mountain, the physics, the marks and the sound are all procedural and fully playable without the character; refusing to start would turn a cosmetic gap into a dead page, which is the opposite of what this is for. Anything genuinely unrunnable (no WebGL 2, no engine) has already gone through __boot.fatal and never reaches here.
        GAME.assetsReady.then((failed) => {
          const warning = failed.length
            ? "Could not load: " +
              failed.join(", ") +
              ".\nThe run is playable; the skier will not be drawn. Check that ./assets/ is served alongside this file."
            : "";
          if (window.__boot.ready(warning))
            splash.addEventListener("click", startGame);
        });

        // Only wire the fullscreen button if the platform supports the API; otherwise hide it (e.g. iOS Safari has no Element.requestFullscreen).
        const fsBtn = document.getElementById("fullscreenBtn");
        const fsCapable = !!(
          document.documentElement.requestFullscreen ||
          document.documentElement.webkitRequestFullscreen ||
          document.documentElement.msRequestFullscreen ||
          document.documentElement.mozRequestFullScreen
        );
        if (fsCapable) {
          fsBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleFullscreen();
          });
        } else {
          fsBtn.style.display = "none";
        }
        const helpBtn = document.getElementById("helpBtn");
        const helpPanel = document.getElementById("helpPanel");
        helpBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          helpPanel.classList.toggle("show");
        });
        document.addEventListener("pointerdown", (e) => {
          if (
            helpPanel.classList.contains("show") &&
            !helpPanel.contains(e.target) &&
            !helpBtn.contains(e.target)
          )
            helpPanel.classList.remove("show");
        });
        const camBtn = document.getElementById("camBtn");
        const helpKeys = document.getElementById("helpKeys");

        // The control list is a function of the input device and the camera mode, so it is rendered rather than stored.
        // Every entry names what the control will do next rather than what mode you are in, the convention the camera button's own tooltip already follows, so a shortcut and its tooltip can never read as opposites.
        // Nothing here is omitted for brevity: a line is dropped only when the control genuinely does nothing in that mode.
        const renderHelpKeys = (fps) => {
          const rows = [];
          if (isTouchOnly()) {
            // The LOOK stick is created with lockY in first person, so it really is pitch-only there; MOVE keeps steering in both modes.
            rows.push("<b>MOVE</b>&nbsp;steer / tuck / brake");
            rows.push(
              fps
                ? "<b>LOOK</b>&nbsp;look up / down"
                : "<b>LOOK</b>&nbsp;glance around",
            );
            rows.push("<b>HOP</b>&nbsp;to jump");
            rows.push(
              (fps
                ? "<b>CAM</b>&nbsp;third person"
                : "<b>CAM</b>&nbsp;first person") + " <b>PINCH</b>&nbsp;zoom",
            );
          } else {
            rows.push(
              "<b>W</b>&nbsp;go <b>S</b>&nbsp;stop <b>A/D</b>&nbsp;turn",
            );
            // In first person the mouse stops being a free look: with no move control on that axis, mouse-X becomes the steering input (see the steerRef handover in Input.poll).
            rows.push(
              "<b>SPACE</b>&nbsp;hop " +
                (fps
                  ? "<b>MOUSE</b>&nbsp;steer + look"
                  : "<b>MOUSE</b>&nbsp;look"),
            );
            // Camera height belongs to the chase rig, and first person has no chase rig -- the eye is pinned to the head bone and STATE.camHeight is never read, so listing Ctrl+drag there would be a lie.
            rows.push(
              (fps
                ? "<b>V</b>&nbsp;third person"
                : "<b>V</b>&nbsp;first person") +
                " <b>WHEEL</b>&nbsp;zoom" +
                (fps ? "" : " <b>CTRL+DRAG</b>&nbsp;cam height"),
            );
            rows.push(
              "<b>H</b>&nbsp;this panel <b>TAB</b>&nbsp;stats <b>ESC</b>&nbsp;pause",
            );
          }
          helpKeys.innerHTML = rows.join("<br />");
        };

        const syncCamBtn = () => {
          const C = CONFIG.CAMERA;
          const fps = STATE.camBack <= C.FPS_AT;
          camBtn.classList.toggle("fps", fps);
          camBtn.title = fps ? "Third person" : "First person";

          // Folded in here rather than hung off its own hook, because this function is already the single place that reacts to the mode changing, and it is reached from the wheel, the pinch, the restored setting and the toggle alike.
          renderHelpKeys(fps);
        };
        // Leaving restores the remembered third-person framing exactly -- both back and height, since Ctrl-drag can have moved height too.
        // Entering parks at the threshold rather than at BACK_MIN: everything under FPS_AT renders identically, and stopping at the boundary means one notch of wheel gets back out.
        const toggleCam = () => {
          const C = CONFIG.CAMERA;
          if (STATE.camBack <= C.FPS_AT) {
            STATE.camBack = clamp(STATE.thirdBack, C.FPS_AT + 0.01, C.BACK_MAX);
            STATE.camHeight = clamp(
              STATE.thirdHeight,
              C.HEIGHT_MIN,
              C.HEIGHT_MAX,
            );
          } else {
            STATE.camBack = C.FPS_AT;
          }
          saveCameraFraming(); // same debounced store the wheel and pinch write through
          Store.flush(); // a button press is a discrete act; no gesture to wait out
          syncCamBtn();
        };
        camBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleCam();
        });
        // The wheel, the pinch and the restored setting all move back without going through the button, so the icon is refreshed from the same call every one of them already makes.
        _onCameraFramingChanged = syncCamBtn;
        syncCamBtn();

        const doMute = () => {
          if (!SOUND) return;
          const m = SOUND.toggleMute();
          document.getElementById("muteBtn").classList.toggle("muted", m);
        };
        document.getElementById("muteBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          doMute();
        });
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyM") doMute();
        });

        // Global shortcuts wired here (not in the game loop) so they work on the splash too.
        // Fullscreen and the stats/help toggles shouldn't need the game running.
        // Edge-triggered (ignore auto-repeat).
        const statsEl = document.getElementById("stats");
        const statsExtra = document.getElementById("statsExtra");
        const refreshStatsExtra = () => {
          // one-shot read of the latest render's counters
          if (!GAME || !statsEl.classList.contains("expanded")) return;
          statsExtra.textContent = formatRendererStats(GAME.renderer);
        };
        window.addEventListener("keydown", (e) => {
          if (e.altKey && e.code.toLowerCase() === "enter") {
            e.preventDefault();
            toggleFullscreen();
            return;
          }
          if (e.repeat) return;
          if (e.code === "Tab") {
            e.preventDefault();
            statsEl.classList.toggle("expanded");
            refreshStatsExtra();
          } else if (e.code === "KeyH") helpPanel.classList.toggle("show");
          else if (e.code === "KeyV") toggleCam(); // same path as the camera button, so key and button can never disagree
        });
      }

      let _lastRaf = 0;

      // ==========================================================================
      // SELF test -- append ?test to the URL
      // ==========================================================================
      // Property tests, not golden values.
      // A recorded "correct" hash would have to be regenerated on every tuning change, so it decays into a number people update without reading.
      // These assert invariants the architecture actually depends on, and stay valid however the constants move.
      //
      // The invariants, and the bug each one exists to catch:
      // prng a seeded stream must replay identically -- everything below rests on this expk N substeps of dt/N == one step of dt -- the frame-rate independence the whole sim claims terrain sampling is a pure function of position -- streaming assumes a cell looks the same on every visit forest.replay collision and rendering agree on obstacles -- the draw-order desync that put trees where nothing was drawn sim.pure updateSim touches no ambient entropy -- makes determinism structural rather than observed sim.determ same state + same inputs => same state, twice -- the end-to-end statement config.frozen tuning is immutable at runtime -- guards the CONFIG/STATE split
      const SELFTEST = /[?&]test\b/.test(location.search);

      const SelfTest = (() => {
        const results = [];
        const ok = (name, pass, detail) =>
          results.push({ name, pass: !!pass, detail: detail || "" });

        // Fnv-1a over raw float bits, so -0, +0 and NaN are all distinguishable.
        // A tolerance here would hide exactly the drift this is looking for.
        const _f = new Float64Array(1);
        const _u = new Uint32Array(_f.buffer);
        const hash = (nums) => {
          let h = 0x811c9dc5;
          for (let i = 0; i < nums.length; i++) {
            _f[0] = nums[i];
            h = Math.imul(h ^ _u[0], 0x01000193);
            h = Math.imul(h ^ _u[1], 0x01000193);
          }
          return h >>> 0;
        };

        // Own numeric fields, in insertion order.
        // NaN is kept deliberately: excluding it would change the key set between snapshot and restore and quietly corrupt the comparison.
        const numKeys = (o) =>
          Object.keys(o).filter((k) => typeof o[k] === "number");
        const snap = (o) => {
          const keys = numKeys(o);
          return { keys, vals: keys.map((k) => o[k]) };
        };
        const restore = (o, s) => s.keys.forEach((k, i) => (o[k] = s.vals[i]));

        // A deterministic input script.
        // Fixed seed, so the two runs of the determinism test are driven by byte-identical sequences and any divergence is the sim's, not the harness's.
        const script = (seed) => {
          const r = mulberry32(seed);
          const inp = {
            steer: 0,
            throttle: 0,
            hop: false,
            lookYaw: 0,
            lookPitch: 0,
          };
          return (i) => {
            inp.steer = r() * 2 - 1;
            inp.throttle = r() * 2 - 1;
            inp.hop = i % 97 === 0; // occasional, on a prime so it does not phase-lock
            return inp;
          };
        };

        const stateOf = (game) => {
          const s = snap(game.skier);
          return [...s.vals, game.time, STATE.slopeGrade, STATE.fanHalfAngle];
        };

        return {
          run(game) {
            // ---- prng --------------------------------------------------------
            {
              const a = mulberry32(12345),
                b = mulberry32(12345);
              let same = true;
              for (let i = 0; i < 4096; i++) if (a() !== b()) same = false;
              const c = mulberry32(12346);
              ok("prng", same && mulberry32(12345)() !== c(), "4096 draws");
            }

            // ---- expk --------------------------------------------------------
            // One step of dt against 64 of dt/64, for the exponential blend the whole codebase uses in place of a naive lerp.
            // The naive form fails this by ~4%.
            {
              const rate = 6,
                dt = 1 / 60;
              let one = 0;
              one += (1 - one) * expK(rate, dt);
              let many = 0;
              for (let i = 0; i < 64; i++)
                many += (1 - many) * expK(rate, dt / 64);
              const err = Math.abs(one - many);
              ok("expk", err < 1e-12, `err ${err.toExponential(1)}`);
            }

            // ---- terrain -----------------------------------------------------
            {
              let pure = true;
              const r = mulberry32(7);
              for (let i = 0; i < 512; i++) {
                const x = (r() - 0.5) * 4000,
                  z = (r() - 0.5) * 4000;
                if (sampleTerrain(x, z) !== sampleTerrain(x, z)) pure = false;
              }
              ok("terrain", pure, "512 probes, re-sampled");
            }

            // ---- forest.replay ----------------------------------------------
            // The collision gather replays the renderer's PRNG draws to rebuild the same trees.
            // If either side adds, removes or reorders a draw, the two silently disagree and the skier collides with trees that were never drawn.
            // Assert every obstacle the collision path reports really is where a tree was placed.
            {
              const px = 137.5,
                pz = -412.25;
              game.forest.update(px, pz, px, pz, game._groundAt, 0);
              const placed = [];
              const m = new Matrix4();
              const gx = game.forest.group.position.x,
                gz = game.forest.group.position.z;
              for (const mesh of game.forest.meshes)
                for (let i = 0; i < mesh.count; i++) {
                  mesh.getMatrixAt(i, m);
                  placed.push([m.elements[12] + gx, m.elements[14] + gz]);
                }
              const out = [];
              const n = game.forest.nearbyObstacles(px, pz, 40, out, 0);
              let matched = 0;
              for (let i = 0; i < n; i++) {
                const o = out[i];
                if (
                  placed.some(
                    (p) =>
                      Math.abs(p[0] - o.wx) < 1e-3 &&
                      Math.abs(p[1] - o.wz) < 1e-3,
                  )
                )
                  matched++;
              }
              ok(
                "forest.replay",
                n > 0 && matched === n,
                `${matched}/${n} obstacles matched ${placed.length} instances`,
              );
            }

            // ---- sim.pure ----------------------------------------------------
            // Determinism by construction rather than by observation: if updateSim never reaches for ambient entropy, it cannot drift between runs.
            {
              const s0 = snap(game.skier),
                t0 = game.time;
              const R = Math.random,
                D = Date.now;
              let touched = 0;
              Math.random = () => (touched++, 0.5);
              Date.now = () => (touched++, 0);
              try {
                const next = script(1);
                for (let i = 0; i < 120; i++) game.updateSim(1 / 120, next(i));
              } finally {
                Math.random = R;
                Date.now = D;
              }
              restore(game.skier, s0);
              game.time = t0;
              ok(
                "sim.pure",
                touched === 0,
                `${touched} entropy calls in 120 steps`,
              );
            }

            // ---- sim.determ --------------------------------------------------
            {
              const s0 = snap(game.skier),
                t0 = game.time,
                g0 = STATE.slopeGrade;
              const runOnce = () => {
                restore(game.skier, s0);
                game.time = t0;
                STATE.slopeGrade = g0;
                const next = script(99);
                for (let i = 0; i < 600; i++) game.updateSim(1 / 120, next(i));
                return hash(stateOf(game));
              };
              const h1 = runOnce(),
                h2 = runOnce();
              restore(game.skier, s0);
              game.time = t0;
              STATE.slopeGrade = g0;
              ok(
                "sim.determ",
                h1 === h2,
                `600 steps -> ${h1.toString(16)} / ${h2.toString(16)}`,
              );
            }

            // ---- config.frozen ----------------------------------------------
            {
              let threw = false;
              try {
                CONFIG.CAMERA.FOV = -1;
              } catch (e) {
                threw = true;
              }
              ok(
                "config.frozen",
                threw && CONFIG.CAMERA.FOV > 0,
                "write rejected",
              );
            }

            // ---- report ------------------------------------------------------
            const failed = results.filter((r) => !r.pass);
            for (const r of results)
              (r.pass ? console.log : console.error)(
                `[selftest] ${r.pass ? "PASS" : "FAIL"}  ${r.name.padEnd(14)} ${r.detail}`,
              );
            const el = document.createElement("pre");
            el.style.cssText =
              "position:fixed;left:8px;top:8px;z-index:99;margin:0;padding:10px 14px;" +
              "font:12px/1.6 ui-monospace,monospace;white-space:pre;border-radius:8px;" +
              "background:rgba(8,16,28,.88);color:#eaf4ff;pointer-events:none";
            el.textContent =
              results
                .map(
                  (r) =>
                    `${r.pass ? "PASS" : "FAIL"}  ${r.name.padEnd(14)} ${r.detail}`,
                )
                .join("\n") +
              `\n\n${results.length - failed.length}/${results.length} passed`;
            document.body.appendChild(el);
            return failed.length === 0;
          },
        };
      })();

      function startMainLoop() {
        const game = GAME; // already built (and rendered once) in init()
        const canvas = game.renderer.domElement;

        // (iOS double-tap-zoom suppression is installed once at module scope -- see utilities -- so it covers the splash and the game alike.
        // Don't re-register it here.)

        // Pointer-lock free-look (desktop).
        // The initial lock is requested by the start gesture in startGame; here I just wire re-locking on click and lock-loss pause.
        initPointerLock(canvas);
        initCameraView(canvas); // wheel/pinch dolly (back) + Ctrl-drag height (HEIGHT)

        const pauseOverlay = document.getElementById("pauseOverlay");
        const pauseHint = document.getElementById("pauseHint");
        if (game.input.touchOnly) pauseHint.textContent = "tap to resume";
        else pauseHint.textContent = "click to resume";
        let _ignoreUnlock = false;
        const setPaused = (p) => {
          if (game.paused === p) return;
          game.paused = p;
          pauseOverlay.classList.toggle("show", p);
          document.body.classList.toggle("paused", p); // restyle HUD controls for the dark overlay
          if (SOUND) SOUND.setPaused(p);

          // Flush held input on both edges.
          // Keyups landing during a blur or pointer-lock exit are never delivered, so a key held at the pause boundary would stay latched and keep steering on resume.
          // Clearing on resume is the edge that matters: it discards anything that accumulated while paused.
          // Paired with the edge-only latching in Input's keydown, the flush sticks -- a key still physically held reads as neutral until it is released and pressed again.
          // Every pause path routes through setPaused.
          game.input.releaseHeld();
          // Note: on desktop, resuming does not re-request pointer lock here -- the browser only grants it inside a user gesture, so re-locking happens in the overlay's pointerdown.
        };
        // Losing pointer lock (Esc / Alt-Tab) pauses; clicking the canvas resumes+relocks.
        document.addEventListener("pointerlockchange", () => {
          if (document.pointerLockElement === canvas) {
            if (game.paused) setPaused(false);
          } else if (
            !game.input.touchOnly &&
            !_ignoreUnlock &&
            !document.hidden
          ) {
            setPaused(true);
          }
        });
        window.addEventListener("keydown", (e) => {
          if (e.code === "Escape") {
            game.paused ? setPaused(false) : setPaused(true);
            e.preventDefault();
          }
        });
        pauseOverlay.addEventListener("pointerdown", (e) => {
          if (!game.paused) return;

          // Ignore clicks that land on a HUD control layered above the overlay (mute, fullscreen, help, stats) -- those toggle their own thing and must not resume.
          if (
            e.target.closest(
              "#muteBtn,#fullscreenBtn,#camBtn,#helpBtn,#helpPanel,#stats",
            )
          )
            return;
          if (!game.input.touchOnly) {
            try {
              canvas.requestPointerLock()?.catch?.(() => {});
            } catch (_) {}
          } else setPaused(false);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) setPaused(true);
          else if (SOUND) SOUND.resume(); // re-take the iOS audio session after the interruption
        });
        window.addEventListener("blur", () => setPaused(true));
        window.addEventListener("focus", () => {
          if (SOUND) SOUND.resume();
        });

        const hudSpeed = document.getElementById("hudSpeed");
        const hudDist = document.getElementById("hudDist");
        const hudVert = document.getElementById("hudVert");
        const hudClimb = document.getElementById("hudClimb");
        const hudTime = document.getElementById("hudTime");
        const hudAvg = document.getElementById("hudAvg");
        const hudAir = document.getElementById("hudAir");
        const statsEl = document.getElementById("stats");
        const statsFps = document.getElementById("statsFps");
        const statsExtra = document.getElementById("statsExtra");
        statsEl.addEventListener("pointerdown", (e) => {
          statsEl.classList.toggle("expanded");
          e.stopPropagation();
        });
        // (TAB stats / 'H' help / Alt+Enter fullscreen are wired globally in init() so they also work on the splash; the live stats numbers below keep updating them while the loop runs.)
        let extraAcc = 0,
          lastStatsText = "";
        let fpsAcc = 0,
          fpsFrames = 0,
          lastFps = -1;
        let hudAcc = 0;

        // Substepped integration.
        // One long Euler step moves the skier metres between terrain samples, and bump launches and landings then resolve differently than they would at 60 fps; slicing the frame into steps of at most SIM_STEP makes a hitch integrate like the frames it replaced.
        // SIM_MAX_STEPS bounds the sim work one stall can cost (time dilation rather than a spiral of death), and DT_MAX is derived from the pair rather than picked: at the longest frame the loop accepts, ceil(DT_MAX / SIM_STEP) is exactly SIM_MAX_STEPS, so h <= SIM_STEP holds unconditionally and the cap cannot silently widen the step it bounds.
        const SIM_STEP = 1 / 60;
        const SIM_MAX_STEPS = 4;
        const DT_MAX = SIM_MAX_STEPS * SIM_STEP; // 66.7 ms

        const timer = new Timer();

        function tick() {
          requestAnimationFrame(tick);
          timer.update();
          const dt = Math.min(timer.getDelta(), DT_MAX);
          // Wall-clock between presented frames.
          // Everything else measures a piece of the work; this measures the budget those pieces have to fit inside, including vsync wait.
          {
            const now = performance.now();
            if (_lastRaf) perfBlend("frame", now - _lastRaf);
            _lastRaf = now;
          }
          if (game.paused) return;

          {
            // Poll once: input is sampled at frame rate, not substep rate, and every substep of a single frame sees the same button state anyway.
            const inputs = game.input.poll(dt);
            const steps = Math.min(
              SIM_MAX_STEPS,
              Math.max(1, Math.ceil(dt / SIM_STEP)),
            );
            const h = dt / steps;
            const t0 = performance.now();
            for (let s = 0; s < steps; s++) game.updateSim(h, inputs);
            const t1 = performance.now();
            game.updateView(dt, inputs); // presentation: once, on the full dt
            perfBlend("sim", t1 - t0);
            perfBlend("view", performance.now() - t1);
          }
          const t2 = performance.now();
          GpuTimer.begin();
          game.render();
          GpuTimer.end();
          // CPU-side submit only.
          // The GPU is still working when this returns, so treat it as "time spent building the frame", not as time to present it.
          // GPU below is the real cost of the same work.
          perfBlend("draw", performance.now() - t2);
          const g = GpuTimer.poll();
          if (g >= 0)
            PERF.gpu = PERF.gpu < 0 ? g : PERF.gpu + (g - PERF.gpu) * 0.1;

          fpsAcc += dt;
          fpsFrames++;
          if (fpsAcc >= 0.5) {
            const fps = (fpsFrames / fpsAcc) | 0;
            if (fps !== lastFps) {
              statsFps.textContent = `${fps} fps`;
              lastFps = fps;
            }
            fpsAcc = 0;
            fpsFrames = 0;
          }
          if (statsEl.classList.contains("expanded")) {
            extraAcc += dt;
            if (extraAcc >= 0.5) {
              extraAcc = 0;

              // Built twice a second (trivial); the string compare is the dirty check, so the DOM is only touched when a counter actually changed.
              const text = formatRendererStats(game.renderer);
              if (text !== lastStatsText) {
                statsExtra.textContent = text;
                lastStatsText = text;
              }
            }
          }
          hudAcc += dt;
          if (hudAcc >= 0.1) {
            hudAcc = 0;
            hudSpeed.textContent = Math.round(game.skier.speed * 3.6);
            hudDist.textContent = Math.round(game.distM).toLocaleString();
            hudVert.textContent = Math.round(game.vert).toLocaleString();
            hudClimb.textContent = Math.round(game.climb).toLocaleString();

            // Run time as m:ss (frozen while paused, since game.time only advances in update()).
            const t = game.time | 0;
            hudTime.textContent =
              ((t / 60) | 0) + ":" + String(t % 60).padStart(2, "0");
            // Average speed over the whole run = total distance / elapsed time, in km/h.
            hudAvg.textContent =
              game.time > 0.5 ? Math.round((game.distM / game.time) * 3.6) : 0;
            hudAir.classList.toggle("on", game.skier.airborne);
          }
        }
        _loopRunning = true;
        tick();
        return game;
      }

      init();
    </script>
  </body>
</html>
