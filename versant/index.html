          // Per-point age fade (pow(age, 0.8)) depends only on the point's index and the live point count, not on which ribbon is being written, so it is computed once per rebuild into this preallocated LUT and the pow runs n times rather than 2n.
          // Sized to maxPts.
          this._fadeLUT = new Float32Array(this.maxPts);
        }
        _newPoint(skier) {
          // Precompute stable, position-correlated edge wobble + berm brightness so the irregularities don't shimmer frame to frame.
          const T = CONFIG.TRACKS;

          // Lay the point at the ski tip, not the body: the ribbon's leading edge then reaches the front of the ski (measured _carveLead ahead) instead of starting back at the boot.
          const x = skier.worldX + skier.fx * skier.carveLead,
            z = skier.worldZ + skier.fz * skier.carveLead,
            rx = skier.rx,
            rz = skier.rz,
            // Half-separation of the two ski centrelines, measured off _skiTrue -- the same measured centre the chevrons and the spray stamp on.
            // Only the difference is used, so no rebase is needed.
            // Direction still comes from the point sequence: a plowing ski skids down the fall line while pointing inward, so the track follows its path, not its axis.
            so = skier.skiTrueOk
              ? clamp(
                  Math.abs(
                    (skier.skiTrue[0][0] - skier.skiTrue[1][0]) * rx +
                      (skier.skiTrue[0][1] - skier.skiTrue[1][1]) * rz,
                  ) * 0.5,
                  T.SKI_OFFSET * 0.5, // guard: a glitched read must not collapse or explode the pair
                  T.SKI_OFFSET * 3,
                )
              : T.SKI_OFFSET;
          // Stable position-correlated wobble + berm brightness, inlined (no per-point closures).
          const wobL =
            0.65 * _periodicPerlin(x * 0.7, z * 0.7, 256) +
            0.35 * (_hash01(x, z, 1) * 2 - 1);
          const wobR =
            0.65 * _periodicPerlin(x * 0.7 + 70, z * 0.7 + 70, 256) +
            0.35 * (_hash01(x, z, 2) * 2 - 1);
          const brA =
            0.92 +
            0.16 *
              (_periodicPerlin(x * 1.9 + 11, z * 1.9 + 11, 256) * 0.5 + 0.5);
          const brB =
            0.92 +
            0.16 *
              (_periodicPerlin(x * 1.9 + 40, z * 1.9 + 40, 256) * 0.5 + 0.5);
          // Resolve the jittered outer-edge half-widths here (not in the rebuild) so the four cross footprints are pinned at lay time: the rebuild reads these back, guaranteeing the verts I draw are exactly the verts I sampled the ground under.
          const bw = 1 + (skier.brakeBlend || 0) * 0.7; // plowing skis scrape a broader band
          // Edge narrowing.
          // On edge the ski prints a slot, not a platform: the raised shoulder is out of the snow entirely and only the cutting edge leaves a mark.
          // Shrinking only the lifted side does both halves of that at once -- the band gets narrower and its centre walks toward the digging edge -- with no separate offset term to keep in step.
          // Read at lay time like every other width here, so the ground samples below are taken under the verts actually drawn.
          const edge = skier.edgeAngle || 0;
          const eN = clamp(
            Math.abs(edge) / CONFIG.SKIER.LEG_TERRAIN.EDGE_MAX,
            0,
            1,
          );
          const lift = 1 - T.CARVE_NARROW * eN; // the shoulder that left the snow
          const nL = edge > 0 ? lift : 1, // + edge = right edge cutting -> the left shoulder is the one up in the air
            nR = edge < 0 ? lift : 1;
          const outL = Math.max(
            T.W_IN + 0.02,
            T.W_OUT * bw * nL * (1 + T.JITTER * wobL),
          );
          const outR = Math.max(
            T.W_IN + 0.02,
            T.W_OUT * bw * nR * (1 + T.JITTER * wobR),
          );

          // Sample the snow under each of the 8 cross verts (4 lateral offsets x 2 skis), not just the two ski centrelines, so each cross-section hugs the snow's cross-slope instead of lying flat across it.
          // A vert's ground height is invariant once laid (the noise field is world-anchored), so it is cached here and the per-frame rebuild only re-adds the linear fall-line ramp.
          // Cost is off the hot path: 8 samples per laid point, and still zero sampleTerrain in the rebuild.
          const off = this._latOff;
          off[0] = -outL;
          off[1] = -T.W_IN;
          off[2] = T.W_IN;
          off[3] = outR;

          // Per-point persistent storage, deliberately allocated fresh: this array is returned inside the point and read back by the rebuild for the point's whole lifetime.
          // Not scratch -- sharing one buffer here makes every laid point overwrite the ground samples of every previous point, which buries the ribbon under the terrain.
          const ty = new Float32Array(8);
          for (let ribbon = 0; ribbon < 2; ribbon++) {
            const sign = ribbon === 0 ? -1 : 1;
            const cxw = x + rx * so * sign,
              czw = z + rz * so * sign; // this ski's centreline
            for (let c = 0; c < 4; c++)
              ty[ribbon * 4 + c] = sampleTerrain(
                cxw + rx * off[c],
                czw + rz * off[c],
              );
          }
          return {
            x,
            z,
            rx,
            rz,
            so, // ski-pair half-offset pinned at lay time (incl. snowplow flare) -- the rebuild must read this back, not the config constant, or the wedge that the ground was sampled under never reaches the screen.
            wobL,
            wobR,
            brL: brA,
            brR: brB,
            outL,
            outR,
            ty,
            // Global stamp ticket (shared counter with the herringbone): the segment ending at this point inherits it, which is what lets the layer interleave carve segments and ribs into one strictly chronological draw order.
            gseq: this.layer.gseq++,
          };
        }
        update(skier) {
          const T = CONFIG.TRACKS;
          if (skier.airborne || skier.climbing) {
            // No carve ribbon in the air OR while climbing (the herringbone print system owns the climb).
            // Mark contact broken so the ribbon doesn't bridge across the gap.
            this._brokeContact = true;
          } else {
            if (
              this._lastX === null ||
              len2(skier.worldX - this._lastX, skier.worldZ - this._lastZ) >=
                T.MIN_STEP
            ) {
              const pt = this._newPoint(skier);
              if (this._brokeContact) {
                pt.gap = true;
                this._brokeContact = false;
              }
              this.pts.push(pt);
              this._lastX = skier.worldX;
              this._lastZ = skier.worldZ;
              if (this.pts.length > this.maxPts) this.pts.shift();
            }
          }
          const n = this.pts.length;
          if (n < 2) return; // nothing to draw; the layer sees pts.length and emits no segments

          const px = skier.worldX,
            pz = skier.worldZ;
          const pos = this.layer.posArr,
            col = this.layer.colArr; // shared buffers, carve region
          const wIn = T.W_IN,
            base = this.base;

          // Fill the age-fade LUT once (pow is the costly bit).
          // denom is safe: n >= 2 here.
          const fadeLUT = this._fadeLUT,
            denom = n - 1;
          for (let i = 0; i < n; i++)
            fadeLUT[i] = Math.pow((denom - i) / denom, 0.8);

          for (let ribbon = 0; ribbon < 2; ribbon++) {
            const skiSign = ribbon === 0 ? -1 : 1;
            for (let i = 0; i < n; i++) {
              const p = this.pts[i];
              const dx = p.x - px,
                dz = p.z - pz;
              // Ski centreline offset from the skier path -- p.so was pinned at lay time (it carries the snowplow flare), matching the cached ground samples exactly.
              const cxx = dx + p.rx * p.so * skiSign;
              const czz = dz + p.rz * p.so * skiSign;

              // Irregular outer edges; tight-ish inner groove.
              // The half-widths were pinned at lay time (_newPoint) so these footprints match the ground samples cached there -- just read them back.
              // (Scratch array reused; this loop runs ~2*MAX_POINTS times/frame.)
              const offs = this._offs;
              offs[0] = -p.outL;
              offs[1] = -wIn;
              offs[2] = wIn;
              offs[3] = p.outR;

              const fadeT = fadeLUT[i];

              // Geometric berm: a rim needs height, not just brightness, to read as displaced snow.
              // Outer columns rise a few cm above the conformed surface, jittered by the same stable per-point wobble as the edge width so shape and silhouette agree, and fade with age in lockstep with the colour so settling flat and blending back into snow are one event.
              // The inner groove stays on the surface -- sinking it would eat the RAISE clearance and z-fight the terrain fan.
              const bermL = T.BERM_HEIGHT * (1 + 0.25 * p.wobL) * (1 - fadeT);
              const bermR = T.BERM_HEIGHT * (1 + 0.25 * p.wobR) * (1 - fadeT);
              const vbase = base + (i * 2 + ribbon) * this.cross; // point-major: ...,p_i.L, p_i.R, p_{i+1}.L,...
              const tyBase = ribbon * 4; // this ski's four cached per-vert ground heights
              for (let c = 0; c < this.cross; c++) {
                const o = offs[c];
                const vx = cxx + p.rx * o,
                  vz = czz + p.rz * o;
                const vi = (vbase + c) * 3;
                pos[vi] = vx;

                // Each vert sits on the snow at its own footprint: cached ground height (invariant) plus the live fall-line ramp (one dot) plus a uniform RAISE, then the berm on the outer pair.
                // A uniform lift is a rigid translation, so the quad stays parallel to the terrain triangle under it and the ribbon lies flush instead of flat across a tilted patch.
                // This equals the rendered ground Y at (vx,vz) plus RAISE, so decal and snow can never disagree.
                pos[vi + 1] =
                  p.ty[tyBase + c] +
                  slopeOffset(vx, vz) +
                  T.RAISE +
                  (c === 0 ? bermL : c === 3 ? bermR : 0);
                pos[vi + 2] = vz;

                // Outer verts = bright snow berm; inner pair = shadowed groove.
                if (c === 0) this._tmp.copy(this._berm).multiplyScalar(p.brL);
                else if (c === 3)
                  this._tmp.copy(this._berm).multiplyScalar(p.brR);
                else this._tmp.copy(this._groove);
                this._tmp.lerp(this._fade, fadeT); // old tracks blend back into snow
                col[vi] = this._tmp.r;
                col[vi + 1] = this._tmp.g;
                col[vi + 2] = this._tmp.b;
              }
            }
          }
          // Index emission lives in SnowDecals.update: segments are interleaved with herringbone ribs in global chronological order there, so "newest paints over older" holds across systems.
        }
      }

      // ============================================================================
      // The climb mark.
      // Each step plants both skis in a /\ -- tails near the centreline, tips splayed out and up the slope -- and the steps stack densely so the angled ribs overlap into a fish skeleton with a central spine.
      // Its own mark system but a sub-system of the shared SnowDecals layer; the carve ribbon is suppressed while climbing.
      // Each rib is a short grooved strip: across its width the colour runs bright rim, dark trough, bright rim, so it reads as a pressed depression rather than a painted bar.
      // ============================================================================
      class HerringbonePrints {
        // Sub-system of SnowDecals (which owns the geometry/material/mesh): stamps ribs and writes their verts into its region of the shared buffers; the layer emits indices in global stamp order.
        constructor(layer, vertBase) {
          const H = CONFIG.HERRINGBONE;
          this.layer = layer;
          this.base = vertBase; // first vert of the rib region in the shared buffers
          this.max = H.MAX_RIBS;

          // Preallocated ring of rib records, no per-stamp garbage.
          // cx/cz is the world midpoint of the rib; ox/oz are its 8 corner offsets from that midpoint, fixed at stamp time.
          // Two counters, deliberately distinct: `seq` is local to ribs and drives the age fade, so it must not tick while skiing or laid prints would bleach out as carve points accrue; `gseq` is the global stamp ticket shared with the carve and drives draw order only.
          this.ribs = new Array(this.max);
          for (let i = 0; i < this.max; i++)
            this.ribs[i] = {
              cx: 0,
              cz: 0,
              ty: new Float32Array(8),
              rimJ: 1,
              brJ: 1,
              aspect: 1e3, // safe default: reads as "long", i.e. no end rounding, until a real stamp fills it
              ox: new Float32Array(8),
              oz: new Float32Array(8),
              seq: -1,
              gseq: -1,
            };
          this.head = 0;
          this.count = 0;
          this.seq = 0;
          this.live = 0; // ribs written this frame (read by the layer)
          this.slotGseq = new Float64Array(this.max); // per age-rank slot ticket, for the layer's merge
          this._acc = 0;
          this._side = -1;
          this._lastX = null;
          this._lastZ = null;

          // Same palette as the carve ribbon (shared GROOVE -> SNOW_FADE), so both read as one material.
          this._groove = new Color(CONFIG.TRACKS.GROOVE);
          this._berm = new Color(CONFIG.TRACKS.BERM); // bright rim, same as the carve berm
          this._fade = new Color(CONFIG.TRACKS.SNOW_FADE);
          this._tmp = new Color();

          // Per-column rim-height factor, mirroring the feather layout: tail edges (0,3) rise fully, trough columns stay on the plane, tip edges (4,7) rise by the same 0.55 taper as F_TIP -- so geometric height and alpha softness fade out together.
          this._rimF = new Float32Array([1, 0, 0, 1, 0.55, 0, 0, 0.55]);
        }

        // The shared rib-press core: drape one angled ski mark (base bx,bz; unit axis ax,az; length L) onto the snow with full 8-corner decal conformance.
        // Silent and side-agnostic -- the callers own cadence, alternation and sound.
        _rib(bx, bz, ax, az, L, wScale = 1, fwd = 0) {
          const H = CONFIG.HERRINGBONE;
          const rnd = _jitterAt(bx, bz); // deterministic: same spot, same rib, every run
          // Slide the drawn rib forward along its own axis so it sits under the ski (which mounts ahead of the boot).
          // The caller keeps the original base for the boot pin, so only the print moves.
          bx += ax * fwd;
          bz += az * fwd;
          const pwx = -az,
            pwz = ax; // width axis (perp to the rib)
          const wON = H.W_OUT * wScale * (1 + rnd(H.WIDTH_JIT)),
            wOP = H.W_OUT * wScale * (1 + rnd(H.WIDTH_JIT)); // ragged sides
          // Reused scratch: this is rewritten in full on every stamp, and ribs stamp at a cadence rather than once, so a fresh array each time is pure garbage.
          const off = _ribOff; // edge,core,core,edge (alpha 0,1,1,0)
          off[0] = -wON;
          off[1] = -H.W_IN;
          off[2] = H.W_IN;
          off[3] = wOP;
          const tx = bx + ax * L,
            tz = bz + az * L; // tip
          const mx = (bx + tx) * 0.5,
            mz = (bz + tz) * 0.5; // midpoint
          const p = this.ribs[this.head];
          p.cx = mx;
          p.cz = mz;
          p.seq = this.seq++; // Local counter: age fade (ribs only; doesn't tick while skiing)
          p.gseq = this.layer.gseq++; // Global stamp ticket: draw order across carve + herringbone
          // This mark's aspect: half-length over its own side-to-groove span, which puts the along-mark axis into the same units the lateral inset uses.
          // Rolled here from this mark's actual dimensions, so a rib (~4), a pole dab (~0.9) and a snowplow chevron each round according to their own proportions instead of borrowing the rib's.
          // Uses the jittered outer width rather than the nominal, so a mark that came out wide also rounds a touch harder.
          p.aspect =
            (L * 0.5) /
            Math.max(1e-4, (wON + wOP) * 0.5 - H.W_IN * wScale) /
            Math.max(1e-4, CONFIG.TRACKS.EDGE_END_FADE);
          p.rimJ = 1 + rnd(0.35); // stable shoulder-height jitter, rolled once here -- re-rolling in the rebuild would shimmer the rims every frame
          p.brJ = 0.92 + 0.16 * (0.5 + rnd(0.5)); // stable rim brightness jitter (same range as the carve berm), rolled once for the same reason
          for (let c = 0; c < 4; c++) {
            p.ox[c] = bx + pwx * off[c] - mx;
            p.oz[c] = bz + pwz * off[c] - mz; // tail cross
            p.ox[c + 4] = tx + pwx * off[c] - mx;
            p.oz[c + 4] = tz + pwz * off[c] - mz; // tip cross
          }

          // Sample the snow under all 8 corners, not just the rib midpoint.
          // A rib is ~LEN long, and on the fall-line grade alone a single midpoint sample left the uphill tip standing proud and the downhill tip buried.
          // Each corner's ground height is invariant once stamped (world-anchored noise), so it is cached here and the rebuild only re-adds the linear ramp per vert; the rib then drapes onto the surface instead of hovering as one flat quad.
          for (let c = 0; c < 8; c++)
            p.ty[c] = sampleTerrain(mx + p.ox[c], mz + p.oz[c]);
          this.head = (this.head + 1) % this.max;
          this.count = Math.min(this.count + 1, this.max);
        }

        // A pole-plant dimple: a small near-round dab pressed where a climbing pole tip bit the snow.
        // Reuses the rib core so it lands in the same shared draw call and ring buffer as the ribs, with no new geometry -- just short and narrowed, and centred on the bite point so it reads as a poke, not a dash.
        _poke(x, z, ax, az) {
          const H = CONFIG.HERRINGBONE;
          const L = H.LEN * 0.12; // short; once narrowed it's about as wide as long -> a dab
          this._rib(x - ax * L * 0.5, z - az * L * 0.5, ax, az, L, 0.6);
        }

        // Plant one ski rib, alternating side each step and staggering up the slope, so consecutive ribs interlock into a continuous fish skeleton with a central spine.
        // Fires exactly one step sound -- the drawn line IS the audible step.
        stamp(skier) {
          const H = CONFIG.HERRINGBONE;
          const sr = this._side;
          this._side = -sr; // -1 left, +1 right, alternating
          const rnd = _jitterAt(skier.worldX, skier.worldZ); // deterministic per stamp position
          const splay = skier.herringboneSplay() + rnd(H.ANGLE_JIT); // dynamic V: opens with steepness
          const ca = Math.cos(splay),
            sa = Math.sin(splay);
          const fx = skier.fx,
            fz = skier.fz,
            rx = skier.rx,
            rz = skier.rz;
          const ax = fx * ca + rx * sr * sa,
            az = fz * ca + rz * sr * sa; // axis: up the slope, toed out
          const gap = H.SPINE_GAP * (0.6 + 0.8 * (0.5 + rnd(0.5))); // deterministic, in scope of the stamp's rnd
          // Plant wobble: a little forward/lateral noise so the spine isn't a ruler-straight line.
          const jf = rnd(H.POS_JIT),
            jr = rnd(H.POS_JIT);
          const bx = skier.worldX + fx * jf + rx * (sr * gap + jr);
          const bz = skier.worldZ + fz * jf + rz * (sr * gap + jr);
          this._rib(
            bx,
            bz,
            ax,
            az,
            H.LEN * (1 + rnd(H.LEN_JIT)),
            1,
            skier.ribFwd,
          );

          // Tell the skier where this rib pressed the snow: the gait (Skier.applyPoseIK) plants the matching boot exactly here, so the visible step, the decal, and the step sound below are all the same event.
          skier.onHerringboneStamp?.(sr, bx, bz, ax, az);
          if (SOUND) SOUND.step(0.55 + 0.4 * Math.random()); // one footfall per drawn rib
        }

        // Snowplow chevron: one pair of short ski marks forming the brake wedge, each centred on its ski's track line.
        // Facing downhill the tips pinch together; facing uphill it mirrors to tails-together with the tips splayed (see the wedgeLat flip below).
        // No metronome call and no step sound -- the wedge slides, it doesn't step, and the scrape is the carve channel's job.
        stampPlow(skier) {
          const H = CONFIG.HERRINGBONE;

          // Stamped on the measured ski.
          // _skiTrue is written by the print pass off the actual gear after every solver and cap, so the marks agree with the skis by construction rather than by keeping constants in sync.
          if (!skier.skiTrueOk) return; // nothing measured yet this run

          const rnd = _jitterAt(skier.worldX, skier.worldZ); // deterministic per stamp position
          const fx = skier.fx,
            fz = skier.fz,
            rx = skier.rx,
            rz = skier.rz;

          // Marks are angled harder than the skis and cut long, so each pair's tips visibly pinch toward the midline: the read is the repeating /\ of the pairs, not any migration of the track lines.
          // This is the extra toe-in only -- the ski's own angle is already in the measurement -- so PLOW_MARK_GAIN of 1 stamps the ski exactly.
          const extra = (skier.plowWedge || 0) * (H.PLOW_MARK_GAIN - 1);

          // Which way the extra toe-in leans: tips pinch in facing downhill, tails pinch in (tips splay out) facing uphill.
          // Eases through 0 across the fall line, same as the boot yaw, so all of it flips on one edge.
          const wedgeLat = -clamp(
            (skier.alignment || 0) / CONFIG.SKIER.WEDGE_FLIP_ALIGN,
            -1,
            1,
          );

          for (let i = 0; i < 2; i++) {
            const st = skier.skiTrue[i];
            const sr = i === skier.rightLeg ? 1 : -1; // body-right ski leans the other way
            const a = extra + rnd(H.ANGLE_JIT);
            const ca = Math.cos(a),
              sa = Math.sin(a);
            // Rotate the measured aim toward the midline, rather than building an aim from the body heading.
            // Re-normalised because the two terms are not orthogonal once the ski has been re-aimed off the body axis.
            let ax = st[2] * ca + wedgeLat * rx * sr * sa,
              az = st[3] * ca + wedgeLat * rz * sr * sa;
            const inv = 1 / (len2(ax, az) || 1);
            ax *= inv;
            az *= inv;

            const L = H.LEN * 0.85 * (1 + rnd(H.LEN_JIT));
            // Centred on the ski's own measured contact point -- half the rib behind, half ahead.
            const bx = st[0] + fx * rnd(H.POS_JIT) - ax * L * 0.5;
            const bz = st[1] + fz * rnd(H.POS_JIT) - az * L * 0.5;
            this._rib(bx, bz, ax, az, L, 1, skier.ribFwd);
          }
        }

        // Two-boot landing: one rib under each actual foot.
        // The walking stamp() puts ribs along the spine and the boot comes to the rib; a landing is the inverse, because the boots are already down wherever the flight left them, so the rib must come to the boot.
        // Each rib's base is placed so its BOOT_ON_RIB anchor sits exactly at the foot; the metronome call then makes the resuming gait pin to these ribs, so landing flows into the next stride with no shuffle.
        stampLanding(skier) {
          if (!skier.footTrueOk) {
            // feet unknown (pose layer hasn't run yet): fall back to the spine stamps
            this.stamp(skier);
            this.stamp(skier);
            return;
          }
          const H = CONFIG.HERRINGBONE;
          const kOn = CONFIG.SKIER.LEG_TERRAIN.BOOT_ON_RIB;
          const rnd = _jitterAt(skier.worldX, skier.worldZ); // deterministic per stamp position
          const sp = skier.herringboneSplay();
          const ri = skier.rightLeg ?? 1;
          for (let i = 0; i < 2; i++) {
            const sr = i === ri ? 1 : -1;
            const a = sp + rnd(H.ANGLE_JIT);
            const ca = Math.cos(a),
              sa = Math.sin(a);
            const ax = skier.fx * ca + skier.rx * sr * sa,
              az = skier.fz * ca + skier.rz * sr * sa;
            const fxp = skier.footTrue[i][0],
              fzp = skier.footTrue[i][1];
            const bx = fxp - ax * kOn, // base such that the boot anchor IS the foot
              bz = fzp - az * kOn;
            this._rib(
              bx,
              bz,
              ax,
              az,
              H.LEN * (1 + rnd(H.LEN_JIT)),
              1,
              skier.ribFwd,
            );
            skier.onHerringboneStamp?.(sr, bx, bz, ax, az);
            if (SOUND) SOUND.step(0.55 + 0.4 * Math.random());
          }
          this._side = ri === 1 ? -1 : 1; // next distance-stamp alternates off the right foot
        }

        // Ski landing - each touchdown presses a pair of parallel ski-length dashes under the actual boots, aligned with travel (skis land parallel downhill -- no splay, no metronome, no step sound; the impact thud already covers the audio).
        stampLandingSki(skier) {
          if (!skier.footTrueOk) return;
          const H = CONFIG.HERRINGBONE;
          const rnd = _jitterAt(skier.worldX, skier.worldZ); // deterministic per stamp position
          for (let i = 0; i < 2; i++) {
            const a = rnd(H.ANGLE_JIT * 0.5); // near-parallel; a touch of scatter
            const ca = Math.cos(a),
              sa = Math.sin(a);
            const sr = i === (skier.rightLeg ?? 1) ? 1 : -1;
            const ax = skier.fx * ca + skier.rx * sr * sa,
              az = skier.fz * ca + skier.rz * sr * sa;
            const L = H.LEN * 1.15 * (1 + rnd(H.LEN_JIT)); // ski-ish dash
            const fxp = skier.footTrue[i][0],
              fzp = skier.footTrue[i][1];
            // Centre the dash on the measured ski centre (boots ride aft of it).
            const bx = fxp - ax * L * 0.5,
              bz = fzp - az * L * 0.5;
            this._rib(bx, bz, ax, az, L, 1, skier.ribFwd);
          }
        }

        update(skier) {
          const H = CONFIG.HERRINGBONE;

          // Three mark sources feed this one stamper: landing events (below), the distance-driven snowplow wedge, and -- the herringbone climb -- animation-driven plant requests posted by applyPoseIK.
          // The accumulator here is the plow's alone; the climb keeps no distance state.
          const plowing =
            !skier.climbing && !skier.airborne && (skier.brakeBlend || 0) > 0.5;
          // A walk-hop covers almost no ground and advances almost no gait phase, so neither the plant requests nor the plow distance would mark the touchdown -- the boots punch in unmarked.
          const justLanded = this._wasAir && !skier.airborne;
          this._wasAir = skier.airborne;
          if (justLanded) {
            if (
              skier.climbing ||
              skier.walking ||
              (skier.climbBlend || 0) > 0.1
            )
              this.stampLanding(skier); // walk landing: splayed prints + gait metronome
            // ski landing: parallel dashes under the boots
            else if (skier.speed > H.LANDING_SKI_SPEED)
              this.stampLandingSki(skier);
          }

          // Snowplow chevrons are laid by distance -- they aren't footfalls, they're the scrape of a braking wedge -- while the herringbone climb is animation-driven: applyPoseIK posts a rib request the instant each ski actually plants, so the marks follow the animation rather than a metronome chasing it.
          if (plowing) {
            if (this._lastX === null) {
              this._lastX = skier.worldX;
              this._lastZ = skier.worldZ;
            }
            this._acc += len2(
              skier.worldX - this._lastX,
              skier.worldZ - this._lastZ,
            );
            this._lastX = skier.worldX;
            this._lastZ = skier.worldZ;
            let guard = 0;
            while (this._acc >= H.PLOW_STEP && guard++ < this.max) {
              this._acc -= H.PLOW_STEP;
              this.stampPlow(skier);
            }
          } else {
            this._acc = 0;
            this._lastX = null;
            this._lastZ = null;
          }

          // Climb ribs, animation-driven: applyPoseIK posted each ski's TRUE-world plant spot and aim the instant it touched down.
          // Lay one rib per plant, centred on the ski along its exact aim axis (no forward fudge), so the grounded ski sits squarely on its own mark.
          // Indexed over the live prefix of a fixed pool: no array, no records and no iterator are allocated to carry an event that fires a couple of times a second.
          const ribs = skier.ribReq;
          for (let ri = 0; ri < skier.ribReqN; ri++) {
            const r = ribs[ri];
            const rnd = _jitterAt(r.x, r.z); // deterministic per plant spot
            const L = r.len || H.LEN * (1 + rnd(H.LEN_JIT)); // match the ski's own footprint length
            this._rib(
              r.x - r.axX * L * 0.5,
              r.z - r.axZ * L * 0.5,
              r.axX,
              r.axZ,
              L,
            );
            if (SOUND && !r.quiet) SOUND.step(0.55 + 0.4 * Math.random());
          }
          skier.ribReqN = 0; // consumed

          // The climb has come to rest.
          // applyPoseIK posted the swing boot's final measured spot and toe-out axis, and the plant cadence has stopped so nothing else will mark it (the stance boot already has its rib).
          // Press one rib centred on that boot along its axis, so the ski that was mid-swing when motion ceased comes to ground on a herringbone mark sharing its rotation instead of floating over bare snow.
          // The live per-frame solve already holds the ski there; onHerringboneSettle just keeps the foot in the gait.
          const settle = skier.settleReq;
          if (settle) {
            for (const s of settle) {
              const rnd = _jitterAt(s.x, s.z); // deterministic per settle spot
              // Same as a moving plant: centre the rib on the ski's measured spot along its exact axis, sized to the ski's own footprint, so the swing ski settling to rest sits squarely on it.
              const L = s.len || H.LEN * (1 + rnd(H.LEN_JIT));
              this._rib(
                s.x - s.axX * L * 0.5,
                s.z - s.axZ * L * 0.5,
                s.axX,
                s.axZ,
                L,
              );
              skier.onHerringboneSettle(s.leg);
            }
            if (SOUND) SOUND.step(0.5); // the boots planting their final step
            skier.settleReq = null; // consumed
          }

          // Pole pokes: applyPoseIK recorded where each climbing pole tip bit the snow this frame, in true world coords.
          // Press a small dimple at each, using the same shared draw call and ring buffer as the ribs, so it costs one tiny stamp per plant and no extra geometry.
          // Aligned to travel; the exact spin doesn't matter for a round dab.
          const pokes = skier.pokeReq;
          if (skier.pokeReqN > 0) {
            for (let pi = 0; pi < skier.pokeReqN; pi++) {
              const pk = pokes[pi];
              this._poke(pk.x, pk.z, skier.fx, skier.fz);
            }

            // A poke is a contact: the tip bit the snow, and the veto upstream already guarantees it touched.
            if (SOUND) SOUND.poke(0.75 + 0.4 * Math.random());
            skier.pokeReqN = 0; // consumed
          }

          const live = (this.live = Math.min(this.count, this.max));
          if (live === 0) return; // the layer reads this.live and emits no ribs

          // Vertex slots are filled oldest-first (slot i == age rank) and slotGseq mirrors that walk, so the layer's chronological merge can address rib i's verts directly.
          // Re-derive each rib skier-relative (XZ small for float safety); Y is the per-corner ground height cached at stamp time plus the live fall-line slope, so the prints recede up the slope behind the skier and lie flush to the snow exactly like the carve ribbon.
          const ox = skier.worldX,
            oz = skier.worldZ;
          const pos = this.layer.posArr,
            col = this.layer.colArr; // shared buffers, rib region
          const base = this.base,
            denom = this.max - 1; // seq counts ribs (1/step)
          const full = this.count >= this.max,
            start = full ? this.head : 0;
          for (let i = 0; i < live; i++) {
            const p = this.ribs[(start + i) % this.max];
            this.slotGseq[i] = p.gseq;

            // Publish the mark's aspect into whichever vertex slot it landed in this frame (slot == age rank, so it moves as older marks retire).
            const asp = this.layer.aspectArr,
              ab = base + i * 8;
            for (let c = 0; c < 8; c++) asp[ab + c] = p.aspect;
            const relX = p.cx - ox,
              relZ = p.cz - oz;
            const fadeT = Math.pow(
              clamp((this.seq - 1 - p.seq) / denom, 0, 1),
              0.8,
            );

            // Trough and rim colours, both faded toward snow with age -- same palette and treatment as the carve ribbon, so the climb mark grows the same crisp white rim.
            // The rim columns are exactly the ones that also rise (rimF[c] > 0), so bright colour and shoulder height land on the same verts: bright rim, dark trough, bright rim.
            this._tmp.copy(this._groove).lerp(this._fade, fadeT);
            const gr = this._tmp.r,
              gg = this._tmp.g,
              gb = this._tmp.b;
            this._tmp
              .copy(this._berm)
              .multiplyScalar(p.brJ)
              .lerp(this._fade, fadeT);
            const br = this._tmp.r,
              bg = this._tmp.g,
              bb = this._tmp.b;
            // Displaced-snow shoulder: feathered edges rise, trough stays put (see RIM_HEIGHT in config for why additive-only).
            // Settles flat in lockstep with the colour fade.
            const rimH = H.RIM_HEIGHT * p.rimJ * (1 - fadeT),
              rimF = this._rimF;
            const vb = base + i * 8; // slot i == age rank
            const pty = p.ty;
            for (let c = 0; c < 8; c++) {
              const vi = (vb + c) * 3;
              const vx = relX + p.ox[c],
                vz = relZ + p.oz[c];
              // Per-vert conformance: cached ground height under THIS corner (invariant) + the live fall-line ramp (one dot) + a uniform RAISE, then the shoulder lift on the feathered edges.
              // Equals the rendered ground Y at (vx,vz) + RAISE, so the rib sits flush.
              pos[vi] = vx;
              pos[vi + 1] =
                pty[c] + slopeOffset(vx, vz) + H.RAISE + rimH * rimF[c];
              pos[vi + 2] = vz;
              if (rimF[c] > 0) {
                col[vi] = br;
                col[vi + 1] = bg;
                col[vi + 2] = bb; // raised side rim = bright berm
              } else {
                col[vi] = gr;
                col[vi + 1] = gg;
                col[vi + 2] = gb; // trough = dark groove
              }
            }
          }
        }
      }

      // ============================================================================
      // The one mesh both mark systems draw through, and the reason "newest paints over older" holds globally.
      // These decals don't write depth, so overlap is decided purely by triangle submission order, and two meshes can only order within themselves -- which can never express "this carve segment is younger than that rib".
      // So every laid carve point and every stamped rib takes a ticket from one monotonic counter (gseq), and each frame the index buffer is rebuilt by merging the two streams in ticket order: a zero-alloc two-pointer merge, O(points + ribs).
      // Layout: carve verts [0, MAX_POINTS*8), rib verts after.
      // ============================================================================
      class SnowDecals {
        constructor(scene) {
          const carveVerts = CONFIG.TRACKS.MAX_POINTS * 8; // 4 cross x 2 skis per point
          const ribVerts = CONFIG.HERRINGBONE.MAX_RIBS * 8; // tail cross + tip cross per rib
          const total = carveVerts + ribVerts;

          // Uint16 index: assert the budget at boot rather than silently wrapping at 65536.
          if (total > 65535)
            console.warn(
              `[SnowDecals] ${total} verts exceeds Uint16 index range; raise to Uint32`,
            );
          this.gseq = 0; // The global stamp counter (monotonic; float64 -- never wraps in a session)

          this.geo = new BufferGeometry();
          this.posArr = new Float32Array(total * 3);
          this.colArr = new Float32Array(total * 3);

          // Up-normals: not for lighting (decals are unlit) but because three's shadow-receive chunk offsets the depth sample along the surface normal (normalBias).
          // Constant, built once.
          const norArr = new Float32Array(total * 3);
          for (let i = 0; i < total; i++) norArr[i * 3 + 1] = 1;

          // Static feather.
          // Carve region: constant 0.72, with no edge fade, since soft edges are the ribs' job.
          // Rib region: the side rims carry alpha so they read as a bright berm like the carve, while the outer tip still tapers so fishbone tips blend at the spine instead of butting hard.
          const featherArr = new Float32Array(total).fill(0.72, 0, carveVerts);
          const F_TAIL = [0.95, 1, 1, 0.95],
            F_TIP = [0.5, 0.55, 0.55, 0.5],
            RIB_A = 0.78;
          for (let q = 0; q < CONFIG.HERRINGBONE.MAX_RIBS; q++) {
            const b = carveVerts + q * 8;
            for (let c = 0; c < 4; c++) {
              featherArr[b + c] = F_TAIL[c] * RIB_A;
              featherArr[b + c + 4] = F_TIP[c] * RIB_A;
            }
          }

          // Inset ramp for the shader's edge erosion: 0 on the outer boundary, 1 at the groove pair.
          // It is a property of which column a vertex is, and the column layout never changes, so this is written once here and never touched again -- the raggedness costs the CPU nothing per frame.
          // Both systems lay four columns across (outer, groove, groove, outer), so one pattern serves the carve ribbon and the ribs alike.
          const edgeArr = new Float32Array(total);

          // ...and the companion along-mark coordinate the shader folds into a tent to round the ends.
          // The carve ribbon stays at 0, reading as nowhere near an end, which is correct: it is one continuous strip whose only ends are the ski tip, hidden under the skier, and the oldest point, which already fades out by age.
          const spanArr = new Float32Array(total);

          // Per-mark aspect.
          // The carve ribbon is seeded huge (its ends are never rounded), and the rib region is filled with a safe default until each slot's real mark writes its own.
          const aspectArr = new Float32Array(total).fill(1e3);
          const E_COL = [0, 1, 1, 0];
          for (let i = 0; i < carveVerts; i++) edgeArr[i] = E_COL[i & 3];
          const tipHold = CONFIG.TRACKS.EDGE_TIP_HOLD;
          for (let q = 0; q < CONFIG.HERRINGBONE.MAX_RIBS; q++) {
            const b = carveVerts + q * 8;
            for (let c = 0; c < 4; c++) {
              edgeArr[b + c] = E_COL[c];

              // The tip cross holds less inset, so the erosion reaches further into the far end of a rib than into the planted end.
              edgeArr[b + c + 4] = E_COL[c] * tipHold;
              spanArr[b + c] = -1; // tail cross
              spanArr[b + c + 4] = 1; // tip cross
            }
          }
          this.geo.setAttribute(
            "position",
            new BufferAttribute(this.posArr, 3).setUsage(35048),
          );
          this.geo.setAttribute(
            "color",
            new BufferAttribute(this.colArr, 3).setUsage(35048),
          );
          this.geo.setAttribute("normal", new BufferAttribute(norArr, 3));
          this.geo.setAttribute("aFeather", new BufferAttribute(featherArr, 1));
          this.geo.setAttribute("aEdge", new BufferAttribute(edgeArr, 1)); // static; never re-uploaded
          this.geo.setAttribute("aSpan", new BufferAttribute(spanArr, 1)); // static; never re-uploaded
          // Rib slots are filled oldest-first, so which mark owns a given slot changes as marks age out -- this one has to follow the rebuild.
          this.geo.setAttribute(
            "aAspect",
            new BufferAttribute(aspectArr, 1).setUsage(35048),
          );
          this.aspectArr = aspectArr;

          // Index = the merged chronological draw order, rebuilt per frame (dynamic).
          const maxIdx =
            (CONFIG.TRACKS.MAX_POINTS - 1) * 36 +
            CONFIG.HERRINGBONE.MAX_RIBS * 18;
          // Uint16 indices, so the combined vertex count of both regions must stay under 65536.
          // Currently MAX_POINTS*8 + MAX_RIBS*8 = 5920, but both read like free dials: raising them past ~8100 combined wraps the indices silently -- no error, just a shredded decal mesh.
          // Switch to Uint32Array (and drop the setIndex type) before going bigger.
          this.idxArr = new Uint16Array(maxIdx);
          this.geo.setIndex(
            new BufferAttribute(this.idxArr, 1).setUsage(35048),
          );

          this.mesh = new Mesh(this.geo, makeSnowDecalMaterial(1.0)); // opacities live in aFeather
          this.mesh.frustumCulled = false;
          // Ground overlay stack, all of it non-depth-writing, so order is the only thing that decides who wins: terrain fan (opaque), 1 snow marks, 2 shadow decals, 3 spray.
          // These have to be explicit. Two transparent meshes sharing a renderOrder fall back to three's camera-distance sort, and that flips as the camera turns -- which reads as the shadow and the tracks swapping which one is on top mid-turn.
          this.mesh.renderOrder = 1;
          this.mesh.castShadow = false;
          this.mesh.receiveShadow = true;
          this.mesh.visible = false;
          scene.add(this.mesh);

          // Sub-systems write straight into this layer's buffers, each in its own vertex region.
          this.tracks = new SkiTracks(this, 0);
          this.prints = new HerringbonePrints(this, carveVerts);
          this._ribBase = carveVerts;
        }

        update(skier) {
          this.tracks.update(skier); // lays points + writes carve verts (region [0, carveVerts))
          this.prints.update(skier); // stamps ribs + writes rib verts (region [carveVerts, total))

          const pts = this.tracks.pts,
            n = pts.length;
          const live = this.prints.live;
          const any = n >= 2 || live > 0;
          this.mesh.visible = any;
          if (!any) return;

          // Both systems built their verts relative to the skier this frame; anchor the mesh to match.
          this.mesh.position.set(skier.worldX, 0, skier.worldZ);

          // Global chronological merge.
          // Both streams are monotonic, so a two-pointer merge yields strict global ticket order: the newest mark of either kind is always submitted last and wins every overlap.
          const idx = this.idxArr,
            slotG = this.prints.slotGseq;
          const carveBase = this.tracks.base,
            ribBase = this._ribBase;
          let w = 0,
            ci = 0,
            hi = 0;
          const nSeg = n - 1;
          while (true) {
            while (ci < nSeg && pts[ci + 1].gap) ci++; // skip jump breaks
            const cs = ci < nSeg ? pts[ci + 1].gseq : Infinity;
            const rs = hi < live ? slotG[hi] : Infinity;
            if (cs === Infinity && rs === Infinity) break;
            if (cs <= rs) {
              // Carve segment ci: both ribbons interleaved (age-major within the step), 3 panels each.
              for (let ribbon = 0; ribbon < 2; ribbon++) {
                for (let c = 0; c < 3; c++) {
                  const a = carveBase + (ci * 2 + ribbon) * 4 + c,
                    b = a + 1;
                  const cc = carveBase + ((ci + 1) * 2 + ribbon) * 4 + c,
                    d = cc + 1;
                  idx[w++] = a;
                  idx[w++] = cc;
                  idx[w++] = b;
                  idx[w++] = b;
                  idx[w++] = cc;
                  idx[w++] = d;
                }
              }
              ci++;
            } else {
              // Rib hi: 3 panels across the rib (verts 0..3 tail cross, 4..7 tip cross).
              const b = ribBase + hi * 8;
              for (let c = 0; c < 3; c++) {
                const i0 = b + c,
                  i1 = b + c + 1,
                  o0 = b + c + 4,
                  o1 = b + c + 5;
                idx[w++] = i0;
                idx[w++] = i1;
                idx[w++] = o1;
                idx[w++] = i0;
                idx[w++] = o1;
                idx[w++] = o0;
              }
              hi++;
            }
          }
          this.geo.setDrawRange(0, w);
          this.geo.attributes.position.needsUpdate = true;
          this.geo.attributes.color.needsUpdate = true;
          this.geo.index.needsUpdate = true;

          // Only the rib region of aAspect is ever rewritten (the carve half is seeded once and never changes), and within it only the live prefix.
          if (live > 0) {
            const aa = this.geo.attributes.aAspect;
            aa.clearUpdateRanges();
            aa.addUpdateRange(ribBase, live * 8);
            aa.needsUpdate = true;
          }
        }
      }

      // ============================================================================
      // SNOW SPRAY -- the snow the skis throw.
      //
      // No depth prepass here, deliberately.
      // The stock soft-particle recipe renders the scene twice to harvest a depth texture, just to avoid a hard line where a billboard slices what is behind it.
      // Spray is emitted at the ski soles and lives its whole life within a metre of the snow, so the only surface it slices is the ground -- and the ground is a function already evaluated on the CPU every frame.
      // Each puff carries its own height above the snow, the vertex shader adds the corner's world-space rise, and the fragment fades on that: one attribute lane and two multiply-adds instead of doubling every draw call.
      // Trees and boulders still occlude correctly; that is just the depth test.
      //
      // Coordinates: float64 world XZ plus `h`, height above the snow -- not an absolute Y.
      // The visible surface is fixed noise plus a fall-line plane pivoted on the player, so the ground under a fixed world point re-tilts every frame as the player descends; a puff storing absolute Y would sink into or climb out of the slope behind.
      // Height above snow rides the tilt for free and is also the soft-fade term.
      // The noise sample is taken once at birth (a puff travels ~2 m) and only the fall-line ramp is re-evaluated per frame.
      //
      // Math.random throughout: spray is taste, not state.
      // Nothing here is replayed or collided against.
      // ============================================================================

      // Sprite atlas drawn on a canvas at boot -- no asset ships with this.
      // GRID x GRID distinct puffs, which combined with per-particle rotation and aspect jitter is more variety than a shelf of hand-painted sprites, out of one texture and one draw call.
      // Content is drawn into the inner ~84% of each cell and then masked to a transparent rim, so mip reduction can never bleed one puff into its neighbour.
      function makeSprayAtlas() {
        const P = CONFIG.SPRAY;
        const GRID = P.ATLAS_GRID,
          CELL = P.ATLAS_CELL,
          SIZE = CELL * GRID;
        const c = document.createElement("canvas");
        c.width = c.height = SIZE;
        const g = c.getContext("2d");
        const R = mulberry32(0x5079a1); // fixed: the atlas is the same every load, so nobody chases a "sometimes the spray looks wrong"
        for (let cy = 0; cy < GRID; cy++) {
          for (let cx = 0; cx < GRID; cx++) {
            const ox = cx * CELL,
              oy = cy * CELL;
            const mx = ox + CELL * 0.5,
              my = oy + CELL * 0.5;
            const R0 = CELL * 0.42;
            g.save();
            g.beginPath();
            g.rect(ox, oy, CELL, CELL);
            g.clip(); // every op below is confined to this cell
            // A puff is a cluster of soft lobes, not one gaussian -- a single radial gradient reads as a CG dot the moment two of them overlap.
            const blobs = 5 + ((R() * 5) | 0);
            for (let b = 0; b < blobs; b++) {
              const a = R() * Math.PI * 2,
                d = Math.sqrt(R()) * R0 * 0.55;
              const bx = mx + Math.cos(a) * d,
                by = my + Math.sin(a) * d;
              const br = R0 * (0.3 + R() * 0.42);
              const peak = 0.3 + R() * 0.34;
              const grd = g.createRadialGradient(bx, by, 0, bx, by, br);
              grd.addColorStop(0, `rgba(255,255,255,${peak})`);
              grd.addColorStop(0.5, `rgba(255,255,255,${peak * 0.4})`);
              grd.addColorStop(1, "rgba(255,255,255,0)");
              g.fillStyle = grd;
              g.beginPath();
              g.arc(bx, by, br, 0, Math.PI * 2);
              g.fill();
            }

            // Crystal grain: the flecks that catch the sun and stop the puff reading as fog.
            for (let k = 0; k < 90; k++) {
              const a = R() * Math.PI * 2,
                d = Math.sqrt(R()) * R0 * 0.92;
              const sx = mx + Math.cos(a) * d,
                sy = my + Math.sin(a) * d;
              g.fillStyle = `rgba(255,255,255,${0.18 + R() * 0.5})`;
              g.beginPath();
              g.arc(sx, sy, 0.8 + R() * 2.2, 0, Math.PI * 2);
              g.fill();
            }

            // Mask to a guaranteed-transparent rim (destination-in, clipped to this cell).
            const m = g.createRadialGradient(mx, my, R0 * 0.45, mx, my, R0);
            m.addColorStop(0, "rgba(0,0,0,1)");
            m.addColorStop(0.75, "rgba(0,0,0,0.75)");
            m.addColorStop(1, "rgba(0,0,0,0)");
            g.globalCompositeOperation = "destination-in";
            g.fillStyle = m;
            g.fillRect(ox, oy, CELL, CELL);
            g.globalCompositeOperation = "source-over";
            g.restore();
          }
        }
        const tex = new CanvasTexture(c);

        // Alpha-only sampling, so no colour-space decode applies; mips matter because far puffs land on a handful of pixels.
        tex.minFilter = LinearMipmapLinearFilter;
        tex.magFilter = LinearFilter;
        tex.generateMipmaps = true;
        return tex;
      }

      class SnowSpray extends Mesh {
        constructor() {
          const P = CONFIG.SPRAY;

          // One instanced quad, one draw call, two dynamic attribute lanes (8 floats per puff).
          // The base quad's `position` doubles as the corner offset in [-1,1] and, unrotated, as the atlas UV, so rotating the geometry rotates the sprite and nothing has to be stored twice.
          const geo = new InstancedBufferGeometry();
          geo.setAttribute(
            "position",
            new BufferAttribute(
              new Float32Array([-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, 1, 0]),
              3,
            ),
          );
          geo.setIndex([0, 1, 2, 0, 2, 3]);
          const posSize = new Float32Array(P.MAX * 4);
          const misc = new Float32Array(P.MAX * 4);
          geo.setAttribute(
            "iPosSize",
            new InstancedBufferAttribute(posSize, 4).setUsage(DynamicDrawUsage),
          );
          geo.setAttribute(
            "iMisc",
            new InstancedBufferAttribute(misc, 4).setUsage(DynamicDrawUsage),
          );
          geo.instanceCount = 0;

          // fog:true makes the renderer write the scene's fog into fogColor/fogNear/fogFar every frame, so those uniforms have to exist first.
          // Built-in materials get them merged for free; a ShaderMaterial does not, and the refresh throws on the missing slot rather than quietly skipping.
          // Merge first, then hang the spray's own uniforms off the result -- merge deep-clones what it is given, and there is no reason to clone a 512x512 atlas.
          const uniforms = UniformsUtils.merge([UniformsLib.fog]);
          uniforms.uAtlas = { value: makeSprayAtlas() };
          uniforms.uGrid = { value: P.ATLAS_GRID };
          uniforms.uSunView = { value: new Vector3(0, 1, 0) };
          uniforms.uSoft = { value: P.SOFT };
          uniforms.uNear = { value: CONFIG.CAMERA.NEAR };
          uniforms.uNearFade = { value: P.NEAR_FADE };
          uniforms.uOpacity = { value: P.OPACITY };
          uniforms.uLit = { value: new Color(P.LIT) };
          uniforms.uShade = { value: new Color(P.SHADE) };
          uniforms.uSunGain = { value: P.SUN_GAIN };

          const mat = new ShaderMaterial({
            transparent: true,
            depthWrite: false, // translucent media never writes depth
            depthTest: true, // ...but still tests, so trunks and boulders occlude the spray for free
            fog: true,
            uniforms,
            vertexShader: `
              #include <common>
              #include <fog_pars_vertex>

              attribute vec4 iPosSize;  // xyz = centre, player-relative (float32-clean at 1 AU); w = half-size in metres
              attribute vec4 iMisc;     // x = roll, y = age 0..1, z = seed 0..1, w = height above the snow (m)

              uniform float uGrid;
              uniform vec3  uSunView;   // sun direction in VIEW space
              uniform float uNear;
              uniform float uNearFade;
              uniform float uSoft;

              varying vec2  vUv;
              varying float vH;         // THIS FRAGMENT's height above the snow -- the soft-particle term
              varying float vAlpha;
              varying float vScatter;

              void main() {
                // Atlas cell from the seed.
                // UV comes off the UNROTATED corner, so the roll below turns the sprite with the quad.
                float cells = uGrid * uGrid;
                float cell  = floor( iMisc.z * ( cells - 0.0001 ) );
                vec2  cxy   = vec2( mod( cell, uGrid ), floor( cell / uGrid ) );
                vUv = ( cxy + ( position.xy * 0.5 + 0.5 ) ) / uGrid;

                // Camera-facing by construction: expand the quad in VIEW space, so there is no billboard matrix to build and no per-particle CPU work.
                vec4 mvPosition = modelViewMatrix * vec4( iPosSize.xyz, 1.0 );
                float sr = sin( iMisc.x ), cr = cos( iMisc.x );
                // Aspect jitter off the same seed: puffs are not discs.
                float sq = fract( iMisc.z * 37.0 ) - 0.5;
                vec2  sz = iPosSize.w * vec2( 1.0 + 0.28 * sq, 1.0 - 0.28 * sq );
                vec2  corner = vec2( position.x * cr - position.y * sr,
                                     position.x * sr + position.y * cr ) * sz;
                mvPosition.xy += corner;
                gl_Position = projectionMatrix * mvPosition;

                // Soft-particle term, no depth texture involved.
                // The centre's height above the snow is known exactly (iMisc.w); all this adds is how far this corner rises above the centre in world Y.
                // viewMatrix is a rigid transform, so the world Y of a view-space offset is its dot with the matrix's second column: two multiply-adds, exact for any camera orientation.
                float rise = viewMatrix[ 1 ].x * corner.x + viewMatrix[ 1 ].y * corner.y;

                // ...and then release the fade when it has nothing to do.
                // The hard line this exists to kill only appears where the billboard actually cuts the snow, which requires the quad to stand up out of it.
                // Look straight down and the quad lies parallel to the ground: it never intersects, and a fade keyed on height alone would wrongly erase the whole puff.
                // span is the quad's world-Y half-extent and goes to zero in exactly that case, so biasing by the shortfall turns the fade off precisely as fast as the problem disappears.
                float span = abs( viewMatrix[ 1 ].x ) * sz.x + abs( viewMatrix[ 1 ].y ) * sz.y;
                vH = iMisc.w + rise + uSoft * ( 1.0 - clamp( span / uSoft, 0.0, 1.0 ) );

                // Life envelope: snaps on (the snow is thrown, not born) and lets go slowly.
                float a = smoothstep( 0.0, 0.10, iMisc.y ) * ( 1.0 - smoothstep( 0.32, 1.0, iMisc.y ) );
                // Lens guard: a rooster tail can reach the camera; fade rather than slap a full-screen billboard on the lens.
                float viewZ = - mvPosition.z;
                a *= smoothstep( uNear, uNear + uNearFade, viewZ );
                vAlpha = a;

                // Forward scatter: ice crystals light up when the eye looks THROUGH them toward the sun.
                // The view ray and the sun both live in view space here, so this is one dot product.
                vScatter = pow( max( dot( normalize( mvPosition.xyz ), uSunView ), 0.0 ), 3.0 );

                #include <fog_vertex>
              }`,
            fragmentShader: `
              #include <common>
              #include <fog_pars_fragment>

              uniform sampler2D uAtlas;
              uniform float uSoft;
              uniform float uOpacity;
              uniform float uSunGain;
              uniform vec3  uLit;
              uniform vec3  uShade;

              varying vec2  vUv;
              varying float vH;
              varying float vAlpha;
              varying float vScatter;

              void main() {
                float m = texture2D( uAtlas, vUv ).a;
                if ( m < 0.004 ) discard;

                // The whole point of a soft particle: the billboard does not END at the snow, it DISSOLVES into it.
                // Anything at or below the surface is gone; the fade band above it is uSoft metres tall.
                float soft = smoothstep( 0.0, uSoft, vH );
                float a = m * vAlpha * soft * uOpacity;
                if ( a < 0.004 ) discard;

                // Airborne crystals catch the light; the bottom of the puff sits in the snow's own shadow.
                vec3 col = mix( uShade, uLit, clamp( vH * 0.9 + 0.3, 0.0, 1.0 ) );
                col += uSunGain * vScatter * vec3( 1.0, 0.97, 0.90 );

                gl_FragColor = vec4( col, a );
                #include <fog_fragment>
                #include <colorspace_fragment>
              }`,
          });

          super(geo, mat);
          this.frustumCulled = false; // one mesh anchored on the skier; the puffs are all around it
          this.renderOrder = 3; // over the marks (1) and the shadow decals (2); depth still sorts it against the forest
          this.castShadow = false;
          this.receiveShadow = false;
          this.visible = false;

          // Object pool: allocated once, never grown, never garbage.
          // Live puffs occupy [0, live); a death swaps the corpse to the end, so the array stays dense and the GPU upload is contiguous with no holes to skip.
          this.p = new Array(P.MAX);
          for (let i = 0; i < P.MAX; i++)
            this.p[i] = {
              wx: 0,
              wz: 0,
              gN: 0, // terrain-noise height under this puff, sampled once at birth
              h: 0, // height above the snow (m) -- see the header
              vx: 0,
              vz: 0,
              vh: 0,
              age: 0,
              life: 1,
              size: 0,
              grow: 0,
              rot: 0,
              spin: 0,
              seed: 0,
            };
          this.live = 0;

          // Fractional emission accumulators: rates are per-second, so a 30 fps frame emits exactly twice what a 60 fps frame does.
          this._accCarve = 0;
          this._accPlow = 0;
          this._accBase = 0;

          // Emitter anchors (one per ski), refilled each frame -- no allocation in the hot path.
          this._anchor = [
            { x: 0, z: 0, ax: 0, az: 0, len: 1.7 },
            { x: 0, z: 0, ax: 0, az: 0, len: 1.7 },
          ];
        }

        // Birth.
        // Returns nothing; silently recycles when the pool is full.
        _emit(wx, wz, h, vx, vz, vh, sizeScale) {
          const P = CONFIG.SPRAY;
          let q;
          if (this.live < P.MAX) {
            q = this.p[this.live++];
          } else {
            // Full.
            // Evict the oldest of three random candidates -- power-of-choices: near-oldest eviction for three comparisons, and no cyclic pattern for the eye to lock onto.
            let bi = (Math.random() * P.MAX) | 0;
            for (let k = 0; k < 2; k++) {
              const ci = (Math.random() * P.MAX) | 0;
              if (this.p[ci].age > this.p[bi].age) bi = ci;
            }
            q = this.p[bi];
          }
          q.wx = wx;
          q.wz = wz;
          q.gN = sampleTerrain(wx, wz); // the one perlin call this puff will ever cost
          q.h = h;
          q.vx = vx;
          q.vz = vz;
          q.vh = vh;
          q.age = 0;
          q.life = P.LIFE * (1 + (Math.random() * 2 - 1) * P.LIFE_JIT);
          q.size = P.SIZE * sizeScale * (0.7 + Math.random() * 0.6);
          q.grow = P.GROW * sizeScale * (0.7 + Math.random() * 0.6);
          q.rot = Math.random() * Math.PI * 2;
          q.spin = (Math.random() * 2 - 1) * P.SPIN;
          q.seed = Math.random();
        }

        update(dt, skier, sunView) {
          const P = CONFIG.SPRAY,
            S = CONFIG.SKIER,
            Sl = CONFIG.SLOPE;
          const px = skier.worldX,
            pz = skier.worldZ;

          // ---- Integrate.
          // Drag is exponential and solved exactly, so the decay is frame-rate independent rather than "roughly right at 60".
          const drag = Math.exp(-P.DRAG * dt);
          const arr = this.p;
          let live = this.live;
          for (let i = 0; i < live; ) {
            const q = arr[i];
            q.age += dt / q.life;
            if (q.age >= 1) {
              // Swap the corpse to the end and shrink -- O(1), keeps the array dense, and the pooled object is reused in place.
              arr[i] = arr[live - 1];
              arr[live - 1] = q;
              live--;
              continue;
            }
            q.vh -= P.GRAVITY * dt;
            q.vx *= drag;
            q.vz *= drag;
            q.vh *= drag;
            q.wx += q.vx * dt;
            q.wz += q.vz * dt;
            q.h += q.vh * dt;
            if (q.h < 0) {
              // Settled.
              // It stops rather than bouncing, and the soft fade turns the resting puff into a low dome melting back into the snow -- which is the correct end of a piece of thrown powder.
              q.h = 0;
              q.vh = 0;
              q.vx *= 0.35;
              q.vz *= 0.35;
            }
            q.rot += q.spin * dt;
            i++;
          }
          this.live = live;

          // ---- Emitter anchors: the live, measured skis when the rig exists, the body otherwise.
          // _skiTrue is the same measured ski centre + heading the herringbone stamps its ribs on, so the spray leaves from exactly where the track is being cut.
          const A = this._anchor;
          if (skier.skiTrueOk) {
            for (let i = 0; i < 2; i++) {
              const st = skier.skiTrue[i];
              A[i].x = st[0];
              A[i].z = st[1];
              A[i].ax = st[2];
              A[i].az = st[3];
              A[i].len = st[4];
            }
          } else {
            const o = CONFIG.TRACKS.SKI_OFFSET;
            for (let i = 0; i < 2; i++) {
              const side = i === 0 ? -1 : 1; // piece 0 is the left ski
              A[i].x = px + skier.rx * o * side;
              A[i].z = pz + skier.rz * o * side;
              A[i].ax = skier.fx;
              A[i].az = skier.fz;
              A[i].len = S.WHEELBASE;
            }
          }

          // ---- Drive.
          // Every term is read from the same telemetry the carve audio uses, so the spray and the hiss can never disagree about how hard the edges are working.
          const grounded = !skier.airborne;
          const speedFrac = clamp(skier.speed / S.SPEED_MAX, 0, 1);
          const gate = grounded
            ? clamp((skier.speed - P.MIN_SPEED) / 4, 0, 1)
            : 0;
          const bite = grounded
            ? clamp(Math.abs(skier.turnRate) / S.TURN_RATE_MAX, 0, 1)
            : 0;
          const plow = grounded ? clamp(skier.brakeBlend, 0, 1) : 0;
          const vfx = skier.fx * skier.speed,
            vfz = skier.fz * skier.speed;

          this._accCarve += P.CARVE_RATE * bite * speedFrac * gate * dt;
          this._accPlow += P.PLOW_RATE * plow * speedFrac * gate * dt;
          this._accBase += P.BASE_RATE * speedFrac * speedFrac * gate * dt;

          // ---- Carve: the rooster tail.
          // Positive turnRate swings the heading toward +right, so the outside (loaded, biting) ski is the left one, and the snow leaves to the outside of the arc.
          {
            let n = Math.floor(this._accCarve);
            this._accCarve -= n;
            if (n > P.BURST_CAP) n = P.BURST_CAP;
            if (n > 0) {
              const sign = skier.turnRate >= 0 ? 1 : -1;
              const outIdx = sign > 0 ? 0 : 1;
              const oX = -sign * skier.rx,
                oZ = -sign * skier.rz; // outward, away from the turn centre
              for (let k = 0; k < n; k++) {
                const loaded = Math.random() < P.LOADED_SKI_FRAC; // most of it comes off the ski carrying the weight
                const a = A[loaded ? outIdx : 1 - outIdx];
                const b = loaded ? 1 : 0.45;

                // Along the ski, behind the contact point: spray peels off the tail half.
                const t = -(0.12 + Math.random() * 0.5) * a.len;
                const wx = a.x + a.ax * t + (Math.random() - 0.5) * 0.12;
                const wz = a.z + a.az * t + (Math.random() - 0.5) * 0.12;
                const e = P.EJECT * bite * b * (0.55 + Math.random() * 0.85);
                this._emit(
                  wx,
                  wz,
                  0.03 + Math.random() * 0.1,
                  oX * e + vfx * P.CARRY * (0.5 + Math.random() * 0.5),
                  oZ * e + vfz * P.CARRY * (0.5 + Math.random() * 0.5),
                  P.UP * bite * b * (0.45 + Math.random() * 0.95) +
                    P.WIND_LIFT * speedFrac * Math.random(),
                  0.85 + bite * 0.5,
                );
              }
            }
          }

          // ---- Snowplow scrub: both skis pushing snow out and forward, ahead of the tips.
          {
            let n = Math.floor(this._accPlow);
            this._accPlow -= n;
            if (n > P.BURST_CAP) n = P.BURST_CAP;
            for (let k = 0; k < n; k++) {
              const i = Math.random() < 0.5 ? 0 : 1;
              const side = i === 0 ? -1 : 1;
              const a = A[i];
              const t = (0.2 + Math.random() * 0.35) * a.len; // out by the tips, where the wedge bites
              const wx = a.x + a.ax * t + (Math.random() - 0.5) * 0.14;
              const wz = a.z + a.az * t + (Math.random() - 0.5) * 0.14;
              const e = P.EJECT * 0.7 * plow * (0.5 + Math.random() * 0.8);
              this._emit(
                wx,
                wz,
                0.02 + Math.random() * 0.08,
                skier.rx * side * e + vfx * 0.35,
                skier.rz * side * e + vfz * 0.35,
                P.UP * 0.55 * plow * (0.4 + Math.random() * 0.9),
                0.8 + plow * 0.45,
              );
            }
          }

          // ---- Base dust: what the tails lift just from running fast in a straight line.
          {
            let n = Math.floor(this._accBase);
            this._accBase -= n;
            if (n > P.BURST_CAP) n = P.BURST_CAP;
            for (let k = 0; k < n; k++) {
              const a = A[Math.random() < 0.5 ? 0 : 1];
              const t = -(0.35 + Math.random() * 0.25) * a.len;
              this._emit(
                a.x + a.ax * t + (Math.random() - 0.5) * 0.18,
                a.z + a.az * t + (Math.random() - 0.5) * 0.18,
                0.02 + Math.random() * 0.06,
                vfx * 0.3 + (Math.random() - 0.5) * 0.6,
                vfz * 0.3 + (Math.random() - 0.5) * 0.6,
                P.WIND_LIFT * speedFrac * (0.3 + Math.random() * 0.7),
                0.55,
              );
            }
          }

          // ---- Landing: a ring punched out from under the skis, read off the same impulse the thud is mixed from.
          if (skier.landImpact > 0) {
            const imp = clamp(skier.landImpact / 11, 0, 1);
            const n = Math.round(P.LAND_BURST * imp);
            for (let k = 0; k < n; k++) {
              const ang = Math.random() * Math.PI * 2;
              const r = 0.15 + Math.random() * 0.55;
              const ox = Math.cos(ang),
                oz = Math.sin(ang);
              const e = (1.3 + 3.0 * imp) * (0.5 + Math.random() * 0.8);
              this._emit(
                px + ox * r,
                pz + oz * r,
                0.02 + Math.random() * 0.08,
                ox * e + vfx * 0.25,
                oz * e + vfz * 0.25,
                (0.8 + 2.0 * imp) * (0.3 + Math.random() * 0.9),
                0.95 + imp * 0.6,
              );
            }
            skier.landImpact = 0; // mailbox consumed
          }

          // ---- Takeoff: what the tails flick off the lip.
          if (skier.takeoffPuff > 0) {
            const imp = clamp(skier.takeoffPuff / S.HOP_IMPULSE, 0.3, 1.3);
            const n = Math.round(P.HOP_BURST * imp);
            for (let k = 0; k < n; k++) {
              const a = A[Math.random() < 0.5 ? 0 : 1];
              const t = -(0.2 + Math.random() * 0.45) * a.len;
              this._emit(
                a.x + a.ax * t + (Math.random() - 0.5) * 0.25,
                a.z + a.az * t + (Math.random() - 0.5) * 0.25,
                0.04 + Math.random() * 0.14,
                vfx * 0.35 + (Math.random() - 0.5) * 1.2,
                vfz * 0.35 + (Math.random() - 0.5) * 1.2,
                (0.9 + 1.4 * imp) * (0.4 + Math.random() * 0.8),
                0.8,
              );
            }
            skier.takeoffPuff = 0; // mailbox consumed
          }

          // ---- Branch brush: snow shaken out of a crown I am skiing through.
          // Rate-based rather than a one-shot burst, because unlike a landing this is a state I stay in for as long as it takes to cross the tree.
          if (skier.brushPuff > 0) {
            const imp = clamp(skier.brushPuff, 0, 1);
            // Rate scales with speed as well as strength, so the count comes out per metre travelled through the crown rather than per second.
            // Without it, the BRUSH_SPEED_FLOOR that exists so a slow push still sounds would also make a slow crossing linger inside the crown and shed three times the snow of a fast one -- a crawl through a tree would out-spray a 46 m/s clip through it.
            const nb = Math.round(
              P.BRUSH_RATE * imp * clamp(skier.speed / S.SPEED_MAX, 0, 1) * dt,
            );
            for (let k = 0; k < nb; k++) {
              const out = 0.15 + Math.random() * 0.7; // outward from the trunk
              const across = (Math.random() - 0.5) * 1.4; // spread along the path
              const e = (0.6 + 1.6 * imp) * (0.4 + Math.random() * 0.9);
              this._emit(
                px + skier.brushNX * out - skier.brushNZ * across,
                pz + skier.brushNZ * out + skier.brushNX * across,
                // Up in the boughs, not at ski level: this snow was sitting on branches.
                0.5 + Math.random() * 1.7,
                skier.brushNX * e + vfx * 0.3,
                skier.brushNZ * e + vfz * 0.3,
                // Negative: knocked snow falls.
                // The integrator settles it at h = 0 into a low dome.
                -(0.2 + Math.random() * 0.6),
                // Larger than carve spray: snow comes off a loaded bough in clumps, not as a fine rooster tail.
                1.0 + Math.random() * 0.8,
              );
            }
            skier.brushPuff = 0; // mailbox consumed
          }

          // ---- Upload.
          // Same float64 -> player-relative rebase the snow decals use: the mesh sits at the skier, every puff is written as a small offset from it, so the whole system is float32-clean at 1 AU.
          live = this.live;
          this.visible = live > 0;
          if (!live) {
            this.geometry.instanceCount = 0;
            return;
          }
          const ps = this.geometry.attributes.iPosSize.array;
          const ms = this.geometry.attributes.iMisc.array;
          const gr = STATE.slopeGrade,
            dX = Sl.DIR_X,
            dZ = Sl.DIR_Z;
          for (let i = 0; i < live; i++) {
            const q = arr[i];
            const dx = q.wx - px,
              dz = q.wz - pz;
            // Ground under this puff = its birth noise sample + THIS frame's fall-line ramp (slopeOffset, inlined -- one dot).
            // Identical to what the terrain shader draws there, so a settled puff lies exactly on the visible snow.
            const y = q.gN - gr * (dx * dX + dz * dZ) + q.h;
            const o = i * 4;
            ps[o] = dx;
            ps[o + 1] = y;
            ps[o + 2] = dz;
            ps[o + 3] = q.size + q.grow * q.age;
            ms[o] = q.rot;
            ms[o + 1] = q.age;
            ms[o + 2] = q.seed;
            ms[o + 3] = q.h;
          }
          this.position.set(px, 0, pz);
          this.geometry.instanceCount = live;

          // Upload only the live prefix, not the whole pool.
          // The array is sized for the worst case; a typical frame has a fifth of that alive, and a plain needsUpdate re-sends every dead slot for nothing.
          // The dense swap-on-death is what earns this: live puffs are always [0, live), one contiguous range with nothing to skip.
          // Ranges are consumed and cleared by the renderer on upload, so clearing first means a frame that never drew cannot leave a stale range to be re-sent later.
          const ipa = this.geometry.attributes.iPosSize,
            ima = this.geometry.attributes.iMisc;
          ipa.clearUpdateRanges();
          ima.clearUpdateRanges();
          ipa.addUpdateRange(0, live * 4);
          ima.addUpdateRange(0, live * 4);
          ipa.needsUpdate = true;
          ima.needsUpdate = true;
          if (sunView) this.material.uniforms.uSunView.value.copy(sunView);
        }
      }

      // ============================================================================
      // Chase CAMERA -- third person, behind & above, slope-aware
      // ============================================================================
      class ChaseCamera {
        constructor(camera) {
          this.camera = camera;
          this._bobT = 0;
          this._prevSpeed = 0;
          this._pitch = 0;
          // Smoothed grade along the heading (see update).
          // Seeded at the mountain grade because the skier starts on the fall line, so the first frame does not lurch.
          this._alongGrade = STATE.slopeGrade;
          this._lookMat = new Matrix4();
          this._lookTarget = new Vector3();
          this._tmpQuat = new Quaternion();
          this._forward = new Vector3();
          this._baseUp = new Vector3();

          // Free-look: smoothed yaw/pitch applied ON TOP of the chase orientation.
          this._lookYaw = 0;
          this._lookPitch = 0;
          this._chaseQuat = new Quaternion();
          this._yawQuat = new Quaternion();
          this._pitchQuat = new Quaternion();
          this._UP = new Vector3(0, 1, 0);
          this._RIGHT = new Vector3(1, 0, 0);

          // First person: smoothed eye offset (body-relative), and whether it has been seeded.
          this._fpsOff = new Vector3();
          this._fpsInit = false;
        }
        update(dt, skier, look) {
          const C = CONFIG.CAMERA;
          const speedFrac = clamp(skier.speed / CONFIG.SKIER.SPEED_MAX, 0, 1);
          const bodyRate = 2.0 + Math.sqrt(Math.max(0, skier.speed)) * 1.1;
          this._bobT += dt * bodyRate;
          const bodyBob =
            Math.sin(this._bobT) *
            0.03 *
            speedFrac *
            (skier.airborne ? 0.1 : 1);

          // Brief pitch dip on acceleration (adds to the rush; eases back when steady).
          const accel = (skier.speed - this._prevSpeed) / Math.max(dt, 1e-3);
          this._prevSpeed = skier.speed;
          const targetDip = clamp(accel * C.ACCEL_PITCH, -0.06, 0.06);
          this._pitch += (targetDip - this._pitch) * expK(5, dt);

          // eyeValid, not just "is there a head": the rig decides whether its own eye is trustworthy this frame, and the camera declines the mode if it is not.
          const fps = STATE.camBack <= C.FPS_AT && skier.eyeValid;

          // Speed-coupled FOV punch.
          const targetFov = C.FOV + C.FOV_SPEED_ADD * speedFrac;
          this.camera.fov +=
            (targetFov - this.camera.fov) * expK(C.FOV_LERP, dt);
          // The skier's own skull is clipped by the near plane rather than hidden.
          // Collapsing the head bone hid it from the camera but also from the sun -- three's depth pass skips zero-area triangles exactly like the colour pass -- so the shadow on the snow lost its head.
          // Moving the near plane only ever affects the eye.
          // Folded into the FOV update so the projection matrix is still rebuilt exactly once a frame.
          this.camera.near = fps ? C.FPS_NEAR : C.NEAR;
          this.camera.updateProjectionMatrix();

          const fx = skier.fx,
            fz = skier.fz;

          if (fps) {
            // The rig published this at the end of its pose solve (Skier.applyPoseIK).
            // It is an offset from the skier's origin, so it follows the tuck, and the scene rebase cannot leak into it.
            // The camera does not know a skeleton exists.
            const eo = skier.eyeOffset;

            // Smooth the offset, never the world position.
            // An exponential filter on a world position lags a moving object by v/rate -- 3.2 m at fall-line speed, past the head's own 0.8 m stand-off.
            // The offset is body-relative and bounded, so filtering it removes head jitter only, and travel is added afterwards untouched.
            if (this._fpsInit) {
              const k = expK(C.FPS_LERP, dt);
              this._fpsOff.x += (eo.x - this._fpsOff.x) * k;
              this._fpsOff.y += (eo.y - this._fpsOff.y) * k;
              this._fpsOff.z += (eo.z - this._fpsOff.z) * k;
            } else {
              this._fpsOff.copy(eo); // snap on entry, so it does not fly in from behind
              this._fpsInit = true;
            }
            // FPS_FWD/FPS_UP are not applied here: the rig already folded them into eyeOffset, in the head bone's own frame, so they follow the skull through every stance.
