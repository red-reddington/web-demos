            // Adding them again would double them and put them back on world axes.
            this.camera.position.set(
              skier.worldX + this._fpsOff.x,
              skier.worldY + this._fpsOff.y,
              skier.worldZ + this._fpsOff.z,
            );
            // No GROUND_CLEAR floor here: that exists to stop a rise behind the skier from clipping the lens, and there is nothing behind the skier any more.
            // Applying it would shove the eye up out of the head on every roll.
          } else {
            this._fpsInit = false;
            // Camera sits high and behind.
            // HEIGHT is well above where the slope raises the uphill ground, so the line of sight is markedly steeper than the slope -> the snow visibly falls away below and ahead.
            const camX = skier.worldX - fx * STATE.camBack;
            const camZ = skier.worldZ - fz * STATE.camBack;

            // Ground height directly under the camera (its own x,z), in the skier's frame, using the same sampleTerrain + slopeOffset the skier rides so it lines up with the visible surface.
            // The camera then keeps GROUND_CLEAR above whatever is beneath it, which is what stops a rise behind the skier clipping through the lens.
            const groundCam =
              sampleTerrain(camX, camZ) +
              slopeOffset(camX - skier.worldX, camZ - skier.worldZ);
            const camY =
              Math.max(
                skier.worldY + STATE.camHeight,
                groundCam + C.GROUND_CLEAR,
              ) + bodyBob;
            this.camera.position.set(camX, camY, camZ);
          }

          // Look just ahead of the skier; drop the target with grade (steeper run => more down-look) and with the accel dip.
          //
          // The grade that matters is the one along the heading, not the mountain's raw grade.
          // Raw grade aimed the gaze down by the same amount whichever way the skier faced, so pointed uphill the gaze sat ~2 deg off a rising slope and free-look could not lift far enough to clear it.
          // Dotting the heading with the fall-line direction gives +grade straight down, 0 across, -grade facing up, so the target rises when the ground ahead does.
          // Facing down the fall line the dot is 1 and this is algebraically identical to the old line.
          const SL = CONFIG.SLOPE;
          const alongGrade = STATE.slopeGrade * (fx * SL.DIR_X + fz * SL.DIR_Z);
          // Eased: a hard turn through the fall line would otherwise swing the horizon through ~34deg in a few frames.
          this._alongGrade +=
            (alongGrade - this._alongGrade) * expK(C.LOOK_GRADE_LERP, dt);
          if (fps) {
            // Look along the slope rather than at a point on it.
            // The chase target is a point 3.5 m ahead and ~2 m down, which works only because the camera stands off behind and above it; from inside the head there is no standoff left and that same point aims the view at the snow between the ski tips.
            // Aiming down the surface instead -- dy/dx = -alongGrade, the number the chase already smooths -- gives the natural eyes-down-the-fall-line horizon, and free-look still layers on top.
            const D = C.LOOK_AHEAD * 4;
            this._lookTarget.set(
              this.camera.position.x + fx * D,
              this.camera.position.y -
                this._alongGrade * D -
                this._pitch * 12 * 0.35,
              this.camera.position.z + fz * D,
            );
          } else {
            const gradeDrop = this._alongGrade * C.LOOK_GRADE_DROP;
            this._lookTarget.set(
              skier.worldX + fx * C.LOOK_AHEAD,
              skier.worldY + C.LOOK_HEIGHT - gradeDrop - this._pitch * 12,
              skier.worldZ + fz * C.LOOK_AHEAD,
            );
          }

          this._forward
            .subVectors(this._lookTarget, this.camera.position)
            .normalize();
          this._baseUp.set(0, 1, 0);
          this._tmpQuat.setFromAxisAngle(this._forward, skier.lean * 0.1);
          this._baseUp.applyQuaternion(this._tmpQuat);
          this._lookMat.lookAt(
            this.camera.position,
            this._lookTarget,
            this._baseUp,
          );
          this._chaseQuat.setFromRotationMatrix(this._lookMat);

          // Free-look: ease the smoothed offsets toward the target angles (radians), already clamped/scaled by the input layer; auto-recenters toward 0 when there is no look input.
          // Applied as yaw about world-up + pitch about local right.
          const tYaw = look ? look.yaw : 0;
          const tPitch = look ? look.pitch : 0;
          const k = expK(C.LOOK_LERP, dt);
          this._lookYaw += (tYaw - this._lookYaw) * k;
          this._lookPitch += (tPitch - this._lookPitch) * k;

          this.camera.quaternion.copy(this._chaseQuat);
          if (
            Math.abs(this._lookYaw) > 1e-4 ||
            Math.abs(this._lookPitch) > 1e-4
          ) {
            this._yawQuat.setFromAxisAngle(this._UP, this._lookYaw); // world-up yaw
            this._pitchQuat.setFromAxisAngle(this._RIGHT, this._lookPitch); // local-right pitch
            this.camera.quaternion.premultiply(this._yawQuat);
            this.camera.quaternion.multiply(this._pitchQuat);
          }

          // Aim the fan at the camera's TRUE facing -- one source of truth.
          // (getWorldDirection refreshes the world matrix.)
          this.camera.getWorldDirection(this._forward);
          this.effectiveYaw = Math.atan2(this._forward.x, -this._forward.z);
        }
      }

      // ============================================================================
      // Input
      // ============================================================================
      // Free-look via pointer lock: the cursor is captured and raw movement deltas accumulate into clamped yaw/pitch angles.
      // No drag, no button -- once locked, any mouse motion turns the view.
      // Click the canvas to relock, Esc unlocks.
      // steerRef is the yaw that currently counts as not steering: steering reads yaw minus this, never yaw itself, which is what lets keyboard and mouse share one axis without fighting (see the handover in Input.poll).
      const LOOK = {
        yaw: 0,
        pitch: 0,
        steerRef: 0,
        locked: false,
        active: false,
      };
      function initPointerLock(canvas) {
        const C = CONFIG.CAMERA;
        const lockSupported = typeof document.exitPointerLock === "function";
        if (!lockSupported) return;
        canvas.addEventListener("click", (e) => {
          if (e.ctrlKey) return; // Ctrl-click is reserved for the height-drag; don't grab pointer lock
          if (document.pointerLockElement !== canvas) {
            try {
              canvas.requestPointerLock()?.catch?.(() => {});
            } catch (e) {}
          }
        });
        document.addEventListener("pointerlockchange", () => {
          LOOK.locked = document.pointerLockElement === canvas;
        });
        document.addEventListener("mousemove", (e) => {
          if (!LOOK.locked) return;

          // Ctrl held: divert vertical motion to camera HEIGHT instead of free-look, so I can raise/lower the chase cam without the view swinging.
          // Move up (movementY<0) => rises.
          if (e.ctrlKey) {
            STATE.camHeight = clamp(
              STATE.camHeight - (e.movementY || 0) * C.HEIGHT_DRAG_SENS,
              C.HEIGHT_MIN,
              C.HEIGHT_MAX,
            );
            // No button is held while pointer-locked, so there is no end event to hook -- releasing Ctrl just stops the calls.
            // The debounce covers it.
            saveCameraFraming();
            return;
          }
          LOOK.yaw = clamp(
            LOOK.yaw - (e.movementX || 0) * C.MOUSE_SENSITIVITY,
            -C.LOOK_YAW_MAX,
            C.LOOK_YAW_MAX,
          );
          LOOK.pitch = clamp(
            LOOK.pitch - (e.movementY || 0) * C.MOUSE_SENSITIVITY,
            -C.LOOK_PITCH_DOWN,
            C.LOOK_PITCH_UP,
          );
          LOOK.active = true;
        });
      }

      // Camera framing controls, separate from free-look: mouse wheel dollies the chase camera (CAMERA.back), scroll up zooms in; two-finger pinch dollies the same, spread to zoom in; Ctrl-drag up/down raises and lowers the camera (CAMERA.HEIGHT).
      // Ctrl-drag while pointer-locked is handled in the mousemove above; this handler covers the unlocked case.
      // Pinch has no look/height equivalent on mobile by design.
      function initCameraView(canvas) {
        const C = CONFIG.CAMERA;

        // Restore the player's framing over the CONFIG defaults, clamped to the current dolly range -- so shrinking BACK_MAX in a later build can never strand someone at a distance the code no longer supports.
        STATE.camBack = Store.num(
          "camBack",
          STATE.camBack,
          C.BACK_MIN,
          C.BACK_MAX,
        );
        STATE.camHeight = Store.num(
          "camHeight",
          STATE.camHeight,
          C.HEIGHT_MIN,
          C.HEIGHT_MAX,
        );

        // Restored separately from camBack, because the session may have ended in first person and these are what the player gets back when they leave it.
        // Floor is above FPS_AT, not BACK_MIN: a stored value inside the first-person band would make the toggle a no-op.
        STATE.thirdBack = Store.num(
          "thirdBack",
          STATE.thirdBack,
          C.FPS_AT + 0.01,
          C.BACK_MAX,
        );
        STATE.thirdHeight = Store.num(
          "thirdHeight",
          STATE.thirdHeight,
          C.HEIGHT_MIN,
          C.HEIGHT_MAX,
        );

        // --- Wheel: dolly.
        // deltaY normalised so mice and trackpads feel the same.
        // ---
        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const d = clamp(e.deltaY, -100, 100) / 100; // -1..1 per notch
            STATE.camBack = clamp(
              STATE.camBack + d * C.ZOOM_WHEEL,
              C.BACK_MIN,
              C.BACK_MAX,
            );
            // A wheel has no "gesture end" event, so the debounce IS the end detector here: the write lands once the spinning stops.
            saveCameraFraming();
          },
          { passive: false },
        );

        // --- Pinch: only when both fingers started on the canvas (targetTouches), so the steer / look nipples in the corners are never mistaken for a pinch.
        // ---
        let pinchPrev = 0;
        const span = (a, b) =>
          len2(a.clientX - b.clientX, a.clientY - b.clientY);
        canvas.addEventListener(
          "touchstart",
          (e) => {
            if (e.targetTouches.length === 2)
              pinchPrev = span(e.targetTouches[0], e.targetTouches[1]);
          },
          { passive: true },
        );
        canvas.addEventListener(
          "touchmove",
          (e) => {
            if (e.targetTouches.length !== 2) return;
            const d = span(e.targetTouches[0], e.targetTouches[1]);

            // Fingers spreading (d grows) pulls the camera IN (back shrinks).
            if (pinchPrev > 0)
              STATE.camBack = clamp(
                STATE.camBack + (pinchPrev - d) * C.ZOOM_PINCH,
                C.BACK_MIN,
                C.BACK_MAX,
              );
            pinchPrev = d;
            saveCameraFraming();
            e.preventDefault();
          },
          { passive: false },
        );
        const endPinch = (e) => {
          if (e.targetTouches.length < 2) {
            pinchPrev = 0;
            Store.flush(); // real gesture end -- no need to wait out the debounce
          }
        };
        canvas.addEventListener("touchend", endPinch, { passive: true });
        canvas.addEventListener("touchcancel", endPinch, { passive: true });

        // --- Ctrl + drag (unlocked fallback): hold Ctrl, press, drag vertically.
        // Up = rise.
        // ---
        let dragging = false;
        canvas.addEventListener("mousedown", (e) => {
          if (e.ctrlKey && document.pointerLockElement !== canvas) {
            dragging = true;
            e.preventDefault();
          }
        });
        window.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          STATE.camHeight = clamp(
            STATE.camHeight - (e.movementY || 0) * C.HEIGHT_DRAG_SENS,
            C.HEIGHT_MIN,
            C.HEIGHT_MAX,
          );
          saveCameraFraming();
        });
        window.addEventListener("mouseup", () => {
          if (dragging) Store.flush(); // button up is the gesture end
          dragging = false;
        });
      }

      class Input {
        constructor() {
          this.keys = Object.create(null);
          this._joySteer = 0;
          this._joyThrottle = 0;
          this._lookLockY = false; // LOOK stick locked to pitch only (first person)
          this._rebuildJoysticks = null;

          // Hop is captured as the timestamp of the last press (a small buffer window), not a level read of the key -- so a sub-frame tap is never dropped and a press landed just before touchdown still fires.
          // -1 means "no pending hop".
          this._hopAt = -1;
          this._lookNippleYaw = 0;
          this._lookNipplePitch = 0;
          this.state = {
            steer: 0,
            throttle: 0,
            hop: false,
            lookYaw: 0,
            lookPitch: 0,
          };
          this.touchOnly = isTouchOnly();

          window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
              e.preventDefault();
              if (!e.repeat) this._hopAt = performance.now(); // edge only; ignore auto-repeat
            }

            // Latch on the press edge only.
            // Auto-repeat says nothing new, but it would re-assert a code that releaseHeld() just cleared -- and on X11 every held key repeats, not just the last one -- so a key held across a pause re-latched a frame after the flush and kept steering with nothing pressed.
            // Edge-only latching makes the flush stick: a key held through a pause stays neutral until it is genuinely released and pressed again.
            if (e.repeat) return;
            this.keys[e.code] = true;
          });
          window.addEventListener("keyup", (e) => {
            this.keys[e.code] = false;
          });

          if (this.touchOnly) this._initTouch();
        }
        clearHop() {
          this._hopAt = -1;
        }

        // Drop all held-key state.
        // A keyup landing while the window is blurred or pointer lock has been released is never delivered, so a key held at that moment stays latched true and keeps steering until it is pressed and released again.
        // Callers flush across a pause (see setPaused).
        releaseHeld() {
          this.keys = Object.create(null); // drop latched key state
          this.clearHop(); // and any buffered hop
        }
        _initTouch() {
          const joyEl = document.getElementById("joy");
          const hopEl = document.getElementById("hopPad");
          const lookEl = document.getElementById("lookpad");
          if (!joyEl || !hopEl) return;
          joyEl.style.display = "block";
          hopEl.style.display = "flex";
          if (lookEl) lookEl.style.display = "block";

          // DOM-level touch bookkeeping.
          // Attached once on the zone elements (which never move in the DOM), so these stay valid across orientation changes.
          let joyTouches = 0;
          joyEl.addEventListener(
            "touchstart",
            (e) => {
              joyTouches += e.changedTouches.length;
            },
            { passive: true },
          );
          const onEnd = (e) => {
            joyTouches = Math.max(0, joyTouches - e.changedTouches.length);
            if (joyTouches === 0) {
              this._joySteer = 0;
              this._joyThrottle = 0;
            }
          };
          joyEl.addEventListener("touchend", onEnd, { passive: true });
          joyEl.addEventListener("touchcancel", onEnd, { passive: true });
          hopEl.addEventListener(
            "touchstart",
            (e) => {
              this._hopAt = performance.now();
              e.preventDefault();
            },
            { passive: false },
          );
          if (lookEl) {
            let lt = 0;
            lookEl.addEventListener(
              "touchstart",
              (e) => {
                lt += e.changedTouches.length;
              },
              { passive: true },
            );
            const lEnd = (e) => {
              lt = Math.max(0, lt - e.changedTouches.length);
              if (lt === 0) {
                this._lookNippleYaw = 0;
                this._lookNipplePitch = 0;
              }
            };
            lookEl.addEventListener("touchend", lEnd, { passive: true });
            lookEl.addEventListener("touchcancel", lEnd, { passive: true });
          }

          // nipplejs (1.0.1) measures each zone's on-screen box when the manager is created and never recomputes it.
          // After an orientation change that cached box is stale, so the stick maps touches from the wrong origin and effectively stops responding.
          // So rebuild the managers from scratch whenever the viewport changes, which re-measures the zones against the new layout.
          const build = () => {
            // LOOK is pitch only in first person.
            // MOVE keeps steering in every mode, and LOOK's yaw would be a second steering input fighting it.
            // The mouse is the opposite case: with no move control, mouse-X has to steer.
            // lockY is a create-time nipplejs option, so the manager is rebuilt on a mode change.
            const CC = CONFIG.CAMERA;
            this._lookLockY = STATE.camBack <= CC.FPS_AT;
            if (this._joyManager) {
              this._joyManager.destroy();
              this._joyManager = null;
            }
            if (this._lookManager) {
              this._lookManager.destroy();
              this._lookManager = null;
            }
            this._joySteer = 0;
            this._joyThrottle = 0;
            this._lookNippleYaw = 0;
            this._lookNipplePitch = 0;

            this._joyManager = nipplejs.create({
              zone: joyEl,
              mode: "static",
              position: { left: "50%", top: "50%" },
              restJoystick: true,
              color: { front: "#8fd0ff", back: "rgba(143, 208, 255, 0.42)" },
              size: 110,
              threshold: 0.1,
              fadeTime: 150,
            });
            this._joyManager.on("move", (evt) => {
              const v = evt.data && evt.data.vector;
              if (!v) return;
              this._joySteer = clamp(v.x, -1, 1); // both axes, every mode
              this._joyThrottle = clamp(v.y, -1, 1);
            });

            if (lookEl) {
              this._lookManager = nipplejs.create({
                zone: lookEl,
                mode: "static",
                position: { left: "50%", top: "50%" },
                restJoystick: true,
                color: { front: "#8fd0ff", back: "rgba(143, 208, 255, 0.42)" },
                size: 110,
                threshold: 0.1,
                fadeTime: 150,
                lockY: this._lookLockY, // FPS: the knob itself only travels up/down
              });
              this._lookManager.on("move", (evt) => {
                const v = evt.data && evt.data.vector;
                if (!v) return;
                // Belt and braces: lockY should already hold x at 0, but a stray yaw here would fight MOVE for the heading, and that is not somewhere to find out that an option name changed in a future nipplejs.
                this._lookNippleYaw = this._lookLockY ? 0 : clamp(-v.x, -1, 1);
                this._lookNipplePitch = clamp(v.y, -1, 1); // up on the stick -> look up
              });
            }
          };
          build();

          // Rotation fires resize and/or orientationchange; rebuild once the new viewport settles (debounced) so nipplejs re-measures against the final dimensions, not the mid-rotation ones.
          let rebuildT = 0;
          const scheduleRebuild = () => {
            clearTimeout(rebuildT);
            rebuildT = setTimeout(build, 250);
          };
          // build, not scheduleRebuild.
          // scheduleRebuild debounces at 250 ms, and poll() re-arms it every frame for as long as the lock disagrees with the camera mode -- but the lock is only written inside build, so the deadline is pushed back 60 times a second and never arrives, in both directions.
          // The debounce exists to coalesce resize and orientation storms; a mode flip is one discrete event, and rebuilding on the spot ends the condition that asked for it.
          this._rebuildJoysticks = build;
          window.addEventListener("resize", scheduleRebuild);
          window.addEventListener("orientationchange", scheduleRebuild);
        }
        poll(dt) {
          this.state.steer = 0;
          this.state.throttle = 0;
          if (this.keys.KeyA || this.keys.ArrowLeft) this.state.steer = -1;
          if (this.keys.KeyD || this.keys.ArrowRight) this.state.steer = 1;
          if (this.keys.KeyW || this.keys.ArrowUp) this.state.throttle = 1;
          if (this.keys.KeyS || this.keys.ArrowDown) this.state.throttle = -1;
          if (this._joySteer !== 0) this.state.steer = this._joySteer;

          // Keyboard and mouse share this axis.
          // Steer reads yaw minus steerRef, and a held key drags steerRef along with the yaw -- so the key contributes zero mouse steer, free-look survives, and release hands over with no stale deflection to snap into.
          // Both ease home at the same rate, so recentring the view cannot itself produce a steer.
          {
            const CC = CONFIG.CAMERA;
            const fps = STATE.camBack <= CC.FPS_AT;

            // The LOOK stick's lock is baked in at create time, so a mode change needs a rebuild.
            // Compared against what the manager was actually built with, not against a remembered mode, so a missed rebuild repairs itself on the next frame.
            if (
              this.touchOnly &&
              this._rebuildJoysticks &&
              fps !== this._lookLockY
            )
              this._rebuildJoysticks();

            // Touch needs nothing else here: MOVE steers in every mode, and a nipple is spring-centred, so there is no accumulated deflection to arbitrate against.
            // The steerRef dance below exists only because a mouse has no such zero.
            if (fps && !this.touchOnly) {
              if (this.state.steer !== 0) {
                LOOK.steerRef = LOOK.yaw; // keys have it: the mouse is pure look again
              } else {
                this.state.steer = clamp(
                  (-(LOOK.yaw - LOOK.steerRef) / CC.LOOK_YAW_MAX) *
                    CC.MOUSE_STEER_GAIN,
                  -1,
                  1,
                );
              }
              const k = expK(CC.MOUSE_STEER_RECENTER, dt || 1 / 60);
              LOOK.yaw -= LOOK.yaw * k;
              LOOK.steerRef -= LOOK.steerRef * k;
            } else {
              LOOK.steerRef = LOOK.yaw; // third person / touch: the mouse never steers
            }
          }
          if (this._joyThrottle !== 0) this.state.throttle = this._joyThrottle;

          // Hop is "pending" for HOP_BUFFER_MS after a press.
          // The skier consumes it (via clearHop) the moment it actually takes off, so one press = one hop, and a hop queued mid-air fires on landing if it lands inside the window.
          this.state.hop =
            this._hopAt >= 0 &&
            performance.now() - this._hopAt <= CONFIG.SKIER.HOP_BUFFER_MS;
          // Look angles (radians).
          // Touch LOOK nipple (-1..1) scales to the clamp and overrides when active; otherwise the pointer-lock mouse angles drive it.
          const C = CONFIG.CAMERA;
          if (
            this.touchOnly &&
            (this._lookNippleYaw !== 0 || this._lookNipplePitch !== 0)
          ) {
            this.state.lookYaw = this._lookNippleYaw * C.LOOK_YAW_MAX;
            // The nipple reads -1..1; scale each half by its own clamp so touch reaches exactly as far as the mouse does.
            this.state.lookPitch =
              this._lookNipplePitch *
              (this._lookNipplePitch >= 0
                ? C.LOOK_PITCH_UP
                : C.LOOK_PITCH_DOWN);
          } else {
            this.state.lookYaw = LOOK.yaw;
            this.state.lookPitch = LOOK.pitch;
          }
          return this.state;
        }
      }

      // ============================================================================
      // Wind SOUND -- procedural WebAudio rush (no asset), volume + tone track speed
      // ============================================================================
      class WindSound {
        constructor() {
          this.muted = Store.get("muted", false) === true;
          this.ctx = null;
          this.ok = false;
          this._duckUntil = 0;
          this._duckAmt = 1;
          this.paused = false;
          this._suspendT = 0; // pending fade-then-suspend timer (see setPaused)
        }

        // iOS audio session.
        // Safari-only and still an Editor's Draft, hence the feature test.
        // By default Web Audio runs in the ambient category, which the hardware silent switch mutes -- the whole game goes quiet with no error to catch.
        // playback is the category media apps use and it ignores the switch.
        _setSession(type) {
          if (!("audioSession" in navigator)) return; // Safari 16.4+; elsewhere the switch just wins
          try {
            navigator.audioSession.type = type;
          } catch (e) {}
        }
        start() {
          if (this.ctx) return; // idempotent: a second start() would strand the first graph
          try {
            // Must precede context construction -- the category is captured when the context is created.
            this._setSession(this.muted ? "ambient" : "playback");
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            this.ctx = new Ctx();
            if (this.ctx.state === "suspended") this.ctx.resume(); // created in a gesture; resume to be safe
            const sr = this.ctx.sampleRate;
            const buf = this.ctx.createBuffer(1, sr * 2, sr);
            const d = buf.getChannelData(0);

            // Pink-ish noise (smoother/darker than white) via a simple running average.
            let last = 0;
            for (let i = 0; i < d.length; i++) {
              const w = Math.random() * 2 - 1;
              last = last * 0.92 + w * 0.08;
              d[i] = last * 3.2;
            }
            this._noiseBuf = buf;
            this.src = this.ctx.createBufferSource();
            this.src.buffer = buf;
            this.src.loop = true;

            // Lowpass tames hiss; a soft peaking band adds an airy "howl" instead of flat noise.
            this.filter = this.ctx.createBiquadFilter();
            this.filter.type = "lowpass";
            this.filter.frequency.value = 480;
            this.filter.Q.value = 0.4;
            this.peak = this.ctx.createBiquadFilter();
            this.peak.type = "peaking";
            this.peak.frequency.value = 220;
            this.peak.Q.value = 0.9;
            this.peak.gain.value = 6;
            this.gain = this.ctx.createGain();
            this.gain.gain.value = 0;

            // Slow gusting LFO modulates the gain so the wind breathes.
            this.lfo = this.ctx.createOscillator();
            this.lfo.frequency.value = 0.18;
            this.lfoGain = this.ctx.createGain();
            this.lfoGain.gain.value = 0;
            this.lfo.connect(this.lfoGain).connect(this.gain.gain);

            // Master gain sits after the LFO-modulated gain -- the LFO drives this.gain.gain, so pausing must mute here (a node the LFO doesn't touch) or the oscillator keeps swinging the gain around zero and the wind never actually stops.
            this.master = this.ctx.createGain();
            this.master.gain.value = 1;
            this.src
              .connect(this.filter)
              .connect(this.peak)
              .connect(this.gain)
              .connect(this.master)
              .connect(this.ctx.destination);
            this.src.start();
            this.lfo.start();

            // ---- Carve layer: continuous edge-spray that swells with how hard I turn.
            // -- A second noise source through a bandpass (the airy "shhh" of sprayed snow), its level driven by |turnRate|*speed and panned toward the turn.
            // It feeds the same master node as the wind, so pause/resume mutes it for free.
            // Centre-safe if StereoPanner is unavailable (older WebKit) -- it just won't pan.
            this.carveSrc = this.ctx.createBufferSource();
            this.carveSrc.buffer = buf;
            this.carveSrc.loop = true;
            this.carveBP = this.ctx.createBiquadFilter();
            this.carveBP.type = "bandpass";
            this.carveBP.frequency.value = 2200;
            this.carveBP.Q.value = 0.8;
            this.carveGain = this.ctx.createGain();
            this.carveGain.gain.value = 0;
            this.carvePan =
              typeof this.ctx.createStereoPanner === "function"
                ? this.ctx.createStereoPanner()
                : null;
            if (this.carvePan) {
              this.carveSrc
                .connect(this.carveBP)
                .connect(this.carveGain)
                .connect(this.carvePan)
                .connect(this.master);
            } else {
              this.carveSrc
                .connect(this.carveBP)
                .connect(this.carveGain)
                .connect(this.master);
            }
            this.carveSrc.start();
            this.ok = true;
            this.paused = false;
          } catch {
            this.ok = false;
          }
        }

        // Carve telemetry from the skier: signed turn (-1..1) and 0..1 speed fraction.
        // Loudness ~ |turn| * speed (a fast hard edge sprays most); pan follows direction.
        setCarve(turnNorm, speedFrac, scrub = 0) {
          if (!this.ok || this.paused) return;
          const now = this.ctx.currentTime;

          // `scrub` is extra edge bite from the snowplow wedge -- same physical sound as carve spray (skis scraping snow), centre-panned since both skis plow evenly.
          const mag = clamp(Math.abs(turnNorm) + scrub, 0, 1);
          const intensity = mag * clamp(speedFrac, 0, 1);
          const level = this.muted ? 0 : intensity * 0.16; // sits under the wind bed
          this.carveGain.gain.setTargetAtTime(level, now, 0.08);

          // Brighter spray the harder I carve; gentle so it never whistles.
          this.carveBP.frequency.setTargetAtTime(
            1800 + intensity * 1600,
            now,
            0.12,
          );
          if (this.carvePan) {
            this.carvePan.pan.setTargetAtTime(
              clamp(turnNorm, -1, 1) * 0.6,
              now,
              0.1,
            );
          }
        }
        update(speedFrac) {
          if (!this.ok || this.paused) return;
          const now = this.ctx.currentTime;
          const ducking = now < this._duckUntil;
          const duck = ducking ? this._duckAmt : 1;
          const base = (this.muted ? 0 : 0.035 + speedFrac * 0.13) * duck;
          this.gain.gain.setTargetAtTime(base, now, ducking ? 0.02 : 0.18);

          // Gust depth grows with speed; LFO speeds up a touch when moving fast.
          this.lfoGain.gain.setTargetAtTime(
            this.muted ? 0 : base * 0.5,
            now,
            0.3,
          );
          this.lfo.frequency.setTargetAtTime(0.15 + speedFrac * 0.25, now, 0.5);
          this.filter.frequency.setTargetAtTime(
            320 + speedFrac * 1200,
            now,
            0.25,
          );
        }

        // Fade the master, then suspend the context: browsers throttle rAF on a hidden tab but never the audio thread, so a graph left running keeps the wind noise, its LFO and the carve layer burning CPU for as long as the tab lives.
        // The fade has to finish before the suspend or the pause lands as a click, hence the timer, which re-checks `paused` so a fast pause/resume cannot suspend a context that is live again.
        setPaused(p) {
          if (!this.ok) return;
          this.paused = p;
          clearTimeout(this._suspendT);
          if (!p && this.ctx.state === "suspended") {
            try {
              this.ctx.resume();
            } catch (e) {}
          }
          const now = this.ctx.currentTime;
          this.master.gain.cancelScheduledValues(now);
          this.master.gain.setTargetAtTime(p ? 0 : 1, now, 0.06);
          if (p) {
            this._suspendT = setTimeout(() => {
              if (this.paused && this.ctx.state === "running") {
                try {
                  this.ctx.suspend();
                } catch (e) {}
              }
            }, 200);
          }
        }
        _duck(amt, dur) {
          this._duckAmt = amt;
          this._duckUntil = this.ctx.currentTime + dur;
        }

        // Takeoff: a short upward powder "fwip" -- band-passed noise sweeping up.
        whoosh(intensity = 1) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime,
            dur = 0.22;
          this._duck(0.3, dur); // pull the wind down so this cuts through
          const n = this.ctx.createBufferSource();
          n.buffer = this._noiseBuf;
          const bp = this.ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.Q.value = 0.7;
          bp.frequency.setValueAtTime(700, t);
          bp.frequency.exponentialRampToValueAtTime(3400, t + dur);
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.24 * intensity, t + 0.025);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          n.connect(bp).connect(g).connect(this.master);
          n.start(t);
          n.stop(t + dur);
        }

        // Landing: a low thump (compressed snow) + a brief crunch of noise.
        thud(strength = 0.5) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime,
            dur = 0.18;
          this._duck(0.25, dur);
          const o = this.ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(95, t);
          o.frequency.exponentialRampToValueAtTime(48, t + dur);
          const og = this.ctx.createGain();
          og.gain.setValueAtTime(0.6 * strength, t);
          og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(og).connect(this.master);
          o.start(t);
          o.stop(t + dur);
          const n = this.ctx.createBufferSource();
          n.buffer = this._noiseBuf;
          const lp = this.ctx.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 1100;
          const ng = this.ctx.createGain();
          ng.gain.setValueAtTime(0.18 * strength, t);
          ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
          n.connect(lp).connect(ng).connect(this.master);
          n.start(t);
          n.stop(t + 0.1);
        }

        // Climb footfall: an audible but soft snow crunch.
        // Mid-band noise gives the scrunch presence, plus a faint low triangle for the planted-weight body.
        // Length/timbre vary per call.
        step(strength = 0.6) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime,
            dur = 0.1 + 0.05 * Math.random();
          const n = this.ctx.createBufferSource();
          n.buffer = this._noiseBuf;
          n.playbackRate.value = 0.8 + 0.35 * Math.random();
          const bp = this.ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 1150 + 500 * Math.random();
          bp.Q.value = 0.7;
          const ng = this.ctx.createGain();
          ng.gain.setValueAtTime(0.0001, t);
          ng.gain.exponentialRampToValueAtTime(0.16 * strength, t + 0.008); // crisp crunch, not a tick
          ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          n.connect(bp).connect(ng).connect(this.master);
          n.start(t);
          n.stop(t + dur);
          const o = this.ctx.createOscillator();
          o.type = "triangle"; // faint compression body
          o.frequency.setValueAtTime(190, t);
          o.frequency.exponentialRampToValueAtTime(95, t + dur);
          const og = this.ctx.createGain();
          og.gain.setValueAtTime(0.06 * strength, t);
          og.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(og).connect(this.master);
          o.start(t);
          o.stop(t + dur);
        }

        // Pole tip biting the snow.
        // Its own voice rather than a quieter step(): a basket punching in is a short, bright tick with none of a boot's body.
        // Same noise buffer, band an octave up, no low body.
        poke(strength = 0.6) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime,
            dur = 0.05 + 0.03 * Math.random();
          const n = this.ctx.createBufferSource();
          n.buffer = this._noiseBuf;
          n.playbackRate.value = 1.1 + 0.4 * Math.random();
          const bp = this.ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 2600 + 900 * Math.random();
          bp.Q.value = 1.4; // tighter than a footfall: a click, not a crunch
          const ng = this.ctx.createGain();
          ng.gain.setValueAtTime(0.0001, t);
          ng.gain.exponentialRampToValueAtTime(0.09 * strength, t + 0.004);
          ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          n.connect(bp).connect(ng).connect(this.master);
          n.start(t);
          n.stop(t + dur);
        }

        // Collision impacts.
        // kind: 0=tree, 1=boulder; headOn -> central hit, else side/glancing.
        // Tree head-on = soft body "oomph"; tree side = airy branch "whoosh"; boulder head-on = deep muffled "thump"; boulder side = dull short thud.
        impact(kind, headOn, strength = 1) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime;
          const isTree = kind === 0;
          this._duck(0.22, headOn ? 0.32 : 0.2);
          const A = Math.max(0.15, strength); // overall level scale

          const wantBody = !(isTree && !headOn); // tree-side is pure whoosh, no tonal body
          if (wantBody) {
            const o = this.ctx.createOscillator();
            o.type = "sine";
            const f0 = isTree ? 150 : 80; // tree oomph ~150Hz, boulder thump ~80Hz
            const f1 = isTree ? 70 : 42;
            const dur = isTree ? 0.18 : 0.34; // boulder rings longer (mass)
            o.frequency.setValueAtTime(f0, t);
            o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            const g = this.ctx.createGain();
            const amp = (isTree ? 0.5 : 0.72) * A;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(amp, t + 0.012); // soft attack (no click)
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

            // gentle low-pass so even the body has no harsh edge (more for boulder)
            const lp = this.ctx.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = isTree ? 600 : 260;
            lp.Q.value = 0.4;
            o.connect(g).connect(lp).connect(this.master);
            o.start(t);
            o.stop(t + dur + 0.02);

            // a faint sub-thud an octave down for weight on head-on hits
            if (headOn) {
              const sub = this.ctx.createOscillator();
              sub.type = "sine";
              sub.frequency.setValueAtTime(f0 * 0.5, t);
              sub.frequency.exponentialRampToValueAtTime(f1 * 0.5, t + dur);
              const sg = this.ctx.createGain();
              sg.gain.setValueAtTime(0.0001, t);
              sg.gain.linearRampToValueAtTime(amp * 0.6, t + 0.014);
              sg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
              sub.connect(sg).connect(this.master);
              sub.start(t);
              sub.stop(t + dur + 0.02);
            }
          }

          // Noise layer.
          // Tree side = airy whoosh (bandpass sweeping down = branches brushing past).
          // Tree head-on = small soft snow puff.
          // Boulder = brief muffled (lowpassed) dull noise.
          const n = this.ctx.createBufferSource();
          n.buffer = this._noiseBuf;
          const f = this.ctx.createBiquadFilter();
          const ng = this.ctx.createGain();
          let nDur, nAmp;
          if (isTree && !headOn) {
            // Whoosh
            f.type = "bandpass";
            f.Q.value = 0.8;
            f.frequency.setValueAtTime(1100, t);
            f.frequency.exponentialRampToValueAtTime(380, t + 0.3); // downward sweep = passing by
            nDur = 0.34;
            nAmp = 0.3 * A;
            ng.gain.setValueAtTime(0.0001, t);
            ng.gain.linearRampToValueAtTime(nAmp, t + 0.05); // swell in (airy, not a hit)
            ng.gain.exponentialRampToValueAtTime(0.0001, t + nDur);
          } else if (isTree) {
            // soft snow puff under the oomph
            f.type = "lowpass";
            f.frequency.value = 1400;
            nDur = 0.16;
            nAmp = 0.14 * A;
            ng.gain.setValueAtTime(nAmp, t);
            ng.gain.exponentialRampToValueAtTime(0.0001, t + nDur);
          } else {
            // boulder: muffled dull noise (heavily lowpassed)
            f.type = "lowpass";
            f.frequency.value = headOn ? 320 : 480;
            f.Q.value = 0.5;
            nDur = headOn ? 0.22 : 0.13;
            nAmp = (headOn ? 0.28 : 0.2) * A;
            ng.gain.setValueAtTime(0.0001, t);
            ng.gain.linearRampToValueAtTime(nAmp, t + 0.01);
            ng.gain.exponentialRampToValueAtTime(0.0001, t + nDur);
          }
          n.connect(f).connect(ng).connect(this.master);
          n.start(t);
          n.stop(t + nDur + 0.02);
        }

        // Branch brush, its own voice rather than impact()'s tree whoosh, which is levelled to sit under a collision.
        // Two things make it audible and neither is gain.
        // The wind bed is a lowpass at 320 + speedFrac * 1200 Hz, so a voice below that is masked rather than quiet -- both voices start above the corner and sweep down through it.
        // And steady noise against steady noise is the worst case for detection, so the envelope is a grainy random curve rather than a smooth swell, which is also what branch contact actually is.
        brush(strength = 1) {
          if (!this.ok || this.muted || this.paused) return;
          const t = this.ctx.currentTime;
          const A = clamp(strength, 0.15, 1);
          const dur = 0.42 + 0.22 * A; // a harder brush rustles for longer
          // Duck hard, not politely.
          // Punching a hole in the bed is what a listener actually hears; at the old 0.25 the wind at speed was still louder than the brush on top of it.
          this._duck(0.12, dur);

          const voice = (f0, f1, q, amp, d, atkFrac) => {
            const n = this.ctx.createBufferSource();
            n.buffer = this._noiseBuf;
            n.playbackRate.value = 0.85 + Math.random() * 0.35; // no two brushes identical
            const bp = this.ctx.createBiquadFilter();
            bp.type = "bandpass";
            bp.Q.value = q;
            bp.frequency.setValueAtTime(f0, t);
            bp.frequency.exponentialRampToValueAtTime(f1, t + d);

            // Grainy envelope: an overall swell-and-release, multiplied by per-segment randomness so the result is a burst of ticks rather than one smooth shape.
            // ~14 ms a segment puts the roughness where the ear reads it as rustle.
            const N = Math.max(8, Math.round(d / 0.014));
            const env = new Float32Array(N);
            for (let i = 0; i < N; i++) {
              const u = i / (N - 1);
              const shape = Math.min(1, u / atkFrac) * Math.pow(1 - u, 1.4);
              env[i] = Math.max(
                0.0001,
                amp * shape * (0.2 + Math.random() * 0.8),
              );
            }
            env[N - 1] = 0.0001;

            const g = this.ctx.createGain();
            g.gain.setValueCurveAtTime(env, t, d);
            n.connect(bp).connect(g).connect(this.master);
            n.start(t);
            n.stop(t + d + 0.02);
          };
          // Both start above the wind's corner even at top speed, then sweep down through it as the branches release.
          voice(2900, 1250, 1.1, 0.28 * A, dur, 0.14); // boughs whipping past
          voice(7000, 3600, 1.6, 0.2 * A, dur * 0.7, 0.05); // needles and crusted snow
        }
        toggleMute() {
          this.muted = !this.muted;
          // A toggle is discrete -- there is no gesture to wait out, so write it now.
          Store.set("muted", this.muted);
          Store.flush();

          // Hand the session back when muted so the user's own audio resumes; retake it when unmuted.
          this._setSession(this.muted ? "ambient" : "playback");
          return this.muted;
        }

        // Called on the page's visible/focus edge.
        resume() {
          if (!this.ctx) return;
          this._setSession(this.muted ? "ambient" : "playback");

          // Coming back to the tab does not unpause the game, so the context must stay suspended until setPaused(false) says otherwise -- otherwise the graph restarts and runs behind the pause overlay.
          if (this.paused) return;
          if (this.ctx.state === "suspended") {
            try {
              this.ctx.resume();
            } catch (e) {}
          }
        }
      }
      let SOUND = null;
      let GAME = null; // built once at page load so the splash can render a single frame + show stats

      // True once the animation loop is actually turning. GAME.paused alone is not enough: while the splash is up the game exists and is unpaused, but tick() has never been scheduled, so nothing redraws.
      let _loopRunning = false;

      // ============================================================================
      // Persistent FOREST
      // ----------------------------------------------------------------------------
      // Trees live at true world positions; the GPU holds a fixed pool of instances and each frame the visible world-trees are bound to slots.
      // Each chunk cell (cx,cz) deterministically contains its trees as a pure function of its integer coords, so riding past a tree and turning back shows it in the same place forever.
      // Positions are computed relative to the player's cell so they stay float32-clean even at the 1-AU spawn, exactly like the terrain's player-pivoted slope.
      // ============================================================================

      // Deterministic PRNG (mulberry32).
      // Math.imul keeps the seed hashing exact at 32 bits.
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Allocation-free reseedable mulberry32 for the per-cell streamer and collision scans.
      // The bit sequence after .seed(s) is byte-for-byte identical to mulberry32(s), golden-tested across seeds including the int32 wrap, so every world position the renderer and the collider derive is unchanged.
      // Reseeded before use at every cell and never used by two interleaved scans, so one shared instance per streamer is safe.
      function makeMulberry32() {
        let a = 0;
        const fn = function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
        fn.seed = function (s) {
          a = s >>> 0;
          return fn;
        };
        return fn;
      }

      // Hash a chunk cell to a stable 32-bit seed, exact via Math.imul plus avalanche.
      // `cx | 0` truncates to int32, so cell coordinates are only unique while |c| < 2^31.
      // At the 1 AU spawn with CELL 110 that is cx ~ 1.36e9 of a 2.15e9 ceiling: ~0.58 AU of travel before the scatter starts aliasing, i.e. decades at top speed.
      // Halving CELL halves that headroom, so shrinking the cell needs a wider hash.
      function cellSeed(cx, cz) {
        let h =
          (Math.imul(cx | 0, 73856093) ^ Math.imul(cz | 0, 19349663)) >>> 0;
        h ^= h >>> 13;
        h = Math.imul(h, 0x5bd1e995);
        h ^= h >>> 15;
        return h >>> 0;
      }

      // ----------------------------------------------------------------------------
      // Shadow decals -- the far half of the sun's shadow, drawn rather than mapped
      // ----------------------------------------------------------------------------
      // The shadow atlas is fitted to the skier (CONFIG.SHADOW.RADIUS), which is what buys a texel a little over a centimetre wide. It holds the skier and nothing else, so on its own a slope whose trees and boulders have no shadows reads as cardboard.
      // So every static caster has its shadow drawn instead. A caster's silhouette from the sun is a flat shape, and shearing that shape along the sun onto the snow gives what a map would have produced, at the texture's own resolution rather than an atlas's -- and at any distance, rather than only within the box.
      // Drawn rather than mapped for all of them, near ones included. Letting a caster do both would darken the same snow twice wherever the two overlapped, and no ramp between them can be right, because a shadow map is a binary occlusion test and an alpha ramp is not.
      // A tree supplies the card the depth pass would have rasterised, painted at TREE_SUN_YAW. A boulder is convex, so its silhouette is a disc and a soft blob stands in for it; the same shear turns that disc into the ellipse a rounded rock actually casts.
      // Nothing is cached. The projection is a shear whose only variable is the live grade, so it is one uniform per frame and there is no bake to go stale as the slope drifts.
      //
      // Why this is cheap: the scenery is sparse. At CELL 110 with one tree per cell there are ~30 trees in view, each shadow covering ~65 m^2 of a 363,000 m^2 disc, and the boulders are shorter still. That is well under 1% ground coverage, so two shadows essentially never overlap and the blended pass costs almost nothing. Raise the per-cell counts far enough and overlap starts to double-darken (multiply blending squares where it should not), which is a correctness limit rather than a speed one.
      // Multiply blending is commutative, so overlapping decals are order-independent: no sorting, no back-to-front pass, no depth-order bugs.
      // Silhouette of a rounded rock, seen from the sun: a disc with a soft rim.
      // A boulder is convex and near-spherical, so unlike a tree it needs no painting -- the shear that turns a card into a long shadow turns this disc into the ellipse the rock actually casts, and the caster's own aspect falls out of the width and height it reports.
      // Alpha only; the decal's colour comes from CONFIG.SHADOW.DECAL.DARKNESS.
      class ShadowDecals {
        // `pool` is the caller's own visible-instance ceiling, so each scenery system sizes its own buffer rather than inheriting the forest's.
        constructor(parent, pool, opts = {}) {
          const S = CONFIG.SHADOW.DECAL;
          this.pool = pool;
          // Ellipse mode (boulders): the silhouette is an analytic ellipse evaluated in the fragment, not a sampled texture.
          // A conifer is one fixed outline, so a painted card is the natural silhouette; a boulder is a different carved, tumbled shape every instance, and its shadow is exactly the projection of an ellipsoid -- an ellipse -- so it is cheaper and exact to solve than to bake.
          this.ellipse = !!opts.ellipse;
          // Optional per-caller overrides of the contact shade. A boulder sits in the snow and wants a broader, firmer pool than a tree's ankle-thin one; passing them here keeps the two tunings independent while sharing the shader.
          this._poolR = opts.poolR;
          this._poolSoft = opts.poolSoft;
          this._dark = opts.dark;

          // Unit patch in shadow space: x runs across the caster, z from its base out to the shadow tip.
          // Tessellated because the patch is metres long and lies on terrain that is not flat; each vertex solves its own ground height in the vertex shader, exactly as the ground fan does.
          const geo = this._patchGeometry(S.SEG_X, S.SEG_Z);

          // One instanced attribute carrying everything that differs per caster: world XZ of its base, its half-width, and its silhouette height.
          // Length is not stored -- it is height divided by a per-frame slope term, so baking it in would freeze the projection at the grade it was written.
          this._inst = new InstancedBufferAttribute(
            new Float32Array(this.pool * 4),
            4,
          );
          this._inst.setUsage(DynamicDrawUsage);
          geo.setAttribute("iCaster", this._inst);

          // The card is sunk into the slope (FOREST.SINK_FACTOR), so its foot is below the snow and only part of the painting is above ground.
          // This is where the visible part starts, as a fraction of the card's height. Without it the buried portion gets projected onto open snow as a blob at the trunk, and the shadow runs ~14% long.
          this._instBase = new InstancedBufferAttribute(
            new Float32Array(this.pool),
            1,
          );
          this._instBase.setUsage(DynamicDrawUsage);
          geo.setAttribute("iBaseV", this._instBase);

          // Per-instance 2x2 quadratic form (q11, q12, q22) of the ground shadow ellipse, in the card's (across, along) metres.
          // One form is all this mode needs: the shadow of an ellipsoid under a directional light IS an ellipse, so there is no silhouette-plus-contact-pool to reconcile -- the single ellipse already covers the rock's base and reaches downsun. See Boulders.update for the projection that fills it.
          if (this.ellipse) {
            this._instEll = new InstancedBufferAttribute(
              new Float32Array(this.pool * 3),
              3,
            );
            this._instEll.setUsage(DynamicDrawUsage);
            geo.setAttribute("iEllipse", this._instEll);
          }

          this.mesh = new Mesh(geo, this._material());
          this.mesh.frustumCulled = false;
          this.mesh.castShadow = false;
          this.mesh.receiveShadow = false;
          // After the snow marks (1), which is the physical order: a shadow falls across a carve track, so it multiplies over one rather than being painted out by it.
          this.mesh.renderOrder = 2;
          geo.instanceCount = 0;
          parent.add(this.mesh);
          this.count = 0;
        }

        // A grid of quads over the unit square. Position carries (u, 0, v) and nothing else: the vertex shader builds the world point from the instance, so a normal or a uv would be an attribute no shader reads.
        _patchGeometry(nx, nz) {
          const vx = nx + 1,
            vz = nz + 1;
          const pos = new Float32Array(vx * vz * 3);
          for (let j = 0; j < vz; j++) {
            for (let i = 0; i < vx; i++) {
              const k = (j * vx + i) * 3;
              pos[k] = i / nx; // 0..1 across the caster
              pos[k + 2] = j / nz; // 0..1 from its base to the shadow tip
            }
          }
          const idx = new Uint16Array(nx * nz * 6);
          for (let j = 0, o = 0; j < nz; j++) {
            for (let i = 0; i < nx; i++, o += 6) {
              const a = j * vx + i;
              idx[o] = a;
              idx[o + 1] = a + vx;
              idx[o + 2] = a + vx + 1;
              idx[o + 3] = a;
              idx[o + 4] = a + vx + 1;
              idx[o + 5] = a + 1;
            }
          }
          const g = new InstancedBufferGeometry();
          g.setAttribute("position", new BufferAttribute(pos, 3));
          g.setIndex(new BufferAttribute(idx, 1));
          return g;
        }

        _material() {
          const S = CONFIG.SHADOW.DECAL;
          const ell = this.ellipse;
          const u = {
            uTex: { value: null }, // set once the conifer atlas exists
            uNoiseWrapA: { value: new Vector2() },
            uNoiseWrapB: { value: new Vector2() },
            uNoiseWrapAmp: { value: new Vector2() },
            uSlope: { value: STATE.slopeGrade },
            uFallDir: {
              value: new Vector2(CONFIG.SLOPE.DIR_X, CONFIG.SLOPE.DIR_Z),
            },
            uOriginMinusPlayer: { value: new Vector2() },
            uSunAway: { value: SUN_AWAY_XZ }, // horizontal, away from the sun
            uShadowRight: { value: SUN_RIGHT_XZ }, // horizontal, across the shadow
            uInvFall: { value: 1 }, // ground metres of shadow per metre of caster height
            uDark: { value: this._dark != null ? this._dark : S.DARKNESS },
            uRaise: { value: S.RAISE },
            uPoolR: { value: this._poolR != null ? this._poolR : S.POOL_R },
            uPoolSoft: {
              value: this._poolSoft != null ? this._poolSoft : S.POOL_SOFT,
            },
            uFade: { value: S.ELL_FADE },
          };
          this.uniforms = u;

          return new ShaderMaterial({
            uniforms: u,
            transparent: true,
            blending: MultiplyBlending,

            // three only implements MultiplyBlending on the premultiplied path; without this it logs and leaves the decals compositing as ordinary alpha.
            // Nothing about the maths changes here, because this is not conventional alpha compositing: the fragment already outputs the finished multiplier and an alpha of 1, so the blend is dst.rgb *= src.rgb either way.
            premultipliedAlpha: true,
            depthWrite: false,
            side: DoubleSide, // the patch drapes over terrain and can tilt past edge-on
            vertexShader: ell
              ? /* glsl */ `
              ${TERRAIN_GLSL}
              attribute vec4 iCaster;   // xy = the ellipse's CENTRE in world XZ (decal-space), z/w = its across/along half-extents
              attribute vec3 iEllipse;  // 2x2 form (q11, q12, q22) in card metres
              uniform vec2 uNoiseWrapA;
              uniform vec2 uNoiseWrapB;
              uniform vec2 uNoiseWrapAmp;
              uniform float uSlope;
              uniform vec2 uFallDir;
              uniform vec2 uOriginMinusPlayer;
              uniform vec2 uSunAway;
              uniform vec2 uShadowRight;
              uniform float uRaise;
              varying vec2 vP;
              varying vec3 vEll;

      // See createConiferTexture.

      // Scattered clumps cannot do this: with no axis to follow, snow can only be dropped, the silhouette is wherever stray ellipses reach, and gaps have to be subtracted afterwards.

      let MAX_ANISO = 1;

      function createConiferTexture(seed) {
        const F = CONFIG.FOREST;
        const W = F.TEX_W,
          H = F.TEX_H;
        const c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        const g = c.getContext("2d");
        const R = mulberry32(seed >>> 0);
        // Every constant below that is in pixels rather than a fraction of W/H is multiplied by S.
        // Without it, raising the canvas size would not sharpen the same painting -- it would paint a different, finer-grained tree.

        const cxC = W * 0.5;

        // soft elliptical dab via a rotated radial gradient

          g.save();
          g.translate(x, y);
          g.rotate(ang);
          g.scale(1, ry / rx);
          const grad = g.createRadialGradient(0, 0, 0, 0, 0, rx);
          grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${a})`);

            `rgba(${col[0]},${col[1]},${col[2]},${a * 0.5})`,
          );
          grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
          g.fillStyle = grad;
          g.beginPath();
          g.arc(0, 0, rx, 0, Math.PI * 2);
          g.fill();
          g.restore();

        const spire = 0.35 + R() * 0.6; // high = tall narrow fir, low = squat spruce

              botY - u * span * 0.93, // stop short of the crown; the leader covers the rest
              F.TRUNK_PX * S * (1 - u * 0.75),
              span / steps,
              0,
              [66, 62, 54],
              0.8,

        const axis = (y0, side, len, droop, u) => ({

          y: y0 + droop * Math.pow(u, 1.8),

                p.y + w * (0.6 + R() * 0.8),
                rx * (0.3 + R() * 0.35),
                w * (0.3 + R() * 0.4),

                p.x + (R() - 0.5) * step * 2,
                p.y - w * 0.7,
                sr,
                sr,
                0,
                [255, 255, 255],
                0.85,

        // Collected first and painted in two passes: all needles, then all snow.

        const branches = [];

            Math.min(1, (k + (R() - 0.5) * 0.55) / (nW - 1)),

          paintBranch(b.y0, b.side, b.len, b.droop, b.thick);

        // A single near-vertical shoot with its own cap.
        // Without it the cone just stops at its narrowest whorl and the tree looks decapitated.
        {

            const w = (3.0 + 5.0 * u) * S;

              cxC + (R() - 0.5) * S,
              topY + tipLen * u,
              w * 1.15,
              w,
              0,
              u < 0.4 ? gMid : gShadow,

            topY + capR * 0.9,
            capR * 1.2,

          // The jitter is therefore one-sided: it only ever shortens a dab, so the band top is bounded by fadeH exactly as before.

          const dabs = F.BASE_DABS;
          const step = W / (dabs - 1);
          let walk = 0;
          for (let i = 0; i < dabs; i++) {

        tex.minFilter = LinearMipmapLinearFilter;
        tex.magFilter = LinearFilter;
