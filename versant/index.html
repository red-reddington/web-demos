          RIB_FWD: 0.55, // metres to slide each rib forward along its ski axis so it lands under the ski (which mounts ahead of the boot).
          // The ski-to-foot offset is fixed by the rigid mount, so one constant seats it.
          // Dial until the grounded ski sits exactly on its mark.
        },

        // Persistent chunked forest.
        // Trees have TRUE world positions: each cell's trees are a pure function of its integer (cx,cz), so passing a tree and returning shows it in the exact same spot.
        // "Sparse & far" alpine preset.
        FOREST: {
          // Scatter density and streaming.
          CELL: 110, // metres per chunk cell (large -> sparse, true alpine spacing)
          TREES_PER_CELL: 1, // one tree per ~12,000 m^2
          VIEW_RADIUS: 340, // spawn far out so trees fade in through fog, never pop
          // Two budgets: POOL was previously doing both jobs, which quietly capped the whole forest at 64 trees while claiming 64 per variant.
          POOL: 64, // per-variant: slots in one InstancedMesh
          MAX_VISIBLE: 320, // total trees bound across all variants in a frame
          // ~30 are visible at CELL 110 and VIEW_RADIUS 340; both budgets exist to bound GPU memory, not to be hit.
          // Saturating either drops trees, biased by scan order, and Forest.update warns once.
          // No clearing is punched around the skier -- a clear spawn is guaranteed instead by picking an empty spot (see Game._pickClearSpawn).

          // Appearance.
          NUM_SHAPES: 6, // distinct painted texture variants (one instanced draw each)
          // Six variants at 512x640 rather than ten at 256x320: 2x the linear texture resolution for roughly the same VRAM (~10 MB with mips vs ~4 MB, so the resolution costs more and the variant cut pays part of it back) and four fewer draw calls.
          // Per-tree aspect and yaw still differ within a variant, so the forest does not read as six repeated trees.
          TEX_W: 512, // painted canvas size. Every pixel-space constant in createConiferTexture scales off TEX_W/256,
          TEX_H: 640, // so changing these two rescales the painting instead of re-proportioning it.

          // The skeleton.
          // See createConiferTexture -- the painter builds a trunk, then whorls of drooping branches, and hangs everything else off those branch axes.
          WHORL_MIN: 20, // layers of branches up the tree
          WHORL_MAX: 27,
          BRANCH_MIN: 9, // branches drawn per whorl (a radial whorl projected onto a flat card)
          BRANCH_MAX: 14,
          // Both counts are roughly double the geometric minimum.
          // A conifer's layers overlap, and only once they do does the canopy read as a mass with structure rather than a stack of isolated plates with sky between them.
          BRANCH_LEN_MIN: 0.32, // shortest branch as a fraction of the whorl's reach.
          // The spread matters more than the value: in a real whorl the branches pointing toward and away from the viewer project short, and that variation is exactly what makes the silhouette jagged like a conifer instead of lobed like a shrub.
          BRANCH_THICK: 6, // needled half-thickness of a bough at the trunk, px at TEX_W 256
          DROOP_TOP: 0.1, // tip drop as a fraction of branch length, at the leader
          DROOP_BOT: 0.45, // ...and at the foot, where boughs are longer, older and carrying more
          TRUNK_PX: 2.6, // trunk half-width at the base, px at TEX_W 256. Drawn first and almost entirely buried; what shows through the gaps is what a real trunk shows.

          // Snow as a ridge along a branch rather than caps dropped onto one.
          // This is the whole reason for the skeleton: given an axis, snow can follow it.
          // Without one it can only be scattered, and scattered snow reads as dandruff no matter how it is sized or placed.
          SNOW_AMOUNT: 0.6, // base chance a stretch of branch carries a ridge
          SNOW_RIDGE: 0.8, // ridge thickness as a multiple of the bough's half-thickness at that point.
          // Above ~1 the ridge is thicker than the bough carrying it, swallows the green entirely and the tree turns to meringue.
          // It should sit ON the branch, not replace it.
          SNOW_TIP_BIAS: 0.6, // how much more the outer end of a bough carries than the inner (the inner end sits under the whorl above)
          SNOW_HEIGHT_BIAS: 0.5, // how much more the top of the tree carries than the foot

          // Base dissolve.
          // The painted foliage ends at a straight horizontal line (botY), and on a wide card that line is the flat bottom edge of a cardboard cutout.
          // Erasing alpha up from the bottom breaks that line into whichever boughs were densest, so the card thins out into the snow instead of ending at an edge.
          // This is the painted edge only. Where the card enters the snow is a separate, geometric edge -- see CARD_BOW, which is what makes that one a curve.
          // Costs ~2% of tree height.
          BASE_FADE: 0.18, // fraction of canvas height over which alpha is ramped away from the bottom up

          // Size distribution.
          HEIGHT_MIN: 5.0,
          HEIGHT_MAX: 11.0, // shorter, stubbier (no skinny giants)
          ASPECT_MIN: 0.58,
          ASPECT_MAX: 0.95, // wide/stubby spruce .. moderate (no thin spires)

          // Shading and how the card is bedded into the slope.
          LIGHT_TINT: [0.92, 0.92, 0.94], // preserve the painted brightness (don't darken)
          BRIGHT_LIFT: 0.16, // brightness floor so no painted pixel reads black.
          // Added before the sun and ambient terms, not after, so the floor is itself scaled by them: the darkest a pixel can get is BRIGHT_LIFT * SHADE_MIN * AO_BASE * AO_CORE, about 0.07.
          // Dark, never inky.

          // Fake volume: the card is bowed but nowhere near a solid, and its shading normal need not follow the surface at all.
          // The normal must be a function of where the fragment is inside the tree, never of the surface it landed on -- anchoring it to the card's own facing makes the shading swing with the bow and with the billboard yaw, so the tree would change tone as the camera walks around it.
          // So it points radially outward from the tree's vertical axis, plus a constant upward bias for the conical droop.
          // Every fragment at a given place inside the tree derives the same normal regardless of where the surface actually is, so the canopy shades as one continuous cone.
          CANOPY_UP: 0.3, // upward bias in the radial normal. Higher = flatter/skyward shading, lower = harder sun-side/shade-side split.

          // Self-shadowing.
          // The painter shades each branch against its own underside but has no way to know that a branch near the trunk sits inside a whole tree's worth of canopy while a branch tip is open to the sky.
          // These two supply that larger-scale occlusion, and both read from local position rather than uv: uv runs along the card's arc, so it measures distance across the painting rather than distance from the trunk, and the two diverge as the bow deepens.
          AO_BASE: 0.75, // darkening at the foot of the tree (lit fraction at local y = 0)
          AO_CORE_WIDTH: 0.75, // how far the core darkening reaches, as a fraction of the tree's half-width, measured radially from the trunk axis (length(localPos.xz) * 2)
          AO_CORE: 0.88, // darkening at the trunk axis, fading out toward the branch tips.
          // Deliberately mild.
          // Its job is to seat the canopy interior, not to carve a stripe: too deep and it reads as a dark band down whichever card is face-on, which is the artifact it is meant to help remove.
          SHADE_MIN: 0.62, // multiplier on the fully sun-away side
          SHADE_MAX: 1.14, // ...and on the fully sun-facing side. Wrapped (half-lambert), so neither extreme is reached often.

          // ALPHA cutout.
          // With one billboard there is no near-edge-on card to hide, so the cutoff is a constant and opacity no longer depends on where you stand.
          CUT_BASE: 0.34, // alpha cutoff
          CUT_SOFT: 0.3, // alpha band above the cutoff handed to alpha-to-coverage as a soft edge.
          // Widens the band handed to alpha-to-coverage so MSAA dithers needle tips and whorl gaps into real translucency -- per-texel, which foliage has -- while still writing depth and needing no sorting.
          // .alphaTest stays 0.42 and feeds only the shadow depth pass, so the cast silhouette stays tight while the drawn tree is airier.

          // Idle wind, cheap and worth far more than it costs: everything else in this world moves, so a perfectly rigid tree reads as pasted-on scenery no matter how it is shaded.
          // Vertex-only and quadratic in height, so the base never leaves the snow and the collision cylinder stays honest.
          WIND_AMP: 0.015, // peak sway at the treetop as a fraction of tree height (~0.16 m on an 11 m spruce)
          WIND_CYCLES: 974, // whole sway cycles per WIND_T_WRAP -- an integer, so the clock wrap lands on an exact cycle boundary and no tree twitches when it resets
          WIND_DIR: { x: 0.82, z: 0.57 }, // the breeze blows one way for the whole forest (world space, normalized below)
          SINK_FACTOR: 1.0, // bury the full downhill drop across the card -> corner tucks under on any grade
          SINK_BASE: 0.4, // small constant sink so even small/flat-ground trees don't float

          // Card shape. The card is bowed toward its own front so that it is a surface rather than a plane, which is what lets it meet the snow along a curve and cast a footprint instead of a strip.
          CARD_COLS: 7, // columns across the bow. 2 is the old flat quad; the curve is visually converged well before this, and the cost is 12 triangles per tree either way.
          CARD_BOW: 0.3, // peak depth at the trunk, as a fraction of the card's full width. Raise until the base reads as curved and the card starts sorting correctly against passing objects; too far and the outer boughs turn away and the tree narrows.

          // Base dissolve, and the reason it is not a level gradient.
          // The painted foliage ends at a straight horizontal line, and a linear vertical ramp erased from it is constant across the card's width -- so the depth pass, which cuts that ramp at a single alpha, cuts it at a single canvas row.
          // That is the ruler-straight line the shadow shows on the snow: not the card's geometry, the threshold through a level ramp.
          // Erasing with soft elliptical dabs that fall short of the band by varying amounts gives a ragged level set, so any cutoff lands on a broken edge and the shadow reads as boughs meeting snow.
          BASE_DABS: 26, // erase dabs across the card's width. Fewer reads as scallops, more converges back on a straight line.
          BASE_DAB_JITTER: 0.45, // how far a dab may fall SHORT of the band, as a fraction of it. One-sided by design: the band top stays at BASE_FADE, so this can never expose the card's waterline. 0 reproduces the old level ramp.

          // Collision.
          TRUNK_RADIUS: 0.9, // collision radius at the trunk (scenery billboards are wide but I hit the trunk)
          CANOPY_FRAC: 0.85, // crown radius as a fraction of the card's half-width.
          // Under 1 because the painted silhouette does not reach the card's edge -- the outermost branch tips fall short of it, and a brush triggering in empty pixels would feel like hitting nothing.
          // This radius carries no physics; it only decides where snow gets knocked loose and where the branches are heard.
        },

        // Scattered medium boulders / snow chunks / ice blocks (SDF marching-cubes).
        // Same chunk-stream machinery as the forest; spawned beyond the fog and opacity-faded so they never pop.
        BOULDER: {
          // Shape library and LOD.
          NUM_SHAPES: 6, // baked SDF shapes (one-time marching-cubes bake at load)
          LOD_RES: [18, 8], // marching-cubes res: near (~400 tris) / far (~40 tris)
          LOD_DIST: 220, // near LOD holds out to 220m; swap happens far away in the haze

          // Scatter density and streaming.
          CELL: 110, // same density as the forest (one per cell)
          PER_CELL: 1,
          POOL: 80, // per (shape,lod) instance budget
          VIEW_RADIUS: 360, // spawn beyond the fog so they fade in, never pop

          // Size, seating and type mix.
          SIZE_MIN: 2.5,
          SIZE_MAX: 8.0, // medium (car-to-truck), skewed smaller
          SINK_FRAC: 0.26, // sink ~quarter into the snow so they sit, not float
          P_ROCK: 0.4,
          P_SNOW: 0.32, // rest (0.28) are ice

          // Collider fit.
          SDF_BASE_R: 1.05, // the carved SDF's base sphere radius (see createRockSDF: `- 1.05`).
          COLLIDER_FIT: 1.0, // collider size as a multiple of the carved mesh's mean radius.
          // At 1.0 the ellipsoid tracks the rock's average silhouette and (with the skier radius added) the skier's edge meets the real surface; lower = tighter (more contact with bulges), higher = looser (stops a touch sooner).

          // SDF carve params (sphere bitten by random cuts)
          MIN_NUM_CUTS: 14,
          MAX_NUM_CUTS: 22,
          MIN_CUT_RADIUS: 1.4,
          MAX_CUT_RADIUS: 2.5,
          MIN_CUT_RATIO: 0.6,
          MAX_CUT_RATIO: 0.85,
          MIN_CUT_K: 0.02,
          MAX_CUT_K: 0.08,

          // Per-shape non-uniform stretch.
          MIN_SHAPE_SCALE_X: 0.75,
          MAX_SHAPE_SCALE_X: 1.25,
          MIN_SHAPE_SCALE_Y: 0.6,
          MAX_SHAPE_SCALE_Y: 1.0,
          MIN_SHAPE_SCALE_Z: 0.75,
          MAX_SHAPE_SCALE_Z: 1.25,
        },

        // Obstacle collision (scenery trees + boulders).
        // Cheap broad-phase regenerated from cell seeds near the skier; distance + movement-cone culls before precise tests.
        COLLIDE: {
          // Broad phase.
          SKIER_RADIUS: 0.8, // skier's own collision radius
          REACH: 12, // metres around the skier to regenerate candidates (broad-phase)

          // Head-on vs glancing: which hits stop me and what a graze costs.
          TREE_HEADON_LAT: 0.28, // trees: only a near-dead-centre trunk hit stops me...
          BOULDER_HEADON_LAT: 0.62, // ...boulders are solid, so a wider central band stops me
          GLANCE_SPEED_KEEP: 0.78, // fraction of speed retained on a glancing (side) hit
          GLANCE_TURN: 0.1, // radians of heading nudge away from a glancing obstacle
          HEADON_TURN_ASSIST: 0.015, // tiny heading nudge away on head-on so I'm never fully pinned
          ASSIST_STEER_DB: 0.2, // if the player steers harder than this, the auto-unstick nudges below defer entirely -- the player owns the heading.
          ASSIST_LAT_DB: 0.2, // the head-on nudge only fires when the skier is off-centre by this many metres.
          // Dead-centre, headLat ~ 0 and its sign flipped frame-to-frame on float noise, whipping the heading (and the chase camera) back and forth.

          // Swept detection and contact resolution.
          SEPARATION: 0.06, // first-contact snap (swept): seat the skier just inside the surface
          SWEEP_ITERS: 3, // passes of sweep -> contact -> slide -> re-sweep within one frame.
          // 3 is the usual Quake-ish budget: it covers grazing a trunk and immediately meeting a second one, which is exactly what a treeline does.
          // Each extra pass is narrow-phase only, since the broad-phase gather is done once for the whole frame, so an uncontested frame still costs precisely one pass.
          MAX_CONTACTS: 4, // simultaneous contact planes the velocity is clipped against.
          // 2 is the case that matters (wedged between two trunks); 4 is headroom for a boulder field with no realistic way to exceed it.
          CONTACT_SLOP: 0.04, // allowed resting penetration (m).
          // The per-frame push-out corrects only the overlap beyond this and never shoves past the surface, so a head-on rest converges to a fixed depth instead of a shove-out / gravity-creep limit cycle.
          CONTACT_CORRECT: 0.8, // fraction of the excess overlap removed per frame; (1 - this) is the contact's convergence rate (0.8 -> settles in a few frames, then holds).

          // Mid-air hits.
          AIR_BOUNCE: 0.4, // mid-air obstacle hit: fraction of the into-surface speed returned as an outward knockback, so I peel off and fall clear instead of dead-stopping and sliding down the face with no traction to steer out of.
          // Airborne only.
          AIR_BOUNCE_MAX: 8, // cap on that knockback (m/s) so a fast hit can't fling me across the slope.
          AIR_KNOCK_DECAY: 0.28, // time constant (s) the knockback eases out over once airborne.

          // Impact sound gating.
          MIN_SOUND_KMH: 15, // collisions slower than this are always silent (anti-annoyance)
          CLEAR_FRAMES: 25, // must be free of all obstacles this many frames before a new hit can sound again

          // Branch brush -- skiing through a crown.
          // Feedback only, never physics, and gated far more gently than a real impact: a graze against a trunk is an event, whereas crossing foliage is scenery, and scenery that announces itself loudly becomes noise on a run through a treeline.
          BRUSH_MIN_SPEED: 3, // m/s below which pushing through branches is silent and dry

          // Normalised before anything reads it: the trunk cylinder occupies the middle of every crown, so raw depth tops out near 0.3 typical / 0.6 widest and would leave every downstream constant tuned against the bottom fifth of its range.
          BRUSH_DEPTH_REF: 0.55, // depth that counts as a full-strength brush; deeper is clamped
          BRUSH_SPEED_FLOOR: 0.45, // strength retained at walking pace, so a slow push through branches still registers

          BRUSH_MIN_SOUND: 0.22, // normalised strength under which only the spray fires, no whoosh
          BRUSH_VOL: 1.8, // strength -> SOUND.brush level.
          // Above 1 because brush strength peaks around 0.5 in practice (see BRUSH_DEPTH_REF) and SOUND.brush wants a 0..1 drive.
          // The clamp at the call site sets the floor, which is the part that decides whether a light brush is heard at all.
        },
      };

      // Frozen, recursively.
      // Tuning is read-only at runtime: anything genuinely dynamic lives in STATE.
      // This turns "do not mutate CONFIG" from a comment nobody can enforce into a TypeError in strict mode (modules are always strict), so the next person to reach for a config key as scratch space finds out immediately rather than three subsystems later.
      (function deepFreeze(o) {
        for (const k of Object.keys(o))
          if (o[k] && typeof o[k] === "object") deepFreeze(o[k]);
        return Object.freeze(o);
      })(CONFIG);

      // ============================================================================
      // Utilities
      // ============================================================================
      // Prevent iOS Safari double-tap zoom without interfering with joystick movement, multi-touch, or normal taps: only cancel the second tap of a rapid double-tap.
      let _lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const now = performance.now();
          if (now - _lastTouchEnd <= 300) e.preventDefault();
          _lastTouchEnd = now;
        },
        { passive: false },
      );

      // Everything in CONFIG that something writes at runtime.
      // CONFIG is frozen below, so this is not a convention -- a stray write to tuning is a TypeError, and the split is checked by the engine rather than by review.
      // camBack/camHeight are the player's framing (wheel, pinch, Ctrl-drag, restored setting); slopeGrade is resampled from the terrain each frame; fanHalfAngle is sized to the FOV.
      // Diagnostics.
      // This simulation is full of tripwires that keep the frame alive when something is wrong: clamps, validity flags, swallowed storage errors.
      // That is the right behaviour -- a ski run should not stop because localStorage is disabled -- but a failure nothing can observe is a bug that survives to the next release.
      // Every one of them reports here.
      // Off unless ?dev is in the URL, so the shipping cost is one boolean test, and deduped by id so a per-frame tripwire cannot flood the console.
      const DEV = /[?&]dev\b/.test(location.search);
      const _warned = new Set();
      const warnOnce = (id, msg) => {
        if (!DEV || _warned.has(id)) return;
        _warned.add(id);
        console.warn(`[ski] ${id}: ${msg}`);
      };

      // Per-subsystem frame cost, exponentially smoothed, shown in the TAB stats.
      // DC and tri say how much was drawn; they say nothing about which system ate the frame.
      // Four performance.now() calls a frame is not measurable against the work between them.
      const PERF = { frame: 0, sim: 0, view: 0, draw: 0, gpu: -1 };
      const perfBlend = (k, ms) => (PERF[k] += (ms - PERF[k]) * 0.1);

      // GPU time, via EXT_disjoint_timer_query_webgl2.
      //
      // CPU timers cannot see this.
      // render() returns as soon as the commands are submitted, so "draw" is submit cost only -- on a fragment-bound frame it reads near zero while the GPU is the entire budget.
      // Without a query the gap between draw and frame is ambiguous: it could be GPU work or it could be the browser waiting for vsync, and those call for opposite responses.
      //
      // Results arrive asynchronously, several frames late, so queries are kept in a ring and harvested when they become available.
      // The extension is absent in many browsers (it leaks timing, so it is gated); GPU then reads "n/a" rather than lying with a zero.
      const GpuTimer = (() => {
        let gl = null,
          ext = null,
          active = null,
          last = -1;
        const pool = [],
          inFlight = [];
        return {
          attach(renderer) {
            gl = renderer.getContext();
            ext = gl.getExtension("EXT_disjoint_timer_query_webgl2");
            // Which physical GPU is executing these commands: on a multi-adapter machine the browser picks per window, so the same scene can be served by different chips on different monitors.
            // Logged rather than shown -- it answers a question once and then never changes.
            const dbg = gl.getExtension("WEBGL_debug_renderer_info");
            if (DEV)
              console.log(
                "[ski] adapter:",
                dbg
                  ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
                  : gl.getParameter(gl.RENDERER),
              );
            if (!ext)
              warnOnce(
                "gpu.timer",
                "EXT_disjoint_timer_query_webgl2 unavailable; GPU time will read n/a",
              );
          },
          begin() {
            if (!ext || active) return;
            const q = pool.pop() || gl.createQuery();
            gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
            active = q;
          },
          end() {
            if (!ext || !active) return;
            gl.endQuery(ext.TIME_ELAPSED_EXT);
            inFlight.push(active);
            active = null;
            // A driver that never returns results must not grow this without bound.
            if (inFlight.length > 8) pool.push(inFlight.shift());
          },
          poll() {
            if (!ext) return -1;
            // A disjoint means the GPU clock was interrupted (power state, context switch) and every outstanding result is garbage, not merely late.
            if (gl.getParameter(ext.GPU_DISJOINT_EXT)) {
              while (inFlight.length) pool.push(inFlight.pop());
              return last;
            }
            while (
              inFlight.length &&
              gl.getQueryParameter(inFlight[0], gl.QUERY_RESULT_AVAILABLE)
            ) {
              const q = inFlight.shift();
              last = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6; // ns -> ms
              pool.push(q);
            }
            return last;
          },
        };
      })();

      const STATE = {
        camBack: 7.0, // metres behind the skier
        camHeight: 1.4, // metres above

        // The third-person framing to return to when first person is left.
        // Seeded to the defaults above so the very first exit has somewhere to land, then tracked by saveCameraFraming whenever back is outside first person.
        thirdBack: 7.0,
        thirdHeight: 1.4,
        slopeGrade: 0.3, // seed; sampleGradeTarget overwrites it every frame
        fanHalfAngle: 0.6, // seed; _sizeFanForFOV overwrites it on resize
      };

      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

      // Planar length.
      // Use this, not Math.hypot: hypot is variadic and does overflow-safe scaling, which costs ~2.7x here and protects against a magnitude range this simulation does not have, since every vector it measures is metres of terrain or pixels of input.
      // Measured as a free abstraction -- within 4% of writing the sqrt inline -- so the call is not a trade against clarity.
      const len2 = (x, z) => Math.sqrt(x * x + z * z);

      // One key, one JSON object: scattered flat keys cannot be inspected, versioned or cleared as a unit.
      // Writes are debounced because everything here is driven by a continuous gesture and setItem is synchronous.
      // Nothing throws -- storage is unavailable in private mode and can be over quota, neither of which is a reason to stop rendering.
      const Store = (() => {
        const KEY = "versant_settings";
        const VERSION = 1;
        const QUIET_MS = 500; // silence after the last change before a write lands
        let data = {};
        let timer = 0;

        const write = () => {
          if (timer) {
            clearTimeout(timer);
            timer = 0;
          }
          try {
            localStorage.setItem(
              KEY,
              JSON.stringify(Object.assign({ v: VERSION }, data)),
            );
          } catch (e) {
            // Unavailable, disabled, or over quota.
            // Settings simply don't persist.
            warnOnce(
              "store.write",
              "settings could not be saved: " + e.message,
            );
          }
        };

        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            // A version bump means the shape changed; drop the old blob rather than half-reading it.
            // Cheap, because none of this is precious data.
            if (parsed && typeof parsed === "object" && parsed.v === VERSION) {
              data = parsed;
              delete data.v;
            }
          }
        } catch (e) {
          data = {};
          warnOnce("store.read", "settings could not be read: " + e.message);
        }

        return {
          get(k, fallback) {
            const v = data[k];
            return v === undefined ? fallback : v;
          },
          // Numeric read that refuses to trust what it finds.
          // This is user-editable text on disk, and these values feed the live camera every frame, so a truncated write or a hand-edit would otherwise be a NaN camera with no visible cause.
          // Out-of-range is clamped, non-numeric falls back.
          num(k, fallback, lo, hi) {
            const v = data[k];
            return typeof v === "number" && Number.isFinite(v)
              ? clamp(v, lo, hi)
              : fallback;
          },
          set(k, v) {
            // Mid-gesture the value is very often unchanged (a wheel spun into its clamp, a drag with no movement).
            // Bailing here stops those from re-arming the timer forever and starving the write.
            if (data[k] === v) return;
            data[k] = v;
            if (timer) clearTimeout(timer);
            timer = setTimeout(write, QUIET_MS);
          },
          // For discrete changes (a toggle), where there is no gesture to wait out.
          flush: write,
        };
      })();

      // The tab can go away mid-gesture, with a debounced write still armed.
      // pagehide + visibilitychange are the pair that actually fire on mobile; beforeunload does not reliably.
      addEventListener("pagehide", () => Store.flush());
      addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") Store.flush();
      });

      // Camera framing is mutated from three separate gesture handlers -- wheel, pinch, and Ctrl-drag in both its locked and unlocked forms -- so the persist lives here rather than being duplicated at each site.
      // Kept as a hook rather than a direct call so the persistence layer stays ignorant of the DOM: it is reached from module init, long before any button is wired.
      let _onCameraFramingChanged = null;

      // The framing to come back to when first person is left.
      // Recorded here rather than at the toggle, because first person is also reachable by scrolling or pinching past the threshold, and leaving by the button then has to restore what the player last chose rather than a default.
      // Persisted, so a reload while in first person still remembers the framing instead of dropping the player at CONFIG's default.
      const saveCameraFraming = () => {
        const C = CONFIG.CAMERA;
        Store.set("camBack", STATE.camBack);
        Store.set("camHeight", STATE.camHeight);
        if (STATE.camBack > C.FPS_AT) {
          STATE.thirdBack = STATE.camBack;
          STATE.thirdHeight = STATE.camHeight;
          Store.set("thirdBack", STATE.thirdBack);
          Store.set("thirdHeight", STATE.thirdHeight);
        }
        if (_onCameraFramingChanged) _onCameraFramingChanged();

        // Every framing gesture routes through here -- wheel, pinch, Ctrl-drag and the first/third-person toggle -- so this is the one place that knows the view changed.
        // Only while parked -- paused, or still behind the splash. When the loop is turning it redraws on the next frame anyway, and a second render would be pure waste at gesture rate.
        if (GAME && (!_loopRunning || GAME.paused)) GAME.refreshFraming();
      };

      // Blend factor for `x += (target - x) * expK(rate, dt)`.
      // Use this, not `min(1, rate*dt)`: the linear form is only its first Taylor term and is not frame-rate independent, so N steps of dt/N differ from one step of dt and a 144 Hz machine converges faster than a 60 Hz one.
      // `rate` is 1/tau, the same number the linear form took, so existing tunings carry over.
      const expK = (rate, dt) => 1 - Math.exp(-rate * dt);

      // Positive modulo: maps any float64 value into [0, period).
      // (`x % p` alone can return a negative remainder; this never does.)
      const pmod = (x, period) => ((x % period) + period) % period;

      // Sun geometry reduced to the two scalars the shadow projection needs, both constant.
      // SUN_TAN_ELEVATION is how fast a shadow ray descends per horizontal metre; SUN_FALL_ALIGN is how much of the fall line lies along the shadow's direction, which decides whether a slope lengthens or shortens what it catches.
      const SUN_TAN_ELEVATION = (() => {
        const d = CONFIG.SKY.SUN_DIR;
        return d.y / Math.hypot(d.x, d.z);
      })();
      const SUN_FALL_ALIGN = (() => {
        const d = CONFIG.SKY.SUN_DIR,
          h = Math.hypot(d.x, d.z);
        // Shadows travel away from the sun; a positive value means they run up-slope and shorten as the pitch steepens.
        return -(
          (-d.x / h) * CONFIG.SLOPE.DIR_X +
          (-d.z / h) * CONFIG.SLOPE.DIR_Z
        );
      })();

      // The two horizontal axes the shadow projection is built on, both constant.
      // SUN_AWAY_XZ is the direction a shadow travels; SUN_RIGHT_XZ is its perpendicular, and it is the card's own local +X carried through TREE_SUN_YAW, so the texture lies across the shadow the same way it lies across the tree.
      const SUN_DIR_N = new Vector3(
        CONFIG.SKY.SUN_DIR.x,
        CONFIG.SKY.SUN_DIR.y,
        CONFIG.SKY.SUN_DIR.z,
      ).normalize();

      const SUN_AWAY_XZ = (() => {
        const d = CONFIG.SKY.SUN_DIR,
          h = Math.hypot(d.x, d.z);
        return new Vector2(-d.x / h, -d.z / h);
      })();
      const SUN_RIGHT_XZ = (() => {
        const d = CONFIG.SKY.SUN_DIR,
          h = Math.hypot(d.x, d.z);
        return new Vector2(d.z / h, -d.x / h);
      })();

      // Angle into [-PI, PI).
      // For accumulators that only ever feed sin/cos or a Euler: a 2*PI shift is the identity, so wrapping is free and keeps the value bounded for any session length.
      const wrapPi = (a) => pmod(a + Math.PI, 2 * Math.PI) - Math.PI;
      const isTouchOnly = () =>
        ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
        !matchMedia("(pointer:fine)").matches;
      const assetURL = (p) =>
        /^(https?:)?\/\//i.test(p) ? p : CONFIG.ASSET_BASE + p;

      function toggleFullscreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(
            document,
          );
        }
      }

      // Renderer-counter block for the expanded stats panel.
      // One definition shared by the splash one-shot (TAB before the loop runs) and the live loop -- the format string and the counters it reads can never drift apart between the two call sites.
      function formatRendererStats(renderer) {
        const fmtN = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : "" + n);
        const r = renderer.info.render,
          m = renderer.info.memory;
        const prg = renderer.info.programs?.length || 0;
        const ms = (v) => v.toFixed(1);
        // Frame is the budget; sim+VIEW+draw is the CPU inside it; GPU is the parallel cost of the same submit.
        // Frame minus max(CPU, GPU) is vsync wait -- i.e. headroom.
        const gpu = PERF.gpu >= 0 ? `${ms(PERF.gpu)}ms` : "n/a";
        // Device pixels, not CSS pixels: this is the number the fragment cost scales with, and it is the only way to tell "the other monitor is slower" from "the window is bigger".
        // The adapter string is trimmed to the part that identifies the chip.
        const gl = renderer.getContext();
        const px = `${gl.drawingBufferWidth}x${gl.drawingBufferHeight}`;
        const mpx = (gl.drawingBufferWidth * gl.drawingBufferHeight) / 1e6;
        return (
          `\nDC: ${fmtN(r.calls)}\nTRI: ${fmtN(r.triangles)}` +
          `\nGEO: ${m.geometries}\nTEX: ${m.textures}\nPRG: ${prg}` +
          `\nRES: ${px}\nMPX: ${mpx.toFixed(1)}\nDPR: ${renderer.getPixelRatio().toFixed(2)}` +
          `\nFRAME: ${ms(PERF.frame)}ms` +
          `\nSIM: ${ms(PERF.sim)}ms\nVIEW: ${ms(PERF.view)}ms\nDRAW: ${ms(PERF.draw)}ms` +
          `\nGPU: ${gpu}`
        );
      }

      // ============================================================================
      // Infinite periodic Perlin.
      // The CPU and GLSL twins agree to float32, not bit-for-bit: JS is float64 and that gap is unclosable.
      // Same expression on both sides -- identical hash, gradient table and Horner lerps -- so the residual is pure float32 rounding, ~1e-4 m at render scale.
      // Both halves are tested: _terrainSelfTest() locks the CPU expression against goldens, _terrainGpuTest() renders the GLSL one and reads it back.
      // ============================================================================
      function _hash11(a) {
        a = a | 0;
        a = a ^ (a >>> 16);
        a = Math.imul(a, 0x7feb352d);
        a = a ^ (a >>> 15);
        a = Math.imul(a, 0x846ca68b);
        a = a ^ (a >>> 16);
        return a >>> 0;
      }
      function _hash22(x, y) {
        return _hash11((_hash11(x >>> 0) + (y >>> 0)) >>> 0);
      }
      function _perlinGradDot(gx, gy, ox, oy) {
        const h = _hash22(gx, gy) & 7;
        let vx, vy;
        switch (h) {
          case 0:
            vx = 1;
            vy = 1;
            break;
          case 1:
            vx = -1;
            vy = 1;
            break;
          case 2:
            vx = 1;
            vy = -1;
            break;
          case 3:
            vx = -1;
            vy = -1;
            break;
          case 4:
            vx = 1;
            vy = 0;
            break;
          case 5:
            vx = -1;
            vy = 0;
            break;
          case 6:
            vx = 0;
            vy = 1;
            break;
          default:
            vx = 0;
            vy = -1;
            break;
        }
        return vx * ox + vy * oy;
      }
      function _periodicPerlin(x, y, P) {
        const xi = Math.floor(x),
          yi = Math.floor(y);
        const xf = x - xi,
          yf = y - yi;
        // P is a power of two (256) and 256 divides 2^32, so `& (P-1)` equals the positive modulo for every integer up to 2^53, including 1-AU-scale coords, but is a single op instead of two float divisions.
        // This is the engine's hottest leaf: 3 calls per sampleTerrain, hundreds of sampleTerrain per frame.
        const mask = P - 1;
        const px = xi & mask,
          px1 = (xi + 1) & mask;
        const py = yi & mask,
          py1 = (yi + 1) & mask;
        const d00 = _perlinGradDot(px, py, xf, yf);
        const d10 = _perlinGradDot(px1, py, xf - 1.0, yf);
        const d01 = _perlinGradDot(px, py1, xf, yf - 1.0);
        const d11 = _perlinGradDot(px1, py1, xf - 1.0, yf - 1.0);
        const ux = xf * xf * (3 - 2 * xf);
        const uy = yf * yf * (3 - 2 * yf);
        const mx0 = d00 + ux * (d10 - d00);
        const mx1 = d01 + ux * (d11 - d01);
        return (mx0 + uy * (mx1 - mx0)) * PERLIN_NORM;
      }

      const TERRAIN_PERIOD_A = 256;
      const TERRAIN_PERIOD_B = 256;
      const TERRAIN_PERIOD_AMP = 256;
      const INV_SCALE_A = 1 / CONFIG.TERRAIN.OCTAVE_A_SCALE;
      const INV_SCALE_B = 1 / CONFIG.TERRAIN.OCTAVE_B_SCALE;
      const INV_SCALE_AMP = 1 / CONFIG.TERRAIN.OCTAVE_A_AMP_SCALE;

      // Amplitude constants are fixed at load; hoist them out of the hot leaf so sampleTerrain/terrainAmpA don't re-read CONFIG.TERRAIN on every one of the ~hundreds of calls per frame.
      const OCT_A_AMP_MIN = CONFIG.TERRAIN.OCTAVE_A_AMP_MIN;
      const OCT_A_AMP_SPAN =
        CONFIG.TERRAIN.OCTAVE_A_AMP_MAX - CONFIG.TERRAIN.OCTAVE_A_AMP_MIN;
      const OCT_B_AMP = CONFIG.TERRAIN.OCTAVE_B_AMP;
      const PERLIN_NORM = 1.41421356;
      const PERLIN_NORM_GLSL = "1.41421356";

      // Albedo pattern frequencies (cycles per metre).
      // World-anchored via dedicated wrap offsets so the snow shading scrolls past me in world space.
      const ALB_PATCH_FREQ = 0.045; // ~22 m blotches
      const ALB_GRAIN_FREQ = 1.1; // ~1 m grain

      // Pure terrain height (no slope ramp).
      // Slope is added separately to the pose.
      // Octave A's amplitude is driven by a slow world-anchored envelope (terrainAmpA) so mogul size varies by region; octave B (broad rolls) stays fixed.
      // Twin of terrainHeight() in TERRAIN_GLSL.
      function terrainAmpA(x, z) {
        const e =
          0.5 +
          0.5 *
            _periodicPerlin(
              x * INV_SCALE_AMP,
              z * INV_SCALE_AMP,
              TERRAIN_PERIOD_AMP,
            );
        return OCT_A_AMP_MIN + OCT_A_AMP_SPAN * e;
      }
      function sampleTerrain(x, z) {
        return (
          terrainAmpA(x, z) *
            _periodicPerlin(
              x * INV_SCALE_A,
              z * INV_SCALE_A,
              TERRAIN_PERIOD_A,
            ) +
          OCT_B_AMP *
            _periodicPerlin(x * INV_SCALE_B, z * INV_SCALE_B, TERRAIN_PERIOD_B)
        );
      }

      // Fall-line slope offset for a point at world-offset (dx,dz) from the player.
      // Pivoted on the player (offset = 0 -> 0), so the player is always on the noise surface and the numbers stay tiny/precise regardless of how far the run has descended.
      function slopeOffset(dx, dz) {
        const S = CONFIG.SLOPE;
        return -STATE.slopeGrade * (dx * S.DIR_X + dz * S.DIR_Z);
      }

      // Shared by both halves of the twin check, so they can't end up proving things about different points.
      const TERRAIN_GOLDENS = [
        [0, 0, 0.0],
        [123.5, -77.25, -1.2697797408],
        [149597870700, -3200000, -2.212893559], // ~1 AU: proves the bitmask wrap still matches
      ];

      // Half one: the CPU expression, pinned to goldens so an accidental edit to the perlin, height or amplitude code warns at boot instead of silently moving the ground under the skier.
      // This compares JS to constants and says nothing about the GLSL twin that draws the visible snow; that half is _terrainGpuTest().
      function _terrainSelfTest() {
        for (const [x, z, expected] of TERRAIN_GOLDENS) {
          const got = sampleTerrain(x, z);
          if (Math.abs(got - expected) > 1e-6) {
            console.warn(
              `[terrain twin] CPU sampleTerrain(${x}, ${z}) = ${got.toFixed(10)}, expected ${expected}. ` +
                `If you changed terrain math on purpose: update the GLSL terrainHeight() to match, then refresh these goldens.`,
            );
          }
        }
      }
      try {
        _terrainSelfTest();
      } catch (e) {
        /* diagnostic only; never affects the game */
      }

      // Half two: the GPU expression.
      // Compiles the same TERRAIN_GLSL the ground fan uses, evaluates terrainHeight() at the goldens and reads it back.
      // Nothing else compares the drawn surface to the simulated one, and divergence doesn't error -- the skier just hovers or sinks.
      // Fed the wrapped coords updateNoiseWrap() sends at runtime, since the GPU never sees the raw 1-AU value and testing unwrapped would test a path the renderer never takes.
      // Tolerance is float32 epsilon at these magnitudes; a real divergence misses by whole metres.
      const TERRAIN_TWIN_TOL = 2e-3; // metres
      function _terrainGpuTest(renderer) {
        // Extension only -- do not also test capabilities.isWebGL2: three dropped that flag when it went WebGL2-only, so it reads undefined and this would skip everywhere.
        const canFloat = renderer.extensions.has("EXT_color_buffer_float");
        if (!canFloat) {
          console.info(
            "[terrain twin] GPU check skipped: no float render target on this device. The CPU golden check still ran.",
          );
          return;
        }

        const T = CONFIG.TERRAIN;
        let rt = null,
          mat = null,
          geo = null;
        try {
          rt = new WebGLRenderTarget(1, 1, {
            type: FloatType,
            minFilter: NearestFilter,
            magFilter: NearestFilter,
            depthBuffer: false,
            stencilBuffer: false,
          });
          mat = new ShaderMaterial({
            uniforms: {
              uA: { value: new Vector2() },
              uB: { value: new Vector2() },
              uAmp: { value: new Vector2() },
            },
            vertexShader: `
              void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
            `,
            fragmentShader: `
              precision highp float;
              precision highp int;
              uniform vec2 uA, uB, uAmp;
              ${TERRAIN_GLSL}
              void main() {
                gl_FragColor = vec4(terrainHeight(uA, uB, uAmp), 0.0, 0.0, 1.0);
              }
            `,
          });
          geo = new PlaneGeometry(2, 2);
          const quad = new Mesh(geo, mat);
          quad.frustumCulled = false;
          const scene = new Scene();
          scene.add(quad);
          const cam = new OrthographicCamera(-1, 1, 1, -1, 0, 1);

          const prevTarget = renderer.getRenderTarget();
          const px = new Float32Array(4);
          let worst = 0,
            worstPt = null;

          for (const [x, z, expected] of TERRAIN_GOLDENS) {
            // Exactly the reduction updateNoiseWrap() performs, in float64, before anything crosses to the GPU.
            mat.uniforms.uA.value.set(
              pmod(x / T.OCTAVE_A_SCALE, TERRAIN_PERIOD_A),
              pmod(z / T.OCTAVE_A_SCALE, TERRAIN_PERIOD_A),
            );
            mat.uniforms.uB.value.set(
              pmod(x / T.OCTAVE_B_SCALE, TERRAIN_PERIOD_B),
              pmod(z / T.OCTAVE_B_SCALE, TERRAIN_PERIOD_B),
            );
            mat.uniforms.uAmp.value.set(
              pmod(x / T.OCTAVE_A_AMP_SCALE, TERRAIN_PERIOD_AMP),
              pmod(z / T.OCTAVE_A_AMP_SCALE, TERRAIN_PERIOD_AMP),
            );

            renderer.setRenderTarget(rt);
            renderer.render(scene, cam);
            renderer.readRenderTargetPixels(rt, 0, 0, 1, 1, px);

            const err = Math.abs(px[0] - expected);
            if (err > worst) {
              worst = err;
              worstPt = [x, z, px[0], expected];
            }
          }
          renderer.setRenderTarget(prevTarget);

          if (worst > TERRAIN_TWIN_TOL) {
            const [x, z, got, exp] = worstPt;
            console.warn(
              `[terrain twin] GPU terrainHeight(${x}, ${z}) = ${got.toFixed(6)}, CPU says ${exp} ` +
                `(off by ${worst.toFixed(6)} m, tolerance ${TERRAIN_TWIN_TOL}). ` +
                `The drawn snow and the simulated snow have diverged -- the skier will float or sink. ` +
                `Reconcile TERRAIN_GLSL's terrainHeight() with sampleTerrain(), then refresh TERRAIN_GOLDENS.`,
            );
          } else {
            console.info(
              `[terrain twin] CPU/GPU agree to ${worst.toExponential(1)} m.`,
            );
          }
        } catch (e) {
          console.info("[terrain twin] GPU check could not run:", e?.message);
        } finally {
          rt?.dispose();
          mat?.dispose();
          geo?.dispose();
        }
      }

      // Slow noise field that drives how steep the run is right now.
      // Sampled at the player's wrapped world position so it's bounded & smooth over long distances.
      function sampleGradeTarget(x, z) {
        const S = CONFIG.SLOPE;
        const inv = 1 / S.GRADE_NOISE_SCALE;
        const n = _periodicPerlin(x * inv, z * inv, TERRAIN_PERIOD_A); // ~[-1,1]
        const t = n * 0.5 + 0.5;
        return S.GRADE_MIN + (S.GRADE_MAX - S.GRADE_MIN) * t;
      }

      const TERRAIN_GLSL = /* glsl */ `
        uint hash11_t(uint a) {
          a ^= a >> 16u; a *= 0x7feb352du;
          a ^= a >> 15u; a *= 0x846ca68bu;
          a ^= a >> 16u; return a;
        }
        uint hash22_t(uint x, uint y) { return hash11_t(hash11_t(x) + y); }
        float gradDot_t(uint hx, uint hy, float ox, float oy) {
          uint h = hash22_t(hx, hy) & 7u;
          float gx, gy;
          if      (h == 0u) { gx =  1.0; gy =  1.0; }
          else if (h == 1u) { gx = -1.0; gy =  1.0; }
          else if (h == 2u) { gx =  1.0; gy = -1.0; }
          else if (h == 3u) { gx = -1.0; gy = -1.0; }
          else if (h == 4u) { gx =  1.0; gy =  0.0; }
          else if (h == 5u) { gx = -1.0; gy =  0.0; }
          else if (h == 6u) { gx =  0.0; gy =  1.0; }
          else              { gx =  0.0; gy = -1.0; }
          return gx * ox + gy * oy;
        }
        float periodicPerlin_t(vec2 v, float P) {
          float xi = floor(v.x), yi = floor(v.y);
          float xf = v.x - xi, yf = v.y - yi;
          float px  = mod(xi,       P);
          float px1 = mod(xi + 1.0, P);
          float py  = mod(yi,       P);
          float py1 = mod(yi + 1.0, P);
          float d00 = gradDot_t(uint(px),  uint(py),  xf,       yf      );
          float d10 = gradDot_t(uint(px1), uint(py),  xf - 1.0, yf      );
          float d01 = gradDot_t(uint(px),  uint(py1), xf,       yf - 1.0);
          float d11 = gradDot_t(uint(px1), uint(py1), xf - 1.0, yf - 1.0);
          float ux = xf * xf * (3.0 - 2.0 * xf);
          float uy = yf * yf * (3.0 - 2.0 * yf);
          // Horner, not mix(): mix() is a*(1-t)+b*t, a different float expression the compiler may contract to an FMA.
          // The JS twin uses this form, so this must too.
          float mx0 = d00 + ux * (d10 - d00);
          float mx1 = d01 + ux * (d11 - d01);
          return (mx0 + uy * (mx1 - mx0)) * ${PERLIN_NORM_GLSL};
        }
        float terrainHeight(vec2 sampleA, vec2 sampleB, vec2 sampleAmp) {
          // Octave A amplitude swept by the slow envelope octave (twin of JS terrainAmpA).
          float e = 0.5 + 0.5 * periodicPerlin_t(sampleAmp, ${TERRAIN_PERIOD_AMP.toFixed(1)});
          float ampA = ${CONFIG.TERRAIN.OCTAVE_A_AMP_MIN.toFixed(4)} +
                       (${CONFIG.TERRAIN.OCTAVE_A_AMP_MAX.toFixed(4)} - ${CONFIG.TERRAIN.OCTAVE_A_AMP_MIN.toFixed(4)}) * e;
          return ampA * periodicPerlin_t(sampleA, ${TERRAIN_PERIOD_A.toFixed(1)}) +
                 ${CONFIG.TERRAIN.OCTAVE_B_AMP.toFixed(4)} *
                   periodicPerlin_t(sampleB, ${TERRAIN_PERIOD_B.toFixed(1)});
        }
      `;

      // ============================================================================
      // FAN geometry
      // ============================================================================
      function makeFanGeometry() {
        const F = CONFIG.FAN;
        const rings = F.RINGS,
          halfAngle = STATE.fanHalfAngle;
        const innerR = F.INNER_RADIUS,
          outerR = F.RADIUS,
          ramp = F.RAMP_EXP;
        const mainSweep = 2 * halfAngle;
        const sectors = Math.max(
          F.SECTORS_MIN,
          Math.min(F.SECTORS_MAX, Math.round(F.SECTOR_DENSITY * mainSweep)),
        );
        const totalVerts = rings * sectors;
        const positions = new Float32Array(totalVerts * 3);

        // Flat up-normals.
        // The fragment shader derives the true shading normal from the terrain height field, so these never affect lighting -- they exist only so the shadow receiver's normalBias has a surface direction to offset the depth sample along (no acne on the snow).
        const normals = new Float32Array(totalVerts * 3);
        for (let i = 0; i < rings; i++) {
          const t = i / (rings - 1);
          const r = innerR + (outerR - innerR) * Math.pow(t, ramp);
          for (let j = 0; j < sectors; j++) {
            const u = j / (sectors - 1);
            const theta = -halfAngle + mainSweep * u;
            const idx = (i * sectors + j) * 3;
            positions[idx + 0] = r * Math.sin(theta);
            positions[idx + 1] = 0;
            positions[idx + 2] = -r * Math.cos(theta);
            normals[idx + 1] = 1; // (0,1,0)
          }
        }
        const indices = [];
        for (let i = 0; i < rings - 1; i++) {
          for (let j = 0; j < sectors - 1; j++) {
            const a = i * sectors + j;
            const b = i * sectors + (j + 1);
            const c = (i + 1) * sectors + j;
            const d = (i + 1) * sectors + (j + 1);
            indices.push(a, c, b);
            indices.push(b, c, d);
          }
        }
        const geo = new BufferGeometry();
        geo.setAttribute("position", new BufferAttribute(positions, 3));
        geo.setAttribute("normal", new BufferAttribute(normals, 3));
        geo.setIndex(indices);
        return geo;
      }

      // ============================================================================
      // Ground FAN -- winter snow terrain + downhill slope ramp
      // ============================================================================
      class GroundFan extends Mesh {
        constructor() {
          const geo = makeFanGeometry();
          const mat = new MeshStandardMaterial({
            side: BackSide,
            roughness: 0.92,
            metalness: 0.0,
            color: 0xffffff,
            emissive: 0x010101,
            emissiveIntensity: 1.0,
          });
          mat.userData.uNoiseWrapA = { value: new Vector2(0, 0) };
          mat.userData.uNoiseWrapB = { value: new Vector2(0, 0) };
          mat.userData.uNoiseWrapAmp = { value: new Vector2(0, 0) };
          mat.userData.uSlope = { value: STATE.slopeGrade };

          // World fall-line direction (constant) and the small fan-centre-minus-player offset (updated each frame).
          // Together these make the slope tilt toward a fixed world direction while keeping every number tiny.
          mat.userData.uFallDir = {
            value: new Vector2(CONFIG.SLOPE.DIR_X, CONFIG.SLOPE.DIR_Z),
          };
          mat.userData.uFanMinusPlayer = { value: new Vector2(0, 0) };
          mat.userData.uAlbWrapPatch = { value: new Vector2(0, 0) };
          mat.userData.uAlbWrapGrain = { value: new Vector2(0, 0) };
          mat.userData.uSnow = { value: new Color(0xfcfdff) }; // lit snow: clean near-white
          mat.userData.uSnowShadow = { value: new Color(0xe8edf4) }; // hollows: only slightly dimmer & cool
          mat.userData.uRock = { value: new Color(0x6d7682) };
          mat.userData.uSunDirV = { value: new Vector3() }; // sun dir in VIEW space (set per frame)
          mat.userData.uTime = { value: 0 };
          mat.userData.uSparkleWrap = { value: new Vector2(0, 0) };

          mat.onBeforeCompile = (shader) => {
            shader.uniforms.uNoiseWrapA = mat.userData.uNoiseWrapA;
            shader.uniforms.uNoiseWrapB = mat.userData.uNoiseWrapB;
            shader.uniforms.uNoiseWrapAmp = mat.userData.uNoiseWrapAmp;
            shader.uniforms.uSlope = mat.userData.uSlope;
            shader.uniforms.uFallDir = mat.userData.uFallDir;
            shader.uniforms.uFanMinusPlayer = mat.userData.uFanMinusPlayer;
            shader.uniforms.uAlbWrapPatch = mat.userData.uAlbWrapPatch;
            shader.uniforms.uAlbWrapGrain = mat.userData.uAlbWrapGrain;
            shader.uniforms.uSnow = mat.userData.uSnow;
            shader.uniforms.uSnowShadow = mat.userData.uSnowShadow;
            shader.uniforms.uRock = mat.userData.uRock;
            shader.uniforms.uSunDirV = mat.userData.uSunDirV;
            shader.uniforms.uTime = mat.userData.uTime;
            shader.uniforms.uSparkleWrap = mat.userData.uSparkleWrap;

            shader.vertexShader = shader.vertexShader
              .replace(
                "void main() {",
                /* glsl */ `
                ${TERRAIN_GLSL}
                uniform vec2 uNoiseWrapA;
                uniform vec2 uNoiseWrapB;
                uniform float uSlope;
                uniform vec2 uFallDir;
                uniform vec2 uFanMinusPlayer;
                varying vec2 vRelXZ;
                varying float vTerrainDist;
                varying mat3 vViewRot;
                uniform vec2 uNoiseWrapAmp;
                float _terrainAt(vec2 relXZ) {
                  vec2 sA = relXZ * ${INV_SCALE_A.toFixed(8)} + uNoiseWrapA;
                  vec2 sB = relXZ * ${INV_SCALE_B.toFixed(8)} + uNoiseWrapB;
                  vec2 sAmp = relXZ * ${INV_SCALE_AMP.toFixed(8)} + uNoiseWrapAmp;
                  return terrainHeight(sA, sB, sAmp);
                }
                void main() {
              `,
              )
              .replace(
                "#include <begin_vertex>",
                /* glsl */ `
                vec3 _relPos = mat3(modelMatrix) * position;
                vRelXZ = _relPos.xz;
                float _h = _terrainAt(vRelXZ);
                // Fall-line ramp: drop height along the fixed world downhill direction.
                // The offset-from-player is the world-aligned vertex offset (_relPos.xz) plus the small fan-centre-to-player delta.
                // All bounded by the fan radius, so this stays float32-clean no matter how far the run has descended.
                vec2 _offFromPlayer = _relPos.xz + uFanMinusPlayer;
                _h += -uSlope * dot(_offFromPlayer, uFallDir);
                vec3 transformed = vec3(position.x, _h, position.z);
              `,
              )
              .replace(
                "#include <project_vertex>",
                /* glsl */ `
                #include <project_vertex>
                vTerrainDist = length(mvPosition.xyz);
                vViewRot = mat3(viewMatrix);
              `,
              );

            shader.fragmentShader = shader.fragmentShader
              .replace(
                "void main() {",
                /* glsl */ `
                ${TERRAIN_GLSL}
                uniform vec2 uNoiseWrapA;
                uniform vec2 uNoiseWrapB;
                uniform float uSlope;
                uniform vec2 uFallDir;
                uniform vec2 uAlbWrapPatch;
                uniform vec2 uAlbWrapGrain;
                uniform vec3 uSnow;
                uniform vec3 uSnowShadow;
                uniform vec3 uRock;
                uniform vec3 uSunDirV;
                uniform float uTime;
                uniform vec2 uSparkleWrap;
                varying vec2 vRelXZ;
                varying float vTerrainDist;
                varying mat3 vViewRot;
                uniform vec2 uNoiseWrapAmp;
                float _terrainAt(vec2 relXZ) {
                  vec2 sA = relXZ * ${INV_SCALE_A.toFixed(8)} + uNoiseWrapA;
                  vec2 sB = relXZ * ${INV_SCALE_B.toFixed(8)} + uNoiseWrapB;
                  vec2 sAmp = relXZ * ${INV_SCALE_AMP.toFixed(8)} + uNoiseWrapAmp;
                  return terrainHeight(sA, sB, sAmp);
                }
                // World-anchored albedo noise: vRelXZ*freq is the offset from the fan centre; adding the pre-wrapped fan-centre*freq makes the sample track WORLD position, so the snow pattern streams past me as I descend.
                float _albNoise(float freq, vec2 wrap) {
                  return periodicPerlin_t(vRelXZ * freq + wrap, 256.0) * 0.5 + 0.5;
                }
                vec3 vSparkleN; float vIceFlat; vec3 vSnowAlbedo;
                void main() {
              `,
              )
              .replace(
                "#include <normal_fragment_begin>",
                /* glsl */ `
                #include <normal_fragment_begin>
                {
                  float _eps = 0.35 + vTerrainDist * 0.05;
                  float _h0 = _terrainAt(vRelXZ);
                  float _hx = _terrainAt(vRelXZ + vec2(_eps, 0.0));
                  float _hz = _terrainAt(vRelXZ + vec2(0.0, _eps));
                  // Fold the constant fall-line gradient into the normal so the tilted slope catches light as a descent.
                  vec3 _wN = normalize(vec3(
                    (_h0 - _hx) + uSlope * uFallDir.x * _eps,
                    _eps,
                    (_h0 - _hz) + uSlope * uFallDir.y * _eps
                  ));
                  vec3 _vN = normalize(vViewRot * _wN);
                  if (dot(_vN, vViewPosition) < 0.0) _vN = -_vN;
                  normal = _vN;
                  // Snow albedo: bright snow on flats, cool shadow in hollows, rock on steep faces.
                  float _patches = _albNoise(${ALB_PATCH_FREQ}, uAlbWrapPatch);
                  float _grain = _albNoise(${ALB_GRAIN_FREQ}, uAlbWrapGrain);
                  float _grainFade = 1.0 - smoothstep(15.0, 70.0, vTerrainDist);
                  vec3 _snow = mix(uSnowShadow, uSnow, smoothstep(0.42, 0.78, _patches));
                  _snow *= 1.0 + (_grain - 0.5) * 0.10 * _grainFade;
                  float _steep = 1.0 - clamp(_wN.y, 0.0, 1.0);
                  vec3 _albedo = mix(_snow, uRock, smoothstep(0.55, 0.85, _steep));
                  diffuseColor.rgb = _albedo;
                  vSnowAlbedo = _snow;   // snow-only colour (no rock), for the emissive brightness floor
                  vSparkleN = _vN;
                  // Sparkles live on all but the steepest faces.
                  vIceFlat = 1.0 - smoothstep(0.35, 0.7, _steep);
                }
              `,
              )
              .replace(
                "#include <emissivemap_fragment>",
                /* glsl */ `
                #include <emissivemap_fragment>
                {
                  vec3 _N = normalize(vSparkleN);
                  vec3 _L = normalize(uSunDirV);

                  // ---- Snow brightness floor --------------------------------------------
                  // The sun grazes the horizon (dir.y ~ 0.07), so flat ground barely catches direct light and PBR diffuse alone renders open snow as a dim grey.
                  // Model the missing sky-bounce as an emissive floor proportional to the snow albedo: snow keeps its own colour and its patch/grain/shadow variation, since this scales the albedo rather than adding flat, but can never sink into grey.
                  // Faded out on steep faces (vIceFlat) so rock and cliffs stay darker and the terrain keeps its form.
                  totalEmissiveRadiance += vSnowAlbedo * 0.40 * vIceFlat;

                  // ---- Snow sparkles: tiny round emissive shines (no broad sheen) -----
                  // One sparkle per grid cell at a random sub-cell point, lit as a small smooth disc -- a point glint, not the whole cell.
                  // This is the ONLY thing the snow emits -- there is deliberately no glossy reflection on the ground.
                  vec2 _sc = vRelXZ * 4.0 + uSparkleWrap;     // ~0.25 m cells
                  vec2 _cell = floor(_sc);
                  vec2 _f = fract(_sc);
                  float _r0 = fract(sin(dot(_cell, vec2(41.3, 289.1))) * 43758.5453);
                  float _r1 = fract(sin(dot(_cell, vec2(93.7, 17.9))) * 24634.633);
                  float _r2 = fract(sin(dot(_cell, vec2(11.1, 73.4))) * 19984.119);
                  vec2 _ctr = vec2(0.2 + 0.6 * _r1, 0.2 + 0.6 * _r2);
                  float _d = length(_f - _ctr);
                  float _core = smoothstep(0.14, 0.0, _d);
                  _core *= _core;                              // sharpen into a point glint
                  float _tw = pow(0.5 + 0.5 * sin(uTime * (2.5 + _r2 * 6.0) + _r0 * 30.0), 8.0);
                  float _present = step(0.80, _r0);            // ~20% of cells host a sparkle
                  float _sun = 0.6 + 0.4 * max(dot(_N, _L), 0.0);          // gentle sun catch
                  float _view = 0.6 + 0.4 * pow(max(_N.z, 0.0), 1.5);      // brighter facing camera
                  float _fade = 1.0 - smoothstep(120.0, 340.0, vTerrainDist);
                  // Sparkles are direct-sun glints, so they must vanish wherever the sun is occluded.
                  // Sample the sun's shadow with the same version-stable primitive the shadow-receiving materials use (sampler2DShadow, hardware compare) and gate the glint by it.
                  // The sky-bounce floor above is deliberately not gated: the sky still lights snow that is in shadow.
                  float _sunVis = 1.0;
                  #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
                    vec3 _ssc = vDirectionalShadowCoord[0].xyz / vDirectionalShadowCoord[0].w;
                    if (_ssc.x >= 0.0 && _ssc.x <= 1.0 && _ssc.y >= 0.0 && _ssc.y <= 1.0 && _ssc.z <= 1.0)
                      _sunVis = texture(directionalShadowMap[0], vec3(_ssc.xy, _ssc.z + directionalLightShadows[0].shadowBias));
                  #endif
                  float _spark = _present * _core * _tw * _sun * _view * _fade * vIceFlat * _sunVis;
                  vec3 _sparkCol = mix(vec3(1.0), vec3(0.85, 0.92, 1.0), _r1); // faint cool tint
                  totalEmissiveRadiance += _sparkCol * _spark * 2.6;
                }
              `,
              );
          };

          super(geo, mat);
          this.frustumCulled = false;

          // The only receiver in the scene, and it never casts: the surface height lives entirely in the vertex shader, but the shadow depth pass runs the stock flat geometry, so a cast would stamp a flat plane into the map and self-shadow into garbage.
          // Receiving is exact because the receive coord is built from the displaced `transformed`, landing the shadow on the true snow surface.
          this.castShadow = false;
          this.receiveShadow = true;
        }
        updateNoiseWrap(worldX, worldZ) {
          const T = CONFIG.TERRAIN;
          const PA = TERRAIN_PERIOD_A,
            PB = TERRAIN_PERIOD_B;
          const ax = worldX / T.OCTAVE_A_SCALE,
            az = worldZ / T.OCTAVE_A_SCALE;
          this.material.userData.uNoiseWrapA.value.set(
            pmod(ax, PA),
            pmod(az, PA),
          );
          const bx = worldX / T.OCTAVE_B_SCALE,
            bz = worldZ / T.OCTAVE_B_SCALE;
          this.material.userData.uNoiseWrapB.value.set(
            pmod(bx, PB),
            pmod(bz, PB),
          );

          // Amplitude-envelope wrap (same float64 -> [0,256) trick), so the GPU reconstructs the world-anchored mogul-size zones without ever seeing the 1-AU coordinate.
          const PM = TERRAIN_PERIOD_AMP;
          const mx = worldX / T.OCTAVE_A_AMP_SCALE,
            mz = worldZ / T.OCTAVE_A_AMP_SCALE;
          this.material.userData.uNoiseWrapAmp.value.set(
            pmod(mx, PM),
            pmod(mz, PM),
          );

          // Albedo wraps (float64 -> [0,256)), keyed to the same fan centre as vRelXZ.
          const pwx = worldX * ALB_PATCH_FREQ,
            pwz = worldZ * ALB_PATCH_FREQ;
          this.material.userData.uAlbWrapPatch.value.set(
            pmod(pwx, 256),
            pmod(pwz, 256),
          );
          const gwx = worldX * ALB_GRAIN_FREQ,
            gwz = worldZ * ALB_GRAIN_FREQ;
          this.material.userData.uAlbWrapGrain.value.set(
            pmod(gwx, 256),
            pmod(gwz, 256),
          );
        }

        // Push the live grade and the small fan-centre->player delta each frame.
        updateSlope(fanX, fanZ, playerX, playerZ) {
          this.material.userData.uSlope.value = STATE.slopeGrade;
          this.material.userData.uFanMinusPlayer.value.set(
            fanX - playerX,
            fanZ - playerZ,
          );
        }

        // Ice sheen + sparkles need the sun in VIEW space, a clock, and a world-anchored wrap for the sparkle hash (so glints sit on the snow and stream past).
        updateIce(time, sunDirView, worldX, worldZ) {
          this.material.userData.uTime.value = time;
          this.material.userData.uSunDirV.value.copy(sunDirView);
          const SP = 2.6;
          const sx = worldX * SP,
            sz = worldZ * SP;
          this.material.userData.uSparkleWrap.value.set(
            pmod(sx, 256),
            pmod(sz, 256),
          );
        }
      }

      // ============================================================================
      // SKY dome -- simple cold winter gradient + soft sun glow
      // ============================================================================
      class SkyDome extends Mesh {
        constructor() {
          const geo = new SphereGeometry(1, 24, 16);
          const sd = CONFIG.SKY.SUN_DIR;
          const sunDir = new Vector3(sd.x, sd.y, sd.z).normalize();
          const mat = new ShaderMaterial({
            side: BackSide,
            depthWrite: false,
            fog: false,
            uniforms: {
              uTop: { value: new Color(CONFIG.SKY.TOP) },
              uBottom: { value: new Color(CONFIG.SKY.BOTTOM) },
              uHaze: { value: new Color(CONFIG.SKY.FOG) },
              uSunDir: { value: sunDir },
            },
            vertexShader: `
              varying vec3 vDir;
              void main() {
                vDir = normalize(position);
                vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                gl_Position = p.xyww;
              }
            `,
            fragmentShader: `
              precision mediump float;
              varying vec3 vDir;
              uniform vec3 uTop; uniform vec3 uBottom; uniform vec3 uHaze; uniform vec3 uSunDir;
              void main() {
                float h = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
                vec3 col = mix(uBottom, uTop, pow(h, 0.8));
                // Bright snow-haze band hugging the horizon: anything near or below the eye line (vDir.y ~ 0) washes to the fog colour, so the gap between the snow fan's silhouette and the distant peaks reads as misty horizon rather than a hard blue band.
                // One shader, zero extra geometry.
                float band = 1.0 - smoothstep(0.0, 0.16, vDir.y);   // 1 at/below horizon -> 0 above
                band = max(band, 1.0 - smoothstep(-0.5, 0.0, vDir.y)); // solid haze below horizon
                col = mix(col, uHaze, clamp(band, 0.0, 1.0));
                float s = max(dot(normalize(vDir), uSunDir), 0.0);
                col += vec3(1.0, 0.97, 0.9) * pow(s, 1400.0) * 1.0;  // small tight disc
                col += vec3(0.9, 0.94, 1.0) * pow(s, 7.0) * 0.10;    // halo
                gl_FragColor = vec4(col, 1.0);
              }
            `,
          });
          super(geo, mat);
          this.scale.setScalar(8000);
          this.frustumCulled = false;
        }
      }

      // ============================================================================
      // CLOUDS -- drifting overhead sheet.
      // A subdivided plane high above the camera, drooped into a shallow paraboloid so its rim sinks below the horizon (no hard cloud-plane edge hanging in the sky).
      // ============================================================================
      const CloudsShader = {
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            const float D_RIM = 0.16;
            float rho2 = dot(position.xy, position.xy);
            float drop = D_RIM * rho2;
            vec3 domePos = vec3(position.xy, position.z + drop);
            vec4 pos = projectionMatrix * modelViewMatrix * vec4(domePos, 1.0);
            gl_Position = pos.xyww;
          }
        `,
        fragmentShader: `
          precision mediump float;
          uniform float uTime;
          uniform vec3 uCloudColor;
          uniform vec3 cameraPos;
          uniform float uAlpha;
          varying vec2 vUv;
          vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
          float snoise(vec2 v){
            const vec4 C = vec4(0.211324865405187,0.366025403784439,
                                -0.577350269189626,0.024390243902439);
            vec2 i = floor(v + dot(v,C.yy));
            vec2 x0 = v - i + dot(i,C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
            vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0))
                                    + i.x + vec3(0.0,i1.x,1.0));
            vec3 m = max(0.5 - vec3(dot(x0,x0),dot(x12.xy,x12.xy),
                                    dot(x12.zw,x12.zw)), 0.0);
            m = m*m; m = m*m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
            vec3 g;
            g.x  = a0.x  * x0.x + h.x * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
          }
          void main() {
            vec2 cloudUV = vUv * 6.0 + vec2(
              cameraPos.x / 1000.0 + uTime / 100.0,
              cameraPos.z / 1000.0
            );
            float n = snoise(cloudUV * 3.0 + uTime / 50.0) * 0.6
                    + snoise(cloudUV * 6.0 + uTime / 40.0) * 0.3
                    + snoise(cloudUV * 12.0 + uTime / 30.0) * 0.1;
            float cloudDensity = smoothstep(0.1, 0.9, 0.5 * n + 0.5);
            float horizonFade = smoothstep(0.0, 0.3, 1.0 - abs(vUv.y - 0.5) * 2.0);
            float a = cloudDensity * horizonFade * uAlpha;
            if (a < 0.01) discard;
            gl_FragColor = vec4(uCloudColor, a);
          }
        `,
      };
      // Seconds before the cloud clock wraps (6 h).
      // Every divisor the shader applies to uTime (100, 50, 40, 30) divides this exactly, so the wrap lands on a whole number of noise units in each of the four layers.
      const CLOUD_T_WRAP = 21600;

      // Seconds before the sparkle clock wraps (1 h).
      // Kept far shorter than the cloud's: the twinkle degrades sooner (its shader scales uTime by up to 8.5) and the wrap is imperceptible on a field of point glints.
      const SPARKLE_T_WRAP = 3600;
      class Clouds extends Mesh {
        constructor() {
          // 64x64 grid so the dome bend actually curves (one quad would only tilt flat).
          // Still trivial vertex count and one draw call.
          const geometry = new PlaneGeometry(2, 2, 64, 64);
          const material = new ShaderMaterial({
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: AdditiveBlending,
            side: FrontSide,
            fog: false,
            uniforms: {
              uTime: { value: 0 },
              uCloudColor: { value: new Color(CONFIG.CLOUDS.COLOR) },
              cameraPos: { value: new Vector3() },
              uAlpha: { value: CONFIG.CLOUDS.ALPHA },
            },
            vertexShader: CloudsShader.vertexShader,
            fragmentShader: CloudsShader.fragmentShader,
          });
          super(geometry, material);
          this.frustumCulled = false;
          this.renderOrder = -1; // after the sky dome, before the terrain fan
          this.rotation.x = Math.PI / 2;
          this.position.set(0, CONFIG.CLOUDS.HEIGHT, 0);
          this.scale.setScalar(CONFIG.CLOUDS.SPAN);
          this._t = 0;
        }
        update(dt, cameraPosition) {
          // Wrapped, because uTime is a float32 in the shader and would otherwise grow without bound.
          // Float32 spacing at t is 2^(floor(log2 t) - 23), and a frame stops advancing the uniform once that spacing passes 2*dt: at 60 fps that is t = 2^19 s (~146 h), where half the frames repeat and the drift stutters, and by 2^20 s it is frozen.
          // The noise is not periodic, so the wrap is a one-frame pattern jump -- CLOUD_T_WRAP is long enough that a session rarely reaches it, and high diffuse cloud hides it when it does.
          this._t = pmod(this._t + dt, CLOUD_T_WRAP);
          this.material.uniforms.uTime.value = this._t;

          // Wrap camera XZ (float64) before it reaches the float32 noise, or at 1 AU the fractional precision vanishes and the clouds would freeze/disappear.
          this.material.uniforms.cameraPos.value.set(
            cameraPosition.x % 100000,
            cameraPosition.y,
            cameraPosition.z % 100000,
          );
        }
      }

      // ============================================================================
      // SNOW + PEAKS
      // ============================================================================
      function makeSnowTexture() {
        const size = 64;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        const grad = g.createRadialGradient(
          size / 2,
          size / 2,
          0,
          size / 2,
          size / 2,
          size / 2,
        );
        grad.addColorStop(0.0, "rgba(255,255,255,1)");
        grad.addColorStop(0.5, "rgba(255,255,255,0.85)");
        grad.addColorStop(1.0, "rgba(255,255,255,0)");
        g.fillStyle = grad;
        g.fillRect(0, 0, size, size);
        const t = new CanvasTexture(c);
        t.colorSpace = SRGBColorSpace;
        return t;
      }

      // Soft round flakes (size-attenuated, so near ones are big & weighty, far ones small -> depth).
      // They fall slowly and sway (float), and the whole cloud is dragged opposite the player's motion so at speed they stream past kinetically.
      class Snow extends Points {
        constructor() {
          const S = CONFIG.SNOW;
          const pos = new Float32Array(S.COUNT * 3);
          const col = new Float32Array(S.COUNT * 3);
          const phase = new Float32Array(S.COUNT);
          const fallVar = new Float32Array(S.COUNT);
          for (let i = 0; i < S.COUNT; i++) {
            pos[i * 3] = (Math.random() - 0.5) * 2 * S.BOX_XZ;
            pos[i * 3 + 1] = S.FLOOR + Math.random() * (S.TOP - S.FLOOR);
            pos[i * 3 + 2] = (Math.random() - 0.5) * 2 * S.BOX_XZ;
            phase[i] = Math.random() * Math.PI * 2;
            fallVar[i] = 0.6 + Math.random() * 0.8; // heavier/lighter flakes

            // Per-flake faintness, baked once into vertex colour.
            // Lighter, slower flakes read fainter and heavier ones more solid, so the cloud gains depth with zero per-frame cost.
            // Normal alpha blending over the bright sky turns a dimmer grey into a fainter flake.
            // A small random spread keeps same-weight flakes from looking banded.
            const faint = clamp(
              0.55 + (fallVar[i] - 0.6) * 0.45 + (Math.random() - 0.5) * 0.18,
              0.4,
              1.0,
            );
            col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = faint;
          }
          const geo = new BufferGeometry();
          geo.setAttribute("position", new BufferAttribute(pos, 3));
          geo.setAttribute("color", new BufferAttribute(col, 3));
          const mat = new PointsMaterial({
            map: makeSnowTexture(),
            vertexColors: true,
            size: S.SIZE,
            sizeAttenuation: true,
            transparent: true,
            opacity: 0.95,
            depthWrite: false,
          });
          super(geo, mat);
          this._phase = phase;
          this._fallVar = fallVar;
          this.frustumCulled = false;
          this._t = 0;
        }
        update(dt, camPos, velX, velZ) {
          const S = CONFIG.SNOW;
          this.position.copy(camPos);
          this._t += dt;
          const p = this.geometry.attributes.position.array;
          const ph = this._phase,
            fv = this._fallVar;
          // Apparent horizontal velocity of the cloud vs camera = -player velocity.
          const relX = -velX * S.DRIFT_FROM_SPEED;
          const relZ = -velZ * S.DRIFT_FROM_SPEED;
          for (let i = 0; i < S.COUNT; i++) {
            const i3 = i * 3;
            p[i3] += (relX + Math.sin(this._t * 0.7 + ph[i]) * S.SWAY) * dt;
            p[i3 + 1] -= S.FALL * fv[i] * dt;
            p[i3 + 2] += (relZ + Math.cos(this._t * 0.6 + ph[i]) * S.SWAY) * dt;
            if (p[i3 + 1] < S.FLOOR) {
              p[i3 + 1] = S.TOP;
            }
            if (p[i3] > S.BOX_XZ) p[i3] -= 2 * S.BOX_XZ;
            else if (p[i3] < -S.BOX_XZ) p[i3] += 2 * S.BOX_XZ;
            if (p[i3 + 2] > S.BOX_XZ) p[i3 + 2] -= 2 * S.BOX_XZ;
            else if (p[i3 + 2] < -S.BOX_XZ) p[i3 + 2] += 2 * S.BOX_XZ;
          }
          this.geometry.attributes.position.needsUpdate = true;
        }
      }

      // ============================================================================
      // Distant mountain ranges: three concentric ridge curtains at increasing radius, each built from ridged noise (1-|noise|) for sharp jagged summits.
      // Vertex colours bake altitude bands (hazy base, rock, snow cap), a faked sun direction, and aerial perspective (farther ranges and lower altitudes wash toward sky haze).
      // fog:false; the haze is baked in instead.
      // ============================================================================
