            let ux = eM[4],
              uy = eM[5],
              uz = eM[6];
            const ul = Math.sqrt(ux * ux + uy * uy + uz * uz) || 1;
            const asym =
              ((c1x - c0x) * ux + (c1y - c0y) * uy + (c1z - c0z) * uz) / ul;
            const drop =
              -Math.min(CFG.STAGGER_DROP_MAX, Math.abs(asym) * 0.5) * blend;
            const half = clamp(
              (cls[1] - cls[0]) / 2,
              -CFG.MAX_SPLIT,
              CFG.MAX_SPLIT,
            );
            dys[0] = half * blend + drop; // left toward the mean, both settle to contact...
            dys[1] = -half * blend + drop; // ...right the same amount the other way
          }

          // Snowplow tip clearance.
          // Toeing a boot in swings its tip toward the midline by tipReach * sin(wedge); past the half-separation the skis cross.
          // BRAKE_WEDGE is therefore a ceiling the stance must honour, not a promise it can keep.
          // Solved once per frame because it is a property of the pair.
          // Both inputs are measured -- separation from the rest-pose ankles, tip reach from the ski geometry -- so swapping the model's skis carries through.
          if (this.brakeBlend > 1e-3) {
            legs[0].ankle.getWorldPosition(_ankP);
            const a0x = _ankP.x,
              a0z = _ankP.z;
            legs[1].ankle.getWorldPosition(_ankP);
            // Lateral component only.
            // A fore/aft stagger between the boots is not room for a tip to swing into, and projecting it out is what keeps this honest mid-gait.
            const sepHalf =
              Math.abs((a0x - _ankP.x) * rx + (a0z - _ankP.z) * rz) * 0.5 +
              CFG.BRAKE_WIDEN * this.brakeBlend;
            // Half the ski's measured ground footprint: bindings sit near the centre, so this is how far the tip stands ahead of the boot it pivots about.
            const tipReach =
              (this.skiTrueOk
                ? (this.skiTrue[0][4] + this.skiTrue[1][4]) * 0.5
                : CONFIG.HERRINGBONE.LEN) * 0.5;
            this.plowWedge = Math.min(
              CFG.BRAKE_WEDGE,
              Math.asin(
                clamp((sepHalf - CFG.BRAKE_TIP_CLEAR) / tipReach, 0, 1),
              ),
            );
          } else this.plowWedge = CFG.BRAKE_WEDGE;

          // Snowplow sink.
          // Widening the stance lengthens the diagonal each leg spans; past its reach the two-bone solve clamps at (L1 + L2 - REACH_MARGIN) and the foot stops short of the snow.
          // Derived from the leg the model actually has, so BRAKE_WIDEN can move without re-tuning.
          // Holding the current extension fixed keeps the knee bent and drops the hips, which is the snowplow posture; letting it straighten would give a locked-leg A-frame.
          let sink = 0;
          if (this.brakeBlend > 1e-3) {
            const widen = CFG.BRAKE_WIDEN * this.brakeBlend;
            for (let i = 0; i < 2; i++) {
              legs[i].hip.getWorldPosition(_hipP);
              legs[i].ankle.getWorldPosition(_ankP);
              const dx = _ankP.x - _hipP.x,
                dy = _ankP.y - _hipP.y,
                dz = _ankP.z - _hipP.z;
              // Split hip->ankle into the body's three axes.
              // Only the lateral one grows.
              const lat = Math.abs(dx * rx + dz * rz) + widen;
              const fore = dx * fx + dz * fz;
              const span = dx * dx + dy * dy + dz * dz; // squared, kept as-is
              // Vertical the same leg can still cover once the foot is that much further out.
              const vNew = Math.sqrt(
                Math.max(0, span - lat * lat - fore * fore),
              );
              sink = Math.max(sink, Math.abs(dy) - vNew);
            }
          }
          // Clamped: a degenerate read must not drop the skier through the snow.
          if (sink > CFG.BRAKE_SINK_MAX)
            warnOnce(
              "plow.sink",
              `hip drop ${sink.toFixed(3)} m clamped to BRAKE_SINK_MAX; the skis will float`,
            );
          this._plowSink = Math.min(sink, CFG.BRAKE_SINK_MAX);

          // PASS 2 -- per leg: build the target (ski stance x gait crossfade), solve, conform.
          for (let i = 0; i < 2; i++) {
            const L = legs[i];
            const g = this._gait[i];

            // FK world positions of hip / knee / ankle in the restored rest pose.
            L.hip.getWorldPosition(_hipP);
            L.knee.getWorldPosition(_kneeP);
            L.ankle.getWorldPosition(_ankP);
            const L1 = _hipP.distanceTo(_kneeP); // thigh length
            const L2 = _kneeP.distanceTo(_ankP); // shin length
            if (L1 < 1e-4 || L2 < 1e-4) continue;

            // Ski-stance target: rest foot, height-shifted by the differential split.
            let txx = _ankP.x,
              tyy = _ankP.y + dys[i],
              tzz = _ankP.z;

            // Gait target: the rest foot displaced fore/aft along forward by a phase-driven stride, never more than half a step from where the downhill solve already proved the legs behave.
            // Stance [0,.5): offset runs +S/2 -> -S/2 over exactly one STEP_DIST of travel, which makes the boot world-stationary while the body walks past it -- the plant emerges from the relative math, with no world pinning anywhere.
            // Swing [.5,1): offset returns -S/2 -> +S/2 with a sine lift arc.
            // A small outward shift widens the stance into the V.
            if (cb > 1e-3 && g.mode) {
              const S = CONFIG.HERRINGBONE.STEP_DIST;
              const ph = g.phase;
              let rel, lift;
              if (ph < 0.5) {
                rel = S / 2 - ph * 2 * S; // ph 0 -> +S/2 (touch-down), ph .5 -> -S/2 (lift-off)
                lift = 0;
              } else {
                const t = (ph - 0.5) * 2; // 0..1 through the swing
                rel = -S / 2 + t * S; // -S/2 -> +S/2
                lift = Math.sin(Math.PI * t) * CFG.STEP_LIFT;
              }
              const out = i === this.rightLeg ? 1 : -1; // widen toward own side
              rel += CFG.GAIT_AHEAD; // bias the whole stride slightly ahead of the rest feet

              // Settle the step as I stop: at a standstill strideAmt -> 0, so the fore/aft offset and the swing lift collapse and the boot eases onto its rest spot (still widened into the V below) -- a planted herringbone rest, no foot stranded in the air.
              rel *= strideAmt;
              lift *= strideAmt;

              // Extra settle: at a near-standstill pin the swing lift to exactly zero so no foot hangs in the air.
              if (strideAmt < CFG.STRIDE_ACTIVE) {
                lift = 0;
              }

              // Stance width follows the live V: near-parallel skis walk the feet close together, a wide-open V on a steep pitch spreads them.
              // sin(splay) is the natural map -- it is the lateral component of the toed-out ski -- normalised so GAIT_WIDEN keeps its meaning at full splay.
              // Knees follow for free via the pole-vector axes, which already use the dynamic splay.
              const wd =
                (CFG.GAIT_WIDEN * Math.sin(this.herringboneSplay())) /
                Math.sin(CONFIG.HERRINGBONE.SPLAY);
              // The boot stands wherever its own stride places it -- the rib is stamped under the measured ski at the plant, never the reverse.
              // This is a world-space translation, and the graph->world rebase is translation-only, so it adds directly to a render-space target with no conversion.
              // On top of the stride offset, add the plant-lock correction that steers the grounded ski back onto the rib it stamped; corrX/corrZ is measured from the ski itself in the pass-2 tail and accumulated there, and here it is simply applied.
              const gx = _ankP.x + fx * rel + rx * out * wd + g.corrX * cb;
              const gz = _ankP.z + fz * rel + rz * out * wd + g.corrZ * cb;

              // Vertical, stated absolutely: put the ski on the terrain, then add this frame's swing arc.
              // _skiOffY is the measured ankle offset that rests the ski's lowest base point on the snow, computed in the pass-2 tail from rigid-body geometry and terrain gradient, perpendicular to the surface.
              // It targets the ski rather than the sole deliberately -- the sole is not what touches, and a ski mounted ahead of the boot on a pitch clears very different snow from the snow under the foot.
              const gy =
                snowAt(gx + this._skiOffX[i], gz + this._skiOffZ[i]) +
                this._skiOffY[i] +
                lift;
              txx += (gx - txx) * cb;
              tyy += (gy - tyy) * cb;
              tzz += (gz - tzz) * cb;
            }

            // Ski seat, applied after the ski/gait crossfade because it is a property of the ski, not of either stance.
            // Run in both modes and faded only by the grounded blend: a seat on one side of the crossfade only would settle the ski at two heights and the blend between them is a visible step.
            // Takes SKI_SEAT_BITE and nothing else -- the ski stance states its target relative to the rest pose, so vertical placement is already owned by the body and MODEL_Y_OFFSET, and importing the gait branch's absolute seat would replace the downhill solve rather than adjust it.
            // Weighted (1 - cb) because the gait branch already carries the bite inside _skiOffY.
            tyy += CFG.SKI_SEAT_BITE * blend * (1 - cb);

            // Landing absorb: the hips dipped by _absorb (holder above); add it back to the foot target so the boots stay on the snow and the knees take the compression.
            tyy += this._absorb * blend;

            // Snowplow stance: spread the boots apart while braking (same both ways).
            // With the toe yaw below this reads as the wedge -- tips together facing downhill, tails together facing uphill -- the boot spread keeping the converging ends from crossing in either case.
            if (this.brakeBlend > 1e-3) {
              const outS = i === this.rightLeg ? 1 : -1;
              txx += rx * outS * CFG.BRAKE_WIDEN * this.brakeBlend;
              tzz += rz * outS * CFG.BRAKE_WIDEN * this.brakeBlend;
            }

            // Airborne tuck: pull this foot toward the midline and up (knees fold), scaled by `air`.
            // Landing needs no code -- the same blend runs backward and the feet ease straight back onto the terrain targets as they re-engage.
            if (airT > 1e-3) {
              const inS = i === this.rightLeg ? -1 : 1; // toward the midline
              txx += rx * inS * CFG.AIR_FEET_IN * airT;
              tzz += rz * inS * CFG.AIR_FEET_IN * airT;
              tyy += CFG.AIR_FEET_UP * airT;
            }
            _tgt.set(txx, tyy, tzz);

            // Clamp the target to the leg's reachable shell.
            // The FLOOR is the larger of the degenerate limit and 45% of total leg length, so no target -- however wrong -- can ever ball the leg up with the boot at the hip.
            let reach = _hipP.distanceTo(_tgt);
            reach = clamp(
              reach,
              Math.max(Math.abs(L1 - L2) + CFG.REACH_MARGIN, 0.45 * (L1 + L2)),
              L1 + L2 - CFG.REACH_MARGIN,
            );
            _tgt.sub(_hipP).setLength(reach).add(_hipP); // re-seat target at the clamped distance

            // (1) Knee: drive the interior knee angle to the law-of-cosines solution for `reach`.
            _v1.subVectors(_hipP, _kneeP); // knee -> hip (up the thigh)
            _v2.subVectors(_ankP, _kneeP); // knee -> ankle (down the shin)
            const angNow = _v1.angleTo(_v2);
            const cosWant = clamp(
              (L1 * L1 + L2 * L2 - reach * reach) / (2 * L1 * L2),
              -1,
              1,
            );
            const angWant = Math.acos(cosWant);
            _axis.crossVectors(_v1, _v2); // bend axis = leg-plane normal (preserves current bend dir)
            if (_axis.lengthSq() > 1e-10) {
              _axis.normalize();
              _qd.setFromAxisAngle(_axis, angWant - angNow);
              this._rotateBoneWorld(L.knee, _qd);
              L.knee.updateWorldMatrix(false, true); // refresh shin + ankle below the knee
            }

            // (2) Hip: rotate the (now correctly-distant) ankle onto the target direction.
            L.ankle.getWorldPosition(_ankP);
            _v1.subVectors(_ankP, _hipP).normalize();
            _v2.subVectors(_tgt, _hipP).normalize();
            _qd.setFromUnitVectors(_v1, _v2);
            this._rotateBoneWorld(L.hip, _qd);
            L.hip.updateWorldMatrix(false, true); // refresh the whole leg

            // (2b) Knee pole: the hip aim above is a minimal arc, which is free to carry the knee sideways for big targets (trailing gait plants, hard lean).
            // Spin the leg about the hip->ankle axis so the bend plane faces where the foot points -- the ankle sits ON that axis, so it doesn't move an inch.
            // Still closed-form: one signed angle, one quaternion.
            if (CFG.KNEE_POLE > 0) {
              L.knee.getWorldPosition(_kneeP);
              L.ankle.getWorldPosition(_ankP);
              _v1.subVectors(_ankP, _hipP);
              const axLen = _v1.length();
              if (axLen > 1e-5) {
                _v1.multiplyScalar(1 / axLen); // u: hip->ankle axis
                _v2.subVectors(_kneeP, _hipP); // current knee dir, projected perpendicular to u
                _v2.addScaledVector(_v1, -_v2.dot(_v1));

                // Desired pole: body forward, eased toward the boot's toe-out axis while in the gait, so climbing knees track the herringbone V.
                let pdx = fx,
                  pdz = fz;
                if (cb > 1e-3 && g.mode) {
                  // Follow only a fraction of the boots' toe-out: skis splay 53 deg in a herringbone but knees stay mostly forward -- full follow reads as a sumo squat.
                  const kk = cb * CFG.GAIT_KNEE_OUT;
                  pdx += (g.axX - fx) * kk;
                  pdz += (g.axZ - fz) * kk;
                }
                _tgt.set(pdx, 0, pdz); // _tgt is free after the solve; reuse as scratch
                _tgt.addScaledVector(_v1, -_tgt.dot(_v1));
                if (_v2.lengthSq() > 1e-8 && _tgt.lengthSq() > 1e-8) {
                  _v2.normalize();
                  _tgt.normalize();
                  _axis.crossVectors(_v2, _tgt);
                  const ang =
                    Math.atan2(_axis.dot(_v1), _v2.dot(_tgt)) * CFG.KNEE_POLE;
                  if (Math.abs(ang) > 1e-4) {
                    _qd.setFromAxisAngle(_v1, ang);
                    this._rotateBoneWorld(L.hip, _qd);
                    L.hip.updateWorldMatrix(false, true);
                  }
                }
              }
            }

            // This foot's contact patch normal (world, unit), built in the body's horizontal forward/right basis as N = up - (dh/dforward)*forward - (dh/dright)*right.
            // dh is a central difference around the foot, fore/aft and laterally, so N carries the full surface tilt -- pitch and roll, not just the fall line.
            let dRight = 0; // dH/dRIGHT under this foot, kept for the edge roll below
            {
              L.ankle.getWorldPosition(_ankP);
              const inv2s = 1 / (2 * samp);
              const dF =
                (gAtF(_ankP.x + fx * samp, _ankP.z + fz * samp) -
                  gAtF(_ankP.x - fx * samp, _ankP.z - fz * samp)) *
                inv2s; // dheight/dforward at the foot
              const dR =
                (gAtF(_ankP.x + rx * samp, _ankP.z + rz * samp) -
                  gAtF(_ankP.x - rx * samp, _ankP.z - rz * samp)) *
                inv2s; // dheight/dright at the foot
              dRight = dR;
              _norm.set(-dF * fx - dR * rx, 1, -dF * fz - dR * rz).normalize();
            }

            // Ankle conform: tilt the leg so the foot rides its own patch instead of the body's average plane -- suspension that keeps the boot planted.
            // The torso already adopted the mean pitch and roll in sampleTerrainPose, so only the residual between this patch's normal and that mean plane's normal is added, eased by FOOT_CONFORM so the leg gives a little rather than tracking every micro-bump.
            // The ski's exact flatness is finished on the toe next.
            // (bodyN dh: dforward = tan(pitch); dright = -tan(roll), matching how roll was measured.)
            if (CFG.FOOT_CONFORM > 0) {
              const dFb = Math.tan(this.pitch),
                dRb = -Math.tan(this.roll);
              _v2
                .set(-dFb * fx - dRb * rx, 1, -dFb * fz - dRb * rz)
                .normalize(); // body plane normal
              _axis.crossVectors(_v2, _norm); // rotation bodyN -> localN about (bodyN x localN); sign exact
              if (_axis.lengthSq() > 1e-12) {
                _axis.normalize();
                const ang =
                  Math.min(_v2.angleTo(_norm), CFG.MAX_FOOT_PITCH) *
                  CFG.FOOT_CONFORM *
                  blend; // clamp = lip protection, then ease in
                if (ang > 1e-4) {
                  _qd.setFromAxisAngle(_axis, ang);
                  this._rotateBoneWorld(L.ankle, _qd);
                  L.ankle.updateWorldMatrix(false, true);
                }
              }
            }

            // Snowplow boot yaw.
            // Downhill the boots toe in -- tips together, the pizza, whose point faces the way you are sliding.
            // Pointed uphill the same brake mirrors front-to-back: the boots toe out so the tails come together, because downhill is now behind you and the wedge's closed end has to face that way.
            // wedgeLat carries the flip: -1 facing downhill, +1 facing uphill, easing through 0 across the fall line so it never snaps.
            if (this.brakeBlend > 1e-3) {
              const outS = i === this.rightLeg ? 1 : -1;
              const wedgeLat = -clamp(
                this.alignment / CONFIG.SKIER.WEDGE_FLIP_ALIGN,
                -1,
                1,
              );
              // The capped angle, not CFG.BRAKE_WEDGE -- see the tip-clearance solve above.
              const cw = Math.cos(this.plowWedge),
                sw = Math.sin(this.plowWedge);
              const dx = fx * cw + wedgeLat * rx * outS * sw, // toe pinches in (downhill) / splays out (uphill)
                dz = fz * cw + wedgeLat * rz * outS * sw;
              const yaw =
                Math.atan2(fz * dx - fx * dz, fx * dx + fz * dz) *
                this.brakeBlend;
              if (Math.abs(yaw) > 1e-4) {
                _axis.set(0, 1, 0);
                // Split across hip and ankle (see CFG.BRAKE_LEG_YAW).
                // Both are the same world-up delta and compose additively down the chain, so the foot ends yawed by exactly `yaw` whatever the split; what the hip share buys is the thigh and shin coming with it, and the boot shaft is skinned to the shin.
                // World-vertical axis, so sole height is untouched and the foot only slides a few cm laterally.
                // Downhill only: -wedgeLat is +1 down the fall line and 0 across it, so the mirrored tails-together wedge goes back to the ankle untouched.
                const hipYaw = yaw * CFG.BRAKE_LEG_YAW * clamp(-wedgeLat, 0, 1);
                if (Math.abs(hipYaw) > 1e-4) {
                  _qd.setFromAxisAngle(_axis, hipYaw);
                  this._rotateBoneWorld(L.hip, _qd); // thigh + shin + foot + ski turn as one; knees roll in, as they should in a wedge
                  L.hip.updateWorldMatrix(false, true);
                }
                const ankleYaw = yaw - hipYaw; // remainder, so the sum is untouched
                if (Math.abs(ankleYaw) > 1e-4) {
                  _qd.setFromAxisAngle(_axis, ankleYaw);
                  this._rotateBoneWorld(L.ankle, _qd);
                  L.ankle.updateWorldMatrix(false, true);
                }
              }
            }

            // Herringbone toe-out: while climbing, yaw the boot about world-up from the body forward onto its rib's splayed axis, so the V of the boots matches the V of the prints they stand on -- the exact inverse of the snowplow's tips-in wedge above.
            // Uses the smoothed heading (aimX/aimZ), the same target the ski re-aim reads below, so the boot and the ski it carries turn as one rigid unit instead of the boot snapping to each new rib axis while the ski glides.
            if (cb > 1e-3 && g.mode) {
              const yaw =
                Math.atan2(
                  fz * g.aimX - fx * g.aimZ,
                  fx * g.aimX + fz * g.aimZ,
                ) * cb;
              if (Math.abs(yaw) > 1e-4) {
                _axis.set(0, 1, 0);
                _qd.setFromAxisAngle(_axis, yaw);
                this._rotateBoneWorld(L.ankle, _qd);
                L.ankle.updateWorldMatrix(false, true);
              }
            }

            // ---- Keep boot + ski + marks pointing the same way, and the ski flat ----
            // The marks in the snow are ground truth for direction: carve tracks downhill, herringbone ribs uphill, the wedge while braking.
            // The re-aim is essential, not cosmetic -- the flatten's tilt axis picks up a yaw component on a slope, which would twist the ski off its rib or track.
            // The boot is already yawed onto them by the de-splay, herringbone and snowplow blocks, and the ski is rigidly bolted to the toe, so all that is left is keeping the toe pointing the same way and lying flat.
            let mdx = fx,
              mdz = fz,
              mdOk = false;
            if (blend > 1e-3 && L.toe !== L.ankle) {
              mdOk = true;
              if (cb > 1e-3 && g.mode) {
                // Ease the heading from travel onto this foot's rib axis, but reach it exactly once committed to the climb (cb >= GAIT_AIM_FULL) rather than asymptotically, or the steady-state cb (~0.99) leaves the ski a fraction of the V off its rib.
                // While grounded (stance, phase < 0.5) the target is the locked axis latched at the plant, so the ski holds dead still on the rib it stamped; during the swing it tracks the live smoothed aim, so the discrete per-rib steps arrive as a glide rather than a snap.
                const aimRib = Math.min(1, cb / CFG.GAIT_AIM_FULL);
                const planted = g.phase < 0.5 && g._lockX !== undefined;
                const tX = planted ? g._lockX : g.aimX;
                const tZ = planted ? g._lockZ : g.aimZ;
                mdx += (tX - mdx) * aimRib;
                mdz += (tZ - mdz) * aimRib;
              }
              if (this.brakeBlend > 1e-3) {
                const outS = i === this.rightLeg ? 1 : -1;
                // -1 downhill (toe in) ..
                // +1 uphill (toe out)
                const wedgeLat = -clamp(
                  this.alignment / CONFIG.SKIER.WEDGE_FLIP_ALIGN,
                  -1,
                  1,
                );
                // Same capped angle the boots used, so the ski re-aim cannot fight them.
                const cw = Math.cos(this.plowWedge),
                  sw = Math.sin(this.plowWedge);
                mdx +=
                  (fx * cw + wedgeLat * rx * outS * sw - mdx) * this.brakeBlend; // ease onto the wedge
                mdz +=
                  (fz * cw + wedgeLat * rz * outS * sw - mdz) * this.brakeBlend;
              }
              const mdl = Math.sqrt(mdx * mdx + mdz * mdz) || 1;
              mdx /= mdl;
              mdz /= mdl;

              // (a) DE-SPLAY from the hip.
              // Rotate the entire leg at the hip about the world-vertical axis, so thigh, shin, foot and ski swing together and the foot's height is preserved (the sole stays on the snow, sliding a few cm).
              // The heading is read from the ski's flat length axis -- toe local X or Y, whichever is more parallel to markDir -- not ankle->toe, which goes nearly vertical and noisy in a deep tuck and over-rotates the feet into a cross.
              // Correcting at the foot alone would twist the ankle while the boot shaft, skinned to the shin, stays splayed.
              const aim = (1 - cb) * (1 - this.brakeBlend) * blend;
              if (aim > 1e-3) {
                L.toe.updateWorldMatrix(true, false); // fresh toe world matrix
                // Ski forward from the ski piece's end-to-end read when available, an axis the mesh itself defines.
                // Boot heading from the toe frame, not the ski piece.
                // The toe axis is read by the constant index chosen at load (see _resolveLegBones), so only the stable 180-degree direction flip remains per frame.
                const eT = L.toe.matrixWorld.elements,
                  ix = L.axIx || 0;
                let fX = eT[ix],
                  fZ = eT[ix + 2];
                if (fX * mdx + fZ * mdz < 0) {
                  fX = -fX;
                  fZ = -fZ;
                }
                const len = Math.sqrt(fX * fX + fZ * fZ); // horizontal length of the ski-forward axis
                if (len > 1e-4) {
                  fX /= len;
                  fZ /= len;

                  // signed yaw (world-up) carrying ski-forward -> markDir; same from,TO atan2 convention as the herringbone/snowplow blocks.
                  // Clamp guards a wild target.
                  const yaw =
                    clamp(
                      Math.atan2(fZ * mdx - fX * mdz, fX * mdx + fZ * mdz),
                      -CFG.MAX_LEG_DESPLAY,
                      CFG.MAX_LEG_DESPLAY,
                    ) * aim;
                  if (Math.abs(yaw) > 1e-4) {
                    _axis.set(0, 1, 0);
                    _qd.setFromAxisAngle(_axis, yaw);
                    this._rotateBoneWorld(L.hip, _qd); // whole leg swings from the hip; foot height kept
                    L.hip.updateWorldMatrix(false, true);
                  }
                }
              }

              // (b) flatten the ski -- last, so it's exact.
              // Per the GEAR_MOUNTS recipe the ski is flipped about the toe's vertical (local Z) axis, so the ski's up is the toe's local +Z, the 3rd column of its world matrix.
              // Rotate that onto the ground normal.
              // The Z sign is resolved against the normal, and a sanity gate (Z must read up-ish) makes this a safe no-op on any rig that doesn't match the mount.
              L.toe.updateWorldMatrix(true, false); // fresh after the de-splay above
              const e = L.toe.matrixWorld.elements;
              _v1.set(e[8], e[9], e[10]).normalize(); // ski sole-normal

                },
              ];
              this._settleArmed = false; // one settle per stop
            }
            if (cb < 0.1) {
              this._settleArmed = false; // left the gait entirely: disarm, drop any stale request
              this.settleReq = null;
            }
          }

          // Landing knee spring (see LAND_KNEE_GAIN) -- post-latch, additive, symmetric.
          {
            const tgt = Math.min(
              CFG.LAND_KNEE_MAX,
              (this._absorb || 0) * CFG.LAND_KNEE_GAIN,
            );
            const om = 2 * Math.PI * CFG.LAND_KNEE_FREQ;
            this._kneeSprV +=
              (om * om * (tgt - this._kneeSpr) -
                2 * CFG.LAND_KNEE_ZETA * om * this._kneeSprV) *
              _dtP;
            this._kneeSpr += this._kneeSprV * _dtP;
            const th = this._kneeSpr * CFG.LAND_KNEE_SIGN;
            if (Math.abs(th) > 1e-4) {
              _axis.set(this.rx, 0, this.rz).normalize(); // body right: pitch axis
              for (let li = 0; li < 2; li++) {
                const L = legs[li];
                _qd.setFromAxisAngle(_axis, -th);
                this._rotateBoneWorld(L.hip, _qd);
                _qd.setFromAxisAngle(_axis, th * 2);
                this._rotateBoneWorld(L.knee, _qd);
                _qd.setFromAxisAngle(_axis, -th);
                this._rotateBoneWorld(L.ankle, _qd);
                L.hip.updateWorldMatrix(false, true);
              }
            }
          }

          // Forearms carry a fraction for a natural follow-through.
          // lean is already smoothed (LEAN_LERP), so no extra easing.
          if (arms) {
            const tilt = clamp(
              -this.lean * CFG.ARM_LEAN_GAIN,
              -CFG.ARM_LEAN_MAX,
              CFG.ARM_LEAN_MAX,
            );
            const swinging =
              cb > 1e-3 && this._gait[0].mode && CFG.ARM_SWING !== 0;
            // Jump beats: fling up-forward at takeoff (fast pulse), brace forward on the landing dip.
            // One signed fore/aft angle shared by both arms.
            const jumpArm =
              this._jumpPulse * CFG.ARM_JUMP_FLING +
              this._absorb * CFG.ARM_LAND_CATCH;
            // What makes the arm block run at all, worth reading before adding anything to it: going straight and fast, tilt is ~0, swinging needs the climb blend, pb is outside the push band and jumpArm is 0 -- so every one of these can be false and the whole block skipped.
            const armSpeedTuck =
              (1 - cb) *
              CFG.ARM_TUCK *
              clamp(
                this.speed /
                  Math.max(1, CONFIG.SKIER.SPEED_MAX * CFG.ARM_TUCK_SPAN),
                0,
                1,
              );
            if (
              Math.abs(tilt) > 1e-4 ||
              swinging ||
              airT > 1e-3 ||
              pb > 1e-3 ||
              jumpArm > 1e-3 ||
              armSpeedTuck > 1e-4
            ) {
              _v1.set(fx, 0, fz).normalize(); // forward axis: lean counter-tilt
              _v2.set(rx, 0, rz).normalize(); // right axis: fore/aft pole-push swing
              for (let i = 0; i < 2; i++) {
                const A = arms[i];

                // Contralateral pole push: this arm mirrors the opposite leg's phase, so it reaches its forward plant exactly as that boot touches down (cos peaks at phase 0), drives back through the stance, and recovers during the swing.
                const sw = swinging
                  ? Math.cos(2 * Math.PI * this._gait[1 - i].phase) *
                    CFG.ARM_SWING *
                    cb *
                    strideAmt
                  : 0;
                let moved = false;
                if (Math.abs(tilt) > 1e-4) {
                  _qd.setFromAxisAngle(_v1, tilt);
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }
                if (Math.abs(sw) > 1e-4) {
                  _qd.setFromAxisAngle(_v2, sw);
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }
                if (jumpArm > 1e-3) {
                  _qd.setFromAxisAngle(_v2, jumpArm);
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }
                if (pb > 1e-3) {
                  // Double-pole: Both arms together (no contralateral split here) -- max forward reach at phase 0 (pole plant), drive back through the crunch.
                  _qd.setFromAxisAngle(
                    _v2,
                    Math.cos(2 * Math.PI * this._pushPhase) *
                      CFG.PUSH_ARM_AMP *
                      pb,
                  );
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }
                if (airT > 1e-3) {
                  // Flight tuck: both arms swing forward (about right) and adduct toward the front midline (about forward, opposite signs per side) -- compact and balanced, like bracing over the skis.
                  // Same gated ease as the feet.
                  // _rightLeg, not a separately measured _rightArm.
                  const adS = i === this.rightLeg ? 1 : -1;

                  // The forward swing carries a share of the air elbow lift, so the two are one gesture rather than two constants kept in agreement by hand.
                  // Flexing the elbow alone only raises the hand toward the shoulder -- the forearm comes up but stays beside the body, which reads as a shrug.
                  // Driving the shoulder from the same term sends the whole arm front as the forearm rises, which is the bracing shape, and means raising AIR_ELBOW brings the shoulder with it automatically.
                  const airFwd =
                    (CFG.AIR_ARM_FWD + CFG.AIR_ELBOW * CFG.AIR_ELBOW_FWD) *
                    airT;
                  _qd.setFromAxisAngle(_v2, airFwd);
                  this._rotateBoneWorld(A.up, _qd);
                  _qd.setFromAxisAngle(_v1, adS * CFG.AIR_ARM_IN * airT);
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }

                // Speed tuck -- the arms draw in toward the body as speed builds.
                // Same adduction axis as the flight tuck, mirrored per side, gated to the downhill pose so it never fights the climb's arm swing.
                if (armSpeedTuck > 1e-4) {
                  const tS = i === this.rightLeg ? 1 : -1;
                  _qd.setFromAxisAngle(_v1, tS * armSpeedTuck);
                  this._rotateBoneWorld(A.up, _qd);
                  moved = true;
                }

                if (moved) {
                  A.up.updateWorldMatrix(false, true);
                  if (Math.abs(tilt) > 1e-4) {
                    _qd.setFromAxisAngle(_v1, tilt * CFG.FOREARM_FOLLOW);
                    this._rotateBoneWorld(A.fore, _qd);
                  }
                  if (Math.abs(sw) > 1e-4) {
                    _qd.setFromAxisAngle(_v2, sw * CFG.FOREARM_FOLLOW);
                    this._rotateBoneWorld(A.fore, _qd);
                  }

                  // Tuck the forearms up, on the same speed term that draws the arms in, plus a flight term of its own.
                  // Flexion is sign-free: rotate elbow->hand toward elbow->shoulder.
                  // The air term is additive rather than a multiplier on the speed tuck, because a slow hop has armSpeedTuck near zero and a multiplier would scale nothing.
                  // It rides airT, the same eased blend the shoulder's flight tuck uses, so the lift fades over BLEND_TAU instead of stepping on takeoff and landing frames.
                  // Combined with AIR_ARM_FWD swinging the shoulder forward, this carries the forearms up and to the front.
                  const elbowTuck =
                    armSpeedTuck * CFG.ARM_TUCK_ELBOW + CFG.AIR_ELBOW * airT;
                  if (elbowTuck > 1e-4 && A.hand) {
                    A.fore.updateWorldMatrix(false, true);
                    A.fore.getWorldPosition(_armA);
                    A.up.getWorldPosition(_armB);
                    _armB.sub(_armA); // elbow -> shoulder
                    A.hand.getWorldPosition(_poleGrip);
                    _poleGrip.sub(_armA); // elbow -> hand
                    if (
                      _armB.lengthSq() > 1e-8 &&
                      _poleGrip.lengthSq() > 1e-8
                    ) {
                      _armB.normalize();
                      _poleGrip.normalize();
                      _axis.crossVectors(_poleGrip, _armB);
                      const sinE = _axis.length();

                      // Fade out as the arm approaches straight rather than cutting off: a colinear arm has no bend plane, and rotating about a noise axis is undefined.
                      if (sinE > 1e-6) {
                        _axis.multiplyScalar(1 / sinE);
                        const flex =
                          elbowTuck *
                          clamp(sinE / CFG.POLE_JOINT_MIN_SIN, 0, 1);
                        if (flex > 1e-4) {
                          _qd.setFromAxisAngle(_axis, flex);
                          this._rotateBoneWorld(A.fore, _qd);
                        }
                      }
                    }
                  }
                  A.fore.updateWorldMatrix(false, true);
                }

                // Pole-tip ground reach: drop the shoulder just enough to set this pole's tip on the snow under it.
                // Measured off the live tip and clamped, so it self-corrects to any terrain, and it runs whether or not the arm was re-posed above.
                // Weight by state -- climbing peaks at each contralateral plant and fades through the recovery swing so the pole lifts cleanly between steps; grounded carry is steady so the tips track the snow (modulated by the push plant while double-poling); airborne is released and the poles ride up in the tuck.
                const pole = this._polePieces && this._polePieces[i];

                // Grounded-only by design: a pole reaches for snow when there is snow under it.
                // Applied to the hand so it sweeps the pole without disturbing the arm the flight tuck just posed, and built vector-to-vector from the shaft's current direction so there is no sign to get wrong.
                // The airborne weight eases from the grounded one, not from zero -- ramping from 0 would leave the sweep at 0 on the takeoff frame and under half strength 100 ms later, which a short hop never outlasts, dropping the hand back to the authored mount where the poles stick out sideways.
                const tuckSweep =
                  Math.min(
                    1,
                    Math.sqrt(
                      clamp(armSpeedTuck / Math.max(1e-6, CFG.ARM_TUCK), 0, 1),
                    ) * CFG.POLE_TUCK_EARLY,
                  ) *
                  CFG.POLE_TUCK_SWEEP *
                  (1 - clamp(pb, 0, 1)); // yield to a double-pole push
                const airSweep =
                  !pole || !A.hand
                    ? 0
                    : this.airborne
                      ? tuckSweep +
                        (CFG.POLE_AIR_SWEEP - tuckSweep) *
                          clamp(1 - blend, 0, 1)
                      : tuckSweep;
                const trailRise = this.airborne
                  ? CFG.POLE_AIR_RISE
                  : CFG.POLE_TUCK_RISE;
                if (airSweep > 1e-3) {
                  A.hand.updateWorldMatrix(false, true);
                  _poleTip.copy(pole.tip);
                  pole.piece.localToWorld(_poleTip);
                  _poleGrip.setFromMatrixPosition(pole.piece.matrixWorld);
                  _armA.subVectors(_poleTip, _poleGrip); // the shaft, grip -> tip

                  // A waistline tuck: the pole runs back parallel to the body, and the width comes from where the hand sits, not from splaying the shaft outward.
                  // So the sweep is constrained to one axis -- the body's lateral -- which means the pole only pitches within the fore/aft-vertical plane it already occupies.
                  // Signed angle about that axis via atan2, so there is no direction to choose.
                  // It cannot move sideways, so it cannot cross the leg at any lean or turn angle.
                  _armA.addScaledVector(_v2, -_armA.dot(_v2)); // shaft, flattened into the plane
                  _armB.set(-fx, trailRise, -fz); // straight back along travel, a touch up
                  if (_armA.lengthSq() > 1e-6 && _armB.lengthSq() > 1e-8) {
                    _armA.normalize();
                    _armB.normalize();
                    _axis.crossVectors(_armA, _armB);
                    const sweep =
                      Math.atan2(_axis.dot(_v2), _armA.dot(_armB)) * airSweep;
                    if (Math.abs(sweep) > 1e-4) {
                      // Split across two joints, because this angle is large.
                      // Airborne the shaft starts near-vertical and the target is trailing-and-slightly-up, so `sweep` runs well over a radian; all of that on the wrist puts the hand at a right angle to the forearm, which reads as loose wrists.
                      // The wrist takes what a wrist can and the elbow takes the rest.
                      // Both rotations are about the same world axis, and rotations about a common axis commute and add, so the shaft lands exactly on target however the total is divided.
                      const wr = clamp(
                        sweep,
                        -CFG.POLE_SWEEP_WRIST_MAX,
                        CFG.POLE_SWEEP_WRIST_MAX,
                      );
                      _qd.setFromAxisAngle(_v2, wr);
                      this._rotateBoneWorld(A.hand, _qd);
                      const rest = clamp(
                        sweep - wr,
                        -CFG.POLE_SWEEP_ELBOW_MAX,
                        CFG.POLE_SWEEP_ELBOW_MAX,
                      );
                      if (Math.abs(rest) > 1e-4) {
                        _qd.setFromAxisAngle(_v2, rest);
                        this._rotateBoneWorld(A.fore, _qd);
                      }
                      A.fore.updateWorldMatrix(false, true); // covers the hand: it is a descendant
                    }
                  }
                }

                // (2) DE-SPLAY, about the vertical.
                // Outside the pitch's `airSweep` gate, which is the point: the states this fixes are exactly the ones where airSweep is 0.
                // The authored mount bakes in +/-0.75 rad of outward yaw and that is the fallback whenever nothing here runs.
                // How far the poles trail is a function of speed and flight; how far they splay is not, so this gets a floor of its own.
                // It does not yield to a double-pole push (that plants the poles parallel and forward, and yielding would hand the pose back to the splayed mount) but it does yield to the climb, where a herringbone splay is correct.
                const desplayW =
                  !pole || !A.hand
                    ? 0
                    : Math.max(
                        airSweep * CFG.POLE_TUCK_YAW,
                        CFG.POLE_DESPLAY_MIN * (1 - clamp(cb, 0, 1)),
                      );
                if (desplayW > 1e-3) {
                  A.hand.updateWorldMatrix(false, true);
                  _poleTip.copy(pole.tip);
                  pole.piece.localToWorld(_poleTip);
                  _poleGrip.setFromMatrixPosition(pole.piece.matrixWorld);
                  _armA.subVectors(_poleTip, _poleGrip);
                  const shaftLen = _armA.length();
                  _armA.y = 0; // horizontal plane only
                  const wide = i === this.rightLeg ? 1 : -1;
                  _armB.set(
                    -fx + rx * wide * CFG.POLE_TUCK_WIDE,
                    0,
                    -fz + rz * wide * CFG.POLE_TUCK_WIDE,
                  );

                  // A shaft hanging near-vertical has almost no horizontal projection, so its heading is numerically noise and yawing it would spin the pole on nothing.
                  // Fade out there instead: a hanging pole has no visible splay to correct anyway, and the pitch above is what lifts it out of that pose.
                  const flat = clamp(
                    Math.sqrt(_armA.lengthSq()) /
                      Math.max(1e-6, shaftLen * CFG.POLE_JOINT_MIN_SIN),
                    0,
                    1,
                  );
                  if (
                    _armA.lengthSq() > 1e-6 &&
                    _armB.lengthSq() > 1e-8 &&
                    flat > 1e-3
                  ) {
                    _armA.normalize();
                    _armB.normalize();
                    const yaw =
                      Math.atan2(
                        _armA.z * _armB.x - _armA.x * _armB.z,
                        _armA.x * _armB.x + _armA.z * _armB.z,
                      ) *
                      desplayW *
                      flat;
                    if (Math.abs(yaw) > 1e-4) {
                      // Sign verified by measurement, not by reasoning about handedness: the negative of this splays the poles wider instead of parallel.
                      // Split wrist/elbow on the same reasoning as the pitch above, about the shared vertical axis.
                      _axis.set(0, 1, 0); // yaw about world up
                      const wy = clamp(
                        yaw,
                        -CFG.POLE_SWEEP_WRIST_MAX,
                        CFG.POLE_SWEEP_WRIST_MAX,
                      );
                      _qd.setFromAxisAngle(_axis, wy);
                      this._rotateBoneWorld(A.hand, _qd);
                      const restY = clamp(
                        yaw - wy,
                        -CFG.POLE_SWEEP_ELBOW_MAX,
                        CFG.POLE_SWEEP_ELBOW_MAX,
                      );
                      if (Math.abs(restY) > 1e-4) {
                        _qd.setFromAxisAngle(_axis, restY);
                        this._rotateBoneWorld(A.fore, _qd);
                      }
                      A.fore.updateWorldMatrix(false, true);
                    }
                  }
                }

                // Is this pole in play at all?
                // Note what this is not: it is not "is the tip being driven down".
                // The solve also has to lift the tip clear during the forward recovery, and the recovery is precisely when the drive is zero -- gating on drive would switch the lift off exactly when it is needed and let the pole drag forward through the snow.
                const engaged = pole ? (swinging ? cb : 0) * blend : 0;
                const poleActive =
                  !!pole &&
                  !this.airborne &&
                  blend > 1e-3 &&
                  (swinging || pb > 0.1);
                // How hard the tip is driven into the snow, as opposed to poleActive which only says the pole is in play.
                // Same profile, but without strideAmt: a plant is a plant.
                const plantDepth = pole
                  ? (swinging
                      ? poleDrive(
                          this._gait[1 - i].phase,
                          CFG.POLE_PLANT_LEAD,
                          CFG.POLE_PUSH_END,
                          CFG.POLE_RELEASE,
                        ) * cb
                      : 0) * blend
                  : 0;
                // The one frame this pole is explicitly pushing off the ground.
                // Not gated on `this.climbing`, which is `_walking && speed > CLIMB_SOUND_SPEED` and a herringbone up a steep pitch is routinely slower than that; the gait uses `climbing || _walking || herringboneRest` to survive the same dropout (see wantHerringbone).
                const plantEdge =
                  !!pole &&
                  !this.airborne &&
                  airT < 0.5 &&
                  ((swinging &&
                    cb > 0.5 &&
                    strideAmt > CFG.STRIDE_ACTIVE &&
                    !!this._gait[1 - i].planted) ||
                    (pb > 0.1 && !!this._pushPlant));
                // Pole-tip REACH -- three weighted, clamped, extend-ONLY nudges (wrist, elbow, shoulder), not a solve.
                // See the block below for why each joint is there and what keeps this from contorting the arm the way an exact solve did.
                if (poleActive || plantEdge) {
                  A.up.updateWorldMatrix(false, true); // pole matrix reflects the full arm pose
                  _poleTip.copy(pole.tip);
                  pole.piece.localToWorld(_poleTip); // live world tip, pre-reach

                  // Where the tip belongs: pressed into the snow at full drive, held clear of it through the forward recovery, sliding continuously between as the profile ramps.
                  const drive = clamp(plantDepth, 0, 1);

                  // A planted pole does not MOVE.
                  // So latch the contact point in absolute world at the plant and hold the tip there for the rest of the drive.
                  let anchored = false;
                  A.up.getWorldPosition(_shoulderP);
                  if (drive > 1e-3 && this._poleAnchor[i]) {
                    const an = this._poleAnchor[i];
                    _norm.set(
                      an.x + frameOffX,
                      an.y + frameOffY,
                      an.z + frameOffZ,
                    );
                    A.fore.getWorldPosition(_elbowP);
                    A.hand.getWorldPosition(_poleGrip);
                    const span =
                      _shoulderP.distanceTo(_elbowP) +
                      _elbowP.distanceTo(_poleGrip) +
                      _poleGrip.distanceTo(_poleTip);
                    if (
                      _shoulderP.distanceTo(_norm) <
                      span * CFG.POLE_ANCHOR_KEEP
                    )
                      anchored = true;
                    else this._poleAnchor[i] = null; // out of reach: the pole comes out
                  }
                  if (drive <= 1e-3) this._poleAnchor[i] = null; // stroke over

                  const desiredY = anchored
                    ? _norm.y
                    : snowAt(_poleTip.x, _poleTip.z) +
                      CFG.POLE_RECOVER_LIFT * (1 - drive) -
                      CFG.POLE_PLANT_SINK * drive;
                  if (!anchored) _norm.set(_poleTip.x, desiredY, _poleTip.z);

                  // Never between the legs.
                  // A one-sided constraint on the lateral component only: measure how far outboard the target is along the body's right axis, and if it is inside the minimum, slide it out to exactly the minimum.
                  // A pole plants outboard of the body, on its own side, always -- planting inboard puts the shaft through the skier's own stride and there is no pose in which it is correct.
                  // The reach target is otherwise just "under wherever the tip happens to be", and the arm swing can carry that across the centreline.
                  {
                    const sgn = i === this.rightLeg ? 1 : -1; // this arm's own side
                    const cx = this.worldX + frameOffX,
                      cz = this.worldZ + frameOffZ; // body centreline, graph space
                    const lat =
                      ((_norm.x - cx) * rx + (_norm.z - cz) * rz) * sgn;
                    const push = CFG.POLE_PLANT_OUT - lat;
                    if (push > 0) {
                      _norm.x += rx * sgn * push;
                      _norm.z += rz * sgn * push;

                      // The snow height moved with it; re-sample so the tip is not asked to plant at the old spot's altitude on a slope.
                      if (!anchored)
                        _norm.y =
                          snowAt(_norm.x, _norm.z) +
                          CFG.POLE_RECOVER_LIFT * (1 - drive) -
                          CFG.POLE_PLANT_SINK * drive;
                    }
                  }

                  // How hard the reach acts this frame.
                  // Pressing down scales with the drive; lifting clear on the recovery uses POLE_LIFT_GAIN.
                  // Branching on direction costs nothing in continuity, because every rotation below goes to zero at the crossover anyway.
                  const w = anchored
                    ? drive
                    : _poleTip.y > desiredY
                      ? drive
                      : CFG.POLE_LIFT_GAIN * engaged;

                  // A weighted, clamped nudge on three joints -- wrist, elbow, shoulder, in that order.
                  // The shoulder alone cannot get there and the geometry says why: a shoulder rotation sweeps the tip along a sphere, so it changes the tip's direction but never its distance, and on this rig the plant sits ~0.2 m outside that sphere.
                  // Every delta is clamped to [0, max]: these joints can straighten to help the tip down and can never fold.
                  const eMax = CFG.POLE_ELBOW_MAX * w,
                    wMax = CFG.POLE_WRIST_MAX * w;
                  if (w > 1e-4 && A.hand && (eMax > 1e-4 || wMax > 1e-4)) {
                    A.fore.getWorldPosition(_elbowP);
                    A.hand.getWorldPosition(_poleGrip);

                    // _norm is the target, already set above: the latched anchor while the pole is planted, or the snow under the tip otherwise.
                    // D is the only thing the joints below are solving against, and each asks for exactly the angle that would make its own segment reach it, then takes whatever the clamp allows.
                    const D = _shoulderP.distanceTo(_norm);
                    const short = D - _shoulderP.distanceTo(_poleTip);
                    const P1 = _shoulderP.distanceTo(_elbowP); // upper arm, fixed by the rig

                    if (short > 1e-3 && wMax > 1e-4) {
                      _armA.subVectors(_elbowP, _poleGrip); // wrist -> elbow
                      _armB.subVectors(_poleTip, _poleGrip); // wrist -> tip
                      const la = _armA.length(),
                        lb = _armB.length();
                      if (la > 1e-4 && lb > 1e-4) {
                        // The elbow->tip length that would make the chain span D at the current elbow angle, then the wrist angle that produces that length.
                        // Both are one inversion of the law of cosines; no tuning constant in sight.
                        const cE = clamp(
                          (P1 * P1 +
                            _elbowP.distanceToSquared(_poleTip) -
                            D * D) /
                            (2 * P1 * _elbowP.distanceTo(_poleTip)),
                          -1,
                          1,
                        );
                        const disc = P1 * P1 * cE * cE - P1 * P1 + D * D;
                        const p2Need =
                          disc > 0 ? P1 * cE + Math.sqrt(disc) : la + lb;
                        const cosNeed = clamp(
                          (la * la + lb * lb - p2Need * p2Need) / (2 * la * lb),
                          -1,
                          1,
                        );
                        const thNow = _armA.angleTo(_armB);
                        _armA.multiplyScalar(1 / la);
                        _armB.multiplyScalar(1 / lb);
                        _axis.crossVectors(_armA, _armB);
                        const sinA = _axis.length();
                        if (sinA > 1e-6) {
                          _axis.multiplyScalar(1 / sinA);

                          // Fade out as the joint approaches straight rather than cutting off at a threshold: a hard cutoff makes the pose jump between "nudged" and "untouched" on consecutive frames whenever it hovers near the line.
                          const fade = clamp(
                            sinA / CFG.POLE_JOINT_MIN_SIN,
                            0,
                            1,
                          );
                          const dW = clamp(
                            Math.acos(cosNeed) - thNow,
                            0,
                            wMax * fade,
                          );
                          if (dW > 1e-4) {
                            _qd.setFromAxisAngle(_axis, dW);
                            this._rotateBoneWorld(A.hand, _qd);
                            A.hand.updateWorldMatrix(false, true);
                            _poleTip.copy(pole.tip);
                            pole.piece.localToWorld(_poleTip);
                          }
                        }
                      }
                    }

                    // (b) elbow -- straighten a little more.
                    // Same rules, smaller budget.
                    const short2 = D - _shoulderP.distanceTo(_poleTip);
                    if (short2 > 1e-3 && eMax > 1e-4) {
                      _armA.subVectors(_shoulderP, _elbowP); // elbow -> shoulder
                      _armB.subVectors(_poleTip, _elbowP); // elbow -> tip
                      const la = _armA.length(),
                        lb = _armB.length();
                      if (la > 1e-4 && lb > 1e-4) {
                        const eNow = _armA.angleTo(_armB);

                        // Never straighten fully: a human elbow does not hyperextend, and the bend axis is a cross product that becomes undefined when the segments are colinear.
                        const room = Math.max(
                          0,
                          Math.PI - CFG.POLE_ELBOW_MIN_BEND - eNow,
                        );
                        _armA.multiplyScalar(1 / la);
                        _armB.multiplyScalar(1 / lb);
                        _axis.crossVectors(_armA, _armB);
                        const sinA = _axis.length();
                        if (sinA > 1e-6) {
                          _axis.multiplyScalar(1 / sinA);
                          const fade = clamp(
                            sinA / CFG.POLE_JOINT_MIN_SIN,
                            0,
                            1,
                          );

                          // Elbow angle that spans D with the segment lengths as they now are.
                          const cosNeed = clamp(
                            (la * la + lb * lb - D * D) / (2 * la * lb),
                            -1,
                            1,
                          );
                          const dE = Math.min(
                            clamp(Math.acos(cosNeed) - eNow, 0, eMax * fade),
                            room,
                          );
                          if (dE > 1e-4) {
                            _qd.setFromAxisAngle(_axis, dE);
                            this._rotateBoneWorld(A.fore, _qd);
                            A.fore.updateWorldMatrix(false, true);
                            _poleTip.copy(pole.tip);
                            pole.piece.localToWorld(_poleTip);
                          }
                        }
                      }
                    }
                  }

                  if (w > 1e-4) {
                    A.up.getWorldPosition(_shoulderP);
                    _tgt.subVectors(_poleTip, _shoulderP); // shoulder -> tip now
                    _armA.subVectors(_norm, _shoulderP); // -> where it belongs
                    const lc = _tgt.length(),
                      ld = _armA.length();
                    if (lc > 1e-4 && ld > 1e-4) {
                      _tgt.multiplyScalar(1 / lc);
                      _armA.multiplyScalar(1 / ld);
                      _axis.crossVectors(_tgt, _armA);
                      const al = _axis.length();
                      if (al > 1e-5) {
                        _axis.multiplyScalar(1 / al);
                        const ang =
                          Math.min(
                            Math.acos(clamp(_tgt.dot(_armA), -1, 1)),
                            CFG.POLE_REACH_MAX,
                          ) * w;
                        if (ang > 1e-4) {
                          _qd.setFromAxisAngle(_axis, ang);
                          this._rotateBoneWorld(A.up, _qd);
                          A.up.updateWorldMatrix(false, true);
                        }
                      }
                    }
                  }

                  // Stamp the dimple on the plant edge, at the post-reach tip.
                  // The edge is a real event, so this is one dab per plant by construction.
                  // POLE_CONTACT_MAX is a real veto, not a formality: a mark is a claim that the tip touched, and laying one while the pole is visibly in the air is the animation lying about itself.
                  if (plantEdge) {
                    _poleTip.copy(pole.tip);
                    pole.piece.localToWorld(_poleTip); // live graph-space tip, after the reach above

                    // A mark is a claim that the tip touched.
                    // Measured along the shaft, which is the only measure that means anything here: it is how far the pole would still have to travel, in the direction it is actually pointing, to reach the snow.
                    // Height above the terrain is not that -- a raked pole 7 cm up vertically is ~15 cm from touching.
                    // The search is capped at the contact threshold for the same reason.
                    _poleGrip.setFromMatrixPosition(pole.piece.matrixWorld);
                    _poleDir.copy(_poleTip).sub(_poleGrip);
                    let px = _poleTip.x,
                      pz = _poleTip.z,
                      reach = Infinity;
                    if (_poleDir.lengthSq() > 1e-8) {
                      _poleDir.normalize();
                      const gap = (t) =>
                        _poleTip.y +
                        _poleDir.y * t -
                        snowAt(
                          _poleTip.x + _poleDir.x * t,
                          _poleTip.z + _poleDir.z * t,
                        );
                      const cap = CFG.POLE_CONTACT_MAX;
                      if (gap(0) <= 0) {
                        reach = 0; // tip already in the snow
                      } else if (_poleDir.y < -0.05 && gap(cap) < 0) {
                        let lo = 0,
                          hi = cap;
                        for (let k = 0; k < 8; k++) {
                          const mid = (lo + hi) * 0.5;
                          if (gap(mid) > 0) lo = mid;
                          else hi = mid;
                        }
                        reach = (lo + hi) * 0.5;
                        px += _poleDir.x * reach;
                        pz += _poleDir.z * reach;
                      }
                    }

                    // And again here, on the point that is actually stamped and latched.
                    // The reach is clamped and may not fully arrive at the outboard target above, so the tip itself can still be inside the centreline -- and this is the point the mark and the anchor are built from, so it is the one that has to be right.
                    {
                      const sgn = i === this.rightLeg ? 1 : -1;
                      const cx = this.worldX + frameOffX,
                        cz = this.worldZ + frameOffZ;
                      const push =
                        CFG.POLE_PLANT_OUT -
                        ((px - cx) * rx + (pz - cz) * rz) * sgn;
                      if (push > 0) {
                        px += rx * sgn * push;
                        pz += rz * sgn * push;
                      }
                    }
                    if (reach <= CFG.POLE_CONTACT_MAX) {
                      if (this.pokeReqN < this.pokeReq.length) {
                        const pq = this.pokeReq[this.pokeReqN++];
                        pq.x = px - frameOffX;
                        pq.z = pz - frameOffZ;
                      }
                      // Latch the plant.
                      // The tip is held here for the rest of the push (see the anchor block in the reach), stored in absolute world so it stays put while the skier travels past it.
                      // Deliberately the same point the mark was stamped at, so the dab and the pole cannot drift apart during the stroke.
                      this._poleAnchor[i] = {
                        x: px - frameOffX,
                        y: _poleTip.y - frameOffY,
                        z: pz - frameOffZ,
                      };
                    } else this._poleAnchor[i] = null; // no contact, nothing to hold on to
                  }
                }
              }
            }
          }
          // Publish the eye.
          // Last statement on purpose: every bone write above is part of the pose, and a tuck carries the head ~0.5 m forward and down, so sampling earlier parks the eye above the skier's own back.
          // Computed here rather than by the camera because "after the rig has finished" is an invariant of this method, and three refreshes bone world matrices lazily at render.
          if (this._head) {
            const hb = this._head.bone;
            // One ancestor walk, not two.
            // getWorldQuaternion internally calls updateWorldMatrix(true, false) before decomposing, so doing it first here walked hips -> spine -> chest -> neck -> head twice every frame for the same answer.
            hb.getWorldQuaternion(_eyeQ);

            // Rigid attachment: the offset is stated in world terms, un-rotated by the head's orientation once, and thereafter rides the bone.
            // Derived rather than hand-authored per rig.
            if (this._eyeLocal === null) {
              const CC = CONFIG.CAMERA;
              this._eyeLocal = new Vector3(
                this.fx * CC.FPS_FWD,
                CC.FPS_UP,
                this.fz * CC.FPS_FWD,
              ).applyQuaternion(_eyeQ.clone().invert());
            }

            this.eyeOffset.setFromMatrixPosition(hb.matrixWorld);
            // Re-express the baked local offset in world using the head's current orientation: the lens tracks the face through every stance, and through the heading too, since the heading is part of that same orientation.
            this.eyeOffset.add(
              _eyeTmp.copy(this._eyeLocal).applyQuaternion(_eyeQ),
            );
            _eyeTmp.setFromMatrixPosition(this.group.matrixWorld);
            this.eyeOffset.sub(_eyeTmp); // both carry the same rebase, so it cancels exactly

            // Validated at the source, where the number still means something.
            // A head sits ~1.5 m from the skier's origin; larger means the offset is wrong, and the written form rejects NaN too.
            // Invalid just means the camera stays in third person -- a refused mode change is a far better failure than a camera flung somewhere arbitrary, which stalls the streaming systems.
            const m = CONFIG.SKIER.EYE_MAX_OFFSET;
            this.eyeValid =
              Math.abs(this.eyeOffset.x) < m &&
              Math.abs(this.eyeOffset.y) < m &&
              Math.abs(this.eyeOffset.z) < m;
            if (!this.eyeValid)
              warnOnce(
                "eye.offset",
                `head offset out of range (${this.eyeOffset.x.toFixed(2)}, ${this.eyeOffset.y.toFixed(2)}, ${this.eyeOffset.z.toFixed(2)}); first person refused`,
              );
          } else this.eyeValid = false;
        }
      }

      // ============================================================================
      // Two carving ribbons trailing the skis, a sub-system of SnowDecals below.
      // History is kept in float64 world coords; each frame the verts are rebuilt as small player-relative offsets, since the shared decal mesh sits at the player, so it stays float32-clean at 1 AU.
      // ============================================================================
      // Seamless 2-octave value-noise tile for decal edge erosion, generated at boot straight into ImageData: this is data, not a picture.
      // R is medium noise (16+32 lattice) driving the outline wander; G is fine noise (64 lattice) for crystal speckle.
      // Both in one texel, so the fragment shader pays one fetch for two fields.
      // Lattice indices wrap modulo their own cell count -- the field is sampled by world position, so a seam would show as a grid across the whole mountain.
      // Mipmapped on purpose: distant tracks average to a flat 0.5, so the edge straightens instead of shimmering.
      function makeEdgeNoiseTexture() {
        const N = 128;
        const c = document.createElement("canvas");
        c.width = c.height = N;
        const g = c.getContext("2d");
        const img = g.createImageData(N, N);
        const rnd = mulberry32(0xed6e01);
        const lattice = (cells) => {
          const a = new Float32Array(cells * cells);
          for (let i = 0; i < a.length; i++) a[i] = rnd();
          return a;
        };
        const L16 = lattice(16),
          L32 = lattice(32),
          L64 = lattice(64);
        const smooth = (t) => t * t * (3 - 2 * t);
        const samp = (a, cells, u, v) => {
          const x = u * cells,
            y = v * cells;
          const x0 = Math.floor(x),
            y0 = Math.floor(y);
          const fx = smooth(x - x0),
            fy = smooth(y - y0);
          const i0 = ((x0 % cells) + cells) % cells,
            i1 = (i0 + 1) % cells;
          const j0 = ((y0 % cells) + cells) % cells,
            j1 = (j0 + 1) % cells;
          const b =
            a[j0 * cells + i0] + (a[j0 * cells + i1] - a[j0 * cells + i0]) * fx;
          const t =
            a[j1 * cells + i0] + (a[j1 * cells + i1] - a[j1 * cells + i0]) * fx;
          return b + (t - b) * fy;
        };
        for (let y = 0; y < N; y++) {
          for (let x = 0; x < N; x++) {
            const u = x / N,
              v = y / N;
            const r = samp(L16, 16, u, v) * 0.65 + samp(L32, 32, u, v) * 0.35;
            const fine = samp(L64, 64, u, v);
            const o = (y * N + x) * 4;
            img.data[o] = clamp(r * 255, 0, 255) | 0;
            img.data[o + 1] = clamp(fine * 255, 0, 255) | 0;
            img.data[o + 2] = 0;
            img.data[o + 3] = 255;
          }
        }
        g.putImageData(img, 0, 0);
        const tex = new CanvasTexture(c);

        // Left in the default (no) colour space deliberately: these channels are numbers, and an sRGB decode would silently bend the noise distribution.
        tex.wrapS = tex.wrapT = RepeatWrapping;
        tex.minFilter = LinearMipmapLinearFilter;
        tex.magFilter = LinearFilter;
        tex.generateMipmaps = true;
        return tex;
      }

      function makeSnowDecalMaterial(opacity) {
        const T = CONFIG.TRACKS;

        // Merge the light/shadow block first, then hang the decal's own uniforms off the result: merge deep-clones what it is handed, and cloning a texture would upload a second copy of it for nothing.
        const uniforms = UniformsUtils.merge([UniformsLib.lights]);
        uniforms.uOpacity = { value: opacity };
        uniforms.uShadowDim = { value: T.SHADOW_DIM };
        uniforms.uEdgeNoise = { value: makeEdgeNoiseTexture() };
        uniforms.uNoisePeriod = { value: T.EDGE_PERIOD };
        uniforms.uEdgeBite = { value: T.EDGE_BITE };
        uniforms.uEdgeSoft = { value: T.EDGE_SOFT };
        uniforms.uEdgeGrain = { value: T.EDGE_GRAIN };
        uniforms.uCornerR = { value: T.EDGE_CORNER };
        uniforms.uEdgeFine = { value: T.EDGE_FINE };

        // The floating-origin offset, refreshed once per frame in render().
        // See the vertex shader for why one vec2 is enough to anchor the field at 1 AU.
        uniforms.uNoiseOrigin = { value: new Vector2() };
        return new ShaderMaterial({
          lights: true,
          transparent: true,
          depthWrite: false,
          side: DoubleSide,
          vertexColors: true,
          uniforms,
          vertexShader: `
            #include <common>
            #include <color_pars_vertex>
            #include <shadowmap_pars_vertex>
            attribute float aFeather;   // per-vertex edge alpha (1 = solid, 0 = faded edge)
            attribute float aEdge;      // per-vertex INSET: 0 on the mark's outer boundary, 1 at the groove pair. Static -- written once at boot, never touched again.
            attribute float aSpan;      // position ALONG the mark: -1 at one end, +1 at the other, 0 for the carve ribbon (which has no ends worth rounding). Static.
            attribute float aAspect;    // THIS mark's half-length measured in its own lateral-inset spans. Constant across a mark; written when the mark is rebuilt.
            varying float vFeather;
            varying float vEdge;
            varying float vSpan;
            varying float vAspect;
            varying vec2  vNoiseUV;
            uniform vec2  uNoiseOrigin;
            uniform float uNoisePeriod;
            void main() {
              #include <color_vertex>
              #include <beginnormal_vertex>
              #include <defaultnormal_vertex>
              #include <begin_vertex>
              #include <project_vertex>
              #include <worldpos_vertex>
              #include <shadowmap_vertex>
              vFeather = aFeather;
              vEdge = aEdge;
              vSpan = aSpan;
              vAspect = aAspect;
              // World-anchoring the noise at 1 AU, for the price of one vec2.
              // The field has to be pinned to the snow: keyed to anything camera-relative it would crawl across the ground as the skier moves, and the whole illusion is that the mark was pressed into a surface that already had texture.
              // A float32 world position is useless out here, but none is needed: the rebase in render() puts the eye at the origin, so this vertex's position is (absolute - renderOrigin), which is metres and exact.
              // Adding back renderOrigin modulo the tile period restores the absolute coordinate to within one tile, and one tile is all a repeating texture can tell apart.
              // Both halves of that subtraction happen in float64 on the CPU before anything is truncated.
              vec4 wp = modelMatrix * vec4( position, 1.0 );
              vNoiseUV = ( wp.xz + uNoiseOrigin ) / uNoisePeriod;
            }`,
          fragmentShader: `
            #include <common>
            #include <color_pars_fragment>
            #include <shadowmap_pars_fragment>
            uniform float uOpacity;
            uniform float uShadowDim;
            uniform sampler2D uEdgeNoise;
            uniform float uEdgeBite;
            uniform float uEdgeSoft;
            uniform float uEdgeGrain;
            uniform float uCornerR;
            uniform float uEdgeFine;
            varying float vFeather;
            varying float vEdge;
            varying float vSpan;
            varying float vAspect;
            varying vec2  vNoiseUV;
            void main() {
              // r184 directional shadows are a hardware depth texture (sampler2DShadow): texture(map, vec3(uv, refDepth)) runs the compare on the GPU, giving 1.0 lit and 0.0 shadowed, PCF-fractional at edges.
              // No packing, getShadow or getShadowMask -- those are the version-fragile bits.
              float sh = 1.0;
              #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
                vec3 sc = vDirectionalShadowCoord[ 0 ].xyz / vDirectionalShadowCoord[ 0 ].w;
                if ( sc.x >= 0.0 && sc.x <= 1.0 && sc.y >= 0.0 && sc.y <= 1.0 && sc.z <= 1.0 ) {
                  sh = texture( directionalShadowMap[ 0 ], vec3( sc.xy, sc.z + directionalLightShadows[ 0 ].shadowBias ) );
                }
              #endif
              float lit = mix( uShadowDim, 1.0, sh );
              // Organic edge, in two parts.
              // vEdge is a straight ramp from the mark's boundary inward, so the level set vEdge == 0 is exactly the straight silhouette to be rid of.
              // Displacing the cut rather than the alpha is what reads as broken snow instead of a soft blur: inside the cut the mark keeps its full authored opacity, and the boundary itself is what wanders.
              // Geometry can only be taken away, so the cut eats inward by 0..uEdgeBite and the mean edge sits half a bite inside the authored boundary -- raise TRACKS.W_OUT by that much to restore the mean width.
              // Rounded ends, out of two rows of vertices.
              // vEdge measures inward from the long sides only, so on its own it leaves the ends as a straight cut meeting those sides at a hard corner.
              // A rib strip is two rows, and anything interpolated between two rows is monotone, so no per-vertex value can rise from one end and fall to the other.
              // Folding it in the fragment can: aSpan runs -1..+1 along the mark, and abs() turns that ramp into a tent that is 0 at both ends.
              // No extra vertices, no index-buffer change.
              // The scale factor is per mark, not global.
              // vEdge is in units of the mark's own side-to-groove span, so the along-mark distance must be expressed the same way, and that conversion is the mark's aspect, which is not a constant: a herringbone rib is about 4 of its own lateral spans from centre to end, a pole dab is under 1.
              // Driving both from the rib's number would round a dab's corner five times too small to see.
              float endIn = ( 1.0 - abs( vSpan ) ) * vAspect;

              // Combine the two inset distances.
              // A plain min() is the Chebyshev distance, whose level set turns a square corner -- exactly the artefact being removed.
              // This is the rounded-rectangle distance instead: away from a corner it reduces to whichever boundary is nearer, and where both run out it is the Euclidean distance to an arc of radius uCornerR.
              vec2 shortfall = vec2( uCornerR - min( vEdge, uCornerR ),
                                     uCornerR - min( endIn, uCornerR ) );
              float inset = uCornerR - length( shortfall );

              vec2 nz = texture2D( uEdgeNoise, vNoiseUV ).rg;
              // Coarse wander, plus a signed dose of the fine octave.
              // The coarse field is deliberately larger than a small mark, so on its own it hands a dab one almost-uniform value and the edge comes back straight; the fine octave is what gives a mark this size anything to break up along.
              float cut = uEdgeBite * clamp( nz.r + uEdgeFine * ( nz.g - 0.5 ), 0.0, 1.0 );
              // The same wandering cut now bites the rounded outline as a whole, so the ends break up like the sides rather than reading as a machined fillet.
              float ragged = smoothstep( cut, cut + uEdgeSoft, inset );

              // Second octave, already in the green channel of the texel just fetched: a fine speckle over the whole mark.
              // A pressed print is crystals, not paint, and this is the difference between an edge that is merely irregular and a surface that looks granular.
              // It lands on both alpha and colour, since density and shading vary together in real snow.
              float grain = 1.0 - uEdgeGrain * nz.g;

              // aFeather fades edges to TRUE transparency (not snow-colour), so densely overlapping herringbone ribs blend instead of erasing each other.
              // It also carries each system's baked base opacity (carve 0.72 constant; ribs 0.78 x their soft-lens pattern).
              gl_FragColor = vec4( vColor.rgb * lit * mix( 1.0, grain, 0.5 ), vFeather * uOpacity * ragged * grain );
              // Match the renderer's output (SRGBColorSpace, no tone mapping).
              #include <colorspace_fragment>
            }`,
        });
      }

      class SkiTracks {
        // Sub-system of SnowDecals, which owns the geometry, material and mesh.
        // This class lays points and writes the carve verts into its region of the shared buffers; the layer emits the indices in global chronological order so carve segments and herringbone ribs interleave correctly.
        constructor(layer, vertBase) {
          const T = CONFIG.TRACKS;
          this.layer = layer;
          this.base = vertBase; // first vert of the carve region in the shared buffers
          this.maxPts = T.MAX_POINTS;
          this.pts = [];
          this._lastX = null;
          this._lastZ = null;

          // 4 cross verts per ski (berm | groove | groove | berm), 2 skis, point-major layout.
          this.cross = 4;
          this._groove = new Color(T.GROOVE);
          this._berm = new Color(T.BERM);
          this._fade = new Color(T.SNOW_FADE);
          this._tmp = new Color();
          this._offs = new Float32Array(4); // reused per vertex-column in the rebuild; never allocates
          this._latOff = new Float32Array(4); // lay-time scratch for the 4 lateral footprints (no per-point alloc)
