      class Forest {
        constructor(scene) {
          const C = CONFIG.FOREST;
          this.C = C;
          this.poolTrees = C.POOL; // slots in each variant's InstancedMesh
          this.maxVisible = C.MAX_VISIBLE; // trees bound across all variants per frame
          this._warnedSaturated = false;
          this.group = new Group();
          scene.add(this.group);

          // One card, bent into a cylinder: CARD_COLS columns, two rows, 2*(CARD_COLS-1) triangles.
          // A flat card is a plane, and a plane cut by a surface meets it along a straight line -- so a flat card's base is a ruler-straight edge where it enters the snow, and a flat card's shadow has a ruler-straight near boundary for exactly the same reason. Both are geometric; no shading fixes either.
          // Bowing the card toward its own front turns both into curves at once, because a curved surface meets the snow along a curve and casts a footprint rather than a strip.
          // The bow is a parabola and not a circular arc on purpose: a circle's slope goes vertical at the rim, which turns the outermost columns edge-on to the viewer and squeezes the outer boughs into sub-pixel slivers. A parabola's slope is bounded everywhere.
          // three's shadow pass swaps in its own depth material and never runs this vertex shader, so the eye gets a camera-facing billboard while the sun gets the raw buffer at the instance's rest yaw (TREE_SUN_YAW, square to the sun's azimuth) -- and the bow is baked into that buffer, so it serves both without either knowing about the other.
          // A conifer is rotationally symmetric about its trunk, so its profile from the sun is its silhouette from any azimuth: one aimed card carries the whole tree, and extra cards would only add seams and per-card opacity.
          const cols = C.CARD_COLS;
          const pos = new Float32Array(cols * 2 * 3);
          const uv = new Float32Array(cols * 2 * 2);
          for (let i = 0; i < cols; i++) {
            const f = i / (cols - 1); // 0..1 across the card
            const t = f * 2 - 1; // -1..1, so the bow peaks at the trunk
            const x = f - 0.5;
            const z = C.CARD_BOW * (1 - t * t);
            for (let r = 0; r < 2; r++) {
              const k = i * 2 + r;
              pos[k * 3] = x;
              pos[k * 3 + 1] = r; // 0 at the foot, 1 at the leader
              pos[k * 3 + 2] = z;
              uv[k * 2] = f;
              uv[k * 2 + 1] = r;
            }
          }
          // u stays linear in the column, so the painting is laid on by arc length rather than by screen width: the outer columns compress as they turn away, which is what a cylinder does and is half of why the bow reads as volume.
          const idx = new Uint16Array((cols - 1) * 6);
          for (let i = 0; i < cols - 1; i++) {
            const a = i * 2;
            idx.set([a, a + 2, a + 3, a, a + 3, a + 1], i * 6);
          }
          const geo = new BufferGeometry();
          geo.setAttribute("position", new BufferAttribute(pos, 3));
          geo.setAttribute("uv", new BufferAttribute(uv, 2));
          geo.setIndex(new BufferAttribute(idx, 1));

          // One uniform object, shared by reference across every variant's material.
          // three uploads whatever the object holds at draw time, so a single assignment per frame drives all NUM_SHAPES materials -- no loop, no per-material bookkeeping.
          this._uWind = { value: 0 };

          // A few texture variants; one InstancedMesh per variant (a tree picks by seed).
          this.textures = [];
          this.meshes = [];
          for (let s = 0; s < C.NUM_SHAPES; s++) {
            const tex = createConiferTexture(0x1234 + s * 2654435761);
            const mat = this._material(tex, this._uWind);
            const mesh = new InstancedMesh(geo, mat, this.poolTrees);
            mesh.instanceMatrix.setUsage(DynamicDrawUsage);
            mesh.frustumCulled = false;
            mesh.count = 0;

            // Cast, don't receive -- the silhouette half of the shadow.
            // The card supplies the dappled needle edges; the cone proxy built below supplies the ground footprint the card cannot have.
            // The atlas is fitted to the skier and now holds only the skier: everything static in this world has its shadow drawn instead (see ShadowDecals), which is what keeps the two from ever meeting at a seam.
            // A caster that also had a decal would darken the same snow twice wherever they overlapped, and no ramp between them can be right -- a shadow map is a binary occlusion test and an alpha ramp is not, so the two disagree in shape as well as in tone.
            mesh.castShadow = false;
            mesh.receiveShadow = false;
            this.group.add(mesh);
            this.textures.push(tex);
            this.meshes.push(mesh);
          }

          // Projected shadows for the trees the atlas no longer reaches. Parented to the same group, so it shares the cell-corner anchor and the streaming pass fills it in the loop that places the cards.
          this.shadows = new ShadowDecals(this.group, C.MAX_VISIBLE);
          this.shadows.setTexture(this.textures[0]);

          // Recomputed every update; initialised here so a read before the first stream cannot produce a NaN that would propagate into the skier's colour.
          this._sunShade = 1;

          this._m = new Matrix4();
          this._q = new Quaternion();
          this._pos = new Vector3();
          this._scl = new Vector3();
          this._slotCount = new Int32Array(C.NUM_SHAPES);

          // Reused per-cell PRNG (allocation-free): reseeded for each cell in update()/nearbyObstacles().
          this._rand = makeMulberry32();
        }

        _material(tex, uWind) {
          const C = CONFIG.FOREST;
          const sd = CONFIG.SKY.SUN_DIR;
          const wd = C.WIND_DIR;
          const wlen = len2(wd.x, wd.z) || 1;
          const mat = new ShaderMaterial({
            uniforms: {
              map: { value: tex },
              tint: { value: new Color(...C.LIGHT_TINT) },
              bright: { value: C.BRIGHT_LIFT },
              viewRadius: { value: C.VIEW_RADIUS },
              fogColor: { value: new Color(CONFIG.SKY.FOG) },
              fogDensity: { value: CONFIG.SKY.FOG_DENSITY },
              // Sun is a fixed world-space constant, so this is set once and never touched again.
              sunDir: {
                value: new Vector3(sd.x, sd.y, sd.z).normalize(),
              },
              canopyUp: { value: C.CANOPY_UP },
              aoBase: { value: C.AO_BASE },
              aoCore: { value: C.AO_CORE },
              aoCoreW: { value: C.AO_CORE_WIDTH },
              // Shared object -- Forest.update writes uWind.value once and every variant sees it.
              wind: uWind,
              windAmp: { value: C.WIND_AMP },
              windW: { value: (Math.PI * 2 * C.WIND_CYCLES) / WIND_T_WRAP },
              windDir: {
                value: new Vector3(wd.x / wlen, 0, wd.z / wlen),
              },
              shadeMin: { value: C.SHADE_MIN },
              shadeMax: { value: C.SHADE_MAX },
              cutBase: { value: C.CUT_BASE },
              cutSoft: { value: C.CUT_SOFT },
            },
            vertexShader: `
              uniform float viewRadius; uniform float canopyUp;
              uniform float wind; uniform float windAmp; uniform float windW; uniform vec3 windDir;
              varying vec2 vUv; varying float vFogDist; varying float vFar;
              varying float vRad; varying vec3 vN;
              void main() {
                vUv = uv;

                // Instance origin and size, straight out of the instance matrix.
                // Column LENGTHS rather than the matrix itself: the scale is (wide, height, wide) and what is wanted here is the two magnitudes, not a transform.
                vec3 instW = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
                float sw = length(instanceMatrix[0].xyz);
                float sh = length(instanceMatrix[1].xyz);

                // Y-axis billboard: turn the card about the trunk to face the camera, world up stays up.
                // A conifer is rotationally symmetric about its trunk, so this rotation is the one thing about a billboard you cannot see -- the silhouette is the same at every yaw.
                // That is what makes a single card sufficient, and a single card removes every angle-dependent artifact at once.
                vec2 toCam = cameraPosition.xz - instW.xz;
                float dl = length(toCam);
                vec2 f = dl > 1e-4 ? toCam / dl : vec2(0.0, 1.0); // degenerate only from directly overhead
                vec3 right = vec3(f.y, 0.0, -f.x);

                float u = position.x;   // -0.5 .. 0.5 across the card
                float v = uv.y;         // 0 at the foot .. 1 at the leader

                // position.z is the baked bow, and it has to be re-applied along f rather than ignored.
                // This shader rebuilds the vertex from the instance origin instead of transforming the buffer, so anything left out of this expression simply does not exist for the eye -- and the bow is precisely what makes the card meet the snow along a curve and sort against its own near foliage instead of its axis.
                // f is the horizontal direction to the camera, so the bow always leans toward the viewer, exactly as the depth pass has it leaning toward the sun.
                vec3 fwd = vec3(f.x, 0.0, f.y); // f is the xz pair; right is already its perpendicular
                vec3 wp = instW + right * (u * sw) + fwd * (position.z * sw)
                        + vec3(0.0, v * sh, 0.0);

                // Idle sway, in world space so the whole forest leans one way.
                // Phase comes from the instance scale, not its position: the floating-origin rebase rewrites instance translations as the player crosses cells, and hashing those would jump every tree's phase at the seam.
                // Height and width are per-tree randoms that never change.
                float ph = fract(sin(sh * 12.9898 + sw * 78.233) * 43758.5453) * 6.2831853;
                float swayT = sin(wind * windW + ph) + 0.45 * sin(wind * windW * 2.0 + ph * 1.7);
                // Quadratic in height: zero at the base, so the trunk stays planted and the collision cylinder stays honest.
                wp += windDir * (swayT * windAmp * sh * v * v);

                // CANOPY NORMAL: radial outward from the trunk axis, plus an upward bias for the droop of the boughs.
                // Built from the card's own across-axis, so it needs no attribute -- and with one card there is no second card left to disagree with it anywhere.
                vN = normalize(right * (u * 2.0) + vec3(0.0, canopyUp, 0.0));
                vRad = clamp(abs(u) * 2.0, 0.0, 1.0); // 0 at the trunk .. 1 at the branch tips

                vec4 viewPos = viewMatrix * vec4(wp, 1.0);
                float dist = length(viewPos.xyz);
                vFogDist = dist;
                vFar = 1.0 - smoothstep(viewRadius * 0.82, viewRadius, dist);
                gl_Position = projectionMatrix * viewPos;
              }`,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D map; uniform vec3 tint;
              uniform vec3 fogColor; uniform float fogDensity; uniform float bright;
              uniform vec3 sunDir; uniform float shadeMin; uniform float shadeMax;
              uniform float cutBase; uniform float cutSoft;
              uniform float aoBase; uniform float aoCore; uniform float aoCoreW;
              varying vec2 vUv; varying float vFogDist; varying float vFar;
              varying float vRad; varying vec3 vN;
              void main() {
                vec4 tx = texture2D(map, vUv);
                if (tx.a < cutBase) discard;

                // The band just above the cutoff becomes a coverage ramp: with alphaToCoverage the MSAA resolve dithers it into a soft needle edge instead of the hard stair-stepped cutout a bare discard gives.
                // vFar dissolves the tree at the view radius, deep inside the fog.
                float a = smoothstep(cutBase, cutBase + cutSoft, tx.a) * vFar;
                if (a < 0.01) discard;

                // Wrapped half-lambert sun on the canopy normal: no hard terminator, no black side.
                // No gl_FrontFacing flip, because the normal says which side of the canopy this fragment is on, and that does not change because the camera is looking at the card's back face.
                float lambert = dot(normalize(vN), sunDir) * 0.5 + 0.5;
                float shade = mix(shadeMin, shadeMax, lambert);

                // SPATIAL SELF-SHADOWING.
                // The painter shades each branch against its own underside, but cannot know that a branch near the trunk sits inside a whole tree's worth of canopy while a tip is open to the sky.
                float ao = mix(aoBase, 1.0, vUv.y);
                ao *= mix(aoCore, 1.0, smoothstep(0.0, aoCoreW, vRad));

                vec3 col = (tx.rgb * tint + bright) * shade * ao; // brightness floor -> never inky
                float fogF = clamp(1.0 - exp(-fogDensity * fogDensity * vFogDist * vFogDist), 0.0, 1.0);
                col = mix(col, fogColor, fogF);
                gl_FragColor = vec4(col, a);
              }`,
            side: DoubleSide,
            // Opaque pass, not the blended one.
            // alphaToCoverage turns the fragment's alpha into an MSAA coverage mask, which is order-independent, so the cards no longer need blending, no longer need sorting against each other or against themselves across the bow, and get early-z for free.
            // antialias:true on the renderer is what makes the samples exist; without MSAA this silently degrades to a hard cutout.
            transparent: false,
            alphaToCoverage: true,
            depthWrite: true, // tree body writes depth -> occludes tracks/ground
            alphaTest: 0.42,
          });
          // Expose the cutout texture as a property, not just a uniform.
          // three's getDepthMaterial() copies .map and .alphaTest onto the shadow depth material before every shadow draw -- that is how alpha-tested casters get a silhouette shadow for free.
          // A ShaderMaterial keeps its texture in `uniforms`, so .map is empty and the depth pass would see no alpha to test.
          // The two cutoffs are deliberately different: the depth pass tests .alphaTest (0.42) while the visible tree tests CUT_BASE (0.34), so the shadow stays a crisp silhouette and the tree gets soft needle edges.
          mat.map = tex;
          return mat;
        }

        // Collision broad-phase: regenerate the trunk positions near (px,pz) straight from the cell seeds (no stored list).
        // Pushes {wx, wz, r} into `out`, returns count.
        // How much sun reaches the skier: 1 in the open, CONFIG.SHADOW.DECAL.DARKNESS on a tree shadow's centreline.
        // Computed in update() as a by-product of placing the shadows, so it is always consistent with what is drawn on the snow.
        sunShade() {
          return this._sunShade;
        }

        nearbyObstacles(px, pz, reach, out, startN) {
          const C = this.C,
            cell = C.CELL;
          const ocx = Math.floor(px / cell),
            ocz = Math.floor(pz / cell);
          const span = Math.max(1, Math.ceil(reach / cell));
          let n = startN || 0;
          for (let dcx = -span; dcx <= span; dcx++) {
            for (let dcz = -span; dcz <= span; dcz++) {
              const cx = ocx + dcx,
                cz = ocz + dcz;
              const rand = this._rand.seed(cellSeed(cx, cz));
              for (let i = 0; i < C.TREES_PER_CELL; i++) {
                const fracX = rand(),
                  fracZ = rand();
                // Replay the same height roll the renderer uses (3rd draw) so the collision radius tracks each tree's actual size: a tall spruce has a thicker trunk than a sapling.
                // Trunk thickens sub-linearly with height (real trees do too).
                const hRoll = rand();
                const hSkew = hRoll * hRoll;
                const height =
                  C.HEIGHT_MIN + hSkew * (C.HEIGHT_MAX - C.HEIGHT_MIN);
                // Fourth draw, matching update()'s order exactly, so this replays the same aspect the renderer gave this tree and the crown radius below lines up with the card actually on screen.
                const aspect =
                  C.ASPECT_MIN + rand() * (C.ASPECT_MAX - C.ASPECT_MIN);
                const wx = (cx + fracX) * cell,
                  wz = (cz + fracZ) * cell;
                const o = out[n] || (out[n] = {});
                o.wx = wx;
                o.wz = wz;
                o.kind = 0; // 0 = tree
                o.topH = height; // metres of solid obstacle above the ground (for airborne clearance).
                // Crown radius -- foliage, not collision.
                // The card is `height * aspect` wide, so half of that is its outer edge.
                o.canopyR = height * aspect * 0.5 * C.CANOPY_FRAC;
                // Isotropic footprint: a circle is the degenerate equal-axis ellipse, so trees and boulders share one collision path.
                // Fold the skier radius into the form Q.
                const R =
                  C.TRUNK_RADIUS * (0.7 + 0.3 * (height / C.HEIGHT_MAX)) +
                  CONFIG.COLLIDE.SKIER_RADIUS;
                o.q11 = 1 / (R * R);
                o.q12 = 0;
                o.q22 = o.q11;
                n++;
              }
            }
          }
          return n;
        }

        update(playerX, playerZ, camX, camZ, groundY, time) {
          // One write drives the sway in every variant's material (shared uniform object).
          // Wrapped so the shader's clock never grows large enough for float32 to coarsen the phase.
          this._uWind.value = (time || 0) % WIND_T_WRAP;
          const C = this.C,
            cell = C.CELL;
          const originCx = Math.floor(playerX / cell);
          const originCz = Math.floor(playerZ / cell);
          const cornerX = originCx * cell,
            cornerZ = originCz * cell;
          this.group.position.set(cornerX, 0, cornerZ);
          this.shadows.begin();
          this._sunShade = 1;
          const pxRel = playerX - cornerX,
            pzRel = playerZ - cornerZ;
          const sunAwayX = SUN_AWAY_XZ.x,
            sunAwayZ = SUN_AWAY_XZ.y,
            sunRightX = SUN_RIGHT_XZ.x,
            sunRightZ = SUN_RIGHT_XZ.y;
          const invFall =
            1 / (SUN_TAN_ELEVATION + STATE.slopeGrade * SUN_FALL_ALIGN);
          const DK = CONFIG.SHADOW.DECAL.DARKNESS; // full shade matches the ground's own

          // Scan enough cells to cover the view disc around the CAMERA (which may sit a little outside the skier's origin cell): pad the span by the camera offset.
          const camOff = len2(camX - playerX, camZ - playerZ);
          const span = Math.ceil((C.VIEW_RADIUS + camOff) / cell) + 1;
          const r2 = C.VIEW_RADIUS * C.VIEW_RADIUS;
          const cxRel = camX - cornerX,
            czRel = camZ - cornerZ; // camera (view cull)
          this._slotCount.fill(0);
          let placed = 0;
          let dropped = 0;

          // Scan order: cells are walked from -X/-Z outward, not nearest-first, so saturating either budget drops trees from the +X/+Z side of the view rather than the least important ones.
          // Both budgets carry ~10x headroom and saturation warns rather than degrading silently.
          // If the forest ever legitimately needs to be denser, sort cells by camera distance here rather than just raising the numbers.
          for (
            let dcx = -span;
            dcx <= span && placed < this.maxVisible;
            dcx++
          ) {
            for (
              let dcz = -span;
              dcz <= span && placed < this.maxVisible;
              dcz++
            ) {
              const cx = originCx + dcx,
                cz = originCz + dcz;
              const rand = this._rand.seed(cellSeed(cx, cz));
              for (let i = 0; i < C.TREES_PER_CELL; i++) {
                const fracX = rand(),
                  fracZ = rand();
                const gx = (dcx + fracX) * cell,
                  gz = (dcz + fracZ) * cell;
                // Height: skew toward shorter trees (more saplings, occasional giant) via a squared roll, then widen the spread -- not every tree the same height.
                const hRoll = rand();
                const hSkew = hRoll * hRoll;
                const height =
                  C.HEIGHT_MIN + hSkew * (C.HEIGHT_MAX - C.HEIGHT_MIN);
                // Per-tree aspect (fat spruce vs skinny fir), independent of which texture it uses, so even two trees on the same texture read as different individuals.
                const aspect =
                  C.ASPECT_MIN + rand() * (C.ASPECT_MAX - C.ASPECT_MIN);
                const shapeIdx = Math.floor(rand() * C.NUM_SHAPES);

                // View cull: distance from the CAMERA, not the skier, so a tree doesn't pop out just because the skier reached it while it's still on screen.
                const vdx = gx - cxRel,
                  vdz = gz - czRel;
                if (vdx * vdx + vdz * vdz > r2) continue;
                if (placed >= this.maxVisible) {
                  dropped++;
                  break;
                }
                const slot = this._slotCount[shapeIdx];
                if (slot >= this.poolTrees) {
                  dropped++;
                  continue;
                }
                const baseY = groundY(cornerX + gx, cornerZ + gz);

                // Scale Y by height, XZ by height*aspect (each plane already crosses the axis).
                const wide = height * aspect;

                // Sink into slope: the card's base is level across its width while the ground drops away on the downhill side, so an unsunk card floats there.
                // Sink the base by roughly the downhill drop across the card's half-width (grade * halfWidth), so the bottom tucks under the snow across the whole span.
                const sink =
                  STATE.slopeGrade * (wide * 0.5) * C.SINK_FACTOR + C.SINK_BASE;
                // Every tree squares up to the sun -- see TREE_SUN_YAW and the geometry build.
                // A random per-tree spin is invisible to the camera (a conifer looks the same from every azimuth, and the card billboards anyway) and actively wrong for the shadow, which is the only thing this rotation reaches.
                this._q.setFromAxisAngle(UP_Y, TREE_SUN_YAW);
                this._pos.set(gx, baseY - sink, gz);
                this._scl.set(wide, height, wide);
                this._m.compose(this._pos, this._q, this._scl);
                this.meshes[shapeIdx].setMatrixAt(slot, this._m);
                this._slotCount[shapeIdx] = slot + 1;

                // And the same tree's projected shadow. Half-width and height are the card's own, so the decal is the silhouette the depth pass would have rasterised had the box still reached this far.
                this.shadows.add(gx, gz, wide * 0.5, height, sink);

                // Does this tree's shadow fall on the skier?
                // Free to ask here: the streamer already has the trunk, the height and the sink, and the answer is two dot products. Doing it in the loop that places the shadow also guarantees the two can never disagree about where that shadow is.
                // The silhouette tapers from the full half-width at the foot to nothing at the leader, so the test is a triangle rather than a rectangle -- which is what stops the thin upper shadow from shading the skier across its whole length.
                const sdx = pxRel - gx,
                  sdz = pzRel - gz;
                const alongS = sdx * sunAwayX + sdz * sunAwayZ;
                if (alongS > 0) {
                  const lenS = (height - sink) * invFall;
                  if (alongS < lenS) {
                    const acrossS = Math.abs(sdx * sunRightX + sdz * sunRightZ);
                    const halfS = wide * 0.5 * (1 - alongS / lenS);
                    if (acrossS < halfS) {
                      // Coverage is 1 on the shadow's centreline and eases to 0 at its edge, so crossing one darkens and lifts rather than switching.
                      const t = 1 - acrossS / halfS;
                      const cover = t * t * (3 - 2 * t);
                      this._sunShade = Math.min(
                        this._sunShade,
                        1 - cover * (1 - DK),
                      );
                    }
                  }
                }
                placed++;
              }
            }
          }
          for (let s = 0; s < this.meshes.length; s++) {
            this.meshes[s].count = this._slotCount[s];
            this.meshes[s].instanceMatrix.needsUpdate = true;
          }

          // Same anchor the cards use, so the decals live in the same rebased frame and the terrain lookups line up with the ground fan's.
          this.shadows.end(cornerX, cornerZ, playerX, playerZ);

          // Once per session: a saturated forest saturates every frame after the first.
          if (dropped && !this._warnedSaturated) {
            this._warnedSaturated = true;
            console.warn(
              `[forest] budget saturated -- ${dropped} tree(s) dropped this frame ` +
                `(placed ${placed} / MAX_VISIBLE ${this.maxVisible}, per-variant POOL ${this.poolTrees}). ` +
                `Drops follow scan order, not distance, so this removes trees from one side of the view. ` +
                `Sort cells by camera distance before raising the budgets.`,
            );
          }
        }
      }
      const UP_Y = new Vector3(0, 1, 0);

      // Yaw that turns a tree card's rest normal onto the sun's azimuth.
      // The card's rest normal is +Z, so rotating by atan2(sun.x, sun.z) about Y points it at the sun.
      // Every tree gets the same yaw, which is correct -- they all share one sun.
      // This is the orientation the shadow sees and only the shadow: the camera rebuilds the card facing itself in the vertex shader, which the depth pass never runs.
      const TREE_SUN_YAW = Math.atan2(
        CONFIG.SKY.SUN_DIR.x,
        CONFIG.SKY.SUN_DIR.z,
      );

      // Seconds before the wind clock wraps (1 h).
      // CONFIG.FOREST.WIND_CYCLES is a whole number of cycles across this span and the second harmonic is exactly 2x it, so both sine terms land back on their starting phase at the wrap -- no forest-wide twitch once an hour.
      const WIND_T_WRAP = 3600;

      const _MC_EDGE = new Int32Array([
        0x0, 0x109, 0x203, 0x30a, 0x406, 0x50f, 0x605, 0x70c, 0x80c, 0x905,
        0xa0f, 0xb06, 0xc0a, 0xd03, 0xe09, 0xf00, 0x190, 0x99, 0x393, 0x29a,
        0x596, 0x49f, 0x795, 0x69c, 0x99c, 0x895, 0xb9f, 0xa96, 0xd9a, 0xc93,
        0xf99, 0xe90, 0x230, 0x339, 0x33, 0x13a, 0x636, 0x73f, 0x435, 0x53c,
        0xa3c, 0xb35, 0x83f, 0x936, 0xe3a, 0xf33, 0xc39, 0xd30, 0x3a0, 0x2a9,
        0x1a3, 0xaa, 0x7a6, 0x6af, 0x5a5, 0x4ac, 0xbac, 0xaa5, 0x9af, 0x8a6,
        0xfaa, 0xea3, 0xda9, 0xca0, 0x460, 0x569, 0x663, 0x76a, 0x66, 0x16f,
        0x265, 0x36c, 0xc6c, 0xd65, 0xe6f, 0xf66, 0x86a, 0x963, 0xa69, 0xb60,
        0x5f0, 0x4f9, 0x7f3, 0x6fa, 0x1f6, 0xff, 0x3f5, 0x2fc, 0xdfc, 0xcf5,

      function createRockSDF(rng) {
        const BC = CONFIG.BOULDER;

        const numCuts = Math.floor(rng.range(BC.MIN_NUM_CUTS, BC.MAX_NUM_CUTS));
        const cuts = [];
        for (let i = 0; i < numCuts; i++) {
          const dir = rng.vec3Norm();
          cuts.push({
            dx: dir.x,
            dy: dir.y,
            dz: dir.z,
            radius: rng.range(BC.MIN_CUT_RADIUS, BC.MAX_CUT_RADIUS),
            ratio: rng.range(BC.MIN_CUT_RATIO, BC.MAX_CUT_RATIO),
            k: rng.range(BC.MIN_CUT_K, BC.MAX_CUT_K),
          });
        }

        const scale = new Vector3(
          rng.range(BC.MIN_SHAPE_SCALE_X, BC.MAX_SHAPE_SCALE_X),
          rng.range(BC.MIN_SHAPE_SCALE_Y, BC.MAX_SHAPE_SCALE_Y),
          rng.range(BC.MIN_SHAPE_SCALE_Z, BC.MAX_SHAPE_SCALE_Z),
        );

        const sdf = (x, y, z) => {
          const px = x / scale.x;
          const py = y / scale.y;
          const pz = z / scale.z;

          let d = Math.sqrt(px * px + py * py + pz * pz) - 1.05;

          for (const c of cuts) {
            const spx = px + c.dx * c.radius;
            const spy = py + c.dy * c.radius;
            const spz = pz + c.dz * c.radius;

            const sd =
              Math.sqrt(spx * spx + spy * spy + spz * spz) - c.radius * c.ratio;

            const h = Math.max(0, Math.min(1, 0.5 + (0.5 * (-sd - d)) / c.k));

            d = d * (1 - h) + -sd * h + c.k * h * (1 - h);
          }

          // Clamp d to avoid tiny floating islands
          if (d > 0.3) d = 0.3;

          return d;
        };

        return { sdf, scale };
      }

      function marchingCubes(res, sdf, bounds) {
        const [x0, x1, y0, y1, z0, z1] = bounds;
        const dx = (x1 - x0) / (res - 1),
          dy = (y1 - y0) / (res - 1),
          dz = (z1 - z0) / (res - 1);
        const field = new Float32Array(res * res * res);
        for (let k = 0, idx = 0; k < res; k++)
          for (let j = 0; j < res; j++)
            for (let i = 0; i < res; i++, idx++)
              field[idx] = sdf(x0 + i * dx, y0 + j * dy, z0 + k * dz);

        // --- Remove disconnected negative "islands" ----------------------------------
        // A nearly-severing cut can leave a lump that is still solid but joined to the body only through a corner/diagonal adjacency.
        // Marching cubes welds face-adjacent (6-connected) solid cells reliably; a corner-only touch falls in an ambiguous case and triangulates as a separate surface -- the floating fragment beside the rock.
        // So flood the solid region from the deepest interior sample across 6-connectivity, and push the field positive on any solid cell the flood cannot reach.
        // Bake-time only.
        {
          const N = field.length,
            res2 = res * res;
          let seed = 0;
          for (let s = 1; s < N; s++) if (field[s] < field[seed]) seed = s;
          if (field[seed] < 0) {
            const visited = new Uint8Array(N);
            const stack = new Int32Array(N);
            let sp = 0;
            stack[sp++] = seed;
            visited[seed] = 1;
            while (sp > 0) {
              const c = stack[--sp];
              const ci = c % res;
              const cj = ((c - ci) / res) % res;
              const ck = (c / res2) | 0;

              // 6 face neighbours only (the adjacency MC bridges)
              if (ci > 0) {
                const n = c - 1;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
              if (ci < res - 1) {
                const n = c + 1;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
              if (cj > 0) {
                const n = c - res;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
              if (cj < res - 1) {
                const n = c + res;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
              if (ck > 0) {
                const n = c - res2;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
              if (ck < res - 1) {
                const n = c + res2;
                if (!visited[n] && field[n] < 0)
                  ((visited[n] = 1), (stack[sp++] = n));
              }
            }
            for (let s = 0; s < N; s++)
              if (field[s] < 0 && !visited[s]) field[s] = 0.3; // evict fragment (matches far-field clamp)
          }
        }

        // Preallocate -- avoids thousands of Array.push reallocations
        const MAX_VERTS = res * res * res * 5; // safe upper bound
        const positions = new Float32Array(MAX_VERTS * 3);
        const indices = new Uint32Array(MAX_VERTS * 3);
        let vertexCount = 0;
        let indexCount = 0;

        // Clear the map instead of creating a new one
        _mcVmap.clear();

        const getVert = (v) => {
          // 1.
          // Quantize the position to an integer grid; a larger epsilon or direct bit-shifting packs 3 values into 32 bits.
          const ix = (v.x * 100) | 0;
          const iy = (v.y * 100) | 0;
          const iz = (v.z * 100) | 0;

          // 2.
          // Bit-packing (10 bits per axis, so -512..511) -- far faster than string concatenation.
          const key = ((ix + 512) << 20) | ((iy + 512) << 10) | (iz + 512);

          if (_mcVmap.has(key)) return _mcVmap.get(key);

          const idx = vertexCount;
          positions[vertexCount * 3 + 0] = v.x;
          positions[vertexCount * 3 + 1] = v.y;
          positions[vertexCount * 3 + 2] = v.z;
          vertexCount++;

          _mcVmap.set(key, idx);
          return idx;
        };

        const lerp = (out, p1, p2, v1, v2) => {
          const t = Math.abs(v1 - v2) < 1e-10 ? 0 : -v1 / (v2 - v1);
          out.set(
            p1.x + t * (p2.x - p1.x),
            p1.y + t * (p2.y - p1.y),
            p1.z + t * (p2.z - p1.z),
          );
        };

        // Move outside -- create only once
        const corners = new Array(8);
        for (let i = 0; i < 8; i++) corners[i] = new Vector3();

        const verts = new Array(12);
        for (let i = 0; i < 12; i++) verts[i] = new Vector3();

        const vals = new Float32Array(8); // even better than Array

        for (let k = 0; k < res - 1; k++) {
          for (let j = 0; j < res - 1; j++) {
            for (let i = 0; i < res - 1; i++) {
              const x = x0 + i * dx,
                y = y0 + j * dy,
                z = z0 + k * dz;
              corners[0].set(x, y, z);
              corners[1].set(x + dx, y, z);
              corners[2].set(x + dx, y + dy, z);
              corners[3].set(x, y + dy, z);
              corners[4].set(x, y, z + dz);
              corners[5].set(x + dx, y, z + dz);
              corners[6].set(x + dx, y + dy, z + dz);
              corners[7].set(x, y + dy, z + dz);

              const base = k * res * res + j * res + i;

              vals[0] = field[base]; // (0,0,0)
              vals[1] = field[base + 1]; // (1,0,0)
              vals[2] = field[base + 1 + res]; // (1,1,0)
              vals[3] = field[base + res]; // (0,1,0)

              vals[4] = field[base + res * res]; // (0,0,1)
              vals[5] = field[base + 1 + res * res]; // (1,0,1)
              vals[6] = field[base + 1 + res + res * res]; // (1,1,1)
              vals[7] = field[base + res + res * res]; // (0,1,1)

              let ci = 0;
              for (let n = 0; n < 8; n++) if (vals[n] < 0) ci |= 1 << n;

              const e = _MC_EDGE[ci];

              if (!e) continue;
              if (e & 1)
                lerp(verts[0], corners[0], corners[1], vals[0], vals[1]);
              if (e & 2)
                lerp(verts[1], corners[1], corners[2], vals[1], vals[2]);
              if (e & 4)
                lerp(verts[2], corners[2], corners[3], vals[2], vals[3]);
              if (e & 8)
                lerp(verts[3], corners[3], corners[0], vals[3], vals[0]);
              if (e & 16)
                lerp(verts[4], corners[4], corners[5], vals[4], vals[5]);
              if (e & 32)
                lerp(verts[5], corners[5], corners[6], vals[5], vals[6]);
              if (e & 64)
                lerp(verts[6], corners[6], corners[7], vals[6], vals[7]);
              if (e & 128)
                lerp(verts[7], corners[7], corners[4], vals[7], vals[4]);
              if (e & 256)
                lerp(verts[8], corners[0], corners[4], vals[0], vals[4]);
              if (e & 512)
                lerp(verts[9], corners[1], corners[5], vals[1], vals[5]);
              if (e & 1024)
                lerp(verts[10], corners[2], corners[6], vals[2], vals[6]);
              if (e & 2048)
                lerp(verts[11], corners[3], corners[7], vals[3], vals[7]);

              const tri = _MC_TRI[ci];
              for (let t = 0; tri[t] !== -1; t += 3) {
                const a = verts[tri[t]],
                  b = verts[tri[t + 1]],
                  c = verts[tri[t + 2]];

                if (!a || !b || !c) continue;

                const ia = getVert(a);
                const ib = getVert(b);
                const ic = getVert(c);

                if (ia !== ib && ib !== ic && ic !== ia) {
                  // Typed array -> manual index assignment (no .push)
                  indices[indexCount++] = ia;
                  indices[indexCount++] = ic;
                  indices[indexCount++] = ib;
                }
              }
            }
          }
        }

        const geom = new BufferGeometry();
        geom.setAttribute(
          "position",
          new BufferAttribute(positions.subarray(0, vertexCount * 3), 3),
        );
        geom.setIndex(new BufferAttribute(indices.subarray(0, indexCount), 1));
        if (res > 6) {
          geom.computeVertexNormals();
        }
        return geom;
      }

      // mulberry32 wrapped to the {range, vec3Norm} interface createRockSDF expects.
      function _boulderRng(seed) {
        const m = mulberry32(seed >>> 0);
        return {
          next: m,
          range: (a, b) => a + (b - a) * m(),
          vec3Norm: () => {
            const v = new Vector3(m() * 2 - 1, m() * 2 - 1, m() * 2 - 1);
            const l = Math.hypot(v.x, v.y, v.z) || 1;
            v.x /= l;
            v.y /= l;
            v.z /= l;
            return v;
          },
        };
      }

      // ----------------------------------------------------------------------------
      // Boulders / SNOW chunks / ice blocks (SDF marching-cubes scatter)
      // ----------------------------------------------------------------------------
      // Medium scenery scattered like the forest, using the same chunk-stream, cell-anchor, camera-cull and slope-sink machinery, so positions are permanent and 1-AU precise.
      // A per-instance type (rock, snow chunk, ice) drives colour, roughness and specular: one shape library, three materials, mixed by cell seed.
      // Spawned beyond the fog and faded in by opacity so they never pop.

      class BoulderLibrary {
        constructor() {
          const C = CONFIG.BOULDER;
          const bounds = [-1.7, 1.7, -1.7, 1.7, -1.7, 1.7];
          this.shapes = []; // each: { lods: [geoNear, geoFar] }
          for (let s = 0; s < C.NUM_SHAPES; s++) {
            const lods = [];
            let semi = null;
            let ext = null;
            for (const res of C.LOD_RES) {
              const rng = _boulderRng(0xb0017 ^ Math.imul(s + 1, 2654435761));
              const { sdf, scale } = createRockSDF(rng);
              const geo = marchingCubes(res, sdf, bounds);
              lods.push(geo);

              // Collider sized from the carved mesh, not the uncarved sphere.
              // The rock keeps full-radius bulges where no cut landed, so a bounding ellipsoid must cover them, but it is bitten flat elsewhere and that bound badly over-covers the flats.
              // Measured from the finest LOD; identical seed per LOD means `scale` is the same, so the choice of LOD only affects sample count.
              if (!semi) {
                const p = geo.attributes.position.array;
                let sumR = 0,
                  cnt = 0,
                  ex = 0,
                  ey = 0,
                  ez = 0;
                for (let i = 0; i < p.length; i += 3) {
                  const nx = p[i] / scale.x,
                    ny = p[i + 1] / scale.y,
                    nz = p[i + 2] / scale.z;
                  sumR += Math.sqrt(nx * nx + ny * ny + nz * nz);
                  cnt++;
                  // True bounding half-extents, in the same scaled local space the mesh is drawn in.
                  const ax = Math.abs(p[i]),
                    ay = Math.abs(p[i + 1]),
                    az = Math.abs(p[i + 2]);
                  if (ax > ex) ex = ax;
                  if (ay > ey) ey = ay;
                  if (az > ez) ez = az;
                }
                const meanR =
                  (cnt ? sumR / cnt : C.SDF_BASE_R) * C.COLLIDER_FIT;
                semi = [meanR * scale.x, meanR * scale.y, meanR * scale.z];
                // The shadow wants what you SEE, which is not what you collide with.
                // `semi` is a MEAN radius, deliberately forgiving so the skier is never stopped by air, and for a flat rock it lands about half the true height -- so a shadow sized from it barely steps off the rock and reads as centred, which is wrong at any sun angle. These are the real extents of the drawn mesh, so the shadow's length and offset follow the rock's actual standing height.
                ext = [ex, ey, ez];
              }
            }
            this.shapes.push({ lods, semi, ext });
          }
        }
      }

      class Boulders {
        constructor(scene) {
          const C = CONFIG.BOULDER;
          this.C = C;
          this.poolPer = C.POOL;
          this.lib = new BoulderLibrary();
          this.group = new Group();
          scene.add(this.group);

          this.mat = this._material();

          // One InstancedMesh per (shape, lod).
          // Each tree-like instance picks a shape by seed and a LOD by camera distance.
          this.meshes = []; // [shape][lod]
          for (let s = 0; s < this.lib.shapes.length; s++) {
            const row = [];
            for (let l = 0; l < C.LOD_RES.length; l++) {
              const mesh = new InstancedMesh(
                this.lib.shapes[s].lods[l],
                this.mat,
                this.poolPer,
              );
              mesh.instanceMatrix.setUsage(DynamicDrawUsage);
              mesh.frustumCulled = false;
              mesh.count = 0;

              // Neither casts nor receives: like the trees, a boulder's shadow is drawn (see ShadowDecals) rather than mapped, so it cannot double-darken against an atlas shadow of itself.
              // Doesn't receive -- only the ground does.
              // The per-instance far-fade isn't honoured by the depth pass, but fading boulders sit at the view radius, deep in fog and outside the shadow frustum, so it never shows.
              mesh.castShadow = false;
              mesh.receiveShadow = false;

              // per-instance fade + type, as instanced buffer attributes
              const fadeArr = new Float32Array(this.poolPer);
              const typeArr = new Float32Array(this.poolPer);
              mesh.geometry.setAttribute(
                "iFade",
                new InstancedBufferAttribute(fadeArr, 1),
              );
              mesh.geometry.setAttribute(
                "iType",
                new InstancedBufferAttribute(typeArr, 1),
              );
              mesh._fadeArr = fadeArr;
              mesh._typeArr = typeArr;
              this.group.add(mesh);
              row.push(mesh);
            }
            this.meshes.push(row);
          }
          this._m = new Matrix4();
          this._q = new Quaternion();
          this._pos = new Vector3();
          this._scl = new Vector3();
          this._euler = new Euler();

          // Reusable descriptor for one boulder instance.
          // Filled by _instance() and consumed synchronously by both the renderer and the collision broad-phase (never re-entrant), so a single shared scratch keeps the hot loop allocation-free.
          this._inst = {
            fracX: 0,
            fracZ: 0,
            size: 0,
            stretchX: 1,
            stretchY: 1,
            stretchZ: 1,
            rotX: 0,
            rotY: 0,
            rotZ: 0,
            shapeIdx: 0,
            type: 0,
          };
          this._counts = []; // [shape][lod] running counts
          for (let s = 0; s < this.lib.shapes.length; s++)
            this._counts.push(new Int32Array(C.LOD_RES.length));
          // Reused per-cell PRNG (allocation-free): reseeded for each cell in update()/nearbyObstacles().
          this._rand = makeMulberry32();

          // Projected shadows for the boulders the atlas no longer reaches, on the same anchor and the same streaming pass as the meshes.
          // poolPer * NUM_SHAPES * 2 is the mesh ceiling across every variant and LOD, which is also the most instances one frame can place.
          this.shadows = new ShadowDecals(
            this.group,
            this.poolPer * C.NUM_SHAPES * 2,
            // The ellipse carries its own soft radial falloff, so this mode uses no contact pool at all -- only the shade depth is tuned, a little deeper than a tree's since a rock blocks the sun outright.
            { ellipse: true, dark: 0.66 },
          );
        }

        // Single source of truth for a boulder instance's randomised attributes.
        // The renderer (update) and the collision broad-phase (nearbyObstacles) both derive every instance from here, drawing the same PRNG values in the same order, so the collider can never disagree with the visible mesh.
        // Writes into caller-owned `o`, no allocation.
        _instance(rand, o) {
          const C = this.C;
          o.fracX = rand();
          o.fracZ = rand();
          const sRoll = rand();
          o.size = C.SIZE_MIN + sRoll * sRoll * (C.SIZE_MAX - C.SIZE_MIN);
          o.stretchX = 0.7 + rand() * 0.7; // 0.7 .. 1.4
          o.stretchY = 0.6 + rand() * 0.7; // flatter or taller
          o.stretchZ = 0.7 + rand() * 0.7;
          o.rotX = rand() * Math.PI * 2;
          o.rotY = rand() * Math.PI * 2;
          o.rotZ = rand() * Math.PI * 2;
          o.shapeIdx = Math.floor(rand() * this.lib.shapes.length);
          const typeRoll = rand();
          o.type =
            typeRoll < C.P_ROCK ? 0 : typeRoll < C.P_ROCK + C.P_SNOW ? 1 : 2;
          return o;
        }

        // Collision footprint for one instance: the exact projection of its oriented world ellipsoid onto the ground, inflated by the skier's radius, as a symmetric 2x2 form Q.
        // A world offset (dx,dz) from the centre is inside iff dx*dx*q11 + 2*dx*dz*q12 + dz*dz*q22 <= 1.
        // M = sum_i (1/Ai^2) a_i a_i^T (a_i = world dir of local axis i, Ai = semi-axis); the footprint is the Schur complement of M eliminating Y, principal semi-axes inflated by skierR and rebuilt as Q.
        // Sized to the carved mesh's mean radius, so it tracks the average silhouette rather than the bounding bulges.
        _collideEllipse(inst, skierR, o) {
          const semi = this.lib.shapes[inst.shapeIdx].semi;
          const Ax = semi[0] * inst.size * inst.stretchX;
          const Ay = semi[1] * inst.size * inst.stretchY;
          const Az = semi[2] * inst.size * inst.stretchZ;

          // World directions of the three local axes for Three.js Euler order 'XYZ'.
          const c1 = Math.cos(inst.rotX),
            s1 = Math.sin(inst.rotX);
          const c2 = Math.cos(inst.rotY),
            s2 = Math.sin(inst.rotY);
          const c3 = Math.cos(inst.rotZ),
            s3 = Math.sin(inst.rotZ);
          const ux = c2 * c3,
            uy = c1 * s3 + s1 * s2 * c3,
            uz = s1 * s3 - c1 * s2 * c3;
          const vx = -c2 * s3,
            vy = c1 * c3 - s1 * s2 * s3,
            vz = s1 * c3 + c1 * s2 * s3;
          const wx = s2,
            wy = -s1 * c2,
            wz = c1 * c2;
          const iu = 1 / (Ax * Ax),
            iv = 1 / (Ay * Ay),
            iw = 1 / (Az * Az);
          // Only the entries needed for the Schur complement on Y (world axes x=., y=up, z=.).
          const Mxx = iu * ux * ux + iv * vx * vx + iw * wx * wx;
          const Mxy = iu * ux * uy + iv * vx * vy + iw * wx * wy;
          const Mxz = iu * ux * uz + iv * vx * vz + iw * wx * wz;
          const Myy = iu * uy * uy + iv * vy * vy + iw * wy * wy;
          const Myz = iu * uy * uz + iv * vy * vz + iw * wy * wz;
          const Mzz = iu * uz * uz + iv * vz * vz + iw * wz * wz;

          // Footprint ellipse S = [[sa, sb],[sb, sc]] over (x,z).
          const sa = Mxx - (Mxy * Mxy) / Myy;
          const sb = Mxz - (Mxy * Myz) / Myy;
          const sc = Mzz - (Myz * Myz) / Myy;

          // Principal axes of S (closed-form 2x2 symmetric eigendecomposition).
          const tr = sa + sc;
          const disc = Math.sqrt(
            Math.max(0, (sa - sc) * (sa - sc) + 4 * sb * sb),
          );
          const l1 = (tr + disc) * 0.5,
            l2 = (tr - disc) * 0.5; // l1 >= l2 > 0
          const e1 = 1 / Math.sqrt(l1),
            e2 = 1 / Math.sqrt(l2); // semi-axes (e1 <= e2)
          let ex, ez; // unit eigenvector for l1
          if (Math.abs(sb) > 1e-12) {
            ex = l1 - sc;
            ez = sb;
            const inv = 1 / len2(ex, ez);
            ex *= inv;
            ez *= inv;
          } else if (sa >= sc) {
            ex = 1;
            ez = 0;
          } else {
            ex = 0;
            ez = 1;
          }

          // Inflate both semi-axes by the skier radius and rebuild Q (skier treated as a point).
          const L1 = 1 / ((e1 + skierR) * (e1 + skierR));
          const L2 = 1 / ((e2 + skierR) * (e2 + skierR));
          o.q11 = L1 * ex * ex + L2 * ez * ez;
          o.q12 = (L1 - L2) * ex * ez;
          o.q22 = L1 * ez * ez + L2 * ex * ex;
        }

        _material() {
          const C = CONFIG.BOULDER;
          const mat = new MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.9,
            metalness: 0.0,
            transparent: true,
          });
          mat.onBeforeCompile = (shader) => {
            shader.uniforms.uViewRadius = { value: C.VIEW_RADIUS };
            shader.uniforms.uSunDir = { value: SUN_DIR_N }; // world direction toward the sun, for form shading
            shader.vertexShader =
              `
              attribute float iFade; attribute float iType;
              varying float vFade; varying float vType; varying vec3 vLocalP;
            ` +
              shader.vertexShader.replace(
                "#include <begin_vertex>",
                `#include <begin_vertex>
               vFade = iFade; vType = iType; vLocalP = position;`,
              );
            shader.fragmentShader =
              `
              varying float vFade; varying float vType; varying vec3 vLocalP;
              uniform vec3 uSunDir;
              float _h(float n){ return fract(sin(n)*43758.5453); }
              float _n3(vec3 x){ vec3 p=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
                float n=p.x+p.y*57.0+113.0*p.z;
                return mix(mix(mix(_h(n),_h(n+1.0),f.x),mix(_h(n+57.0),_h(n+58.0),f.x),f.y),
                           mix(mix(_h(n+113.0),_h(n+114.0),f.x),mix(_h(n+170.0),_h(n+171.0),f.x),f.y),f.z); }
              float _fbm(vec3 p){ float a=0.0; a+=0.5*_n3(p); p*=2.02; a+=0.25*_n3(p); p*=2.03; a+=0.125*_n3(p); return a; }
            ` +
              shader.fragmentShader
                // type-driven albedo, computed from local position noise (1-AU safe).
                // Strong, distinct colours so rock / snow / ice are unmistakable.
                .replace(
                  "#include <color_fragment>",
                  `#include <color_fragment>
                 float _grain = _fbm(vLocalP * 3.5);
                 vec3 _rock  = mix(vec3(0.16,0.14,0.12), vec3(0.44,0.41,0.38), _grain);
                 vec3 _snow  = mix(vec3(0.88,0.91,0.97), vec3(1.0,1.0,1.0), _grain);
                 vec3 _ice   = mix(vec3(0.40,0.66,0.82), vec3(0.66,0.86,0.98), _grain);
                 vec3 _alb = (vType < 0.5) ? _rock : (vType < 1.5 ? _snow : _ice);
                 diffuseColor.rgb *= _alb;`,
                )
                // emissive lift: snow gets a bright floor (like the ground snow) and ice a faint cool glow, so they read as snow/ice even in flat light -- and this also makes the type unmistakable regardless of how the lighting falls.
                .replace(
                  "#include <emissivemap_fragment>",
                  `#include <emissivemap_fragment>
                 if (vType > 1.5) {
                   // Stylized reflective ice: there is no environment map to mirror, so fake the glassy read with a Fresnel edge glint plus a sky gradient sampled by the world-space normal.
                   // viewMatrix is orthonormal, so normal * mat3(viewMatrix) transpose-multiplies back to world space, giving a stable up axis for the gradient.
                   vec3 _V = normalize(vViewPosition);
                   float _fres = pow(1.0 - clamp(dot(normalize(normal), _V), 0.0, 1.0), 5.0);
                   vec3 _wN = normalize(normal * mat3(viewMatrix));
                   vec3 _sky = mix(vec3(0.26,0.40,0.58), vec3(0.55,0.74,0.96), smoothstep(-0.2, 0.7, _wN.y));
                   totalEmissiveRadiance += _sky * (0.10 + 0.55 * _fres);  // face sheen + bright edges
                   totalEmissiveRadiance += vec3(0.03,0.05,0.07);           // faint cool base
                 } else if (vType > 0.5) totalEmissiveRadiance += vec3(0.14,0.16,0.20);  // snow floor -- kept low so the form-shading gradient below can read`,
                )
                // apply per-instance fade to output alpha, and form-shading so a white rock on white snow actually reads as a rounded, grounded solid
                .replace(
                  "#include <dithering_fragment>",
                  `#include <dithering_fragment>
                 // Form shading. A snow boulder is near-white albedo drowned in flat ambient + hemisphere + emissive, so its own light/dark gradient never appears and it looks like a cutout. Deepen and cool the faces turned away from the sun, and the faces turned downward, as a final multiply -- this restores the rounded read, and the darkened underside is the contact shade that sits it in the snow. Post-lighting on purpose: it deepens the fill the lighting chain would otherwise leave flat, rather than fighting the direct sun term.
                 vec3 _wNf = normalize(normal * mat3(viewMatrix));
                 float _toSun = smoothstep(-0.4, 0.55, dot(_wNf, uSunDir)); // 0 sun-away .. 1 sun-facing
                 float _up = smoothstep(-0.65, 0.2, _wNf.y);                 // 0 underside .. 1 top
                 float _form = mix(0.58, 1.0, _toSun) * mix(0.8, 1.0, _up);
                 gl_FragColor.rgb *= mix(vec3(0.82,0.86,0.96), vec3(1.0), _form); // cool the shaded side toward snow-blue
                 gl_FragColor.a *= clamp(vFade, 0.0, 1.0);`,
                )
                // per-type roughness: rock matte, snow soft, ice very glossy (sharp highlights)
                .replace(
                  "#include <roughnessmap_fragment>",
                  `#include <roughnessmap_fragment>
                 roughnessFactor = (vType > 1.5) ? 0.06 : (vType > 0.5 ? 0.8 : 0.95);`,
                )
                // metalness: all types stay dielectric (0) -- with no environment a metal mirrors black, so ice's glassy reflection is faked via the Fresnel + sky sheen in the emissive stage above.
                .replace(
                  "#include <metalnessmap_fragment>",
                  `#include <metalnessmap_fragment>
                 metalnessFactor = 0.0;`,
                );
          };
          mat.customProgramCacheKey = () => "boulderMat";
          return mat;
        }

        // Collision broad-phase: regenerate boulder positions + radii near (px,pz) from cell seeds, driving each instance through the same _instance() generator the renderer uses, so the collider always matches the rendered mesh.
        // Pushes {wx,wz,q11,q12,q22,kind} into `out`.
        nearbyObstacles(px, pz, reach, out, startN) {
          const C = this.C,
            cell = C.CELL;
          const skierR = CONFIG.COLLIDE.SKIER_RADIUS; // folded into each footprint ellipse
          const ocx = Math.floor(px / cell),
            ocz = Math.floor(pz / cell);
          const span = Math.max(1, Math.ceil(reach / cell));
          let n = startN || 0;
          for (let dcx = -span; dcx <= span; dcx++) {
            for (let dcz = -span; dcz <= span; dcz++) {
              const cx = ocx + dcx,
                cz = ocz + dcz;
              const rand = this._rand.seed(cellSeed(cx, cz) ^ 0x5eed1); // must match update()'s stream
              for (let i = 0; i < C.PER_CELL; i++) {
                const inst = this._instance(rand, this._inst); // identical draws to the renderer
                const wx = (cx + inst.fracX) * cell,
                  wz = (cz + inst.fracZ) * cell;
                const o = out[n] || (out[n] = {});
                o.wx = wx;
                o.wz = wz;
                o.kind = 1; // 1 = boulder
                o.canopyR = 0; // boulders have no foliage.
                // Not optional: `out` is a pooled array shared with the forest gatherer, so a slot that carried a tree last frame would otherwise leave a stale crown radius on a rock.
                // Conservative top height above ground: bounding-sphere radius (largest semi-axis under any rotation) of the placed rock, minus how far it is sunk into the snow.
                o.topH =
                  inst.size *
                  (C.SDF_BASE_R *
                    Math.max(inst.stretchX, inst.stretchY, inst.stretchZ) -
                    C.SINK_FRAC);
                this._collideEllipse(inst, skierR, o); // sets o.q11,o.q12,o.q22
                n++;
              }
            }
          }
          return n;
        }

        update(playerX, playerZ, camX, camZ, groundY) {
          const C = this.C,
            cell = C.CELL;
          const originCx = Math.floor(playerX / cell),
            originCz = Math.floor(playerZ / cell);
          const cornerX = originCx * cell,
            cornerZ = originCz * cell;
          this.group.position.set(cornerX, 0, cornerZ);
          const camOff = len2(camX - playerX, camZ - playerZ);
          const span = Math.ceil((C.VIEW_RADIUS + camOff) / cell) + 1;
          const r2 = C.VIEW_RADIUS * C.VIEW_RADIUS;
          const cxRel = camX - cornerX,
            czRel = camZ - cornerZ;
          const lodDist2 = C.LOD_DIST * C.LOD_DIST;
          for (let s = 0; s < this._counts.length; s++) this._counts[s].fill(0);
          this.shadows.begin();

          // Sun projection constants for the shadow ellipses below. Once per frame, not per rock.
          // invFall is the ground metres a shadow travels per metre of height, with the live slope folded in exactly as the tree decals do it.
          const invFall =
            1 / (SUN_TAN_ELEVATION + STATE.slopeGrade * SUN_FALL_ALIGN);
          const rgx = SUN_RIGHT_XZ.x,
            rgz = SUN_RIGHT_XZ.y;
          const awx = SUN_AWAY_XZ.x,
            awz = SUN_AWAY_XZ.y;
          const ELL_SPREAD = CONFIG.SHADOW.DECAL.ELL_SPREAD;

          for (let dcx = -span; dcx <= span; dcx++) {
            for (let dcz = -span; dcz <= span; dcz++) {
              const cx = originCx + dcx,
                cz = originCz + dcz;
              const rand = this._rand.seed(cellSeed(cx, cz) ^ 0x5eed1); // distinct stream from trees
              for (let i = 0; i < C.PER_CELL; i++) {
                const inst = this._instance(rand, this._inst);
                const gx = (dcx + inst.fracX) * cell,
                  gz = (dcz + inst.fracZ) * cell;
                const size = inst.size;
                const stretchX = inst.stretchX,
                  stretchY = inst.stretchY,
                  stretchZ = inst.stretchZ;
                const rotX = inst.rotX,
                  rotY = inst.rotY,
                  rotZ = inst.rotZ;
                const shapeIdx = inst.shapeIdx;
                const type = inst.type;
                const vdx = gx - cxRel,
                  vdz = gz - czRel;
                const vd2 = vdx * vdx + vdz * vdz;
                if (vd2 > r2) continue;

                // opacity fade-in near the far edge (no pop), like the trees
                const dist = Math.sqrt(vd2);
                const fade =
                  1 -
                  Math.min(
                    1,
                    Math.max(
                      0,
                      (dist - C.VIEW_RADIUS * 0.82) / (C.VIEW_RADIUS * 0.18),
                    ),
                  );
                const lod = vd2 < lodDist2 ? 0 : 1;
                const slot = this._counts[shapeIdx][lod];
                if (slot >= this.poolPer) continue;
                const baseY = groundY(cornerX + gx, cornerZ + gz);
                const sink = size * C.SINK_FRAC;

                // Full random orientation on all 3 axes -> every boulder reads as a fresh, unique chunk; combined with non-uniform stretch + 6 base shapes, no visible repetition.
                this._euler.set(rotX, rotY, rotZ);
                this._q.setFromEuler(this._euler);
                this._pos.set(gx, baseY - sink, gz);
                this._scl.set(
                  size * stretchX,
                  size * stretchY,
                  size * stretchZ,
                );
                this._m.compose(this._pos, this._q, this._scl);
                const mesh = this.meshes[shapeIdx][lod];
                mesh.setMatrixAt(slot, this._m);
                mesh._fadeArr[slot] = fade;
                mesh._typeArr[slot] = type;
                this._counts[shapeIdx][lod] = slot + 1;

                // The rock's shadow on the snow, as one ellipse -- exactly, not as an approximation.
                // An ellipsoid lit by a directional light casts an ellipse on a plane. That single fact removes the whole problem: there is no silhouette card to shear, no contact pool to blend into it, and so no seam or misalignment at the base to get wrong. The ellipse already straddles the rock's foot and reaches downsun on its own.
                // Sized from `semi`, the ellipsoid measured off the actual carved mesh -- the same one the collider fits (see _collideEllipse) -- so the shadow matches the rock the skier hits rather than the uncarved base sphere, which ran up to ~1.6x too wide.
                // Sized from `ext`, the true bounding half-extents of the drawn mesh -- NOT from `semi`, which is the collider's mean radius and lands about half the real height on a flat rock. That undercount is what made the offset below vanish and left the ellipse sitting centred under the rock.
                const ext = this.lib.shapes[shapeIdx].ext;
                const rx = ext[0] * size * stretchX,
                  ry = ext[1] * size * stretchY,
                  rz = ext[2] * size * stretchZ;
                const c1 = Math.cos(rotX),
                  s1 = Math.sin(rotX);
                const c2 = Math.cos(rotY),
                  s2 = Math.sin(rotY);
                const c3 = Math.cos(rotZ),
                  s3 = Math.sin(rotZ);
                // World directions of the three local axes (Euler XYZ), the same basis _collideEllipse builds. This is where the rotation enters, and it is the only place it needs to.
                const ux = c2 * c3,
                  uy = c1 * s3 + s1 * s2 * c3,
                  uz = s1 * s3 - c1 * s2 * c3;
                const vx = -c2 * s3,
                  vy = c1 * c3 - s1 * s2 * s3,
                  vz = s1 * c3 + c1 * s2 * s3;
                const wx = s2,
                  wy = -s1 * c2,
                  wz = c1 * c2;

                // Only the part of the rock ABOVE the snow casts anything, and that is what sets the offset.
                // Projecting the whole ellipsoid is wrong twice over: the buried half throws its shadow on the SUNWARD side (a point below the ground plane projects back toward the sun), which both bloats the ellipse upsun and drags its centre back, so a sunk rock ends up sitting in the middle of its own shadow instead of at the sunward end of it.
                // So model the visible cap as its own ellipsoid: the same horizontal footprint, but standing from the snow line to the rock's top. A world-Y scale does exactly that and costs one multiply, because scaling Y commutes straight into the columns of R*S -- the across row never sees it, and the along row picks it up on its uy/vy/wy term alone.
                const hVert = Math.hypot(rx * uy, ry * vy, rz * wy); // the ellipsoid's own vertical half-extent
                const hTop = Math.max(hVert - sink, 1e-3); // how much rock actually stands above the snow
                const fy = hTop / (2 * hVert); // squash Y so the model cap spans 0..hTop

                // Drop a 3D offset onto the ground along the sun ray, in the card's own (across, along) axes:
                //   across = offset . right,  along = offset . away + offsetY * invFall Apply that to each scaled axis of the cap (the columns of R*S with Y squashed) to get a 2x3 matrix M; the shadow outline is then M's image of the unit ball, i.e. { p : pᵀ(M Mᵀ)⁻¹ p <= 1 }.
                const a0 = rx * (rgx * ux + rgz * uz),
                  a1 = ry * (rgx * vx + rgz * vz),
                  a2 = rz * (rgx * wx + rgz * wz);
                const fi = fy * invFall;
                const l0 = rx * (awx * ux + awz * uz + fi * uy),
                  l1 = ry * (awx * vx + awz * vz + fi * vy),
                  l2 = rz * (awx * wx + awz * wz + fi * wy);
                const Gaa = a0 * a0 + a1 * a1 + a2 * a2;
                const Gll = l0 * l0 + l1 * l1 + l2 * l2;
                const Gal = a0 * l0 + a1 * l1 + a2 * l2;

                // Invert to the form the fragment tests, scaled by ELL_SPREAD so the soft edge finishes just outside the true outline instead of eating into it.
                const det = Math.max(Gaa * Gll - Gal * Gal, 1e-9);
                const sp2 = ELL_SPREAD * ELL_SPREAD;
                const q11 = Gll / (det * sp2),
                  q12 = -Gal / (det * sp2),
                  q22 = Gaa / (det * sp2);

                // Where the ellipse sits: the cap's centre is half its standing height up, and a point at height h lands invFall * h downsun. So the shadow steps AWAY from the sun by that much -- the offset the previous version had backwards. A tall rock throws its shadow well clear of itself; a nearly buried one keeps it underfoot, with no special case for either.
                const cAlong = 0.5 * hTop * invFall;
                const hA = ELL_SPREAD * Math.sqrt(Gaa),
                  hL = ELL_SPREAD * Math.sqrt(Gll);

                // In ellipse mode add() takes the CENTRE and the across/along half-extents: the patch is just the ellipse's bounding box, laid flat and conformed to the snow.
                this.shadows.add(
                  gx + awx * cAlong,
                  gz + awz * cAlong,
                  hA,
                  hL,
                  1,
                  q11,
                  q12,
                  q22,
                );
              }
            }
          }
          this.shadows.end(cornerX, cornerZ, playerX, playerZ);

          for (let s = 0; s < this.meshes.length; s++) {
            for (let l = 0; l < this.meshes[s].length; l++) {
              const mesh = this.meshes[s][l];
              mesh.count = this._counts[s][l];
              mesh.instanceMatrix.needsUpdate = true;
              mesh.geometry.getAttribute("iFade").needsUpdate = true;
              mesh.geometry.getAttribute("iType").needsUpdate = true;
            }
          }
        }
      }

      // ============================================================================
      // GAME
      // ============================================================================
      // Shared, module-scope scratch.
      // Declared here rather than inside the per-frame methods below so the hot path allocates nothing at all.
      const _AXIS = ["x", "y", "z"]; // dynamic component indexing into Vector3
      const _LOOK_ARG = { yaw: 0, pitch: 0 }; // chase-camera look argument

      class Game {
        constructor(container) {
          this.container = container;
          this.paused = false;

          this.scene = new Scene();
          this.scene.fog = new Fog(CONFIG.SKY.FOG, 35, CONFIG.FAN.RADIUS * 0.7);

          this.camera = new PerspectiveCamera(
            CONFIG.CAMERA.FOV,
            window.innerWidth / window.innerHeight,
            CONFIG.CAMERA.NEAR,
            CONFIG.CAMERA.FAR,
          );

          this.renderer = new WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance",
          });
          GpuTimer.attach(this.renderer);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.outputColorSpace = SRGBColorSpace;
          this.renderer.setClearColor(CONFIG.SKY.BOTTOM, 1);
          container.appendChild(this.renderer.domElement);
          attachKTX2Renderer(this.renderer);
          // Stash before anything paints a canvas texture -- the forest is built later in this constructor and reads it.
          MAX_ANISO = this.renderer.capabilities.getMaxAnisotropy();

          // Half two of the terrain twin check -- needs a live renderer, so it runs here rather than at module scope beside the CPU half.
          _terrainGpuTest(this.renderer);

          // Context loss is routine on mobile -- backgrounding, driver reset, memory pressure -- and the default is a permanently black canvas with nothing logged.
          // preventDefault() is what makes it recoverable; without it the browser never fires contextrestored.
          // three rebuilds its own GPU resources, so this just pauses and repaints.
          const canvas = this.renderer.domElement;
          canvas.addEventListener(
            "webglcontextlost",
            (e) => {
              e.preventDefault();
              this._contextLost = true;
              // Don't let restore resume a game the player deliberately stopped.
              this._pausedBeforeLoss = this.paused;
              this.paused = true;
              if (SOUND) SOUND.setPaused(true);
              console.warn("[gl] context lost -- paused, awaiting restore");
            },
            false,
          );
          canvas.addEventListener(
            "webglcontextrestored",
            () => {
              this._contextLost = false;
              console.info("[gl] context restored");
              this._onResize();
              this.paused = !!this._pausedBeforeLoss;
              if (SOUND) SOUND.setPaused(this.paused);
            },
            false,
          );
          this._contextLost = false;

          // Sun shadows with PCF filtering -- a lightly filtered edge that suits snow.
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = PCFShadowMap;

          // Floating-origin root.
          // Everything in the simulated world hangs off this one node; its transform is the bridge from absolute world coordinates (the skier rides at 1 AU) to the float-clean render origin established each frame in render().
          // Position-free lights and the camera attach to the scene directly.
          // _renderOrigin is the per-frame offset, held as a member so the hot path never allocates.
          this._worldRoot = new Group();
          this.scene.add(this._worldRoot);
          this._renderOrigin = new Vector3();
          this._sunShadeEased = 1; // skier's own sun exposure, eased; see Forest.sunShade

          // Ground fan
          this._fanGroup = new Group();
          this._worldRoot.add(this._fanGroup);
          this._sizeFanForFOV();
          this.groundFan = new GroundFan();
          this._fanGroup.add(this.groundFan);

          // Sky (follows camera so it reads as infinitely distant)
          this.skyGroup = new Group();
          this._worldRoot.add(this.skyGroup);
          this.sky = new SkyDome();
          this.skyGroup.add(this.sky);
          this.peaks = new Peaks();
          this.skyGroup.add(this.peaks);
          this.clouds = new Clouds();
          this.skyGroup.add(this.clouds);
          this.snow = new Snow();
          this._worldRoot.add(this.snow);

          // The directional sun's direction is all that matters for shading, but its shadow needs a camera among the geometry, so the sun and its target ride the world root and are re-aimed at the skier each frame.
          // Ambient and hemisphere lights are position-free and stay on the scene.
          const sd = CONFIG.SKY.SUN_DIR,
            SH = CONFIG.SHADOW;
          this._sunDir = new Vector3(sd.x, sd.y, sd.z).normalize();
          this._sunView = new Vector3();
          this._clock = 0;
          this.sun = new DirectionalLight(0xfff8ee, 2.2); // warm-neutral daylight
          this.sun.position.set(
            sd.x * SH.RADIUS,
            sd.y * SH.RADIUS,
            sd.z * SH.RADIUS,
          );
          this.sun.target.position.set(0, 0, 0);
          this.sun.castShadow = true;
          this.sun.shadow.mapSize.set(SH.MAP, SH.MAP);

          // Frustum bounds are recomputed every frame by _fitSunShadow() (view-frustum fit); these are placeholders until the first fit.
          {
            const c = this.sun.shadow.camera; // an OrthographicCamera aimed sun -> target
            c.left = -SH.RADIUS;
            c.right = SH.RADIUS;
            c.top = SH.RADIUS;
            c.bottom = -SH.RADIUS;
            c.near = 1;
            c.far = 4 * SH.RADIUS;
            c.updateProjectionMatrix();
          }
          this.sun.shadow.bias = SH.BIAS;
          this.sun.shadow.normalBias = SH.NORMAL_BIAS;
          this._worldRoot.add(this.sun);
          this._worldRoot.add(this.sun.target);

          // Sun-space basis, computed once (the sun never moves).
          // Matches exactly how three builds the shadow camera's frame: it looks along -sunDir with up ~ +Y, so right = up x z, up = z x right.
          {
            const zL = this._sunDir;
            const upHint =
              Math.abs(zL.y) > 0.99
                ? new Vector3(0, 0, 1)
                : new Vector3(0, 1, 0);
            this._sunRight = new Vector3().crossVectors(upHint, zL).normalize();
            this._sunUp = new Vector3()
              .crossVectors(zL, this._sunRight)
              .normalize();
          }

          // Preallocated scratch for the per-frame shadow fit (hot path; never allocate there).
          this._shTmp = { c: new Vector3() };
          this.scene.add(new AmbientLight(0xdde6f0, 0.55)); // brighter near-neutral fill
          this.scene.add(new HemisphereLight(0xe4eef8, 0xd2dae4, 0.65)); // bright cool sky / light ground

          // Distance bookkeeping
          this.distM = 0;
          this.vert = 0;
          this.climb = 0; // metres gained walking uphill; the mirror of _vert (see the accumulator)
          this.time = 0; // elapsed run time (s).
          // Accumulated in update(), which the loop skips while paused, so the timer suspends on the pause screen automatically.
          this._lastX = 0;
          this._lastZ = 0;
          this._hasLast = false;

          this.skier = new Skier();
          this._worldRoot.add(this.skier.group);

          // One decal layer (carve ribbon + herringbone share a mesh) so newest-paints-over-older holds globally across both mark systems -- see SnowDecals.
          this.decals = new SnowDecals(this._worldRoot);

          // Thrown snow.
          // Rides the world root like everything else, so the floating-origin rebase carries it for free.
          this.spray = new SnowSpray();
          this._worldRoot.add(this.spray);

          // Persistent chunked forest (true world positions), low-poly snowy conifers.
          // The tree material is unlit -- a painted texture times a tint, plus a brightness floor -- so no sun vector reaches it.
          this.forest = new Forest(this._worldRoot);

          // Scattered boulders / snow chunks / ice blocks (same streaming machinery as the forest).
          // Standard material, so three's own lighting pass handles the sun; the type-driven ice sheen is faked in view space off vViewPosition.
          this.boulders = new Boulders(this._worldRoot);
          this._obstacles = []; // reused scratch for collision broad-phase (no per-frame alloc)
          // Contact planes for one frame's resolution.
          // Fixed size, filled in place, never grown -- the resolver runs every frame and must not allocate.
          this._contacts = [];
          for (let i = 0; i < CONFIG.COLLIDE.MAX_CONTACTS; i++)
            this._contacts.push({ nx: 0, nz: 0, overlap: 0 });
          // Ground sampler passed to the forest/boulder streamers each frame.
          // Bound once (reads _gpx/_gpz, refreshed per frame) so I don't allocate a fresh closure every frame.
          this._gpx = 0;
          this._gpz = 0;
          this._groundAt = (ax, az) =>
            sampleTerrain(ax, az) + slopeOffset(ax - this._gpx, az - this._gpz);
          this._clearFrames = 999; // consecutive frames clear of obstacles (armed to sound when high)
          this._inCanopy = false; // inside a tree crown last frame -> the brush whoosh fires on the rising edge only
          this.chaseCam = new ChaseCamera(this.camera);

          // Camera must be in the scene graph for its child (the flare) to render.
          this.scene.add(this.camera);
          this.lensFlare = new LensFlare();
          this.camera.add(this.lensFlare);
          this.input = new Input();

          // Scatter the spawn across the mountain -- and guarantee open snow under the skier -- before anything reads its position (the grade seed just below does).
          this._pickClearSpawn();

          // Seed the live grade so the first frame doesn't lurch.
          STATE.slopeGrade = sampleGradeTarget(
            this.skier.worldX,
            this.skier.worldZ,
          );

          // Held, not fired and forgotten: the splash gates on it, so it needs a handle.
          this.assetsReady = this._loadModels();
          window.addEventListener("resize", () => this._onResize());

          // Some mobile browsers rotate with orientationchange but a late/absent resize; run the same path once the new viewport has settled.
          window.addEventListener("orientationchange", () =>
            setTimeout(() => this._onResize(), 250),
          );
        }

        // Pick a fresh, collision-free spawn each load.
        // -------------------------------
        // The clearance oracle is the live collider: every obstacle's form Q, skier radius already folded in, reports overlap via the same quadratic the runtime sweep uses, so a spawn that reads clear here cannot be touching anything on frame 0.
        // All float64, exact to microns even at the 1-AU origin.
        _pickClearSpawn() {
          const sk = this.skier;
          const S = CONFIG.SPAWN;
          const out = this._obstacles; // reuse the collision scratch -- no new garbage
          const reach = CONFIG.COLLIDE.REACH; // same broad-phase footprint the resolver builds
          const berth2 = S.CLEARANCE * S.CLEARANCE;

          // Body clear of every nearby trunk/boulder at (x,z)?
          // Trees and boulders share one record shape, so a single combined gather + one quadratic each decides it.
          const isClear = (x, z) => {
