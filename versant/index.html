<!doctype html>
<html lang="en">
  <head>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>
      Versant: Skiing in the Alpine (Procedural Terrain, Hand-Solved Kinematics,
      No Authored Animations)
    </title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
          "nipplejs": "https://cdn.jsdelivr.net/npm/nipplejs@1.0.4/+esm"
        }
      }
    </script>
    <style>
      :root {
        --hud-fg: #eaf4ff;
        --hud-accent: #8fd0ff;
        --hud-dim: #6f8aa6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe2f2;
        font-family: "JetBrains Mono", "SF Mono", "Menlo", monospace;
        color: var(--hud-fg);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #container {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #joy,
      #hopPad,
      #lookpad {
        position: absolute;
        z-index: 9;
        touch-action: none;
        display: none;
      }
      #joy {
        left: min(14px, 6%);
        bottom: min(96px, 13%);
        width: 140px;
        height: 140px;
      }
      #lookpad {
        right: min(14px, 6%);
        bottom: min(96px, 13%);
        width: 140px;
        height: 140px;
      }
      #joy::after,
      #lookpad::after {
        content: attr(data-label);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: fit-content;
        text-align: center;
        font-size: 16px;
        color: #14304a;
        opacity: 1;
        mix-blend-mode: color-dodge;
        pointer-events: none;
      }
      #hopPad {
        right: min(26px, 8%);
        bottom: calc(min(96px, 13%) + 140px);
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(143, 208, 255, 0.42);
        border: 1px solid rgba(143, 208, 255, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        color: #40698b;
        font-size: 16px;
        z-index: 9;
      }

      #helpBtn,
      #muteBtn,
      #camBtn,
      #fullscreenBtn {
        position: fixed;
        top: 12px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        color: #163049;
        mix-blend-mode: multiply;
        padding: 0;
        z-index: 60;
        opacity: 0.7;
        transition:
          opacity 0.15s ease,
          color 0.18s ease;
      }
      #helpBtn:hover,
      #muteBtn:hover,
      #camBtn:hover,
      #fullscreenBtn:hover {
        opacity: 1;
      }
      #muteBtn {
        right: 12px;
      }
      #helpBtn {
        right: 46px;
      }
      #camBtn {
        right: 80px;
      }
      #fullscreenBtn {
        right: 114px;
      }
      #muteIcon .slash {
        opacity: 0;
      }
      /* One icon, two states: the button always shows what a TAP will give you, which is why the eye appears while you are outside first person and not while you are in it. */
      #camIcon .camBody {
        display: none;
      }
      #camBtn.fps #camIcon .camEye {
        display: none;
      }
      #camBtn.fps #camIcon .camBody {
        display: inline;
      }
      #muteBtn.muted #muteIcon .wave {
        opacity: 0.15;
      }
      #muteBtn.muted #muteIcon .slash {
        opacity: 1;
      }
      /* While paused the dark overlay sits behind the controls; multiply would bury the dark ink, so drop the blend and switch to a light tint so they read clearly. */
      body.paused #helpBtn,
      body.paused #muteBtn,
      body.paused #camBtn,
      body.paused #fullscreenBtn {
        mix-blend-mode: normal;
        color: #dcebfb;
        opacity: 0.85;
      }

      #helpPanel {
        position: fixed;
        top: 50px;
        right: 12px;
        z-index: 61;
        max-width: 250px;
        padding: 14px 16px;
        background: rgba(12, 26, 42, 0.9);
        border: 1px solid rgba(143, 208, 255, 0.28);
        color: var(--hud-fg);
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.4px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      #helpPanel.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      #helpPanel b {
        color: var(--hud-accent);
        font-weight: 600;
      }
      /* Deliberately quiet: legible and reachable whenever the panel is open, but never competing with the controls above it. */
      #helpPanel .credits {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(143, 208, 255, 0.16);
        font-size: 9.5px;
        line-height: 1.5;
        letter-spacing: 0.2px;
        opacity: 0.62;
      }
      #helpPanel .credits .ttl {
        display: block;
        margin-bottom: 3px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.75;
      }
      #helpPanel .credits a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-color: rgba(143, 208, 255, 0.45);
      }
      #helpPanel .credits a:hover {
        color: var(--hud-accent);
      }

      #hud {

        left: 14px;
        top: 12px;
        z-index: 10;
        color: #14304a;

        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 1px;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        user-select: none;
        /* Informational only (no listeners). In landscape the move joystick rises into the same left-edge region; without this the HUD's box would swallow those touches. */
        pointer-events: none;
      }

        font-weight: 600;
        letter-spacing: 2px;

        font-size: 9px;
        letter-spacing: 3px;
        opacity: 0.6;
      }

        font-weight: 600;
        opacity: 0;
        transition: opacity 0.1s;
      }
      #hud .air.on {
        opacity: 1;
      }

        right: 12px;
        bottom: 12px;
        z-index: 60;

        line-height: 1.4;

        white-space: pre;

        color: #cfe2f5;

      #pauseOverlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(

          rgba(180, 210, 235, 0.55) 0%,
          rgba(90, 120, 150, 0.8) 100%

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      #pauseOverlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      #pauseOverlay::before {
        /* Small brand mark above PAUSED -- a flex item, so it stacks cleanly at any viewport. Kept subtle: the frozen scene is the hero of this screen. */
        content: "";
        flex: 0 0 auto;
        width: min(46vw, 240px);
        height: min(16vh, 110px);
        background: url(./assets/versant_logo.svg) center / contain no-repeat; /* ASSET_BASE */
        pointer-events: none;
        opacity: 0.55;
      }
      #pauseOverlay h1 {
        font-size: 38px;
        letter-spacing: 12px;
        margin: 0;
        color: #ffffff;
        font-weight: 300;
      }
      #pauseOverlay p {
        font-size: 11px;
        letter-spacing: 4px;
        opacity: 0.7;
        margin: 0;
        color: #eaf4ff;
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 16px;
        text-align: center;
        cursor: pointer;
        background: linear-gradient(
          180deg,
          #5b86c2 0%,
          #a9cdec 55%,
          #e9f3fb 100%
        );
        transition: opacity 0.5s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash::before {
        content: "";
        flex: 0 0 auto;
        width: min(86vw, 540px);
        height: min(44vh, 340px);
        background: url(./assets/versant_logo.svg) center / contain no-repeat; /* ASSET_BASE */
        pointer-events: none;
        opacity: 0.85;
      }
      #noscript {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 1px;
        color: #0d2840;
        background: linear-gradient(
          180deg,
          #5b86c2 0%,
          #a9cdec 55%,
          #e9f3fb 100%
        );
      }
      #splash .meta {
        font-size: 10px;
        letter-spacing: 2px;
        color: #355b7e;
        font-style: italic;
      }
      #splash .cta {
        margin-top: 26px;
        font-size: 13px;
        letter-spacing: 7px;
        color: #0d2840;
        animation: pulse 1.6s ease-in-out infinite;
      }

      /* The splash opens in its loading state and stays there until the module has reported that its imports resolved, WebGL is usable and the assets are in.
         Not clickable until then: a click that starts an invisible skier is worse than a click that does nothing. */
      #splash.loading {
        cursor: default;
      }
      #splash.loading .cta {
        color: #355b7e;
      }
      #splash.failed {
        cursor: default;
      }
      #splash.failed .cta {
        animation: none;
        color: #7d2323;
      }
      #splash .note {
        max-width: 34em;
        font-size: 11px;
        line-height: 1.7;
        letter-spacing: 1px;
        color: #355b7e;
        white-space: pre-line;
      }
      #splash .note:empty {
        display: none;
      }
      #splash.failed .note {
        color: #7d2323;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>

    <!--
      Boot watchdog. Classic script on purpose, and it has to be: a module's static imports are resolved before a single statement of its body runs, so if the CDN is blocked or offline the module never executes and nothing inside it can report that. 
      The failure surface therefore cannot live in the module.

      Module scripts are deferred, so this runs first regardless of order, and the splash is already in the DOM by the time it does.

      The logic is inverted from the obvious one: assume the boot failed, and let success cancel that.
      Anything that goes wrong before the module reaches its first statement -- blocked CDN, offline, corporate proxy, an import map the browser will not honour -- ends in the same place, a legible message instead of a white rectangle nobody is looking at.
    -->
    <script>
      window.__boot = (function () {
        var splash = document.getElementById("splash");
        var cta = document.getElementById("splashCTA");
        var note = document.getElementById("splashNote");
        var alive = false;
        var dead = false;

        function fatal(title, detail) {
          if (dead) return; // first cause wins; later fallout is noise
          dead = true;
          splash.classList.remove("loading");
          splash.classList.add("failed");
          cta.textContent = title;
          note.textContent = detail || "";
        }

        // Generous, because this also has to cover a slow first load of ~1.2 MB of three over a bad connection. Cancelled the moment the module runs, so a healthy boot never waits on it.
        var watchdog = setTimeout(function () {
          if (!alive)
            fatal(
              "COULD NOT LOAD",
              "The engine did not load. Versant pulls three.js and nipplejs from a CDN at " +
                "runtime, so this is usually a blocked network, an offline machine or a proxy. " +
                "Check the browser console for the failing request.",
            );
        }, 12000);

        // Belt and braces. A failed module import does not reliably reach onerror, which is why the watchdog above is the primary mechanism rather than this.
        window.addEventListener("error", function (e) {
          if (!alive && e && e.message)
            (clearTimeout(watchdog), fatal("COULD NOT LOAD", e.message));
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (!alive)
            fatal(
              "COULD NOT LOAD",
              (e && e.reason && e.reason.message) ||
                "A load failed before startup.",
            );
        });

        return {
          // Called from the module's first statement: proof the imports resolved.
          alive: function () {
            alive = true;
            clearTimeout(watchdog);
          },
          fatal: fatal,
          progress: function (done, total) {
            if (dead) return;
            cta.textContent =
              "LOADING " + Math.round((done / total) * 100) + "%";
          },
          // Assets in (or accounted for). Only now does the splash become clickable.
          ready: function (warning) {
            if (dead) return;
            splash.classList.remove("loading");
            cta.textContent =
              "ontouchstart" in window || navigator.maxTouchPoints > 0
                ? "TAP TO START"
                : "CLICK TO START";
            if (warning) note.textContent = warning;
            return true;
          },
        };
      })();
    </script>

    <script type="module">
      import {
        AmbientLight,
        BackSide,
        BufferAttribute,
        BufferGeometry,
        CanvasTexture,
        Color,
        DirectionalLight,
        DoubleSide,
        DynamicDrawUsage,
        Euler,
        FloatType,
        Fog,
        FrontSide,
        Group,
        HemisphereLight,
        LinearFilter,
        InstancedMesh,
        InstancedBufferAttribute,
        InstancedBufferGeometry,
        Matrix4,
        Mesh,
        MultiplyBlending,
        MeshBasicMaterial,
        MeshStandardMaterial,
        NearestFilter,
        OrthographicCamera,
        PerspectiveCamera,
        PCFShadowMap,
        Points,
        PointsMaterial,
        PlaneGeometry,
        Quaternion,
        Scene,
        ShaderMaterial,
        SphereGeometry,
        Sprite,
        SpriteMaterial,
        AdditiveBlending,
        LinearMipmapLinearFilter,
        RepeatWrapping,
        SRGBColorSpace,
        TextureLoader,
        Timer,
        UniformsLib,
        UniformsUtils,
        Vector2,
        Vector3,
        WebGLRenderer,
        WebGLRenderTarget,
      } from "three";
      import { clone as skeletonClone } from "three/addons/utils/SkeletonUtils.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import nipplejs from "nipplejs";

      // Every static import above resolved, so the engine is here. Cancels the boot watchdog.
      // First statement in the module on purpose: anything later could itself throw and leave the watchdog to report a CDN failure that did not happen.
      window.__boot.alive();

      // ============================================================================
      // CONFIG
      // ============================================================================
      const CONFIG = {
        ASSET_BASE: "./assets/", // "https://raw.githubusercontent.com/red-reddington/web-demos/main/versant/",

        CAMERA: {
          // Lens.
          FOV: 58,
          FOV_SPEED_ADD: 10,
          FOV_LERP: 3,
          NEAR: 0.1,
          FAR: 3200,

          // Chase rig: where the camera sits relative to the skier.
          GROUND_CLEAR: 0.5, // min metres the camera keeps above the terrain directly beneath IT (sampled at the camera's own x,z, not the skier's), so a rise behind the skier can't poke through the lens.
          // Acts as a floor under the skier-relative height.
          // Back / HEIGHT live in STATE: the player moves them at runtime.
          // Their bounds stay here.
          // along -forward

          // Look target: what the camera aims at, and how the pitch reacts.
          LOOK_AHEAD: 3.5, // look just ahead of the skier (short, so I look down, not along, the slope)
          LOOK_HEIGHT: 0.6, // look-target height above the skier
          LOOK_GRADE_DROP: 9, // extra down-look added per unit grade (steeper run => more down-look)
          // Applied to the grade ALONG the heading, not the mountain's raw grade -- see ChaseCamera.update.
          LOOK_GRADE_LERP: 2.5, // how fast that down-look eases as the heading swings across the fall line
          ACCEL_PITCH: 0.004, // brief pitch dip on acceleration

          FAN_BEHIND_CAM: 6, // push the fan apex this far behind the camera so the inner pole is never on screen

          // Free-look: clamps, easing and mouse gain.
          LOOK_YAW_MAX: 0.7, // ~40deg free-look yaw clamp

          // Mouse steering, first person only.
          // Reads yaw deflection, not raw movement: deflection is a position, so the steer is frame-rate independent and has a centre to return to.
          MOUSE_STEER_GAIN: 1.5, // steer per unit of yaw deflection; >1 so full steer arrives before the yaw clamp
          MOUSE_STEER_RECENTER: 5, // 1/s the view eases back to straight ahead once the mouse stops
          // Two clamps, not one: the range is measured from the chase gaze, which already points ~24deg down on the fall line, so the same number buys very different travel in each direction.
          LOOK_PITCH_UP: 0.9, // ~52deg above the chase gaze
          LOOK_PITCH_DOWN: 1.12, // ~64deg below it
          LOOK_LERP: 12, // how fast the view eases toward the target look angle
          MOUSE_SENSITIVITY: 0.0024, // radians of look per pixel of locked-pointer movement

          // First person.
          // Zooming past the near end of the dolly drops the lens onto the skier's head; zooming out leaves it.
          // Back is persisted, so the choice survives a reload.
          FPS_AT: 1.5, // back at or below which first person engages. Not 0: the chase camera aims at the skier, so the last metre of dolly drives the lens through the model -- head, then torso -- before the switch would fire. Roughly one body length behind is the last framing that still frames a body.
          // Eye offset from the head bone (which sits at the base of the skull).
          // Baked into the head's own frame once, so it rides the bone: applied along world axes it would be stance-dependent, and SKI_POSE alone bends the spine 54deg.
          FPS_FWD: 0.08, // toward the face
          FPS_UP: 0.07, // and up, to eye level
          // Near plane while in first person.
          // The head is not hidden any more -- it has to keep casting -- so the skull is clipped instead.
          // A larger near plane also improves depth precision, so this costs nothing.
          FPS_NEAR: 0.25,
          FPS_LERP: 12, // how fast the eye chases the head bone. Low on purpose; see the update.
          BACK_MIN: 0.5, // below FPS_AT so there is somewhere to scroll into first person, and only just: every notch under the threshold looks identical (the eye is pinned to the head bone), so a deep well would only cost taps on the way back out.
          BACK_MAX: 16, // dolly range for back (default 7.0)
          HEIGHT_MIN: 0.6,
          HEIGHT_MAX: 5.0, // range for HEIGHT (default 1.4)
          ZOOM_WHEEL: 0.5, // metres of back per full wheel notch
          ZOOM_PINCH: 0.03, // metres of back per pixel of pinch-span change
          HEIGHT_DRAG_SENS: 0.01, // metres of HEIGHT per pixel of Ctrl-drag
        },

        // The world falls along a fixed world direction (the fall line), not the player's heading, so there is no skiing uphill.
        // Grade is the current pitch and lerps toward a value sampled from a slow noise field, so the run breathes between mellow and steep.
        // Implemented as a gradient pivoted on the player each frame, so the noise frame stays float32-clean at any distance.
        SLOPE: {
          GRADE_MIN: 0.16,
          GRADE_MAX: 0.52,
          GRADE_NOISE_SCALE: 1400, // metres per noise unit along the run (big => slow changes)
          GRADE_LERP: 0.6, // how fast grade eases toward target

          DIR_X: 0,
          DIR_Z: -1, // world downhill (fall-line) unit vector; start facing it
        },

        // Spawn scatter + clearance.
        // The skier drops somewhere new every load and is guaranteed to land clear of trees and boulders (see Game._pickClearSpawn).
        SPAWN: {
          SCATTER: 500, // +/- m of random XZ offset per load.
          // World is a pure function of XZ, so this is a genuinely fresh run; X stays ~1 AU, so the float-precision flex survives untouched.
          CLEARANCE: 1.5, // berth as a multiple of the touching distance (collider boundary is val==1).
          // 1.5 ~ half a body-radius of air, and because it's a factor on Q it scales with each obstacle's size for free.

          // Vogel-spiral search, used only when the random anchor lands blocked.
          PROBE_STEP: 4, // m between Vogel-spiral probes when the anchor is blocked.
          // >= one trunk diameter, so two probes can't sit inside the same obstacle.
          MAX_PROBES: 256, // pure paranoia rail; the sparse field resolves in a handful.
        },

        SKIER: {
          // Speed envelope.
          SPEED_MIN: 0,
          SPEED_MAX: 46,
          SPEED_INIT: 12,

          // Gravity, drag and the tuck: what sets cruise speed on a given grade.
          GRAVITY_ACCEL: 10, // downhill pull; scaled by the live slope grade (see physics) and paired with DRAG_K below
          GRAVITY_GRADE_FLOOR: 0.15, // fraction of pull present even on the flattest grade.
          TUCK_ACCEL: 1.9, // extra accel while W held; rescaled with GRAVITY_ACCEL/DRAG_K (same +terminal)

          // Snowplow brake.
          WEDGE_FLIP_ALIGN: 0.2, // alignment over which the wedge mirrors front-to-back across the fall line.
          // Shared by the boot yaw, the ski re-aim and the printed chevrons, so all three flip on the same edge and ease through parallel together.
          BRAKE_DECEL: 14, // snowplow (S).
          // Must exceed GRAVITY_ACCEL (10) so a held plow can always reach a dead stop even on the fall line of the steepest grade -- but only by a margin, so stopping is a scrub over a couple of seconds, not a brick wall.
          BRAKE_FULL_AT: 0.85, // throttle magnitude that counts as a full wedge.
          // Under 1 so an analog stick does not need to be buried in the corner to reach a complete pizza -- the last 15% of travel is deadband for the player's thumb, not wedge the model can still use.
          SNOWPLOW_RELEASE_SPEED: 1.5, // m/s.
          // The wedge holds at a standstill while the brake is down (you can stop and stay plowed), but once the brake is off and I've picked up this much forward speed again the wedge is forced fully out -- no gliding downhill with the tips crossed.

          // Speed bleed: drag everywhere, extra friction off the fall line.
          DRAG_K: 0.175, // speed-proportional drag -> grade-dependent terminal cruise (see GRAVITY_ACCEL)
          UPHILL_FRICTION: 4, // extra decel when traversing/nosing uphill
          PULL_FALLOFF: 0.7, // <1 = pull falls off gently with misalignment (roughly-downhill still goes)
          SCRUB_THRESH: 0.6, // scrub only bites past a real traverse angle.
          // Collisions still block me (the resolver is direction-agnostic).
          // The climb flag (which gates the soft step scrunches) only sets when I'm actually pushing UP/across, not crawling forward on a flat.

          // Uphill walk / herringbone climb.
          CLIMB_SPEED: 0.8, // climb pace (m/s).
          CLIMB_SOUND_SPEED: 0.4, // m/s above which a trudge counts as `climbing`, which gates herringbone prints and the step sound.
          // Below it the walk latch still holds -- see the note at the pole plant edge, which has to survive this dropout.
          RELATCH_SPEED_FACTOR: 1.25, // multiple of CLIMB_SPEED that still counts as walking pace, so a hop landing relatches the climb instead of dropping to ski mode.
          RELATCH_ALIGN: 0.35, // heading alignment below which that relatch is allowed (still nosed across-to-uphill).
          CLIMB_THRUST: 80, // uphill push (m/s^2).
          // Must exceed gravity's max uphill pull (~65 at the steepest grade facing dead-up) or the climb cancels to a standstill; capped at CLIMB_SPEED so it never overshoots into a tuck.
          CLIMB_ALIGN_MAX: 0.45, // counts as climbing only when alignment is below this (facing across-to-uphill); steeper-downhill headings are just skiing
          WALK_ENTER_SPEED: 0.5, // walk/climb engages ONLY once I've coasted to ~this (a standstill).
          WALK_EXIT_MARGIN: 0.5, // once trudging, I stay latched until I out-glide the pace by this (i.e. crest onto a descent), let off W, or turn back downhill.

          // Steering.
          TURN_RATE_MAX: 1.5,
          TURN_RATE_MIN_FACTOR: 0.55, // keep enough low-speed authority to pivot when stopped
          TURN_LERP: 6,

          // Lean and roll.
          LEAN_MAX: 0.7,
          LEAN_LERP: 8,
          MAX_ROLL: 1.05,
          LEAN_BODY_SHARE: 0.55, // fraction of the lean the whole body (hips included) takes; the spine carries the rest (angulation).
          // Splitting it keeps the feet plantable while the torso still sells the full lean.
          LEAN_INTO_SLOPE_K: 1.6, // how fast the lean budget shrinks per radian of terrain side-tilt
          LEAN_INTO_SLOPE_MIN: 0.3, // floor: even on the steepest side-tilt, keep this fraction of lean

          // Ski footprint used to sample the terrain under the body.
          WHEELBASE: 1.7,
          HALF_TRACK: 0.5,

          // Lower-body terrain adaptation (per-leg suspension).
          // A closed-form 2-bone IK (hip+knee) applies it: one law-of-cosines evaluation per leg, O(1), no iteration.
          LEG_TERRAIN: {
            ENABLED: true,
            FOOT_CONFORM: 1, // 0..1: how strongly each foot pitches to its own local slope.
            FOOT_SAMPLE: 0.35, // metres fore/aft of the ankle used to read that local slope.

            // ---- heel floor: the one thing the foot/ski mismatch genuinely needs bounding ----
            ANKLE_MAX: 0.15, // rad (~9 deg): Hard ceiling on the joint's total deviation from neutral, enforced once after every other pass has had its say.
            // Small because the foot is in a rigid shell.
            // A ski boot permits a little fore/aft flex and essentially no inversion or twist, so this is close to anatomy rather than a fudge -- the composed corrections were asking for several times what a booted ankle can give.
            // Raise toward 0.25 for a boot that follows the terrain conform more closely.
            // What it spends is heel seating and boot-to-ski alignment, never the ski's conform.
            HEEL_MIN: 0.004, // metres of extra heel clearance beyond the authored rest relationship.
            // Not an absolute height: the floor compares against the rest value of the same proxy point, so this is pure margin.
            // Small on purpose -- a large value would have the floor firing every frame even when the boot is sitting correctly, which cranks the ankle and drags the ski seat with it.
            // Raise SKI_CLEAR for a visible gap; raise this only if the heel still clips.

            // Heel binding: how firmly the boot is held down onto its ski.
            HEEL_BIND: 1, // 0..1: how much of a lifted heel gets pulled back down onto the ski.
            // The two orientations are solved from different targets -- the ankle gets the residual against the body's mean plane, clamped by MAX_FOOT_PITCH, while the ski is laid fully onto its own ground normal, unclamped -- so on a sustained fall line they disagree by a fixed amount and the gap never closes on its own.
            HEEL_BACK_FRAC: 0.55, // where the heel is, as a fraction of ankle->toe measured backward from the ankle.
            // Taken from the rig so it survives a rescale rather than being a fixed distance.
            HEEL_LIFT_MAX: 0.75, // clamp (rad) on one pass, so a bad normal cannot crank the ankle round.
            HEEL_PASSES: 3, // each pass re-reads the plate through the toe, which the previous pass moved.
            // Breaks out immediately whenever the heel is already clear, which is most frames.

            MAX_FOOT_PITCH: 0.5, // clamp (rad) on the per-foot conform so a lip can't hyperextend it

            // ---- edging: a flat ski skids, an edged ski carves ----
            // The ski is laid flat on the terrain, which is the skidding configuration: right for a straight run and wrong everywhere else.
            // Rolling it about its own long axis is safe in a way rolling about any other axis would not be -- the axis is the ski's forward, so a roll cannot disturb the heading the re-aim just set, and it leaves the flatten's pitch alone.
            // Applied at the ankle so boot and ski roll as one, for the same reason as BOOT_ALIGN.
            EDGE_TURN: 0.44, // rad (~25 deg) of edge at full turn rate and full speed. Small on purpose -- the read comes from the ski no longer being flush, not from the size of the angle.
            EDGE_SLOPE: 0.9, // rad of edge per unit of cross-slope gradient: traversing a slant you stand on the uphill edges or you slide down it.
            // Reads the same dH/dRIGHT the contact normal is already built from -- free, and it is the true gradient under that foot rather than the body's mean.
            EDGE_MAX: 0.45, // clamp (rad, ~26 deg) on the two terms combined.
            // Self-gating on the climb: a herringbone up the fall line has neither cross-slope nor turn rate, so both terms go to zero on their own and this never needs to know that climbing exists.

            // Boot/ski alignment and the leg de-splay.
            BOOT_ALIGN: 1, // 0..1: how much of the ski's final re-aim is spent at the ankle instead of the toe.
            BOOT_ALIGN_MAX: 0.5, // clamp (rad, ~29 deg) on how much of it the ankle may take.
            // Whatever the clamp refuses is handed straight back to the toe, so the ski still lands precisely on markDir -- the clamp can cost boot alignment, never ski alignment.
            MAX_LEG_DESPLAY: 0.7, // clamp (rad) on the per-leg hip yaw that points the boot/ski down the track

            // IK limits.
            STAGGER_DROP_MAX: 0.12, // metres: cap on the both-feet drop that cancels the authored stance stagger.
            REACH_MARGIN: 0.03, // keep each leg this far (m) from fully straight -> no knee snap/lock
            KNEE_POLE: 1.0, // 0..1: spin the bend plane to face the foot's direction (pole vector)
            MAX_SPLIT: 0.42, // clamp (m) on each foot's move toward the shared mean clearance
            BLEND_TAU: 0.12, // seconds; ease the whole effect in on landing / out on takeoff.

            // Jump spring -- the two beats that make a jump read as alive, both nearly free.
            // Takeoff flings the arms up-forward in a fast pulse; landing compresses the knees (the hips dip by impact while the leg IK holds the feet to the snow, the CLIMB_RAISE mechanism driven the other way) and folds the spine slightly.
            ABSORB_GAIN: 0.045, // metres of hip dip per m/s of landing impact
            ABSORB_MAX: 0.18, // cap (m) on the dip
            ABSORB_TAU: 0.45, // seconds; the spring releases over this (slow, weighty recovery)
            ABSORB_SPINE: 1.2, // rad of forward spine fold per metre of dip
            JUMP_PULSE_TAU: 0.32, // seconds; the takeoff arm fling decays over this (a real swing, not a twitch)
            ARM_JUMP_FLING: 0.85, // rad both arms swing up-forward at the hop instant
            ARM_LAND_CATCH: 1.4, // rad of bracing arm swing per metre of landing dip.

            // Herringbone gait (uphill walk): feet step onto the exact world spots where the herringbone ribs are stamped (one stamp == one footfall sound == one visible step).
            STEP_LIFT: 0.14, // metres the swinging boot arcs above the snow mid-step
            REST_PARALLEL_BAKE: true, // de-splay the rest pose once at load (see the bake in _resolveLegBones).
            // The single change that makes every partial/fallback state fade between parallel stances instead of exposing the authored toe splay.
            GAIT_AIR_CUT: 0.07, // seconds; how fast the herringbone stance dies once airborne.
            // Separate from GAIT_TAU on purpose: that constant shapes the walk's own ground transitions and is far too slow for a flight (see the jump note at the blend).
            GAIT_REST_SPEED: 0.5, // m/s; below this the fore/aft step fades out so a stopped climber settles both splayed boots flat onto the snow (a herringbone rest) instead of freezing one foot mid-stride.
            // The lateral V + toed-out skis stay (they're held by the climb blend, not the stride).
            GAIT_WIDEN: 0.09, // metres each boot shifts outward during the walk (herringbone V width)

            // Landing knee spring.
            LAND_KNEE_GAIN: 1.1, // rad of extra knee flex per metre of landing absorb.
            // Post-latch, so it survives the hold: an underdamped oscillator chases the absorb impulse and drives a triple-flex crouch (hip -t, knee +2t, ankle -t), compressing on impact and rebounding once.
            LAND_KNEE_MAX: 0.38, // rad, cap on the extra flex (hard landings saturate)
            LAND_KNEE_FREQ: 3.0, // Hz; how quick the compression/rebound cycle feels
            LAND_KNEE_ZETA: 0.55, // damping ratio; < 1 gives exactly one visible rebound
            LAND_KNEE_SIGN: 1, // flip to -1 if the rig's right-axis convention folds the legs the wrong way (sign conventions in this rig are measured, not assumed)

            // Gait shaping.
            STRIDE_ACTIVE: 0.05, // stride amount below which the gait counts as at rest: the swing lift pins to zero, and no plant, scuff or pole cadence fires.
            GAIT_KNEE_OUT: 0.3, // 0..1: how far knees follow the boots' toe-out.
            // 1 == knees splay the full 53 deg with the skis (sumo squat); ~0.3 keeps knees mostly forward like a real climber
            GAIT_AHEAD: 0.05, // metres the whole stride is biased forward of the rest feet
            GAIT_TAU: 0.18, // seconds; crossfade between ski stance and the stepping gait
            GAIT_AIM_FULL: 0.85, // Climb-blend fraction past which the ski aims exactly along its rib's axis rather than asymptotically. Below this the heading eases from travel onto the rib; at or above it the two share one rotation, so a planted ski overlaps its herringbone mark precisely instead of trailing the last ~1% of the V.

            AIM_TAU: 0.16, // seconds; the ski's target heading eases toward each rib's (jittered) axis with this time constant.
            // Short vs the inter-stamp interval, so the heading converges onto the rib between steps (aligned at rest/steady) yet ramps smoothly across a stamp instead of robotically jumping.
            AIM_LOCK_BREAK: 0.6, // radians the live V axis may swing off a held stance lock before the lock is retired as stale.
            // The stance lock is released by the gait phase, which advances by distance travelled, so pivoting on the spot never retires it: the body turns, the locked world axis does not, and the ski is held on a heading that drifts arbitrarily far from its stance.
            // Comfortably above the legitimate divergence (the AIM_TAU ease across per-rib jitter, a few tenths of a rad) and well below the 90 deg where the tip/tail read would start picking the wrong end of the ski.

            CLIMB_RAISE: 0.14, // metres the hips rise while walking (straighter knees than the tuck).
            // This lifts the model holder only.

            // ---- ski seat (ski-on-terrain) ----------------------------------------------------------
            SKI_SINK_MAX: 0.12, // metres: clamp on the tip/tail penetration lift.
            // The guard is one-sided (it only ever lifts, never lowers) so it cannot fight the boot-under seat; this just stops a terrain spike under a ski tip from launching the skier.
            SKI_SEAT_BITE: -0.015, // metres of perpendicular clearance the lowest point of the ski's base is placed at.
            // Slightly negative so the ski beds into the surface rather than resting on it like glass.
            // Perpendicular, not vertical -- see the seat block in applyPoseIK.
            BOOT_ON_RIB: 0.2, // metres along each rib (from its base) where the boot pins

            // Spine posture: upright when slow or climbing, folded forward at speed.
            SPINE_CLIMB_STRAIGHT: 0.4, // rad the spine unbends from the authored tuck when slow or climbing -- this IS the standing posture; the speed lean departs from here.
            SPINE_SPEED_LEAN: 0.25, // rad of forward lean beyond the authored tuck at full speed
            SPINE_SPEED_REF: 20, // m/s at which the speed lean saturates.

            // Double-poling: in the cruise band the skier pushes off the snow with both poles together -- reach forward, drive back past the hips, torso crunching into each push.
            // Hands peak forward at phase 0 (the pole plant) for the poles-parented-to-hands stage later.
            PUSH_MIN: 1.0, // m/s (~4 km/h): below this he's basically standing
            PUSH_MAX: 13, // m/s (~47 km/h): above this poling is useless -> aero tuck instead
            PUSH_RATE: 0.9, // poling cycles per second
            PUSH_ARM_AMP: 0.55, // rad of fore/aft double-pole arm swing
            PUSH_SPINE: 0.12, // rad of extra forward torso crunch at the peak of each drive
            PUSH_TAU: 0.25, // seconds; ease the poling in/out at the band edges
            PUSH_THRUST: 2.2, // m/s^2 peak propulsion at the height of each drive stroke (0 = theater only).

            // Snowplow (brake): toes pinch inward, heels push out, tracks flare, snow scrapes.
            BRAKE_WEDGE: 0.38, // rad each boot toes inward while braking (the pizza)
            // Where that yaw is spent: this fraction at the hip (whole leg swings), the rest at the ankle.
            // Downhill it must be mostly the hip -- a forward wedge is femur rotation (a boot shell permits no twist), and the visible boot shaft is skinned to the shin, so an ankle-only yaw turns the ski while the boot still points straight ahead.
            // Faded out facing uphill, where the wedge mirrors to tails-together: that reads correctly on the ankle alone.
            // The two shares sum to the wedge angle by construction, so the ski lands in the same place for any value here.
            BRAKE_LEG_YAW: 0.8,
            BRAKE_WIDEN: 0.22, // metres each boot pushes outward while braking (heels out).
            // This is what buys the wedge angle.
            // Toeing the boots in swings each tip toward the midline, so with the feet close together a deep wedge has nowhere to put the tips except through each other -- see the tip-clearance solve in applyPoseIK, which caps the angle at whatever the current stance can accommodate.
            // Widen the stance and the cap opens, which is the same trade a real skier makes, and it is why a snowplow is a wide stance and not just rotated feet.
            BRAKE_TIP_CLEAR: 0.06, // metres of air left between the converging tips at full brake
            BRAKE_SINK_MAX: 0.07, // ceiling on the plow hip drop (m). A tripwire on a derived number, not a tuning knob.
            BRAKE_TAU: 0.15, // seconds; ease the wedge in/out
            BRAKE_RELEASE_TAU: 0.12, // seconds; once the brake is off and I'm gliding forward again, the wedge folds out over THIS (fast, linear) and pins to zero -- so a restart can never settle with the tips pinched in front.
            // See SNOWPLOW_RELEASE_SPEED.

            // Airborne tuck: a compact flight pose, eased by the same blend that gates the terrain legs -- so it grows through takeoff and melts away through landing.
            AIR_TUCK_MIN_SPEED: 1.5, // m/s below which an airborne moment gets NO tuck (walk hops)
            AIR_TUCK_RAMP: 3, // m/s over which the tuck ramps to full above that
            AIR_FEET_IN: 0.12, // metres each foot pulls toward the midline in the air
            AIR_FEET_UP: 0.18, // metres the feet rise (knees fold up) in the air
            AIR_ARM_FWD: 0.45, // rad both arms swing forward in the air
            AIR_ARM_IN: 0.35, // rad both arms adduct toward the body's front midline in the air
            AIR_ELBOW: 0.7, // rad of extra elbow flexion in the air, lifting the forearms front/up.
            // The only air term that touches the forearm: AIR_ARM_FWD, AIR_ARM_IN, ARM_JUMP_FLING and ARM_LAND_CATCH all drive the shoulder, and FOREARM_FOLLOW only carries the lean and climb-swing deltas, both of which are ~0 in flight.
            AIR_ELBOW_FWD: 0.9, // fraction of AIR_ELBOW also carried into the shoulder as forward swing, so the two move as one gesture.
            // The mirror of FOREARM_FOLLOW, which pushes shoulder deltas down into the forearm; this pulls an elbow delta up into the shoulder.
            // 0 decouples them and leaves AIR_ARM_FWD as the only forward term.
            // The total forward swing is AIR_ARM_FWD + AIR_ELBOW * this, so if the arms reach too far in front, trim AIR_ARM_FWD rather than this -- that keeps the coupling intact and just lowers the baseline.

            // Speed tuck: the arms and poles fold in as the run gets faster.
            ARM_TUCK: 0.2, // rad the arms draw in toward the body at full speed, downhill only.
            ARM_TUCK_ELBOW: 2.2, // multiplier on the speed tuck applied as elbow flexion.
            // At 2.2 the full tuck folds the elbows ~50 deg, bringing the forearms toward horizontal with the poles trailing under them -- and the poles follow for free, since they hang off the hands.
            // 0 for straight arms.
            ARM_TUCK_SPAN: 1, // fraction of SPEED_MAX over which the tuck travels, so the arms move across the whole speed range rather than a slice of it.
            // Derived from SPEED_MAX rather than restated, so retuning the top speed carries this with it.
            // Below 1 to reach full tuck before top speed (a racer is folded up well before terminal velocity).

            // Pole carry: how the poles trail while tucked or airborne.
            POLE_AIR_SWEEP: 0.85, // 0..1 how far the poles sweep toward trailing while airborne.
            // The reach is grounded-only (a pole reaches for snow when there IS snow under it), so without this they hang straight down in flight, which nobody does.
            // Fades in with airT rather than snapping on at takeoff.
            POLE_TUCK_SWEEP: 1, // 0..1 how far the wrist swings the pole back at full speed tuck.
            // Without it the elbow flexion raises the grip while the shaft keeps its angle, so the tip rotates down into the snow and drags harder the faster you go.
            POLE_TUCK_EARLY: 1.8, // multiplier on the tuck fraction before it drives the pole sweep, so the poles are trailing properly by cruising speed instead of only at terminal velocity.
            // Clamped at 1, so this sets how early full trail is reached, not how far it goes.
            POLE_DESPLAY_MIN: 0.9, // 0..1 FLOOR on the de-splay, held whenever a pole is carried rather than planted.
            // Separate from the sweep weight on purpose: how far the poles trail is a function of speed and flight, but how far they SPLAY should not be -- outriggers are wrong at every speed, standing still included.
            // Set to 0 to tie the de-splay back to the tuck/air weight alone.
            POLE_TUCK_YAW: 1, // 0..1 how far the poles are yawed parallel to the body after being pitched back.
            // The pitch alone cannot do this: it is deliberately confined to one axis so the pole can never move sideways into the leg, which also means it preserves the outward splay the authored mount gives the pole.
            // This removes that splay, and only after the tip is behind the body where the yaw sweeps through empty air.
            POLE_TUCK_WIDE: 0.18, // residual outboard width the yaw aims at, so the two poles trail at hip width rather than converging on the spine.
            POLE_TUCK_RISE: 0.05, // how much of the tucked pole direction points UP rather than straight back.
            // Lower than the airborne value: in a tuck the poles run nearly level under the arms, whereas in flight they lift clear behind.
            POLE_SWEEP_WRIST_MAX: 0.55, // rad the wrist may contribute to the tuck/air sweep (~32 deg, about what a real wrist cocks).
            // Lower this and the elbow picks up more of the same total; the pole's final direction does not change either way.
            POLE_SWEEP_ELBOW_MAX: 1.3, // rad the elbow may contribute to the same sweep, taking whatever the wrist could not.
            // Between them these two cap how far the pole can be swung at all: if the sum is short of what the trailing target asks for, the pole simply trails less, which is a far better failure than a broken wrist.
            POLE_AIR_RISE: 0.25, // how much of the airborne pole direction points UP rather than straight back -- a trailing pole rather than one dragging at ground level.

            // Head / neck / spine follow of the camera free-look.
            NECK_YAW_FOLLOW: 0.55, // fraction of camera free-look yaw the neck turns (negate to flip)
            HEAD_YAW_FOLLOW: 0.35, // fraction of the yaw carried by the head on top of the neck.
            // Split so the glance cascades down the chain instead of hinging at one joint -- one-joint rotation past ~40 degrees reads as an owl, not a look.
            SPINE_YAW_FOLLOW: 0.3, // fraction of the yaw carried by the upper spine.
            // This, not the head, is the visible cue: from the behind camera a featureless dark head gives silhouette almost nothing, but the shoulder line rotating is unmissable.
            HEAD_ROLL_FOLLOW: 0.12, // small head roll per radian of yaw -- a person glancing sideways tips the head a touch; pure yaw on a dark head reads as nothing, the tilt changes the hat's outline, which IS visible.
            HEAD_PITCH_FOLLOW: 0.55, // fraction of free-look pitch carried by the head (negate to flip).
            NECK_PITCH_FOLLOW: 0.45, // neck's share: the visible extend/compress
            SPINE_PITCH_FOLLOW: 0.15, // upper-back share -- shoulders round on look-down, chest opens on look-up.
            // Kept small: the spine also carries the tuck crunch and angulation, and a big look share would fight the posture at speed.
            PITCH_FOLLOW_LIMIT: 0.42, // ceiling on the pitch the three bones above are allowed to see, radians.
            // The camera pitches to CAMERA.LOOK_PITCH_UP / LOOK_PITCH_DOWN (~52 / ~64 deg), but the three shares above sum to 1.15, so feeding them the raw angle would drive the neck through ~74 deg and snap the head onto the shoulders.
            // Saturated with tanh rather than clipped: below the limit it is the identity, above it it eases to a stop, so the body keeps moving with the look and simply runs out of neck instead of hitting a corner.

            // Arm counter-pose: pole-push swing and the counter-tilt against lean.
            ARM_SWING: 0.5, // radians of fore/aft pole-push arm swing during the climb (negate to flip which arm leads; 0 disables).
            // Contralateral: each arm mirrors the opposite leg.
            ARM_LEAN_GAIN: 0.55, // radians of counter-tilt per radian of lean (negate to flip sides)
            ARM_LEAN_MAX: 0.5, // clamp (rad) on the counter-tilt
            FOREARM_FOLLOW: 0.45, // fraction of the upper-arm delta carried into the forearm.

            // Pole-tip ground reach: keep each pole's tip on the snow under it (climb plant, and the carried glide/cruise pose) instead of floating in the air.
            // A clamped, self-correcting 1-bone shoulder reach measured from the live pole tip; fades out airborne.
            POLE_REACH_MAX: 0.9, // clamp (rad) on the shoulder pitch the reach may add -- big enough for the wide-arm glide to set the tips down.

            // Cycle fractions shaping poleDrive.
            // poleDrive clamps them, but pick values that fit or the shape you get is not the shape you wrote.
            // Read the phase first or these will be set backwards: phase 0 is the arm at max forward -- the plant -- and the push runs 0 to 0.5 as the arm drives back past the hip.
            // So 0 to POLE_PUSH_END is the push, and everything after the release is the forward recovery, where the tip must be off the snow.
            POLE_PLANT_LEAD: 0.06, // the tip drops in right AT the front, not on the way there
            POLE_PUSH_END: 0.42, // loaded through essentially the whole backward push
            POLE_RELEASE: 0.06, // and off the snow again by the back of the stroke
            POLE_RECOVER_LIFT: 0.09, // metres of clearance the tip is held above the snow while the arm swings forward.
            // Without this the reach merely stops pressing down during the recovery and the tip is left wherever the animation put it -- which is dragging through the snow.
            // The constraint is one-sided (lift only, never pin), so the arm's arc still owns the motion.

            // ---- the three joints the reach may nudge, all extend-ONLY and all weighted ------------
            POLE_WRIST_MAX: 1.15, // rad the wrist may open the pole away from the forearm.
            // The largest lever by far: the pole hangs ~59 deg off the forearm, folding a third of its length back on itself where the chain's straight-line reach cannot use it.
            // Drop it toward 0 if wrists look broken at the plant.
            POLE_ELBOW_MAX: 0.5, // rad the elbow may straighten.
            // Worth ~0.07 m on its own -- useful, but nowhere near enough alone.
            POLE_ELBOW_MIN_BEND: 0.25, // rad of bend the elbow is never straightened past.
            // Anatomically right, and it keeps the bend plane defined -- a colinear arm has no plane and the axis becomes noise.
            POLE_JOINT_MIN_SIN: 0.12, // sin of the smallest joint angle the nudges will act on, using unit vectors so it is a real angle (~7 deg).
            // Faded rather than cut off, so the pose never jumps between "nudged" and "untouched" on consecutive frames.

            // Plant placement: where a tip is allowed to come down, and when it lets go.
            POLE_PLANT_OUT: 0.3, // metres the plant is kept outboard of the body's centreline, on that arm's own side.
            // A pole may never come down between the legs -- there is no pose where that is right, and the arm swing will carry the target across the centreline if nothing stops it.
            // One-sided: a plant that is already wider than this is untouched.
            POLE_ANCHOR_KEEP: 0.97, // fraction of the arm+pole chain's own length at which a planted tip is released.
            // Beyond it the anchor is behind the skier and out of reach, which is precisely when a real pole tears out of the snow -- so the release is the physics, not a fudge.
            POLE_CONTACT_MAX: 0.1, // metres, measured ALONG the shaft: how far the tip may still be from the snow and still count as a plant.
            // Beyond it the pole is visibly in the air and the plant leaves nothing -- no mark, no sound, because a mark is a claim that the tip touched.
            // It doubles as the search range for placing the mark, so contact and placement are one computation and cannot disagree.
            // Measured along the shaft, not vertically.
            POLE_PLANT_SINK: 0.02, // metres the tip aims below the snow (so it visibly bites, not just kisses)

            POLE_LIFT_GAIN: 0.35, // 0..1 how hard the recovery lift pushes the tip back up when it is under the clearance floor.
            // A soft floor on purpose: at 1 it is a hard pin and the arm fights the animation frame to frame, which is most of what reads as robotic.
            // The poles are carried in the authored tuck and only reach for the snow on an actual plant -- a climb step or a double-pole push -- which is what a skier does.
          },

          // Air
          HOP_IMPULSE: 7.2,
          GRAVITY_AIR: -23,
          AIR_STEER_FACTOR: 0.4, // mid-air steering authority vs ground (1 = full).
          // Note: steering in air still curves the actual flight path (arcade).

          // A short input buffer so a hop pressed just before touchdown still fires on landing, and a sub-frame tap is never dropped.
          HOP_BUFFER_MS: 140,

          // Bump liftoff: pop off a roller only when it's steep/fast enough to matter, and only once per bump (must descend again to re-arm).
          BUMP_MIN_VY: 3.2,
          BUMP_MIN_SPEED: 18,
          BUMP_LAUNCH: 1.15,
          BUMP_POP: 3.5, // absolute upward impulse (m/s) added on top of the surface's own rise rate at a lip, so the skier always out-climbs the ground by a real margin and gets visible airtime.
          BUMP_MAX_VY: 12.0,
          BUMP_REARM_VY: -0.8,
          BUMP_COOLDOWN: 0.3,

          // Derive the right arm's rest pose by reflecting the left one, instead of trusting the hand-authored mirrored numbers in SKI_POSE.
          // Those numbers are offsets added to the FBX's bind rotations, and negating y/z only mirrors the result if the bind itself is a componentwise mirror in the same Euler order -- which no exporter promises.
          // See armMirror.
          MIRROR_ARM_REST: false,

          // Model placement and orientation.
          MODEL_SCALE: 0.01,
          EYE_MAX_OFFSET: 3, // metres the head may sit from the skier's origin before the eye is treated as garbage. A tripwire, not a tuning knob.

          // The terrain solve pins the boot sole to the snow, but the ski rides below the sole, so at the stock -0.33 the ski sank by its own thickness.

          MODEL_Y_OFFSET: -0.2,
          HEADING_CORRECTION: -Math.PI,

          // Character asset.
          BODY_COLOR: 0xd23b3b,
          MODEL_URL: "./assets/character/explorer.glb",
          TEX_COLOR: "./assets/character/texture.png",
          TEX_NORMAL: "./assets/character/normal.png",
          TEX_AO: "./assets/character/occlusion.png",

          // --- Attached gear (poles + skis) from a separate GLB, parented to skeleton bones ------
          // The four meshes are parented onto hand / toe bones so they ride the body for free: the existing scene-graph world-matrix pass moves them with the skeleton, no per-frame code.
          // (See Skier.setModel for the attach.) Leave GEAR_URL null / asset absent to disable.
          GEAR_URL: "./assets/gear/gear.glb",
          // Gear size multiplier.
          GEAR_SCALE: 100.0,

          SKI_CLEAR: 0.008, // metres the ski sits below the boot sole, added to the GEAR_MOUNTS offset.
          // Small on purpose: it is a pure translation for the authored mount being a few millimetres out, and nothing more.

          POLE_LENGTH: 1.42, // metres from the hand's grip to the basket, enforced at load by scaling the pole along its shaft.
          // Not cosmetic: this is the single number that decides whether a pole plant can reach the snow at all.
          // The chain's reach is roughly upper arm + forearm + this, and a plant straight up the fall line has to span the full shoulder height, ~1.52 m.
          // The reach's joint nudges only open as far as they must, so pole length trades directly against how contorted the plant looks.

          // Slide each pole down its own shaft (toward the snow tip) by this fraction of the pole's length, so the hand ends up gripping higher on the shaft -- less pole sticking up above the grip.
          // Along the real shaft, not the wrist axis.
          // 0 = no slide; bigger = grip higher.
          POLE_GRIP_FRAC: 0.02,

          // Per-mesh mount.
          // rot is in the bone's local frame, so which axis does what depends on the rig and how the meshes were authored.
          // If a piece is off: a ski must stay flat, so its flip is a yaw about the bone's vertical axis -- if [0,0,PI] tips it out of plane, move the PI to whichever slot keeps it flat; a pole flips up/down about a horizontal axis; if one side comes out mirrored, negate that side's offending component.
          // `bone` is the parent joint.
          GEAR_MOUNTS: {
            poleL: {
              bone: "mixamorigLeftHand",
              pos: [-3.5, 15, 0.4],
              rot: [Math.PI + 0.75, -0.75, Math.PI],
            },
            poleR: {
              bone: "mixamorigRightHand",
              pos: [3.5, 15, 0.4],
              rot: [Math.PI + 0.75, 0.75, Math.PI],
            },
            skiL: {
              bone: "mixamorigLeftToeBase",
              pos: [0, 0, 3],
              rot: [0, 0, Math.PI],
            },
            skiR: {
              bone: "mixamorigRightToeBase",
              pos: [0, 0, 3],
              rot: [0, 0, Math.PI],
            },
          },
        },

        TERRAIN: {
          // Octave A: the moguls, whose amplitude is swept by a slow envelope.
          OCTAVE_A_SCALE: 95,
          // Mogul amplitude is not a single number: a slow world-anchored envelope, its own low-frequency periodic-Perlin octave, sweeps it between these two during the descent.
          // So the run passes from gentle stretches into big-mogul fields and back without the terrain ever morphing underfoot -- it is a function of where, not when.
          // Set min == MAX for a constant amplitude.
          OCTAVE_A_AMP_MIN: 2.4,
          OCTAVE_A_AMP_MAX: 12.4,
          OCTAVE_A_AMP_SCALE: 520, // metres per envelope lattice unit -> ~half-km zones (bigger = slower character changes).
          // Far coarser than the 95 m moguls it modulates.

          // Octave B: the broad rolls under the moguls, at a fixed amplitude.
          OCTAVE_B_SCALE: 200,
          OCTAVE_B_AMP: 4.2,
        },

        FAN: {
          // Wedge extent.
          RADIUS: 320,
          INNER_RADIUS: 0.5,

          // Tessellation.
          // Rings are also the shadow receiver's sampling rate, which is what sets them this high.
          // The vertex shader evaluates the exact terrain height at each vertex and the surface is linear between them, so the depth the ground compares against in the shadow test is a piecewise-linear approximation of a curved field.
          // The fan is re-anchored and re-rotated to the view azimuth every frame, so those triangles slide across the terrain continuously and that approximation error is never the same twice.
          // At a 17.4 deg sun a height error becomes a 3.18x lateral error in where the shadow edge lands, which is why an undersampled receiver shimmers far more than a correctly texel-snapped shadow camera ever could.
          // 128 halves the worst spacing inside the shadowed region from 4.45 m to 2.21 m; linear-interpolation error goes as the square of the spacing, so the wobble drops to about a quarter for 3200 extra vertices in one draw call.
          RINGS: 128,
          SECTOR_DENSITY: 41.9,
          SECTORS_MIN: 12,
          SECTORS_MAX: 220,

          // Shape.
          RAMP_EXP: 2.1,
        },

        SKY: {
          // Gradient.
          TOP: 0x4f7fbe,
          BOTTOM: 0xdfecf8,

          // Fog / haze.
          FOG: 0xeef5fc,
          FOG_DENSITY: 0.0042,

          // Sun.
          SUN_DIR: { x: -0.55, y: 0.3, z: -0.78 },
        },

        // Sun shadows.
        // A sphere's radius doesn't depend on where the camera points, and capping it to max FOV stops it breathing with speed, so the box is the same size every frame.
        // The sun grazes low (~17 deg), so the depth test sits almost flat on the snow -- hence the biases.
        SHADOW: {
          // Map + the region it covers.
          // The box is fitted to the skier, not to the view frustum, and that is the whole reason these shadows are sharp.
          // A frustum fit answers "what can I see": out to a useful distance that is a 165 m square, and one map across it is 8 cm per texel -- wider than a ski pole, so a pole simply cannot cast.
          // What the eye studies is the skier, their tracks and their poles, all within a few metres of one point, and the atlas now holds nothing else -- every static caster has its shadow drawn instead (see DECAL below).
          // Which is why the map is small as well as tight: halving the radius halves the texel, and halving the map puts it back, so this is the same 1.17 cm per texel a 2048 map over a 12 m box gave, for a quarter of the memory and a quarter of the depth-pass fill.
          MAP: 1024, // shadow atlas resolution (texels per side)
          RADIUS: 3, // half-width (m) of the box -> 0.59 cm per texel

          // Raise the box off the snow so the skier sits in the middle of it rather than standing on its floor.
          // Worth doing because the box is square and the skier is not centred in it by default: measured from the feet their content spans -0.45 to +2.26 m in light space, so a foot-centred box has to be 2.26 m tall to hold 2.71 m of skier. Centred, 1.36 m does it.
          // That halves what RADIUS has to cover vertically, which is how it got down to 3 -- and the binding constraint is now the horizontal reach of the skis and poles, not the height of the figure.
          SUBJECT_LIFT: 0.95,

          // Depth range along the sun ray. Both of these are about depth only; neither affects how sharp the shadow is.
          // NEAR_PAD stands the light off far enough that the skier clears the near plane.
          // DEPTH_REACH is how far PAST the caster the map must still resolve, and it exists for one case: a caster and its shadow sit at the same point in the shadow map (displacement along the sun ray is pure depth, exactly zero in light XY), so a jump never moves the shadow sideways -- it moves the receiving ground away down the ray. At this sun a 2 m hop puts it 6.7 m out and an 8 m launch 27 m, and past the far plane there is simply no shadow.
          // Cheap to be generous with: an orthographic depth buffer is linear, so 24 bits across 36 m is two micrometres a step.
          NEAR_PAD: 3,
          DEPTH_REACH: 30,

          // Projected shadows for the scenery this box no longer reaches (see ShadowDecals). Shared by the forest and the boulders, so it lives here rather than under either of them.
          DECAL: {
            SEG_X: 4, // tessellation across the shadow
            SEG_Z: 10, // and along it. The patch spans 15-25 m of terrain, so this is the sampling rate that decides whether it drapes over moguls or cuts through them; it is the ground fan's own ring spacing that sets the useful floor.
            DARKNESS: 0.71, // snow multiplier under full coverage, derived rather than eyeballed: the atlas shadow removes only the direct sun, so shadowed snow keeps the ambient, the hemisphere and the emissive sky-bounce floor. On flat lit snow that is 1.552 of 2.192, and matching it is what stops a tree changing tone as it crosses the handover.
            POOL_R: 0.45, // radius of the contact pool at the caster's foot, as a fraction of its half-width.
            // Sized to the job and no larger. The card's silhouette already covers the ground downsun; what it cannot cover is the band the base dissolve thins away, roughly half a metre of tree at the snow line. Anything much past this stops reading as contact and starts reading as a smudge under the tree.
            POOL_SOFT: 0.7, // fraction of the pool that stays solid before the edge falls away. Contact shadow, so the edge is fairly crisp; a long ramp is what makes it look like fog rather than shade.
            SHADE_LERP: 6.0, // how fast the skier's own sun exposure follows the tree shadow it is crossing
            RAISE: 0.05, // metres above the snow, the same trick the carve ribbon uses: enough to win the depth test against the surface it is lying on, small enough to stay invisible at a grazing sun.

            // Boulder shadows only (the analytic-ellipse path; see ShadowDecals `ellipse` mode).
            // A rock is an ellipsoid, and an ellipsoid lit by a directional light casts exactly an ellipse on the ground -- no silhouette card, no contact pool, no blend between the two. One ellipse, solved.
            ELL_SPREAD: 1.06, // scale on the exact silhouette. Small, because the ellipsoid is now sized from the mesh's true bounding extents rather than a mean radius, so it already covers the rock; this is just enough margin that the radial fade finishes outside the outline instead of eating into it.
            ELL_FADE: 0.18, // radius (in ellipse units, 1.0 = the spread outline) at which the radial falloff starts. Low, so almost the whole ellipse is ramp: a small solid core under the rock fading out over the full span, which is what keeps the edge from ever reading as a drawn outline on open snow.
          },

          // Depth biases, for a sun that grazes the snow.
          BIAS: -0.0006, // constant depth bias -- kills acne on the near-flat snow
          NORMAL_BIAS: 0.05, // lift the receive sample along the surface normal (cleans the terminator)
        },

        PEAKS: {
          // Mesh resolution and vertical placement.
          SEGMENTS: 240,
          LEVELS: 7,
          BASE_Y: -90,
          GRADE_RISE: 120,

          // Altitude bands.
          SNOW_LINE_LO: 20,
          SNOW_LINE_HI: 150,
          HAZE_HEIGHT: 230,

          // Palette.
          ROCK: 0x8294ad,
          SNOW: 0xfdfeff,
          HAZE: 0xe2edf8,
          SHADOW: 0x6c82a4,

          // The three concentric ridge curtains, near to far.
          LAYERS: [
            { radius: 1300, maxH: 260, haze: 0.3, seed: 11.3 },
            { radius: 1950, maxH: 360, haze: 0.52, seed: 53.7 },
            { radius: 2600, maxH: 470, haze: 0.74, seed: 88.1 },
          ],
        },

        SNOW: {
          // The volume the flake cloud occupies around the camera.
          COUNT: 1300,
          BOX_XZ: 55,
          TOP: 34,
          FLOOR: -8,

          // Motion and size.
          FALL: 3.4,
          SWAY: 0.55,
          SIZE: 0.85,
          DRIFT_FROM_SPEED: 0.5,
        },

        // SNOW SPRAY -- the snow the skis actually throw: rooster tail off a carving edge, wedge scrub, landing puff.
        // Rates are per second (fractional accumulators), so the look is identical at 30 or 144 fps.
        SPRAY: {
          // Pool budget.
          MAX: 900, // pool size.
          // Hard ceiling on live puffs; overflow evicts the oldest of 3 random candidates (power-of-choices), so the spray thins under load instead of stalling.
          BURST_CAP: 26, // most puffs one continuous emitter may spawn in a single frame (a long frame can't dump the whole budget at once)

          // Puff lifetime and size.
          LIFE: 0.85, // seconds
          LIFE_JIT: 0.45, // +/- fraction
          SIZE: 0.18, // half-size (m) at birth
          GROW: 0.62, // half-size added over a full life -- puffs expand as they dissipate

          // Emission rates, per second, by what the skis are doing.
          LOADED_SKI_FRAC: 0.78, // fraction of carve puffs thrown from the loaded (outside, biting) ski rather than the inside one
          MIN_SPEED: 2.5, // below this the skis aren't moving enough snow to throw any
          CARVE_RATE: 300, // puffs/s at full edge bite and full speed
          PLOW_RATE: 240, // puffs/s at a full snowplow wedge
          BRUSH_RATE: 800, // puffs/s at full brush strength (branch brush).
          // Per second, which makes the count per tree self-normalising: crossing faster raises the strength and shortens the time inside by the same factor, so a crown sheds about 20 puffs whether it is crossed at 15 m/s or 46.
          BASE_RATE: 30, // fine dust off the tails just from running fast (scales with speed^2)
          LAND_BURST: 38, // puffs in the touchdown ring at a full-force landing
          HOP_BURST: 16, // puffs kicked up leaving the lip

          // Launch velocity and how the thrown snow decays.
          EJECT: 3.4, // m/s thrown sideways off the biting edge at full carve
          UP: 2.1, // m/s thrown upward off the edge
          CARRY: 0.55, // fraction of the skier's velocity the thrown snow leaves with (they outrun it -- that's what makes it trail)
          DRAG: 2.9, // 1/s velocity decay.
          // Snow dust is light: it sheds its throw fast and is left behind, which is exactly the rooster-tail read.
          GRAVITY: 5.6, // m/s^2 -- deliberately under 9.81 so fine crystals hang in the air
          WIND_LIFT: 1.1, // m/s of upward push from the air the skier drags along (scales with speed)
          SPIN: 2.2, // +/- rad/s of billboard roll

          // Look: fades, opacity and colour.
          SOFT: 0.4, // metres: the soft-particle fade band above the snow.
          // See SnowSpray -- this is where the hard intersection line with the ground gets killed, without a depth prepass.
          NEAR_FADE: 1.6, // metres of fade-out as a puff approaches the lens (stops a face-full of billboard)
          OPACITY: 0.5,
          SUN_GAIN: 0.42, // forward-scatter brightening when the eye looks toward the sun through the spray
          LIT: 0xfdfeff, // the crystals catching the light
          SHADE: 0xd3ddea, // the underside, sitting in the snow's own shadow

          // Sprite atlas, generated at boot.
          ATLAS_GRID: 2, // sprite atlas is GRID x GRID puffs (variety comes from these x free rotation x aspect jitter)
          ATLAS_CELL: 256, // pixels per atlas cell
        },

        // Drifting cloud sheet (world-locked simplex noise).
        CLOUDS: {
          COLOR: 0xffffff,
          HEIGHT: 400,
          SPAN: 15000,
          ALPHA: 0.5,
        },

        TRACKS: {
          // Ribbon geometry: how many points are kept and how wide each cross-section is.
          MAX_POINTS: 340,
          MIN_STEP: 0.4,
          SKI_OFFSET: 0.24,
          W_OUT: 0.11,
          W_IN: 0.025,
          RAISE: 0.008,

          // Edge behaviour and the displaced-snow berm.
          CARVE_NARROW: 0.55, // fraction of the lifted side's half-width surrendered at full edge.
          // A ski up on edge stops printing its whole base: the raised shoulder leaves the snow and only the digging edge cuts, so the band narrows and its centre walks toward the edge doing the work.
          // Only the lifted side is touched; the digging side keeps its full reach, being the part still in the snow.
          JITTER: 0.45,
          BERM_HEIGHT: 0.021, // geometric rim lift (m) on the outer edges.
          // The decal is unlit, so this reads as silhouette + parallax (edge rises over the groove at grazing angles), not shading.
          // Jittered per point, fades with age alongside the colour.
          // 0 disables (flat ribbon, pre-berm look).

          // Palette + the shadow the skier casts across a track.
          GROOVE: 0xc6ccd4,
          BERM: 0xfffdf6,
          SNOW_FADE: 0xf4f6fa,
          SHADOW_DIM: 0.6, // how dark a track gets where the skier's shadow crosses it (1 = no dim)

          // Organic edges.
          // Snow does not break along a straight line, but a decal strip's outline is exactly as straight as the quad that carries it.
          // Rather than tessellate the outline -- more verts, more CPU, every frame -- the boundary is eaten into per fragment by a world-anchored noise field, so the silhouette wanders even though the geometry underneath is still four columns wide.
          EDGE_PERIOD: 0.8, // metres per tile of the noise field. Sets the wavelength of the raggedness: features land at roughly an eighth of this.
          EDGE_BITE: 0.3, // how far in the boundary may be eaten, as a fraction of the outer-to-groove span (~8.5 cm), so ~0..2.5 cm.
          // 0 restores the dead-straight edge exactly.
          EDGE_SOFT: 0.13, // width of the cut's own ramp, same units. Just wide enough to antialias; wider reads as a blur rather than a broken edge.
          EDGE_GRAIN: 0.22, // fine speckle across the whole mark (crystal structure), from a second octave already baked into the same texel -- free, no extra fetch.
          EDGE_CORNER: 0.9, // corner radius where a mark's long side meets its end, in the same inset units (1.0 ~ the outer-to-groove span, ~8.5 cm).
          // Must stay above EDGE_BITE + EDGE_SOFT or the cap starts eating the mark's own interior.
          // 0 gives back square corners.
          EDGE_END_FADE: 2.0, // scales how far in from a mark's END the taper reaches, as a multiple of its own lateral span.
          // At 1 the shoulder is geometrically correct but reads abrupt on a rib, reaching full width only 3.6 cm from the end.
          // 2 spreads it over ~11 cm, about what a ski whose tip is already curving away actually leaves.
          // Being expressed per-mark is the point: a pole dab rounds like a dab and a rib rounds like a rib, off one number.
          EDGE_FINE: 0.35, // how much of the fine octave rides on top of the coarse edge wander.
          // A mark smaller than one coarse feature -- a pole poke is barely one -- gets a nearly constant cut from the coarse field alone, which is a straight edge by another name.
          // The fine octave is already in the same texel, so this costs two ALU and nothing else.
          EDGE_TIP_HOLD: 0.4, // how much of the erosion budget the rib's tip cross keeps.
          // Below 1 the far end of a herringbone rib gets chewed harder than its planted end, which is what a print pressed by a lifting ski actually looks like.

          // Where the ribbon starts relative to the body.
          CARVE_LEAD: 1.15, // metres ahead of the body to start the carve ribbon, so its leading edge reaches the ski tip instead of trailing from the boot.
          // Dial up until the track starts right at the tip.
        },

        // Climbing leaves a herringbone: ski-print ribs that alternate side and stagger up the slope, interlocking into a fish skeleton with a central spine.
        // One rib per step, and each rib fires one step sound -- a drawn line and an audible step are the same event.
        // Each rib is a grooved strip (bright rim, dark trough, bright rim) jittered per plant so it looks hand-pressed.
        // Ring buffer, world-anchored; draw order is global chronological across ribs and carve tracks (see SnowDecals).
        HERRINGBONE: {
          // Ring size and the spacing / angle of the climb pattern.
          MAX_RIBS: 400, // ribs kept up the slope (alternating L/R).
          // Sized with headroom because the pole-poke dimples share this same ring (~3 marks per climbed step: one rib + two pole pokes), so the visible fishbone trail stays long.
          // Vertex/index budget still has wide margin (see SnowDecals).
          STEP_DIST: 0.62, // metres up-slope between successive ribs (== rib rise, so they tile)
          SPLAY: 0.52, // radians the rib leans off the spine (large -> ribs lie across, fishbone-like)
          SPLAY_MIN: 0.15, // V angle on near-flat ground -- tracks almost parallel
          SPLAY_PITCH_REF: 0.38, // rad of climb pitch at which the V opens to full SPLAY

          // Snowplow chevrons.
          PLOW_STEP: 0.21, // metres between snowplow chevron pairs while the brake is held
          PLOW_MARK_GAIN: 1.35, // chevron marks toe in this many times harder than the skis measurably are.
          // Multiplier on the ski's own measured angle, for legibility only; 1.0 stamps the ski exactly.
          SPINE_GAP: 0.1, // half-gap of the tail off centre (the spine seam)

          // Rib geometry.
          LEN: 1.48, // rib length (m) -- ~STEP_DIST/cos(SPLAY) so consecutive same-side ribs meet
          W_OUT: 0.11, // half-width at the faded edge (alpha->0 here): the soft-feather extent
          W_IN: 0.025, // half-width of the solid core (alpha 1): the dark centre of the groove
          RAISE: 0.008, // lift above the snow to avoid z-fighting.
          // (Snow clearance ONLY -- who paints over whom is decided by the global chronological draw order in SnowDecals, never by out-raising.)

          // Per-stamp jitter, so the trail reads hand-pressed rather than stamped.
          ANGLE_JIT: 0.16, // +/- radians of random lean per rib (hand-pressed, not stamped)
          LEN_JIT: 0.22, // +/- fraction of length jitter per rib
          WIDTH_JIT: 0.55, // +/- fraction of edge-width jitter, independent per side (ragged edges)
          POS_JIT: 0.05, // +/- metres of random wobble in where the plant lands

          // Plant cadence and the lock that seats a grounded ski on its own rib.
          SCUFF_STEP: 0.11, // metres a grounded ski may slide through the world, while the gait IS idle, before it leaves a mark.
          RIB_STAMP_PHASE: 0.15, // gait phase at which the stance ski stamps its rib and the lock arms.
          // The floor is "the IK has settled the ski flat after touch-down"; lower it until the ski visibly skates on landing, then back off.
          PLANT_LOCK_GAIN: 0.5, // fraction of the measured ski-to-rib error folded into the correction per 60th of a second -- converted to the real dt at the call site, so the lock settles in the same wall-clock time at any refresh rate rather than the same number of frames.
          // The ski centre can only be measured after the leg solve, so this is a one-frame-lagged integral controller: any gain in (0,1) converges, 0.5 settles in ~3 frames without ringing.
          PLANT_LOCK_MAX: 0.3, // metres: clamp on the accumulated correction.
          // Anti-windup -- if the leg hits its reach clamp the error can't be nulled, and without this the integrator would run away and yank the boot the moment it came free.
          PLANT_LOCK_RELEASE: 0.09, // seconds: time constant the correction decays over once the foot lifts off.
          // Releasing instantly would snap the boot sideways entering the swing arc.

          LANDING_SKI_SPEED: 2, // m/s above which a touchdown prints parallel ski dashes rather than a splayed walk landing

          // Seating the drawn rib under the ski that pressed it.
          RIM_HEIGHT: 0.04, // geometric lift (m) of the feathered edges: the displaced-snow shoulder.
