      // ==========================================================
      // SEEDED RNG
      // ==========================================================
      class SeededRNG {
        constructor(seed) {
          this.seed = seed;
        }
        next() {
          this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff;
          return this.seed / 0x7fffffff;
        }
        range(min, max) {
          return min + this.next() * (max - min);
        }

        static _scratchVec = new THREE.Vector3();
        vec3Norm(target = SeededRNG._scratchVec) {
          const theta = this.next() * Math.PI * 2;
          const phi = Math.acos(2 * this.next() - 1);
          return target.set(
            Math.sin(phi) * Math.cos(theta),
            Math.sin(phi) * Math.sin(theta),
            Math.cos(phi),
          );
        }
      }

      // ==========================================================
      // SDF ROCK GENERATOR
      // ==========================================================
      function createRockSDF(seed) {
        const rng = new SeededRNG(seed);

        const numCuts = Math.floor(
          rng.range(CONFIG.MIN_NUM_CUTS, CONFIG.MAX_NUM_CUTS),
        );
        const cuts = [];
        for (let i = 0; i < numCuts; i++) {
          const dir = rng.vec3Norm();
          cuts.push({
            dx: dir.x,
            dy: dir.y,
            dz: dir.z,
            radius: rng.range(CONFIG.MIN_CUT_RADIUS, CONFIG.MAX_CUT_RADIUS),
            ratio: rng.range(CONFIG.MIN_CUT_RATIO, CONFIG.MAX_CUT_RATIO),
            k: rng.range(CONFIG.MIN_CUT_K, CONFIG.MAX_CUT_K),
          });
        }

        const scale = new THREE.Vector3(
          rng.range(CONFIG.MIN_SHAPE_SCALE_X, CONFIG.MAX_SHAPE_SCALE_X),
          rng.range(CONFIG.MIN_SHAPE_SCALE_Y, CONFIG.MAX_SHAPE_SCALE_Y),
          rng.range(CONFIG.MIN_SHAPE_SCALE_Z, CONFIG.MAX_SHAPE_SCALE_Z),
        );

        const sdf = (x, y, z) => {
          const px = x / scale.x;
          const py = y / scale.y;
          const pz = z / scale.z;

          let d = Math.sqrt(px * px + py * py + pz * pz) - 1.05;

          for (const c of cuts) {
            const spx = px + c.dx * c.radius;
            const spy = py + c.dy * c.radius;
            const spz = pz + c.dz * c.radius;

            const sd =
              Math.sqrt(spx * spx + spy * spy + spz * spz) - c.radius * c.ratio;

            const h = Math.max(0, Math.min(1, 0.5 + (0.5 * (-sd - d)) / c.k));

            d = d * (1 - h) + -sd * h + c.k * h * (1 - h);
          }

          // Clamp d to avoid tiny floating islands
          if (d > 0.3) d = 0.3;

          return d;
        };

        return { sdf, scale };
      }

        [0, 9, 1, -1],
        [0, 3, 8, -1],
        [-1],
      ];

      const VMAP = new Map();

      function marchingCubes(res, sdf, bounds) {
        const [x0, x1, y0, y1, z0, z1] = bounds;
        const dx = (x1 - x0) / (res - 1),
          dy = (y1 - y0) / (res - 1),
          dz = (z1 - z0) / (res - 1);
        const field = new Float32Array(res * res * res);
        for (let k = 0, idx = 0; k < res; k++)
          for (let j = 0; j < res; j++)
            for (let i = 0; i < res; i++, idx++)
              field[idx] = sdf(x0 + i * dx, y0 + j * dy, z0 + k * dz);

        let min = Infinity,
          max = -Infinity;
        for (let i = 0; i < field.length; i++) {
          const v = field[i];
          if (!Number.isFinite(v)) continue;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        //console.log("SDF range inside marchingCubes:", min, max);

        // Preallocate — avoids thousands of Array.push reallocations
        const MAX_VERTS = res * res * res * 5; // safe upper bound
        const positions = new Float32Array(MAX_VERTS * 3);
        const indices = new Uint32Array(MAX_VERTS * 3);
        let vertexCount = 0;
        let indexCount = 0;

        // CLEAR the map instead of creating a new one
        VMAP.clear();

        const getVert = (v) => {
          // 1. Quantize the position to an integer grid
          // We use a larger epsilon or direct bit-shifting to pack 3 values into 32 bits
          const ix = (v.x * 100) | 0;
          const iy = (v.y * 100) | 0;
          const iz = (v.z * 100) | 0;

          // 2. Bit-packing (10 bits per axis: supports -512 to 511 range)
          // This is way faster than string concatenation
          const key = ((ix + 512) << 20) | ((iy + 512) << 10) | (iz + 512);

          if (VMAP.has(key)) return VMAP.get(key);

          const idx = vertexCount;
          positions[vertexCount * 3 + 0] = v.x;
          positions[vertexCount * 3 + 1] = v.y;
          positions[vertexCount * 3 + 2] = v.z;
          vertexCount++;

          VMAP.set(key, idx);
          return idx;
        };

        const lerp = (out, p1, p2, v1, v2) => {
          const t = Math.abs(v1 - v2) < 1e-10 ? 0 : -v1 / (v2 - v1);
          out.set(
            p1.x + t * (p2.x - p1.x),
            p1.y + t * (p2.y - p1.y),
            p1.z + t * (p2.z - p1.z),
          );
        };

        // Move outside — create only once
        const corners = new Array(8);
        for (let i = 0; i < 8; i++) corners[i] = new THREE.Vector3();

        const verts = new Array(12);
        for (let i = 0; i < 12; i++) verts[i] = new THREE.Vector3();

        const vals = new Float32Array(8); // even better than Array

        let nonZeroCubes = 0;
        let anyEdges = 0;

        for (let k = 0; k < res - 1; k++) {
          for (let j = 0; j < res - 1; j++) {
            for (let i = 0; i < res - 1; i++) {
              const x = x0 + i * dx,
                y = y0 + j * dy,
                z = z0 + k * dz;
              corners[0].set(x, y, z);
              corners[1].set(x + dx, y, z);
              corners[2].set(x + dx, y + dy, z);
              corners[3].set(x, y + dy, z);
              corners[4].set(x, y, z + dz);
              corners[5].set(x + dx, y, z + dz);
              corners[6].set(x + dx, y + dy, z + dz);
              corners[7].set(x, y + dy, z + dz);

              const base = k * res * res + j * res + i;

              vals[0] = field[base]; // (0,0,0)
              vals[1] = field[base + 1]; // (1,0,0)
              vals[2] = field[base + 1 + res]; // (1,1,0)
              vals[3] = field[base + res]; // (0,1,0)

              vals[4] = field[base + res * res]; // (0,0,1)
              vals[5] = field[base + 1 + res * res]; // (1,0,1)
              vals[6] = field[base + 1 + res + res * res]; // (1,1,1)
              vals[7] = field[base + res + res * res]; // (0,1,1)

              let ci = 0;
              for (let n = 0; n < 8; n++) if (vals[n] < 0) ci |= 1 << n;

              if (ci !== 0 && ci !== 255) nonZeroCubes++;
              if (edgeTable[ci]) anyEdges++;

              const e = edgeTable[ci];

              if (!e) continue;
              if (e & 1)
                lerp(verts[0], corners[0], corners[1], vals[0], vals[1]);
              if (e & 2)
                lerp(verts[1], corners[1], corners[2], vals[1], vals[2]);
              if (e & 4)
                lerp(verts[2], corners[2], corners[3], vals[2], vals[3]);
              if (e & 8)
                lerp(verts[3], corners[3], corners[0], vals[3], vals[0]);
              if (e & 16)
                lerp(verts[4], corners[4], corners[5], vals[4], vals[5]);
              if (e & 32)
                lerp(verts[5], corners[5], corners[6], vals[5], vals[6]);
              if (e & 64)
                lerp(verts[6], corners[6], corners[7], vals[6], vals[7]);
              if (e & 128)
                lerp(verts[7], corners[7], corners[4], vals[7], vals[4]);
              if (e & 256)
                lerp(verts[8], corners[0], corners[4], vals[0], vals[4]);
              if (e & 512)
                lerp(verts[9], corners[1], corners[5], vals[1], vals[5]);
              if (e & 1024)
                lerp(verts[10], corners[2], corners[6], vals[2], vals[6]);
              if (e & 2048)
                lerp(verts[11], corners[3], corners[7], vals[3], vals[7]);

              const tri = triTable[ci];
              for (let t = 0; tri[t] !== -1; t += 3) {
                const a = verts[tri[t]],
                  b = verts[tri[t + 1]],
                  c = verts[tri[t + 2]];

                if (!a || !b || !c) continue;

                const ia = getVert(a);
                const ib = getVert(b);
                const ic = getVert(c);

                if (ia !== ib && ib !== ic && ic !== ia) {
                  // Typed array → manual index assignment (no .push)
                  indices[indexCount++] = ia;
                  indices[indexCount++] = ic;
                  indices[indexCount++] = ib;
                }
              }
            }
          }
        }

        /*console.log(
                "MC stats: nonZeroCubes =",
                nonZeroCubes,
                "anyEdges =",
                anyEdges,
              );*/

        const geom = new THREE.BufferGeometry();
        geom.setAttribute(
          "position",
          new THREE.Float32BufferAttribute(
            positions.subarray(0, vertexCount * 3),
            3,
          ),
        );
        geom.setIndex(
          new THREE.Uint32BufferAttribute(indices.subarray(0, indexCount), 1),
        );
        if (res > CONFIG.LOD_SPHERE0_RESOLUTION) {
          geom.computeVertexNormals();
        }
        return geom;
      }

      function createBoxImpostor(radii) {
        const r = radii.avgRadius;
        const sq = radii.squashRatio;
        return new THREE.BoxGeometry(r * 1.2, r * sq * 1.2, r * 1.2);
      }
      function createSphereImpostor0(radii) {
        const geom = new THREE.IcosahedronGeometry(1, 0);
        const r = radii.avgRadius;
        const sq = radii.squashRatio;
        geom.scale(r * 1.2, r * sq * 1.2, r * 1.2);
        return geom;
      }

      function createSphereImpostor1(radii) {
        const geom = new THREE.IcosahedronGeometry(1, 1);
        const r = radii.avgRadius;
        const sq = radii.squashRatio;
        geom.scale(r * 0.9, r * sq * 0.9, r * 0.9);
        return geom;
      }

      // ==========================================================
      // GENERATE LOD GEOMETRIES
      // ==========================================================
      console.time("Generate rock LODs");
      const rockLODs = [];
      const rockBoundingRadii = [];

      for (let s = 0; s < CONFIG.NUM_ROCK_SHAPES; s++) {
        const { sdf, scale } = createRockSDF(s * 7919 + 1337);

        // ---------------------------------------------------------
        // FIRST: generate highest‑res marching cubes to get radius
        // ---------------------------------------------------------
        const highestRes = CONFIG.LOD_RESOLUTIONS[0]; // FIRST element is highest resolution

        const bounds = [-1.5, 1.5, -1.5, 1.5, -1.5, 1.5];

        const highGeom = marchingCubes(highestRes, sdf, bounds);

        /*console.log(
                "verts:",
                highGeom.attributes.position.count,
                "tris:",
                highGeom.index.count,
              );*/

        // Calculate AVERAGE radius from vertices (not bounding sphere max)
        const pos = highGeom.attributes.position.array;
        const vertCount = pos.length / 3;

        // First find centroid
        let cx = 0,
          cy = 0,
          cz = 0;
        for (let v = 0; v < vertCount; v++) {
          cx += pos[v * 3];
          cy += pos[v * 3 + 1];
          cz += pos[v * 3 + 2];
        }
        cx /= vertCount;
        cy /= vertCount;
        cz /= vertCount;

        // Calculate average distance from centroid AND track min/max per axis
        let totalDist = 0;
        let minY = Infinity,
          maxY = -Infinity;
        for (let v = 0; v < vertCount; v++) {
          const dx = pos[v * 3] - cx;
          const dy = pos[v * 3 + 1] - cy;
          const dz = pos[v * 3 + 2] - cz;
          totalDist += Math.sqrt(dx * dx + dy * dy + dz * dz);
          minY = Math.min(minY, pos[v * 3 + 1]);
          maxY = Math.max(maxY, pos[v * 3 + 1]);
        }

        const avgRadius = totalDist / vertCount;
        const heightExtent = (maxY - minY) / 2;
        const squashRatio = heightExtent / avgRadius; // How flat is the rock?

        rockBoundingRadii[s] = {
          avgRadius,
          squashRatio,
          bottomY: minY, // <-- store bottom of rock geometry
          height: maxY - minY, // total vertical extent
        };

        /*console.log(
                "Rock",
                s,
                "avgRadius =",
                avgRadius.toFixed(3),
                "squash =",
                squashRatio.toFixed(3),
              );*/

        // ---------------------------------------------------------
        // NOW generate all LODs (using impostors when needed)
        // ---------------------------------------------------------
        rockLODs.push(
          CONFIG.LOD_RESOLUTIONS.map((res, i) => {
            // 1) BOX impostor
            if (res <= CONFIG.LOD_BOX_RESOLUTION) {
              return createBoxImpostor(rockBoundingRadii[s]);
            }

            // 2) Icosahedron detail 0
            if (res <= CONFIG.LOD_SPHERE0_RESOLUTION) {
              return createSphereImpostor0(rockBoundingRadii[s]);
            }

            // 3) Icosahedron detail 1
            if (res <= CONFIG.LOD_SPHERE1_RESOLUTION) {
              return createSphereImpostor1(rockBoundingRadii[s]);
            }

            // Otherwise → marching cubes
            return marchingCubes(res, sdf, [-1.5, 1.5, -1.5, 1.5, -1.5, 1.5]);
          }),
        );
      }

      console.timeEnd("Generate rock LODs");

      // ==========================================================
      // FLAT FLOAT32ARRAY INSTANCE DATA
      // 13 floats per instance:
      //   0: x, 1: z, 2: scale, 3: rotY, 4: rotX, 5: rotZ,
      //   6: shape, 7: colorType, 8: seed,
      //   9: wetness, 10: roughness, 11: colorTingeR, 12: squash
      // ==========================================================
      console.time("Generate instance data");
      const FLOATS_PER_INSTANCE = 13;
      const instanceData = new Float32Array(
        CONFIG.INSTANCE_COUNT * FLOATS_PER_INSTANCE,
      );
      const rng = new SeededRNG(42);

      const sideCount = Math.floor(Math.sqrt(CONFIG.INSTANCE_COUNT));
      const cellSize = (CONFIG.TERRAIN_RADIUS * 2) / sideCount;

      for (let i = 0; i < CONFIG.INSTANCE_COUNT; i++) {
        const idx = i * FLOATS_PER_INSTANCE;

        const gx = i % sideCount;
        const gz = Math.floor(i / sideCount);

        const x =
          -CONFIG.TERRAIN_RADIUS + gx * cellSize + rng.range(0, cellSize);
        const z =
          -CONFIG.TERRAIN_RADIUS + gz * cellSize + rng.range(0, cellSize);

        instanceData[idx + 0] = x;
        instanceData[idx + 1] = z;

        const t = rng.next();
        const biased = t * t * t;
        const baseScale =
          CONFIG.MIN_SCALE + biased * (CONFIG.MAX_SCALE - CONFIG.MIN_SCALE);

        const micro = rng.next();
        const microMul = 0.92 + micro * 0.16; // → 0.92 – 1.08 range

        instanceData[idx + 2] = baseScale * microMul;

        // Full 3-axis rotation
        instanceData[idx + 3] = rng.next() * Math.PI * 2; // rotY
        instanceData[idx + 4] = (rng.next() - 0.5) * 0.5; // rotX
        instanceData[idx + 5] = (rng.next() - 0.5) * 0.5; // rotZ

        instanceData[idx + 6] = Math.floor(rng.next() * CONFIG.NUM_ROCK_SHAPES);
        instanceData[idx + 7] = Math.floor(rng.next() * 7);
        instanceData[idx + 8] = rng.next() * 1000;

        instanceData[idx + 9] = rng.range(
          CONFIG.MIN_WETNESS,
          CONFIG.MAX_WETNESS,
        );
        instanceData[idx + 10] = rng.range(
          CONFIG.MIN_ROUGHNESS,
          CONFIG.MAX_ROUGHNESS,
        );
        instanceData[idx + 11] = rng.range(
          CONFIG.MIN_COLOR_TINGE,
          CONFIG.MAX_COLOR_TINGE,
        );
        instanceData[idx + 12] = rng.range(
          CONFIG.MIN_SQUASH,
          CONFIG.MAX_SQUASH,
        );
      }
      console.timeEnd("Generate instance data");

      // ==========================================================
      // PRE-COMPUTE ALL MATRICES AT STARTUP (Static Buffers)
      // ==========================================================
      console.time("Pre-compute matrices");
      const allMatrices = new Float32Array(CONFIG.INSTANCE_COUNT * 16);
      const tempObj = new THREE.Object3D();

      for (let i = 0; i < CONFIG.INSTANCE_COUNT; i++) {
        const idx = i * FLOATS_PER_INSTANCE;
        const scale = instanceData[idx + 2];
        const squash = instanceData[idx + 12];
        const shape = instanceData[idx + 6];
        const rockInfo = rockBoundingRadii[shape];

        const bottomY = rockInfo.bottomY;
        const height = rockInfo.height;

        // Apply rotation first
        tempObj.rotation.set(
          instanceData[idx + 4], // rotX
          instanceData[idx + 3], // rotY
          instanceData[idx + 5], // rotZ
        );

        // Apply scale
        tempObj.scale.set(scale, scale * squash, scale);

        // Compute bottom offset after rotation
        // For most rocks, approximation: just use height * scale * squash
        let yOffset =
          -bottomY * scale * squash -
          height * scale * squash * CONFIG.GROUND_SINKING;

        // Set position
        tempObj.position.set(
          instanceData[idx + 0], // x
          yOffset, // y
          instanceData[idx + 1], // z
        );

        tempObj.updateMatrix();
        tempObj.matrix.toArray(allMatrices, i * 16);
      }
      console.timeEnd("Pre-compute matrices");

      // ==========================================================
      // LOD MANAGER with Static Matrix Lookups
      // ==========================================================
      class LODInstanceManager {
        constructor() {
          this.meshes = [];
          this.maxPerMesh = CONFIG.INSTANCE_COUNT;
          this.lodCounts = CONFIG.LOD_RESOLUTIONS.map(() => 0);
          this.totalVisible = 0;
          this.culledCount = 0;
          this.camForward = new THREE.Vector3();
          this.toObj = new THREE.Vector3();
          this.lodDistSq = CONFIG.LOD_DISTANCES.map((d) => d * d);
          this.tempCenter = new THREE.Vector3();
          this.tempSphere = new THREE.Sphere(this.tempCenter, 0); // reuse

          // Target: full visibility refresh every so many milliseconds
          const TARGET_CYCLE_TIME_MS = 70;

          this.currentIndex = 0;
          // Full scan every frame — 100K iterations costs ~0.16ms which is negligible.
          // Time-slicing (commented below) saves CPU but causes pop-in during fast rotation
          // because rocks lag behind the frustum by several frames.
          this.batchSize = CONFIG.INSTANCE_COUNT;
          /*this.batchSize = Math.ceil(
            CONFIG.INSTANCE_COUNT / (TARGET_CYCLE_TIME_MS / (1000 / 60)),
          ); // ≈ 23,810 rocks per frame at 60fps, full cycle in ~4 frames */

          // Persistent counters that only reset when a full cycle completes
          this.workingCounts = new Uint32Array(
            CONFIG.NUM_ROCK_SHAPES * CONFIG.LOD_RESOLUTIONS.length,
          );

          this.workingHash = new Int32Array(
            CONFIG.NUM_ROCK_SHAPES * CONFIG.LOD_RESOLUTIONS.length,
          ); // rolling hash of rock indices per bucket this cycle
          this.lastHash = new Int32Array(
            CONFIG.NUM_ROCK_SHAPES * CONFIG.LOD_RESOLUTIONS.length,
          ); // hash from previous cycle for comparison

          this.init();
        }

        init() {
          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff, // base color, multiplied by per-instance color
            roughness: 1.0, // will be adjusted per-instance in shader
            metalness: 0.0, // rocks are non-metallic
            flatShading: false,
            side: THREE.FrontSide,
            fog: false, // no fog
          });

          material.onBeforeCompile = (shader) => {
            // --- Per-instance uniforms ---
            shader.uniforms.seed = { value: 0.0 };
            shader.uniforms.colorTinge = { value: 0.0 };
            shader.uniforms.variation = {
              value: new THREE.Vector3(0.0, 0.0, 0.0),
            };

            // --- Use sun direction & color ---
            shader.uniforms.lightDir = {
              value: sun.position.clone().normalize(),
            };
            shader.uniforms.lightColor = {
              value: sun.color.clone().multiplyScalar(sun.intensity),
            };

            // --- Vertex shader: inject attributes & varyings ---
            shader.vertexShader =
              `
          attribute float seed;
          attribute float colorType;
          attribute vec4 variation;

          varying vec3 vWorldPos;
          varying vec3 vViewDir;

          varying float vSeed;
          varying float vColorType;
          varying vec3 vVariation;      // x: wetness, y: roughness, z: tinge

          varying vec3 vNormalComp;

          varying float vViewZ;
        ` + shader.vertexShader;

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `
       #include <begin_vertex>
            vec4 worldPos = modelMatrix * instanceMatrix * vec4(transformed, 1.0);
            vWorldPos = worldPos.xyz;

            vec4 viewPos = viewMatrix * worldPos;
            vViewZ = -viewPos.z;

            mat3 nMat = mat3(modelMatrix) * mat3(instanceMatrix);
            vNormalComp = normalize(nMat * normal);
            vViewDir = normalize(cameraPosition - worldPos.xyz);

            vSeed = seed;
            vColorType = colorType;
            vVariation = variation.xyz;
          `,
            );

            // --- Fragment shader: inject varyings & helper functions ---
            shader.fragmentShader =
              `            
            varying float vSeed;
            varying float vColorType;
            varying vec3 vVariation;            

            varying vec3 vWorldPos;
            varying vec3 vViewDir;

            varying vec3 vNormalComp;

            varying float vViewZ;

            uniform vec3 lightDir;
            uniform vec3 lightColor;

            float hash(float n) { return fract(sin(n) * 43758.5453); }

            float noise(vec3 x) {
              vec3 p = floor(x);
              vec3 f = fract(x);
              f = f * f * (3.0 - 2.0 * f);
              float n = p.x + p.y * 57.0 + 113.0 * p.z;
              return mix(mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                             mix(hash(n + 57.0), hash(n + 58.0), f.x), f.y),
                         mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                             mix(hash(n + 170.0), hash(n + 171.0), f.x), f.y), f.z);
            }

            float fbm(vec3 p) {
              float f = 0.0;
              f += 0.500 * noise(p); p *= 2.02;
              f += 0.250 * noise(p); p *= 2.03;
              f += 0.125 * noise(p);
              return f;
            }

            vec3 perturbNormal(vec3 n, vec3 p, float scale, float strength) {
              float eps = 0.05;
              float n0 = fbm(p * scale);
              float nX = fbm((p + vec3(eps, 0.0, 0.0)) * scale);
              float nY = fbm((p + vec3(0.0, eps, 0.0)) * scale);
              float nZ = fbm((p + vec3(0.0, 0.0, eps)) * scale);
              vec3 grad = vec3(nX - n0, nY - n0, nZ - n0) / eps;
              return normalize(n - grad * strength);
            }

            // Color palette generator
            vec3 getRockColor(float t, float seed, float tinge) {
                float i = floor(t+0.5);
                vec3 base;
                if(i < 0.5) base = vec3(0.12,0.11,0.10);
                else if(i < 1.5) base = vec3(0.50,0.42,0.32);
                else if(i < 2.5) base = vec3(0.42,0.41,0.43);
                else if(i < 3.5) base = vec3(0.20,0.17,0.14);
                else if(i < 4.5) base = vec3(0.08,0.08,0.09);
                else if(i < 5.5) base = vec3(0.65,0.62,0.55);
                else base = vec3(0.38,0.36,0.33);

                float variation = hash(seed*0.1)*0.15 - 0.075;
                base *= (1.0 + variation);

                base.r += tinge;
                base.g += tinge*0.5;
                base.b -= tinge*0.3;

                return clamp(base,0.0,1.0);
            }

          ` + shader.fragmentShader;

            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <dithering_fragment>",
              `
        #include <dithering_fragment>

        if (vWorldPos.y < ${CONFIG.WORLD_BOTTOM.toFixed(1)}) discard;

        float wetness = vVariation.x;
        float roughness = vVariation.y;
        float colorTinge = vVariation.z;

        vec3 N;
        vec3 finalColor;
        float detail = 0.5; // Default neutral detail for distant rocks
        float nVal = 0.5;

        float detailThreshold = ${(CONFIG.LOD_DISTANCES[2] * 0.75).toFixed(1)}; // faraway LODs get flat normals and a simple color mix with zero noise calls

        if (vViewZ < detailThreshold) {
              // 1. Detailed Noise
              nVal = fbm(vWorldPos * 0.4 + vSeed);
              detail = fbm(vWorldPos * 2.5 + vSeed);

              // 2. Perturb Normal
              N = perturbNormal(normalize(vNormalComp), vWorldPos, 2.5, 0.4 * (1.0 - wetness));

              // 3. COLOR MIXING
              vec3 instanceColor = getRockColor(vColorType, vSeed, colorTinge);
              vec3 sandColor = mix(instanceColor, vec3(0.6, 0.55, 0.5), 0.5);

              float upDot = dot(N, vec3(0.0, 1.0, 0.0));
              // The mixFactor average is roughly 0.5-0.6 depending on noise distribution
              float mixFactor = smoothstep(0.2, 0.8, nVal + detail * 0.5 + upDot * 0.2);
              finalColor = mix(instanceColor, sandColor, mixFactor * 0.5);
          } else {
              // OPTIMIZED PATH
              N = normalize(vNormalComp);
              vec3 instanceColor = getRockColor(vColorType, vSeed, colorTinge);

              // COMPENSATE FOR BRIGHTNESS:
              // We simulate the average "sand" contribution from the detailed path.
              // The detailed path mixes in 50% sandColor at a variable mixFactor.
              // Applying a 0.25 (25%) mix of sandColor here matches the median brightness.
              vec3 sandColor = mix(instanceColor, vec3(0.6, 0.55, 0.5), 0.5);
              finalColor = mix(instanceColor, sandColor, 0.25);
          }

          finalColor *= mix(1.0, 0.5, wetness);

          // 4. Lighting
          vec3 L = normalize(lightDir);
          vec3 V = vViewDir;
          vec3 H = normalize(L + V);

          float NdotL = max(dot(N, L), 0.0);
          float NdotH = max(dot(N, H), 0.0);

          vec3 lit = finalColor * (vec3(0.35) + lightColor * NdotL * 0.7);

          // Wet Specular
          float specPower = mix(10.0, 100.0, wetness * (2.0 - roughness));
          float specStrength = mix(0.05, 1.0, wetness);

          // Smooth transition for the mask
          // We assume an average mask of 0.8 for distant rocks to avoid the "darkening" pop
          float specMask = (vViewZ < detailThreshold) ? smoothstep(0.4, 0.6, detail) : 0.8;

          float spec = pow(NdotH, specPower) * specStrength * specMask;
          lit += lightColor * spec;

          // Fresnel (Small compensation for distant path)
          if (vViewZ < detailThreshold) {
              float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);
              lit += lightColor * fresnel * 0.3 * wetness;
          } else {
              // Add a tiny constant "rim" boost to distant wet rocks to match close-up Fresnel feel
              lit += lightColor * 0.05 * wetness;
          }

          gl_FragColor.rgb = lit;
          gl_FragColor.rgb = pow(gl_FragColor.rgb, vec3(1.1));
          `,
            );
          };

          // One mesh per LOD (4 draw calls total for rocks)
          this.meshes = [];

          for (let s = 0; s < CONFIG.NUM_ROCK_SHAPES; s++) {
            for (let l = 0; l < CONFIG.LOD_RESOLUTIONS.length; l++) {
              const geom = rockLODs[s][l].clone();

              // same attribute setup as before
              const seeds = new Float32Array(this.maxPerMesh);
              const colorTypes = new Float32Array(this.maxPerMesh);
              const variations = new Float32Array(this.maxPerMesh * 4);

              geom.setAttribute(
                "seed",
                new THREE.InstancedBufferAttribute(seeds, 1),
              );
              geom.setAttribute(
                "colorType",
                new THREE.InstancedBufferAttribute(colorTypes, 1),
              );
              geom.setAttribute(
                "variation",
                new THREE.InstancedBufferAttribute(variations, 4),
              );

              const mesh = new THREE.InstancedMesh(
                geom,
                material,
                this.maxPerMesh,
              );
              mesh.count = 0;
              mesh.frustumCulled = false;
              mesh.castShadow = l <= 1; // LOD 0, 1
              mesh.receiveShadow = l <= 1; // LOD 0, 1

              scene.add(mesh);
              this.meshes.push(mesh); // flat: 0 = shape0-lod0, 1 = shape0-lod1, ..., 31 = shape7-lod3
            }
          }

          // One-time setup: give each mesh a place to remember its last visible count
          for (const mesh of this.meshes) {
            mesh.count = 0; // already doing this probably
            mesh._lastVisibleCount = 0; // previous cycle's count, used to detect changes
          }
        }

        update(camera) {
          const camX = camera.position.x;
          const camZ = camera.position.z;
          const numLods = CONFIG.LOD_RESOLUTIONS.length;
          const maxDistSq = CONFIG.VIEW_DISTANCE * CONFIG.VIEW_DISTANCE;

          // 1. Setup Frustum once per frame
          projScreenMatrix.multiplyMatrices(
            camera.projectionMatrix,
            camera.matrixWorldInverse,
          );
          frustum.setFromProjectionMatrix(projScreenMatrix);
          camera.getWorldDirection(this.camForward);

          // 2. Start of Cycle: Reset working counts
          if (this.currentIndex === 0) {
            this.workingCounts.fill(0);
            this.workingCulled = 0; // Temporary counter for culled rocks
            this.workingHash.fill(0);
          }

          // 3. Batch Processing (Time-Slicing)
          const end = Math.min(
            this.currentIndex + this.batchSize,
            CONFIG.INSTANCE_COUNT,
          );

          for (let i = this.currentIndex; i < end; i++) {
            const idx = i * FLOATS_PER_INSTANCE;
            const x = instanceData[idx + 0];
            const z = instanceData[idx + 1];
            const scale = instanceData[idx + 2];

            const dx = x - camX;
            const dz = z - camZ;
            const distSq = dx * dx + dz * dz;

            // 1. View Distance Cull (this is the fastest)
            if (distSq > maxDistSq) continue;

            if (CONFIG.FRUSTUM_CULLING) {
              // Always apply frustum culling (hard-coded on)
              this.tempSphere.center.x = x;
              this.tempSphere.center.y = scale * 0.4; // y = scale*0.4 is a rough center estimate
              this.tempSphere.center.z = z;
              this.tempSphere.radius = scale * 1.7; // ← increased a bit for safety (adjust 1.6–2.0 if needed)

              if (!frustum.intersectsSphere(this.tempSphere)) {
                this.workingCulled++;
                continue;
              }
            }

            // If it survives, it gets rendered

            // D. LOD Selection
            let lod = numLods - 1;
            for (let ll = 0; ll < numLods - 1; ll++) {
              if (distSq < this.lodDistSq[ll + 1]) {
                lod = ll;
                break;
              }
            }

            // read the shape index that was precomputed for this rock
            const shape = Math.floor(instanceData[idx + 6]); // 0 .. NUM_ROCK_SHAPES-1

            // flat bucket = shape × numLods + lod
            const bucket = shape * numLods + lod;

            const matrixIdx = i * 16;

            // then use bucket everywhere instead of lod
            const j = this.workingCounts[bucket];
            if (j < this.maxPerMesh) {
              const mesh = this.meshes[bucket];

              mesh.instanceMatrix.array.set(
                allMatrices.subarray(matrixIdx, matrixIdx + 16),
                j * 16,
              );

              mesh.geometry.attributes.seed.array[j] = instanceData[idx + 8];
              mesh.geometry.attributes.colorType.array[j] =
                instanceData[idx + 7];

              const vIdx = j * 4;
              const varArr = mesh.geometry.attributes.variation.array;
              varArr[vIdx + 0] = instanceData[idx + 9];
              varArr[vIdx + 1] = instanceData[idx + 10];
              varArr[vIdx + 2] = instanceData[idx + 11];
              varArr[vIdx + 3] = 0;

              this.workingCounts[bucket]++;
              this.workingHash[bucket] =
                (this.workingHash[bucket] * 31 + i) | 0;
            }
          }

          this.currentIndex = end;

          // 4. End of Cycle: Swap Buffers to GPU and Update UI
          if (this.currentIndex >= CONFIG.INSTANCE_COUNT) {
            this.totalVisible = 0;
            this.culledCount = this.workingCulled;

            const numLods = CONFIG.LOD_RESOLUTIONS.length;

            // Reset per-LOD counts
            this.lodCounts.fill(0);

            for (let bucket = 0; bucket < this.meshes.length; bucket++) {
              const mesh = this.meshes[bucket];
              const count = this.workingCounts[bucket];

              // Remember the PREVIOUS visible count before overwriting
              const prevCount = mesh._lastVisibleCount;

              // Now safe to update the actual mesh.count
              mesh.count = count;

              mesh._lastVisibleCount = count; // remember for next frame

              const lod = bucket % numLods;
              this.lodCounts[lod] += count;
              this.totalVisible += count;

              // Upload to GPU only when bucket contents changed (count or which rocks).
              // Uses partial buffer upload (addUpdateRange) so only the visible
              // slice gets sent — not the full 100K-capacity array.
              if (
                count !== mesh._lastVisibleCount ||
                this.workingHash[bucket] !== this.lastHash[bucket]
              ) {
                mesh.instanceMatrix.clearUpdateRanges();
                mesh.instanceMatrix.addUpdateRange(0, count * 16);
                mesh.instanceMatrix.needsUpdate = true;

                const seedAttr = mesh.geometry.attributes.seed;
                seedAttr.clearUpdateRanges();
                seedAttr.addUpdateRange(0, count);
                seedAttr.needsUpdate = true;

                const ctAttr = mesh.geometry.attributes.colorType;
                ctAttr.clearUpdateRanges();
                ctAttr.addUpdateRange(0, count);
                ctAttr.needsUpdate = true;

                const varAttr = mesh.geometry.attributes.variation;
                varAttr.clearUpdateRanges();
                varAttr.addUpdateRange(0, count * 4);
                varAttr.needsUpdate = true;

                mesh._lastVisibleCount = count;
                this.lastHash[bucket] = this.workingHash[bucket];
              }
            }

            if (typeof updateGUI === "function") updateGUI();
            this.currentIndex = 0;

            // Force shadow map to update once after first population
            if (!this._shadowsInitialized) {
              renderer.shadowMap.needsUpdate = true;
              this._shadowsInitialized = true;
            }
          }
        }
      }

      const lodManager = new LODInstanceManager();

      // ==========================================================
      // RENDER LOOP
      // ==========================================================
      let lastLODUpdate = 0;

      const shadowSnap = 4; // world units — larger = fewer updates, more stable

      function animate(time) {
        requestAnimationFrame(animate);
        camera.updateMatrixWorld(); // ensure frustum uses this frame's camera, not last frame's
        lodManager.update(camera);

        // Snap shadow camera to camera position (quantized to reduce shadow map updates)
        const snapX = Math.round(camera.position.x / shadowSnap) * shadowSnap;
        const snapZ = Math.round(camera.position.z / shadowSnap) * shadowSnap;

        if (
          snapX !== sun.target.position.x ||
          snapZ !== sun.target.position.z
        ) {
          sun.target.position.set(snapX, 0, snapZ);
          sun.position.set(snapX + 50, 80, snapZ + 50);
          sun.target.updateMatrixWorld();
          renderer.shadowMap.needsUpdate = true;
        }

        renderer.render(scene, camera);
        updateStatsCustom(time);
        stats.update();
      }

      animate(0);

      // ==========================================================
      // RESIZE
      // ==========================================================
      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });
      
      ['touchstart', 'touchend'].forEach(ev => renderer.domElement.addEventListener(ev, e => e.preventDefault(), { passive: false })); // kill iOS double-tap zoom on canvas

      updateGUI();
    </script>
  </body>
</html>
