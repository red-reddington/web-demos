          this.eye(
            new THREE.SphereGeometry(0.07, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.28 * this.headSize, 0.14 * this.headSize, -0.32 * this.headSize],
            [0, 0, 0],
            [1, 1, 0.72],
          );

          this.rabbitEar(1);
          this.rabbitEar(-1);

          const rearUpper = 0.4 * this.hindLeg,
            rearLower = 0.38 * this.hindLeg;
          for (const [x, z, phase] of [
            [-0.51 * this.L, 0.32 * this.W, 0],
            [-0.51 * this.L, -0.32 * this.W, Math.PI],
          ])
            this.leg({
              x,
              z,
              upper: rearUpper,
              lower: rearLower,
              upperRadius: 0.15,
              lowerRadius: 0.12,
              upperMat: this.fur,
              lowerMat: this.fur,
              hoofMat: this.furLight,
              hoofSize: 0.15,
              foot: "rabbit",
              footSize: 1.0,
              phase,
              // The hop drives this ankle, not the walk cycle: -(0.5*0.35 + 0.95*0.22) * tuck, tuck to 1.
              ankleMax: 0.384,
            });
          const frontUpper = 0.22 * this.frontLeg,
            frontLower = 0.26 * this.frontLeg;
          for (const [x, z, phase] of [
            [0.38 * this.L, 0.32 * this.W, Math.PI],
            [0.38 * this.L, -0.32 * this.W, 0],
          ])
            this.leg({
              x,
              z,
              upper: frontUpper,
              lower: frontLower,
              upperRadius: 0.075,
              lowerRadius: 0.06,
              upperMat: this.fur,
              lowerMat: this.fur,
              hoofMat: this.furLight,
              hoofSize: 0.11,
              phase,
              // Front ankle in the hop: -knee * 0.38, knee to 0.42 * 0.8 at full tuck.
              ankleMax: 0.128,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.96 * this.L, 1.12 * this.H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          this.part(
            new THREE.IcosahedronGeometry(0.25 * this.tailSize, 1),
            this.furLight,
            this.tailRoot,
          );
        }
        rabbitEar(side) {
          const ear = new THREE.Group();
          ear.position.set(-0.2, 0.67 * this.earLength, side * 0.27);
          ear.rotation.z = 0.48;
          this.headRoot.add(ear);
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.fur,
            ear,
            [0, 0, 0],
            [0, 0, 0],
            [0.22, 0.76 * this.earLength, 0.13],
          );
          this.overlay(
            new THREE.IcosahedronGeometry(1, 1),
            this.earInner,
            ear,
            [0.035, 0.02, side * (0.082 + CONFIG.surface.earOverlay)],
            [0, 0, 0],
            [0.12, 0.55, 0.038],
          );
          this.ears.push({ group: ear, side, baseZ: ear.rotation.z });
        }
        updateRabbitHop(t, dt) {
          const dx = this.group.position.x - this.lastPosition.x;
          const dz = this.group.position.z - this.lastPosition.z;
          const actualSpeed =
            Math.sqrt(dx * dx + dz * dz) / Math.max(dt, 0.0001);
          this.lastPosition.copy(this.group.position);
          // Same reasoning as updateMotion: relative to the rabbit's own speed, with hysteresis, so a shove that can't actually move it doesn't start the hop cycle.
          const norm = actualSpeed / Math.max(this.speed, 0.001);
          const moving = norm > (this.moving ? 0.07 : 0.14);
          this.moving = moving;

          const breath = Math.sin(
            t * CONFIG.animation.breathSpeed + this.breathPhase,
          );
          if (this.bodyRoot) {
            this.bodyRoot.scale.x = 1 - breath * this.breathAmount * 0.2;
            this.bodyRoot.scale.y = 1 + breath * this.breathAmount;
            this.bodyRoot.scale.z = 1 - breath * this.breathAmount * 0.12;
          }

          if (!moving) {
            // Same rates as Animal.updateMotion's rest; each factor computed once rather than once per axis per leg.
            // Settled, none of this runs (see restSettled).
            if (!restSettled(this, false)) {
              const kB = Math.exp(-10 * dt),
                kP = Math.exp(-7 * dt),
                kL = Math.exp(-8 * dt);
              this._baseY *= kB;
              const br = this.bodyRoot;
              if (br)
                br.rotation.set(
                  br.rotation.x * kP,
                  br.rotation.y,
                  br.rotation.z * kP,
                );
              if (this.headRoot) this.headRoot.rotation.x *= kP;
              const legs = this.legs;
              for (let li = 0; li < legs.length; li++) {
                const leg = legs[li];
                leg.hip.rotation.z *= kL;
                leg.knee.rotation.z *= kL;
                leg.ankle.rotation.z *= kL;
              }
            }
            this.group.position.y = this._baseY + this.jumpY;
            this.airborne = false;
            this._wasAirborne = false;
            this._locoGain = 1;
            return;
          }

          // absolute gait factor: 1 at a walk, ~sprint when sprinting.
          // Not a speed ratio: that sits at ~1 always and ignores sprint.
          const scale = this.group.scale.x;
          this._avgSpeed += (actualSpeed - this._avgSpeed) * approach(4, dt);
          const g = THREE.MathUtils.clamp(
            this._avgSpeed / Math.max(this.speed, 0.001),
            0,
            this.sprint * 1.15,
          );
          const hopFrequency =
            CONFIG.animation.rabbitHop.frequency *
            (0.82 + 0.2 * Math.min(g, 2));
          this.hopTime += dt * hopFrequency * Math.PI * 2;
          const cycle = (this.hopTime / (Math.PI * 2)) % 1;

          const height =
            (CONFIG.animation.rabbitHop.height +
              CONFIG.animation.rabbitHop.speedHeight * g) *
            (scale / 0.58);
          const A = 0.55; // airborne fraction of the cycle
          const arc = this._hopArc(cycle, height, A);
          this._baseY = arc.y;
          this.group.position.y = arc.y + this.jumpY;
          this._locoGain = this._hopLunge(cycle, A);

          const pose = Math.min(g, 1.2);
          const tuck = arc.airT;

          // Pitch follows the actual vertical velocity, so it is smooth and the head is driven from the same value on the same frame, which is what stops the neckline lagging the body.
          const bodyPitch = -arc.vN * CONFIG.animation.rabbitHop.pitch * pose;
          // One set() per node: see Animal.updateMotion.
          const br = this.bodyRoot;
          if (br)
            br.rotation.set(
              bodyPitch,
              br.rotation.y,
              Math.sin(this.hopTime * 2 + this.phase) * 0.018 * pose,
            );
          const hr = this.headRoot;
          if (hr)
            hr.rotation.set(
              -bodyPitch * 0.55, // counter-rotate, in sync
              Math.sin(t * 1.5 + this.phase) * 0.035,
              hr.rotation.z,
            );

          const rearL = this.legs[0],
            rearR = this.legs[1],
            frontL = this.legs[2],
            frontR = this.legs[3];
          // Fold-only: legs tuck UP with airborne-ness and sit at rest (feet on the ground) otherwise.
          // Nothing straightens below the rest pose, so a foot can never be driven under the ground plane on the launch push.
          for (const leg of [rearL, rearR]) {
            leg.hip.rotation.z = tuck * 0.5;
            leg.knee.rotation.z = tuck * 0.95;
            leg.ankle.rotation.z =
              -leg.hip.rotation.z * 0.35 - leg.knee.rotation.z * 0.22;
          }
          // The front pair folds the other way, like every other quadruped's carpus.
          const ftuck = CONFIG.animation.rabbitHop.frontTuck;
          for (const leg of [frontL, frontR]) {
            leg.hip.rotation.z = tuck * ftuck * 0.5;
            leg.knee.rotation.z = -tuck * ftuck * 0.8;
            leg.ankle.rotation.z = -leg.knee.rotation.z * 0.38;
          }

          const nowAir = cycle < A;
          if (this._wasAirborne && !nowAir && this.jumpY <= 0 && SOUND) {
            for (let i = 0; i < 2; i++) {
              const leg = this.legs[i],
                lx = leg.hip.position.x,
                lz = leg.hip.position.z;
              const a = this.group.rotation.y,
                cs = Math.cos(a),
                sn = Math.sin(a),
                sc = this.group.scale.x;
              SOUND.step(
                this.type,
                this.group.position.x + (lx * cs + lz * sn) * sc,
                0.06,
                this.group.position.z + (-lx * sn + lz * cs) * sc,
                0.55,
              );
            }
          }
          this._wasAirborne = nowAir;
          this.airborne = nowAir;
          if (this.tailRoot)
            this.tailRoot.rotation.z =
              Math.sin(this.hopTime + this.phase) * (0.1 + 0.06 * pose);
        }
        update(t, dt) {
          this.updateRabbitHop(t, dt);
          this.blink(dt);
          const ears = this.ears;
          for (let ei = 0; ei < ears.length; ei++) {
            const ear = ears[ei];
            ear.group.rotation.set(
              (this.airborne ? -0.035 : 0) +
                Math.sin(t * 1.4 + this.phase + ear.side) * 0.025,
              ear.group.rotation.y,
              ear.baseZ + Math.sin(t * 1.1 + this.phase) * 0.025,
            );
          }
        }
      }

          this.headRoot.position.set(0.48 * this.L, 2.05 * this.H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.52, 1),
            this.feather,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [this.headSize, this.headSize, 0.94 * this.headSize],
          );
          this.part(
            new THREE.ConeGeometry(
              0.18 * this.headSize,
              0.42 * this.headSize,
              4,
            ),
            this.beak,
            this.headRoot,
            [0.48 * this.headSize, -0.04, 0],
            [0, 0, -Math.PI / 2],
            [1, 0.75, 1],
          );

          const ez = 0.4 * this.headSize;
          this.eye(
            new THREE.SphereGeometry(0.075, 8, 6),
            this.eyeMat,
            this.headRoot,
            [0.3 * this.headSize, 0.11 * this.headSize, ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );
          this.eye(
            new THREE.SphereGeometry(0.075, 8, 6),
            this.eyeMat,
            this.headRoot,
            [0.3 * this.headSize, 0.11 * this.headSize, -ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );

          this.part(
            new THREE.IcosahedronGeometry(0.17 * this.combSize, 1),
            this.comb,
            this.headRoot,
            [-0.1, 0.46 * this.combSize, 0],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.18 * this.combSize, 1),
            this.comb,
            this.headRoot,
            [0.1, 0.49 * this.combSize, 0],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.15 * this.combSize, 1),
            this.comb,
            this.headRoot,
            [0.29, 0.43 * this.combSize, 0],
          );

          this.makeWing(1);
          this.makeWing(-1);

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.66, 1.44, 0);
          this.tailRoot.rotation.z = 1.18;
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          const ts = this.tailSize,
            UP = new THREE.Vector3(0, 1, 0);
          // main plumes sweep up and back, fanning slightly sideways
          for (const d of [
            [-0.95, 0.5, 0],
            [-0.85, 0.72, 0.34],
            [-0.85, 0.72, -0.34],
            [-0.62, 1.0, 0.17],
            [-0.62, 1.0, -0.17],
          ]) {
            const v = new THREE.Vector3(d[0], d[1], d[2]).normalize();
            const len = 0.82 * ts;
            const f = this.part(
              new THREE.ConeGeometry(0.11 * ts, len, 5),
              this.wingMat,
              this.tailRoot,
              [v.x * len * 0.5, v.y * len * 0.5, v.z * len * 0.5],
            );
            f.quaternion.setFromUnitVectors(UP, v);
          }
          // shorter accent plumes low and back for depth
          for (const d of [
            [-1, 0.32, 0.13],
            [-1, 0.32, -0.13],
          ]) {
            const v = new THREE.Vector3(d[0], d[1], d[2]).normalize();
            const len = 0.5 * ts;
            const f = this.part(
              new THREE.ConeGeometry(0.085 * ts, len, 5),
              this.accent,
              this.tailRoot,
              [v.x * len * 0.5, v.y * len * 0.5, v.z * len * 0.5],
            );
            f.quaternion.setFromUnitVectors(UP, v);
          }

          const upper = 0.25 * this.legSize,
            lower = 0.25 * this.legSize;
          this.leg({
            x: 0,
            z: 0.16,
            upper,
            lower,
            upperRadius: 0.055,
            lowerRadius: 0.045,
            upperMat: this.beak,
            lowerMat: this.beak,
            hoofMat: this.beak,
            hoofSize: 0.1,
            foot: "bird",
            footSize: 1.0,
            phase: 0,
          });
          this.leg({
            x: 0,
            z: -0.16,
            upper,
            lower,
            upperRadius: 0.055,
            lowerRadius: 0.045,
            upperMat: this.beak,
            lowerMat: this.beak,
            hoofMat: this.beak,
            hoofSize: 0.1,
            foot: "bird",
            footSize: 1.0,
            phase: Math.PI,
          });
        }
        makeWing(side) {
          this.addWing(side, {
            y: 1.24,
            z: 0.58 * this.W + CONFIG.surface.wingClearance,
            len: 0.72 * this.wingSize,
            chord: 0.46 * this.wingSize,
            thin: 0.14 * this.wingSize,
            sweep: 0.08,
            tuck: 0.14,
            mat: this.wingMat,
            tipMat: this.accent,
          });
        }
        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.8 + this.phase) *
              (this.initialized ? 0.05 : 0.025);
        }
      }

          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.fur,
            this.bodyRoot,
            [0, 0.83, 0],
            [0, 0, 0],
            [0.9 * this.L, 0.62 * this.H, 0.54 * this.W],
          );
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.furLight,
            this.bodyRoot,
            [0.12, 0.7, 0],
            [0, 0, 0],

            new THREE.SphereGeometry(0.065, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.27, 0.11, ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );
          this.eye(
            new THREE.SphereGeometry(0.065, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.27, 0.11, -ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );

          this.mouseEar(1);
          this.mouseEar(-1);

          const upper = 0.17 * this.legSize,

          for (const [x, z, phase] of [
            [0.4, 0.25, Math.PI * 1.5],
            [-0.4, 0.25, 0],
            [0.4, -0.25, Math.PI * 0.5],
            [-0.4, -0.25, Math.PI],

              z,

              lowerRadius: 0.035,

              lowerMat: this.fur,
              hoofMat: this.nose,

            });

            [-0.43, 0.28, 0.05],
            [-0.46, 0.49, 0.1],
            [-0.34, 0.64, 0.14],
            [-0.15, 0.7, 0.17],

          this.tube(
            this.tailRoot,
            points,
            0.05 * this.tailSize,
            0.008 * this.tailSize,
            this.fur,
            6,
            14, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );

        mouseEar(side) {
          const ear = new THREE.Group();
          ear.position.set(
            -0.02,
            0.37 * this.earSize,
            side * 0.34 * this.earSize,
          );
          this.headRoot.add(ear);
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.fur,
            ear,
            [0, 0, 0],
            [0, 0, 0],
            [0.3 * this.earSize, 0.4 * this.earSize, 0.13 * this.earSize],
          );
          this.overlay(
            new THREE.IcosahedronGeometry(1, 1),
            this.earInner,
            ear,
            [
              0.04,
              0.01,
              side * (0.082 * this.earSize + CONFIG.surface.earOverlay),
            ],
            [0, 0, 0],
            [0.19 * this.earSize, 0.28 * this.earSize, 0.038 * this.earSize],
          );
          this.ears.push({ group: ear, side, baseZ: 0 });
        }
        update(t, dt) {
          super.update(t, dt);
          for (const ear of this.ears)
            ear.group.rotation.y =
              Math.sin(t * 1.6 + this.phase + ear.side) * 0.055;
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 2.1 + this.phase) *
              (this.initialized ? 0.06 : 0.025);
          if (this.tailRoot)
            this.tailRoot.rotation.z =
              Math.sin(t * 2.2 + this.phase) * (this.initialized ? 0.15 : 0.04);
        }
      }

        goatEar(side) {
          const ear = new THREE.Group();
          const dir = new THREE.Vector3(-1, -0.08, 0).normalize();
          ear.position.set(
            -0.14,
            0.25 * this.headSize,
            side * 0.38 * this.headSize,
          );
          this.headRoot.add(ear);
          const length = 0.34 * this.earSize;
          const earMesh = this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.bodyMat,
            ear,
            [
              dir.x * length * 0.48,
              dir.y * length * 0.48,
              dir.z * length * 0.48,
            ],
            [0, 0, 0],
            [length * 0.48, 0.105 * this.earSize, 0.145 * this.earSize],
          );
          earMesh.quaternion.setFromUnitVectors(
            new THREE.Vector3(1, 0, 0),
            dir,
          );
          this.ears.push({ group: ear, side, baseX: 0, baseY: 0, baseZ: 0 });
        }
        goatHorn(side) {
          const horn = new THREE.Group();
          const dir = new THREE.Vector3(
            -1,
            8.9,
            side > 0 ? 1.6 : -1.6,
          ).normalize();
          horn.position.set(
            -0.1,
            0.34 * this.headSize,
            side * 0.15 * this.headSize,
          );
          this.headRoot.add(horn);
          horn.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
          this.part(
            new THREE.ConeGeometry(
              0.075 * this.hornSize,
              0.34 * this.hornSize,
              5,
            ),
            this.hornMat,
            horn,
            [0, 0.16 * this.hornSize, 0],
          );
          this.part(
            new THREE.ConeGeometry(
              0.045 * this.hornSize,
              0.16 * this.hornSize,
              5,
            ),
            this.hornMat,
            horn,
            [0, 0.4 * this.hornSize, 0],
          );
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.neckRoot) {
            const amount = this.initialized
              ? CONFIG.animation.goatHead.walk
              : CONFIG.animation.goatHead.idle;
            this.neckRoot.rotation.z =
              Math.sin(t * this.gaitFrequency * 0.45 + this.phase) * amount;
          }
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 0.75 + this.phase) *
              (this.initialized ? 0.05 : 0.025);
          const ears = this.ears;
          for (let ei = 0; ei < ears.length; ei++) {
            const ear = ears[ei];
            ear.group.rotation.set(
              ear.baseX + Math.sin(t * 1.1 + this.phase + ear.side) * 0.025,
              ear.group.rotation.y,
              ear.baseZ + Math.sin(t * 1.7 + this.phase) * 0.028,
            );
          }
          if (this.beard)
            this.beard.rotation.z = Math.sin(t * 1.0 + this.phase) * 0.035;
          if (this.tailRoot)
            this.tailRoot.rotation.z =
              Math.PI / 4 +
              Math.sin(t * 1.25 + this.phase) *
                (this.initialized ? 0.14 : 0.055);
        }
      }

            [-0.44, 1.24, -0.44, 0.2],
          ];
          for (const s of scutes)
            this.part(
              new THREE.IcosahedronGeometry(s[3] * ss, 0),
              this.scuteMat,
              this.bodyRoot,
              [s[0] * this.L, s[1] * this.H, s[2] * this.W],
              [0, 0, 0],
              [1, 0.55, 1],
            );

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.46 * this.L, 0.7 * this.H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.skinMat,
            this.headRoot,
            [-0.2, -0.02, 0],
            [0, 0, 0],
            [0.34, 0.19, 0.19],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.3 * this.headSize, 1),
            this.skinMat,
            this.headRoot,
            [0.12, 0.03, 0],
            [0, 0, 0],
            [1.12, 0.96, 0.92],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.17 * this.headSize, 1),
            this.skinMat,
            this.headRoot,
            [0.33, -0.04, 0],
            [0, 0, 0],
            [1.05, 0.78, 0.82],
          );

          const ez = 0.23 * this.headSize;
          this.eye(
            new THREE.SphereGeometry(0.05, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.24, 0.11, ez],
            [0, 0, 0],
            [1, 1, 0.75],
          );
          this.eye(
            new THREE.SphereGeometry(0.05, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.24, 0.11, -ez],
            [0, 0, 0],
            [1, 1, 0.75],
          );

          const upper = 0.25 * this.legSize,
            lower = 0.18 * this.legSize;
          const legs = [
            [0.72 * this.L, 0.5 * this.W, Math.PI * 1.5],
            [-0.72 * this.L, 0.5 * this.W, 0],
            [0.72 * this.L, -0.5 * this.W, Math.PI * 0.5],
            [-0.72 * this.L, -0.5 * this.W, Math.PI],
          ];
          for (const [x, z, phase] of legs)
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.14,
              lowerRadius: 0.12,
              upperMat: this.skinMat,
              lowerMat: this.skinMat,
              hoofMat: this.clawMat,
              hoofSize: 0.1,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.44 * this.L, 0.62 * this.H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          this.part(
            new THREE.ConeGeometry(0.09, 0.32, 5),
            this.skinMat,
            this.tailRoot,
            [0.06, 0, 0],
            [0, 0, Math.PI / 2 + 0.35],
          );
        }
        update(t, dt) {
          super.update(t, dt);
          const hr = this.headRoot;
          if (hr)
            hr.rotation.set(
              hr.rotation.x,
              Math.sin(t * 0.5 + this.phase) * 0.04,
              Math.sin(t * 0.7 + this.phase) *
                (this.initialized ? 0.06 : 0.025),
            );
          if (this.tailRoot)
            this.tailRoot.rotation.y =
              Math.sin(t * 1.0 + this.phase) * (this.initialized ? 0.1 : 0.04);
        }
      }

          this.neckRoot.position.set(0.86 * this.L, 1.32 * this.H, 0);

            [0, 0, 0],
            [1.02 * this.headSize, 1.0 * this.headSize, 0.96 * this.headSize],
          );
          // flat broad bill + rounded tip
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.billMat,
            this.headRoot,
            [0.42 * this.headSize, -0.06, 0],
            [0, 0, -0.06],
            [1.25, 0.34, 0.9],

          this.part(
            new THREE.IcosahedronGeometry(0.18, 1),
            this.billMat,
            this.headRoot,
            [0.62 * this.headSize, -0.07, 0],
            [0, 0, 0],
            [0.9, 0.34, 0.86],
          );

          const ez = 0.3 * this.headSize;
          for (const side of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.06, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.16 * this.headSize, 0.12 * this.headSize, side * ez],
              [0, 0, 0],
              [1, 1, 0.72],
            );

          // upturned tail
          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.86 * this.L, 1.16 * this.H, 0);
          this.tailRoot.rotation.z = 0.5;
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          const UP = new THREE.Vector3(0, 1, 0);
          for (const dir of [
            [-0.5, 0.7, 0.14],
            [-0.5, 0.72, -0.14],
            [-0.35, 0.8, 0],
          ]) {
            const v = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
            const len = 0.42 * this.tailSize;
            const f = this.part(
              new THREE.ConeGeometry(0.09 * this.tailSize, len, 5),
              this.wingMat,
              this.tailRoot,
              [v.x * len * 0.5, v.y * len * 0.5, v.z * len * 0.5],
            );
            f.quaternion.setFromUnitVectors(UP, v);
          }

          // two webbed legs
          const upper = 0.2 * this.legSize,
            lower = 0.16 * this.legSize;
          for (const [z, phase] of [
            [0.2, 0],
            [-0.2, Math.PI],
          ])
            this.leg({
              x: -0.05,
              z,
              upper,
              lower,
              upperRadius: 0.06,
              lowerRadius: 0.05,
              upperMat: this.footMat,
              lowerMat: this.footMat,
              hoofMat: this.footMat,
              hoofSize: 0.13,
              foot: "web",
              footSize: 1.0,
              phase,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt);
          // pronounced side-to-side waddle roll while walking
          if (this.bodyRoot) {
            const w =
              this.moving && this.initialized
                ? Math.sin(t * this.gaitFrequency * 0.5 + this.phase) * 0.12
                : 0;
            this.bodyRoot.rotation.x = w;
          }
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 2.0 + this.phase) * (this.initialized ? 0.06 : 0.03);
        }
      }

            const len = 0.4 * this.tailSize;

              new THREE.ConeGeometry(0.1 * this.tailSize, len, 5),

            f.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v);

          // two tall legs
          const upper = 0.34 * this.legSize,

          for (const [z, phase] of [

            [-0.24, Math.PI],

              x: -0.02,
              z,
              upper,
              lower,
              upperRadius: 0.075,
              lowerRadius: 0.06,
              upperMat: this.footMat,
              lowerMat: this.footMat,
              hoofMat: this.footMat,
              hoofSize: 0.15,
              foot: "web",
              footSize: 1.35,
              phase,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt);
          // gentle neck sway + waddle
          if (this.neckRoot)
            this.neckRoot.rotation.z =
              Math.sin(t * 1.2 + this.phase) * (this.initialized ? 0.05 : 0.02);
          if (this.bodyRoot) {
            const w =
              this.moving && this.initialized
                ? Math.sin(t * this.gaitFrequency * 0.5 + this.phase) * 0.08
                : 0;
            this.bodyRoot.rotation.x = w;
          }
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.6 + this.phase) * (this.initialized ? 0.05 : 0.02);
        }
      }

      /* ---------------------------- SWAN --------------------------------- */
      // Goose skeleton stretched: the neck is the whole animal.
      // A goose's neck is three blobs; a swan's is a long S carrying the head well forward of the breast.
      class Swan extends Flier {
        constructor(o = {}) {
          super("swan");
          const C = CONFIG.species.swan;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.97, 1.05);
          this.H = rand(0.97, 1.05);
          this.W = rand(0.95, 1.04);
          this.headSize = rand(0.93, 1.05);
          this.neckLength = rand(0.94, 1.08);
          this.wingSize = rand(0.95, 1.06);
          this.legSize = rand(0.96, 1.05);
          this.tailSize = rand(0.94, 1.06);
          const c = pick([
            // mute swan: orange bill, black knob and lores
            {
              body: 0xf6f4ee,
              wing: 0xeae7de,
              bill: 0xe8721f,
              face: 0x1c1a18,
              knob: true,
              foot: 0x2a2724,
            },
            // whooper: yellow wedge running back into a black tip
            {
              body: 0xf4f2ec,
              wing: 0xe6e2d8,
              bill: 0xe0c23a,
              face: 0x1e1c1a,
              knob: false,
              foot: 0x33302c,
            },
            // black swan: sooty body, crimson bill
            {
              body: 0x2e2b29,
              wing: 0x232120,
              bill: 0xb8352c,
              face: 0x1a1817,
              knob: false,
              foot: 0x26241f,
            },
          ]);
          this.bodyMat = mat(tint(c.body), 0.93);
          this.wingMat = mat(tint(c.wing), 0.94);
          this.billMat = mat(tint(c.bill), 0.55);
          this.faceMat = mat(tint(c.face), 0.7);
          this.footMat = mat(tint(c.foot), 0.7);
          this.hasKnob = c.knob;
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          // long boat hull, stern lifted
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [0, 1.3, 0],
            [0, 0, -0.09],
            [1.18 * this.L, 0.8 * this.H, 0.66 * this.W],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.62, 1),
            this.bodyMat,
            this.bodyRoot,
            [0.74 * this.L, 1.34, 0],
            [0, 0, 0],
            [0.8, 0.86, 0.82],
          );
          // Wings carried ARCHED over the back, not folded flat to the flank -- the raised-wing posture is most of what separates a swan from a big goose.
          for (const side of [1, -1])
            this.addWing(side, {
              y: 1.52,
              z: 0.6 * this.W,
              len: 0.72 * this.wingSize,
              chord: 0.66 * this.wingSize,
              thin: 0.13 * this.wingSize,
              sweep: 0.1,
              tuck: -0.12, // negative: lifts clear of the body
              mat: this.wingMat,
            });

          // The S-neck: ONE tapered tube swept along a curve, not a stack of spheres.
          // The goose gets away with three overlapping ellipsoids because its neck is short and they fuse.
          // At this length the same trick leaves a visible waist between every pair and the neck reads as a string of beads.
          // x leans BACK through the lower bend and forward again through the upper one, which is what makes an S rather than a tilted column.
          const nbx = 0.92 * this.L,
            nby = 1.5 * this.H;

          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(nbx, nby, 0);
          this.group.add(this.neckRoot);

          const neckAngle = 0.52;

          const NECK = [
            [-0.02, 0.0],
            [-0.07, 0.34],
            [-0.03, 0.7],
            [0.1, 1.04],
            [0.28, 1.34],
            [0.5, 1.58],
            [0.6, 1.7],
          ].map(([nx, ny]) => {
            const x = nx * this.L;
            const y = ny * this.neckLength;

            const c = Math.cos(neckAngle);
            const s = Math.sin(neckAngle);

            return [x * c - y * s, x * s + y * c, 0];
          });

          this.tube(this.neckRoot, NECK, 0.25, 0.15, this.bodyMat, 8, 16);

          // The head hangs off the LAST point of that curve rather than off its own copy of the numbers, so reshaping the neck cannot leave it floating.
          const tip = NECK[NECK.length - 1];

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(nbx + tip[0], nby + tip[1], tip[2]);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.27, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.15 * this.headSize, 1.0 * this.headSize, 0.9 * this.headSize],
          );
          // long flat bill
          this.part(
            new THREE.IcosahedronGeometry(0.2, 1),
            this.billMat,
            this.headRoot,
            [0.36 * this.headSize, -0.05, 0],
            [0, 0, -0.16],
            [1.6, 0.5, 0.72],
          );
          // Bare skin from bill to eye.
          // On a mute swan this is the black mask that makes the orange read as orange; it is the difference between a swan and a white goose at any distance.
          this.part(
            new THREE.IcosahedronGeometry(0.19, 1),
            this.faceMat,
            this.headRoot,
            [0.17 * this.headSize, 0.02, 0],
            [0, 0, 0],
            [1.25, 0.62, 0.66],
          );
          if (this.hasKnob)
            this.part(
              new THREE.IcosahedronGeometry(0.1, 1),
              this.faceMat,
              this.headRoot,
              [0.14 * this.headSize, 0.19 * this.headSize, 0],
              [0, 0, 0],
              [1, 1.25, 0.85],
            );

          const ez = 0.19 * this.headSize;
          for (const side of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.045, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.13 * this.headSize, 0.1 * this.headSize, side * ez],
              [0, 0, 0],
              [1, 1, 0.72],
            );

          // short cocked tail
          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.1 * this.L, 1.46 * this.H, 0);
          this.tailRoot.rotation.z = 0.7;
          this.bodyRoot.add(this.tailRoot);
          for (const dir of [
            [-0.6, 0.5, 0.13],
            [-0.6, 0.5, -0.13],
          ]) {
            const v = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
            const len = 0.42 * this.tailSize;
            const f = this.part(
              new THREE.ConeGeometry(0.11 * this.tailSize, len, 5),
              this.wingMat,
              this.tailRoot,
              [v.x * len * 0.5, v.y * len * 0.5, v.z * len * 0.5],
            );
            f.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v);
          }

          // short legs set well back, which is why a swan waddles on land
          const upper = 0.3 * this.legSize,
            lower = 0.26 * this.legSize;
          for (const [z, phase] of [
            [0.25, 0],
            [-0.25, Math.PI],
          ])
            this.leg({
              x: -0.12,
              z,
              upper,
              lower,
              upperRadius: 0.08,
              lowerRadius: 0.065,
              upperMat: this.footMat,
              lowerMat: this.footMat,
              hoofMat: this.footMat,
              hoofSize: 0.16,
              foot: "web",
              footSize: 1.5,
              phase,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt);
          // A long neck has its own slow pendulum, well under the body's rate.
          if (this.neckRoot)
            this.neckRoot.rotation.z =
              Math.sin(t * 0.8 + this.phase) *
              (this.initialized ? 0.04 : 0.015);
          if (this.bodyRoot)
            this.bodyRoot.rotation.x =
              this.moving && this.initialized
                ? Math.sin(t * this.gaitFrequency * 0.5 + this.phase) * 0.07
                : 0;
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.1 + this.phase) * (this.initialized ? 0.05 : 0.02);
        }
      }

      /* -------------------------- HEDGEHOG ------------------------------- */
      class Hedgehog extends Animal {
        constructor(o = {}) {
          super("hedgehog");
          const C = CONFIG.species.hedgehog;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.96, 1.05);
          this.H = rand(0.95, 1.05);
          this.W = rand(0.96, 1.05);
          this.headSize = rand(0.94, 1.06);
          this.legSize = rand(0.94, 1.06);
          this.spikeSize = rand(0.95, 1.08);
          const c = pick([
            // warm tan: creamy belly, tan flanks, greyish face, brown spikes
            {
              face: 0xb7a488,
              body: 0xc4ab8b,
              belly: 0xe0d0b6,
              spikeA: 0x5b4a3a,
              spikeB: 0x8a7358,
            },
            // greige: soft grey-brown body over a pale underside
            {
              face: 0xa89a86,
              body: 0xa89680,
              belly: 0xd0c1a8,
              spikeA: 0x4a3f34,
              spikeB: 0x7a6a55,
            },
            // pale sandy with darker sandy back
            {
              face: 0xcabfa8,
              body: 0xc9b598,
              belly: 0xe6dcc8,
              spikeA: 0x6d5f4c,
              spikeB: 0x9c8b70,
            },
            // cool taupe over cream
            {
              face: 0x9c8d78,
              body: 0x9a8a74,
              belly: 0xc7b79c,
              spikeA: 0x3d352c,
              spikeB: 0x6a5d4b,
            },
          ]);
          this.faceMat = mat(tint(c.face), 0.96);
          this.bodyMat = mat(tint(c.body), 0.95);
          this.bellyMat = mat(tint(c.belly), 0.95);
          this.spikeMatA = mat(tint(c.spikeA), 0.98);
          this.spikeMatB = mat(tint(c.spikeB), 0.98);
          this.noseMat = mat(0x25211e, 0.7);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          const bc = [0, 0.72, 0]; // body centre (bodyRoot-local)
          const br = [0.95 * this.L, 0.62 * this.H, 0.75 * this.W]; // body radii
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            bc,
            [0, 0, 0],
            br,
          );
          // pale underside so the body isn't one flat colour
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.bellyMat,
            this.bodyRoot,
            [bc[0] + 0.12 * this.L, bc[1] - 0.34 * this.H, 0],
            [0, 0, 0],
            [0.82 * this.L, 0.34 * this.H, 0.66 * this.W],
          );
          // a soft cheek/collar patch linking the pale face into the body
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.bellyMat,
            this.bodyRoot,
            [bc[0] + 0.6 * this.L, bc[1] - 0.1 * this.H, 0],
            [0, 0, 0],
            [0.4 * this.L, 0.42 * this.H, 0.6 * this.W],
          );
          // spiky mantle: many small cones over the upper/back hemisphere, leaving the face clear.
          // Each sits on the body surface pointing out, alternating between two materials so the quills do not read as one flat mass.
          const UP = new THREE.Vector3(0, 1, 0);
          let flip = 0;
          for (let iy = 0; iy < 6; iy++) {
            const phi = (iy / 6) * Math.PI * 0.62 + 0.12; // top -> just past shoulder
            const ringN = 5 + iy * 2;
            for (let ix = 0; ix < ringN; ix++) {
              const th = (ix / ringN) * Math.PI * 2 + (iy % 2) * 0.3;
              const v = new THREE.Vector3(
                Math.sin(phi) * Math.cos(th),
                Math.cos(phi),
                Math.sin(phi) * Math.sin(th),
              );
              if (v.x > 0.5 && v.y < 0.35) continue; // keep the face bare
              const px = bc[0] + v.x * br[0],
                py = bc[1] + v.y * br[1],
                pz = bc[2] + v.z * br[2];
              const len = (0.3 + Math.random() * 0.12) * this.spikeSize;
              const spike = this.part(
                new THREE.ConeGeometry(0.055 * this.spikeSize, len, 4),
                flip++ % 2 ? this.spikeMatA : this.spikeMatB,
                this.bodyRoot,
                [
                  px + v.x * len * 0.35,
                  py + v.y * len * 0.35,
                  pz + v.z * len * 0.35,
                ],
              );
              spike.quaternion.setFromUnitVectors(UP, v.clone().normalize());
            }
          }

          // pointed face poking out the front
          this.headRoot = new THREE.Group();
          this.headRoot.position.set(0.97 * this.L, 0.62 * this.H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.32, 1),
            this.faceMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.0 * this.headSize, 0.92 * this.headSize, 0.9 * this.headSize],
          );
          // tapered snout
          this.part(
            new THREE.ConeGeometry(0.2, 0.5, 6),
            this.faceMat,
            this.headRoot,
            [0.34 * this.headSize, -0.04, 0],
            [0, 0, -Math.PI / 2],
            [1, 1, 0.85],
          );
          this.part(
            new THREE.SphereGeometry(0.05, 7, 5),
            this.noseMat,
            this.headRoot,
            [0.58 * this.headSize, -0.03, 0],
            [0, 0, 0],
            [1, 0.9, 0.9],
          );

          const ez = 0.18 * this.headSize;
          for (const side of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.05, 7, 5),
              this.eyeMat,
              this.headRoot,
              [0.16 * this.headSize, 0.1 * this.headSize, side * ez],
              [0, 0, 0],
              [1, 1, 0.75],
            );
          // tiny round ears
          for (const side of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.09, 1),
              this.faceMat,
              this.headRoot,
              [-0.05, 0.24 * this.headSize, side * 0.2 * this.headSize],
              [0, 0, 0],
              [1, 1, 0.6],
            );

          // four short legs tucked under the body
          const upper = 0.12 * this.legSize,
            lower = 0.11 * this.legSize;
          for (const [x, z, phase] of [
            [0.36, 0.3, Math.PI * 1.5],
            [-0.4, 0.3, 0],
            [0.36, -0.3, Math.PI * 0.5],
            [-0.4, -0.3, Math.PI],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.04,
              lowerRadius: 0.032,
              upperMat: this.faceMat,
              lowerMat: this.faceMat,
              hoofMat: this.noseMat,
              hoofSize: 0.055,
              phase,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          // busy little nose twitch
          const hr = this.headRoot;
          if (hr)
            hr.rotation.set(
              Math.sin(t * 4.5 + this.phase) * (this.initialized ? 0.03 : 0.01),
              Math.sin(t * 3.0 + this.phase) * (this.initialized ? 0.05 : 0.02),
              hr.rotation.z,
            );
        }
      }

      /* ---------------------------- FROG --------------------------------- */
      class Frog extends Hopper {
        constructor(o = {}) {
          super("frog");
          const C = CONFIG.species.frog;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.95, 1.06);
          this.H = rand(0.94, 1.06);
          this.W = rand(0.96, 1.08);
          this.headSize = rand(0.95, 1.07);
          this.legSize = rand(0.95, 1.06);
          const c = pick([
            { skin: 0x5f8f3f, belly: 0xcfd6a3, spot: 0x3c5f28 }, // green
            { skin: 0x6f7a34, belly: 0xc9c58a, spot: 0x4a521f }, // olive
            { skin: 0x8a6a3c, belly: 0xcdb389, spot: 0x5c4526 }, // brown
            { skin: 0x4f9a6a, belly: 0xc7dcc0, spot: 0x2f6a44 }, // tree-green
            { skin: 0xd4b830, belly: 0xe8dca0, spot: 0x7a5f1c }, // golden poison
            { skin: 0x3a7fb0, belly: 0xa9cfe0, spot: 0x244f74 }, // blue poison dart
          ]);
          this.skinMat = mat(tint(c.skin), 0.7);
          this.bellyMat = mat(tint(c.belly), 0.75);
          this.spotMat = mat(tint(c.spot), 0.72);
          this.mouthMat = mat(0x201d1a, 0.8);
          this.tongueMat = mat(0xc0506a, 0.55);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.hopTime = rand(0, 1); // hop-cycle phase (turns)
          this._wasAirborne = false;
          this.airborne = false;
          this.build();
          this.place(o, scale);
        }
        build() {
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          // wide low body
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.skinMat,
            this.bodyRoot,
            [0, 0.6, 0],
            [0, 0, 0],
            [0.75 * this.L, 0.4 * this.H, 0.65 * this.W],
          );
          // pale throat/belly
          this.part(
            new THREE.IcosahedronGeometry(0.7, 1),
            this.bellyMat,
            this.bodyRoot,
            [0.3, 0.4, 0],
            [0, 0, 0],
            [0.7, 0.4, 0.78],
          );
          // folded hind thighs bulging beside the body
          for (const s of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.5, 1),
              this.skinMat,
              this.bodyRoot,
              [-0.32 * this.L, 0.6, s * 0.62 * this.W],
              [0, 0, 0],
              [0.55, 0.42, 0.36],
            );
          // a couple of dorsal spots
          for (const p of [
            [0.0, 0.96, 0.2],
            [-0.2, 0.94, -0.22],
          ])
            this.part(
              new THREE.IcosahedronGeometry(0.16, 1),
              this.spotMat,
              this.bodyRoot,
              [p[0], p[1], p[2]],
              [0, 0, 0],
              [1, 0.5, 1],
            );

          // head is the front of the body; a small root carries eyes + mouth
          this.headRoot = new THREE.Group();
          this.headRoot.position.set(0.5 * this.L, 0.66 * this.H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.skinMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [0.7 * this.headSize, 0.6 * this.headSize, 0.95 * this.headSize],
          );
          // wide mouth line
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.mouthMat,
            this.headRoot,
            [0.16 * this.headSize, -0.17, 0],
            [0, 0, 0],
            [0.5, 0.08, 0.86],
          );
          // Tongue on a mouth pivot, built full-length +X, scaled ~0 at rest so it telescopes out during a flick (see graze()).
          this.tongueRoot = new THREE.Group();
          this.tongueRoot.position.set(0.34 * this.headSize, -0.12, 0);
          this.tongueRoot.rotation.z = 0.32; // flick up at flying prey
          this.tongueRoot.scale.x = 0.02;
          this.headRoot.add(this.tongueRoot);
          const tlen = 0.95 * this.headSize;
          this.segment(
            this.tongueRoot,
            [0, 0, 0],
            [tlen, 0, 0],
            0.05 * this.headSize,
            this.tongueMat,
          );
          this.part(
            new THREE.IcosahedronGeometry(0.08 * this.headSize, 1),
            this.tongueMat,
            this.tongueRoot,
            [tlen, 0, 0],
          );
          // bulging eyes on top
          for (const s of [1, -1]) {
            this.part(
              new THREE.IcosahedronGeometry(0.2, 1),
              this.skinMat,
              this.headRoot,
              [
                0.04 * this.headSize,
                0.42 * this.headSize,
                s * 0.36 * this.headSize,
              ],
              [0, 0, 0],
              [1, 1.1, 1],
            );
            this.eye(
              new THREE.SphereGeometry(0.12, 8, 6),
              this.eyeMat,
              this.headRoot,
              [
                0.12 * this.headSize,
                0.5 * this.headSize,
                s * 0.36 * this.headSize,
              ],
              [0, 0, 0],
              [1, 1, 1],
            );
          }

          // Folded hind legs (knees up/out) + short front props.
          // Each leg is built inside a pivot group hung at its hip/shoulder, so the whole limb can straighten on launch and tuck for landing (see the hop).
          const L = this.L,
            W = this.W,
            H = this.H;
          const skin = this.skinMat;
          this.hindLegs = [];
          this.frontLegs = [];
          // Build a limb: a pivot at `origin` (group-local) with segments and toes given in group-local space (they get rebased into the pivot).
          const buildLimb = (origin, joints, r, toeBase, toeTips, toeR) => {
            const pivot = new THREE.Group();
            pivot.position.set(origin[0], origin[1], origin[2]);
            this.group.add(pivot);
            const rel = (p) => [
              p[0] - origin[0],
              p[1] - origin[1],
              p[2] - origin[2],
            ];
            for (let i = 0; i < joints.length - 1; i++)
              this.segment(
                pivot,
                rel(joints[i]),
                rel(joints[i + 1]),
                r[i],
                skin,
              );
            for (const tp of toeTips)
              this.segment(pivot, rel(toeBase), rel(tp), toeR, skin);
            return pivot;
          };
          for (const s of [1, -1]) {
            // hind leg: hip -> raised knee -> ankle -> heel -> splayed toes
            const hip = [-0.34 * L, 0.5 * H, s * 0.5 * W];
            const knee = [0.06 * L, 0.92 * H, s * 0.66 * W]; // raised & flared out
            const ankle = [0.34 * L, 0.24 * H, s * 0.56 * W];
            const heel = [0.42 * L, 0.05, s * 0.5 * W];
            const hind = buildLimb(
              hip,
              [hip, knee, ankle, heel],
              [0.1 * this.legSize, 0.08 * this.legSize, 0.06 * this.legSize],
              heel,
              [
                [0.82 * L, 0.04, s * 0.34 * W],
                [0.86 * L, 0.04, s * 0.52 * W],
                [0.82 * L, 0.04, s * 0.7 * W],
              ],
              0.04 * this.legSize,
            );
            // knuckle bulge at the raised knee (rebased into the pivot)
            this.part(
              new THREE.IcosahedronGeometry(0.12 * this.legSize, 1),
              skin,
              hind,
              [knee[0] - hip[0], knee[1] - hip[1], knee[2] - hip[2]],
            );
            this.hindLegs.push({ pivot: hind, side: s });

            // short front (arm) leg propping up the chest
            const sh = [0.44 * L, 0.44 * H, s * 0.34 * W];
            const elbow = [0.52 * L, 0.18 * H, s * 0.37 * W];
            const wrist = [0.58 * L, 0.05, s * 0.35 * W];
            const front = buildLimb(
              sh,
              [sh, elbow, wrist],
              [0.055 * this.legSize, 0.05 * this.legSize],
              wrist,
              [
                [0.7 * L, 0.04, s * 0.28 * W],
                [0.72 * L, 0.04, s * 0.36 * W],
                [0.7 * L, 0.04, s * 0.44 * W],
              ],
              0.03 * this.legSize,
            );
            this.frontLegs.push({ pivot: front, side: s });
          }
        }
        // Drive the leg pivots from the hop arc: hind legs kick out (extend back-down) on the launch, trail while airborne, and tuck back to the folded rest pose to catch on landing.
        // Fronts make a smaller reach.
        poseLegs(airT, vN) {
          const kick = Math.max(0, vN); // >0 only while rising (thrust)
          const trail = airT; // 1 at apex
          // Hind: rotate the folded limb backward (about Z) so it straightens out behind; blend kick (push) with a gentler airborne trail.
          const hindZ = -(kick * 0.95 + trail * 0.35);
          for (const l of this.hindLegs) l.pivot.rotation.z = hindZ;
          // Front: small forward reach on the way up, tuck near the body in air
          const frontZ = kick * 0.3 - trail * 0.55;
          for (const l of this.frontLegs) l.pivot.rotation.z = frontZ;
        }
        // Ease every leg pivot back to the folded rest pose (idle/sitting).
        restLegs(dt) {
          const k = approach(10, dt);
          for (const l of this.hindLegs)
            l.pivot.rotation.z = THREE.MathUtils.lerp(l.pivot.rotation.z, 0, k);
          for (const l of this.frontLegs)
            l.pivot.rotation.z = THREE.MathUtils.lerp(l.pivot.rotation.z, 0, k);
        }
        // Afloat, HOP becomes a breaststroke.
        // The frog has no wings for the Flier's answer and no ground for the leap's, but it does have hind legs that sweep out and back, so the kick borrows the leap's own pivots through poseLegs.
        waterAction(afloat) {
          if (this._kickLeft > 0) return false; // mid-stroke -- the cooldown
          this._kickDur = this._kickLeft = 0.5;
          this.lunge(this.speed * SURGE_GAIN * 1.15 * afloat);
          return true;
        }
        // Advance the breaststroke envelope, returning the 0..1 sweep (0 = not kicking) so both the sitting branch and the swimming one can hand the legs over to it.
        // Called once a frame, ABOVE the branch, so the early return in the sitting case cannot stall it.
        _kick(dt) {
          if (!(this._kickLeft > 0)) return 0;
          this._kickLeft -= dt;
          const p = 1 - Math.max(this._kickLeft, 0) / this._kickDur;
          if (this._kickLeft <= 0) this._kickLeft = 0;
          return Math.sin(Math.min(p, 1) * Math.PI); // out, and back
        }

        // Frogs hop: whole-body arc with squash on crouch/land, stretch on launch (legs stay folded).
        // Body-only analogue of the rabbit hop.
        updateFrogHop(t, dt) {
          if (!this.initialized) {
            this.lastPosition.copy(this.group.position);
            this.initialized = true;
          }
          const dx = this.group.position.x - this.lastPosition.x;
          const dz = this.group.position.z - this.lastPosition.z;
          const speed = Math.sqrt(dx * dx + dz * dz) / Math.max(dt, 0.0001);
          this.lastPosition.copy(this.group.position);
          // Relative to the frog's own speed, with hysteresis, so being shoved while wedged doesn't start the leap cycle.
          const norm = speed / Math.max(this.speed, 0.001);
          this.moving = norm > (this.moving ? 0.07 : 0.14);
          const scale = this.group.scale.x;
          // Afloat the leap has nothing to push off, so its vertical arc fades out and the frog glides across the pond instead of bouncing over it.
          // The legs keep their full stroke either way -- kicking is what a swimming frog does too.
          const land = 1 - this.afloat;
          const kick = this._kick(dt); // once a frame, above both branches
          this._avgSpeed += (speed - this._avgSpeed) * approach(4, dt);
          const g = THREE.MathUtils.clamp(
            this._avgSpeed / Math.max(this.speed, 0.001),
            0,
            this.sprint * 1.15,
          );

          const breath = Math.sin(
            t * CONFIG.animation.breathSpeed + this.breathPhase,
          );
          const br = this.bodyRoot;

          if (!this.moving) {
            // sit: settle the arc and squash back to rest, add a throat puff
            // In time, not per call (see Animal.updateMotion's rest).
            // 0.15 and 0.2 per frame at 60Hz are rates of 10/s and 13/s; 10 matches restLegs.
            const kB = approach(10, dt),
              kS = approach(13, dt);
            this._baseY -= this._baseY * kB;
            if (br) {
              const sy = 1 + breath * this.breathAmount;
              br.scale.y += (sy - br.scale.y) * kS;
              br.scale.x += (1 - br.scale.x) * kS;
              br.scale.z += (1 - br.scale.z) * kS;
              br.rotation.x -= br.rotation.x * kB;
            }
            this.group.position.y = this._baseY + this.jumpY;
            // A commanded jump while standing still: the legs extend from the jump velocity, so the push reads as the cause of the hop.
            if (kick > 0) {
              // Breaststroke wins over the rest pose: one smooth sweep out and back, driven through the leap's own kick/trail channels.
              this.poseLegs(kick * 0.5, kick);
            } else if (this.jumpY > 0.001 || this.jumpV > 0.001) {
              const jh = 0.55 * (this.group.scale.x / 0.28);
              const airT = THREE.MathUtils.clamp(this.jumpY / jh, 0, 1);
              const vN = THREE.MathUtils.clamp(this.jumpV / 4.8, -1, 1); // ~JUMP_V*1.2
              if (this.poseLegs) this.poseLegs(airT, vN);
            } else if (this.restLegs) this.restLegs(dt);
            this.airborne = this.jumpY > 0.001;
            this._wasAirborne = false;
            this._locoGain = 1;
            return;
          }

          const hopFreq = this.gaitFrequency * (0.14 + 0.06 * Math.min(g, 2));
          this.hopTime = (this.hopTime + dt * hopFreq) % 1;
          const cyc = this.hopTime;
          const A = 0.62; // frogs spend most of the hop airborne
          const height = (0.22 + 0.14 * g) * (scale / 0.28);
          const arc = this._hopArc(cyc, height, A);
          // Scale the ARC'S OUTPUT rather than its height: _hopArc normalises vN by height, so feeding it zero would divide by zero.
          this._baseY = arc.y * land;
          this.group.position.y = this._baseY + this.jumpY;
          // A leap surges and coasts; a swimmer travels at a steady rate.
          // Ease the per-hop lunge out toward a flat 1 as the water takes over.
          this._locoGain = THREE.MathUtils.lerp(
            this._hopLunge(cyc, A),
            1,
            1 - land,
          );

          if (br) {
            // Squash comes ONLY from the ground cushion (arc dips below 0) and stretch only from the airborne rise -- so between hops, when the body is on the ground and still, it isn't wobbling.
            const cushion = THREE.MathUtils.clamp(
              -arc.y / Math.max(0.22 * height, 1e-4),
              0,
              1,
            );
            // Squash is the ground taking the frog's weight and stretch is the push off it, so both go with the arc when the water has it.
            const stretch =
              (Math.max(0, arc.vN) * 0.16 + arc.airT * 0.05) * land;
            const squash = cushion * 0.22 * land;
            br.scale.y = 1 - squash + stretch;
            br.scale.x = 1 + squash * 0.42 - stretch * 0.22;
            br.scale.z = 1 + squash * 0.42 - stretch * 0.22;
            br.rotation.x = -arc.vN * 0.34 * land; // nose-up rising, level in air
          }

          if (kick > 0) this.poseLegs(kick * 0.5, kick);
          else if (this.poseLegs) this.poseLegs(arc.airT, arc.vN); // kick/trail/tuck

          const nowAir = cyc < A;
          // No footfall on open water -- there is no foot and no fall.
          if (
            this._wasAirborne &&
            !nowAir &&
            this.jumpY <= 0 &&
            SOUND &&
            land > 1 - WATER_MIN
          )
            SOUND.step(
              this.type,
              this.group.position.x,
              0.05,
              this.group.position.z,
              0.5,
            );
          this._wasAirborne = nowAir;
          this.airborne = nowAir;
        }

        // Frog feeding: a fast tongue-flick strike, not a head-bend.
        // Overrides base graze() (no neck bone).
        graze(t, dt) {
          if (this._flickWait === undefined) this._flickWait = rand(3, 9);
          let a = 0;
          if (this._flickLeft > 0) {
            this._flickLeft -= dt;
            const p = 1 - Math.max(this._flickLeft, 0) / this._flickDur; // 0->1
            a =
              p < 0.35
                ? Math.sin((p / 0.35) * Math.PI * 0.5) // shoot out
                : p < 0.5
                  ? 1 // stick
                  : 1 - Math.sin(((p - 0.5) / 0.5) * Math.PI * 0.5); // reel in
            if (this._flickLeft <= 0) {
              this._flickLeft = 0;
              this._flickWait = rand(4, 11);
            }
          } else if (this.initialized && !this.moving && this.grounded) {
            this._flickWait -= dt;
            if (this._flickWait <= 0)
              this._flickDur = this._flickLeft = rand(0.18, 0.28);
          }
          if (this.tongueRoot) this.tongueRoot.scale.x = 0.02 + 0.98 * a;
          if (this.headRoot)
            this.headRoot.rotation.z =
              this.moving || !this.grounded ? 0 : -0.16 * a; // quick mouth lunge
        }

        update(t, dt) {
          this.updateFrogHop(t, dt);
          this.blink(dt);
          if (this.headRoot && !this.moving)
            this.headRoot.rotation.y =
              Math.sin(t * 1.4 + this.phase) * (this.initialized ? 0.05 : 0.02);
        }
      }

            new THREE.IcosahedronGeometry(0.24, 1),
            this.bibMat,
            this.headRoot,
            [0.34 * this.headSize, -0.28 * this.headSize, 0],
            [0, 0, 0],
            [0.7, 0.7, 0.8],

          const ez = 0.34 * this.headSize;
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.06, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.22 * this.headSize, 0.14 * this.headSize, s * ez],
              [0, 0, 0],
              [1, 1, 0.85],

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.74 * this.L, 1.1 * this.H, 0);

          for (const s of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.4, 1),
              this.wingMat,
              this.tailRoot,
              [-0.2, 0.28, s * 0.12],
              [0, 0, 0],
              [0.9 * this.tailSize, 0.1 * this.tailSize, 0.22 * this.tailSize],
            );

          // two thin legs with tiny toes
          const upper = 0.32 * this.legSize,
            lower = 0.14 * this.legSize;
          for (const [z, phase] of [
            [0.16, 0],
            [-0.16, Math.PI],

            this.leg({
              x: 0.02,
              z,
              upper,
              lower,
              upperRadius: 0.035,
              lowerRadius: 0.03,
              upperMat: this.footMat,
              lowerMat: this.footMat,
              hoofMat: this.footMat,
              hoofSize: 0.15,
              foot: "bird",
              footSize: 0.7,
              phase,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 3.2 + this.phase) * (this.initialized ? 0.07 : 0.03);
        }
      }

      /* ----------------------------- COW --------------------------------- */
      class Cow extends Animal {
        constructor(o = {}) {
          super("cow");
          const C = CONFIG.species.cow;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.97, 1.05);
          this.H = rand(0.96, 1.05);
          this.W = rand(0.97, 1.06);
          this.headSize = rand(0.95, 1.06);
          this.legSize = rand(0.96, 1.05);
          this.hornSize = rand(0.85, 1.2);
          const c = pick([
            {
              body: 0xf2efe9,
              patch: 0x2b2824,
              muzzle: 0xcf9f98,
              horn: 0xd8cdb6,
              spots: true,
            }, // holstein
            {
              body: 0xb98a56,
              patch: 0x8a5f34,
              muzzle: 0x5f4a3f,
              horn: 0xcabf9a,
              spots: false,
            }, // jersey
            {
              body: 0x3a3634,
              patch: 0x2a2725,
              muzzle: 0x494340,
              horn: 0x3a3634,
              spots: false,
            }, // angus
            {
              body: 0x9c4f38,
              patch: 0xf0ece4,
              muzzle: 0xcf9f98,
              horn: 0xd8cdb6,
              spots: true,
            }, // hereford
            {
              body: 0x8f8478,
              patch: 0x6f665c,
              muzzle: 0x5a524a,
              horn: 0xcabf9a,
              spots: false,
            }, // brown swiss
          ]);
          this.bodyMat = mat(tint(c.body), 0.9);
          this.patchMat = mat(tint(c.patch), 0.9);
          this.muzzleMat = mat(tint(c.muzzle), 0.85);
          this.hornMat = mat(tint(c.horn), 0.55);
          this.hoofMat = mat(0x2b2724, 0.6);
          this.udderMat = mat(tint(c.muzzle), 0.8);
          this.spots = c.spots;
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          // Body ellipsoid (bodyRoot-local): centre + radii.
          // Spots are painted onto this surface as flat conformal patches, not 3D lumps.
          const bodyC = [0, 1.62, 0];
          const bodyR = [1.45 * L, 0.72 * H, 0.85 * W];
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            bodyC,
            [0, 0, 0],
            bodyR,
          );
          this.part(
            new THREE.IcosahedronGeometry(0.7, 1),
            this.bodyMat,
            this.bodyRoot,
            [0.95 * L, 1.7, 0],
            [0, 0, 0],
            [0.75, 0.9, 0.98],
          ); // shoulders
          this.part(
            new THREE.IcosahedronGeometry(0.72, 1),
            this.bodyMat,
            this.bodyRoot,
            [-0.98 * L, 1.62, 0],
            [0, 0, 0],
            [0.78, 0.92, 1.0],
          ); // rump
          if (this.spots) {
            // Each spot is a cap cut from the body's OWN faceted surface, so it follows every facet instead of sitting on it as a plate.
            // Overlapping dabs fuse into one ragged Holstein patch.
            // Seeds stay off the poles, where the shoulder and rump blobs bulge past the main ellipsoid and would swallow them.
            const seeds = [
              [0.42, 0.72, 0.62],
              [-0.45, 0.62, -0.78],
              [-0.72, 0.18, 0.72],
              [0.3, -0.12, -0.9],
              [-0.08, 1.0, 0.18],
              [0.66, 0.3, 0.68],
              [-0.5, -0.08, 0.86],
              [0.16, 0.5, -0.86],
              [-0.78, 0.5, -0.22],
            ];
            for (const s of seeds) {
              if (Math.random() < 0.25) continue; // vary the coat between cows
              const dabs = 1 + ((Math.random() * 3) | 0); // 1-3 dabs per patch
              for (let d = 0; d < dabs; d++) {
                const j =
                  d === 0
                    ? [0, 0, 0]
                    : [rand(-0.3, 0.3), rand(-0.24, 0.24), rand(-0.3, 0.3)];
                const dir = [s[0] + j[0], s[1] + j[1], s[2] + j[2]];
                // angular radius on the body, in radians of arc
                const ang = d === 0 ? rand(0.34, 0.52) : rand(0.22, 0.4);
                // Caps ride the facets, so the lift only has to clear the chord error where a cap edge straddles a facet crease (~0.95% of the radius here).
                // Staggered per dab so overlapping caps don't z-fight with each other.
                this.overlay(
                  ellipsoidCap(dir, ang, bodyR, 1.012 + d * 0.003),
                  this.patchMat,
                  this.bodyRoot,
                  bodyC,
                );
              }
            }
          }
          // Neck on its own root so the graze bone swings it down with the head instead of leaving a stiff stub floating off the shoulders.
          // It has to reach into the body, not sit on it: everything below the graze pivot rotates away, and a cap that only touches would part from the shoulder.
          // Measured along the grazing bone the surface is 0.56 from the pivot, so the neck spans 0.46 to 1.40 -- inner end inside the chest, outer end meeting the head.
          // Centred on the rest bone and rotated to lie ALONG it, so it reads as a neck at rest and as a neck extended while grazing.
          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(1.1 * L, 1.75 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.bodyMat,
            this.neckRoot,
            [0, 0, 0],
            [0, 0, 0.57], // along the pivot->head bone
            [0.94, 0.72, 0.78],
          ); // neck
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.udderMat,
            this.bodyRoot,
            [-0.72 * L, 0.95, 0],
            [0, 0, 0],
            [1.35, 0.8, 0.95],
          ); // udder

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.5 * L, 2.0 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.0 * hs, 0.88 * hs, 0.82 * hs],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.muzzleMat,
            this.headRoot,
            [0.5 * hs, -0.18, 0],
            [0, 0, 0],
            [0.7, 0.6, 0.78],
          );
          for (const s of [1, -1])
            this.part(
              new THREE.SphereGeometry(0.05, 6, 4),
              this.hoofMat,
              this.headRoot,
              [0.72 * hs, -0.15, s * 0.14],
              [0, 0, 0],
              [1, 1, 0.8],
            );
          for (const s of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.2, 1),
              this.bodyMat,
              this.headRoot,
              [-0.15, 0.28 * hs, s * 0.45 * hs],
              [0, 0, s * 0.4],
              [0.45, 0.28, 0.75],
            ); // ears
          for (const s of [1, -1])
            this.part(
              new THREE.ConeGeometry(
                0.1 * this.hornSize,
                0.34 * this.hornSize,
                5,
              ),
              this.hornMat,
              this.headRoot,
              [0.02, 0.46 * hs, s * 0.32 * hs],
              [s * 0.7, 0, -0.2],
            ); // horns
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.08, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.34 * hs, 0.12 * hs, s * 0.26 * hs],
              [0, 0, 0],
              [1, 1, 0.8],
            );

          const upper = 0.6 * this.legSize,
            lower = 0.6 * this.legSize;
          for (const [x, z, phase] of [
            [0.95 * L, 0.3 * W, 0],
            [-1.0 * L, 0.35 * W, Math.PI],
            [0.95 * L, -0.3 * W, Math.PI],
            [-1.0 * L, -0.35 * W, 0],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.15,
              lowerRadius: 0.12,
              upperMat: this.bodyMat,
              lowerMat: this.bodyMat,
              hoofMat: this.hoofMat,
              hoofSize: 0.16,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.4 * L, 1.9 * H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          // Curve baked into the geometry (same approach as the pig and mouse): it leaves the rump, hugs down the back of the hindquarters, then hangs.
          // A straight cylinder on a rotated root just juts out stiffly.
          this.tube(
            this.tailRoot,
            [
              [0, 0, 0],
              [-0.12, -0.34, 0],
              [-0.18, -0.7, 0],
              [-0.16, -1.05, 0],
              [-0.1, -1.38, 0],
              [-0.04, -1.62, 0],
            ],
            0.055,
            0.022,
            this.bodyMat,
            5,
            12, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );
          this.part(
            new THREE.IcosahedronGeometry(0.13, 1),
            this.patchMat,
            this.tailRoot,
            [-0.04, -1.68, 0],
          ); // switch (tuft)
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 0.8 + this.phase) * (this.initialized ? 0.04 : 0.02);
          const tr = this.tailRoot;
          if (tr)
            // Negative swings the tip AWAY from the head: the tail is built hanging down and slightly back, so a negative turn about z carries it further back and up.
            tr.rotation.set(
              Math.sin(t * 1.4 + this.phase) * 0.16,
              tr.rotation.y,
              -this.tailLift(0.5),
            );
        }
      }

            {
              body: 0xc3ac86,
              muzzle: 0xe8ddc6,
              belly: 0xdbcdb0,
              dark: 0x6a5842,
            }, // sandy
          ]);
          this.bodyMat = mat(tint(c.body), 0.92);
          this.muzzleMat = mat(tint(c.muzzle), 0.9);
          this.bellyMat = mat(tint(c.belly), 0.92);
          this.darkMat = mat(tint(c.dark), 0.9);
          this.hoofMat = mat(0x252322, 0.7);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [-0.14, 1.35, 0],
            [0, 0, 0],
            [1.2 * L, 0.58 * H, 0.56 * W],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.bodyMat,
            this.bodyRoot,
            [0.85 * L, 1.42, 0],
            [0, 0, 0],
            [0.7, 0.8, 0.85],
          ); // shoulders
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.bodyMat,
            this.bodyRoot,
            [-0.9 * L, 1.35, 0],
            [0, 0, 0],
            [0.7, 0.78, 0.85],
          ); // rump
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.bellyMat,
            this.bodyRoot,
            [-0.12, 0.85, 0],
            [0, 0, 0],
            [1.2, 0.25, 0.55],
          ); // pale belly
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.darkMat,
            this.bodyRoot,
            [0, 1.8, 0],
            [0, 0, 0],
            [1.36, 0.3, 0.12],
          ); // dorsal stripe
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.darkMat,
            this.bodyRoot,
            [0.68 * L, 1.74, 0],
            [0, 0, 0],
            [0.14, 0.2, 0.85],
          ); // shoulder cross
          // Neck lives on its own root (added to the group, like the goat) so the graze/peck neck-bone can swing the whole neck + mane down with the head instead of leaving them stuck to the body.
          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(1.05 * L, 1.62 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.42, 1),
            this.bodyMat,
            this.neckRoot,
            [0, 0, 0],
            [0, 0, -0.5],
            [0.6, 0.7, 0.55],
          ); // neck
          // stiff upright mane running up the crest of the neck toward the head
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.darkMat,
            this.neckRoot,
            [-0.1 * L, 0.38 * H, 0],
            [0, 0, 0.8],
            [0.5, 0.32, 0.12],
          ); // mane

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.32 * L, 1.92 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.05 * hs, 0.85 * hs, 0.72 * hs],
          );
          // forelock tuft between the ears: ties the mane to the head so it stays on the body when the head moves.
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.darkMat,
            this.headRoot,
            [-0.2 * hs, 0.28 * hs, 0],
            [0, 0, 0.4],
            [0.24, 0.3, 0.34],
          ); // forelock
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.bodyMat,
            this.headRoot,
            [0.4 * hs, -0.16, 0],
            [0, 0, 0],
            [1.1, 0.62, 0.66],
          ); // long muzzle
          this.part(
            new THREE.IcosahedronGeometry(0.22, 1),
            this.muzzleMat,
            this.headRoot,
            [0.65 * hs, -0.22, 0],
            [0, 0, 0],
            [0.9, 0.55, 0.7],
          ); // pale nose
          for (const s of [1, -1])
            this.part(
              new THREE.SphereGeometry(0.04, 6, 4),
              this.hoofMat,
              this.headRoot,
              [0.72 * hs, -0.2, s * 0.12],
              [0, 0, 0],
              [1, 1, 0.8],
            );
          // long ears (the signature)
          for (const s of [1, -1]) {
            const ear = new THREE.Group();
            ear.position.set(-0.05, 0.18 * hs, s * 0.24 * hs);
            ear.rotation.z = -0.12;
            ear.rotation.x = s * 0.12;
            this.headRoot.add(ear);
            this.part(
              new THREE.IcosahedronGeometry(0.5, 1),
              this.bodyMat,
              ear,
