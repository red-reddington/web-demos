          // A constant string, and counts of what the landing search turned down -- so a refusal says exactly why.
          this._flyWhy = "";
          this._flyRej = { surface: 0, far: 0, crowded: 0 };
          // Obstacles along a planned route: start, end (metres along it) and height to clear.
          // Room for the whole herd plus every bale and scarecrow in the window.
          this._obS = new Float32Array(512);
          this._obE = new Float32Array(512);
          this._obH = new Float32Array(512);
          this._flightCeil = 0; // see _ceiling
          // Whatever is touching a bird at take-off: x, z, and the distance at which they touch.
          this._nb = new Float32Array(96);
          this._howlIn = 0;
          this._howlDir = 0;
          this._howlLeft = 0;
          this._travelDir = 0;
          this._travelW = 0;
          this._herdDrift = 0.5; // replaced by the measured value once the herd exists
          for (const a of this.animals) a.update(0, 0.016);
          scene.updateMatrixWorld(true);
          registry.update();
          Collision.init(this.animals);
        }

        // The spawn grid knows nothing about the lakes, so spiral out to dry land.
        // Runs once at build; the search can be dumb.
        _buildFarm() {
          // Centre the farm on the STREAMING ANCHOR, which at boot is the camera: nothing is selected, so fly mode is in force and _recycle anchors on the camera.
          // Centred on the origin, the farm's disc and the recycler's disc sat 59u apart -- the opening camera offset -- so the far edge streamed out on the first frames.
          // All of it beyond FOG_OPAQUE, so unseen, but forty pointless relocations at startup.
          const ax = this.camera.position.x,
            az0 = this.camera.position.z;
          this.animals = [];
          const text =
            FARM_MAP || generateFarmMap(CONFIG.world.animalsPerSpecies);
          this._farmMap = text; // console.log(GAME._farmMap) to keep a layout
          const lines = text.split("\n").filter((l) => l.trim().length);
          const cols = lines.reduce((m, l) => Math.max(m, l.length >> 1), 0);
          const unknown = new Set();
          for (let r = 0; r < lines.length; r++) {
            // two characters per cell, so step in pairs and index columns by c/2
            for (let c = 0; c + 1 < lines[r].length; c += 2) {
              const ch = lines[r].substr(c, 2);
              const ent = FARM_KEY.get(ch);
              if (!ent) {
                // anything unmapped is empty ground, but a pair that LOOKS like a code and isn't is reported rather than swallowed
                if (/^[A-Z][a-z]$/.test(ch)) unknown.add(ch);
                continue;
              }
              // Jitter, or the farm reads as a spreadsheet.
              const jx = (Math.random() - 0.5) * 2 * FARM_JITTER * FARM_UNIT;
              const jz = (Math.random() - 0.5) * 2 * FARM_JITTER * FARM_UNIT;
              const spawn = dryNear(
                ax + (c / 2 - (cols - 1) / 2) * FARM_UNIT + jx,
                az0 + (r - (lines.length - 1) / 2) * FARM_UNIT + jz,
                !SWIMMERS.has(ent.name),
              );
              // Rotation stays 0 through place(): it measures the footprint in world space assuming an axis-aligned spawn frame, so a heading set here would tilt the capsule.
              // Turn them after.
              const a = new ent.Cls({ x: spawn.x, z: spawn.z, rotation: 0 });
              a.group.rotation.y = Math.random() * Math.PI * 2;
              a._simPhase = this.animals.length; // spread LOD refreshes over frames
              this.animals.push(a);
              // In the scene for its TRANSFORMS, never for rendering.
              // Every part is a bare Object3D that draws nothing, but WebGLRenderer.projectObject still walks the whole scene graph every frame.
              // Keeping the animal roots out of the scene skips that walk; their matrices are updated by hand instead.
              a.group.visible = false;
              this.scene.add(a.group);
            }
          }
          if (unknown.size)
            console.warn(
              "FARM_MAP: unknown codes ignored:",
              [...unknown].join(" "),
            );
          // Mean ground speed of the herd, from BEHAVIOUR rather than guessed.
          // An animal covers its mean roam distance at its own speed, then stands still for its mean pause, so its long-run speed is the duty cycle of the two.
          let drift = 0;
          for (const a of this.animals) {
            const r = (a.beh.r[0] + a.beh.r[1]) / 2,
              p = (a.beh.p[0] + a.beh.p[1]) / 2;
            drift += r / (r / a.speed + p);
          }
          this._herdDrift = drift / Math.max(this.animals.length, 1) || 0.5;

          registry.build(this.scene);
        }

        // ====================================================================
        // NIGHT SKY  --  gradient + static moon + drifting cloud, one draw
        // ====================================================================
        // The moon is static and sits on the light's azimuth: a moving sun would drag the planar shadows with it.
        //
        // Clouds live inside this shader rather than on their own blended plane, since the sky pass already covers these pixels.
        // The gradient's low end is the FOG colour, so the horizon has no seam.
        //
        // BoxGeometry(1) drawn at the far plane by the gl_Position = p.xyww trick: infinitely distant for 12 triangles.
        // Moved to the camera and never rotated, which makes moon and stars world-fixed.
        _buildSky(scene, camera) {
          const sky = new THREE.Group();
          // matrixAutoUpdate stays on: _followSky moves this every frame.
          scene.add(sky);
          this._sky = sky;

          // AZIMUTH comes from the light, because azimuth sets the direction a shadow falls and that is the relationship the eye checks.
          // ELEVATION cannot: an orbit camera always looks down at its target, so the top of frame reaches ~8 degrees and the light's 49 would never be on screen.
          // Matching the light to it instead would take the planar reach from 0.87x height to the 6.6x the ly clamp allows, and the projection has no occlusion test to carry shadows that long.
          const MOON_ELEV = 0.14; // rad, ~8 degrees: just clear of the horizon
          const lightDir = new THREE.Vector3(10, 18, 12);
          const moonAz = Math.atan2(lightDir.x, lightDir.z);
          const md = new THREE.Vector3(
            Math.cos(MOON_ELEV) * Math.sin(moonAz),
            Math.sin(MOON_ELEV),
            Math.cos(MOON_ELEV) * Math.cos(moonAz),
          );

          const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            // Depth-tested and drawn last: gl_Position = p.xyww puts every sky fragment at exactly 1.0, so anything already drawn wins and the sky fills only what is left.
            // Drawn first with the test off, this shader ran on every pixel on screen and the ground then covered 56-100% of them; now those are rejected before it runs.
            depthTest: true,
            depthFunc: THREE.LessEqualDepth,
            fog: false, // it's at infinity -- fogging it would grey it out
            uniforms: {
              uLow: { value: FOG_DISPLAY }, // == fog colour AS DISPLAYED; see FOG_DISPLAY
              uHigh: { value: new THREE.Color(0x1b2740) },
              // Near-neutral silver, NOT blue: moonlight is white, so cloud lit by it is grey.
              // The sky is the blue thing here.
              uCloud: { value: new THREE.Color(0x5c636f) },
              uMoonDir: { value: md },
              uTime: { value: 0 },
            },
            vertexShader: `
              varying vec3 vDir;
              void main() {
                // local vertex, NOT world: at large camera offsets adding the translation collapses float32 and the moon dot-product dies
                vDir = position;
                vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                gl_Position = p.xyww;   // pin to the far plane
              }`,
            fragmentShader: `
              varying vec3 vDir;
              uniform vec3 uLow, uHigh, uCloud, uMoonDir;
              uniform float uTime;

              ${GLSL_HASH}
              ${GLSL_NOISE2}

              void main() {
                vec3 d = normalize(vDir);
                // Ramp from the HORIZON up, not from straight-down up.
                // With d.y*0.5+0.5 the gradient only reaches uLow when looking at the ground, so at the horizon the sky sat at the midpoint, about 10/255 lighter than the fog the ground fades to.
                // Now sky-at-horizon equals fog colour exactly, by construction rather than by matching two constants by hand.
                vec3 col = mix(uLow, uHigh, clamp(d.y * 2.2, 0.0, 1.0));

                // ---- cloud ------------------------------------------------
                // d.xz / d.y is the obvious projection and useless here: it blows up at the horizon (34x at 1 degree) so it needs a fade, and the orbit camera only shows the bottom 11 degrees of sky.
                // A constant in the divisor bounds it -- no singularity, no fade, still converging toward the horizon.
                {
                  // The visible sky is only ~2.3 noise units wide, so this crosses in about two minutes.
                  vec2 cp = d.xz / (d.y + 0.30) * 0.85
                          + vec2(uTime * 0.020, uTime * 0.012);
                  float c = inoise(cp) * 0.62 + inoise(cp * 2.3 + 11.0) * 0.38;
                  // a light touch on the horizon itself, so cloud doesn't run into the fogged ground
                  float cover = smoothstep(0.44, 0.72, c)
                              * smoothstep(0.0, 0.05, d.y);
                  // moonlight silvers the cloud it passes behind
                  float lit = pow(max(dot(d, uMoonDir), 0.0), 6.0);
                  col = mix(col, uCloud * (1.0 + lit * 1.4), cover * 0.72);
                }

                // ---- moon -------------------------------------------------
                float ang = acos(clamp(dot(d, uMoonDir), -1.0, 1.0));
                const float R = 0.043;   // angular radius of the disc
                const float HALO = 0.062;
                if (ang < HALO) {
                  vec3 tint = vec3(0.92, 0.95, 1.0);
                  float halo = 1.0 - smoothstep(R, HALO, ang);
                  col += tint * halo * halo * 0.05;
                  if (ang < R) {
                    // stable disc-local frame so the maria don't crawl
                    vec3 up = abs(uMoonDir.y) < 0.99
                      ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
                    vec3 rt = normalize(cross(up, uMoonDir));
                    vec3 fw = cross(uMoonDir, rt);
                    vec2 uv = vec2(dot(d, rt), dot(d, fw)) / R;
                    float r = length(uv);
                    float n = inoise(uv * 3.4 + vec2(4.0, 1.5)) * 0.6
                            + inoise(uv * 7.2 + vec2(9.0, 6.0)) * 0.4;
                    float surf = 0.93 + (n - 0.5) * 0.18;      // gentle mottle
                    float limb = smoothstep(1.0, 0.55, r);     // limb darkening
                    // soft rim: no discard, so the edge melts into the halo
                    col = mix(col, tint * surf * (0.82 + 0.18 * limb),
                              1.0 - smoothstep(0.92, 1.0, r));
                  }
                }
                gl_FragColor = vec4(col, 1.0);
              }`,
          });
          const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), skyMat);
          box.frustumCulled = false;
          box.renderOrder = 20; // last opaque, after the ground at 10
          sky.add(box);
          this._skyMat = skyMat;

          // ---- stars ------------------------------------------------------
          // Stars stay in the transparent queue, which three draws after all opaque, so they are still depth-tested against the ground and the sky box below them.
          // Carried a little BELOW y=0: the ground runs out at the far clip, ~-3.6 degrees from eye height, so stopping at the horizontal left a starless band.
          // Safe here where a mirrored sphere would not be, since the floor is one solid infinite plane and these only show in the gap.
          const N = 1400,
            Y_MIN = -0.2;
          const pos = new Float32Array(N * 3),
            col = new Float32Array(N * 3),
            siz = new Float32Array(N),
            pha = new Float32Array(N),
            frq = new Float32Array(N);
          for (let i = 0; i < N; i++) {
            const th = 2 * Math.PI * Math.random();
            // uniform in y == uniform per unit solid angle, so density stays even instead of bunching at the zenith
            const y = Y_MIN + Math.random() * (1 - Y_MIN);
            const ring = Math.sqrt(Math.max(0, 1 - y * y));
            pos[i * 3] = ring * Math.cos(th);
            pos[i * 3 + 1] = y;
            pos[i * 3 + 2] = ring * Math.sin(th);
            const r = Math.random();
            const c =
              r < 0.15
                ? [0.8, 0.86, 1.0] // bluish
                : r < 0.3
                  ? [1.0, 0.95, 0.8] // yellowish
                  : [1.0, 1.0, 1.0];
            col.set(c, i * 3);
            // long tail: mostly faint, a few bright ones to anchor the eye
            const s = Math.random();
            siz[i] =
              s < 0.01
                ? 26 + Math.random() * 12
                : s < 0.06
                  ? 15 + Math.random() * 8
                  : s < 0.25
                    ? 8 + Math.random() * 5
                    : 3 + Math.random() * 3;
            pha[i] = Math.random() * Math.PI * 2;
            frq[i] = 1.0 + Math.random() * 2.0;
          }
          const sg = new THREE.BufferGeometry();
          sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          sg.setAttribute("color", new THREE.BufferAttribute(col, 3));
          sg.setAttribute("size", new THREE.BufferAttribute(siz, 1));
          sg.setAttribute("phase", new THREE.BufferAttribute(pha, 1));
          sg.setAttribute("freq", new THREE.BufferAttribute(frq, 1));
          const starMat = new THREE.ShaderMaterial({
            // The moon's direction, because stars have to get out of its way.
            // The sky box sits at depth exactly 1.0 and the stars at 0.999999, so stars pass the depth test against it and paint over the moon.
            // Fading them near the moon is also what a bright source does to the sky around it.
            // Cheaper and more correct than reordering anyway: near a bright source the sky itself is washed out, so a star that close would not be visible regardless of what is drawing it.
            uniforms: { uTime: { value: 0 }, uMoonDir: { value: md } },
            transparent: true,
            depthWrite: false,
            depthTest: true, // so the ground hides the ones below the horizon
            fog: false,
            blending: THREE.AdditiveBlending,
            vertexShader: `
              attribute float size;
              attribute vec3 color;
              attribute float phase;
              attribute float freq;
              varying vec3 vCol;
              varying float vGlare;
              uniform float uTime;
              uniform vec3 uMoonDir;
              void main() {
                vCol = color;
                // Gone inside the disc, fading back in across roughly three disc radii of halo.
                float ang = acos(clamp(dot(normalize(position), uMoonDir), -1.0, 1.0));
                vGlare = smoothstep(0.048, 0.15, ang);
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_PointSize = size * (sin(uTime * freq + phase) * 0.22 + 0.78);
                vec4 p = projectionMatrix * mv;
                // sit just inside the far plane, so distance is irrelevant but any real geometry still occludes them
                p.z = p.w * 0.999999;
                gl_Position = p;
              }`,
            fragmentShader: `
              varying vec3 vCol;
              varying float vGlare;
              void main() {
                float d = length(gl_PointCoord - vec2(0.5)) * 2.0;
                float core = (1.0 - smoothstep(0.0, 0.22, d)) * 0.85;
                float glow = (1.0 - smoothstep(0.22, 0.5, d)) * 0.12;
                gl_FragColor = vec4(mix(vec3(1.0), vCol, 0.8) * 0.62,
                                    (core + glow) * vGlare);
              }`,
          });
          const stars = new THREE.Points(sg, starMat);
          stars.frustumCulled = false;
          stars.renderOrder = -1;
          stars.scale.setScalar(400); // inside the box; depth is forced anyway
          sky.add(stars);
          this._starMat = starMat;
        }

        // Sky rides with the camera so it stays infinitely distant, but is NEVER rotated -- that's what keeps the moon and stars world-fixed.
        // Wrapped clock for shaders.
        // See SHADER_TIME_WRAP.
        shaderTime() {
          return this.simTime % SHADER_TIME_WRAP;
        }

        _followSky(t) {
          const s = this._sky;
          if (!s) return;
          s.position.copy(this.camera.position);
          s.updateMatrixWorld(true); // scene.matrixWorldAutoUpdate is off
          this._skyMat.uniforms.uTime.value = t;
          this._starMat.uniforms.uTime.value = t;
        }

        // ====================================================================
        // MOTHS  --  stateless, world-locked, one draw call
        // ====================================================================
        // Moths rather than butterflies because it is night.
        //
        // Deliberately NOT billboarded.
        // A moth reads as a moth because of the FLICKER: the wings alternate between face-on and edge-on as they beat.
        // A camera-facing quad can never turn its wings away from you, so it kills the one cue that matters and leaves a drifting blob.
        // Two hinged quads cost 4 triangles and get the flicker out of the geometry for nothing.
        //
        // Nothing is simulated on the CPU.
        // A moth's whole trajectory is a pure function of (world cell, time), evaluated in the vertex shader:
        //   * no per-frame JS, no matrix uploads, no allocation, no state to desync
        //   * ONE draw call for the lot
        //   * world-locked by construction, so the flight path at a given cell is the same every time you visit and cannot smear when you turn around
        //
        // Infinite coverage comes from tiling: each vertex belongs to a slot in a GxG grid of cells around the camera, and its identity is hashed from the CELL, not from the slot.
        // Walk east and a slot inherits a new cell and becomes a different moth, but the moth living at any given cell never changes.
        // Same trick as the ground.
        _buildMoths(scene) {
          const CELL = 14.0, // world units per cell
            // A moth is about 0.6u across, so by 90u it is ten pixels at under 40% alpha and there is nothing left to resolve.
            // Sized to that rather than to the fog: covering the full 178u at this cell size would need 6912 moths for members nobody can see.
            // CELL is what sets local density, so it stays put and only the extent grows.
            MOTH_RANGE = 90.0,
            GRID = swarmGrid(MOTH_RANGE, CELL),
            N = GRID * GRID; // slots
          const pos = [],
            idx = [],
            id = [],
            wing = [],
            edge = [];

          // Four wings, not two: a pair of quads hinged on one axis is geometrically a book, and looks like one.
          // Fore and hind wings per side, out of plane, with the hind pair lagging through the beat.
          // aWing: 0 body (never flaps), 1 forewing, 2 hindwing (lags) aEdge: 0 at hinge, 1 at margin -- drives flex, pale margin, alpha
          // Wing outlines start AND end on the hinge axis (z = 0), so the root is a chord lying inside the body rather than a point out at its edge.
          // Vertices at z = 0 are invariant under the flap's rotation, so the wing cannot lift away from the thorax.
          const FORE = [
            [0.06, 0.0], // root, front
            [0.05, 0.09],
            [0.0, 0.17],
            [-0.06, 0.21], // tip
            [-0.13, 0.19],
            [-0.17, 0.1],
            [-0.14, 0.0], // root, back
          ];
          const HIND = [
            [-0.11, 0.0], // root, front
            [-0.11, 0.08],
            [-0.16, 0.13],
            [-0.22, 0.11],
            [-0.24, 0.04],
            [-0.22, 0.0], // root, back
          ];
          // aEdge runs 0 at the hinge to 1 at the outer margin, taken straight from the point's own span so it can't disagree with the geometry.
          const fan = (pts, w, s, base) => {
            let mx = 0;
            for (const q of pts) mx = Math.max(mx, q[1]);
            for (const q of pts) {
              pos.push(q[0], 0, s * q[1]);
              wing.push(w);
              edge.push(q[1] / mx);
            }
            for (let k = 1; k < pts.length - 1; k++)
              idx.push(base, base + k, base + k + 1);
            return base + pts.length;
          };

          for (let i = 0; i < N; i++) {
            let v = pos.length / 3;
            for (const s of [1, -1]) {
              v = fan(FORE, 1, s, v);
              v = fan(HIND, 2, s, v);
            }
            // Body: two crossed profiles, fanned.
            // Crossed planes give thickness from any angle, but as RECTANGLES they read as a bar, so this is pointed at the head, widest at the thorax, tapering down the abdomen.
            const BODY = [
              [-0.2, 0.0], // abdomen tip -- fan origin
              [-0.1, 0.015],
              [0.0, 0.028], // thorax, widest
              [0.08, 0.0], // head
              [0.0, -0.028],
              [-0.1, -0.015],
            ];
            for (const [ax, ay] of [
              [0, 1],
              [1, 0],
            ]) {
              const b = pos.length / 3;
              for (const [x, w] of BODY) {
                pos.push(x, ay * w, ax * w);
                wing.push(0);
                edge.push(0);
              }
              for (let k = 1; k < BODY.length - 1; k++)
                idx.push(b, b + k, b + k + 1);
            }
            // NB: while, not a for with `id.length` in the condition -- the bound moves as you push, which under-fills every moth.
            const want = pos.length / 3;
            while (id.length < want) id.push(i);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setAttribute("aId", new THREE.Float32BufferAttribute(id, 1));
          g.setAttribute("aWing", new THREE.Float32BufferAttribute(wing, 1));
          g.setAttribute("aEdge", new THREE.Float32BufferAttribute(edge, 1));
          g.setIndex(idx);

          const mat = new THREE.ShaderMaterial({
            side: THREE.DoubleSide,
            // Translucent wings are free at this size: ~1000 tiny triangles, no sorting, and inter-moth order never reads.
            // depthWrite off so wings blend; depthTest on so the world still occludes them.
            transparent: true,
            depthWrite: false,
            fog: false, // faded by hand below, on the same curve as scene fog
            uniforms: {
              uTime: { value: 0 },
              uCell: { value: new THREE.Vector2() }, // anchor cell, integers
              uAnchor: { value: new THREE.Vector2() }, // anchor, world units
              uFogCol: { value: FOG_DISPLAY }, // raw shader: the displayed value, see FOG_DISPLAY
              uFogDensity: { value: scene.fog ? scene.fog.density : 0 },
            },
            vertexShader: `
              attribute float aId;
              attribute float aWing;   // 0 body, 1 forewing, 2 hindwing
              attribute float aEdge;   // 0 at the hinge, 1 at the outer margin
              uniform float uTime;
              uniform vec2 uCell;
              uniform vec2 uAnchor;
              uniform float uFogDensity;   // must be declared, not just supplied
              ${fogGLSL}
              varying vec3 vCol;
              varying float vFog;
              varying float vAlpha;

              ${GLSL_HASH}

              void main() {
                const float GRID = ${GRID}.0;
                const float CELL = ${CELL.toFixed(1)};   // .0 or GLSL sees an int

                // slot -> world cell, centred on the orbit target
                vec2 slot = vec2(mod(aId, GRID), floor(aId / GRID));
                vec2 cell = uCell + slot - GRID * 0.5;

                float h1 = ihash(cell);
                float h2 = ihash(cell + vec2(37.0, 11.0));
                float h3 = ihash(cell + vec2(0.0, 91.0));
                float h4 = ihash(cell + vec2(53.0, 7.0));

                // ~45% of cells are empty, so they don't read as a lattice
                if (h4 < 0.45) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }

                vec2 home = (cell + vec2(h1, h2)) * CELL;
                float sp = 0.6 + h1 * 0.9;           // this one's tempo
                float ph = h2 * 6.2831;

                // Wander: incommensurate sines per axis, so the path never repeats in step and meanders instead of orbiting.
                // Moths get a third, faster term: their flight is jinkier than a butterfly's, and that nervousness is half the read.
                float t = uTime;
                vec3 p;
                p.x = home.x + sin(t * 0.31 * sp + ph) * 3.6
                             + sin(t * 0.73 * sp + ph * 2.1) * 1.3
                             + sin(t * 2.10 * sp + ph * 3.7) * 0.34;
                p.z = home.y + cos(t * 0.27 * sp + ph * 1.7) * 3.6
                             + cos(t * 0.61 * sp + ph * 0.7) * 1.2
                             + cos(t * 1.90 * sp + ph * 2.3) * 0.31;
                // never lands: the bob is offset well clear of zero
                p.y = 0.8 + h3 * 1.6
                    + sin(t * 2.3 * sp + ph) * 0.34
                    + sin(t * 4.1 * sp + ph * 1.3) * 0.13;

                // Heading from the ANALYTIC derivative of the path above -- differentiating a sum of sines is free, and it means the moth always points where it is actually going.
                float vx = cos(t * 0.31 * sp + ph) * 0.31 * sp * 3.6
                         + cos(t * 0.73 * sp + ph * 2.1) * 0.73 * sp * 1.3
                         + cos(t * 2.10 * sp + ph * 3.7) * 2.10 * sp * 0.34;
                float vz = -sin(t * 0.27 * sp + ph * 1.7) * 0.27 * sp * 3.6
                         - sin(t * 0.61 * sp + ph * 0.7) * 0.61 * sp * 1.2
                         - sin(t * 1.90 * sp + ph * 2.3) * 1.90 * sp * 0.31;
                float yaw = atan(vx, vz);

                // Wing beat.
                // Real moths run 20-70 Hz and NONE of that can be shown at 60 fps: few samples per beat read as several wings at once, like an old flip-book.
                // About 12 frames per cycle is the floor for smooth motion, which caps the beat at 5 Hz.
                // A readable 4 Hz beats an accurate 10 Hz that looks broken.
                float bf = 22.0 + h1 * 9.0;   // 3.5 - 4.9 Hz, 12-17 frames/cycle
                float beat = sin(t * bf + ph * 3.0);
                vec3 lp = position;
                if (aWing > 0.5) {
                  // Hind pair lags the fore pair, so the four wings never form one flat sheet -- that phase offset is most of what stops it reading as a book closing.
                  float lag = aWing > 1.5 ? 0.6 : 0.0;
                  float b2 = sin(t * bf + ph * 3.0 - lag);
                  // Dihedral: they sit in a shallow V even mid-stroke, and the tip swings further than the root so the wing FLEXES.
                  // Flex is deliberately gentle -- a tip swinging more than twice the root fans a single wing into what looks like separate leaves.
                  // 0.62 peaks near 46 degrees; at 0.95 the wings fold to 65 and read as vertical shards rather than as a beat.
                  float a = (0.14 + b2 * 0.62) * (0.78 + 0.22 * aEdge);
                  lp.y = abs(lp.z) * sin(a);
                  lp.z = lp.z * cos(a);
                }
                float pitch = -beat * 0.15;          // tips into the climb
                lp = vec3(lp.x * cos(pitch) - lp.y * sin(pitch),
                          lp.x * sin(pitch) + lp.y * cos(pitch), lp.z);
                vec3 wp = vec3(lp.x * cos(yaw) + lp.z * sin(yaw), lp.y,
                              -lp.x * sin(yaw) + lp.z * cos(yaw)) + p;

                vec4 mv = modelViewMatrix * vec4(wp, 1.0);
                gl_Position = projectionMatrix * mv;

                // Colour is sampled CONTINUOUSLY rather than picked from a few swatches: three hashes drive warmth, lightness and a faint green cast independently.
                // No two moths match while everything stays in the dusty, desaturated register a moth lives in.
                float c1 = ihash(cell + vec2(7.0, 3.0));
                float c2 = ihash(cell + vec2(3.0, 29.0));
                float c3 = ihash(cell + vec2(61.0, 17.0));
                vec3 warm = vec3(0.74, 0.60, 0.42);   // umber
                vec3 cool = vec3(0.74, 0.76, 0.78);   // ash
                vec3 base = mix(warm, cool, c1);
                base *= 0.62 + c2 * 0.5;                        // value spread
                base = mix(base, base * vec3(0.92, 1.02, 0.9), c3 * 0.6); // cast
                // hindwings run paler than forewings, and the outer margin is paler still -- both are real moth markings and both help the four wings separate visually instead of merging into a sheet
                if (aWing > 1.5) base *= 1.12;
                base = mix(base, base * 1.3, aEdge * 0.55);
                vCol = base * (0.55 + beat * beat * 0.45); // flash as they turn
                // thin membrane toward the margin; the body stays solid
                vAlpha = aWing < 0.5 ? 1.0 : mix(0.95, 0.55, aEdge);
                // Dissolve before the grid boundary.
                // When the anchor crosses a cell line the outermost ring is reassigned, and at 56u fog has only taken 36%, so that swap would be visible as a pop.
                // Fading the outer quarter of the radius means the swap always happens at zero alpha.
                vAlpha *= 1.0 - smoothstep(0.72, 1.0,
                  length(p.xz - uAnchor) / (GRID * CELL * 0.5));
                float d = farmFogDepth(wp, cameraPosition);
                vFog = farmFog(d, uFogDensity); // fog consumers 4 and 5
              }`,
            fragmentShader: `
              varying vec3 vCol;
              varying float vFog;
              varying float vAlpha;
              uniform vec3 uFogCol;
              void main() {
                // fade the ALPHA out with fog too, so a distant moth dissolves rather than turning into a fog-coloured chip
                gl_FragColor = vec4(mix(vCol, uFogCol, vFog),
                                    vAlpha * (1.0 - vFog));
              }`,
          });
          const m = new THREE.Mesh(g, mat);
          m.frustumCulled = false; // the shader relocates every vertex
          // AFTER the shade pass (2).
          // Shadows are laid by a flat quad over every pixel the ground claimed, and the ground claims pixels in the opaque queue -- before any transparent thing has been drawn in front of them.
          // So a moth drawn ahead of the shade got the shadow of whatever lay on the grass behind it painted across it.
          // Drawn after, the ground is already darkened and the moth simply goes on top.
          m.renderOrder = 3;
          scene.add(m);
          this._mothMat = mat;
          this._mothCell = CELL;
        }

        // One uniform per frame: the anchor cell.
        // That is the swarm's entire per-frame cost.
        // Anchored on the ORBIT TARGET, not the camera: orbiting swings the camera up to 120u while you look at the same place, which would reassign every cell and blink the swarm out mid-turn.
        _followMoths(t) {
          if (!this._mothMat) return;
          const u = this._mothMat.uniforms;
          const c = this.anchor;
          u.uTime.value = t;
          u.uAnchor.value.set(c.x, c.z);
          u.uCell.value.set(
            Math.floor(c.x / this._mothCell),
            Math.floor(c.z / this._mothCell),
          );
        }

        // ====================================================================
        // NIGHT BIRDS  --  soaring flocks, stateless, one draw call
        // ====================================================================
        // Same architecture as the moths: a bird's entire state is a pure function of (world cell, index, time), evaluated in the vertex shader.
        // What differs is everything above that:
        //
        //  * They CIRCLE rather than wander. Each occupied cell holds a thermal and a flock of four rides it at different radii, phases and heights.
        //    A shared centre is what makes them read as a flock instead of four unrelated birds, and it costs nothing since the centre is just the cell.
        //
        //  * TWO-SEGMENT WINGS: an inner panel and an outer panel with its own phase.
        //    The outer lagging the inner is what crooks the wing through the stroke; a single rigid panel is a paper dart.
        //
        //  * FLAP AND GLIDE. A slow envelope gates the beat into bursts with long glides between, which is most of what makes a soaring bird read as alive.
        //
        //  * No strobe risk. Big birds beat at 2-4 Hz, or 15-30 frames per cycle, so unlike the moths there is no aliasing to dodge.
        //
        // Tone is deliberately mid-grey (~0.4).
        // The sky here runs 0.08-0.15 and the moon 0.93, so a mid tone is the one value that reads as a pale shape against open sky AND as a dark silhouette when it crosses the moon.
        _buildBirds(scene) {
          const PER = 4, // birds per thermal
            // 45, not 70.
            // At 70 the nearest thermal was usually 1-2 cells out, where fog has eaten 76-96% of them.
            // Pulling the grid in also lets the altitude come down, which matters because the two constraints fight: near enough to punch through fog put them above the top of frame.
            CELL = 45.0,
            // Birds are large and sit against open sky, so they stay legible right out to the fog, and the grid has to cover that or you see where they stop.
            GRID = swarmGrid(FOG_OPAQUE, CELL),
            N = GRID * GRID * PER;
          const pos = [],
            idx = [],
            id = [],
            seg = [],
            span = [];
          const push = (p, w, sp) => {
            pos.push(p[0], p[1], p[2]);
            seg.push(w);
            span.push(sp);
          };
          // Proportions after mrdoob's canvas_geometry_birds: the wing is a swept DELTA, a long root chord tapering to a point, which reads as a bird where rectangular panels read as a plank.
          // Split spanwise into two panels so the outer can lag and the wing crooks through the stroke, for one extra triangle per wing.
          const BODY = [
            [0.62, 0, 0], // nose
            [0.1, 0, 0.06],
            [-0.45, 0, 0.045],
            [-0.72, 0, 0], // tail
            [-0.45, 0, -0.045],
            [0.1, 0, -0.06],
          ];
          for (let i = 0; i < N; i++) {
            let base = pos.length / 3;
            for (const p of BODY) push(p, 0, 0);
            for (let k = 1; k < BODY.length - 1; k++)
              idx.push(base, base + k, base + k + 1);
            for (const s of [1, -1]) {
              // Inner panel.
              // The root chord sits ON the hinge axis (z = 0), not out at the body's edge.
              // The flap rotates about that axis, so a vertex at z = 0 is invariant and the root cannot separate from the body however hard the wing beats.
              // The chord is buried inside the body outline, so it never shows.
              let b = pos.length / 3;
              push([0.25, 0, 0], 1, 0.0); // shoulder front, on the axis
              push([0.12, 0, s * 0.42], 1, 0.5);
              push([-0.26, 0, s * 0.42], 1, 0.5);
              push([-0.38, 0, 0], 1, 0.0); // shoulder back, on the axis
              idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
              // outer panel: closes to a single point at the tip -- one triangle, and the taper is what makes it a wing
              b = pos.length / 3;
              push([0.12, 0, s * 0.42], 2, 0.5);
              push([-0.02, 0, s * 0.92], 2, 1.0); // tip
              push([-0.26, 0, s * 0.42], 2, 0.5);
              idx.push(b, b + 1, b + 2);
            }
            const want = pos.length / 3;
            while (id.length < want) id.push(i);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setAttribute("aId", new THREE.Float32BufferAttribute(id, 1));
          g.setAttribute("aSeg", new THREE.Float32BufferAttribute(seg, 1));
          g.setAttribute("aSpan", new THREE.Float32BufferAttribute(span, 1));
          g.setIndex(idx);

          const md = new THREE.Vector3(10, 18, 12).normalize();
          const mat = new THREE.ShaderMaterial({
            side: THREE.DoubleSide,
            transparent: true,
            depthWrite: false,
            fog: false,
            uniforms: {
              uTime: { value: 0 },
              uCell: { value: new THREE.Vector2() },
              uAnchor: { value: new THREE.Vector2() },
              uMoonDir: { value: md },
              uFogCol: { value: FOG_DISPLAY }, // raw shader: the displayed value, see FOG_DISPLAY
              uFogDensity: { value: scene.fog ? scene.fog.density : 0 },
            },
            vertexShader: `
              attribute float aId;
              attribute float aSeg;    // 0 body, 1 inner wing, 2 outer wing
              attribute float aSpan;   // 0 at the shoulder, 1 at the tip
              uniform float uTime;
              uniform vec2 uCell;
              uniform vec2 uAnchor;
              uniform vec3 uMoonDir;
              uniform float uFogDensity;
              ${fogGLSL}
              varying vec3 vCol;
              varying float vFog;
              varying float vAlpha;

              ${GLSL_HASH}

              void main() {
                const float GRID = ${GRID}.0;
                const float PER  = ${PER}.0;
                const float CELL = ${CELL.toFixed(1)};

                float flock = floor(aId / PER);
                float mem = mod(aId, PER);          // which bird in the flock
                vec2 slot = vec2(mod(flock, GRID), floor(flock / GRID));
                vec2 cell = uCell + slot - GRID * 0.5;

                float h1 = ihash(cell);
                float h2 = ihash(cell + vec2(19.0, 5.0));
                float h3 = ihash(cell + vec2(0.0, 71.0));
                float h4 = ihash(cell + vec2(43.0, 23.0));
                // most cells hold no thermal, so the sky isn't wallpapered
                if (h4 < 0.52) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }

                vec2 centre = (cell + vec2(h1, h2)) * CELL;
                float t = uTime;

                // --- the soaring path -------------------------------------
                // Not a circle: an ELLIPSE with per-thermal aspect and rotation, on a DRIFTING centre, so the path never closes.
                // Both stay closed-form, so the heading is still the analytic derivative.
                // The drift is a bounded oscillation rather than a velocity, or a bird would wander out of its own cell and break the tiling.
                float mj = ihash(cell + vec2(mem * 7.0 + 3.0, mem * 11.0 + 1.0));
                float h5 = ihash(cell + vec2(5.0, 13.0));
                float h6 = ihash(cell + vec2(29.0, 3.0));
                // A third of flocks TRANSIT instead of circling: a long, barely-curving line, which is most night flight.
                // No new code path -- a transit is just a very large, very slow circle, so the bank angle falls out correctly at 1 degree instead of 7.
                float transit = ihash(cell + vec2(67.0, 31.0)) < 0.34 ? 1.0 : 0.0;
                float rad = mix(9.0 + h3 * 11.0 + mj * 5.0,
                                90.0 + h3 * 70.0 + mj * 20.0, transit);
                float per = mix(22.0 + h1 * 16.0,
                                150.0 + h1 * 120.0 + mj * 30.0, transit);
                float w = 6.2831 / per;
                float dir = h2 < 0.5 ? -1.0 : 1.0;   // some thermals turn the other way
                float ang = w * t * dir + mj * 6.2831;
                float wd = w * dir;

                float eb = 0.5 + h5 * 0.5;           // ellipse aspect
                float rot = h6 * 6.2831;             // ellipse orientation
                float cr = cos(rot), sr = sin(rot);

                // drift amplitude -- kept small for transits, whose line should waver, not meander
                float dA = mix(5.0 + h1 * 7.0, 2.0 + h1 * 2.0, transit);
                float dp = t * 0.037 + h2 * 6.0, dq = t * 0.029 + h3 * 6.0;
                float ox = dA * sin(dp), oz = dA * cos(dq);
                float dox = dA * 0.037 * cos(dp), doz = -dA * 0.029 * sin(dq);

                float lx = rad * cos(ang), lz = rad * eb * sin(ang);
                float dlx = -rad * sin(ang) * wd, dlz = rad * eb * cos(ang) * wd;

                // Low enough to sit under the top of frame at close range; transiting birds ride higher and hold height more steadily.
                float alt = 13.5 + h3 * 6.0 + mj * 2.5 + transit * 4.0
                          + sin(t * 0.21 + mj * 6.0) * (1.4 - transit * 0.9);

                vec3 p = vec3(centre.x + ox + (lx * cr - lz * sr), alt,
                              centre.y + oz + (lx * sr + lz * cr));

                // Heading is the analytic derivative.
                // The nose maps to (cos(yaw), -sin(yaw)), so this must be atan2(-vz, vx); getting it wrong is a clean 90 degrees of sideways flight.
                float vx = dox + (dlx * cr - dlz * sr);
                float vz = doz + (dlx * sr + dlz * cr);
                float yaw = atan(-vz, vx);

                // --- flap, gated into bursts ------------------------------
                float bf = 15.0 + mj * 6.0;          // 2.4 - 3.3 Hz, ~20 frames/cycle
                float phase = mj * 6.2831 + h1 * 3.0;
                // long glides between short bursts of beating
                float env = smoothstep(0.15, 0.55,
                              sin(t * 0.16 + mj * 5.0 + h3 * 4.0) * 0.5 + 0.5);
                float s1 = sin(t * bf + phase);
                float s2 = sin(t * bf + phase - 0.7);   // outer panel lags
                float a = env * (0.85 * s1 * (0.45 + 0.55 * aSpan)
                               + 0.55 * s2 * smoothstep(0.4, 1.0, aSpan));
                // Shallow dihedral even when gliding.
                // The constant term also keeps the wing off the body's own plane at mid-stroke, where the two would otherwise be exactly coplanar and z-fight across the overlap at the root.
                a += 0.05 + 0.12 * aSpan;

                vec3 lp = position;
                if (aSeg > 0.5) {
                  lp.y = abs(lp.z) * sin(a);
                  lp.z = lp.z * cos(a);
                }
                // Bank INTO the turn (inner wing low): tighter circle, steeper roll.
                // Sign matters -- +dir drops the wing that points at the thermal's centre, while -dir banks outward and reads as a bird being flung off the circle.
                float roll = dir * clamp(2.6 / rad, 0.0, 0.45);
                lp = vec3(lp.x,
                          lp.y * cos(roll) - lp.z * sin(roll),
                          lp.y * sin(roll) + lp.z * cos(roll));
                vec3 wp = vec3(lp.x * cos(yaw) + lp.z * sin(yaw), lp.y,
                              -lp.x * sin(yaw) + lp.z * cos(yaw)) + p;

                vec4 mv = modelViewMatrix * vec4(wp, 1.0);
                gl_Position = projectionMatrix * mv;

                // --- moonlight --------------------------------------------
                // Approximate wing normal, carried through the same flap, roll and yaw.
                // It gives the flash as they bank through the stroke, the single most bird-like cue at this distance.
                vec3 nl = vec3(0.0, cos(a), -sign(lp.z + 1e-6) * sin(a));
                nl = vec3(nl.x, nl.y * cos(roll) - nl.z * sin(roll),
                                nl.y * sin(roll) + nl.z * cos(roll));
                vec3 nw = vec3(nl.x * cos(yaw) + nl.z * sin(yaw), nl.y,
                              -nl.x * sin(yaw) + nl.z * cos(yaw));
                float lit = max(dot(normalize(nw), uMoonDir), 0.0);

                // DARK, with a flash.
                // From the ground you see a bird's UNDERSIDE, which faces away from the moon, so the resting tone sits just under the sky it crosses (the horizon band is #11141a, ~0.07) and reads as a silhouette -- against cloud and moon glow a firm one, against clear sky barely there, which is what a bird at night is.
                // The moonlight term is kept, and steepened: flat, lit is ~0.14 (the moon is 8 degrees up), banking into it lit runs to 1, and that brief pale flash through the stroke stays the most bird-like cue at this distance.
                // These are written raw, like the sky, so they are display values: 0.3-0.5 before showed as a light paper grey.
                vec3 base = mix(vec3(0.030, 0.032, 0.038), vec3(0.046, 0.044, 0.042), h1);
                vCol = base * (0.70 + lit * 2.4);
                vAlpha = aSeg > 1.5 ? 0.85 : 0.94;   // wingtips a touch thinner
                // dissolve before the grid boundary, so a reassigned flock is already at zero alpha when it swaps (see the moths)
                vAlpha *= 1.0 - smoothstep(0.72, 1.0,
                  length(p.xz - uAnchor) / (GRID * CELL * 0.5));
                float d = farmFogDepth(wp, cameraPosition);
                vFog = farmFog(d, uFogDensity); // fog consumers 4 and 5
              }`,
            fragmentShader: `
              varying vec3 vCol;
              varying float vFog;
              varying float vAlpha;
              uniform vec3 uFogCol;
              void main() {
                gl_FragColor = vec4(mix(vCol, uFogCol, vFog),
                                    vAlpha * (1.0 - vFog));
              }`,
          });
          const m = new THREE.Mesh(g, mat);
          m.frustumCulled = false;
          // After the shade pass, for the same reason as the moths: a bird crossing in front of a shadow was having the shadow drawn over it.
          m.renderOrder = 3;
          scene.add(m);
          this._birdMat = mat;
          this._birdCell = CELL;
        }

        // Anchored on the ORBIT TARGET, not the camera (see _followMoths).
        _followBirds(t) {
          if (!this._birdMat) return;
          const u = this._birdMat.uniforms;
          const c = this.anchor;
          u.uTime.value = t;
          u.uAnchor.value.set(c.x, c.z);
          u.uCell.value.set(
            Math.floor(c.x / this._birdCell),
            Math.floor(c.z / this._birdCell),
          );
        }

        _buildGround() {
          // Ground is the sole shadow receiver; it stamps stencil bit0 where visible.
          // Drawn after animals (renderOrder 10) so hidden ground doesn't claim bit0 (keeps shadows off feet/bodies).
          const groundMask = (m) => {
            m.stencilWrite = true;
            m.stencilFunc = THREE.AlwaysStencilFunc;
            m.stencilRef = 1;
            m.stencilWriteMask = 1; // bit0 = "this pixel is ground"
            m.stencilZPass = THREE.ReplaceStencilOp;
            m.stencilZFail = THREE.KeepStencilOp; // behind an animal: don't claim
            m.stencilFail = THREE.KeepStencilOp;
          };

          // The floor and the shade quad both recentre on the camera each frame.
          // The span only has to beat the far plane (230) so the ground never runs out; 560 clears it with margin and stays two triangles.
          // Making it larger costs nothing and saves nothing -- rasterisation is clipped to the viewport, so fragment count is set by how much SCREEN the ground covers, never by how big the quad is.
          // They are flat and untextured, so sliding them is invisible and no snapping is needed.
          const SPAN = 560;
          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(SPAN, SPAN),
            new THREE.MeshStandardMaterial({
              color: 0x1a212b,
              roughness: 0.95,
            }),
          );
          // Grass, dirt and gravel from WORLD position, so the pattern is nailed to the ground and survives turning around.
          // Pure arithmetic on two triangles: no texture, no lookup, no repeat.
          //
          // Two anti-aliasing measures, both degrading gradually rather than switching at a distance: octaves fade out once their period nears a pixel, and the band edges widen with the footprint.
          floor.material.onBeforeCompile = (sh) => {
            sh.vertexShader = patch(sh.vertexShader, "ground vs")
              .replace(
                "#include <common>",
                "#include <common>\nvarying highp vec3 vWPos;",
              )
              .replace(
                "#include <begin_vertex>",
                "#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;",
              ).src;
            sh.fragmentShader = patch(sh.fragmentShader, "ground fs")
              .replace(
                "#include <common>",
                `#include <common>
                varying highp vec3 vWPos;
                uniform float uTime;
                uniform vec3 uSkyCol;

                // palette: kept dark and desaturated so it sits in the same register as the rest of the scene rather than turning the farm into a golf course.
                const vec3 GRASS_A = vec3(0.102, 0.149, 0.125);
                const vec3 GRASS_B = vec3(0.153, 0.212, 0.169);
                const vec3 DIRT_A  = vec3(0.165, 0.137, 0.114);
                const vec3 DIRT_B  = vec3(0.220, 0.184, 0.149);
                const vec3 GRAV_A  = vec3(0.153, 0.176, 0.208);
                const vec3 GRAV_B  = vec3(0.239, 0.267, 0.306);
                const vec3 WATER_SHALLOW = vec3(0.086, 0.145, 0.157);
                const vec3 WATER_DEEP    = vec3(0.035, 0.070, 0.094);
                // These four come from the TERRAIN table in JS, interpolated in so the shader and the sim cannot disagree about the world.
                // 0.72 puts ~8.7% under water with ~28 unit basins -- something you come across; 0.60 gave 28% cover, an archipelago.
                const float WARP_F    = ${TERRAIN.WARP_F.toFixed(6)};
                const float WARP_A    = ${TERRAIN.WARP_A.toFixed(4)};
                const float LAKE_F    = ${TERRAIN.LAKE_F.toFixed(6)};
                const float LAKE_SEED = ${TERRAIN.LAKE_SEED.toFixed(2)};
                const float WATER_LVL = ${TERRAIN.LAKE_LVL.toFixed(4)};

                ${GLSL_HASH}
                ${GLSL_NOISE2}
                uniform float uCloudT;
                ${GLSL_CLOUD}
                // Value noise AND its gradient, from the same four hashes as inoise.
                // Ripples need the real slope.
                // Noise VALUE minus 0.5 used as one carries the lattice straight through: the glints line up in a grid of rectangles and read as a texture rather than water.
                // The derivative of the smoothstep interpolant is round-shouldered and lattice-free, and costs a few multiplies over inoise itself.
                // Checked against finite differences to 4e-5.
                vec3 inoiseD(vec2 x){
                  vec2 i = floor(x), f = fract(x);
                  vec2 u = f * f * (3.0 - 2.0 * f);
                  vec2 du = 6.0 * f * (1.0 - f);
                  float a = ihash(i), b = ihash(i + vec2(1.0, 0.0)),
                        c = ihash(i + vec2(0.0, 1.0)), d = ihash(i + vec2(1.0, 1.0));
                  float k = a - b - c + d;
                  return vec3(a + (b - a) * u.x + (c - a) * u.y + k * u.x * u.y,
                              du * vec2((b - a) + k * u.y, (c - a) + k * u.x));
                }
                // px = world units per pixel at this scale.
                // Each octave fades toward its own mean with a constant normaliser; renormalising by surviving weight would change the total as octaves drop.
                // A FADED OCTAVE IS NOT SAMPLED.
                // At aa == 0 it contributes exactly its mean, a * 0.5, whatever the noise says, so the four hashes behind it are skipped and the result is bit-identical.
                // That is most of the high octaves on distant ground, which is most of the pixels at a low camera angle.
                // The branch is screen-coherent: px varies smoothly, so neighbouring pixels take the same side.
                float gFbm(vec2 p, float px, int oct){
                  float s = 0.0, tot = 0.0, a = 0.5, f = 1.0;
                  for (int i = 0; i < 4; i++){
                    if (i >= oct) break;
                    float aa = 1.0 - smoothstep(0.30, 0.80, px * f);
                    if (aa > 0.0) s += a * (0.5 + (inoise(p * f) - 0.5) * aa);
                    else s += a * 0.5;
                    tot += a;
                    f *= 2.0; a *= 0.5;
                  }
                  return s / tot;
                }
                // Flat tone bands with antialiased steps.
                // The width is a parameter, never fwidth(v): value noise interpolates with smoothstep, whose derivative is zero at every lattice point, so fwidth collapses there and the band snaps.
                // Past a whole band the raw value takes over, or floor() starts snapping again.
                // gFbm AND its gradient, from the same hashes: inoiseD returns the slope of exactly the value inoise returns, so the value half is unchanged (to the last bit or so) and the slope costs a few multiplies per octave, not a lookup.
                // The gradient is taken through the same per-octave antialias weight as the value, so relief fades with distance exactly when the colour detail does.
                vec3 gFbmD(vec2 p, float px, int oct){
                  float s = 0.0, tot = 0.0, a = 0.5, f = 1.0;
                  vec2 g = vec2(0.0);
                  for (int i = 0; i < 4; i++){
                    if (i >= oct) break;
                    float aa = 1.0 - smoothstep(0.30, 0.80, px * f);
                    if (aa > 0.0){ // faded: mean value, zero slope, no sample (see gFbm)
                      vec3 n = inoiseD(p * f);
                      s += a * (0.5 + (n.x - 0.5) * aa);
                      g += (a * aa * f) * n.yz;
                    } else s += a * 0.5;
                    tot += a;
                    f *= 2.0; a *= 0.5;
                  }
                  return vec3(s, g) / tot;
                }
                float gW(float f, float px){ return 0.7 * f * px; }
                float gBand(float v, float n, float vw){
                  float s = v * n;
                  float w = vw * n * 0.5;
                  float t = clamp(w * 2.0, 0.0, 1.0); // 1 = give up on banding
                  float b = (floor(s)
                    + smoothstep(0.5 - w - 1e-4, 0.5 + w + 1e-4, fract(s))) / n;
                  return mix(b, v, t);
                }
                // Water is drawn, not dug: the ground is two triangles, so there is nothing to displace.
                // What makes a flat surface read as water is FRESNEL -- dark body overhead, sky reflection at grazing angles -- which is one dot product.
                // Shoreline, depth tint and glint all reuse values already computed; only the ripples cost extra, inside the water branch.
                //
                // outAdd is ADDED after lighting, not multiplied by it: a reflection isn't diffuse, and shading it as if it were is what makes cheap water look like wet paint.
                // outSlope: dH/dx, dH/dz of the ground's relief, world units.
                // Zero on grass.
                vec3 gGround(vec2 w, vec3 P, out vec3 outAdd, out float outWet, out vec2 outSlope){
                  float px = max(fwidth(w.x), fwidth(w.y));
                  outAdd = vec3(0.0);
                  outWet = 0.0;
                  outSlope = vec2(0.0);

                  // warp the sampling position so patch borders wander; without this every patch is an obvious round blob
                  vec2 q = w * WARP_F;
                  vec2 wr = vec2(inoise(q), inoise(q + 31.4)) - 0.5;
                  vec2 p = w + wr * WARP_A;

                  // big features: low frequency, so they read all the way out
                  float dN = gFbm(p * 0.035, px * 0.035, 2);
                  float rN = gFbm(p * 0.019 + 57.0, px * 0.019, 2);
                  // The two detail fields, read here so the colour and the borders below share them.
                  float g = gFbm(p * 0.42, px * 0.42, 3);
                  vec3 d2D = gFbmD(p * 0.30 + 11.0, px * 0.30, 2);
                  float d2 = d2D.x;

                  // HEIGHT-BLENDED BORDERS.
                  // Crisp thresholds on smooth, large-scale noise -- a band of +-0.006, well under a unit of ground -- are exactly what a drawn line is, and widening the band only blurs them into mud.
                  // Instead each material's own surface detail pushes the border locally: where the dirt's detail runs high it shows through, where the grass's does a tuft creeps out over it; pebbles poke past the gravel's edge.
                  // Still crisp at the pixel, ragged and organic in shape.
                  // Free: the detail fields were already evaluated every pixel for colour.
                  // And it antialiases itself -- those fields fade to their mean with distance, so the borders relax back to smooth exactly where the detail could no longer be resolved.
                  // Tuned in a CPU replica of this shader: past ~0.12 the ground breaks into islands, and gravel much past 0.06 strews specks across the grass that read as noise.
                  const float BREAK_DIRT = 0.07;
                  const float BREAK_GRAV = 0.055;
                  const float EDGE_SOFT = 0.010;
                  float dw = gW(0.035, px) + gW(0.42, px) * BREAK_DIRT + EDGE_SOFT;
                  float dirt = smoothstep(-dw, dw, (dN - 0.545) + BREAK_DIRT * (d2 - g));
                  float rw = gW(0.019, px) + gW(1.7, px) * BREAK_GRAV + EDGE_SOFT;
                  // Everything the gravel border depends on except its own pebble field, which is only paid for inside the branch below.
                  float gravBase = (rN - 0.60) - 0.5 * BREAK_GRAV * (g - 0.5);

                  vec3 col = mix(GRASS_A, GRASS_B, gBand(g, 4.0, gW(0.42, px)));

                  // RELIEF, on bare ground only.
                  // Tried on everything first (CPU replica of this shader, lit the way three lights it): on grass it rumples the posterised bands into shag carpet and erases the style.
                  // On dirt and gravel it is what reads as EARTH -- soft ruts, lumpy soil, pebbles -- and leaves the grass soft beside it, so the materials differ by feel and not only by colour.
                  // The height fields are the ones already evaluated for colour, so this adds no lookups.
                  // Faded over the same footprint as colour detail, a little earlier, so it is gone before it could shimmer.
                  const float RELIEF_DIRT = 1.4;
                  const float RELIEF_GRAV = 0.72;
                  col = mix(col, mix(DIRT_A, DIRT_B, gBand(d2, 3.0, gW(0.30, px))), dirt);
                  outSlope = d2D.yz * (0.30 * RELIEF_DIRT * dirt
                           * (1.0 - smoothstep(0.15, 0.6, px * 0.30)));

                  // flecks are the priciest part, so only pay where there's actually gravel -- the branch is screen-coherent
                  // The bound is EXACT, not a guess: sp lies in [0, 1], so the pebble term adds at most +BREAK_GRAV/2, and below this line no pebble value could make grav > 0.
                  if (gravBase > -rw - 0.5 * BREAK_GRAV){
                    vec3 spD = gFbmD(p * 1.7 + 5.0, px * 1.7, 2);
                    float sp = spD.x;
                    float grav = smoothstep(-rw, rw, gravBase + BREAK_GRAV * (sp - 0.5))
                               * (1.0 - dirt * 0.85); // gravel doesn't lie on bare dirt
                    col = mix(col, mix(GRAV_A, GRAV_B, gBand(sp, 3.0, gW(1.7, px))), grav);
                    outSlope += spD.yz * (1.7 * RELIEF_GRAV * grav
                              * (1.0 - smoothstep(0.15, 0.6, px * 1.7)));
                  }

                  // ---- lakes ------------------------------------------------
                  // Very low frequency, thresholded high: large, rare and irregular.
                  // lkN doubles as a crude depth.
                  float lkN = gFbm(p * LAKE_F + LAKE_SEED, px * LAKE_F, 2);
                  float lw = gW(LAKE_F, px) + 0.004;
                  float lake = smoothstep(WATER_LVL - lw, WATER_LVL + lw, lkN);
                  float depth = clamp((lkN - WATER_LVL) / 0.08, 0.0, 1.0);

                  // damp shore: the ground darkens just OUTSIDE the waterline
                  float shore = smoothstep(WATER_LVL - 0.045, WATER_LVL, lkN)
                              * (1.0 - lake);
                  col = mix(col, col * 0.62, shore);

                  if (lake > 0.001){
                    // ripples: two layers drifting on different headings, so the pattern never reads as one sliding texture
                    // CROSSING, and fast enough to see: ~0.08 u/s is not slow water, it is still water.
                    // ~0.45 and ~0.3 u/s on headings about 100 degrees apart: where the two slopes agree a glint lights, and a moment later they have slid past each other and it is gone.
                    // Glints that APPEAR AND VANISH read as moving water at night; glints that slide read as a moving decal.
                    // Still only two noise evaluations, so the motion costs nothing extra.
                    vec2 r1 = w * 0.6 + vec2(uTime * 0.22, uTime * 0.16);
                    vec2 r2 = w * 1.15 + vec2(-uTime * 0.19, uTime * 0.27);
                    // Real slopes, summed.
                    // 0.3 keeps the median gradient near 0.45 per layer, which the Fresnel read and the lake's overall brightness are tuned to.
                    vec2 grad = (inoiseD(r1).yz + inoiseD(r2).yz * 0.7) * 0.3;
                    // flatten the ripples out with distance, or they alias
                    float rk = 1.0 - smoothstep(0.05, 0.5, px);
                    vec3 nrm = normalize(vec3(grad.x * rk, 1.0, grad.y * rk));

                    vec3 V = normalize(P - cameraPosition);
                    // Schlick: ~2% straight down, ~100% at a grazing angle.
                    // This is the whole trick.
                    float f = 0.02 + 0.98 * pow(1.0 - max(-dot(nrm, V), 0.0), 5.0);

                    vec3 body = mix(WATER_SHALLOW, WATER_DEEP, depth);
                    vec3 wcol = mix(body, uSkyCol, f * 0.85);

                    // sun glint on the ripple faces
                    vec3 Ldir = normalize(vec3(10.0, 18.0, 12.0));
                    vec3 H = normalize(Ldir - V);
                    float spec = pow(max(dot(nrm, H), 0.0), 200.0);

                    // bright waterline where the surface meets the bank
                    float edge = (1.0 - smoothstep(0.0, 0.035, lkN - WATER_LVL));

                    col = mix(col, wcol, lake);
                    outAdd = (uSkyCol * f * 0.16 + vec3(spec * 0.55)
                              + vec3(0.10, 0.13, 0.14) * edge) * lake;
                    outWet = lake;
                  }

                  outSlope *= 1.0 - lake; // water is flat; its ripples live in outAdd
                  return col;
                }`,
              )
              .replace(
                "#include <map_fragment>",
                `#include <map_fragment>
                 vec3 gAdd; float gWet; vec2 gSlope;
                 diffuseColor.rgb = gGround(vWPos.xz, vWPos, gAdd, gWet, gSlope);
                 // By hand rather than through patchCloud: this shader already carries ihash, inoise and a world-space varying of its own, and a second copy of any of them is a redefinition error.
                 float gCloud = cloudLight(vWPos.xz, uCloudT);
                 diffuseColor.rgb *= gCloud;
                 // The reflection is added AFTER lighting, so it never sees the line above.
                 // Cloud has to reach it separately or a lake stays exactly as bright under cover as in the open, which is the one surface where that would be obvious.
                 // Half strength: the sky it mirrors is overhead and mostly still there.
                 gAdd *= mix(1.0, gCloud, 0.5);`,
              )
              // The relief tilts the real lighting normal, so the moon, the sky light and the shadows all see it.
              // three's normal is in VIEW space; the floor's is world +Y, so the height-field normal is built in world space and carried across once.
              .replace(
                "#include <normal_fragment_maps>",
                "#include <normal_fragment_maps>\nnormal = normalize((viewMatrix * vec4(normalize(vec3(-gSlope.x, 1.0, -gSlope.y)), 0.0)).xyz);",
              )
              // water is smooth, so tighten the REAL sun specular there too
              .replace(
                "#include <roughnessmap_fragment>",
                "#include <roughnessmap_fragment>\nroughnessFactor = mix(roughnessFactor, 0.10, gWet);",
              )
              // reflection + glint are added AFTER lighting, not lit by it
              .replace(
                "#include <emissivemap_fragment>",
                "#include <emissivemap_fragment>\ntotalEmissiveRadiance += gAdd;",
              ).src;
            sh.uniforms.uTime = { value: 0 };
            sh.uniforms.uCloudT = { value: 0 };
            CLOUD_SHADERS.push(sh);
            sh.uniforms.uSkyCol = {
              value: new THREE.Color(0x2a3646), // what the water reflects
            };
            floor.userData.shader = sh; // so the loop can drive uTime
          };
          floor.rotation.x = -Math.PI / 2;
          floor.renderOrder = 10; // after the animals (see groundMask note)
          floor.frustumCulled = false;
          groundMask(floor.material);
          this.scene.add(floor);
          this._floor = floor;
          Bales.build(this.scene);
          Scarecrows.build(this.scene);

          // Shade: multiply the ground down where shadow bit1 is set (single darkness, stencil-gated, no depth test; ground detail reads through).
          const SHADOW_TINT = 0x5f6570; // multiplier on the ground (~0.38x)
          const shade = new THREE.Mesh(
            new THREE.PlaneGeometry(SPAN, SPAN),
            new THREE.MeshBasicMaterial({ color: SHADOW_TINT }),
          );
          shade.rotation.x = -Math.PI / 2;
          shade.renderOrder = 2; // transparent queue, after the marker (1)
          shade.frustumCulled = false;
          const sm = shade.material;
          sm.transparent = true;
          // Multiply (ground * tint) via explicit CustomBlending; the preset needs premultipliedAlpha in this build.
          sm.blending = THREE.CustomBlending;
          sm.blendEquation = THREE.AddEquation;
          sm.blendSrc = THREE.ZeroFactor; // drop the source's own color
          sm.blendDst = THREE.SrcColorFactor; // keep ground * tint
          sm.depthTest = false;
          sm.depthWrite = false;
          sm.stencilWrite = true;
          sm.stencilFunc = THREE.EqualStencilFunc;
          sm.stencilRef = 2;
          sm.stencilFuncMask = 2; // test the shadow bit
          sm.stencilWriteMask = 2;
          sm.stencilZPass = THREE.ZeroStencilOp; // consume the shadow bit
          // Fog consumer 3.
          // Same farmFog as everything else; only the destination colour differs.
          // Fog on a MULTIPLY pass has to fade toward WHITE, not toward the fog colour, since white is the identity for this blend.
          // Stock fog would drag the multiplier down to the fog colour (~0.10), so a distant shadow would multiply already-fogged ground to near black -- a dark blob hanging in the fog.
          sm.fog = true;
          sm.onBeforeCompile = (sh) => {
            sh.fragmentShader = patch(
              sh.fragmentShader,
              "shadow shade fs",
            ).replace(
              "#include <fog_fragment>",
              `#ifdef USE_FOG
                 gl_FragColor.rgb = mix( gl_FragColor.rgb, vec3( 1.0 ), farmFogAmount() );
               #endif`,
            ).src;
          };
          this.scene.add(shade);
          this._shade = shade;
          this._followGround();
        }

        // Slide the floor and the shade quad to sit under the camera.
        // These are real planes, so they are moved and their matrices baked by hand, the scene having matrixWorldAutoUpdate off.
        // Called every frame, so it allocates nothing: two named fields, not an array literal, which would be two objects a frame.
        _followGround() {
          const c = this.camera.position,
            f = this._floor,
            s = this._shade;
          if (f) {
            f.position.x = c.x;
            f.position.z = c.z;
            f.updateMatrixWorld();
          }
          if (s) {
            s.position.x = c.x;
            s.position.z = c.z;
            s.updateMatrixWorld();
          }
        }

        _initSelection() {
          const canvas = this.renderer.domElement;
          let dx = 0,
            dy = 0,
            dt0 = 0,
            id = -1;
          canvas.addEventListener("pointerdown", (e) => {
            if (e.button !== 0) return;
            dx = e.clientX;
            dy = e.clientY;
            dt0 = performance.now();
            id = e.pointerId;
          });
          canvas.addEventListener("pointerup", (e) => {
            if (e.pointerId !== id) return;
            id = -1;
            if (e.ctrlKey) return;
            // A finger moves while it taps and covers a target it cannot see under itself, so both the slop and the aim have to be looser than a mouse's.
            const touch = e.pointerType === "touch";
            if (Math.hypot(e.clientX - dx, e.clientY - dy) > (touch ? 14 : 6))
              return; // a drag, not a tap
            if (performance.now() - dt0 > 350) return;
            this._pickAt(e.clientX, e.clientY, touch);
          });
        }

        // A single ray through one point, and on touch a small rosette around it.
        // A chick forty units off is a handful of pixels and a fingertip is forty across.
        // The extra rays fire only when the centre misses.
        _pickAt(cx, cy, touch) {
          let found = this._rayAt(cx, cy);
          if (!found && touch) {
            const R = 18;
            for (let i = 0; i < 6 && !found; i++) {
              const a = (i / 6) * Math.PI * 2;
              found = this._rayAt(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
            }
          }
          this.select(found);
          if (!_loopRunning || this.paused) this.renderParked();
        }

        _rayAt(cx, cy) {
          const rect = this.renderer.domElement.getBoundingClientRect();
          this._ptr.x = ((cx - rect.left) / rect.width) * 2 - 1;
          this._ptr.y = -((cy - rect.top) / rect.height) * 2 + 1;
          this.raycaster.setFromCamera(this._ptr, this.camera);
          const hits = this.raycaster.intersectObjects(registry.batched, false);
          for (const h of hits) {
            const iid = h.batchId != null ? h.batchId : h.instanceId;
            const recs = h.object.userData && h.object.userData.recs;
            if (recs && iid != null && recs[iid])
              return recs[iid].node.userData.animal;
          }
          return null;
        }

        // A flat capsule-outline band lying in the XZ plane: the 2D silhouette of a collision capsule (segment half-length `half` along X, radius `rad`), drawn as a band `w` thick.
        // Offsetting a stadium inward by w is just another stadium with radius rad-w and the same half-length, so outer and inner rings share one parameterisation.
        _stadiumGeom(rad, half, w, seg = 48) {
          const ri = Math.max(rad - w, rad * 0.05);
          const pos = [],
            idx = [];
          const N = seg; // points around the loop
          for (let i = 0; i < N; i++) {
            // sweep -PI/2..3PI/2; the cap centre flips sign at the halfway point, which makes the two straight edges fall out for free.
            const th = -Math.PI / 2 + (i / N) * Math.PI * 2;
            const cx = Math.cos(th) >= 0 || i < N / 2 ? half : -half;
            const c = Math.cos(th),
              s = Math.sin(th);
            pos.push(cx + rad * c, 0, rad * s); // outer
            pos.push(cx + ri * c, 0, ri * s); // inner
          }
          for (let i = 0; i < N; i++) {
            const a = i * 2,
              b = ((i + 1) % N) * 2;
            idx.push(a, b, a + 1, b, b + 1, a + 1);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
          g.setIndex(idx);
          return g;
        }
        // Rebuild the ring to match an animal's collision capsule (no-op if it already matches, so re-selecting the same species costs nothing).
        _fitRing(a) {
          const rad = a._colRad || 0.5,
            half = a._colHalf || 0;
          const key = rad.toFixed(3) + "/" + half.toFixed(3);
          if (key === this._ringKey) return;
          this._ringKey = key;
          this.ring.geometry.dispose();
          // band thickness scales with the animal so it reads the same at any size
          this.ring.geometry = this._stadiumGeom(
            rad,
            half,
            Math.max(0.04, rad * 0.12),
          );
        }

        select(a) {
          if (this.selected === a) return;
          if (this.selected) {
            this.selected.jumpY = 0;
            this.selected.jumpV = 0;
          }
          this.selected = a;
          // Move the pin to the other end of the arm: setOrbit re-bases from whichever end the new mode keeps fixed, so nothing jumps.
          this.controls.setOrbit(!!a);
          // Panning is OFF while driving.
          // The chase camera already overrides it -- drag the view and it snaps back a frame later -- and a control that visibly fights you reads as broken.
          // Orbit, tilt and zoom all stay live; this only takes away the one gesture that had no effect anyway.
          this.controls.enablePan = !a;
          if (a) {
            // Re-AIM, do not re-frame.
            // setOrbit alone leaves the arm at whatever length it had while flying, and the chase then slides the camera until the animal sits that far away: click one 8 units off while zoomed to 60 and it retreats to a dot.
            // Solving the arm from camera to animal leaves the camera where it is, so the animal's size on screen does not change.
            // apply() still clamps dist and phi, so clicking something inside minDistance or from almost level is the one case that can move the camera, and only as far as the clamp.
            const p = a.group.position,
              q = this.controls.pivot;
            // A standing animal's origin is ON the ground, and the orbit target has to clear it (see the boot self-check).
            q.set(p.x, Math.max(p.y, CAM_TGT_MIN), p.z);
            const cp = this.camera.position,
              dx = cp.x - q.x,
              dy = cp.y - q.y,
              dz = cp.z - q.z,
              d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (d > 1e-4) {
              this.controls.dist = d;
              this.controls.theta = Math.atan2(dx, dz);
              this.controls.phi = Math.acos(clamp(dy / d, -1, 1));
              this.controls.apply();
            }
            this._fitRing(a); // match this animal's collision capsule
            this._placeRing(a); // put it under them immediately
            this.ring.visible = true;
            this.selLabel.textContent =
              a.type[0].toUpperCase() + a.type.slice(1);
          } else {
            this.ring.visible = false;
            this.selLabel.textContent = "";
          }
        }

        // Keep the ring pinned to the ground under the animal.
        // Deliberately ignores the animal's Y (bob, jump, landing squash) and its scale, so the ring never leaves the floor.
        // The scene has matrixWorldAutoUpdate off, so setting .position alone would leave the ring stuck at the origin -- it has to bake its own matrix.
        _placeRing(a) {
          const p = a.group.position,
            ry = a.group.rotation.y;
          // Sit on the capsule's CENTRE, not the group origin: the capsule is offset forward (heads reach further than rumps), and the ring has to show exactly what the collider enforces.
          const o = a._colOff || 0;
          // OFF THE GROUND, THE RING ENCIRCLES THE SHADOW, not the empty ground under the feet.
          // The shadow is already what ties a bird in the air to the ground, so the ring joins it instead of becoming a third, disconnected mark.
          // Shifted by the shadow's own shear times the height, so it is exactly where it always was at rest, and slides continuously out and back.
          const lift = a.jumpY;
          this.ring.position.set(
            p.x + Math.cos(ry) * o - registry.shadowAX * lift,
            RING_Y,
            p.z - Math.sin(ry) * o - registry.shadowAZ * lift,
          );
          this.ring.rotation.y = ry; // capsule follows heading
          this.ring.updateMatrixWorld();
        }

        // Trigger a random voice on the selected animal, from its position.
        callSelected() {
          const a = this.selected;
          if (!a || !SOUND) return;
          const gp = a.group.position;
          SOUND.vocalize(a.type, gp.x, gp.y + 0.9 * a.group.scale.x, gp.z);
        }

        // The one thing in this world that is scheduled rather than emergent.
        // Kept in one method, with one timer, so the whole of it can be read at once and switched off by one line.
        // The alert itself, separated from the schedule so it can be fired by hand.
        // Nothing here reads a timer, which is what makes it testable: the only difference between a real event and a test one is who called it.
        // ==================================================================
        // FLIGHT (see FLIGHT).
        // Planned once at take-off, then replayed.
        // ==================================================================

        // Per sim step.
        // Active flights ALWAYS advance, kill switch or not, so a flight can only end by landing; the switch only stops new ones.
        // One pass over the herd with a null check is cheaper to keep right than a separate list that has to be kept in step with it.
        _flightStep(h) {
          if (CONFIG.flight.enabled) {
            this._flightT -= h;
