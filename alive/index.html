            if (this._flightT <= 0) {
              this._flightT = this._scheduleFlight()
                ? rand(FLIGHT_GAP[0], FLIGHT_GAP[1])
                : rand(FLIGHT_RETRY[0], FLIGHT_RETRY[1]);
            }
          }
          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const a = A[i],
              fl = a._fl;
            if (fl === null) continue;
            if (fl.flyIn > 0) {
              fl.flyIn -= h;
              if (fl.flyIn <= 0) {
                fl.flyIn = -1;
                this.takeOff(a, fl.fleeYaw);
              }
            }
            if (fl.on) this._flyUpdate(a, fl, h);
          }
        }

        // A quiet flight, by a bird someone can actually see.
        _scheduleFlight() {
          const A = this.animals,
            cand = this._flyCand;
          cand.length = 0;
          for (let i = 0; i < A.length; i++) {
            const a = A[i];
            if (a._fl === null || a._fl.on || a === this.selected) continue;
            if (this._observable(a)) cand.push(a);
          }
          for (let k = 0; k < 4 && cand.length; k++) {
            const i = (Math.random() * cand.length) | 0;
            if (this.takeOff(cand[i], NaN)) return true;
            cand[i] = cand[cand.length - 1];
            cand.length--;
          }
          return false;
        }
        // The debug panel's button.
        // The SELECTED bird if there is one -- the easy way to test a particular species, or to ride along -- otherwise the scheduler's own choice, now.
        // A selected animal that cannot fly falls through to the scheduler rather than doing nothing.
        flyNow() {
          const s = this.selected;
          if (s && s._fl !== null) {
            const ok = this.takeOff(s, NaN, true);
            if (!ok) {
              const r = this._flyRej;
              console.info(
                `${s.type}: no take-off -- ${this._flyWhy}` +
                  (this._flyWhy === "no clear landing spot in range"
                    ? ` (spots rejected: ${r.surface} wrong surface, ${r.far} outside the streaming radius, ${r.crowded} occupied)`
                    : ""),
              );
            }
            return ok;
          }
          return this._scheduleFlight();
        }

        // Worth spending a flight on: inside the view, and tall enough on screen to read as a bird taking off rather than a moving dot.
        // Uses the frustum updateView rebuilt from the camera's final position last frame, and the scratch sphere the recycler already owns -- both are consumed immediately, so sharing them is safe.
        // Rare calls; nothing here is per frame.
        _observable(a) {
          const p = a.group.position,
            cam = this.camera,
            s = this._cullSphere;
          s.center.set(p.x, p.y + a._cullDY, p.z);
          s.radius = a._height * 0.5; // the bird itself, not the padded pose-cull sphere
          if (!this._frustum.intersectsSphere(s)) return false;
          const dx = p.x - cam.position.x,
            dy = p.y - cam.position.y,
            dz = p.z - cam.position.z;
          const d = Math.max(Math.sqrt(dx * dx + dy * dy + dz * dz), 1e-3);
          const pxPerRad =
            this.renderer.domElement.clientHeight /
            (2 * Math.tan(THREE.MathUtils.degToRad(cam.fov) * 0.5));
          return (a._height / d) * pxPerRad >= FLIGHT_MIN_PX;
        }

        // fleeYaw: a heading to fly AWAY along (the herd alarm), or NaN for anywhere.
        // allowSelected: only for an explicit request (the debug button).
        // The bird you are driving never takes off on its own; asked to, you ride along and control resumes at touchdown.
        // Returns false, changing nothing, if there is nowhere good to go.
        takeOff(a, fleeYaw, allowSelected = false) {
          const fl = a._fl;
          this._flyWhy = !CONFIG.flight.enabled
            ? "flight is switched off (CONFIG.flight.enabled)"
            : fl === null
              ? "this species does not fly"
              : fl.on
                ? "already in the air"
                : !a.grounded
                  ? "mid-hop"
                  : !a.initialized
                    ? "not settled yet"
                    : a === this.selected && !allowSelected
                      ? "being driven"
                      : "";
          if (this._flyWhy) return false;
          if (!this._flightTarget(a, fl, fleeYaw)) {
            this._flyWhy = "no clear landing spot in range";
            return false;
          }
          const p = a.group.position,
            S = fl.spec;
          const dx = fl.x1 - p.x,
            dz = fl.z1 - p.z,
            D = Math.sqrt(dx * dx + dz * dz); // >= the species' minimum range, never 0
          fl.x0 = p.x;
          fl.z0 = p.z;
          fl.D = D;
          fl.ux = dx / D;
          fl.uz = dz / D;
          this._flightProfile(a, fl);
          fl.y0 = Math.max(0, flightY(fl, 0));
          fl.y1 = Math.max(0, flightY(fl, D));
          fl.tV1 = fl.y0 / S.climb; // the spring, or a straight climb if something is right beside it
          fl.tP = (1.5 * D) / S.speed; // eased: averages two thirds of peak speed
          fl.tV2 = fl.y1 / S.drop; // zero unless something is right beside the landing spot
          fl.T = fl.tV1 + fl.tP + fl.tV2;
          fl.t = 0;
          fl.beat = 0;
          fl.u = fl.pitch = fl.glide = fl.tuck = fl.neck = 0;
          fl.yaw0 = a.group.rotation.y;
          let dy = Math.atan2(-dz, dx) - fl.yaw0; // forward is (cos yaw, -sin yaw)
          dy -= 6.283185307179586 * Math.round(dy / 6.283185307179586);
          fl.dyaw = dy;
          fl.yaw1 = fl.yaw0 + dy;
          fl.on = true;
          Collision.setHold(a._simIdx, true); // the landing spot is held from this moment
          a.jumpV = 0;
          return true;
        }

        // Where to land: the NEAREST acceptable spot in the species' range.
        // Acceptable means the right surface, inside the streaming radius so it is not recycled the moment it lands, and clear (_landingClear).
        // A fixed fan of 24 headings by 3 distances: bounded work, once per take-off.
        // Waterfowl PREFER water -- from land always, from water half the time -- but fall back to the other surface when none of the preferred is in range.
        // Requiring it made a swan on land fly about one time in five: water covers a tenth of the ground, and most of the time there is none within 24m.
        // Measured with this file's own water function: the fallback takes that to every time.
        // Land birds never land on water.
        _flightTarget(a, fl, fleeYaw) {
          const r = this._flyRej;
          r.surface = r.far = r.crowded = 0;
          const S = fl.spec,
            p = a.group.position;
          const prefer =
            S.water === 1 && (!isWater(p.x, p.z) || Math.random() < 0.5);
          if (this._searchLanding(a, fl, fleeYaw, prefer)) return true;
          return S.water === 1 && this._searchLanding(a, fl, fleeYaw, !prefer);
        }
        _searchLanding(a, fl, fleeYaw, wantWater) {
          const S = fl.spec,
            p = a.group.position,
            rej = this._flyRej;
          const R = FOG_CULL * 0.8,
            ax = this.anchor.x,
            az = this.anchor.z;
          const ia = a._simIdx,
            ra = Collision.rad[ia] + Collision.half[ia];
          const flee = !Number.isNaN(fleeYaw);
          const base = flee ? fleeYaw : Math.random() * 6.283185307179586,
            spread = flee ? Math.PI * 0.5 : Math.PI;
          // PREFER AN OPEN HEADING.
          // Something touching the bird and ahead of it is the one thing that forces a straight climb (see _flightProfile), so gather what is touching it -- nearly always nothing to three animals -- and prefer the nearest spot whose heading has none of them in the way.
          // Only if every heading is blocked does it take the nearest spot anyway.
          const NB = this._nb,
            C = Collision;
          let nn = 0;
          const touch = (x, z, fp) => {
            const dx = x - p.x,
              dz = z - p.z,
              rt = fp + ra + FLIGHT_PAD;
            if (dx * dx + dz * dz < rt * rt && nn + 3 <= NB.length) {
              NB[nn++] = dx;
              NB[nn++] = dz;
              NB[nn++] = fp + ra;
            }
          };
          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const b = A[i];
            if (b !== a && !b.aloft)
              touch(
                b.group.position.x,
                b.group.position.z,
                C.rad[b._simIdx] + C.half[b._simIdx],
              );
          }
          for (let i = 0; i < Bales.n; i++)
            touch(Bales.x[i], Bales.z[i], Bales.r[i]);
          for (let i = 0; i < Scarecrows.n; i++)
            touch(Scarecrows.x[i], Scarecrows.z[i], Scarecrows.r[i]);
          // HOW FAR, drawn across the whole range per flight: the spot chosen is the acceptable one CLOSEST TO THIS, not the nearest one.
          // Nearest makes every flight in open ground the species' minimum -- a duck would always fly 7m of its 7-18 -- and short flights are low ones.
          const dWant = S.range[0] + Math.random() * (S.range[1] - S.range[0]);
          let best = -1, // best score so far: distance from dWant, on an open heading
            bx = 0,
            bz = 0,
            anyD = -1, // the same, allowing a blocked heading
            ax1 = 0,
            az1 = 0;
          for (let k = 0; k < 24; k++) {
            const ang = base + (k / 23 - 0.5) * 2 * spread;
            const cs = Math.cos(ang),
              sn = Math.sin(ang);
            // Blocked: a touching neighbour ahead on this heading (forward is (cos, -sin)).
            let blocked = false;
            for (let j = 0; j < nn && !blocked; j += 3) {
              const al = NB[j] * cs - NB[j + 1] * sn;
              if (al <= 0) continue;
              const lx = NB[j] - cs * al,
                lz = NB[j + 1] + sn * al;
              if (lx * lx + lz * lz < NB[j + 2] * NB[j + 2]) blocked = true;
            }
            for (let q = 0; q < 3; q++) {
              const d =
                S.range[0] +
                ((S.range[1] - S.range[0]) * (q + Math.random())) / 3;
              const sc = Math.abs(d - dWant);
              if (best >= 0 && sc >= best) continue;
              if (blocked && anyD >= 0 && sc >= anyD) continue;
              const x = p.x + cs * d,
                z = p.z - sn * d;
              if (wantWater ? !this._fitsWater(x, z, ra) : isWater(x, z)) {
                rej.surface++;
                continue;
              }
              const ex = x - ax,
                ez = z - az;
              if (ex * ex + ez * ez > R * R) {
                rej.far++;
                continue;
              }
              if (!this._landingClear(a, x, z)) {
                rej.crowded++;
                continue;
              }
              if (blocked) {
                anyD = sc;
                ax1 = x;
                az1 = z;
              } else {
                best = sc;
                bx = x;
                bz = z;
              }
            }
          }
          if (best >= 0) {
            fl.x1 = bx;
            fl.z1 = bz;
            return true;
          }
          if (anyD < 0) return false;
          fl.x1 = ax1; // every heading blocked: the straight climb is genuinely needed
          fl.z1 = az1;
          return true;
        }
        // The bird's whole footprint is on water, so it does not come down half on the bank.
        // A fixed "0.03 deeper than the shoreline" margin approximates this and turns down more than a quarter of all water, including whole small ponds.
        _fitsWater(x, z, r) {
          if (!isWater(x, z)) return false;
          const k = r * 1.3;
          for (let i = 0; i < 6; i++) {
            const t = i * 1.0471975511965976;
            if (!isWater(x + Math.cos(t) * k, z + Math.sin(t) * k))
              return false;
          }
          return true;
        }

        // Clear of every other animal's footprint -- or, for one already flying, of the spot it is holding -- and of bales and scarecrows, which are not in the animal solver at all.
        _landingClear(a, x, z) {
          const C = Collision,
            ia = a._simIdx,
            ra = C.rad[ia] + C.half[ia];
          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const b = A[i];
            if (b === a) continue;
            const q = b._fl !== null && b._fl.on ? b._fl : null;
            const dx = (q ? q.x1 : b.group.position.x) - x,
              dz = (q ? q.z1 : b.group.position.z) - z;
            const rr =
              ra + C.rad[b._simIdx] + C.half[b._simIdx] + FLIGHT_LAND_GAP;
            if (dx * dx + dz * dz < rr * rr) return false;
          }
          return (
            !this._nearProp(Bales, x, z, ra + FLIGHT_LAND_GAP) &&
            !this._nearProp(Scarecrows, x, z, ra + FLIGHT_LAND_GAP)
          );
        }
        _nearProp(P, x, z, r) {
          for (let i = 0; i < P.n; i++) {
            const dx = P.x[i] - x,
              dz = P.z[i] - z,
              rr = P.r[i] + r;
            if (dx * dx + dz * dz < rr * rr) return true;
          }
          return false;
        }

        // THE FLIGHT CEILING: the tallest thing that exists in this world, plus a margin.
        // Computed ONCE, from the real sizes -- every animal's measured height (its size variation included), the scarecrow's built geometry, the bale generator's largest diameter -- and cached.
        // Nothing that exists can be taller, so no cruise can ever meet anything; bootChecks forces it at load.
        _ceiling() {
          if (this._flightCeil > 0) return this._flightCeil;
          let top = Math.max(Scarecrows.topY, BALE_TOP);
          const A = this.animals;
          for (let i = 0; i < A.length; i++)
            if (A[i]._height > top) top = A[i]._height;
          this._flightCeil = top + FLIGHT_MARGIN;
          return this._flightCeil;
        }

        // THE PATH, fitted to what is actually along it (see FLIGHT).
        // Every animal, bale and scarecrow near the route becomes an interval [s, e] of distance along it that must be flown at or above a height.
        // Then, each on its own, as gently as possible:
        //   anything overlapping the take-off (or landing) spot raises a straight vertical start (end);
        //   anything else sets the least climb (glide) slope that is already high enough at the near
        //   edge of its interval -- the line only rises toward it, so it is high enough across it --
        //   and anything needing steeper than FLIGHT_MAX_SLOPE is just climbed to vertically first.
        // Heights carry half of FLIGHT_SOFT on top, which is the most the two nested soft-mins in flightY can sag below the straight lines; so the smoothed path still clears everything.
        // Once per take-off: the closure below is allocated then, never per frame.
        _flightProfile(a, fl) {
          const S = fl.spec,
            C = Collision,
            D = fl.D,
            ux = fl.ux,
            uz = fl.uz,
            x0 = fl.x0,
            z0 = fl.z0;
          const ra = C.rad[a._simIdx] + C.half[a._simIdx],
            vAvg = S.speed / 1.5,
            lift = FLIGHT_SOFT * 0.5;
          const OS = this._obS,
            OE = this._obE,
            OH = this._obH,
            cap = OS.length;
          let n = 0;
          const add = (px, pz, fp, h, moving) => {
            const rx = px - x0,
              rz = pz - z0,
              along = rx * ux + rz * uz,
              lx = rx - ux * along,
              lz = rz - uz * along;
            // Seconds until the bird is there, counted from whichever end is nearer: near the take-off it has not gone far yet; near the landing, the held spot keeps everyone out anyway.
            const tEst = Math.max(0, Math.min(along, D - along)) / vAvg;
            const R =
              fp + ra + FLIGHT_PAD + (moving ? FLIGHT_WANDER * tEst : 0);
            const l2 = lx * lx + lz * lz;
            if (l2 >= R * R) return;
            const w = Math.sqrt(R * R - l2);
            let s = along - w;
            const e = Math.min(D, along + w);
            if (along + w <= 0 || s >= D) return; // wholly behind the take-off or past the landing
            if (s < 0) {
              // The take-off spot is inside the PADDED reach.
              // That alone forced a vertical start, and in a herd that was most take-offs.
              // Two cases do not need one:
              //  - it is behind or level with the start: the bird flies AWAY, so it is never closer than
              //    where it stands -- and it is not touching anything where it stands;
              //  - it is ahead: the pad is slack, not contact, so clear it from where they would truly
              //    touch. Only something truly touching and ahead needs a straight climb.
              if (along <= 0) return;
              const Rt = fp + ra;
              if (l2 >= Rt * Rt) return; // passes beside it without ever touching
              s = Math.max(0, along - Math.sqrt(Rt * Rt - l2));
            }
            const need = h + lift;
            if (n < cap) {
              OS[n] = s;
              OE[n] = e;
              OH[n] = need;
              n++;
            }
          };
          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const b = A[i];
            if (b === a || b.aloft) continue;
            add(
              b.group.position.x,
              b.group.position.z,
              C.rad[b._simIdx] + C.half[b._simIdx],
              b._height + FLIGHT_MARGIN,
              true,
            );
          }
          // Footprints are the collision circles; heights are the real ones (see BALE_TOP, Scarecrows.topY).
          for (let i = 0; i < Bales.n; i++)
            add(
              Bales.x[i],
              Bales.z[i],
              Bales.r[i],
              BALE_TOP + FLIGHT_MARGIN,
              false,
            );
          for (let i = 0; i < Scarecrows.n; i++)
            add(
              Scarecrows.x[i],
              Scarecrows.z[i],
              Scarecrows.r[i],
              Scarecrows.topY + FLIGHT_MARGIN,
              false,
            );

          const END = 0.05;
          let vA = FLIGHT_SPRING,
            vC = 0,
            kA = S.climbSlope,
            kC = S.glideSlope;
          for (let i = 0; i < n; i++) {
            if (OS[i] <= END) vA = Math.max(vA, OH[i]);
            if (OE[i] >= D - END) vC = Math.max(vC, OH[i]);
          }
          for (let i = 0; i < n; i++) {
            if (OS[i] > END) {
              const k = (OH[i] - vA) / OS[i];
              if (k > FLIGHT_MAX_SLOPE) vA = Math.max(vA, OH[i]);
              else if (k > kA) kA = k;
            }
            if (OE[i] < D - END) {
              const k = (OH[i] - vC) / (D - OE[i]);
              if (k > FLIGHT_MAX_SLOPE) vC = Math.max(vC, OH[i]);
              else if (k > kC) kC = k;
            }
          }
          // The cruise clears the CEILING -- the tallest thing anywhere -- not just what is on this route.
          // The route scan above only shapes the climb and the glide, which is what keeps take-offs angled.
          const H =
            Math.max(this._ceiling(), vA, vC) + rand(S.cruise[0], S.cruise[1]);
          // Reach it (see FLIGHT_REACH).
          // Only ever steepens, so every clearance above still holds.
          const reach = FLIGHT_REACH * D;
          kA = Math.max(kA, Math.min(FLIGHT_MAX_SLOPE, (H - vA) / reach));
          kC = Math.max(kC, Math.min(FLIGHT_MAX_SLOPE, (H - vC) / reach));
          fl.vA = vA;
          fl.vC = vC;
          fl.kA = kA;
          fl.kC = kC;
          fl.H = H;
        }

        // Replays the plan: the spring (or a straight climb, if it must), the path, and a straight drop only if something stands right beside the landing spot.
        // Pose state -- pitch, glide, tuck -- comes from the path itself, so the bird noses up exactly as steeply as it climbs.
        _flyUpdate(a, fl, h) {
          fl.t = Math.min(fl.t + h, fl.T);
          const t = fl.t,
            g = a.group;
          let x, y;
          if (t < fl.tV1) {
            const u = t / fl.tV1;
            x = 0;
            y = fl.y0 * (1 - (1 - u) * (1 - u));
            fl.u = 0;
            fl.pitch = 0.45 * u;
            fl.glide = 0;
            fl.tuck = 0;
            fl.neck = 0;
          } else if (t < fl.tV1 + fl.tP) {
            const u = (t - fl.tV1) / fl.tP,
              e = u * u * (3 - 2 * u); // eased off the ground and eased into the landing
            x = fl.D * e;
            y = Math.max(0, flightY(fl, x));
            const d = 0.05,
              slope =
                (flightY(fl, Math.min(fl.D, x + d)) -
                  flightY(fl, Math.max(0, x - d))) /
                (2 * d);
            fl.u = u;
            fl.pitch =
              clamp(Math.atan(slope) * 0.9, -0.3, 0.55) +
              0.35 * smooth01(0.82, 1, u); // + the flare
            fl.glide = smooth01(0.45, 0.6, u) * (1 - smooth01(0.8, 0.9, u)); // beat, glide, beat to land
            fl.tuck = smooth01(0, 0.15, u) * (1 - smooth01(0.72, 0.92, u)); // legs up, then down for it
            fl.neck = smooth01(0, 0.12, u) * (1 - smooth01(0.8, 0.95, u)); // reach out, then up to land
          } else {
            const u = fl.tV2 > 0 ? (t - fl.tV1 - fl.tP) / fl.tV2 : 1;
            x = fl.D;
            y = fl.y1 * (1 - u * u * (3 - 2 * u));
            fl.u = 1;
            fl.pitch = 0.3;
            fl.glide = 0;
            fl.tuck = 0;
            fl.neck = 0;
          }
          g.position.x = fl.x0 + fl.ux * x;
          g.position.z = fl.z0 + fl.uz * x;
          a.jumpY = y;
          // Turn to face the way it is going over the spring and the start of the path, then hold it.
          const k = Math.min(1, t / (fl.tV1 + 0.25 * fl.tP + 1e-4));
          g.rotation.y = fl.yaw0 + fl.dyaw * (k * k * (3 - 2 * k));
          if (t >= fl.T) this._touchDown(a, fl);
        }

        // The only way a flight ends.
        _touchDown(a, fl) {
          const g = a.group;
          g.position.x = fl.x1;
          g.position.z = fl.z1;
          g.rotation.y = fl.yaw1;
          a.jumpY = 0;
          a.jumpV = 0;
          fl.on = false;
          Collision.setHold(a._simIdx, false);
          // No phantom stride on the next pose: it arrived here, it did not walk here.
          a.lastPosition.copy(g.position);
          a._lastYaw = g.rotation.y;
          // And no trudging back to wherever it meant to go before it flew: settle, then choose.
          a._tx = null;
          a._pause = rand(1.5, 4);
        }

        alertHerd(bear) {
          const f = this.anchor;
          const sx = f.x + Math.cos(bear) * 240,
            sz = f.z + Math.sin(bear) * 240;
          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const a = A[i];
            if (a === this.selected || a.aloft) continue; // yours / already fleeing
            const p = a.group.position;
            const dx = sx - p.x,
              dz = sz - p.z;
            const d = Math.sqrt(dx * dx + dz * dz);
            // Animal yaw convention: forward is (cos y, -sin y), so facing (dx, dz) is atan2(-dz, dx).
            const yaw = Math.atan2(-dz, dx),
              delay = Math.max(0, d - 160) * ALERT_RIPPLE;
            a.alert(yaw, rand(ALERT_HOLD[0], ALERT_HOLD[1]), delay);
            // Waterfowl burst up and away from the sound, a beat after they hear it -- staggered, so a pond goes up in a ragged flurry rather than on a single frame.
            if (
              a._fl !== null &&
              a._fl.spec.water === 1 &&
              CONFIG.flight.enabled &&
              Math.random() < FLIGHT_ON_ALERT &&
              this._observable(a) // a flurry no one sees is only a reshuffle
            ) {
              a._fl.fleeYaw = yaw + Math.PI;
              a._fl.flyIn = delay + rand(0.15, 0.9);
            }
          }
        }

        // A bout of howls from a bearing, starting after a delay.
        // Placed well beyond the fog wall: the point is that it comes from somewhere you cannot see, and could not reach.
        howlFrom(bear, delay, count) {
          this._howlDir = bear;
          this._howlIn = Math.max(0.01, delay);
          this._howlLeft = count || 1;
        }

        _dread(dt) {
          // A howl already promised, waiting out its gap.
          if (this._howlIn > 0) {
            this._howlIn -= dt;
            if (this._howlIn <= 0) {
              const f = this.anchor;
              if (SOUND)
                SOUND.dark(
                  "howl",
                  f.x + Math.cos(this._howlDir) * 240,
                  f.z + Math.sin(this._howlDir) * 240,
                );
              // Still one event, not several: the bout is scheduled off its own last call, and it wanders as it goes.
              if (--this._howlLeft > 0) {
                this._howlIn = rand(HOWL_AGAIN[0], HOWL_AGAIN[1]);
                this._howlDir += (Math.random() * 2 - 1) * HOWL_DRIFT;
              }
            }
          }
          this._dreadT -= dt;
          if (this._dreadT > 0) return;
          this._dreadT = rand(DREAD_GAP[0], DREAD_GAP[1]);

          const bear = Math.random() * Math.PI * 2;
          const r = Math.random();
          const doAlert = r < 0.8,
            doHowl = r >= 0.55;
          // A howl with no alert arrives immediately; one that answers an alert waits, so the herd is right before you know why.
          if (doHowl)
            this.howlFrom(
              bear,
              doAlert ? rand(HOWL_DELAY[0], HOWL_DELAY[1]) : 0.01,
              // A bout that answers an alert runs longer than one that arrives out of nowhere: the herd has already told you to pay attention, so there is something to sustain.
              doAlert
                ? Math.round(rand(HOWL_BOUT[0], HOWL_BOUT[1]))
                : Math.round(rand(1, 2)),
            );
          if (doAlert) this.alertHerd(bear);
        }

        // ---- Simulation: advance the clock, drive the selected animal, jump.
        updateSim(h, inputs) {
          // simTime advances even when frozen: it is the ANIMATION clock, and stopping it would freeze the moths, birds, clouds and every idle pose along with the world.
          this.simTime += h;
          if (this.simFrozen) return; // no thinking, no driving, no movement
          DRIVE.sprint = inputs.sprint;
          // Everyone who isn't being driven thinks for themselves.
          const A = this.animals;
          const _t0 = performance.now();
          for (let i = 0; i < A.length; i++) {
            const a = A[i];
            if (a !== this.selected && !a.aloft) a.think(h, A); // a flight is a plan: nothing to think
          }
          // Accumulate, do not blend: updateSim runs once per substep, so blending would report one substep against a SIM bracket covering all of them.
          this._thinkAcc += performance.now() - _t0;
          this._flightStep(h);

          const sel = this.selected;
          // Selected mid-flight: you ride along, and control begins at touchdown.
          // A hop pressed in the air is dropped, not saved to fire the moment it lands.
          if (sel && sel.aloft) this.input.clearHop();
          if (sel && !sel.aloft) {
            const gp = sel.group.position;
            // The stick is a DIRECTION device, so it is read CAMERA-RELATIVE: its vector becomes a world heading and the animal turns toward it at its own turnSpeed.
            // Nothing strafes.
            // Keys stay tank, because a key is a verb ("turn left"), not a direction.
            const sx = inputs.stickX,
              sy = inputs.stickY;
            const stickDrive = sx !== 0 || sy !== 0;
            if (stickDrive) {
              this._yawEase = 0; // the stick steers by heading, not by rate
              const mag = Math.min(1, Math.sqrt(sx * sx + sy * sy));
              // camera's forward and right, flattened to the ground
              const cam = this.camera.position,
                tgt = this.controls.target;
              let fx = tgt.x - cam.x,
                fz = tgt.z - cam.z;
              const fl = Math.sqrt(fx * fx + fz * fz) || 1;
              fx /= fl;
              fz /= fl;
              const rx = -fz,
                rz = fx; // right = forward x up
              // stick vector -> desired world direction
              const dx = fx * sy + rx * sx,
                dz = fz * sy + rz * sx;
              // Animal yaw convention: its forward is (cos a, -sin a) in xz, so the heading that points along (dx, dz) is atan2(-dz, dx).
              const want = Math.atan2(-dz, dx);
              let diff = want - sel.group.rotation.y;
              diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // to [-PI, PI]
              // turn at the animal's own rate, and never past the target
              const step = sel.turnSpeed * h;
              sel.rotate(
                THREE.MathUtils.clamp(diff / Math.max(step, 1e-6), -1, 1),
                h,
              );
              // depth 0..0.7 walks, 0.7..1 ramps into sprint
              const boost =
                mag <= 0.7
                  ? mag / 0.7
                  : 1 + (sel.sprint - 1) * ((mag - 0.7) / 0.3);
              DRIVE.sprint = boost > 1.15; // let the rabbit hop bigger when sprinting
              // Ease off while swinging round, so a sharp reversal pivots rather than driving a long arc out of frame first.
              const align = 0.3 + 0.7 * Math.max(0, Math.cos(diff));
              sel.move(align, 0, h, boost);
            } else {
              if (inputs.pace) {
                const boost = inputs.sprint ? sel.sprint : 1;
                sel.move(inputs.pace, 0, h, boost);
              }
              // A/D and Q/E are the same control here, summed so holding both doesn't cancel out into a dead key.
              // Shift means the camera, not the animal: Q/E are lent out for as long as it is held.
              // Clamped after summing, or holding A and Q together turns at double rate.
              const yaw = THREE.MathUtils.clamp(
                inputs.turn + (inputs.camOrbit ? 0 : inputs.camSpin),
                -1,
                1,
              );
              // Eased per substep; approach() composes, so this is the same curve however many substeps the frame was cut into.
              this._yawEase +=
                (yaw - this._yawEase) * approach(KEY_TURN_EASE, h);
              if (!yaw && Math.abs(this._yawEase) < 1e-3) this._yawEase = 0;
              if (this._yawEase) sel.rotate(this._yawEase * ANIMAL_KEY_TURN, h);
            }

            sel.applySurge(h); // spend any water lunge, stick or no stick

            const grounded = sel.grounded;
            if (inputs.hop && grounded) {
              const afloat = sel.afloat;
              const jv = JUMP_V * Math.sqrt(sel.group.scale.x / 0.6);
              if (afloat <= WATER_MIN) {
                // On dry land, or still standing on the bottom: an ordinary jump.
                sel.jumpV = jv;
                this.input.clearHop();
                if (SOUND) SOUND.step(sel.type, gp.x, 0.12, gp.z, 0.7);
              } else if (sel.waterAction(afloat)) {
                // BLENDED, not switched.
                // At the waterline this is still nearly a full jump and out in the middle of the pond it is nearly pure pop, so wading in never snaps between two behaviours.
                sel.jumpV = jv * (1 - afloat * (1 - WATER_POP));
                this.input.clearHop();
                // FarmSound has no splash, and a footstep on open water is worse than nothing -- so the lunge stays silent for now.
              }
              // Otherwise the species declined, because its last stroke is still running.
              // Leave the press buffered and it fires as that one ends, which is the behaviour you want from a held button.
            }
            if (!grounded || sel.jumpV > 0) {
              sel.jumpV -= GRAVITY * h;
              sel.jumpY += sel.jumpV * h;
              if (sel.jumpY <= 0) {
                sel.jumpY = 0;
                sel.jumpV = 0;
                if (SOUND && sel.afloat <= WATER_MIN)
                  SOUND.step(sel.type, gp.x, 0.12, gp.z, 0.8);
              }
            }
          }
        }

        // Presentation: pose visible animals, bake their matrices, move camera.
        // Only the driven animal translates; others are idle, so I frustum-cull the unseen and refresh the rest on a distance cadence staggered by _simPhase.
        // Skipped animals keep their last matrices.
        updateView(dt, inputs) {
          const t = this.simTime,
            A = this.animals,
            cam = this.camera.position,
            sel = this.selected,
            frame = ++this._frame;
          // Pose-refresh LOD, tiered by apparent size: 60u is ~64px of animal, 120u ~32px, beyond that under 20px where 15fps doesn't read.
          // Staggered by _simPhase.
          // The bound is about 38 poses a frame zoomed in and 47 at full zoom-out, before the frustum cull below takes its cut.
          const NEAR2 = 60 * 60,
            FAR2 = 120 * 120;
          // View frustum for culling (last frame's camera; padding absorbs the lag).
          // Off-screen idle animals do no work at all.
          const fr = this._frustum,
            sph = this._cullSphere,
            dirty = this._dirtyList;
          dirty.length = 0;
          const _tPose = performance.now();
          let culled = 0;
          this.camera.updateMatrixWorld();
          this.camera.matrixWorldInverse.copy(this.camera.matrixWorld).invert();
          fr.setFromProjectionMatrix(
            this._frustumM.multiplyMatrices(
              this.camera.projectionMatrix,
              this.camera.matrixWorldInverse,
            ),
          );

          // Resolve overlaps (moves shoved animals) before I pose/bake, so the matrices I upload reflect final positions.
          const c0 = performance.now();
          if (!this.simFrozen) {
            // A driven animal in flight is not driven through the solver: its body is holding the landing spot, and its sweep would otherwise run from the take-off spot to there.
            Collision.solve(dt, fr, sph, sel && !sel.aloft ? sel : null);
            // After the solver, not inside it: see pushOutOf.
            Bales.separate(A);
            Scarecrows.separate(A);
          }
          perfBlend("col", performance.now() - c0);

          // Ring lives in world space: re-pin it after collision has settled the final ground position.
          // Y is never read, so jumps don't lift it.
          if (sel) this._placeRing(sel);

          for (let i = 0; i < A.length; i++) {
            const a = A[i];
            // Runs for all of them, off-screen included; emit is falloff-culled, and the fifteen mute species no-op inside vocalize.
            a.vocalCooldown -= dt;
            if (a.vocalCooldown <= 0) {
              a.vocalCooldown = rand(VOCAL_GAP[0], VOCAL_GAP[1]);
              if (SOUND) {
                const gp = a.group.position;
                SOUND.vocalize(
                  a.type,
                  gp.x,
                  gp.y + 0.9 * a.group.scale.x,
                  gp.z,
                );
              }
            }

            const p = a.group.position;
            let refresh;
            if (a === sel || Collision.moved[i]) {
              refresh = true; // driven, or shoved by collision this frame
            } else {
              // Visibility gate first -- nothing off-screen does any work.
              //
              // HYSTERESIS on this cull and the fog one below.
              // A visibility flip costs a full BatchedMesh draw-list rebuild, so one animal flapping on the boundary costs more than posing a dozen you cannot see.
              // Show on the tight test, hide only on the loose one.
              // Both slack values are free: the extra radius is off-screen by definition, and FOG_CULL is already the distance past which nothing renders at all.
              const wasVis = a._batchVisible !== false;
              sph.center.set(p.x, p.y + a._cullDY, p.z);
              sph.radius = wasVis ? a._cullR * 3 : a._cullR;
              if (!fr.intersectsSphere(sph)) {
                culled++;
                // Off-screen: hidden in the batch, and then it costs nothing at all -- no pose, no bake, no upload, and no per-instance work inside the renderer either.
                // Staleness is free to ignore because the re-entry branch below rebakes before anything is shown.
                registry.setAnimalVisible(a, false);
                continue;
              }
              const dx = p.x - cam.x,
                dy = p.y - cam.y,
                dz = p.z - cam.z;
              const d2 = dx * dx + dy * dy + dz * dz;
              // Fog cull.
              // The frustum test above only removes what's outside the view; this removes what's inside it but drowned in fog.
              // It costs one compare, since d2 is already computed for the LOD interval below, and it skips the animal's ENTIRE per-frame cost -- pose, graze, matrix bake and instance upload.
              const fc = (wasVis ? FOG_CULL : this._fogCull) + a._cullR;
              if (d2 > fc * fc) {
                culled++;
                // Past the fog there is nothing left to see, so this is the same deal as off-screen rather than a half measure.
                registry.setAnimalVisible(a, false);
                continue;
              }
              if (a._batchVisible === false || a.aloft) {
                // (aloft: it crosses the view fast, and 15fps posing would visibly stutter it) Back from hiding.
                // Its matrices are as stale as its whole absence, so it must be rebaked on the frame it reappears -- never shown first and corrected later.
                refresh = true;
              } else {
                const interval = d2 <= NEAR2 ? 1 : d2 <= FAR2 ? 2 : 4;
                refresh =
                  interval === 1 || (frame + a._simPhase) % interval === 0;
              }
            }

            if (refresh) {
              // MEASURE the pose gap, never infer it from the LOD interval: culls and tier changes both break that cadence, and the gait reads speed as displacement over dt.
              let sdt = a._poseT < 0 ? dt : t - a._poseT;
              a._poseT = t;
              if (sdt > 0.25 || sdt <= 0) {
                // A long absence: treat it as a fresh start rather than cramming minutes of travel into one frame of gait.
                sdt = dt;
                a.lastPosition.copy(a.group.position);
              }
              a.update(t, sdt);
              // Runs in flight too: leaving the ground is one of graze's exits, so a bird that takes off mid-bite lifts its head out of the grass exactly as a jumping one does.
              a.graze(t, sdt);
              if (a.aloft) a._flightNeck(); // after graze, composing with it (see _flightNeck)
              if (a.swims) a.applyFloat(t, sdt); // settle into any water
              registry.setAnimalVisible(a, true); // no-op unless it was hidden
              a.group.updateMatrixWorld(true); // recompute just this subtree
              a._bakeFrame = frame;
              dirty.push(a);
            }
          }
          this._culled = culled;
          perfBlend("pose", performance.now() - _tPose);

          const _tStream = performance.now();
          this._followSelected(dt); // selection -> camera trails it
          // Turn first, then travel: slide() moves along theta, so the other order spends this frame's distance on last frame's heading.
          this._applyOrbit(dt, inputs);
          this._flyCamera(dt, inputs); // no selection -> camera is the player
          // Wheel and pinch go through the rig, so taper its rate the same way the key path is tapered -- otherwise the two would disagree.
          this.controls.zoomSpeed = this._zoomEase(this.controls.dist);
          this.controls.apply(); // pivot/theta/phi/dist -> camera + target
          // Camera has settled: slide the endless floor/shade under it.
          this._followGround();
          const st = this.shaderTime(); // float32-safe, see SHADER_TIME_WRAP
          this._followSky(st); // sky rides the camera; clouds drift, stars blink
          // ONE clock for every surface that takes the cloud.
          // simTime, NOT shaderTime(): the wrap exists for terms like sin(t*22) that lose float32 precision, and a cloud field that is not periodic would visibly rearrange the whole farm every time it came round.
          // At 0.0055 units/sec this stays exact for days.
          for (let i = 0; i < CLOUD_SHADERS.length; i++)
            CLOUD_SHADERS[i].uniforms.uCloudT.value = this.simTime;
          this._followMoths(st);
          this._followBirds(st);
          // Drive the ripples.
          // onBeforeCompile stashed the compiled shader on the mesh, which is the only handle three gives me to a built-in material's injected uniforms.
          const gs = this._floor && this._floor.userData.shader;
          if (gs) gs.uniforms.uTime.value = st; // the same clock read above, not a second call

          // Streaming goes LAST, after the rig has settled the camera for this frame.
          // That ordering is the trick: the frustum is rebuilt from the camera about to render, so a spot judged off-screen cannot be on-screen this frame.
          // Testing against the previous frame's camera instead leaves one frame of orbiting to reveal an arrival, which no pad can fix.
          this.camera.updateMatrixWorld();
          this.camera.matrixWorldInverse.copy(this.camera.matrixWorld).invert();
          fr.setFromProjectionMatrix(
            this._frustumM.multiplyMatrices(
              this.camera.projectionMatrix,
              this.camera.matrixWorldInverse,
            ),
          );
          this._dread(dt);
          this._recycle(dirty, dt);
          // Same anchor and the same cell rule as the recycler, so the props and the herd reorganise on the same event -- never while you stand still.
          Bales.refresh(this.anchor.x, this.anchor.z);
          Scarecrows.refresh(this.anchor.x, this.anchor.z);
          Scarecrows.tick(st); // the frame's one clock read, not a second call
          perfBlend("stream", performance.now() - _tStream);
          if (SOUND) {
            const c = this.camera.position;
            SOUND.setListener(c, this.controls.target);
            SOUND.ambience(dt, c.x, c.z); // the shore is sampled where the ears are
          }

          registry.update(dirty); // uploads only the animals that changed
        }

        // Both zoom paths are multiplicative, i.e. a constant RELATIVE step, so one notch feels the same at 5m as at 60m.
        // Close in that is far too coarse, since a small camera move covers a lot of screen when you're nose to nose with a chick.
        // This tapers the rate itself toward the near limit, quadratically, giving delicate control down low and full sweep up high.
        // Keyed off distance-to-target rather than camera height, which would misbehave at shallow polar angles.
        _zoomEase(len) {
          const c = this.controls;
          const t = THREE.MathUtils.clamp(
            (len - c.minDistance) /
              Math.max(1e-6, c.maxDistance - c.minDistance),
            0,
            1,
          );
          return 0.18 + 0.82 * t * t;
        }

        // Is this ground spot safely out of view for an animal of radius r?
        // The cull radius alone guarantees it is never seen moving, but not-seen-moving is not not-seen: the fog test is what makes the arrival itself invisible.
        // RECYCLE_ARC is how much extra swing it has to survive, padded as an ANGLE because an arc costs the same swing to cross at 15 units as at 100.
        _offScreen(x, z, r) {
          const cam = this.camera.position;
          const dx = x - cam.x,
            dz = z - cam.z;
          const d = Math.sqrt(dx * dx + dz * dz);
          const s = this._cullSphere;
          s.center.set(x, r, z); // sphere sitting on the ground, not buried
          s.radius = r + RECYCLE_ARC * d;
          return !this._frustum.intersectsSphere(s);
        }

        // Distance along a bearing from the focus at which a point sits exactly D from the camera.
        // Solving |w + r*u| = D for the positive root, with w the camera-to-focus vector, so a landing can be pushed OUT along its own bearing instead of having that bearing thrown away.
        // D is always the fog line, which is far outside the orbit distance, so the discriminant is positive and there is exactly one positive root.
        _fogLineDist(ux, uz, wx, wz, camDist, D) {
          const b = wx * ux + wz * uz;
          return -b + Math.sqrt(b * b - (camDist * camDist - D * D));
        }

        // Move anything that has fallen out of the world back into it.
        // Runs over the WHOLE herd, deliberately outside the LOD and fog culls: if those ever skipped it, animals would pile up beyond the fog line and the world would empty out behind you.
        _recycle(dirty, dt) {
          const cam = this.camera.position;
          const R = FOG_CULL; // recycle radius, not the render cull
          if (!isFinite(R)) return;
          // Anchored on the rig's pivot, which is by definition whatever does not move when you turn.
          // Turning must not reshuffle the world: it drags the populated disc across the ground and re-seeds arrivals for no reason.
          const f = this.anchor;
          const cdx = cam.x - f.x,
            cdz = cam.z - f.z;
          const camDist = Math.sqrt(cdx * cdx + cdz * cdz);
          // Land outside this and the animal is past the cull the moment it arrives and gets recycled again next frame -- churn, invisible but real.
          // See recycleRadius for why it is shaped the way it is.
          const rMax = recycleRadius(camDist);
          const hide2 = FOG_OPAQUE * FOG_OPAQUE;
          // Seed on the focus's CELL, not its position: while you stand still the seeds don't change, so nothing reshuffles at the fog line.
          // The world reorganises only when you travel.
          const cellX = Math.floor(f.x / RECYCLE_CELL),
            cellZ = Math.floor(f.z / RECYCLE_CELL);
          // Camera-to-focus vector, for pushing a blocked landing out to the fog line.
          const wx = f.x - cam.x,
            wz = f.z - cam.z;
          // Travel bearing, and the share of departures it accounts for.
          // Measured from the FOCUS rather than from the input, so it is right whether you are flying the camera, driving an animal or being carried by one.
          const lf = this._lastF;
          const dfx = f.x - lf.x,
            dfz = f.z - lf.z;
          lf.x = f.x;
          lf.z = f.z;
          const sp2 = dfx * dfx + dfz * dfz;
          if (sp2 > 1e-8) this._travelDir = Math.atan2(dfz, dfx);
          const sp = Math.sqrt(sp2) / Math.max(dt, 1e-4);
          this._travelW +=
            (sp / (sp + this._herdDrift) - this._travelW) *
            approach(STREAM_EASE, dt);
          // Widest legal landing distance from the camera, for a pushed-out landing.
          // No DRY_REACH deduction here: the acceptance test checks the cull exactly, on the final spot, so a nudge off the water that overshoots is simply resampled.
          // Leaving the band wide matters because everything pushed out enters through it, and the deeper half of it is 98% fogged rather than 97%.
          const dFar = RECYCLE_FAR * R;

          const A = this.animals;
          for (let i = 0; i < A.length; i++) {
            const a = A[i];
            if (a === this.selected) continue; // never yank the one being driven
            if (a.aloft) continue; // nor one in the air: its landing spot is held until it lands
            const p = a.group.position;
            const dx = p.x - cam.x,
              dz = p.z - cam.z;
            if (dx * dx + dz * dz <= R * R) continue;

            // Deterministic per (animal, focus cell).
            // No closure here: this runs inside a per-frame loop, and a captured arrow function would be an allocation per recycled animal.
            const s0 = i * 7919 + cellX * 173 + cellZ * 397;
            const s1 = cellX * 61 + cellZ * 13;
            let nx = 0,
              nz = 0,
              ok = false;
            // Species-appropriate ground: swimmers want water, everything else must be dry or it lands stuck against a bank.
            // A batch instance can never change species, so this is the only thing keeping ponds populated as you roam.
            for (let k = 0; k < 8 && !ok; k++) {
              // Bearing: the flux law when your motion is what is emptying the world, uniform when it isn't.
              // Biasing toward the view and then rejecting the view cone is self-defeating: every forward sample is discarded and the survivors pile into a ring outside peripheral vision.
              // Nothing lands ahead at all, the flanks run 1.24x dense, and flying out over empty ground and turning round shows twice as many animals as were in front of you.
              const hb = _thash(s0 + k * 31, s1 + k),
                ha = _thash(s0 + (k + 300) * 31, s1 + k + 300);
              const ang =
                hb < this._travelW
                  ? this._travelDir + Math.asin(2 * ha - 1)
                  : (ha * 2 - 1) * Math.PI;
              const ux = Math.cos(ang),
                uz = Math.sin(ang);
              // Radius uniform by AREA rather than by radius, so density comes out CONSTANT with range and the world reads equally alive at every distance.
              // Sampling uniformly in radius, or only in a far ring, parks the whole fixed pool in the fog and leaves the foreground to be filled by animals walking in at half a unit a second.
              const u = _thash(s0 + (k + 100) * 31, s1 + k + 100);
              let dist = Math.sqrt(
                RECYCLE_MIN * RECYCLE_MIN +
                  u * Math.max(rMax * rMax - RECYCLE_MIN * RECYCLE_MIN, 0),
              );
              nx = f.x + ux * dist;
              nz = f.z + uz * dist;
              // In shot and not yet lost in fog?
              // Then PUSH IT OUT along the same bearing rather than discarding the bearing.
              // This keeps the aggregate isotropic: a direction you happen to be facing still gets its share, just pushed further out.
              // Rejecting instead only ever refills where you are not looking.
              let ddx = nx - cam.x,
                ddz = nz - cam.z;
              if (
                ddx * ddx + ddz * ddz < hide2 &&
                !this._offScreen(nx, nz, a._cullR)
              ) {
                const u2 = _thash(s0 + (k + 200) * 31, s1 + k + 200);
                dist = this._fogLineDist(
                  ux,
                  uz,
                  wx,
                  wz,
                  camDist,
                  FOG_OPAQUE + u2 * Math.max(dFar - FOG_OPAQUE, 0),
                );
                nx = f.x + ux * dist;
                nz = f.z + uz * dist;
              }
              const wet = isWater(nx, nz);
              if (k < 5 && (a.swims ? !wet : wet)) continue; // resample
              // Dry the spot BEFORE it is judged, never after.
              // Nudging a landing off the water can walk it up to DRY_REACH toward the camera, so testing first would test a point the animal never occupies.
              if (!a.swims && isWater(nx, nz)) {
                const d = dryNear(nx, nz);
                nx = d.x;
                nz = d.z;
              }
              // Two ways to be legal, and BOTH are needed.
              //
              // Off-screen covers the near field and everything to the sides: what moves while off-screen cannot be seen moving, so it may land at any range and simply be there when you turn.
              //
              // The fog line covers the ground ahead, which off-screen alone cannot reach: everything in front of you is on-screen by definition.
              // Drop this term and the cone ahead empties completely inside ten seconds of travel.
              //
              // The cull test is first and applies to both.
              // It is checked on the FINAL spot, after any nudge off the water, so a landing can never arrive already past the fog and churn straight back.
              ddx = nx - cam.x;
              ddz = nz - cam.z;
              const cd2 = ddx * ddx + ddz * ddz;
              ok =
                cd2 <= R * R &&
                (cd2 >= hide2 || this._offScreen(nx, nz, a._cullR));
            }
            // No legal spot this frame?
            // Then don't move it.
            // It is already parked beyond the fog where nobody can see it, the frustum will have moved by the next frame, and retrying costs nothing.
            // This is what makes no-pop a guarantee rather than a high probability.
            if (!ok) continue;
            p.x = nx;
            p.z = nz;
            // Forget the old errand: it is on the far side of the world now.
            a.group.rotation.y = _thash(s0 + 6200, s1 + 200) * Math.PI * 2;
            a._tx = null;
            a._pause = _thash(s0 + 9300, s1 + 300) * a.beh.p[1];
            // Or the teleport registers as velocity and it arrives sprinting.
            a.lastPosition.copy(p);
            // Hand the draught over explicitly: applyFloat has already pushed y down for the OLD spot, and the pose loop has been anchored to it since.
            p.y += a._sink;
            a._sink = a.swims && isWater(nx, nz) ? a._floatDepth : 0;
            p.y -= a._sink;
            // Bake and upload NOW.
            // Streaming runs after the pose loop, so nothing else this frame will touch this animal and an unbaked one would render a frame at the position it just left.
            // The stamp keeps it off the list twice: the pose loop has usually queued it already.
            a.group.updateMatrixWorld(true);
            if (dirty && a._bakeFrame !== this._frame) dirty.push(a);
            a._bakeFrame = this._frame;
          }
        }

        // The point the world is pinned to: whatever does NOT move when you turn.
        // That is the rig's pivot by definition, in either mode, so there is nothing left to decide here.
        // Everything that tiles or streams reads this rather than choosing for itself: two systems disagreeing about the anchor is a seam you cannot see until it moves.
        get anchor() {
          return this.controls.pivot;
        }

        // Chase the driven animal by moving the PIVOT, which in orbit mode is the target and carries the camera with it.
        // Following its heading would swing the world every time you steer, so only position is tracked.
        // Y is ignored: tracking the gait bob would pump the camera every stride.
        _followSelected(dt) {
          const a = this.selected;
          if (!a) return;
          const p = this.controls.pivot;
          // frame-rate independent exponential approach
          const k = approach(CHASE_RATE, dt);
          p.x += (a.group.position.x - p.x) * k;
          p.z += (a.group.position.z - p.z) * k;
        }

        // With nothing selected the camera IS the player: every movement input translates it across the world instead of driving an animal, which is what makes the endless ground usable.
        // In fly mode the pivot is the camera, so moving the pivot moves the camera and the target rides along -- no offset to preserve, nothing to keep in step.
        _flyCamera(dt, inputs) {
          if (this.selected) return;
          // Arrows are already folded into pace/turn by Input.poll, so there is one pair of axes here rather than two that had to be subtracted from each other.
          let fwd = THREE.MathUtils.clamp(inputs.pace, -1, 1);
          let strafe = THREE.MathUtils.clamp(inputs.turn, -1, 1);
          // THE STICK TURNS, IT DOES NOT STRAFE.
          // A keyboard has two ways to go sideways; a phone has one stick and no Q/E, which left sideways as the only thing its horizontal axis could do.
          // So on the stick the horizontal axis yaws instead.
          // Its sign is already inputs.turn, which is the same sign Q/E use, so left is left in both.
          if (inputs.stickX || inputs.stickY) {
            const az = THREE.MathUtils.clamp(inputs.turn, -1, 1);
            if (az) this.controls.rotate(az * FLY_STICK_TURN * dt, 0);
            strafe = 0;
          }
          if (!fwd && !strafe) return;
          // Clamping the two axes INDEPENDENTLY is a square gate: W+A asks for one unit on each and gets sqrt(2) of travel.
          // Normalise the pair, and only when it is over-long, so an analogue half-push still throttles.
          // Same rule as Animal.move().
          const lenSq = fwd * fwd + strafe * strafe;
          if (lenSq > 1) {
            const inv = 1 / Math.sqrt(lenSq);
            fwd *= inv;
            strafe *= inv;
          }
          const c = this.controls;
          // Speed scales with the rig distance, same reasoning as the zoom taper: a fixed rate crawls when zoomed out and lurches when zoomed in.
          const speed =
            FLY_RATE * c.dist * (inputs.sprint ? FLY_SPRINT : 1) * dt;
          c.slide(fwd * speed, -strafe * speed); // strafe > 0 is LEFT
        }

        _applyOrbit(dt, inputs) {
          const AZ_RATE = FLY_KEY_TURN,
            ZOOM_RATE = 3.2;
          // The only keys that touch the camera.
          // Q/E turn it in fly mode, because there the camera IS what you are driving; with an animal selected they turn the animal instead.
          // SHIFT+Q/E is the other thing entirely: swing the camera AROUND whatever it is looking at, in both modes.
          const orbiting = !!inputs.camOrbit;
          // TURNING AND TRAVELLING COMPOSE ALREADY -- both run every frame, and neither cancels the other.
          // What went wrong is the RADIUS.
          // Fly speed is FLY_RATE * dist, so at dist 30 turning at 1.6 rad/s traces a 9-unit circle: you are moving the whole time and it reads as spinning on the spot.
          // Strafing feels right by comparison for exactly this reason: it adds a straight component instead of curving the one you have.
          // So the rate eases off with how hard you are travelling.
          // Parked, it is a look; under way, it is a bank, and the arc opens out to something you can fly along.
          // Eased, not switched: a key is binary, and reading it straight kinks the turn rate by 2.6x on the frame W goes down.
          const want = this.selected ? 0 : Math.min(1, Math.abs(inputs.pace));
          this._travelEase += (want - this._travelEase) * approach(7, dt);
          const rate = AZ_RATE * (1 - 0.62 * this._travelEase);
          // The key sets a TARGET velocity; the camera eases toward it.
          // Target is zero whenever Q/E are lent to the animal, so a spin in progress when you click one coasts out rather than carrying on or stopping dead.
          const spinWant =
            orbiting || !this.selected ? inputs.camSpin * rate : 0;
          this._spinVel +=
            (spinWant - this._spinVel) * approach(KEY_TURN_EASE, dt);
          // Snapped to zero once it is below anything visible, so the early-out below still fires and a parked camera stays genuinely still.
          if (!spinWant && Math.abs(this._spinVel) < 1e-3) this._spinVel = 0;
          const az = this._spinVel * dt;
          const zoom =
            inputs.zoom * ZOOM_RATE * dt * this._zoomEase(this.controls.dist);
          if (!az && !zoom) return;
          // Identical calls to the ones the drag path makes, so keys and mouse cannot drift apart.
          // Clamping lives in the rig.
          // One method for both ways of asking, so the keys and the drag cannot drift apart.
          if (az) {
            if (orbiting) this.controls.orbitRotate(az, 0);
            else this.controls.rotate(az, 0);
          }
          if (zoom) this.controls.dolly(1 + zoom);
        }

        render() {
          this.renderer.render(this.scene, this.camera);
        }

        // Parked (splash / paused / ctrl-drag): matrices aren't auto-updated, so refresh the whole scene once and force-upload every instance.
        renderParked() {
          // Parked frames still orbit the camera (ctrl-drag), so the ground and sky have to keep up here too, before matrices are baked.
          this._followGround();
          const st = this.shaderTime();
          this._followSky(st);
          for (let i = 0; i < CLOUD_SHADERS.length; i++)
            CLOUD_SHADERS[i].uniforms.uCloudT.value = this.simTime;
          this._followMoths(st);
          this._followBirds(st);
          this.scene.updateMatrixWorld(true);
          registry.update();
          this.renderer.render(this.scene, this.camera);
        }

        // Also the DPR path (see init): re-read on every call, because a window moved to a screen of another density keeps its CSS size and would otherwise go on rendering at the old density -- 4x the pixels on a 1x monitor, or a blurry 1x on a 2x one.
        onResize() {
          this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          this.camera.aspect = innerWidth / innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(innerWidth, innerHeight);
          if (!_loopRunning || this.paused) this.renderParked();
        }
      }

      // ======================================================================
      // Boot + wiring
      // ======================================================================
      // RUNTIME INVARIANTS, checked once after the first compiled frame.
      // One per bug class this file has actually shipped, so each of those can only happen once.
      // The static ones live with the WORLD INVARIANTS; these need built materials.
      function bootChecks(game) {
        const bad = (m) => {
          throw new Error("boot check: " + m);
        };
        // Shadow markers: the surface clip must have run on every one (see shadowMark).
        const markers = [
          ["animal", registry.shadow],
          ["bale", Bales.shadow],
          ["scarecrow", Scarecrows.shadow],
        ];
        for (let i = 0; i < markers.length; i++) {
          const [who, mesh] = markers[i];
          if (
            mesh &&
            !(mesh.material.userData && mesh.material.userData.surfaceClip)
          )
            bad(
              `${who} shadow marker lost its surface clip -- its hook was replaced, not chained`,
            );
        }
        // One fog colour.
        // A fresh THREE.Color(hex) in a raw shader is the horizon-popping bug.
        if (game.scene.fog.color.getHex() !== FOG_HEX)
          bad("scene fog is not FOG_HEX");
        const raw = [
          ["sky horizon", game._skyMat && game._skyMat.uniforms.uLow],
          ["moth fog", game._mothMat && game._mothMat.uniforms.uFogCol],
          ["bird fog", game._birdMat && game._birdMat.uniforms.uFogCol],
        ];
        for (let i = 0; i < raw.length; i++)
          if (raw[i][1] && raw[i][1].value !== FOG_DISPLAY)
            bad(
              `${raw[i][0]} is not FOG_DISPLAY -- a raw shader given a linear colour shows it ~17x too dark`,
            );
        // Zero inverse mass now MEANS "held for a landing bird": no body may start with it, and no animal may start in the air.
        for (let i = 0; i < Collision.n; i++)
          if (!(Collision.invm0[i] > 0))
            bad(
              `collision body ${i} has no mass -- it would read as a held landing spot`,
            );
        for (let i = 0; i < game.animals.length; i++)
          if (game.animals[i].aloft)
            bad(`${game.animals[i].type} started in the air`);
        // Every flier must have a height, or its neighbours' clearance is computed from nothing.
        for (let i = 0; i < game.animals.length; i++)
          if (!(game.animals[i]._height > 0))
            bad(`${game.animals[i].type} has no measured height`);
        // The flight ceiling, computed here from the finished world, must clear everything in it.
        {
          const c = game._ceiling();
          if (!(Scarecrows.topY > 3))
            bad(`scarecrow height measured as ${Scarecrows.topY}`);
          if (!(c > Scarecrows.topY && c > BALE_TOP))
            bad(`flight ceiling ${c} does not clear the props`);
          for (let i = 0; i < game.animals.length; i++)
            if (!(c > game.animals[i]._height))
              bad(`flight ceiling ${c} is below a ${game.animals[i].type}`);
        }
        // Part freezing must never catch an eye: they blink by scale.
        const A = game.animals;
        for (let i = 0; i < A.length; i++)
          for (let e = 0; e < A[i].eyes.length; e++)
            if (!A[i].eyes[e].mesh.matrixAutoUpdate)
              bad(`${A[i].type}: an eye was frozen, it would never blink`);
      }

      function init() {
        window.addEventListener("contextmenu", (e) => e.preventDefault());
        const splash = document.getElementById("splash");

        {
          const probe = document.createElement("canvas");
          const gl = probe.getContext("webgl2");
          if (!gl) {
            window.__boot.fatal(
              "WEBGL 2 UNAVAILABLE",
              "This browser or machine cannot provide a WebGL 2 context. Usually a " +
                "disabled GPU, an out-of-date driver, or hardware acceleration switched off.",
            );
            return;
          }
          gl.getExtension("WEBGL_lose_context")?.loseContext();
        }

        try {
          GAME = new Game(document.getElementById("container"));
          // COMPILE EVERYTHING NOW, where failure has somewhere to go.
          // three compiles lazily, on the first frame a material is actually drawn -- so a broken shader patch in something that happens to be off-screen at boot would throw minutes into a session, mid-frame, with no one watching the console.
          // compile() builds every program in the scene (running every onBeforeCompile, so every patch() anchor is checked), and a first use of each forces three's error check, which the onShaderError hook turns into a throw.
          // Then one real frame.
          const R = GAME.renderer;
          R.compile(GAME.scene, GAME.camera);
          const progs = R.info.programs || [];
          for (let i = 0; i < progs.length; i++)
            if (typeof progs[i].getUniforms === "function")
              progs[i].getUniforms();
          GAME.render();
          bootChecks(GAME);
        } catch (err) {
          window.__boot.fatal(
            "COULD NOT START",
            (err && err.message) || "The renderer failed to initialise.",
          );
          throw err;
        }

        addEventListener("resize", () => GAME.onResize());
        // Crossing to a monitor of another density need not fire resize, so watch the density itself: a media query pinned to the current DPR changes exactly once, then re-arms.
        const watchDpr = () =>
          matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener(
            "change",
            () => {
              GAME.onResize();
              watchDpr();
            },
            { once: true },
          );
        watchDpr();
        initCameraHeight(GAME.renderer.domElement, GAME.controls);

        window.__boot.ready("");

        let started = false;
        const startGame = () => {
          if (started) return;
          started = true;
          removeEventListener("keydown", startKey); // however it started: a click must not leave Space eaten
          SOUND = new FarmSound();
          SOUND.start();
          if (SOUND.muted)
            document.getElementById("muteBtn").classList.add("muted");
          splash.style.pointerEvents = "none";
          splash.classList.add("hidden");
          setTimeout(() => splash.remove(), 600);
          startMainLoop();
        };
        splash.addEventListener("click", startGame);
        // The splash says ENTER, so Enter enters (Space too).
        // Alt+Enter is fullscreen, not this.
        // Space is also the hop key and Input has already buffered it, so that press is dropped: starting the game must not also make the first animal jump.
        const startKey = (e) => {
          if (e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
          if (
            e.code !== "Enter" &&
            e.code !== "NumpadEnter" &&
            e.code !== "Space"
          )
            return;
          e.preventDefault();
          startGame();
          GAME.input.clearHop();
        };
        addEventListener("keydown", startKey);

        const fsBtn = document.getElementById("fullscreenBtn");
        const fsCapable = !!(
          document.documentElement.requestFullscreen ||
          document.documentElement.webkitRequestFullscreen
        );
        if (fsCapable)
          fsBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleFullscreen();
          });
        else fsBtn.style.display = "none";

        const helpBtn = document.getElementById("helpBtn");
        const helpPanel = document.getElementById("helpPanel");
        const helpKeys = document.getElementById("helpKeys");
        // Grouped by WHAT YOU ARE DOING, not by key.
        // The controls change meaning with the selection, so that split is the first thing the panel has to communicate.
        const renderHelpKeys = () => {
          const sec = (t) => `<b class="sec">${t}</b>`;
          const rows = [];
          if (isTouchOnly()) {
            rows.push("<b>DRAG</b> circle what you are looking at");
            rows.push("<b>TAP</b> an animal to drive it");
            rows.push("<b>PINCH</b> zoom &middot; also sets fly speed");
            rows.push(
              "<b>2 FINGERS</b> up and down for height, sideways to slide",
            );
            rows.push("<b>SLIDERS</b> sound panel, top right");
            rows.push(
              "<b>STICK</b> fly, or move what you are driving &middot; push fully to sprint",
            );
            rows.push("<b>HOP</b> jump, or swim in water");
          } else {
            // Split by WHAT A KEY DOES, not by which mode you are in.
            // W/S is forward and back either way and Q/E turns whatever you are driving.
            // A/D is the only key whose meaning changes.
            rows.push("<b>CLICK</b> an animal to drive it");
            rows.push(sec("Camera"));
            rows.push("<b>DRAG</b> turn the view");
            rows.push(
              "<b>SHIFT+DRAG</b> or <b>SHIFT+Q/E</b> circle what you see",
            );
            rows.push("<b>RIGHT-DRAG</b> pan &middot; not while driving");
            // The one genuinely surprising coupling in the whole thing: fly speed scales with the rig distance, so zooming in slows you down and nothing else on screen says so.
            rows.push(
              "<b>WHEEL</b> or <b>+/-</b> zoom &middot; also sets fly speed",
            );
            rows.push("<b>CTRL+DRAG</b> camera height");
            rows.push(sec("Moving &mdash; WASD or ARROWS"));
            rows.push(
              "<b>W/S</b> forward and back &middot; <b>SHIFT</b> faster",
            );
            rows.push(
              "<b>Q/E</b> turn the camera, or the animal you are driving",
            );
            rows.push("<b>A/D</b> strafe the camera, or turn the animal");
            rows.push(sec("Driving an animal"));
            rows.push("<b>SPACE</b> hop, or swim in water");
            rows.push(
              "<b>V</b> call out &middot; not every animal has a voice",
            );
            rows.push(sec("Everything else"));
            rows.push("<b>P</b> pause the sim &middot; <b>ESC</b> the game");
            rows.push("<b>M</b> mute &middot; <b>K</b> sound panel");
            rows.push("<b>H</b> help &middot; <b>TAB</b> stats");
          }
          // Each row is its own block rather than <br />-joined, so the spacing above a heading is the heading's own margin.
          helpKeys.innerHTML = rows
            .map((r) => (r.startsWith("<b class") ? r : `<div>${r}</div>`))
            .join("");
        };
        renderHelpKeys();
        helpBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          helpPanel.classList.toggle("show");
        });
        document.addEventListener("pointerdown", (e) => {
          if (
            helpPanel.classList.contains("show") &&
            !helpPanel.contains(e.target) &&
            !helpBtn.contains(e.target)
          )
            helpPanel.classList.remove("show");
        });

        const doMute = () => {
          if (!SOUND) return;
          const m = SOUND.toggleMute();
          document.getElementById("muteBtn").classList.toggle("muted", m);
        };
        document.getElementById("muteBtn").addEventListener("click", (e) => {
          e.stopPropagation();
          doMute();
        });

        // ====================================================================
        // SOUND PANEL -- K, or the sliders icon
        // ====================================================================
        // Everything in here is something a listener might want: silence the wind, silence one animal, hear what a thing sounds like near and far.
        // The dread triggers stay: they are the one part of this world you would otherwise wait minutes to see.
        // Reachable from an icon rather than only a key, because a phone has no K.
        let audPanel = null;
        const buildAudition = () => {
          const el = document.createElement("div");
          el.id = "audPanel";
          el.style.cssText =
            "position:fixed;right:12px;top:48px;z-index:60;max-height:calc(100vh - 64px);overflow:auto;" +
            "background:rgba(12,14,18,.92);color:#cfd6e0;font:11px ui-monospace,monospace;" +
            "padding:10px 12px;border:1px solid #2c3340;border-radius:8px;min-width:300px;max-width:calc(100vw - 24px)";
          const head = document.createElement("div");
          head.style.cssText = "margin-bottom:8px;line-height:1.5";
          head.innerHTML =
            "<b>SOUND &amp; NIGHT</b><br>" +
            "<span style='opacity:.65'>near = 8u, far = 70% of this sound's range.<br>" +
            "each press steps to the next variant.</span>";
          el.appendChild(head);
          const bedB = document.createElement("button");
          bedB.style.cssText =
            "font:11px ui-monospace,monospace;border:1px solid #39424f;border-radius:4px;" +
            "padding:3px 8px;margin-bottom:8px;cursor:pointer;width:100%";
          const syncBed = () => {
            const off = SOUND && SOUND.bedMuted;
            bedB.textContent = off
              ? "background: OFF (wind + insects)"
              : "background: on (wind + insects)";
            bedB.style.background = off ? "#5a2730" : "#232a34";
            bedB.style.color = off ? "#ffd9d9" : "#cfd6e0";
          };
          bedB.onclick = () => {
            if (SOUND) SOUND.toggleBed();
            syncBed();
          };
          syncBed();
          el.appendChild(bedB);
          const bulk = document.createElement("div");
          bulk.style.cssText = "display:flex;gap:4px;margin-bottom:10px";
          el.appendChild(bulk);
          const btn = (label, w) => {
            const b = document.createElement("button");
            b.textContent = label;
            b.style.cssText =
              "font:11px ui-monospace,monospace;background:#232a34;color:#cfd6e0;border:1px solid #39424f;" +
              "border-radius:4px;padding:2px 0;margin-right:4px;cursor:pointer;width:" +
              w +
              "px";
            return b;
          };
          const variant = {};
          const rows = []; // every row's mute button, so mute-all can repaint them
          // One row builder for both tables: a species voice and a thing in the dark audition identically, they just come from different places and carry different profiles.
          const addRow = (s, list, prof) => {
            const row = document.createElement("div");
            row.style.cssText =
              "display:flex;align-items:center;gap:4px;margin:2px 0";
            const name = document.createElement("span");
            name.textContent = s;
            name.style.cssText = "width:74px;display:inline-block";
            row.appendChild(name);
            const vlabel = document.createElement("span");
            vlabel.style.cssText = "width:30px;opacity:.55";
            const play = (dist) => {
              variant[s] = (variant[s] || 0) + 1;
              const i = SOUND.audition(s, dist, variant[s] - 1);
              vlabel.textContent =
                i < 0 ? "--" : "v" + (i + 1) + "/" + list.length;
            };
            const nearB = btn("near", 44),
              farB = btn("far", 40);
            nearB.onclick = () => play(8);
            farB.onclick = () => play(prof.max * 0.7);
            row.appendChild(nearB);
            row.appendChild(farB);
            row.appendChild(vlabel);
            const muteB = btn("mute", 46);
            const sync = () => {
              const on = SOUND && SOUND.isMuted(s);
              muteB.textContent = on ? "muted" : "mute";
              muteB.style.background = on ? "#5a2730" : "#232a34";
              muteB.style.color = on ? "#ffd9d9" : "#cfd6e0";
            };
            muteB.onclick = () => {
              if (SOUND) SOUND.toggleType(s);
              sync();
            };
            sync();
            rows.push({ type: s, sync });
            row.appendChild(muteB);
            el.appendChild(row);
          };
          // Bulk mute covers exactly the rows shown, so what the panel does and what the panel displays cannot disagree.
          const bulkSet = (on) => {
            for (const r of rows) {
              if (SOUND.isMuted(r.type) !== on) SOUND.toggleType(r.type);
              r.sync();
            }
          };
          const allB = btn("mute all", 80),
            noneB = btn("unmute all", 92);
          allB.onclick = () => bulkSet(true);
          noneB.onclick = () => bulkSet(false);
          bulk.appendChild(allB);
          bulk.appendChild(noneB);

          // Only what can actually make a sound.
          for (const [s] of SPECIES)
            if (SOUND && SOUND._voices[s])
              addRow(
                s,
                SOUND._voices[s],
                SPECIES_VOICE[s] || SPECIES_VOICE_DEFAULT,
              );
          const hdr = document.createElement("div");
          hdr.textContent = "out there, never seen";
          hdr.style.cssText =
            "margin:10px 0 4px;opacity:.5;border-top:1px solid #2c3340;padding-top:8px";
          el.appendChild(hdr);
          for (const k of ["owl", "crow", "howl"])
            addRow(k, SOUND && SOUND._ambient[k], AMBIENT_AUDIO[k]);
          // The dread event is minutes apart by design, which makes it untestable by waiting.
          // These call the same two methods the scheduler does, so what you are testing is the real thing and not a demo of it.
          const dhdr = document.createElement("div");
