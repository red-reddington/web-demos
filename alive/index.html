          dhdr.textContent = "the herd hears something";
          dhdr.style.cssText =
            "margin:10px 0 4px;opacity:.5;border-top:1px solid #2c3340;padding-top:8px";
          el.appendChild(dhdr);
          const drow = document.createElement("div");
          drow.style.cssText = "display:flex;gap:4px;flex-wrap:wrap";
          const fire = (label, w, fn) => {
            const b = btn(label, w);
            b.onclick = () => {
              if (!GAME) return;
              const bear = Math.random() * Math.PI * 2;
              fn(bear);
            };
            drow.appendChild(b);
          };
          fire("alert", 56, (b) => GAME.alertHerd(b));
          fire("alert + howl", 96, (b) => {
            GAME.alertHerd(b);
            GAME.howlFrom(
              b,
              rand(HOWL_DELAY[0], HOWL_DELAY[1]),
              Math.round(rand(HOWL_BOUT[0], HOWL_BOUT[1])),
            );
          });
          // Flights are a minute or two apart by design: the same path the scheduler takes, now.
          // "alert" above is the test for the waterfowl burst.
          const fb = btn("a bird flies", 96); // the selected one, if it can
          fb.onclick = () => {
            if (GAME) GAME.flyNow();
          };
          drow.appendChild(fb);
          el.appendChild(drow);

          // Clicks in here must not reach the canvas, or auditioning a voice also picks an animal and swings the camera onto it.
          el.addEventListener("pointerdown", (e) => e.stopPropagation());
          document.body.appendChild(el);
          return el;
        };
        const soundBtn = document.getElementById("soundBtn");
        const toggleAudition = () => {
          if (audPanel) {
            audPanel.remove();
            audPanel = null;
          } else if (SOUND) {
            audPanel = buildAudition();
          }
          if (soundBtn) soundBtn.classList.toggle("on", !!audPanel);
        };
        if (soundBtn)
          soundBtn.addEventListener("click", (e) => {
            e.stopPropagation(); // or opening the panel also picks whatever is behind it
            toggleAudition();
          });

        const simBtn = document.getElementById("simBtn");
        const doFreeze = () => {
          if (!GAME) return;
          GAME.simFrozen = !GAME.simFrozen;
          simBtn.classList.toggle("frozen", GAME.simFrozen);
          simBtn.title = GAME.simFrozen
            ? "Resume the simulation (P)"
            : "Pause the simulation (P)";
          // The world is frozen, not the frame loop -- so redraw once here in case the loop is itself parked (ESC, or a still camera).
          if (!_loopRunning || GAME.paused) GAME.renderParked();
        };
        simBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          doFreeze();
        });

        const statsEl = document.getElementById("stats");
        const statsExtra = document.getElementById("statsExtra");
        const refreshStatsExtra = () => {
          if (!GAME || !STATS_OPEN) return;
          statsExtra.textContent = formatRendererStats(GAME.renderer);
        };
        window.addEventListener("keydown", (e) => {
          if (e.altKey && e.code.toLowerCase() === "enter") {
            e.preventDefault();
            toggleFullscreen();
            return;
          }
          if (e.code === "KeyM") {
            doMute();
            return;
          }
          if (e.code === "KeyP") {
            // guard here, not below: this sits above the shared e.repeat check so a held key would otherwise toggle many times a second
            if (!e.repeat) doFreeze();
            return;
          }
          if (e.repeat) return;
          if (e.code === "Tab") {
            e.preventDefault();
            STATS_OPEN = statsEl.classList.toggle("expanded");
            refreshStatsExtra();
          } else if (e.code === "KeyK") {
            toggleAudition();
          } else if (e.code === "KeyV") {
            if (GAME) GAME.callSelected();
          } else if (e.code === "KeyH") {
            helpPanel.classList.toggle("show");
          }
        });
      }

      // ======================================================================
      // Main loop -- substepped, pause-aware, self-measuring.
      // ======================================================================
      function startMainLoop() {
        const game = GAME;

        const pauseOverlay = document.getElementById("pauseOverlay");
        const pauseHint = document.getElementById("pauseHint");
        pauseHint.textContent = game.input.touchOnly
          ? "tap to resume"
          : "press ENTER, ESC or click to resume";

        const setPaused = (p) => {
          if (game.paused === p) return;
          game.paused = p;
          pauseOverlay.classList.toggle("show", p);
          document.body.classList.toggle("paused", p);
          if (SOUND) SOUND.setPaused(p);
          game.input.releaseHeld();
        };

        window.addEventListener("keydown", (e) => {
          if (e.code === "Escape") {
            game.paused ? setPaused(false) : setPaused(true);
            e.preventDefault();
          } else if (
            game.paused &&
            (e.code === "Enter" || e.code === "NumpadEnter") &&
            !e.altKey && // Alt+Enter is fullscreen, and stays paused
            !e.repeat // a held Enter must not resume the instant something pauses
          ) {
            // Resume only; Enter never pauses.
            // preventDefault so a focused HUD button (the last one clicked keeps focus) is not also activated by the same press.
            setPaused(false);
            e.preventDefault();
          }
        });
        pauseOverlay.addEventListener("pointerdown", (e) => {
          if (!game.paused) return;
          if (
            e.target.closest(
              "#muteBtn,#fullscreenBtn,#helpBtn,#soundBtn,#audPanel,#helpPanel,#stats,#camHud",
            )
          )
            return;
          setPaused(false);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) setPaused(true);
          else if (SOUND) SOUND.resume();
        });
        window.addEventListener("blur", () => setPaused(true));
        window.addEventListener("focus", () => {
          if (SOUND) SOUND.resume();
        });

        const statsEl = document.getElementById("stats");
        const statsFps = document.getElementById("statsFps");
        const statsExtra = document.getElementById("statsExtra");
        statsEl.addEventListener("pointerdown", (e) => {
          STATS_OPEN = statsEl.classList.toggle("expanded");
          e.stopPropagation();
        });

        // ZOOM READOUT.
        // Polled, like CameraStore, rather than hooked: five paths move dist (wheel, pinch, selecting an animal, the stored zoom, reset) and none of them should have to know there is a label.
        // The poll is one float compare a frame; the label is re-formatted only when dist actually moved, and the DOM is touched only when the ROUNDED text differs -- a whole wheel spin is a handful of writes.
        const statsZoom = document.getElementById("statsZoom");
        let zoomDist = -1,
          zoomLabel = "";
        const pollZoom = () => {
          const c = game.controls,
            d = c.dist;
          if (d === zoomDist) return;
          zoomDist = d;
          const label = (c.zoomRef / d).toFixed(1) + "\u00d7";
          if (label === zoomLabel) return;
          zoomLabel = label;
          statsZoom.textContent = label;
        };
        // HEIGHT READOUT, same discipline as zoom: one compare a frame -- the CAMERA's height, which tilt and zoom move as well as the height gesture -- a format only when it moved, and a DOM write only when the text did.
        // One decimal under 10m, whole metres above; "+0m" at the floor exactly as the click leaves it.
        const statsHeight = document.getElementById("statsHeight");
        let hCam = NaN,
          hLabel = "";
        const pollHeight = () => {
          const c = game.controls,
            y = c.camera.position.y;
          if (y === hCam) return;
          hCam = y;
          const h = c.heightAboveFloor();
          const label =
            h < 0.05
              ? "+0m"
              : "+" + (h < 10 ? h.toFixed(1) : Math.round(h)) + "m";
          if (label === hLabel) return;
          hLabel = label;
          statsHeight.textContent = label;
        };
        statsHeight.addEventListener("pointerdown", (e) => {
          e.stopPropagation(); // down, and nothing else: not the stats toggle, not the canvas
          const c = game.controls;
          c.toFloor();
          c._changed();
        });
        statsZoom.addEventListener("pointerdown", (e) => {
          e.stopPropagation(); // reset, and nothing else: not the stats toggle, not the canvas
          const c = game.controls;
          // dolly(), not a bare assignment: in fly mode it moves the camera along its view so the point it is looking at stays put, which is what zoom means there.
          c.dolly(c.zoomRef / c.dist);
          c._changed();
        });

        const SIM_STEP = 1 / 60;
        const SIM_MAX_STEPS = 4;
        const DT_MAX = SIM_MAX_STEPS * SIM_STEP;
        const timer = new THREE.Timer();

        /* ------------------------------------------------------------------
           FRAME PACING -- the wall clock is not the display
           ------------------------------------------------------------------
           performance.now() at the top of a rAF callback jitters by a millisecond or two against a vsync that does not.
           Feed that raw delta to a camera moving at a constant speed and every frame's step is a slightly different LENGTH: the velocity is right and the spacing is not, and what you see is stepping.
           It shows worst translating past near geometry while turning, where a bale three units away moves several pixels a frame and any unevenness in that is legible.
           So the delta is SNAPPED to a whole number of refresh intervals whenever it is close to one, which is nearly always.
           The camera then moves in equal steps because it is being told about equal time.
           The interval is estimated from the frames that look like ONE refresh, and only those: a dropped frame or a hitch is excluded outright rather than averaged in, since either would drag the estimate long and then every honest frame would snap to the wrong multiple.
           Symmetric jitter around the true interval then averages out to the true interval, which is the point.
           An estimate that chases the SHORTEST frames instead -- on the reasoning that work only ever makes a frame longer -- converges BELOW the real interval, snaps every delta down to it, and quietly runs the whole world about nine percent slow.
           A change of refresh rate, a window dragged to a second monitor, is picked up in well under a second, and while it converges the deltas fall outside the tolerance and pass through untouched.
           So does anything genuinely off-cadence: lying about a 200ms frame would teleport everything.
           ------------------------------------------------------------------ */
        let _vsync = 1 / 60;
        const pacedDelta = (dt) => {
          if (dt < _vsync * 1.5) {
            _vsync += (dt - _vsync) * 0.03;
            _vsync = Math.min(1 / 24, Math.max(1 / 500, _vsync));
          }
          const n = Math.round(dt / _vsync);
          if (n < 1) return dt; // still converging on a faster display: leave it alone
          const snapped = n * _vsync;
          return Math.abs(dt - snapped) < _vsync * 0.25 ? snapped : dt;
        };

        let fpsAcc = 0,
          fpsFrames = 0;
        let extraAcc = 0,
          lastStatsText = "";

        function tick() {
          requestAnimationFrame(tick);
          timer.update();
          // Two clocks.
          // `raw` is the wall clock and is what the FPS readout counts; `dt` is paced and clamped for the sim, and at a real 10fps it claims 15.
          const raw = timer.getDelta();
          const dt = Math.min(pacedDelta(raw), DT_MAX);

          const now = performance.now();
          if (_lastRaf) perfBlend("frame", now - _lastRaf);
          _lastRaf = now;
          // Two float compares, above the pause return on purpose: ctrl-drag still moves the camera on a parked frame.
          CameraStore.poll(now);
          pollZoom(); // above the pause return too: the wheel still zooms a parked frame
          pollHeight(); // likewise: ctrl-drag still raises a parked frame
          if (game.paused) return;

          {
            const inputs = game.input.poll();
            const steps = Math.min(
              SIM_MAX_STEPS,
              Math.max(1, Math.ceil(dt / SIM_STEP)),
            );
            const hstep = dt / steps;
            const t0 = performance.now();
            game._thinkAcc = 0;
            for (let s = 0; s < steps; s++) game.updateSim(hstep, inputs);
            const t1 = performance.now();
            perfBlend("think", game._thinkAcc);
            game.updateView(dt, inputs);
            perfBlend("sim", t1 - t0);
            perfBlend("view", performance.now() - t1);
          }

          const t2 = performance.now();
          GpuTimer.begin();
          game.render();
          GpuTimer.end();
          perfBlend("draw", performance.now() - t2);
          const g = GpuTimer.poll();
          if (g >= 0)
            PERF.gpu = PERF.gpu < 0 ? g : PERF.gpu + (g - PERF.gpu) * 0.1;

          fpsAcc += raw;
          fpsFrames++;
          if (fpsAcc >= 0.5) {
            const fps = (fpsFrames / fpsAcc) | 0;
            const cpu = PERF.sim + PERF.view + PERF.draw; // work I control
            statsFps.textContent = `${fps} fps · ${cpu.toFixed(1)}ms cpu`;
            fpsAcc = 0;
            fpsFrames = 0;
          }
          if (STATS_OPEN) {
            extraAcc += raw;
            if (extraAcc >= 0.5) {
              extraAcc = 0;
              const text = formatRendererStats(game.renderer);
              if (text !== lastStatsText) {
                statsExtra.textContent = text;
                lastStatsText = text;
              }
            }
          }
        }

        _loopRunning = true;
        tick();
        return game;
      }

      init();
    </script>
  </body>
</html>
