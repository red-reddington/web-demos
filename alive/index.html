              [0, 0.45 * this.earSize, 0],
              [0, 0, 0],
              [0.18, 0.95 * this.earSize, 0.23],
            );
            this.part(
              new THREE.IcosahedronGeometry(0.5, 1),
              this.darkMat,
              ear,
              [0.04, 0.46 * this.earSize, 0],
              [0, 0, 0],
              [0.16, 0.72 * this.earSize, 0.14],
            );
            this.ears.push({
              group: ear,
              side: s,
              baseX: ear.rotation.x,
              baseY: 0,
              baseZ: ear.rotation.z,
            });
          }
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.06, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.24 * hs, 0.1 * hs, s * 0.16 * hs],
              [0, 0, 0],
              [1, 1, 0.8],
            );

          const upper = 0.6 * this.legSize,
            lower = 0.55 * this.legSize;
          for (const [x, z, phase] of [
            [0.8 * L, 0.26 * W, 0],
            [-0.9 * L, 0.3 * W, Math.PI],
            [0.8 * L, -0.26 * W, Math.PI],
            [-0.9 * L, -0.3 * W, 0],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.1,
              lowerRadius: 0.07,
              upperMat: this.bodyMat,
              lowerMat: this.bodyMat,
              hoofMat: this.hoofMat,
              hoofSize: 0.1,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.21 * L, 1.46 * H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          // Same treatment as the cow: the curve is baked into the tube so the tail follows the rump down instead of poking out on a tilted root.
          this.tube(
            this.tailRoot,
            [
              [0, 0, 0],
              [-0.1, -0.24, 0],
              [-0.14, -0.5, 0],
              [-0.12, -0.74, 0],
              [-0.07, -0.94, 0],
            ],
            0.04,
            0.022,
            this.bodyMat,
            5,
            12, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );
          this.part(
            new THREE.IcosahedronGeometry(0.12, 1),
            this.darkMat,
            this.tailRoot,
            [-0.06, -1.04, 0],
            [0, 0, 0],
            [0.7, 1.1, 0.7],
          ); // dark switch
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.0 + this.phase) * (this.initialized ? 0.04 : 0.02);
          const tr = this.tailRoot;
          if (tr)
            // A horse carries it highest of the three, which is most of what a gallop looks like from behind.
            tr.rotation.set(
              Math.sin(t * 1.6 + this.phase) * 0.12,
              tr.rotation.y,
              -this.tailLift(0.8),
            );
          const ears = this.ears;
          for (let ei = 0; ei < ears.length; ei++) {
            const ear = ears[ei];
            ear.group.rotation.set(
              ear.baseX + Math.sin(t * 1.2 + this.phase + ear.side) * 0.06,
              ear.group.rotation.y,
              ear.baseZ + Math.sin(t * 0.9 + this.phase) * 0.04,
            );
          }
        }
      }

      /* ---------------------------- HORSE -------------------------------- */
      // Same skeleton as the donkey but restyled: deeper chest, longer legs, straighter back.
      class Horse extends Animal {
        constructor(o = {}) {
          super("horse");
          const C = CONFIG.species.horse;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.97, 1.05);
          this.H = rand(0.97, 1.06);
          this.W = rand(0.96, 1.04);
          this.headSize = rand(0.95, 1.05);
          this.legSize = rand(0.97, 1.06);
          this.earSize = rand(0.92, 1.08);
          this.socks = Math.random() < 0.55; // white stockings
          this.blaze = Math.random() < 0.5; // face stripe
          const c = pick([
            { body: 0x6b4a30, mane: 0x2a1c14, muzzle: 0x4a3122 }, // bay
            { body: 0x2e2724, mane: 0x1a1614, muzzle: 0x241e1b }, // black
            { body: 0x9c6438, mane: 0xd9c39a, muzzle: 0x7c4d2a }, // chestnut/flaxen
            { body: 0xc9c4bc, mane: 0xe6e2da, muzzle: 0x9a948c }, // grey
            { body: 0xc79a63, mane: 0x3a2a1e, muzzle: 0xa87c4c }, // dun
            { body: 0x8a7364, mane: 0xefe9de, muzzle: 0x6d594c }, // roan
          ]);
          this.bodyMat = mat(tint(c.body), 0.82); // coats are glossy
          this.maneMat = mat(tint(c.mane), 0.88);
          this.muzzleMat = mat(tint(c.muzzle), 0.86);
          this.sockMat = mat(0xe8e4dc, 0.86);
          this.hoofMat = mat(0x2b2724, 0.6);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [-0.1, 1.62, 0],
            [0, 0, 0],
            [1.3 * L, 0.5 * H, 0.5 * W],
          ); // barrel
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.bodyMat,
            this.bodyRoot,
            [0.92 * L, 1.64, 0],
            [0, 0, 0],
            [0.78, 0.92, 0.9],
          ); // deep chest/shoulder
          this.part(
            new THREE.IcosahedronGeometry(0.6, 1),
            this.bodyMat,
            this.bodyRoot,
            [-0.95 * L, 1.6, 0],
            [0, 0, 0],
            [0.8, 0.94, 0.92],
          ); // powerful hindquarters

          // Neck on its own root so it swings down with the head when grazing.
          // Its long axis is Y rather than X, so the rotation is solved for that: rotating +y by phi gives (-sin phi, cos phi), set equal to the pivot-to-head bone.
          // It spans r 0.25..1.40 from the graze pivot so the inner end stays inside the barrel through the whole swing, the hull being only 0.35 from the pivot along the grazing direction.
          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(1.1 * L, 1.91 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.bodyMat,
            this.neckRoot,
            [0, 0, 0],
            [0, 0, -0.775], // long axis along the bone
            [0.62, 1.15, 0.5],
          ); // long sloping neck
          // Mane: overlapping tufts along the crest, offset perpendicular to the bone so they ride the top of the neck rather than cutting through it.
          // Laid out from the withers up to the poll.
          for (let i = 0; i < 5; i++) {
            const u = i / 4;
            this.part(
              new THREE.IcosahedronGeometry(0.3, 1),
              this.maneMat,
              this.neckRoot,
              [(-0.49 + u * 0.56) * L, (-0.08 + u * 0.58) * H, 0],
              [0, 0, 0.8], // lies along the crest
              [0.44 - u * 0.1, 0.3, 0.13],
            );
          }

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.5 * L, 2.32 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.0 * hs, 0.86 * hs, 0.66 * hs],
          ); // skull/jowl
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.bodyMat,
            this.headRoot,
            [0.46 * hs, -0.2, 0],
            [0, 0, 0],
            [1.25, 0.62, 0.62],
          ); // long straight muzzle
          this.part(
            new THREE.IcosahedronGeometry(0.2, 1),
            // a blaze horse gets a white nose instead: the marking rides an existing body part, so it can never poke out on its own
            this.blaze ? this.sockMat : this.muzzleMat,
            this.headRoot,
            [0.74 * hs, -0.27, 0],
            [0, 0, 0],
            [0.95, 0.62, 0.72],
          ); // soft nose
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.maneMat,
            this.headRoot,
            [-0.16 * hs, 0.3 * hs, 0],
            [0, 0, 0.3],
            [0.3, 0.34, 0.28],
          ); // forelock
          for (const s of [1, -1])
            this.part(
              new THREE.SphereGeometry(0.038, 6, 4),
              this.hoofMat,
              this.headRoot,
              [0.84 * hs, -0.26, s * 0.09],
              [0, 0, 0],
              [1, 1, 0.8],
            ); // nostrils
          // small pricked ears -- the clearest tell against a donkey
          for (const s of [1, -1]) {
            const ear = new THREE.Group();
            ear.position.set(-0.08, 0.24 * hs, s * 0.12 * hs);
            ear.rotation.z = -0.1;
            ear.rotation.x = s * 0.3;
            this.headRoot.add(ear);
            this.part(
              new THREE.ConeGeometry(
                0.09 * this.earSize,
                0.3 * this.earSize,
                5,
              ),
              this.bodyMat,
              ear,
              [0, 0.14 * this.earSize, 0],
            );
            this.ears.push({
              group: ear,
              side: s,
              baseX: ear.rotation.x,
              baseY: 0,
              baseZ: ear.rotation.z,
            });
          }
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.062, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.2 * hs, 0.14 * hs, s * 0.17 * hs],
              [0, 0, 0],
              [1, 1, 0.8],
            );

          const upper = 0.78 * this.legSize,
            lower = 0.72 * this.legSize;
          for (const [x, z, phase] of [
            [0.86 * L, 0.28 * W, 0],
            [-0.92 * L, 0.32 * W, Math.PI],
            [0.86 * L, -0.28 * W, Math.PI],
            [-0.92 * L, -0.32 * W, 0],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.11,
              lowerRadius: 0.062, // fine cannon bone
              upperMat: this.bodyMat,
              lowerMat: this.socks ? this.sockMat : this.bodyMat,
              hoofMat: this.hoofMat,
              hoofSize: 0.11,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.24 * L, 2.02 * H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          // A horse tail is a thick fall of hair: one heavy tube plus a couple of offset strands so the silhouette isn't a single clean rod.
          // EVERY STRAND STARTS INSIDE THE RUMP.
          // taperedTube closes its ends with flat discs.
          // A root at 0.96 of the hindquarters' radius is ON the surface of a detail-1 icosahedron (its facets sag ~3.5% inside the sphere), leaving a 0.24-wide lid on the croup with its own flat normal, lit unlike anything around it.
          // The lead-in point sits 0.55 of the way to the hindquarters' centre and still 0.63 under the full gallop lift, so the cap never surfaces; and because the curve runs up out of the body before it falls, the tail leaves the croup in a short arch, which is what a dock does.
          const TAIL_IN = [0.125, -0.181]; // tailRoot-local, toward the rump
          this.tube(
            this.tailRoot,
            [
              [TAIL_IN[0], TAIL_IN[1], 0],
              [0, 0, 0],
              [-0.14, -0.32, 0],
              [-0.2, -0.66, 0],
              [-0.19, -1.0, 0],
              [-0.13, -1.3, 0],
            ],
            0.12,
            0.05,
            this.maneMat,
            6,
            12, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );
          for (const s of [1, -1])
            this.tube(
              this.tailRoot,
              [
                [TAIL_IN[0], TAIL_IN[1] - 0.06, s * 0.03],
                [0, -0.06, s * 0.05],
                [-0.13, -0.4, s * 0.07],
                [-0.18, -0.78, s * 0.08],
                [-0.14, -1.12, s * 0.06],
              ],
              0.05,
              0.02,
              this.maneMat,
              5,
              10, // curve res: 40 segs on a 1-unit tail is sub-pixel
            );
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 0.7 + this.phase) * (this.initialized ? 0.04 : 0.02);
          const tr = this.tailRoot;
          if (tr)
            tr.rotation.set(
              Math.sin(t * 1.3 + this.phase) * 0.14,
              tr.rotation.y,
              -this.tailLift(0.42),
            );
          for (const ear of this.ears)
            ear.group.rotation.x =
              ear.baseX + Math.sin(t * 1.6 + this.phase + ear.side * 2) * 0.12;
        }
      }

      /* ---------------------------- TURKEY ------------------------------- */
      // Chicken-shaped bird scaled up, with the two things that actually read as "turkey": the fanned tail and the bare red head with snood/wattle.
      class Turkey extends Animal {
        constructor(o = {}) {
          super("turkey");
          const C = CONFIG.species.turkey;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.96, 1.05);
          this.H = rand(0.96, 1.05);
          this.W = rand(0.96, 1.05);
          this.headSize = rand(0.94, 1.07);
          this.legSize = rand(0.95, 1.06);
          this.fan = rand(0.92, 1.12); // how proud the tail fan sits
          const c = pick([
            { body: 0x3b3129, wing: 0x2a221c, edge: 0xb9a488 }, // bronze
            { body: 0x2b2622, wing: 0x1c1815, edge: 0x8d7f6a }, // black
            { body: 0x6a5a48, wing: 0x4b3f32, edge: 0xd6c6a8 }, // chocolate
            { body: 0xd8d2c6, wing: 0xc0b9ab, edge: 0xf0ece2 }, // white holland
          ]);
          this.bodyMat = mat(tint(c.body), 0.9);
          this.wingMat = mat(tint(c.wing), 0.9);
          this.edgeMat = mat(tint(c.edge), 0.88);
          this.skinMat = mat(0xc0454a, 0.72); // bare head skin
          this.waddleMat = mat(0xa8323a, 0.7);
          this.beakMat = mat(0xd8b871, 0.7);
          this.legMat = mat(0xa87c58, 0.8);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [0, 1.02, 0],
            [0, 0, 0.16],
            [0.82 * L, 0.48 * H, 0.66 * W],
          ); // heavy round body
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.edgeMat,
            this.bodyRoot,
            [0.36 * L, 0.86, 0],
            [0, 0, 0],
            [0.7, 0.66, 0.72],
          ); // pale breast
          // folded wings along the flanks
          for (const s of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.5, 1),
              this.wingMat,
              this.bodyRoot,
              [-0.06 * L, 1.02, s * (0.6 * W + CONFIG.surface.wingClearance)],
              [0, 0, 0.1],
              [1.0, 0.62, 0.2],
            );

          // THE FAN: overlapping flat feather cards on an arc, standing up and splayed back.
          // Built on its own root so it can flick with the body.
          this.fanRoot = new THREE.Group();
          this.fanRoot.position.set(-0.72 * L, 1.06 * H, 0);
          this.fanRoot.rotation.z = 2;
          this.bodyRoot.add(this.fanRoot); // rides the body, not the world
          const NF = 11;
          for (let i = 0; i < NF; i++) {
            const u = i / (NF - 1) - 0.5; // -0.5 .. 0.5 across the fan
            const spread = u * 1.5; // radians of splay
            const len = (0.92 - Math.abs(u) * 0.26) * this.fan;
            const f = new THREE.Group();
            f.rotation.y = spread;
            f.rotation.z = -Math.abs(u) * 0.22; // outer feathers droop
            this.fanRoot.add(f);
            this.part(
              new THREE.IcosahedronGeometry(0.5, 1),
              this.wingMat,
              f,
              [len * 0.5, 0, 0],
              [0, 0, 0],
              [len, 0.34, 0.055],
            );
            this.part(
              // detail 0: the tip band is a sliver 0.16 x 0.3 x 0.05, a few pixels wide -- 80 triangles of rounding is invisible on it.
              new THREE.IcosahedronGeometry(0.5, 0),
              this.edgeMat,
              f,
              [len * 0.95, 0, 0],
              [0, 0, 0],
              [0.16, 0.3, 0.05],
            ); // pale band at the tip
          }

          // bare neck + head
          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(0.5 * L, 1.5 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.skinMat,
            this.neckRoot,
            [0, 0.06, 0],
            [0, 0, -0.28],
            [0.5, 0.86, 0.5],
          );
          // caruncles: lumpy bare skin down the neck
          for (let i = 0; i < 3; i++)
            this.part(
              new THREE.IcosahedronGeometry(0.09, 0),
              this.waddleMat,
              this.neckRoot,
              [0.08, -0.05 + i * 0.13, (i % 2 ? 1 : -1) * 0.08],
            );

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(0.66 * L, 1.92 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.22, 1),
            this.skinMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.0 * hs, 0.92 * hs, 0.86 * hs],
          );
          this.part(
            new THREE.ConeGeometry(0.07 * hs, 0.19 * hs, 5),
            this.beakMat,
            this.headRoot,
            [0.2 * hs, -0.02, 0],
            [0, 0, -Math.PI / 2],
          ); // beak
          // snood: the flap hanging over the beak (the signature)
          this.tube(
            this.headRoot,
            [
              [0.14 * hs, 0.08, 0],
              [0.2 * hs, -0.02, 0],
              [0.22 * hs, -0.16, 0],
              [0.2 * hs, -0.28, 0],
            ],
            0.035,
            0.018,
            this.waddleMat,
            5,
            8, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );
          this.part(
            new THREE.IcosahedronGeometry(0.11, 1),
            this.waddleMat,
            this.headRoot,
            [0.06 * hs, -0.2 * hs, 0],
            [0, 0, 0],
            [0.7, 1.0, 0.5],
          ); // wattle under the chin
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.035, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.1 * hs, 0.06 * hs, s * 0.13 * hs],
            );

          const upper = 0.34 * this.legSize,
            lower = 0.32 * this.legSize;
          for (const [x, z, phase] of [
            [0.06 * L, 0.24 * W, 0],
            [0.06 * L, -0.24 * W, Math.PI],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.07,
              lowerRadius: 0.045,
              upperMat: this.bodyMat,
              lowerMat: this.legMat,
              hoofMat: this.legMat,
              hoofSize: 0.1,
              phase,
              foot: "bird",
              footSize: 1.05,
            });
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.9 + this.phase) * (this.initialized ? 0.11 : 0.04);
          if (this.fanRoot)
            // the fan sways and lifts a little as it walks
            this.fanRoot.rotation.y = Math.sin(t * 1.4 + this.phase) * 0.09;
        }
      }

      /* ----------------------------- DOG --------------------------------- */
      // Compact quadruped: shorter legs than the goat, deeper chest, a real snout, floppy or pricked ears, and a tail that carries high.
      class Dog extends Animal {
        constructor(o = {}) {
          super("dog");
          const C = CONFIG.species.dog;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.95, 1.07);
          this.H = rand(0.95, 1.06);
          this.W = rand(0.95, 1.05);
          this.headSize = rand(0.93, 1.08);
          this.legSize = rand(0.93, 1.08);
          this.earSize = rand(0.9, 1.12);
          this.floppy = Math.random() < 0.55; // floppy vs pricked ears
          this.patched = Math.random() < 0.5;
          const c = pick([
            { body: 0xb5793c, belly: 0xe4c99a, dark: 0x6d4522 }, // tan
            { body: 0x3a332e, belly: 0xa8916f, dark: 0x201c19 }, // black & tan
            { body: 0xe0d8c8, belly: 0xf2ece0, dark: 0x8d8272 }, // cream
            { body: 0x7c6249, belly: 0xc3ac8c, dark: 0x4a3626 }, // brown
            { body: 0x9a958c, belly: 0xdedad2, dark: 0x5c5a56 }, // grey
          ]);
          this.bodyMat = mat(tint(c.body), 0.9);
          this.bellyMat = mat(tint(c.belly), 0.9);
          this.darkMat = mat(tint(c.dark), 0.9);
          this.noseMat = mat(0x241f1d, 0.55);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          const bodyC = [-0.05, 1.0, 0];
          const bodyR = [0.95 * L, 0.46 * H, 0.42 * W];
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            bodyC,
            [0, 0, 0],
            bodyR,
          ); // body
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.bodyMat,
            this.bodyRoot,
            [0.72 * L, 1, 0],
            [0, 0, 0],
            [0.66, 0.86, 0.82],
          ); // deep chest
          this.part(
            new THREE.IcosahedronGeometry(0.4, 1),
            this.bodyMat,
            this.bodyRoot,
            [-0.78 * L, 1.02, 0],
            [0, 0, 0],
            [0.62, 0.8, 0.8],
          ); // haunches
          this.part(
            new THREE.IcosahedronGeometry(0.45, 1),
            this.bellyMat,
            this.bodyRoot,
            [0.0, 0.62, 0],
            [0, 0, 0],
            [1.05, 0.28, 0.5],
          ); // pale belly/chest
          if (this.patched) {
            // Markings are pigment, not lumps: caps cut from the dog's OWN faceted body surface, so they follow the coat instead of budding off it like the sheep's wool clumps.
            const seeds = [
              [0.5, 0.62, 0.78],
              [-0.55, 0.5, -0.85],
              [-0.15, 0.85, 0.3],
              [0.35, -0.1, -0.9],
              [-0.85, 0.35, 0.5],
            ];
            for (const s of seeds) {
              if (Math.random() < 0.35) continue; // vary the coat between dogs
              const dabs = 1 + ((Math.random() * 2) | 0);
              for (let d = 0; d < dabs; d++) {
                const j =
                  d === 0
                    ? [0, 0, 0]
                    : [rand(-0.28, 0.28), rand(-0.22, 0.22), rand(-0.28, 0.28)];
                this.overlay(
                  ellipsoidCap(
                    [s[0] + j[0], s[1] + j[1], s[2] + j[2]],
                    d === 0 ? rand(0.32, 0.5) : rand(0.2, 0.34),
                    bodyR,
                    1.012 + d * 0.003,
                  ),
                  this.darkMat,
                  this.bodyRoot,
                  bodyC,
                );
              }
            }
          }

          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(0.85 * L, 1.28 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.34, 1),
            this.bodyMat,
            this.neckRoot,
            [0, 0, 0],
            [0, 0, -0.5],
            [0.62, 0.72, 0.6],
          );

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.06 * L, 1.5 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.0 * hs, 0.94 * hs, 0.86 * hs],
          ); // skull
          this.part(
            new THREE.IcosahedronGeometry(0.2, 1),
            this.bodyMat,
            this.headRoot,
            [0.32 * hs, -0.09, 0],
            [0, 0, 0],
            [1.15, 0.72, 0.72],
          ); // muzzle
          this.part(
            new THREE.IcosahedronGeometry(0.075, 1),
            this.noseMat,
            this.headRoot,
            [0.5 * hs, -0.06, 0],
            [0, 0, 0],
            [0.9, 0.8, 1.0],
          ); // nose
          for (const s of [1, -1]) {
            const ear = new THREE.Group();
            ear.position.set(-0.08 * hs, 0.2 * hs, s * 0.18 * hs);
            if (this.floppy) {
              ear.rotation.x = s * 0.35;
              ear.rotation.z = -0.15;
              this.headRoot.add(ear);
              this.part(
                new THREE.IcosahedronGeometry(0.5, 1),
                this.darkMat,
                ear,
                [0.02, -0.2 * this.earSize, 0],
                [0, 0, 0],
                [0.28, 0.5 * this.earSize, 0.13],
              ); // hangs down
            } else {
              ear.rotation.x = s * 0.54;
              this.headRoot.add(ear);
              this.part(
                new THREE.ConeGeometry(
                  0.09 * this.earSize,
                  0.26 * this.earSize,
                  5,
                ),
                this.darkMat,
                ear,
                [0, 0.07 * this.earSize, 0],
              ); // stands up
            }
            this.ears.push({
              group: ear,
              side: s,
              baseX: ear.rotation.x,
              baseY: 0,
              baseZ: ear.rotation.z,
            });
          }
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.05, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.16 * hs, 0.11 * hs, s * 0.14 * hs],
              [0, 0, 0],
              [1, 1, 0.85],
            );

          const upper = 0.55 * this.legSize,
            lower = 0.32 * this.legSize;
          for (const [x, z, phase] of [
            [0.66 * L, 0.24 * W, 0],
            [-0.72 * L, 0.19 * W, Math.PI],
            [0.66 * L, -0.24 * W, Math.PI],
            [-0.72 * L, -0.19 * W, 0],
          ])
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.075,
              lowerRadius: 0.055,
              upperMat: this.bodyMat,
              lowerMat: this.bodyMat,
              hoofMat: this.darkMat,
              hoofSize: 0.085,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.95 * L, 1.18 * H, 0);
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          // Carried UP and curving over the back -- the opposite of the livestock tails, and most of what makes it read as a dog.
          this.tube(
            this.tailRoot,
            [
              [0, 0, 0],
              [-0.18, 0.2, 0],
              [-0.26, 0.44, 0],
              [-0.2, 0.64, 0],
              [-0.04, 0.72, 0],
            ],
            0.07,
            0.035,
            this.bodyMat,
            5,
            12, // curve res: 40 segs on a 1-unit tail is sub-pixel
          );
        }
        update(t, dt) {
          super.update(t, dt);
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 1.4 + this.phase) * (this.initialized ? 0.07 : 0.03);
          // wag: fast and wide when moving, a lazy sway at rest
          if (this.tailRoot) {
            const w = this.moving ? 9.5 : 2.6,
              a = this.moving ? 0.5 : 0.12;
            this.tailRoot.rotation.y = Math.sin(t * w + this.phase) * a;
          }
          for (const ear of this.ears)
            ear.group.rotation.x =
              ear.baseX + Math.sin(t * 1.8 + this.phase + ear.side * 2) * 0.09;
        }
      }

      /* ---------------------------- ROOSTER ------------------------------ */
      // Cockerel: taller and more upright than the hen, with the comb, wattles, sickle tail and hackle that read as `rooster`.
      //
      // Real breeds are either monochrome or multicoloured with a fixed pattern, so body and wing are drawn from one palette rather than two independent rolls.
      // So the palette is a table of whole breeds with one colour per body region, NOT a per-part random roll, which would produce garish birds that exist nowhere.
      // A mono breed repeats its base colour across the regions; tint()'s small per-part jitter keeps it from looking painted.
      class Rooster extends Flier {
        constructor(o = {}) {
          super("rooster");
          const C = CONFIG.species.rooster;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.96, 1.05);
          this.H = rand(0.97, 1.07);
          this.W = rand(0.95, 1.04);
          this.headSize = rand(0.94, 1.06);
          this.wingSize = rand(0.95, 1.07);
          this.legSize = rand(0.96, 1.08);
          this.combSize = rand(0.92, 1.12);
          this.tailSize = rand(0.95, 1.12);

          // one entry per breed: body, hackle (neck cape), saddle (lower back), wing, primaries (wing tip panel), breast, tail (sickles)
          const mono = (c, sheen) => ({
            body: c,
            hackle: sheen ?? c,
            saddle: sheen ?? c,
            wing: c,
            primary: sheen ?? c,
            breast: c,
            tail: sheen ?? c,
          });
          const c = pick([
            // --- monochrome breeds -------------------------------------
            mono(0xf2eee6), // white leghorn
            mono(0x2b2724, 0x35404a), // black australorp: green-blue sheen
            mono(0x93382b, 0x7a2c22), // rhode island red
            mono(0xd8d4cc, 0xc2beb6), // white with grey shading
            // --- multicoloured breeds ----------------------------------
            {
              // black-breasted red / golden duckwing
              body: 0x8f3d1f,
              hackle: 0xe0a83c,
              saddle: 0xd8952c,
              wing: 0x7a3218,
              primary: 0x2a2622,
              breast: 0x241f1c,
              tail: 0x1d2a24, // beetle green-black
            },
            {
              // silver duckwing: white cape over a black body
              body: 0x2e2a26,
              hackle: 0xe8e4da,
              saddle: 0xdcd6c8,
              wing: 0x8a8378,
              primary: 0x232020,
              breast: 0x282421,
              tail: 0x1f2622,
            },
            {
              // speckled sussex: mahogany with cream flecking
              body: 0x7d3b26,
              hackle: 0xc9a35e,
              saddle: 0xa8703a,
              wing: 0x6a3120,
              primary: 0x3a2a20,
              breast: 0x8a4429,
              tail: 0x2b2320,
            },
            {
              // blue-red: slate body, gold cape
              body: 0x5a626e,
              hackle: 0xd6a445,
              saddle: 0xc08c33,
              wing: 0x4b525d,
              primary: 0x353b44,
              breast: 0x474e58,
              tail: 0x2f353d,
            },
            {
              // partridge: warm brown with a dark cape and green tail
              body: 0xa86a34,
              hackle: 0x4a3520,
              saddle: 0x8a5426,
              wing: 0x8f5828,
              primary: 0x2f2620,
              breast: 0x5c3a20,
              tail: 0x232c26,
            },
          ]);
          this.bodyMat = mat(tint(c.body), 0.92);
          this.hackleMat = mat(tint(c.hackle), 0.9);
          this.saddleMat = mat(tint(c.saddle), 0.9);
          this.wingMat = mat(tint(c.wing), 0.94);
          this.primaryMat = mat(tint(c.primary), 0.94);
          this.breastMat = mat(tint(c.breast), 0.92);
          this.tailMat = mat(tint(c.tail), 0.88); // sickles catch the light
          this.beak = mat(tint(0xd8a53a), 0.8);
          this.legMat = mat(tint(0xc9a24c), 0.85);
          this.comb = mat(tint(0xc2352f), 0.78);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }

        build() {
          const L = this.L,
            H = this.H,
            W = this.W,
            hs = this.headSize;
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [0, 1.25, 0],
            [0, 0, 0.1],
            [0.8 * L, 1.05 * H, 0.64 * W],
          ); // body
          this.part(
            new THREE.IcosahedronGeometry(0.55, 1),
            this.breastMat,
            this.bodyRoot,
            [0.42 * L, 1.15 * H, 0],
            [0, 0, 0],
            [0.72, 0.95, 0.86],
          ); // proud breast -- a cockerel stands chest-out
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.saddleMat,
            this.bodyRoot,
            [-0.4 * L, 1.62 * H, 0],
            [0, 0, -0.3],
            [0.95, 0.42, 0.72],
          ); // saddle over the lower back

          // ---- neck + hackle cape -------------------------------------
          this.neckRoot = new THREE.Group();
          this.neckRoot.position.set(0.42 * L, 1.95 * H, 0);
          this.group.add(this.neckRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.3, 1),
            this.hackleMat,
            this.neckRoot,
            [0, 0, 0],
            [0, 0, -0.2],
            [0.62, 1.0, 0.6],
          );
          // cape: a ring of short pointed feathers flaring over the shoulders
          {
            const UP = new THREE.Vector3(0, 1, 0),
              v = new THREE.Vector3();
            for (let i = 0; i < 7; i++) {
              const a = -0.9 + (i / 6) * 1.8; // spread around the neck
              v.set(-0.55 * Math.cos(a), -0.72, 0.85 * Math.sin(a)).normalize();
              const len = 0.46;
              const f = this.part(
                new THREE.ConeGeometry(0.1, len, 4),
                this.hackleMat,
                this.neckRoot,
                [v.x * len * 0.42, v.y * len * 0.42, v.z * len * 0.42],
              );
              f.quaternion.setFromUnitVectors(UP, v);
            }
          }

          // ---- head, comb, wattles ------------------------------------
          this.headRoot = new THREE.Group();
          this.headRoot.position.set(0.6 * L, 2.5 * H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.5, 1),
            this.hackleMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [hs, hs, 0.92 * hs],
          );
          this.part(
            new THREE.ConeGeometry(0.17 * hs, 0.44 * hs, 4),
            this.beak,
            this.headRoot,
            [0.48 * hs, -0.05, 0],
            [0, 0, -Math.PI / 2],
            [1, 0.75, 1],
          );
          // single comb: a serrated blade of five points, taller at the middle
          for (let i = 0; i < 5; i++) {
            const u = i / 4;
            const h = (0.2 + Math.sin(u * Math.PI) * 0.2) * this.combSize;
            this.part(
              new THREE.ConeGeometry(0.075 * this.combSize, h, 4),
              this.comb,
              this.headRoot,
              [(-0.28 + u * 0.62) * hs, 0.42 * hs + h * 0.4, 0],
              [0, 0, 0],
              [1, 1, 0.55],
            );
          }
          this.part(
            new THREE.IcosahedronGeometry(0.13 * this.combSize, 1),
            this.comb,
            this.headRoot,
            [0.05 * hs, 0.42 * hs, 0],
            [0, 0, 0],
            [1.6, 0.5, 0.42],
          ); // comb base
          for (const s of [1, -1])
            this.part(
              new THREE.IcosahedronGeometry(0.15 * this.combSize, 1),
              this.comb,
              this.headRoot,
              [0.3 * hs, -0.34 * hs, s * 0.07 * hs],
              [0, 0, 0],
              [0.6, 1.1, 0.4],
            ); // paired wattles under the beak
          for (const s of [1, -1])
            this.eye(
              new THREE.SphereGeometry(0.072, 8, 6),
              this.eyeMat,
              this.headRoot,
              [0.3 * hs, 0.12 * hs, s * 0.39 * hs],
              [0, 0, 0],
              [1, 1, 0.7],
            );

          // ---- wings (flapping rig) -----------------------------------
          this.makeWing(1);
          this.makeWing(-1);

          // ---- tail: long arched sickles over a shorter fan ------------
          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-0.68 * L, 1.62 * H, 0);
          this.tailRoot.rotation.z = 1.1;
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          const ts = this.tailSize,
            UP = new THREE.Vector3(0, 1, 0),
            v = new THREE.Vector3();
          // main fan
          for (const d of [
            [-0.9, 0.55, 0],
            [-0.8, 0.75, 0.34],
            [-0.8, 0.75, -0.34],
            [-0.58, 1.0, 0.18],
            [-0.58, 1.0, -0.18],
          ]) {
            v.set(d[0], d[1], d[2]).normalize();
            const len = 0.9 * ts;
            const f = this.part(
              new THREE.ConeGeometry(0.115 * ts, len, 5),
              this.tailMat,
              this.tailRoot,
              [v.x * len * 0.5, v.y * len * 0.5, v.z * len * 0.5],
            );
            f.quaternion.setFromUnitVectors(UP, v);
          }
          // sickles: the long curved plumes that arch up and over -- built as tapered tubes so they can actually bend, which cones cannot do.
          for (const s of [1, -1])
            this.tube(
              this.tailRoot,
              [
                [0, 0.1, s * 0.06],
                [-0.34 * ts, 0.62 * ts, s * 0.12],
                [-0.5 * ts, 1.2 * ts, s * 0.15],
                [-0.36 * ts, 1.72 * ts, s * 0.14],
                [-0.02 * ts, 2.0 * ts, s * 0.1],
              ],
              0.085,
              0.02,
              this.tailMat,
              5,
              12,
            );

          // ---- legs: taller than a hen's, with spurs ------------------
          const upper = 0.3 * this.legSize,
            lower = 0.3 * this.legSize;
          for (const [z, phase] of [
            [0.17, 0],
            [-0.17, Math.PI],
          ]) {
            const leg = this.leg({
              x: 0,
              z,
              upper,
              lower,
              upperRadius: 0.06,
              lowerRadius: 0.05,
              upperMat: this.bodyMat,
              lowerMat: this.legMat,
              hoofMat: this.legMat,
              hoofSize: 0.1,
              foot: "bird",
              footSize: 1.05,
              phase,
            });
            // Spur: the sharp backward spike on the inside of the shank, well above the toes.
            // Parented to the ANKLE so it swings with the leg; hung off bodyRoot it would hover in place while the leg moved out from under it.
            const spur = this.part(
              new THREE.ConeGeometry(0.036, 0.19, 5),
              this.legMat,
              leg.ankle,
              [-0.05, 0.17 * this.legSize, -Math.sign(z) * 0.035],
            );
            // point it back and slightly down, angled in toward the other leg
            spur.rotation.set(0, 0, 1.9);
            spur.rotateX(-Math.sign(z) * 0.35);
          }
        }

        makeWing(side) {
          this.addWing(side, {
            y: 1.34,
            z: 0.6 * this.W + CONFIG.surface.wingClearance,
            len: 0.8 * this.wingSize,
            chord: 0.5 * this.wingSize,
            thin: 0.15 * this.wingSize,
            sweep: 0.09,
            tuck: 0.13,
            mat: this.wingMat,
            tipMat: this.primaryMat,
          });
        }

        update(t, dt) {
          super.update(t, dt);
          this.flapWings(t, dt); // same beat rig the hen and duck use
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 2.1 + this.phase) * (this.initialized ? 0.06 : 0.03);
          if (this.tailRoot)
            // the sickles sway as he struts
            this.tailRoot.rotation.x = Math.sin(t * 1.7 + this.phase) * 0.07;
        }
      }

      const SPECIES = [
        ["chick", Chick, "Ch"],
        ["chicken", Chicken, "Ck"],
        ["cow", Cow, "Cw"],
        ["dog", Dog, "Dg"],
        ["donkey", Donkey, "Dn"],
        ["duck", Duck, "Dk"],
        ["frog", Frog, "Fg"],
        ["goat", Goat, "Gt"],
        ["goose", Goose, "Gs"],
        ["hedgehog", Hedgehog, "Hh"],
        ["horse", Horse, "Hs"],
        ["mouse", Mouse, "Ms"],
        ["pig", Pig, "Pg"],
        ["rabbit", Rabbit, "Rb"],
        ["rooster", Rooster, "Rs"],
        ["sheep", Sheep, "Sh"],
        ["sparrow", Sparrow, "Sp"],
        ["swan", Swan, "Sw"],
        ["turkey", Turkey, "Tk"],
        ["turtle", Turtle, "Tt"],
      ];

      // ======================================================================
      // CAMERA RIG -- replaces OrbitControls
      // ======================================================================
      // State is (pivot, theta, phi, dist) plus one flag for which end of the arm is pinned: driving an animal, the PIVOT is the animal and the camera swings round it flying, the PIVOT is the camera and the target swings round IT
      // Orbiting and turning in place are therefore the same four lines with the pivot moved.
      // Everything else derives: target, camera position, and the streaming anchor, which is the pivot itself.
      //
      // No damping.
      // Input lands on the frame it arrives.
      class CameraRig {
        constructor(camera, dom) {
          this.camera = camera;
          this.dom = dom;
          this.pivot = new THREE.Vector3(0, 1.1, 0);
          this.target = new THREE.Vector3(); // derived; the rest of the app reads it
          this.theta = 0;
          this.phi = 1.0;
          this.dist = 30;
          this.orbit = false; // false = fly: the pivot IS the camera
          this.minDistance = CAM_MIN_DIST;
          this.maxDistance = CAM_MAX_DIST;
          // Never exactly 0: at the pole theta is undefined and the fly camera's ground-plane forward collapses with it.
          this.minPolar = 0.02;
          // Orbiting, phi is capped just short of level: the camera sits cos(phi)*dist above a ground-level target, so past a right angle it would be under the ground with it.
          // Flying, the pivot IS the camera and the target is derived from it, so phi past a right angle simply means looking up.
          // The cap is an orbit-mode constraint only.
          this.maxPolar = 1.52;
          this.flyMaxPolar = 2.95; // a few degrees short of straight up, where theta stops meaning anything
          // Floor for the camera's own height.
          // Flying, a dolly runs along the view axis, so looking down and zooming in drives the camera at the ground.
          // Well clear of the 0.1 near plane so the ground never clips into frame, and just above a pig's back.
          this.minHeight = 1.2;
          this.rotateSpeed = 1; // a full screen-height of drag is one revolution
          this.wheelStep = 1.12; // dolly ratio per notch, before the zoom taper
          this.zoomSpeed = 1; // retuned every frame by _zoomEase
          this.enabled = true;
          this.enablePan = true;
          this.onChange = null;
          this._ptr = new Map(); // active pointers, for pinch and two-finger pan
          this._pinch = 0;
          this._bind();
        }

        // Pinning the OTHER end without moving anything on screen.
        // Both camera and target are already correct for the old mode, so the new pivot is just whichever of them the new mode pins.
        setOrbit(on) {
          if (this.orbit === on) return;
          this.pivot.copy(on ? this.target : this.camera.position);
          this.orbit = on;
        }

        apply() {
          this.phi = Math.min(
            this.orbit ? this.maxPolar : this.flyMaxPolar,
            Math.max(this.minPolar, this.phi),
          );
          // Only fly mode needs this: the pivot is the camera there, so clamping it clamps the camera exactly.
          // Orbiting, the camera sits pivot + cos(phi)*dist above a ground-level target, and maxPolar keeps that term positive.
          // ONE CEILING FOR THE CAMERA, CAM_FLY_MAX, whatever moved it -- not just the height gesture, or zooming out while looking down climbs straight past it to +55m.
          // Each control stops at it: dolly limits itself (below), here the pivot is held under it flying, and orbiting the view may not tilt steeper than the ceiling allows at this distance.
          if (!this.orbit)
            this.pivot.y = Math.min(
              CAM_FLY_MAX,
              Math.max(this.pivot.y, this.minHeight),
            );
          this.dist = Math.min(
            this.maxDistance,
            Math.max(this.minDistance, this.dist),
          );
          if (this.orbit) {
            const room = CAM_FLY_MAX - this.pivot.y;
            if (this.dist > room)
              this.phi = Math.max(
                this.phi,
                Math.acos(Math.max(-1, Math.min(1, room / this.dist))),
              );
          }
          const s = Math.sin(this.phi) * this.dist;
          const ox = s * Math.sin(this.theta),
            oy = Math.cos(this.phi) * this.dist,
            oz = s * Math.cos(this.theta);
          if (this.orbit) {
            this.target.copy(this.pivot);
            this.camera.position.set(
              this.pivot.x + ox,
              this.pivot.y + oy,
              this.pivot.z + oz,
            );
          } else {
            this.camera.position.copy(this.pivot);
            this.target.set(
              this.pivot.x - ox,
              this.pivot.y - oy,
              this.pivot.z - oz,
            );
          }
          this.camera.lookAt(this.target);
        }

        rotate(dTheta, dPhi) {
          this.theta += dTheta;
          this.phi += dPhi;
        }

        // CAMERA HEIGHT, in one place, because two gestures now ask for it: ctrl-drag on a mouse and two fingers on a phone.
        // The band is whichever end of the arm the pivot is pinned to: flying it is the camera's own height, orbiting it is the target's.
        // Two accessors rather than a pair: a pair is an array, and an array here is a garbage object per pointermove.
        _bandLo() {
          return this.orbit ? CAM_TGT_MIN : this.minHeight;
        }
        _bandHi() {
          return this.orbit ? CAM_TGT_MAX : CAM_FLY_MAX;
        }

        // World units per pixel, such that a full screen-height of drag spans the whole band -- the same rule the rotate uses for one revolution.
        // Measured from where the gesture starts and latched by the caller, because a dolly can leave the camera far above the band and the reach has to cover that too.
        heightRate(viewH) {
          const lo = this._bandLo();
          return (Math.max(this._bandHi(), this.pivot.y) - lo) / (viewH || 1);
        }

        // Starting outside the band is legal, so the band only stops you LEAVING it: from outside, the gesture still travels toward it.
        raiseBy(d) {
          const y = this.pivot.y;
          this.pivot.y = clamp(
            y + d,
            Math.min(this._bandLo(), y),
            Math.max(this._bandHi(), y),
          );
        }
        // The CAMERA's own height above the lowest a camera goes (minHeight), for the HUD -- one meaning in both modes.
        // Not the orbit TARGET's height: that is a 0-5m band while zoom alone can carry the camera far above it.
        // Floored at 0: an orbit camera close to a small animal can sit lower than a flying one, and that is still "as low as it goes".
        heightAboveFloor() {
          return Math.max(0, this.camera.position.y - this.minHeight);
        }
        // Down to +0m.
        // Flying, the camera itself drops to the floor, through raiseBy like the gesture.
        // Orbiting, the target drops to its floor and the view tilts to its flattest; and since the flattest tilt is 87 degrees, not 90, zoom closes in only as far as needed for the camera to reach the floor -- not at all up to about 18m out.
        // Apply after (the caller's _changed does).
        toFloor() {
          this.raiseBy(this._bandLo() - this.pivot.y);
          if (!this.orbit) return;
          this.phi = this.maxPolar;
          const c = Math.cos(this.phi);
          if (c > 1e-4)
            this.dist = Math.min(
              this.dist,
              Math.max(this.minDistance, (this.minHeight - this.pivot.y) / c),
            );
        }

        // Turn about the TARGET rather than about the camera.
        //
        // setOrbit re-bases the pivot without moving anything on screen, so flying, the trick is to pin the rig to the target for the duration.
        // apply() must run while still pinned, and the fly ceiling is lent to orbit across the swap.
        // apply() has to run while it is still pinned to the target, or the camera position read back afterwards is the one from before the turn.
        // The fly ceiling is lent to orbit across the swap, because apply() clamps phi by whichever mode it is in and would otherwise snap a fly-mode look-up back down to level on the first frame.
        orbitRotate(dTheta, dPhi) {
          if (this.orbit) {
            this.rotate(dTheta, dPhi);
            return;
          }
          const savedMax = this.maxPolar;
          this.maxPolar = this.flyMaxPolar;
          this.setOrbit(true);
          this.rotate(dTheta, dPhi);
          this.apply();
          this.setOrbit(false);
          this.maxPolar = savedMax;
        }

        // Zoom is a camera move in BOTH modes, which is what the extra term is for: with the pivot on the camera, changing dist alone would slide the target and leave the view identical.
        // Carrying the pivot along the view axis by the same amount keeps the target still and moves the camera instead.
        dolly(k) {
          const d0 = this.dist;
          this.dist = Math.min(
            this.maxDistance,
            Math.max(this.minDistance, this.dist * k),
          );
          const c = Math.cos(this.phi);
          if (this.orbit) {
            // The camera rises cos(phi) per unit of distance: zooming out stops where it meets the ceiling.
            if (this.dist > d0 && c > 1e-4)
              this.dist = Math.min(
                this.dist,
                Math.max(d0, (CAM_FLY_MAX - this.pivot.y) / c),
              );
            return;
          }
          // Flying, zoom backs the camera along its view so the point it looks at stays put -- straight up, looking straight down.
          // Only as far as the band allows (tolerating a camera already outside it): it backs off along the view until the height reaches the ceiling, then stops.
          // A horizontal view gains no height, so it zooms freely.
          let dd = this.dist - d0;
          if (Math.abs(c) > 1e-4) {
            const y = this.pivot.y,
              y1 = clamp(
                y + c * dd,
                Math.min(this.minHeight, y),
                Math.max(CAM_FLY_MAX, y),
              );
            dd = (y1 - y) / c;
            this.dist = d0 + dd;
          }
          const s = Math.sin(this.phi) * dd;
          this.pivot.x += s * Math.sin(this.theta);
          this.pivot.y += c * dd;
          this.pivot.z += s * Math.cos(this.theta);
        }

        // Move the pivot in the camera's GROUND basis: f units the way it faces, r units to its right.
        // The one place that turns theta into a direction.
        // Panning and flying each carried their own copy of this trig and their own sign convention, which is two chances to get a minus wrong.
        //   forward = (-sin t, 0, -cos t)   right = (cos t, 0, -sin t)
        slide(f, r) {
          const st = Math.sin(this.theta),
            ct = Math.cos(this.theta);
          this.pivot.x += -st * f + ct * r;
          this.pivot.z += -ct * f - st * r;
        }

        // Screen-space drag to a ground slide, scaled so the ground tracks the cursor at the pivot's depth.
        pan(dx, dy) {
          if (!this.enablePan) return;
          const k =
            (2 * this.dist * Math.tan((this.camera.fov * Math.PI) / 360)) /
            this.dom.clientHeight;
          this.slide(dy * k, -dx * k);
        }

        _changed() {
          this.apply();
          if (this.onChange) this.onChange();
        }

        _bind() {
          const dom = this.dom;
          const down = (e) => {
            if (!this.enabled || e.ctrlKey) return;
            dom.setPointerCapture?.(e.pointerId);
            // Which button opened the drag decides what it does for the drag's whole life.
            // Recorded here rather than read off e.buttons during the move, which would change meaning under the user's hand the moment a second button went down.
            // Touch reports button 0, so a finger always rotates.
            this._ptr.set(e.pointerId, {
              x: e.clientX,
              y: e.clientY,
              pan: e.button > 0,
              touch: e.pointerType === "touch",
              // SHIFT swings the view around whatever it is pointed at instead of turning on the spot -- the same thing SHIFT+Q/E does, by the same route.
              // Latched at pointerdown with the button, for the same reason: a modifier that changes meaning halfway through a drag changes it under the user's hand.
              orbit: e.shiftKey,
            });
            // Latched when the second finger lands, like the ctrl-drag's rate, so it cannot shift under the fingers mid-gesture.
            if (this._ptr.size === 2)
              this._hrate = this.heightRate(dom.clientHeight);
            this._pinch = this._spread();
          };
          const move = (e) => {
            const p = this._ptr.get(e.pointerId);
            if (!p || !this.enabled) return;
            const dx = e.clientX - p.x,
              dy = e.clientY - p.y;
            p.x = e.clientX;
            p.y = e.clientY;
            if (this._ptr.size === 1) {
              if (p.pan) {
                // Right or middle button: slide the pivot along the ground.
                this.pan(dx, dy);
              } else {
                // One finger, or the left button: turn.
                // A full screen-height of drag is one full revolution, which is the rate OrbitControls used.
                const k = (2 * Math.PI * this.rotateSpeed) / dom.clientHeight;
                // Yaw only: carrying the vertical drag into it swings the camera up and over the target, which no drag can avoid asking for by accident.
                // Same as SHIFT+Q/E, which has one axis and always did.
                //
                // On touch it is the default, because the stick's horizontal axis already turns the camera on the spot.
                // A finger circles what you are looking at and the stick turns you.
                // Orbit mode needs no special case -- the pivot IS the target there, so this is what a drag already did.
                if (p.orbit || p.touch) this.orbitRotate(-dx * k, 0);
                if (!p.orbit) this.rotate(p.touch ? 0 : -dx * k, -dy * k);
              }
            } else if (this._ptr.size === 2) {
              // Two fingers carry a pinch and a drag at once, and both are wanted: the change in spread is the zoom, the midpoint's motion is the pan.
              const s = this._spread();
              if (this._pinch > 0 && s > 0) this.dolly(this._pinch / s);
              this._pinch = s;
              // UP AND DOWN IS HEIGHT, not pan.
              // Up and down is height, not pan: forward and back is what the stick does, and camera height had no touch gesture at all.
              // Sideways stays a slide, because the stick turns rather than strafes.
              // Sideways stays a slide, because THAT one is genuinely missing: the stick turns rather than strafes, so there is otherwise no way to step the camera across without turning it.
              this.pan(dx / 2, 0); // each finger sees half the midpoint move
              this.raiseBy(-(dy / 2) * this._hrate);
            }
            this._changed();
          };
          const up = (e) => {
            dom.releasePointerCapture?.(e.pointerId);
            this._ptr.delete(e.pointerId);
            this._pinch = this._spread();
          };
          dom.addEventListener("pointerdown", down);
          dom.addEventListener("pointermove", move);
          dom.addEventListener("pointerup", up);
          dom.addEventListener("pointercancel", up);
          dom.addEventListener(
            "wheel",
            (e) => {
              if (!this.enabled) return;
              e.preventDefault();
              // Sign only.
              // deltaY's magnitude means pixels, lines or pages depending on the device, so reading it is a portability trap.
              const s = Math.pow(this.wheelStep, this.zoomSpeed);
              this.dolly(e.deltaY > 0 ? s : 1 / s);
              this._changed();
            },
            { passive: false },
          );
        }

        _spread() {
          if (this._ptr.size !== 2) return 0;
          const it = this._ptr.values();
          const a = it.next().value,
            b = it.next().value;
          return Math.hypot(a.x - b.x, a.y - b.y);
        }
      }

      // ======================================================================
      // FARM LAYOUT  --  the farm as a picture
      // ======================================================================
      // Placement is a text map: TWO characters per cell, a Title-case code per species, any other pair is empty ground.
      //
      //     ....Cw......Dn....
      //     ..Pg....Hs....Tk..
      //
      // Fixed-width cells rather than delimiters, so columns line up and the map looks like the farm it describes.
      // "Pg..Pg" is two pigs with a gap.
      //
      // Codes live in the SPECIES table, never in a second list beside it: a drift there is silent, one species winning the key and the other never spawning.
      // Boot asserts codes exist, are two characters, and are unique.
      //
      // The random layout GENERATES a map string and parses it, so there is one placement path and a generated farm can be pasted back in verbatim.
      // A fixed layout: comment out `const FARM_MAP = null;` below and uncomment this block.
      // Rows must be FLUSH LEFT inside the template.
      // Leading whitespace is read as cells like anything else, and an odd number of spaces shifts every pair by one character, which turns the whole row into unmapped junk.
      /*
      const FARM_MAP = `
 .......PgPgPgPgPg.......
 .......CkCkCkCkCk.......
 .......RsRsRsRsRs.......
 .......MsMsMsMsMs.......
 .......ShShShShSh.......
 .......RbRbRbRbRb.......
 .......GtGtGtGtGt.......
 .......ChChChChCh.......
 .......TtTtTtTtTt.......
 .......DkDkDkDkDk.......
 .......GsGsGsGsGs.......
 .......HhHhHhHhHh.......
 .......FgFgFgFgFg.......
 .......SpSpSpSpSp.......
 .......CwCwCwCwCw.......
 .......DnDnDnDnDn.......
 .......HsHsHsHsHs.......
 .......TkTkTkTkTk.......
 .......DgDgDgDgDg.......
 .......SwSwSwSwSw.......`;*/

      // The generated farm is a DISC, not a rectangle, and is sized to the disc the recycler fills.
      // A rectangle at the same density is denser in the middle and pokes its corners past the fog, so the world thins the moment you start moving.
      // Matching both shape and area makes the first frame the same world as every later one, and keeps every spawn inside the fog.
      const FARM_FILL = 0.26; // fraction of in-circle cells that hold an animal
      // A circle inscribed in a side x side grid holds (pi/4) side^2 cells, and I want n / FARM_FILL of them.
      const FARM_SIDE = Math.ceil(
        Math.sqrt(
          (4 * SPECIES.length * CONFIG.world.animalsPerSpecies) /
            (Math.PI * FARM_FILL),
        ),
      );
      // World units per cell, chosen so the farm's disc IS the recycler's disc at the opening framing.
      // That framing is FLY mode, where the anchor is the camera itself, so the camera-to-anchor distance is zero -- not CAM_MAX_DIST, which is the animal-driving case.
      // Derived, not tuned: change the fog, the zoom range or the herd size and the opening still matches.
      const FARM_UNIT = (2 * recycleRadius(0)) / FARM_SIDE;
      const FARM_JITTER = 0.15; // of a cell, so it doesn't read as a lattice

      // null -> generate one.
      // Replace with a template string to author a farm.
      const FARM_MAP = null;

      // Every species must appear in every table that has NO default.
      // The constructor reads these by name and stores what it finds, so a missing entry is not an error -- which is why every species must appear in every table.
      // SPECIES_VOICE, SPECIES_STEP, GRAZE and BEHAVIOUR are deliberately absent from this list: they fall back (turtle and rabbit are mute on purpose), so a gap there is a choice rather than an omission.
      (() => {
        const required = {
          "movement.speed": CONFIG.movement.speed,
          "movement.gait": CONFIG.movement.gait,
          "animation.bodyBob": CONFIG.animation.bodyBob,
          "animation.bodySway": CONFIG.animation.bodySway,
          "animation.legSwing": CONFIG.animation.legSwing,
          "animation.breathing": CONFIG.animation.breathing,
          species: CONFIG.species,
        };
        const missing = [];
        for (const [name] of SPECIES)
          for (const t in required)
            if (required[t][name] === undefined) missing.push(t + "." + name);
        if (missing.length)
          throw new Error("species config missing: " + missing.join(", "));
      })();

      // letter -> class, built from SPECIES so it cannot drift
      const FARM_KEY = (() => {
        const m = new Map();
        for (const [name, Cls, ch] of SPECIES) {
          if (!ch || ch.length !== 2)
            throw new Error("species needs a 2-char map code: " + name);
          if (m.has(ch))
            throw new Error("duplicate map code " + ch + " on " + name);
          m.set(ch, { name, Cls });
        }
        return m;
      })();

      // WORLD INVARIANTS, checked at boot.
      // Each of these is a relationship the streaming system depends on and nothing else enforces.
      // They were prose in the comments above until they were assertions here, which is the difference between a documented invariant and a checked one.
      (() => {
        const bad = (m) => {
          throw new Error("world invariant: " + m);
        };
        // A negative clip lets the slice just under a waterline cast, and being below the plane the shear throws it TOWARD the light: a black outline round every swimmer.
        if (!(SHADOW_MIN_Y > 0)) bad("SHADOW_MIN_Y must be above the surface");
        // The GPU and CPU hashes must be the same function, or the ground draws lakes where the animals walk and bales stand in water.
        // Textual, because proving it behaviourally needs a GPU readback -- but it catches the realistic failure, one side edited alone.
        {
          const cpu = _thash.toString();
          for (const [g, c] of [
            ["374761393u", "374761393"],
            ["668265263u", "668265263"],
            ["1274126177u", "1274126177"],
            ["(h >> 13)", "(h >>> 13)"],
            ["(h >> 16)", "(h >>> 16)"],
            ["0xFFFFFFu", "0xffffff"],
          ])
            if (!GLSL_HASH.includes(g) || !cpu.includes(c))
              bad(`GLSL and CPU hashes disagree around ${c}`);
        }
        // Fog distance is nonlinear, so it must be taken per FRAGMENT.
        // Computed per vertex, the single-quad floor has four corners ~565u away and interpolates to solid fog everywhere.
        if (THREE.ShaderChunk.fog_vertex.includes("farmFogDepth"))
          bad(
            "fog distance computed per vertex -- the floor would be solid fog",
          );
        // A landing may be made in shot only past FOG_OPAQUE, so there has to be room between it and the radius animals are recycled at.
        if (!(FOG_OPAQUE < FOG_CULL * RECYCLE_FAR))
          bad("no band between FOG_OPAQUE and the recycle radius");
        // |p - cam| <= |p - pivot| + camDist, so the widest landing plus the longest arm must still fall inside the cull.
        if (!(recycleRadius(CAM_MAX_DIST) + CAM_MAX_DIST <= FOG_CULL))
          bad("landings can arrive already past the cull");
        if (!(RECYCLE_MIN < recycleRadius(CAM_MAX_DIST)))
          bad("nearest landing is outside the landing disc");
        // The opening farm has to fit inside the cull measured from the opening camera, or a chunk of it relocates on frame one.
        if (!((FARM_SIDE / 2) * FARM_UNIT <= FOG_CULL))
          bad("farm radius exceeds the cull");
        // A swarm's fade must happen beyond the range its members are still visible at, or the fade is what you see.
        if (
          !(
            SWARM_FADE * swarmGrid(FOG_OPAQUE, 45) * 45 * 0.5 >=
            FOG_OPAQUE + CAM_MAX_DIST
          )
        )
          bad("bird grid fades inside the visible range");
        // The pool disc has to sit inside the legal one, or recycleRadius is clamping for the wrong reason.
        if (!(FOG_READ < FOG_OPAQUE))
          bad("pool disc reaches past the fog line");
        // Orbiting, the camera clears the ground by cos(maxPolar) * minDistance above a target held at CAM_TGT_MIN or above.
        if (!(0.3 + Math.cos(1.52) * CAM_MIN_DIST > 0))
          bad("orbit camera can reach the ground");
        // The truncated fog curve must reach exactly 1 at FOG_OPAQUE; everything past it is declared unseen on that basis.
        const f =
          (1 - Math.exp(-Math.pow(FOG_OPAQUE * FOG_DENSITY, 2))) * FOG_NORM;
        if (Math.abs(f - 1) > 1e-9) bad("fog does not reach 1 at FOG_OPAQUE");
      })();

      // Scatter `per` of each species over a grid and hand back map TEXT, so there is one placement path and a good layout can be printed and kept.
      function generateFarmMap(per = 5) {
        const n = SPECIES.length * per;
        const side = FARM_SIDE;
        const grid = new Array(side * side).fill("..");
        // Cells inside the inscribed circle, the only ones that may be filled.
        // Built once and drawn from, rather than rejection-sampling the square and throwing away the corners.
        const legal = [];
        const mid = (side - 1) / 2,
          r2 = (side / 2) * (side / 2);
        for (let y = 0; y < side; y++)
          for (let x = 0; x < side; x++) {
            const dx = x - mid,
              dy = y - mid;
            if (dx * dx + dy * dy <= r2) legal.push(y * side + x);
          }
        const want = [];
        for (const [, , ch] of SPECIES)
          for (let i = 0; i < per; i++) want.push(ch);
        // Fisher-Yates, so species interleave instead of banding by row
        for (let i = want.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [want[i], want[j]] = [want[j], want[i]];
        }
        let placed = 0;
        while (placed < want.length) {
          const k = legal[(Math.random() * legal.length) | 0];
          if (grid[k] !== "..") continue;
          grid[k] = want[placed++];
        }
        const lines = [];
        for (let r = 0; r < side; r++)
          lines.push(grid.slice(r * side, (r + 1) * side).join(""));
        return lines.join("\n");
      }

      // ======================================================================
      // The farm, its scene, and the sim/view split the loop expects.
      // ====================================================================== simTime only grows, and every shader uniform it feeds is a float32.
      // At 75 rad/s (a moth wingbeat) phase error reaches 0.59 rad after a day; wrapping at 4096s holds it to 0.018 rad, at the cost of a one-frame discontinuity every ~68 min.
      // A seamless wrap would need every per-instance frequency quantised to an integer.
      const SHADER_TIME_WRAP = 4096;
      // Chase rate for the driven animal, as an exponential approach per second.
      // 4 covers ~98% of a gap in one second: quick enough to swoop over when you select something across the field, slow enough that the gait bob doesn't jitter the frame.
      const CHASE_RATE = 4.0;
      // Free-fly camera.
      // Rate is a FRACTION of the orbit distance per second, so it feels the same close in and zoomed out.
      const FLY_RATE = 0.5;
      const FLY_SPRINT = 2.6;
      // Radians a second the stick yaws the camera in fly mode.
      // Matches the AZ_RATE that Q/E use, so the two ways of turning agree.
      const FLY_STICK_TURN = 1.6;
      // KEYBOARD TURNS ARE EASED, both ends.
      // A key is binary.
      // Read straight, Q/E go from standing still to full rate in one frame and back to nothing in one frame -- and at a rate high enough that you end up TAPPING to adjust, every tap is a discrete jolt, which is what stepping looks like.
      // Eased, a tap is a nudge: a 100ms press reaches about half speed and coasts out over a couple of hundred milliseconds.
      // 6/s: 63% of the way in ~170ms, 95% in half a second.
      const KEY_TURN_EASE = 6;
      // Fly camera, radians per second, parked.
      // Was 1.6 (92 deg/s).
      const FLY_KEY_TURN = 1.0;
      // The driven animal's keyboard turn, as a fraction of its own turnSpeed.
      // A fraction and not a new rate, because turnSpeed is also what the AI and the thumbstick turn at, and those are fine.
      // 2.25 * 0.6 = 77 deg/s.
      const ANIMAL_KEY_TURN = 0.6;
      // The ring lies ON the ground, coplanar with the floor, and is kept out of its z-fight by polygonOffset rather than by a lift.
      // The offset biases in DEPTH-BUFFER units so it holds at every distance, whereas a world-space lift scales with proximity.
      const RING_Y = 0;
      const JUMP_V = 4.0;
      const GRAVITY = 14.0;

      class Game {
        constructor(mount) {
          this.paused = false;
          this.simTime = 0;
          this._thinkAcc = 0;
          // Freeze the SIMULATION, not the animation.
          // Decisions, movement and collision stop; simTime keeps advancing, so gait, breathing, blink, grazing, moths, birds, clouds and stars all carry on.
          // Distinct from game.paused (ESC), which halts the frame loop and puts up an overlay; here rendering continues and the camera is fully live.
          this.simFrozen = false;
          this._stepAcc = 0;

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(FOG_HEX);
          // Visible edge 205u.
          // The far plane must exceed where fog goes total or the ground ends in a hard arc; depth precision is unaffected, being dominated by NEAR.
          // Animals in shot is herd size over the pool disc (FOG_READ); animalsPerSpecies is the lever, and the disc follows FOG_READ.
          scene.fog = new THREE.FogExp2(FOG_HEX, FOG_DENSITY);
          scene.matrixWorldAutoUpdate = false; // I bake the herd myself
          this.scene = scene;

          const camera = new THREE.PerspectiveCamera(
            45,
            innerWidth / innerHeight,
            0.1,
            230, // must exceed where fog goes total; see scene.fog above
          );
          // Opening shot: fully zoomed out, framing the moon.
          // Pitch matters as much as bearing -- an orbit camera looks at its ground-level target, so at 68 degrees polar the horizon sits at the top edge and there is no sky at all.
          // 79 puts the moon ~85% up the frame.
          camera.position.set(-37.7, 12.5, -45.2);
          this.camera = camera;

          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            stencil: true,
            powerPreference: "high-performance",
          });
          renderer.setSize(innerWidth, innerHeight);
          renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
          // Shadows use the stencil planar pass, not shadow maps -- map off.
          renderer.shadowMap.enabled = false;
          mount.appendChild(renderer.domElement);
          this.renderer = renderer;
          // A GLSL error is otherwise a console line and a material that draws nothing: the frame renders, minus a shadow or a sky, and looks like a design choice.
          // Thrown here, it reaches init's try (every program is compiled and first-used at boot) and stops on the load screen with the driver's own log.
          renderer.debug.onShaderError = (gl, program, vs, fs) => {
            const log = [
              gl.getProgramInfoLog(program),
              gl.getShaderInfoLog(vs),
              gl.getShaderInfoLog(fs),
            ]
              .filter(Boolean)
              .join("\n")
              .trim();
            throw new Error(
              "GLSL: " +
                (log || "a shader failed to compile or link").slice(0, 600),
            );
          };
          GpuTimer.attach(renderer);

          // Pan is along the ground, never up the screen: the pitch the mouse moved through must not change how far the world slides.
          const controls = new CameraRig(camera, renderer.domElement);
          controls.pivot.copy(camera.position); // boot is fly mode, so the pivot is the camera
          {
            // Reproduce the opening shot exactly: the composed camera position and a target on the ground at the origin.
            const dx = camera.position.x,
              dy = camera.position.y - 1.1,
              dz = camera.position.z;
            controls.dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
            controls.theta = Math.atan2(dx, dz);
            controls.phi = Math.acos(dy / controls.dist);
          }
          // 1x is the opening shot's distance, taken BEFORE the stored zoom is applied, so it means the same thing on every visit and reset brings back that framing.
          controls.zoomRef = controls.dist;
          CameraStore.load(controls); // height and zoom from last visit; applies the rig
          this.controls = controls;
          // Dragging on a parked frame (splash, paused, ctrl-drag) has to redraw itself: the loop is not running to do it.
          controls.onChange = () => {
            if (!_loopRunning || (GAME && GAME.paused)) GAME.renderParked();
          };

          this.input = new Input();

          // Lighting.
          scene.add(new THREE.AmbientLight(0x333344, 0.7));
          scene.add(new THREE.HemisphereLight(0xbfd0e0, 0x2b3038, 1.1));
          const sun = new THREE.DirectionalLight(0xffffff, 2.4);
          sun.position.set(10, 18, 12);
          scene.add(sun);
          this.sun = sun;
          // Build the planar-shadow projection from the (fixed) sun direction.
          // Casters get flattened onto the ground by this matrix each frame.
          registry.setSun(sun.position, new THREE.Vector3(0, 0, 0));

          this._buildFarm();
          this._buildGround();
          this._buildSky(scene, camera);
          this._buildMoths(scene);
          this._buildBirds(scene);

          // Selection.
          this.raycaster = new THREE.Raycaster();
          this._ptr = new THREE.Vector2();
          this.selected = null;
          this.selLabel = document.getElementById("selLabel");

          // One selection ring, kept in WORLD space (never parented to the animal) so it stays flat on the ground while the animal bobs, jumps and rolls.
          // Its outline is the animal's actual collision capsule, so it doubles as a readout of the space the animal occupies.
          // Rebuilt only when the selection changes.
          this.ring = new THREE.Mesh(
            this._stadiumGeom(0.7, 0, 0.08),
            new THREE.MeshBasicMaterial({
              color: 0xffe27a,
              transparent: true,
              opacity: 0.9,
              side: THREE.DoubleSide,
              depthWrite: false,
              // Coplanar with the floor, so this is the only thing keeping it visible.
              // Factor scales with depth SLOPE, which matters because the floor is 800u across and near edge-on at grazing angles.
              polygonOffset: true,
              polygonOffsetFactor: -4,
              polygonOffsetUnits: -4,
            }),
          );
          this.ring.visible = false;
          this.ring.castShadow = false;
          this.ring.receiveShadow = false;
          this.ring.renderOrder = 2;
          this._ringKey = "";
          scene.add(this.ring);

          // Reusable scratch for _applyOrbit so the hot path never allocates.

          this._initSelection();

          // Pose + bake once so the splash frame shows the herd at rest.
          this._frame = 0;
          this._frustum = new THREE.Frustum();
          this._frustumM = new THREE.Matrix4();
          this._cullSphere = new THREE.Sphere();
          this._dirtyList = [];
          this._culled = 0;
          // Nothing past FOG_OPAQUE can contribute a pixel, so it is both the render cull and the distance a landing must clear to be made in shot.
          this._fogCull = FOG_OPAQUE;
          // Where the focus was last frame, and the travel bearing derived from it.
          this._lastF = { x: 0, z: 0 };
          this._travelEase = 0; // smoothed "am I travelling", for the turn rate
          this._spinVel = 0; // eased Q/E angular velocity, fly camera and shift-orbit
          this._yawEase = 0; // eased A/D/Q/E yaw for the driven animal
          this._dreadT = rand(90, 200); // first one, well into the session
          this._flightT = rand(FLIGHT_GAP[0], FLIGHT_GAP[1]); // likewise for the first flight
          this._flyCand = []; // reused by the scheduler, never reallocated once grown
          // Why the last take-off did not happen, for the debug button.
