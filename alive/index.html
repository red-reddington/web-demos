            );
          }
        }
        for (let i = 0; i < seg; i++) idx.push(0, 1 + i, 1 + ((i + 1) % seg)); // centre fan
        for (let r = 1; r < rings; r++) {
          const b0 = 1 + (r - 1) * seg,
            b1 = 1 + r * seg;
          for (let i = 0; i < seg; i++) {
            const j = (i + 1) % seg;
            idx.push(b0 + i, b1 + i, b1 + j);
            idx.push(b0 + i, b1 + j, b0 + j);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
        g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        g.setIndex(idx);
        return g;
      }

      /* ====================================================================
         BATCHED REGISTRY

         Parts register a transform "slot".
         After every animal is built I bucket slots by MATERIAL (roughness + overlay) and make one BatchedMesh per bucket, packing all their distinct geometries in.
         Per-animal tint is per-instance color.
         Result: a few draw calls for the whole farm.
         ==================================================================== */
      const _mats = new Map();

      // Surface detail in the shared standard materials (no geometry/draws): fbm mottling + dirt + roughness break-up, Fresnel rim, scute seams.
      const NOISE_GLSL = `
        float _h31(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
        float _vn3(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
          return mix(mix(mix(_h31(i+vec3(0.,0.,0.)),_h31(i+vec3(1.,0.,0.)),f.x),
                         mix(_h31(i+vec3(0.,1.,0.)),_h31(i+vec3(1.,1.,0.)),f.x),f.y),
                     mix(mix(_h31(i+vec3(0.,0.,1.)),_h31(i+vec3(1.,0.,1.)),f.x),
                         mix(_h31(i+vec3(0.,1.,1.)),_h31(i+vec3(1.,1.,1.)),f.x),f.y),f.z); }
        float _fbm3(vec3 p){ return _vn3(p)*0.62 + _vn3(p*2.37)*0.31; }
        float _hexSeam(vec3 op){
          vec2 p = op.xz * 3.1;
          const vec2 s2 = vec2(1.0, 1.7320508);
          vec4 hC = floor(vec4(p, p - vec2(0.5,1.0))/s2.xyxy) + 0.5;
          vec4 h4 = vec4(p - hC.xy*s2, p - (hC.zw+0.5)*s2);
          vec2 hp = dot(h4.xy,h4.xy) < dot(h4.zw,h4.zw) ? h4.xy : h4.zw;
          float hd = max(dot(abs(hp), vec2(0.8660254, 0.5)), abs(hp.x));
          return smoothstep(0.36, 0.5, hd) * smoothstep(-0.25, 0.25, op.y);
        }`;

      function patchMaterial(m, style) {
        m.onBeforeCompile = (shader) => {
          patchCloud(shader);
          shader.vertexShader = patch(shader.vertexShader, "animal material vs")
            .replace(
              "#include <common>",
              "#include <common>\nvarying vec3 vObjP;",
            )
            .replace(
              "#include <begin_vertex>",
              "#include <begin_vertex>\nvObjP = position;",
            ).src;
          let colorInj =
            // Sample the mottle in object space so the pattern is fixed to the skin.
            // World-space sampling made the noise swim across the body as the animal walked (a moving goat's markings would crawl).
            "gMot = _fbm3(vObjP*3.1);\n" +
            "diffuseColor.rgb *= 0.85 + 0.28*gMot;\n" +
            "diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb*vec3(0.86,0.78,0.66), (1.0-gMot)*0.22);\n";
          if (style === "shell")
            colorInj +=
              "float _sm=_hexSeam(vObjP); diffuseColor.rgb *= 1.0 - 0.45*_sm; gMot += _sm*0.3;\n";
          shader.fragmentShader = patch(
            shader.fragmentShader,
            "animal material fs",
          )
            .replace(
              "#include <common>",
              "#include <common>\nvarying vec3 vObjP;\nfloat gMot;\n" +
                NOISE_GLSL,
            )
            .replace(
              "#include <color_fragment>",
              "#include <color_fragment>\n" + colorInj,
            )
            .replace(
              "#include <roughnessmap_fragment>",
              "#include <roughnessmap_fragment>\nroughnessFactor = clamp(roughnessFactor + (gMot-0.5)*0.2, 0.05, 1.0);",
            )
            .replace(
              "#include <emissivemap_fragment>",
              "#include <emissivemap_fragment>\ntotalEmissiveRadiance += pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)),0.0,1.0), 3.0) * 0.05 * diffuseColor.rgb;",
            ).src;
        };
        // three's default cache key ignores onBeforeCompile edits, so styles must be distinguished explicitly or they'd share a compiled program.
        m.customProgramCacheKey = () => "org|" + (style || "base");
      }

      function bucketMat(roughness, overlay, style) {
        const key = roughness + "|" + (overlay ? 1 : 0) + "|" + (style || "");
        let m = _mats.get(key);
        if (!m) {
          m = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness,
            metalness: 0,
          });
          if (overlay) {
            m.polygonOffset = true;
            m.polygonOffsetFactor = -1;
            m.polygonOffsetUnits = -1;
          }
          patchMaterial(m, style);
          _mats.set(key, m);
        }
        return m;
      }

      const registry = {
        recs: [],
        batched: [],
        shadow: null, // consolidated planar-shadow BatchedMesh (stencil marker)
        shadowRecs: null, // caster recs, in shadow-instance order
        shadowMatrix: new THREE.Matrix4(), // world -> flattened-on-ground
        _sm: new THREE.Matrix4(), // scratch for S * worldMatrix
        add(rec) {
          this.recs.push(rec);
        },
        // Flatten world points onto y=eps along the fixed sun rays, computed once; the low-sun clamp guards the 1/L.y term.
        // eps MUST stay 0: the silhouette has to be coplanar with the floor.
        // Lifting it makes it float above the ground, and an oblique camera then slides it across the ground by ~eps/tan(elev) -- invisible on a cow, half a foot spread on a sparrow.
        // The marker pass is stencil-gated with depthTest and depthWrite off, so there is nothing to z-fight.
        setSun(sunPos, target, eps = 0) {
          const L = new THREE.Vector3(
            target.x - sunPos.x,
            target.y - sunPos.y,
            target.z - sunPos.z,
          ).normalize();
          const ly = Math.min(L.y, -0.15);
          const ax = L.x / ly,
            az = L.z / ly;
          // Kept as scalars as well as a matrix: _projectShadow uses these directly, and the Matrix4 is only here for anything that wants a real transform.
          this.shadowAX = ax;
          this.shadowAZ = az;
          this.shadowEps = eps;
          // row-major: x' = x - ax*y, y' = eps, z' = z - az*y
          this.shadowMatrix.set(
            1,
            -ax,
            0,
            0,
            0,
            0,
            0,
            eps,
            0,
            -az,
            1,
            0,
            0,
            0,
            0,
            1,
          );
        },
        // Largest sphere about `centre` that fits INSIDE a geometry: the min distance from that point to any face plane.
        // Exact for a convex part and safely conservative otherwise -- a curved tube gives a tiny or negative value, so it simply never swallows anything.
        // Cached per geometry.
        _inradius(geom, centre) {
          if (geom.userData._inr !== undefined) return geom.userData._inr;
          const p = geom.attributes.position,
            idx = geom.index;
          const n = idx ? idx.count : p.count;
          const a = new THREE.Vector3(),
            b = new THREE.Vector3(),
            c = new THREE.Vector3(),
            e1 = new THREE.Vector3(),
            e2 = new THREE.Vector3(),
            nr = new THREE.Vector3();
          let best = Infinity;
          for (let i = 0; i < n; i += 3) {
            const i0 = idx ? idx.getX(i) : i,
              i1 = idx ? idx.getX(i + 1) : i + 1,
              i2 = idx ? idx.getX(i + 2) : i + 2;
            a.fromBufferAttribute(p, i0);
            b.fromBufferAttribute(p, i1);
            c.fromBufferAttribute(p, i2);
            nr.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
            const len = nr.length();
            if (len < 1e-12) continue; // degenerate
            nr.multiplyScalar(1 / len);
            // signed distance from centre to this face's plane
            const d = nr.dot(e1.subVectors(a, centre));
            if (d < best) best = d;
          }
          const r = best === Infinity ? 0 : Math.max(0, best);
          geom.userData._inr = r;
          return r;
        },
        // Remove casters whose shape is wholly inside another caster's on the SAME animal.
        // Cross-animal containment would break the moment the two walk apart.
        //
        // The test runs in the SWALLOWER'S OWN LOCAL SPACE, where its ellipsoid is a unit ball.
        // World space against an inscribed sphere is far too weak for elongated bodies: a cow's barrel is 1.45 x 0.72, so the sphere it contains misses most of it.
        //
        // Still conservative, still provable.
        // The candidate is bounded by its own sphere, and pulling that into local space inflates it by at most 1/min(scale), so A_shape inside A_bound inside B_inscribed inside B_shape holds.
        // Bound-to-bound would be unsound: a leg cylinder's oversized bounding sphere would swallow parts sitting outside the leg itself.
        // Largest-first, and a part is only ever swallowed by one that is itself kept, so two identical shapes cannot cancel each other out.
        _shadowCull(casters) {
          const byAnimal = new Map();
          for (const r of casters) {
            const a = r.node.userData.animal || null;
            if (!a) continue; // scenery: never culled
            let l = byAnimal.get(a);
            if (!l) byAnimal.set(a, (l = []));
            l.push(r);
          }
          const c = new THREE.Vector3(),
            p = new THREE.Vector3();
          const drop = new Set();
          for (const list of byAnimal.values()) {
            const S = [];
            for (const r of list) {
              if (!r.geom.boundingSphere) r.geom.computeBoundingSphere();
              const bs = r.geom.boundingSphere;
              if (!bs) continue;
              const m = r.node.matrixWorld,
                e = m.elements;
              c.copy(bs.center).applyMatrix4(m);
              const sx = Math.hypot(e[0], e[1], e[2]),
                sy = Math.hypot(e[4], e[5], e[6]),
                sz = Math.hypot(e[8], e[9], e[10]);
              const lo = Math.min(sx, sy, sz),
                hi = Math.max(sx, sy, sz);
              const inr = this._inradius(r.geom, bs.center);
              S.push({
                r,
                wc: c.clone(), // world centre of the bounding sphere
                bound: bs.radius * hi, // over-estimate: always encloses
                inr, // local inscribed radius (exact for convex)
                lc: bs.center.clone(), // local centre
                inv: new THREE.Matrix4().copy(m).invert(),
                lo,
                size: inr * hi, // rough world size, for ordering only
              });
            }
            S.sort((a, b) => b.size - a.size); // best swallowers first
            const kept = [];
            for (const s of S) {
              let inside = false;
              for (const k of kept) {
                if (k.inr <= 0) continue; // non-convex: never swallows
                p.copy(s.wc).applyMatrix4(k.inv); // into k's own local space
                if (p.distanceTo(k.lc) + s.bound / k.lo <= k.inr) {
                  inside = true;
                  break;
                }
              }
              if (inside) drop.add(s.r);
              else kept.push(s);
            }
          }
          this._shadowCulled = drop.size;
          this._shadowTotal = casters.length;
          return casters.filter((r) => !drop.has(r));
        },
        build(scn) {
          const groups = new Map();
          for (const rec of this.recs) {
            const rb = Math.round(rec.roughness * 10) / 10;
            const key =
              rb + "|" + (rec.overlay ? 1 : 0) + "|" + (rec.style || "");
            let g = groups.get(key);
            if (!g) {
              g = {
                roughness: rb,
                overlay: rec.overlay,
                style: rec.style,
                recs: [],
                geoms: new Map(),
              };
              groups.set(key, g);
            }
            g.recs.push(rec);
            if (!g.geoms.has(rec.geom.uuid))
              g.geoms.set(rec.geom.uuid, rec.geom);
          }
          for (const g of groups.values()) {
            let vtx = 0,
              idx = 0;
            for (const geom of g.geoms.values()) {
              vtx += geom.attributes.position.count;
              idx += geom.index
                ? geom.index.count
                : geom.attributes.position.count;
            }
            const material = bucketMat(g.roughness, g.overlay, g.style);
            const bm = new THREE.BatchedMesh(g.recs.length, vtx, idx, material);
            // Whole-batch cull off (it spans the farm) and per-instance cull off too: three would transform a sphere and test six planes per instance every frame, while the app already decides once per ANIMAL, at 1/29th the granularity.
            // With culling and sorting both off, BatchedMesh.onBeforeRender early-outs entirely on any frame where no visibility changed.
            bm.frustumCulled = false;
            bm.perObjectFrustumCulled = false;
            bm.sortObjects = false;
            const geomIds = new Map();
            for (const [uuid, geom] of g.geoms)
              geomIds.set(uuid, bm.addGeometry(geom));
            bm.userData.recs = [];
            for (const rec of g.recs) {
              const iid = bm.addInstance(geomIds.get(rec.geom.uuid));
              rec.instanceId = iid;
              rec.bm = bm;
              rec.animal = rec.node.userData.animal || null;
              bm.setColorAt(iid, rec.color);
              bm.userData.recs[iid] = rec;
            }
            scn.add(bm);
            this.batched.push(bm);
          }

          // Consolidated planar-shadow batch: a flattened (S*world) copy of every caster, writing only stencil bit1 where a silhouette covers the ground.
          // The shade pass darkens marked pixels once.
          // Crisp at any zoom, no shadow map, no frustum.
          // Eyes and overlays opt out.
          //
          // The shadow is a FILLED silhouette, so only its outline matters and interior detail is invisible in it.
          // The flattening is affine, so containment survives it: if A's bounding sphere lies inside B's, proj(A) lies inside proj(B) and A cannot add a pixel to the silhouette.
          // Dropping those is provably lossless rather than an approximation, so nostrils, belly patches, dorsal stripes and inner ears fall out automatically with no per-species hand-marking.
          const casters = this._shadowCull(
            this.recs.filter((r) => !r.overlay && !r.noShadow),
          );
          if (casters.length) {
            const geoms = new Map();
            let vtx = 0,
              idx = 0;
            for (const r of casters)
              if (!geoms.has(r.geom.uuid)) {
                geoms.set(r.geom.uuid, r.geom);
                vtx += r.geom.attributes.position.count;
                idx += r.geom.index
                  ? r.geom.index.count
                  : r.geom.attributes.position.count;
              }
            const mark = this.shadowMark();
            const bm = new THREE.BatchedMesh(casters.length, vtx, idx, mark);
            bm.frustumCulled = false;
            // Driven from the animal's visibility like the body batches above.
            // Sound because _cullR already covers the shadow: it is padded by 1.4*scale + 0.6, against a planar reach of 0.87x height at the light's 49 degrees.
            bm.perObjectFrustumCulled = false;
            bm.sortObjects = false;
            bm.renderOrder = 1; // after opaque, before the shade pass
            const gid = new Map();
            for (const [uuid, geom] of geoms)
              gid.set(uuid, bm.addGeometry(geom));
            for (const r of casters)
              r.shadowId = bm.addInstance(gid.get(r.geom.uuid));
            scn.add(bm);
            this.shadow = bm;
            this.shadowRecs = casters;
          }

          // Per-animal rec lists so the steady-state upload touches only the instances of animals that actually changed (O(dirty), not O(all)).
          for (const rec of this.recs) {
            if (!rec.animal) continue;
            (rec.animal._recs || (rec.animal._recs = [])).push(rec);
          }
        },
        // Write one animal's instance matrices (model + its shadow casters).
        // Show or hide every instance belonging to one animal.
        // Early-outs unless the state actually flips, which is what keeps BatchedMesh's own per-frame loop switched off: it only rebuilds its draw list on frames where something changed.
        setAnimalVisible(a, vis) {
          if (a._batchVisible === vis) return;
          a._batchVisible = vis;
          const recs = a._recs;
          if (!recs) return;
          const S = this.shadow;
          for (let i = 0; i < recs.length; i++) {
            const rec = recs[i];
            rec.bm.setVisibleAt(rec.instanceId, vis);
            if (S && rec.shadowId !== undefined)
              S.setVisibleAt(rec.shadowId, vis);
          }
        },

        // S * world, written out rather than run through a general 4x4 multiply.
        // S is a shear, so 64 multiplies collapse to 8:
        //   row0 = row0 - ax*row1,  row1 kept (height),  row2 = row2 - az*row1.
        // Height is deliberately NOT flattened here; the marker shader reads it to clip at the surface and flattens to eps itself (see shadowMark).
        // Measured 2.3x faster, and it is the largest single item in the frame's matrix work -- one call per part per refreshed animal.
        // The material that writes the shadow STENCIL bit.
        // A function rather than a literal because the bales need the identical thing, and two copies of a stencil configuration is two chances to change one of them.
        // Only where ground is visible (bit0) does this set the shadow bit (bit1).
        // Floor-masked, so no depth test and no z-fight against feet.
        shadowMark() {
          const m = new THREE.MeshBasicMaterial();
          m.colorWrite = false; // stencil only, no colour
          m.depthWrite = false;
          m.depthTest = false; // gated by the ground mask, not by depth
          m.transparent = true; // sort into the post-opaque queue
          m.stencilWrite = true;
          m.stencilFunc = THREE.EqualStencilFunc;
          m.stencilRef = 3; // (ref & funcMask)=1 compares the ground bit
          m.stencilFuncMask = 1; // test bit0 only
          m.stencilWriteMask = 2; // write bit1 only ((ref & writeMask)=2)
          m.stencilZPass = THREE.ReplaceStencilOp;
          m.stencilFail = THREE.KeepStencilOp;
          m.stencilZFail = THREE.KeepStencilOp;
          // NOTHING UNDER THE PLANE CASTS ONTO IT -- decided per PIXEL.
          // Per part, by the part's pivot, fails both ways on a swimmer.
          // A goose sits 42% under the surface: its neck pivots at the waterline, so as it bobs the whole neck shadow would switch on and off while the head kept casting; and bent down to drink, the neck's pivot stays dry while half the neck is under, and the shear throws that half toward the light, onto the open water.
          // A part is not above or below the surface; its vertices are.
          //
          // So _projectShadow does not flatten: it shears x and z by height and leaves the real height in y.
          // The flatten happens here, after the height has been handed to the fragment stage, where anything below the surface is discarded before it can write stencil.
          // Height is linear across a triangle, so the cut lands exactly on the waterline.
          const reg = this;
          m.onBeforeCompile = (sh) => {
            // Proof the clip-and-flatten ran for THIS material.
            // A caller that assigns its own hook instead of chaining this one -- which leaves shadows standing upright -- leaves the flag unset, and bootChecks refuses to start.
            m.userData.surfaceClip = true;
            sh.vertexShader = patch(sh.vertexShader, "shadow marker vs")
              .replace(
                "#include <common>",
                "#include <common>\nvarying float vShadowH;",
              )
              // three's own project_vertex, with the flatten spliced in between world space and view space.
              // mvPosition is still declared, because later chunks are allowed to read it.
              .replace(
                "#include <project_vertex>",
                `vec4 _sw = vec4( transformed, 1.0 );
                 #ifdef USE_BATCHING
                   _sw = batchingMatrix * _sw;
                 #endif
                 #ifdef USE_INSTANCING
                   _sw = instanceMatrix * _sw;
                 #endif
                 _sw = modelMatrix * _sw;
                 vShadowH = _sw.y;
                 _sw.y = ${reg.shadowEps.toFixed(6)};
                 vec4 mvPosition = viewMatrix * _sw;
                 gl_Position = projectionMatrix * mvPosition;`,
              ).src;
            sh.fragmentShader = patch(sh.fragmentShader, "shadow marker fs")
              .replace(
                "#include <common>",
                "#include <common>\nvarying float vShadowH;",
              )
              // Slack (SHADOW_MIN_Y) so a foot resting exactly on the ground never flickers across the clip.
              .replace(
                "#include <clipping_planes_fragment>",
                `#include <clipping_planes_fragment>
                 if ( vShadowH < ${SHADOW_MIN_Y.toFixed(3)} ) discard;`,
              ).src;
          };
          return m;
        },

        _projectShadow(te, me) {
          const ax = this.shadowAX,
            az = this.shadowAZ;
          for (let c = 0; c < 16; c += 4) {
            const m0 = me[c],
              m1 = me[c + 1],
              m2 = me[c + 2],
              m3 = me[c + 3];
            te[c] = m0 - ax * m1;
            // Height passes through untouched: the marker shader reads it to clip at the surface, then flattens to eps itself.
            // See shadowMark().
            te[c + 1] = m1;
            te[c + 2] = m2 - az * m1;
            te[c + 3] = m3;
          }
        },

        // Every caster is uploaded every time.
        // The surface clip is per pixel, in the marker shader -- see shadowMark().
        _uploadAnimal(a) {
          const recs = a._recs;
          if (!recs) return;
          const S = this.shadow,
            tmp = this._sm,
            te = tmp.elements;
          for (let i = 0; i < recs.length; i++) {
            const rec = recs[i],
              m = rec.node.matrixWorld;
            rec.bm.setMatrixAt(rec.instanceId, m);
            if (S && rec.shadowId !== undefined) {
              // Every part casts; the marker shader cuts it at the surface.
              this._projectShadow(te, m.elements);
              S.setMatrixAt(rec.shadowId, tmp);
            }
          }
        },
        // Steady state: upload only the animals in `dirty`.
        // Full rebuilds (splash / pause / resize) pass no list and re-upload everything.
        update(dirty) {
          if (dirty) {
            const _tUp = performance.now();
            for (let i = 0; i < dirty.length; i++) this._uploadAnimal(dirty[i]);
            perfBlend("upload", performance.now() - _tUp);
            return;
          }
          const B = this.batched;
          for (let b = 0; b < B.length; b++) {
            const bm = B[b],
              recs = bm.userData.recs;
            for (let i = 0; i < recs.length; i++)
              if (recs[i])
                bm.setMatrixAt(recs[i].instanceId, recs[i].node.matrixWorld);
          }
          const S = this.shadow;
          if (S) {
            const tmp = this._sm,
              te = tmp.elements,
              recs = this.shadowRecs;
            for (let i = 0; i < recs.length; i++) {
              const e = recs[i].node.matrixWorld.elements;
              this._projectShadow(te, e);
              S.setMatrixAt(recs[i].shadowId, tmp);
            }
          }
        },
      };

      /* ====================================================================
         COLLISION -- 2D capsule/disc separation on the ground plane.

         Every agent is a capsule (segment + radius); round animals are the degenerate zero-length case, so one narrow-phase routine covers both.
         Broad phase is an unbounded spatial hash (works to any coordinate); the solver is Gauss-Seidel positional relaxation -- pushing overlaps apart along the contact normal, which removes only the penetrating component and leaves tangential motion intact: that IS the slide, and it guarantees zero residual overlap.
         Plus a small tangential term (SPIN) so that a perfectly head-on pair, which has no tangential motion to leave intact, still has somewhere to go.
         Scoped to the view frustum (+ a margin ring) so cost tracks what's on screen, not the whole world.
         SoA typed arrays, pooled buckets: no per-frame allocation.
         ==================================================================== */
      const Collision = {
        CAPSULE: new Set([
          "cow",
          "dog",
          "donkey",
          "goat",
          "goose",
          "horse",
          "pig",
          "sheep",
          "swan",
        ]),
        SLOP: 0.02, // allowed overlap; kills touching-pair jitter
        PASSES: 4,
        BETA: 1.0, // full positional projection: pairs separate in one pass
        SEP_ACCEL: 7, // separation-steering strength
        SEP_DAMP: 0.82, // kept per 1/60 s
        GRIP: 6, // driven animal braces: heavier, but not immovable
        BRACE: 1.4, // per-contact resistance: a propped animal is harder to move
        SPIN: 0.3, // tangent added to each correction, as a fraction of it (see _resolve)

        init(animals) {
          const n = (this.n = animals.length);
          this.A = animals;
          this.x = new Float32Array(n);
          this.z = new Float32Array(n);
          this.fx = new Float32Array(n);
          this.fz = new Float32Array(n);
          this.half = new Float32Array(n);
          this.off = new Float32Array(n); // capsule centre along the body axis
          this.rad = new Float32Array(n);
          this.invm = new Float32Array(n);
          this.vx = new Float32Array(n);
          this.vz = new Float32Array(n);
          this.cx = new Int32Array(n);
          this.cz = new Int32Array(n);
          this.moved = new Uint8Array(n);
          this.sup = new Uint8Array(n); // live contact count, for bracing
          this._idx = new Int32Array(n); // solvable list
          const cap = Math.max(4096, n * 16);
          this._pi = new Int32Array(cap);
          this._pj = new Int32Array(cap);
          this._pcap = cap;
          this._grid = new Map();
          this._pool = [];
          this._active = []; // buckets in use, so the reset needs no iterator
          this._cp = { c1x: 0, c1z: 0, c2x: 0, c2z: 0 };
          this._selPrev = null; // driven-animal swept origin
          this.contacts = 0;
          // Candidate pairs the broad phase had to throw away for want of room.
          // Nonzero means the non-overlap guarantee is no longer a guarantee, so it is REPORTED rather than left to be discovered as animals quietly intersecting.
          this.dropped = 0;

          let rmax = 0;
          for (let i = 0; i < n; i++) {
            const a = animals[i];
            // The solver's row for this animal, stamped once.
            a._simIdx = i;
            const fp = a._footprint || { halfX: 0.5, halfZ: 0.5, halfY: 0.5 };
            const capsule = this.CAPSULE.has(a.type);
            // The capsule segment runs along the body length (X); its radius is the thickness in every perpendicular direction, so it must cover the FULL half-width (Z) or bodies fuse side-to-side.
            // Length is set independently from half-length and clamped, so a wide animal becomes a near-disc rather than losing coverage.
            // The cozy allowance lives in SLOP, not in a shrunk radius.
            let rad, half;
            if (capsule) {
              rad = Math.max(0.95 * fp.halfZ, 0.12);
              half = Math.max(0, fp.halfX - rad); // reaches the true body ends
            } else {
              rad = Math.max(0.8 * Math.max(fp.halfX, fp.halfZ), 0.1);
              half = 0;
            }
            this.rad[i] = rad;
            this.half[i] = half;
            // Capsule centre offset along the body axis: animals are not symmetric fore/aft, so the segment sits ahead of (or behind) the group origin rather than straddling it.
            this.off[i] = fp.offX || 0;
            // Publish the capsule on the animal so anything that wants to draw it (the selection ring) uses these exact numbers rather than re-deriving them and drifting out of sync.
            a._colRad = rad;
            a._colHalf = half;
            a._colOff = this.off[i];
            // Mass ~ body VOLUME (bounding box), so weight spreads as size^3 and a mouse cannot shove a cow.
            // Absolute scale is irrelevant since the solver only uses inverse-mass ratios, so per-animal size variation rolls in for free.
            const mass = Math.max(
              fp.halfX * fp.halfZ * (fp.halfY || 0.3),
              1e-4,
            );
            this.invm[i] = 1 / mass;
            // Reach from the GROUP ORIGIN (what the spatial hash is keyed on), so an offset capsule can't poke outside its bucket and miss a pair.
            const R = Math.abs(this.off[i]) + half + rad;
            if (R > rmax) rmax = R;
          }
          this.cell = Math.max(2 * rmax, 1); // 3x3 neighborhood covers all pairs
          // Every body's own mass, kept so a flight can borrow the live value and give it back.
          // Zero in invm now MEANS "held for a landing bird" (see setHold); bootChecks makes sure no real body starts with it.
          this.invm0 = Float32Array.from(this.invm);
        },

        _key(cx, cz) {
          return ((cx * 73856093) ^ (cz * 19349663)) >>> 0;
        },
        _bucket(key) {
          let b = this._grid.get(key);
          if (!b) {
            b = this._pool.pop() || [];
            this._grid.set(key, b);
            this._active.push(b);
          }
          return b;
        },

        // 2D closest points between segments (p1->q1) and (p2->q2) -> this._cp
        _closest(p1x, p1z, q1x, q1z, p2x, p2z, q2x, q2z) {
          const d1x = q1x - p1x,
            d1z = q1z - p1z,
            d2x = q2x - p2x,
            d2z = q2z - p2z,
            rx = p1x - p2x,
            rz = p1z - p2z;
          const a = d1x * d1x + d1z * d1z,
            e = d2x * d2x + d2z * d2z,
            f = d2x * rx + d2z * rz;
          const E = 1e-9;
          let s, t;
          if (a <= E && e <= E) {
            s = 0;
            t = 0;
          } else if (a <= E) {
            s = 0;
            t = f / e < 0 ? 0 : f / e > 1 ? 1 : f / e;
          } else {
            const c = d1x * rx + d1z * rz;
            if (e <= E) {
              t = 0;
              const u = -c / a;
              s = u < 0 ? 0 : u > 1 ? 1 : u;
            } else {
              const b = d1x * d2x + d1z * d2z,
                den = a * e - b * b;
              s = den > E ? (b * f - c * e) / den : 0;
              s = s < 0 ? 0 : s > 1 ? 1 : s;
              t = (b * s + f) / e;
              if (t < 0) {
                t = 0;
                const u = -c / a;
                s = u < 0 ? 0 : u > 1 ? 1 : u;
              } else if (t > 1) {
                t = 1;
                const u = (b - c) / a;
                s = u < 0 ? 0 : u > 1 ? 1 : u;
              }
            }
          }
          const cp = this._cp;
          cp.c1x = p1x + d1x * s;
          cp.c1z = p1z + d1z * s;
          cp.c2x = p2x + d2x * t;
          cp.c2z = p2z + d2z * t;
        },

        // one capsule/capsule contact, Gauss-Seidel positional push.
        // selIdx is pinned (immovable) so the crowd yields around the driven animal.
        _resolve(i, j, selIdx) {
          // Grip lets the driven animal brace and dominate same-or-lighter neighbours, but not punch above its weight: it applies only when the driven animal is the heavier of the pair.
          // Bracing: an animal already propped against OTHER neighbours is harder to shove, because moving it means moving them too, and its live contact count approximates that for one array lookup.
          // The -1 drops this pair itself, since leaning on the pusher is not support; without it even a lone animal would feel glued down.
          // The driven animal is never braced -- leaning on the herd must not make it stronger.
          const bi = i === selIdx ? 0 : Math.max(0, this.sup[i] - 1),
            bj = j === selIdx ? 0 : Math.max(0, this.sup[j] - 1);
          const mi = this.invm[i] / (1 + this.BRACE * bi),
            mj = this.invm[j] / (1 + this.BRACE * bj);
          let wi = mi,
            wj = mj;
          if (i === selIdx && mi <= mj) wi = mi / this.GRIP;
          if (j === selIdx && mj <= mi) wj = mj / this.GRIP;
          const wsum = wi + wj;
          if (wsum <= 0) return 0;
          const hi = this.half[i],
            hj = this.half[j];
          // capsule centres sit offX ahead of the group origin along forward
          const ax = this.x[i] + this.fx[i] * this.off[i],
            az = this.z[i] + this.fz[i] * this.off[i],
            bx = this.x[j] + this.fx[j] * this.off[j],
            bz = this.z[j] + this.fz[j] * this.off[j];
          this._closest(
            ax - this.fx[i] * hi,
            az - this.fz[i] * hi,
            ax + this.fx[i] * hi,
            az + this.fz[i] * hi,
            bx - this.fx[j] * hj,
            bz - this.fz[j] * hj,
            bx + this.fx[j] * hj,
            bz + this.fz[j] * hj,
          );
          const cp = this._cp;
          let nx = cp.c1x - cp.c2x,
            nz = cp.c1z - cp.c2z;
          let d = Math.sqrt(nx * nx + nz * nz);
          const rr = this.rad[i] + this.rad[j];
          if (d >= rr - this.SLOP) return 0;
          if (d > 1e-6) {
            nx /= d;
            nz /= d;
          } else {
            // exactly coincident: shove along a stable axis
            nx = 1;
            nz = 0;
          }
          const corr = ((rr - this.SLOP - d) * this.BETA) / wsum;
          // SYMMETRY BREAK.
          // Relaxation removes only the penetrating component, which is what makes contact a slide -- but a perfectly head-on pair has no tangential component to slide on, and trades the same correction forever.
          // A fixed fraction of the correction, applied along the contact TANGENT, gives that degenerate case somewhere to go.
          // The pair rotates off each other, which is what animals do.
          // Hashed from the pair on min/max so both orderings agree: a nudge that changed its mind would be the shudder again by another route.
          // Free at rest, because corr is only nonzero while the pair is actually overlapping -- a settled herd gets no correction and so no drift.
          const spin =
            this._key(i < j ? i : j, i < j ? j : i) & 1
              ? this.SPIN
              : -this.SPIN;
          const ux = nx - nz * spin,
            uz = nz + nx * spin;
          this.x[i] += ux * corr * wi;
          this.z[i] += uz * corr * wi;
          this.x[j] -= ux * corr * wj;
          this.z[j] -= uz * corr * wj;
          return 1;
        },

        // Push neighbours out of a disc at (px,pz) radius pr -- used to sweep the driven animal's path so it can't tunnel a small agent at speed.
        _sweepPush(px, pz, pr, selIdx) {
          const cx = Math.floor(px / this.cell),
            cz = Math.floor(pz / this.cell);
          for (let ox = -1; ox <= 1; ox++)
            for (let oz = -1; oz <= 1; oz++) {
              const b = this._grid.get(this._key(cx + ox, cz + oz));
              if (!b) continue;
              for (let k = 0; k < b.length; k++) {
                const j = b[k];
                if (j === selIdx || this.invm[j] <= 0) continue;
                const hj = this.half[j];
                const bx = this.x[j] + this.fx[j] * this.off[j],
                  bz = this.z[j] + this.fz[j] * this.off[j];
                this._closest(
                  px,
                  pz,
                  px,
                  pz,
                  bx - this.fx[j] * hj,
                  bz - this.fz[j] * hj,
                  bx + this.fx[j] * hj,
                  bz + this.fz[j] * hj,
                );
                const cp = this._cp;
                let nx = cp.c2x - px,
                  nz = cp.c2z - pz,
                  d = Math.sqrt(nx * nx + nz * nz);
                const rr = pr + this.rad[j];
                if (d >= rr || d < 1e-6) continue;
                nx /= d;
                nz /= d;
                const push = rr - d;
                this.x[j] += nx * push;
                this.z[j] += nz * push;
              }
            }
        },

        // A flying bird's body stays behind to hold its landing spot: immovable, so _resolve hands every correction to the other animal, and _sweepPush already refuses to shove it.
        setHold(i, on) {
          this.invm[i] = on ? 0 : this.invm0[i];
          this.vx[i] = 0;
          this.vz[i] = 0;
        },

        solve(dt, fr, sph, sel) {
          const n = this.n,
            A = this.A,
            idx = this._idx;
          const selIdx = sel ? sel._simIdx : -1;
          const margin = this.cell;

          // classify (frustum + margin) and sync SoA
          let m = 0;
          for (let i = 0; i < n; i++) {
            this.moved[i] = 0;
            const a = A[i],
              gp = a.group.position;
            // Airborne, the body is gathered at the LANDING spot, facing the way it will land -- it is the reservation, not the bird.
            const fl = a._fl,
              air = fl !== null && fl.on;
            const px = air ? fl.x1 : gp.x,
              pz = air ? fl.z1 : gp.z;
            sph.center.set(px, (air ? 0 : gp.y) + a._cullDY, pz);
            sph.radius = a._cullR + margin;
            if (i !== selIdx && !fr.intersectsSphere(sph)) continue;
            this.x[i] = px;
            this.z[i] = pz;
            this.sup[i] = 0; // recount contacts fresh each frame
            const ry = air ? fl.yaw1 : a.group.rotation.y;
            this.fx[i] = Math.cos(ry);
            this.fz[i] = -Math.sin(ry);
            this.cx[i] = Math.floor(px / this.cell);
            this.cz[i] = Math.floor(pz / this.cell);
            idx[m++] = i;
          }

          // Build the hash.
          // Recycled through _active by index rather than this._grid.values(), which would allocate an iterator every frame.
          const act = this._active;
          for (let k = 0; k < act.length; k++) {
            act[k].length = 0;
            this._pool.push(act[k]);
          }
          act.length = 0;
          this._grid.clear();
          for (let s = 0; s < m; s++) {
            const i = idx[s];
            this._bucket(this._key(this.cx[i], this.cz[i])).push(i);
          }

          // candidate pairs via the half-neighbourhood (each unordered pair once)
          const OFF = Collision._OFF;
          let np = 0;
          const pi = this._pi,
            pj = this._pj,
            cap = this._pcap;
          let dropped = 0;
          for (let s = 0; s < m; s++) {
            const i = idx[s],
              cx = this.cx[i],
              cz = this.cz[i];
            for (let o = 0; o < OFF.length; o += 2) {
              const b = this._grid.get(this._key(cx + OFF[o], cz + OFF[o + 1]));
              if (!b) continue;
              const self = OFF[o] === 0 && OFF[o + 1] === 0;
              for (let k = 0; k < b.length; k++) {
                const j = b[k];
                if (self ? j <= i : j === i) continue;
                if (np < cap) {
                  pi[np] = i;
                  pj[np] = j;
                  np++;
                } else dropped++;
              }
            }
          }
          this._npair = np;
          this.dropped = dropped;

          // separation steering (phase 5): near pairs get a gentle repulsion, measured capsule surface-to-surface so parallel bodies don't shove.
          // SEP_DAMP is the fraction kept per 1/60 s, so the decay is in time, not in calls (see RELAX IN TIME).
          // Identical at 60Hz; at 144Hz a per-call factor would bleed separation 2.4x faster.
          const damp = Math.pow(this.SEP_DAMP, dt * 60);
          for (let s = 0; s < m; s++) {
            const i = idx[s];
            this.vx[i] *= damp;
            this.vz[i] *= damp;
          }
          const BUF = 0.5;
          const CONTACT = 0.06; // touching, as opposed to merely nearby
          for (let p = 0; p < np; p++) {
            const i = pi[p],
              j = pj[p],
              hi = this.half[i],
              hj = this.half[j];
            const ax = this.x[i] + this.fx[i] * this.off[i],
              az = this.z[i] + this.fz[i] * this.off[i],
              bx = this.x[j] + this.fx[j] * this.off[j],
              bz = this.z[j] + this.fz[j] * this.off[j];
            this._closest(
              ax - this.fx[i] * hi,
              az - this.fz[i] * hi,
              ax + this.fx[i] * hi,
              az + this.fz[i] * hi,
              bx - this.fx[j] * hj,
              bz - this.fz[j] * hj,
              bx + this.fx[j] * hj,
              bz + this.fz[j] * hj,
            );
            const cp = this._cp;
            let nx = cp.c1x - cp.c2x,
              nz = cp.c1z - cp.c2z;
            const d = Math.sqrt(nx * nx + nz * nz);
            if (d < 1e-6) continue;
            const surf = d - (this.rad[i] + this.rad[j]);
            // Tally genuine contacts (not the wider steering buffer) for the bracing term.
            // This pass already has the surface distance, so the count is free -- no extra pass, no extra closest-point work.
            if (surf < CONTACT) {
              if (this.sup[i] < 255) this.sup[i]++;
              if (this.sup[j] < 255) this.sup[j]++;
            }
            if (surf >= BUF) continue;
            nx /= d;
            nz /= d;
            const w = (BUF - surf) * this.SEP_ACCEL * dt;
            this.vx[i] += nx * w;
            this.vz[i] += nz * w;
            this.vx[j] -= nx * w;
            this.vz[j] -= nz * w;
          }
          for (let s = 0; s < m; s++) {
            const i = idx[s];
            if (i === selIdx || this.invm[i] === 0) continue; // a held landing spot does not drift
            this.x[i] += this.vx[i] * dt;
            this.z[i] += this.vz[i] * dt;
          }

          // Swept pre-push for the driven animal: sample its path this frame and shove anything along it, so a sprint cannot tunnel.
          // Runs before relaxation so the solver finalises everything, and the driven animal yields by mass (GRIP) rather than being pinned.
          if (selIdx >= 0) {
            if (!this._selPrev || this._selCur !== sel) {
              this._selPrev = { x: this.x[selIdx], z: this.z[selIdx] };
              this._selCur = sel;
            }
            const pr = this.rad[selIdx],
              px0 = this._selPrev.x,
              pz0 = this._selPrev.z;
            const sx = this.x[selIdx] - px0,
              sz = this.z[selIdx] - pz0,
              sd = Math.sqrt(sx * sx + sz * sz);
            if (sd > pr) {
              const steps = Math.min(8, Math.ceil(sd / (0.6 * pr)));
              for (let k = 1; k < steps; k++) {
                const u = k / steps;
                this._sweepPush(px0 + sx * u, pz0 + sz * u, pr, selIdx);
              }
            }
          }

          // positional relaxation (the slide + non-overlap guarantee) Forget the driven animal's swept origin whenever nothing is being driven through the solver -- including while the driven animal is IN THE AIR.
          // Otherwise the first frame after it lands would sweep from its takeoff spot to its landing spot, shoving every animal along the flight line.
          if (selIdx < 0) this._selCur = null;
          let contacts = 0;
          for (let pass = 0; pass < this.PASSES; pass++) {
            let c = 0;
            for (let p = 0; p < np; p++)
              c += this._resolve(pi[p], pj[p], selIdx);
            if (pass === 0) contacts = c;
            if (c === 0) break;
          }

          // write back displaced positions (incl.
          // the driven animal, which can now be nudged by heavier neighbours); flag movers for re-upload.
          for (let s = 0; s < m; s++) {
            const i = idx[s];
            if (this.invm[i] === 0) continue; // a reservation: the bird itself is elsewhere, flying
            const gp = A[i].group.position;
            if (
              Math.abs(this.x[i] - gp.x) > 1e-5 ||
              Math.abs(this.z[i] - gp.z) > 1e-5
            ) {
              gp.x = this.x[i];
              gp.z = this.z[i];
              if (i !== selIdx) this.moved[i] = 1;
            }
          }
          if (selIdx >= 0 && this._selPrev) {
            this._selPrev.x = this.x[selIdx];
            this._selPrev.z = this.z[selIdx];
          }
          this.contacts = contacts;
        },
      };
      // self + 4 forward neighbours: visits each unordered cross pair once
      Collision._OFF = [0, 0, 1, 0, 1, 1, 0, 1, -1, 1];

      // Per species: pause length, roam distance, cohesion, water affinity.
      // Gait is derived from actual displacement, so the swim blend, footsteps and shadows all follow from one measurement.
      const BEHAVIOUR = {
        chick: { p: [1, 4], r: [2, 6], s: 0.85, w: 0.05 },
        chicken: { p: [2, 6], r: [3, 9], s: 0.55, w: 0.1 },
        cow: { p: [6, 15], r: [4, 12], s: 0.6, w: 0.25 },
        dog: { p: [2, 6], r: [6, 20], s: 0.3, w: 0.15 },
        donkey: { p: [5, 12], r: [5, 14], s: 0.4, w: 0.2 },
        duck: { p: [3, 8], r: [3, 11], s: 0.6, w: 0.9 },
        frog: { p: [2, 7], r: [2, 7], s: 0.2, w: 0.95 },
        goat: { p: [3, 9], r: [5, 16], s: 0.3, w: 0.15 },
        goose: { p: [3, 8], r: [4, 13], s: 0.75, w: 0.9 },
        hedgehog: { p: [5, 12], r: [2, 7], s: 0.1, w: 0.1 },
        horse: { p: [4, 10], r: [6, 20], s: 0.5, w: 0.2 },
        mouse: { p: [1, 4], r: [2, 7], s: 0.3, w: 0.05 },
        //            pause(s)     roam(u)    social  water
        pig: { p: [4, 11], r: [4, 14], s: 0.35, w: 0.1 },
        rabbit: { p: [2, 6], r: [4, 13], s: 0.45, w: 0.05 },
        rooster: { p: [2, 5], r: [5, 16], s: 0.35, w: 0.1 },
        sheep: { p: [5, 13], r: [4, 12], s: 0.8, w: 0.15 },
        sparrow: { p: [1, 3], r: [5, 18], s: 0.6, w: 0.2 },
        swan: { p: [4, 10], r: [4, 12], s: 0.55, w: 0.96 },
        turkey: { p: [3, 8], r: [4, 11], s: 0.45, w: 0.1 },
        turtle: { p: [12, 26], r: [1.5, 5], s: 0.1, w: 0.5 },
      };

      /* ====================================================================
         FLIGHT -- short repositioning hops for the birds that really fly
         ====================================================================
         A flight is a PLAN, not a simulation.
         At takeoff the bird picks where it will land, reserves that spot, and fixes its whole path.
         Nothing is steered, integrated or collided while it is in the air, which is what keeps it cheap and what makes it impossible for it to go wrong in the middle.
         THE PATH is a climb line at the species' own angle, a cruise cap, and a glide line down, blended smoothly -- AS SHALLOW AS SAFETY ALLOWS, per flight.
         Climbing to clear the tallest thing anywhere near the route makes every take-off a helicopter, so instead each obstacle constrains only the stretch of path that passes over it: a sheep 5m along makes the climb just steep enough to clear the sheep at 5m, and nothing else.
         Open ground gives a natural angled take-off and a long glide in; only something right beside the bird forces a vertical start.
         An animal's reach grows with how long the bird takes to get to it, because one beside the take-off spot barely moves before the bird is past, and one mid-route has time to wander in.
         Its landing spot is held for the whole flight: its own collision body waits there, immovable, so the solver keeps every other animal out and it lands on empty ground.
         Only the species that genuinely fly.
         Chickens, roosters and turkeys can only flutter, which is low enough to meet a sheep, and chicks cannot, so they stay on the ground.
           range   metres to the landing spot     cruise  metres above the CEILING (see _ceiling)
           speed   peak across the ground, m/s    climb/drop  vertical, m/s, where it must go straight
           climbSlope / glideSlope   rise per metre flown: 0.62 is 32 degrees, 0.28 is 16
           flapHz  wingbeats per second           flapAmp radians of stroke
           neck    how far the neck reaches forward in flight, as a FRACTION OF THAT BIRD'S OWN GRAZE
                   SWING: 0.5 is halfway down to the grass. Never past horizontal (see _flightNeck), so
                   a large value just flattens it -- which is how geese and swans actually fly.
         Swans climb shallowest -- they need a long run to get airborne -- sparrows steepest.
         SIZED TO THIS WORLD: a cruise at about 3m -- under a scarecrow's hat -- over hops of about 12m is lost in a field you can see 170m into.
         Every cruise clears the tallest thing that exists anywhere (the ceiling), and flights cross a real part of the view.
         ==================================================================== */
      const FLIGHT = {
        duck: {
          water: 1,
          range: [14, 38],
          cruise: [0.8, 2.0],
          speed: 8.5,
          climb: 2.4,
          drop: 1.9,
          climbSlope: 0.62,
          glideSlope: 0.36,
          flapHz: 5.5,
          flapAmp: 1.35,
          neck: 0.6,

          // Ascending edges, always: GLSL leaves smoothstep undefined when edge0 >= edge1, so the gap end is reached by inverting, not by writing the arguments backwards.
          // Tight window on purpose: widened out to 0.26-0.70 the transition spanned 85 world units, which is a gradient, not an edge.
          // At 0.38-0.58 it is 15u -- about five seconds to sweep over you.
          return mix(CLOUD_LO, CLOUD_HI, 1.0 - smoothstep(0.38, 0.58, c));
        }`;

      // Every material that takes the cloud registers its compiled shader here, which is the only handle three gives me to a built-in material's injected uniforms.
      // Driven once per frame from one clock.
      const CLOUD_SHADERS = [];

      // Patches a MeshStandardMaterial to take the cloud.
      // CALL THIS FIRST inside an onBeforeCompile, before the material's own replaces: two of the four sites overwrite <color_fragment> outright rather than prefixing it, so a later injection would have nothing left to attach to.
      function patchCloud(sh) {
        sh.vertexShader = patch(sh.vertexShader, "cloud shadow vs")
          .replace(
            "#include <common>",
            "#include <common>\nvarying highp vec3 vCloudP;",
          )
          // AFTER project_vertex, not after begin_vertex: batchingMatrix is declared inside the batching chunk and the herd is a BatchedMesh, so object space is not where any animal actually stands.
          // This is three's own worldpos_vertex idiom, guards and all.
          .replace(
            "#include <project_vertex>",
            `#include <project_vertex>
             vec4 _cwp = vec4( transformed, 1.0 );
             #ifdef USE_BATCHING
               _cwp = batchingMatrix * _cwp;
             #endif
             #ifdef USE_INSTANCING
               _cwp = instanceMatrix * _cwp;
             #endif
             vCloudP = ( modelMatrix * _cwp ).xyz;`,
          ).src;
        sh.fragmentShader = patch(sh.fragmentShader, "cloud shadow fs")
          .replace(
            "#include <common>",
            "#include <common>\nvarying highp vec3 vCloudP;\nuniform float uCloudT;\n" +
              GLSL_HASH +
              GLSL_NOISE2 +
              GLSL_CLOUD,
          )
          // Multiplying the ALBEDO is the same thing as dimming the light here: one directional source, everything rough, no metal.
          .replace(
            "#include <color_fragment>",
            "#include <color_fragment>\ndiffuseColor.rgb *= cloudLight(vCloudP.xz, uCloudT);",
          ).src;
        sh.uniforms.uCloudT = { value: 0 };
        CLOUD_SHADERS.push(sh);
      }

      // Integer lattice hash.
      // Math.imul is a 32-bit multiply that wraps exactly like GLSL's uint multiply, and >>>0 matches uint(int) for negatives.
      // Fraction of the way to close a gap this frame, for a first-order approach at `rate` per second, frame-rate independent by construction: two half-steps compose into one whole one, which a linear min(1, dt*rate) does not.
      const approach = (rate, dt) => 1 - Math.exp(-rate * dt);

      // REST IS A FIXED POINT, not an asymptote.
      // Multiplying a joint toward zero never arrives, and every write to an Euler recomputes its quaternion, so an idle animal would pay a dozen trig-heavy conversions per pose refresh, forever, to move nothing.
      // Within REST_EPS of rest (0.006 degrees, far under a pixel) it lands on exactly zero once and then writes nothing at all.
      // Stateless on purpose: anything else that bends one of these joints pushes it back past the threshold and the decay resumes, so no other writer has to know this exists.
      // `full` is Animal's rest, which also relaxes body yaw, neck yaw and head roll; the hoppers leave those to their own code.
      const REST_EPS = 1e-4;
      function restSettled(a, full) {
        const E = REST_EPS,
          br = a.bodyRoot,
          hr = a.headRoot,
          nm = full ? a.neckMount : null,
          legs = a.legs;
        if (Math.abs(a._baseY) > E) return false;
        if (br) {
          const r = br.rotation;
          if (
            Math.abs(r.x) > E ||
            Math.abs(r.z) > E ||
            (full && Math.abs(r.y) > E)
          )
            return false;
        }
        if (nm && Math.abs(nm.rotation.y) > E) return false;
        if (hr) {
          const r = hr.rotation;
          if (Math.abs(r.x) > E || (full && Math.abs(r.z) > E)) return false;
        }
        for (let i = 0; i < legs.length; i++) {
          const l = legs[i];
          if (
            Math.abs(l.hip.rotation.z) > E ||
            Math.abs(l.knee.rotation.z) > E ||
            Math.abs(l.ankle.rotation.z) > E
          )
            return false;
        }
        // Inside the threshold.
        // Only what is not already zero is written, so a settled animal costs these reads and nothing else.
        a._baseY = 0;
        if (br) {
          const r = br.rotation;
          if (r.x !== 0 || r.z !== 0 || (full && r.y !== 0))
            r.set(0, full ? 0 : r.y, 0);
        }
        if (nm && nm.rotation.y !== 0) nm.rotation.y = 0;
        if (hr) {
          const r = hr.rotation;
          if (r.x !== 0 || (full && r.z !== 0)) r.set(0, r.y, full ? 0 : r.z);
        }
        for (let i = 0; i < legs.length; i++) {
          const l = legs[i];
          if (l.hip.rotation.z !== 0) l.hip.rotation.z = 0;
          if (l.knee.rotation.z !== 0) l.knee.rotation.z = 0;
          if (l.ankle.rotation.z !== 0) l.ankle.rotation.z = 0;
        }
        return true;
      }

      // HOP CURVE, at module scope (as is smooth01, for _hopLunge) rather than closures inside Hopper._hopArc: that runs per hopping animal per refreshed frame, and two closures plus a result object per hopper per frame is garbage for nothing.
      function hopY(c, height, A, cap) {
        c = ((c % 1) + 1) % 1;
        if (c < A) {
          const tau = c / A;
          return height * 4 * tau * (1 - tau);
        }
        const u = (c - A) / (1 - A),
          m = ((4 * height) / A) * (1 - A);
        const h10 = u * u * u - 2 * u * u + u,
          h11 = u * u * u - u * u;
        const y = h10 * -m + h11 * m; // cushion + crouch (dips below 0)
        return -cap * Math.tanh(-y / cap); // soft-limit, seam slopes preserved
      }
      function smooth01(a, b, x) {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }
      // The flight path's height at a distance x along it (see FLIGHT).
      // Soft-min, not min: a hard min puts a corner where the climb meets the cruise, and a corner in a path is an instant change of vertical speed -- the bird would visibly jerk level.
      function softMin(a, b, k) {
        const h = Math.max(k - Math.abs(a - b), 0) / k;
        return Math.min(a, b) - h * h * k * 0.25;
      }
      function flightY(fl, x) {
        return softMin(
          softMin(fl.vA + fl.kA * x, fl.vC + fl.kC * (fl.D - x), FLIGHT_SOFT),
          fl.H,
          FLIGHT_SOFT,
        );
      }
      // _hopArc's result, written in place.
      // Safe to share: both callers read all three fields before anything else can call _hopArc, and there is one thread.
      const _HOP_ARC = { y: 0, vN: 0, airT: 0 };

      function _thash(x, y) {
        let h =
          (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
        return (((h ^ (h >>> 16)) >>> 0) & 0xffffff) / 16777216;
      }
      function _tnoise(x, y) {
        const ix = Math.floor(x),
          iy = Math.floor(y);
        let fx = x - ix,
          fy = y - iy;
        fx = fx * fx * (3 - 2 * fx);
        fy = fy * fy * (3 - 2 * fy);
        const a = _thash(ix, iy),
          b = _thash(ix + 1, iy),
          c = _thash(ix, iy + 1),
          d = _thash(ix + 1, iy + 1);
        return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
      }
      // 2-octave fbm.
      // The shader's version also band-limits by pixel footprint; the sim has no pixels, so it just evaluates every octave -- which is what the shader converges to up close, where it matters.
      function _tfbm2(x, y) {
        return (_tnoise(x, y) * 0.5 + _tnoise(x * 2, y * 2) * 0.25) / 0.75;
      }
      // Raw lake field at a world position.
      // > LAKE_LVL is water.
      function waterAt(x, z) {
        const T = TERRAIN;
        const qx = x * T.WARP_F,
          qz = z * T.WARP_F;
        const wx = _tnoise(qx, qz) - 0.5,
          wz = _tnoise(qx + 31.4, qz + 31.4) - 0.5;
        return _tfbm2(
          (x + wx * T.WARP_A) * T.LAKE_F + T.LAKE_SEED,
          (z + wz * T.WARP_A) * T.LAKE_F + T.LAKE_SEED,
        );
      }
      const isWater = (x, z) => waterAt(x, z) > TERRAIN.LAKE_LVL;

      /* ====================================================================
         HAY BALES -- permanent, and stored nowhere
         ====================================================================
         The rule this file already follows twice: anything with STATE gets a pool and a recycler, anything STATELESS gets a hash.
         Animals are recycled because they carry position, gait, intent and contacts, so you can only afford a hundred and they have to move.
         A bale carries nothing, so it is not an object that exists somewhere -- it is a function OF somewhere.
         Presence, jitter, length, radius and heading all fall out of the cell's hash.
         Permanence is then not a feature, it is a consequence.
         The same cell hashes to the same bale an hour later, after a reload, and on someone else's machine, with no save file and no persistence layer, because nothing was ever stored.
         Identity comes from the CELL, never from the slot -- the same mistake the moths call out.
         A slot is a view of whichever cell it happens to be showing.
         ==================================================================== */
      const BALE_CELL = 26; // one candidate site per cell
      const BALE_ODDS = 0.34; // how many of those sites actually hold a bale
      // Ring sized so a site enters the window past FOG_OPAQUE, where the fog curve is provably 1.
      const BALE_RING = Math.ceil(FOG_OPAQUE / BALE_CELL);
      const BALE_SLOTS = (2 * BALE_RING + 1) * (2 * BALE_RING + 1);

      /* ====================================================================
         SCARECROWS -- hashed like the bales, and the only still thing that moves
         ====================================================================
         Same rule as the bales: no state, so no pool and no recycler.
         Presence, lean, height, cloth colour and the droop of the arms all fall out of the cell hash, and permanence is a consequence rather than a feature.
         SPARSE, deliberately.
         A human silhouette standing motionless in fog is the most loaded object that could be put in this field, and it works exactly once per sighting.
         At one per 90-unit cell with a 45% chance there are three or four inside the fog radius, so finding one is an event rather than scenery.
         ONE draw call, and one instance matrix each.
         Everything that varies between them is either baked into that matrix (yaw, lean, height) or carried on the instance colour (the cloth) or derived in the shader from where the instance stands -- which is free, because the instance matrix is already in the vertex shader and its translation is as good a seed as any hash.
         The sway is the point.
         Nothing else in this world moves without being alive, and a scarecrow shifting slightly in the wind is unsettling in a way that a static one is not.
         It is a vertex offset weighted by height, so the stake barely moves, the arms swing, and the coat drags.
         Tall enough to be worth checking the shadow: the shear is 0.87 units per unit of height, so a 2.4-unit scarecrow lays a 2.1-unit shadow -- shorter than a bale is wide, and no occlusion problem at this sun angle.
         ==================================================================== */
      const CROW_CELL = 110;
      const CROW_ODDS = 0.14; // about one inside the fog radius: a sighting, not scenery
      const CROW_RING = Math.ceil(FOG_OPAQUE / CROW_CELL);
      const CROW_SLOTS = (2 * CROW_RING + 1) * (2 * CROW_RING + 1);
      const Scarecrows = {
        topY: 0, // highest point of the built geometry (see build)
        n: 0,
        x: new Float32Array(CROW_SLOTS),
        z: new Float32Array(CROW_SLOTS),
        r: new Float32Array(CROW_SLOTS),
        _cx: null,
        _cz: null,
        _u: [], // the uniform blocks of every program built from this geometry

        // Built from parts and merged by hand into one non-indexed buffer, because one draw call is worth more than the convenience of keeping them separate.
        // Every vertex carries its own BASE colour and a CLOTH flag: only the cloth may take the per-instance tint, or the sack head comes out the colour of the coat.
        // Nothing carries a sway weight.
        // The body leans as one piece about the foot of the stake, and a per-part weight on top of that is a shirt sliding on its own post.
        geometry() {
          const parts = [];
          const add = (g, col, cloth, part) => {
            const ng = g.index ? g.toNonIndexed() : g; // warns and copies for nothing if it is already non-indexed
            const n = ng.attributes.position.count;
            const c = new Float32Array(n * 3),
              b = new Float32Array(n * 3),
              f = new Float32Array(n),
              pt = new Float32Array(n);
            const pos = ng.attributes.position;
            for (let i = 0; i < n; i++) {
              f[i] = cloth ? 1 : 0;
              pt[i] = part || 0;
              for (let k = 0; k < 3; k++) {
                // `color` is what three multiplies the instance tint into, so cloth goes in white and takes its colour from the instance.
                c[i * 3 + k] = cloth ? 1 : col[k];
                b[i * 3 + k] = col[k];
              }
            }
            ng.setAttribute("aPart", new THREE.BufferAttribute(pt, 1));
            ng.setAttribute("aCloth", new THREE.BufferAttribute(f, 1));
            ng.setAttribute("aBase", new THREE.BufferAttribute(b, 3));
            ng.setAttribute("color", new THREE.BufferAttribute(c, 3));
            parts.push(ng);
          };
          const WOOD = [0.34, 0.27, 0.2],
            FELT = [0.3, 0.25, 0.21],
            CLOTH = [1, 1, 1],
            SACK = [0.74, 0.65, 0.46],
            STRAW = [0.86, 0.75, 0.45];

          const BAR_Y = 2.95,
            HEAD_Y = 3.45,
            HEAD_R = 0.3;

          // The head spans 3.105 to 3.795 and is 0.297 wide at that height against a 0.15 stake, so the top is buried with room to spare.
          const stake = new THREE.BoxGeometry(0.15, 3.55, 0.15);
          stake.translate(0, 1.775, 0);
          add(stake, WOOD, false, 0);

          for (const [sx, part] of [
            [-1, 1],
            [1, 2],
          ]) {
            const half = new THREE.BoxGeometry(1.05, 0.11, 0.11);
            half.translate(sx * 0.525, BAR_Y, 0);
            add(half, WOOD, false, part);
          }

          // ONE LATHED SURFACE, hem to shoulder to collar.
          //
          // A cone with a dome on top cannot be made to work here, and the reason is worth keeping: the cone is a nine-sided prism and the dome is near-round, so at equal radius the dome stands thirty thousandths proud at every face centre and scallops through.
          // Shrinking it to the inradius only moves the error to the corners.
          // It is the same trap the animal spots document -- a smooth cap over a faceted host.
          // A profile revolved once has no join to get wrong, no rim to round off, and no second tessellation to match.
          // The shoulders are in the profile, which is where a garment's shape lives.
          const coat = new THREE.LatheGeometry(
            [
              [0.0, 1.43], // closed underneath, so the hem is never seen from below
              [0.4, 1.43],
              [0.46, 2.1],
              [0.52, 2.8], // widest at the shoulder
              [0.5, 2.95],
              [0.44, 3.06], // and over the top
              [0.3, 3.13],
              [0.14, 3.16],
              [0.0, 3.17],
            ].map(([r, y]) => new THREE.Vector2(r, y)),
            11,
          );
          coat.scale(1, 1, 0.62);
          add(coat, CLOTH, true, 0);

          for (const [sx, part] of [
            [-1, 1],
            [1, 2],
          ]) {
            // Starts at x = 0.18, well inside the yoke, so the root is buried at every droop angle rather than flush against a surface it can slide off.
            const sl = new THREE.CylinderGeometry(0.19, 0.11, 0.87, 6, 1);
            sl.rotateZ(Math.PI / 2);
            sl.translate(sx * 0.625, BAR_Y - 0.02, 0);
            add(sl, CLOTH, true, part);
          }

          const head = new THREE.IcosahedronGeometry(HEAD_R, 1);
          head.scale(1, 1.15, 0.95);
          head.translate(0, HEAD_Y, 0);
          add(head, SACK, false, 0);

          // THE HAT, rotated about the HEAD rather than about its own centre.
          const LEAN = 0.13;
          const hatAt = (g, dy) => {
            g.rotateZ(LEAN);
            g.translate(-Math.sin(LEAN) * dy, HEAD_Y + Math.cos(LEAN) * dy, 0);
            add(g, FELT, false, 3);
          };
          // Pulled DOWN onto the skull, not balanced on top of it.
          // At +0.12 the brim sits below the widest point and the crown swallows the top of the head, which is where a hat that has been rained on for a season actually ends up.
          hatAt(new THREE.CylinderGeometry(0.54, 0.47, 0.06, 10, 1), 0.12);
          hatAt(new THREE.CylinderGeometry(0.21, 0.31, 0.34, 10, 1), 0.3);

          // STRAW, out of every opening.
          const wisp = (len, x, y, z, yaw, pitch, part) => {
            const w = new THREE.CylinderGeometry(0.015, 0.035, len, 3, 1);
            w.translate(0, len * 0.5, 0);
            w.rotateZ(pitch);
            w.rotateY(yaw);
            w.translate(x, y, z);
            add(w, STRAW, false, part);
          };
          for (const [sx, yaw, part] of [
            [-1, Math.PI, 1],
            [1, 0, 2],
          ]) {
            // out of the cuffs, in a small fan -- tagged with the arm, so it droops with it
            wisp(0.72, sx * 1.02, BAR_Y - 0.02, 0.03, yaw, -1.44, part);
            wisp(0.58, sx * 1.0, BAR_Y + 0.02, -0.05, yaw - 0.35, -1.2, part);
            wisp(0.5, sx * 1.0, BAR_Y - 0.06, 0.06, yaw + 0.4, -1.75, part);
          }
          // out of the hem
          wisp(0.46, 0.18, 1.5, 0.12, 0.5, -2.2, 0);
          wisp(0.4, -0.22, 1.49, -0.08, 3.7, -2.35, 0);
          wisp(0.34, 0.04, 1.52, -0.2, 2.2, -2.5, 0);
          // and at the neck, where the head meets the coat
          wisp(0.34, 0.15, 3.06, 0.1, 0.9, -1.0, 0);
          wisp(0.3, -0.16, 3.05, -0.06, 4.0, -0.85, 0);

          let total = 0;
          for (const g of parts) total += g.attributes.position.count;
          const P = new Float32Array(total * 3),
            N = new Float32Array(total * 3),
            C = new Float32Array(total * 3),
            B = new Float32Array(total * 3),
            F = new Float32Array(total),
            PT = new Float32Array(total);
          let o = 0;
          for (const g of parts) {
            const n = g.attributes.position.count;
            P.set(g.attributes.position.array, o * 3);
            N.set(g.attributes.normal.array, o * 3);
            C.set(g.attributes.color.array, o * 3);
            B.set(g.attributes.aBase.array, o * 3);
            F.set(g.attributes.aCloth.array, o);
            PT.set(g.attributes.aPart.array, o);
            o += n;
          }
          const out = new THREE.BufferGeometry();
          out.setAttribute("position", new THREE.BufferAttribute(P, 3));
          out.setAttribute("normal", new THREE.BufferAttribute(N, 3));
          out.setAttribute("color", new THREE.BufferAttribute(C, 3));
          out.setAttribute("aBase", new THREE.BufferAttribute(B, 3));
          out.setAttribute("aCloth", new THREE.BufferAttribute(F, 1));
          out.setAttribute("aPart", new THREE.BufferAttribute(PT, 1));
          return out;
        },

        // THE SHADOW HAS TO MOVE THE SAME PARTS THE BODY DOES.
        //
        // The arms droop and the hat vanishes in the vertex shader, so the shadow needs the same patch or it casts the geometry as authored.
        // So the vertex patch is written once and applied to both materials.
        // The shadow needs no colour work at all, which is why only the fragment half differs.
        // THE SHADOW HAS TO MOVE THE SAME PARTS THE BODY DOES.
        //
        // So the vertex half is written once and handed to both materials.
        // The shadow wants none of the colour work, which is the only part that differs.
        _vertexPatch(sh) {
          sh.uniforms.uTime = { value: 0 };
          this._u.push(sh.uniforms);
          sh.vertexShader = patch(sh.vertexShader, "scarecrow sway vs")
            .replace(
              "#include <common>",
              "#include <common>\nattribute float aPart;\nattribute vec4 aVar;\nuniform float uTime;",
            )
            .replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>
               // ARMS.
               // Parts 1 and 2 are a half-crossbar, a sleeve and its cuff straw, pivoting together about the shoulder -- which is why the bar is built in halves.
               if (aPart > 0.5 && aPart < 2.5) {
                 float ang = aPart < 1.5 ? aVar.x : aVar.y;
                 float c = cos(ang), s = sin(ang);
                 vec3 o = transformed - vec3(0.0, 2.95, 0.0);
                 transformed.x = o.x * c - o.y * s;
                 transformed.y = o.x * s + o.y * c + 2.95;
               }
               // HAT.
               // A missing one collapses to a point at the crown rather than being hidden: hiding wants a second draw call, and a point has no area to rasterise.
               if (aPart > 2.5) {
                 transformed = mix(vec3(0.0, 3.45, 0.0), transformed, aVar.z);
               }
               {
                 // Seeded from where this instance stands, so no two are on the same beat and none of it costs an attribute.
                 float seed = instanceMatrix[3].x * 0.7 + instanceMatrix[3].z * 1.3;
                 float t = uTime * 0.9 + seed;
                 // Two rates that do not divide into each other: a gust that never quite repeats, rather than a pendulum.
                 float s = sin(t) * 0.55 + sin(t * 1.73 + 1.1) * 0.3;
                 // THE WHOLE THING LEANS, about the foot of the stake.
                 // Offsetting each part horizontally instead is a shear: the post stays put while everything bolted to it slides sideways, which is the one thing a scarecrow cannot do.
                 // A lean is a rotation about the ground contact, and to first order that is a displacement proportional to HEIGHT -- so it costs exactly what the shear cost and is the correct shape.
                 // At 0.034 radians the head moves about an eighth of a unit, which is a stake worked loose in soft ground rather than a tree in a gale.
                 transformed.x += transformed.y * s * 0.034;
                 transformed.z += transformed.y * s * 0.023;
               }`,
            ).src;
        },

        material() {
          const m = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0,
            vertexColors: true,
          });
          m.onBeforeCompile = (sh) => {
            patchCloud(sh);
            this._vertexPatch(sh);
            sh.vertexShader = patch(sh.vertexShader, "scarecrow vs")
              .replace(
                "#include <common>",
                "#include <common>\nattribute float aCloth;\nattribute vec3 aBase;\nvarying float vCloth;\nvarying vec3 vBase;\nvarying float vShade;\nvarying vec3 vObjP;",
              )
              .replace(
                "#include <begin_vertex>",
                "#include <begin_vertex>\nvCloth = aCloth;\nvBase = aBase;\nvShade = aPart > 2.5 ? aVar.w : 1.0;\nvObjP = position;",
              ).src;
            // vColor is the geometry colour times the instance colour, and only the cloth wants the tint.
            // Everything else takes its base colour straight.
            // .rgb and not vColor itself: three declares that varying vec4 under USE_COLOR_ALPHA and vec3 otherwise, and mix() has no overload that takes one of each.
            // A swizzle reads correctly from both.
            // Guarded too, because the include being replaced is the only thing that declares vColor at all -- if the defines ever change, a missing varying should not take the whole material down.
            sh.fragmentShader = patch(sh.fragmentShader, "scarecrow fs")
              .replace(
                "#include <roughnessmap_fragment>",
                "#include <roughnessmap_fragment>\nroughnessFactor = clamp(roughnessFactor - (gCloth - 0.5) * 0.3 * vCloth, 0.4, 1.0);",
              )
              .replace(
                "#include <common>",
                "#include <common>\nvarying float vCloth;\nvarying vec3 vBase;\nvarying float vShade;\nvarying vec3 vObjP;\nfloat gCloth;\n" +
                  NOISE_GLSL,
              )
              .replace(
                "#include <color_fragment>",
                "#if defined( USE_COLOR ) || defined( USE_COLOR_ALPHA )\n" +
                  "  diffuseColor.rgb *= mix(vBase, vColor.rgb, vCloth);\n" +
                  "#endif\n" +
                  "diffuseColor.rgb *= vShade;\n" +
                  // CLOTH.
                  // Three terms, all on object-space position, so they ride the sway and the lean without any of that having to be undone:

        _cz: null,

        _q: null,

            // Measured against the true dented surface on the largest bale: 10 rings deviate 0.0005u, 6 rings 0.0013u -- 0.67px at 3u, closer than the orbit camera reaches, and a twentieth of a pixel at the 40u+ where nearly every bale on screen actually sits.
