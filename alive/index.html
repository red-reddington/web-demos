<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>ALIVE: a night farm, fully procedural, no assets</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
          "nipplejs": "https://cdn.jsdelivr.net/npm/nipplejs@1.0.4/+esm"
        }
      }
    </script>
    <style>
      :root {
        --hud-fg: #e7eef6;
        --hud-accent: #ffc061;
        --hud-dim: #7d8ba0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #11141a;
        font-family: "JetBrains Mono", "SF Mono", "Menlo", monospace;
        color: var(--hud-fg);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #container {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---- Touch navigation ---- */
      #joy {
        position: absolute;
        z-index: 9;
        touch-action: none;
        display: none;
        left: min(14px, 6%);
        bottom: min(96px, 13%);
        width: 140px;
        height: 140px;
      }
      #joy::after {
        content: attr(data-label);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 14px;
        letter-spacing: 2px;
        color: var(--hud-accent);
        opacity: 0.6;
        pointer-events: none;
      }
      #hopPad {
        position: absolute;
        z-index: 9;
        touch-action: none;
        display: none;
        align-items: center;
        justify-content: center;
        right: min(26px, 8%);
        bottom: min(110px, 15%);
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(255, 192, 97, 0.22);
        border: 1px solid rgba(255, 192, 97, 0.5);
        color: var(--hud-accent);
        font-size: 15px;
        letter-spacing: 2px;
      }
      #hopPad:active {
        background: rgba(255, 192, 97, 0.4);
      }

      /* ---- HUD controls (top-right) ---- */
      #helpBtn,
      #muteBtn,
      #simBtn,
      #soundBtn,
      #fullscreenBtn {
        position: fixed;
        top: 12px;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        color: #aeb9c9;
        padding: 0;
        z-index: 60;
        opacity: 0.75;
        transition:
          opacity 0.15s ease,
          color 0.18s ease;
      }
      #helpBtn:hover,
      #muteBtn:hover,
      #simBtn:hover,
      #soundBtn:hover,
      #fullscreenBtn:hover {
        opacity: 1;
        color: var(--hud-accent);
      }
      #muteBtn {
        right: 12px;
      }
      #simBtn {
        right: 46px;
      }
      #helpBtn {
        right: 80px;
      }
      #soundBtn {
        right: 114px;
      }
      /* lit while the panel is open, so the button reads as a toggle rather than a launcher */
      #soundBtn.on {
        opacity: 1;
        color: var(--hud-accent);
      }
      #fullscreenBtn {
        right: 148px;
      }
      /* pause bars by default; swap to the play triangle when frozen */
      #simIcon .play {
        display: none;
      }
      #simBtn.frozen #simIcon .pause {
        display: none;
      }
      #simBtn.frozen #simIcon .play {
        display: inline;
      }
      #simBtn.frozen {
        color: var(--hud-accent);
        opacity: 1;
      }
      #muteIcon .slash {
        opacity: 0;
      }
      #muteBtn.muted #muteIcon .wave {
        opacity: 0.15;
      }
      #muteBtn.muted #muteIcon .slash {
        opacity: 1;
      }

      #helpPanel {
        position: fixed;
        top: 50px;
        right: 12px;
        z-index: 61;
        max-width: 250px;
        padding: 14px 16px;
        background: rgba(12, 16, 24, 0.92);
        border: 1px solid rgba(255, 192, 97, 0.25);
        color: var(--hud-fg);
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.4px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      #helpPanel b.sec {
        display: block;
        margin: 12px 0 4px;
        color: var(--hud-dim);
        font-weight: 400;
        font-size: 10px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      #helpPanel b.sec:first-child {
        margin-top: 0;
      }
      #helpPanel.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      #helpPanel b {
        color: var(--hud-accent);
        font-weight: 600;
      }
      /* ---- FPS / renderer stats (bottom-right, tap to expand) ---- */
      #stats {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 60;
        font-size: 10px;
        color: #9fabbd;
        text-align: right;
        line-height: 1.4;
        user-select: none;
        cursor: pointer;
        padding: 2px 4px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      /* pre ONLY here: the renderer stats are built as lines joined by \n.
         On #stats itself it also preserved the markup's own whitespace, so a formatter re-wrapping the HTML changed what the HUD looked like. */
      #stats .extra {
        display: none;
        opacity: 0.8;
        white-space: pre;
      }
      #stats.expanded .extra {
        display: inline;
      }
      /* fps toggles the renderer stats, and now has the corner to itself. */
      #statsFps {
        display: block;
        cursor: pointer;
      }
      #statsFps:hover {
        color: var(--hud-accent);
      }

      /* ---- Camera readouts (top-right, under the buttons) ---- */
      /* Top-right, clear of #stats and of the touch stick bottom-left.
         Each readout is a real target of its own -- bigger type, padding, a minimum width -- so the whole strip is tappable, not just the glyphs, and a tap meant for height or zoom can't toggle the renderer panel. */
      #camHud {
        position: fixed;
        top: 48px;
        right: 12px;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        font-size: 13px;
        line-height: 1.2;
        color: #9fabbd;
        text-align: right;
        user-select: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      }
      #camHud span {
        cursor: pointer;
        padding: 6px 8px;
        min-width: 56px;
        border-radius: 4px;
        opacity: 0.85;
        transition:
          opacity 0.15s ease,
          color 0.18s ease;
      }
      #camHud span:hover {
        opacity: 1;
        color: var(--hud-accent);
        background: rgba(0, 0, 0, 0.25);
      }

      /* ---- Selection label (top-left) ---- */
      /* Just the animal's name, and nothing at all when nothing is selected; the how-to prompt lives in the help panel.
         Set larger and lighter than the mono HUD so it reads as a caption on the scene rather than as another readout. */
      #selLabel {
        position: absolute;
        left: 16px;
        top: 14px;
        z-index: 60;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Helvetica,
          sans-serif;
        font-size: 19px;
        font-weight: 300;
        color: var(--hud-fg);
        opacity: 0.72;
        letter-spacing: 0.6px;
        user-select: none;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      #selLabel:empty {
        opacity: 0;
      }

      /* ---- Pause overlay ---- */
      #pauseOverlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(
          ellipse at center,
          rgba(20, 26, 36, 0.55) 0%,
          rgba(6, 8, 12, 0.86) 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      #pauseOverlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      #pauseOverlay h1 {
        font-size: 38px;
        letter-spacing: 12px;
        margin: 0;
        color: #ffffff;
        font-weight: 300;
      }
      #pauseOverlay p {
        font-size: 11px;
        letter-spacing: 4px;
        opacity: 0.6;
        margin: 0;
        color: var(--hud-fg);
      }

      /* ---- Splash ---- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 16px;
        text-align: center;
        cursor: pointer;
        /* One moon only; the element carries its own glow. */
        background: linear-gradient(
          180deg,
          #0a0e15 0%,
          #141b27 55%,
          #1d2635 100%
        );
        transition: opacity 0.5s ease-out;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .moon {
        width: min(30vw, 128px);
        height: min(30vw, 128px);
        border-radius: 50%;
        background:
          radial-gradient(
            34% 34% at 62% 40%,
            rgba(160, 175, 195, 0.35),
            transparent 60%
          ),
          radial-gradient(
            circle at 50% 50%,
            #f2f5f9 0%,
            #cdd6e2 70%,
            #aab6c6 100%
          );
        box-shadow:
          0 0 40px 8px rgba(230, 238, 248, 0.25),
          inset -14px -10px 26px rgba(24, 32, 46, 0.55);
        margin-bottom: 8px;
      }
      #splash h1 {
        margin: 0;
        font-size: clamp(24px, 7vw, 44px);
        font-weight: 300;
        letter-spacing: 10px;
        color: #eef3f9;
      }
      #splash .meta {
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--hud-dim);
      }
      #splash .cta {
        margin-top: 26px;
        font-size: 13px;
        letter-spacing: 7px;
        color: #eef3f9;
        animation: pulse 1.6s ease-in-out infinite;
      }
      #splash.loading {
        cursor: default;
      }
      #splash.loading .cta {
        color: var(--hud-dim);
        animation: none;
      }
      #splash.failed {
        cursor: default;
      }
      #splash.failed .cta {
        animation: none;
        color: #e0736b;
      }
      #splash .note {
        max-width: 34em;
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.7;
        letter-spacing: 1px;
        color: var(--hud-dim);
        white-space: pre-line;
      }
      #splash .note:empty {
        display: none;
      }
      #splash.failed .note {
        color: #e0736b;
      }
      #noscript {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 1px;
        color: #cdd6e2;
        background: #11141a;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="container"></div>

    <div id="joy" data-label="MOVE"></div>
    <div id="hopPad">HOP</div>

    <button id="fullscreenBtn" title="Toggle Fullscreen (Alt+Enter)">
      <svg

      <svg

    <div id="helpPanel">

      <div id="noscript">
        This needs JavaScript and WebGL 2. Enable scripts and reload.

    <div id="splash" class="loading">
      <div class="moon"></div>
      <h1>ALIVE</h1>
      <div class="meta">WATCH. LISTEN. WAIT.</div>
      <div class="cta" id="splashCTA">LOADING</div>
      <div class="note" id="splashNote"></div>
    </div>

    <!--
      Boot watchdog.
      Classic (non-module) script on purpose: a module's static imports resolve before its first statement runs, so if the CDN is blocked the module never executes and can't report it.
      Assume boot failed and let success cancel that.
    -->
    <script>
      window.__boot = (function () {
        var splash = document.getElementById("splash");
        var cta = document.getElementById("splashCTA");
        var note = document.getElementById("splashNote");
        var alive = false;
        var dead = false;

        function fatal(title, detail) {
          if (dead) return;
          dead = true;
          splash.classList.remove("loading");
          splash.classList.add("failed");
          cta.textContent = title;
          note.textContent = detail || "";
        }

        var watchdog = setTimeout(function () {
          if (!alive)
            fatal(
              "COULD NOT LOAD",
              "The engine did not load. three.js and nipplejs are pulled from a CDN " +
                "at runtime, so this is usually a blocked network, an offline machine " +
                "or a proxy. Check the console for the failing request.",
            );
        }, 12000);

        window.addEventListener("error", function (e) {
          if (!alive && e && e.message)
            (clearTimeout(watchdog), fatal("COULD NOT LOAD", e.message));
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (!alive)
            fatal(
              "COULD NOT LOAD",
              (e && e.reason && e.reason.message) ||
                "A load failed before startup.",
            );
        });

        return {
          alive: function () {
            alive = true;
            clearTimeout(watchdog);
          },
          fatal: fatal,
          ready: function (warning) {
            if (dead) return;
            splash.classList.remove("loading");
            // One word, deliberately invisible.
            // ALIVE carries the screen and the tagline carries the voice; a third piece of writing here would only compete with both.
            cta.textContent = "ENTER";
            if (warning) note.textContent = warning;
            return true;
          },
        };
      })();
    </script>

    <script type="module">
      import * as THREE from "three";
      import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
      import nipplejs from "nipplejs";

      window.__boot.alive();

      // ======================================================================
      // Small utilities
      // ======================================================================
      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const isTouchOnly = () =>
        ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
        !matchMedia("(pointer:fine)").matches;

      const Store = (() => {
        const KEY = "farm_settings";
        let data = {};
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) data = JSON.parse(raw) || {};
        } catch (e) {
          data = {};
        }
        const write = () => {
          try {
            localStorage.setItem(KEY, JSON.stringify(data));
          } catch (e) {}
        };
        return {
          get: (k, d) => (data[k] === undefined ? d : data[k]),
          set: (k, v) => {
            data[k] = v;
            write();
          },
        };
      })();

      // Camera height band.
      // Module scope because two places need the same numbers: the ctrl-drag clamp, and the restore below -- a saved height must not come back outside the range the drag itself allows.
      const CAM_FLY_MAX = 30.0, // ceiling on the camera's own height, flying
        CAM_TGT_MIN = 0.3, // floor on the TARGET's height, orbiting
        CAM_TGT_MAX = 5.0;

      // Ctrl + vertical drag raises/lowers the camera (clean vertical pan).
      //
      // The drag moves the PIVOT, so the band has to be stated on whichever end of the arm the pivot is pinned to: fly: the pivot IS the camera, so the band is its own height, floored at the rig's minHeight.
      //
      // RATE, second half of the same bug.
      // Rate is measured off the band: a full screen-height of drag spans it end to end, so the bottom of the screen is the floor from any height.
      function initCameraHeight(canvas, controls) {
        let dragging = false,
          lastY = 0,
          rate = 0;
        canvas.addEventListener(
          "pointerdown",
          (e) => {
            if (!e.ctrlKey || e.button !== 0) return;
            dragging = true;
            lastY = e.clientY;
            // The band and the rate live on the rig now, because the two-finger gesture on touch asks for exactly the same thing, and two copies of a clamp is two chances to change one of them.
            rate = controls.heightRate(canvas.clientHeight);
            controls.enabled = false;
            canvas.setPointerCapture?.(e.pointerId);
            e.stopPropagation();
          },
          true,
        );
        canvas.addEventListener(
          "pointermove",
          (e) => {
            if (!dragging) return;
            const dy = e.clientY - lastY;
            lastY = e.clientY;
            controls.raiseBy(-dy * rate);
            controls.apply();
            if (!_loopRunning || (GAME && GAME.paused)) GAME.renderParked();
            e.stopPropagation();
          },
          true,
        );
        const end = () => {
          if (!dragging) return;
          dragging = false;
          controls.enabled = true;
        };
        canvas.addEventListener("pointerup", end, true);
        canvas.addEventListener("pointercancel", end, true);
        window.addEventListener("pointerup", end, true);
      }

      // Height and zoom survive a reload.
      // Position and heading do NOT: the opening shot is composed (the pitch that frames the moon), and it should still be the opening shot.
      //
      // setItem is a synchronous serialise on the main thread, so writes are edge-triggered: a poll of two floats per frame sets a dirty flag, and the write waits for the value to hold still.
      // Detection is a poll of two floats per frame rather than a hook on each of the five paths that can move them; neither float changes on its own.
      // Neither float changes on its own: orbiting, the chase only touches x and z, so a still camera polls clean and writes nothing for as long as it stays still.
      const CameraStore = {
        KEY: "cam",
        DELAY: 600, // settle time; a wheel spin or a drag is one write, not twenty
        c: null,
        y: 0,
        d: 0,
        due: 0, // when to write, or 0 when there is nothing to write
        load(controls) {
          this.c = controls;
          const s = Store.get(this.KEY, null);
          if (s) {
            // Clamped on the way IN: the band can change between releases, and a stale value must not put the camera somewhere the controls cannot bring it back from.
            if (s.d > 0)
              controls.dist = clamp(
                s.d,
                controls.minDistance,
                controls.maxDistance,
              );
            if (s.y > 0)
              controls.pivot.y = clamp(s.y, controls.minHeight, CAM_FLY_MAX); // boot is fly mode, so the pivot IS the camera
          }
          controls.apply();
          this.y = controls.camera.position.y;
          this.d = controls.dist;
          // pagehide is the reliable one on desktop; iOS can discard a backgrounded tab without ever firing it, which leaves the hidden transition as the only guaranteed last word.
          addEventListener("pagehide", () => this.flush());
          addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") this.flush();
          });
        },
        // A DEADLINE, not a timer.
        // Not a clearTimeout/setTimeout per moving frame: flying, that is an allocation and a timer-queue reinsert every frame to decide something the loop can decide itself.
        // The loop calls this every frame, so movement pushes the deadline out and the first still frame past it writes once.
        // Zero timers.
        poll(now) {
          const c = this.c;
          if (!c) return;
          const y = c.camera.position.y;
          if (y !== this.y || c.dist !== this.d) {
            this.y = y;
            this.d = c.dist;
            this.due = now + this.DELAY;
            return;
          }
          if (this.due && now >= this.due) this.flush();
        },
        flush() {
          if (!this.due) return; // nothing moved since the last write
          this.due = 0;
          Store.set(this.KEY, { y: this.y, d: this.d });
        },
      };

      function toggleFullscreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(
            document,
          );
        }
      }

      // ---- Per-subsystem frame cost, exponentially smoothed, shown in stats.
      // sim/view/draw are the coarse split; the rest break the two CPU halves into the systems that can actually regress.
      // Bracketed per SECTION, never per animal: 95 clock reads a frame would cost more than they measure.
      const PERF = {
        frame: 0,
        sim: 0, //   think + recycle + collision
        view: 0, //   pose + upload + streaming + camera
        draw: 0,
        think: 0, //  autonomy: target choice and steering
        pose: 0, //   per-animal update/graze/float + matrix bake
        upload: 0, //  instance matrices into the batches
        stream: 0, //  ground, sky, moths, birds following the camera
        col: 0, //     collision solve
        gpu: -1,
      };
      const perfBlend = (k, ms) => (PERF[k] += (ms - PERF[k]) * 0.1);
      // Mirrors #stats.expanded so the frame loop never asks the DOM.
      // Written only from the two places that toggle it, from classList.toggle's own return value, so it cannot drift.
      let STATS_OPEN = false;

      // ---- GPU time via EXT_disjoint_timer_query_webgl2.
      const GpuTimer = (() => {
        let gl = null,
          ext = null,
          active = null,
          last = -1;
        const pool = [],
          inFlight = [];
        return {
          attach(renderer) {
            gl = renderer.getContext();
            ext = gl.getExtension("EXT_disjoint_timer_query_webgl2");
          },
          begin() {
            if (!ext || active) return;
            const q = pool.pop() || gl.createQuery();
            gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
            active = q;
          },
          end() {
            if (!ext || !active) return;
            gl.endQuery(ext.TIME_ELAPSED_EXT);
            inFlight.push(active);
            active = null;
            if (inFlight.length > 8) pool.push(inFlight.shift());
          },
          poll() {
            if (!ext) return -1;
            if (gl.getParameter(ext.GPU_DISJOINT_EXT)) {
              while (inFlight.length) pool.push(inFlight.pop());
              return last;
            }
            while (
              inFlight.length &&
              gl.getQueryParameter(inFlight[0], gl.QUERY_RESULT_AVAILABLE)
            ) {
              const q = inFlight.shift();
              last = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6;
              pool.push(q);
            }
            return last;
          },
        };
      })();

      function formatRendererStats(renderer) {
        const fmtN = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : "" + n);
        const r = renderer.info.render,
          m = renderer.info.memory;
        const prg = renderer.info.programs?.length || 0;
        const ms = (v) => v.toFixed(1);
        // sub-millisecond by design, so show microseconds rather than "0.0"
        const us = (v) =>
          v < 1 ? (v * 1000).toFixed(0) + "us" : v.toFixed(2) + "ms";
        const gpu = PERF.gpu >= 0 ? `${ms(PERF.gpu)}ms` : "n/a";
        const gl = renderer.getContext();
        const px = `${gl.drawingBufferWidth}x${gl.drawingBufferHeight}`;
        const mpx = (gl.drawingBufferWidth * gl.drawingBufferHeight) / 1e6;
        const cull = GAME
          ? `${GAME._culled | 0}/${GAME.animals.length} skipped`
          : "n/a";
        // Count only.
        // The duration sits with the other timings below rather than being reported twice in two formats.
        const col = GAME
          ? `${Collision.contacts} contacts · ${Collision.dropped} dropped`
          : "n/a";
        // The panel is anchored to the BOTTOM of the screen, so it grows upward.
        // The extra block therefore renders above the fps line and ends with a newline rather than starting with one, which keeps the fps readout pinned in place when the panel opens.
        return (
          `DC: ${fmtN(r.calls)}\nTRI: ${fmtN(r.triangles)}` +
          `\nGEO: ${m.geometries}\nTEX: ${m.textures}\nPRG: ${prg}` +
          `\nRES: ${px}\nMPX: ${mpx.toFixed(1)}\nDPR: ${renderer.getPixelRatio().toFixed(2)}` +
          `\nCULL: ${cull}` +
          `\nCOL: ${col}` +
          `\nFRAME: ${ms(PERF.frame)}ms` +
          // Each timer nests under the parent it is measured inside, and `rest` is the parent minus its children, so a bucket cannot be forgotten.
          `\nSIM: ${ms(PERF.sim)}ms` +
          `\n think ${us(PERF.think)}` +
          `\n rest  ${us(Math.max(0, PERF.sim - PERF.think))}` +
          `\nVIEW: ${ms(PERF.view)}ms` +
          `\n col   ${us(PERF.col)}\n pose  ${us(PERF.pose)}` +
          `\n strm  ${us(PERF.stream)}\n upld  ${us(PERF.upload)}` +
          `\n rest  ${us(Math.max(0, PERF.view - PERF.col - PERF.pose - PERF.stream - PERF.upload))}` +
          `\nDRAW: ${ms(PERF.draw)}ms` +
          `\nGPU: ${gpu}\n`
        );
      }

      // Prevent iOS Safari double-tap zoom without breaking the joystick.
      let _lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const now = performance.now();
          if (now - _lastTouchEnd <= 300) e.preventDefault();
          _lastTouchEnd = now;
        },
        { passive: false },
      );

      // ---- Input: keyboard + optional touch joystick ----------------------
      // pace/turn: move & steer (W/S/A/D, arrows, joystick -- arrows ARE WASD)
      // camSpin: turn whatever you are driving (Q/E)
      // zoom: dolly (+/- and the wheel)
      // sprint (Shift),
      // hop (Space/HOP, buffered)
      // Aiming the camera is the mouse's job; no axis here orbits or tilts it.
      const HOP_BUFFER_MS = 160;

      class Input {
        constructor() {
          this.keys = Object.create(null);
          this.touchOnly = isTouchOnly();
          this._joyX = 0;
          this._joyY = 0;
          this._hopAt = -1;
          this.shift = false; // live modifier state, not a key in the map
          this.state = {
            pace: 0,
            turn: 0,
            camSpin: 0,
            camOrbit: 0, // shift held: Q/E swing the camera around the target instead
            zoom: 0,
            stickX: 0, // raw stick vector, kept SEPARATE from pace/turn:
            stickY: 0, // the stick is steered camera-relative (see updateSim)
            sprint: false,
            hop: false,
          };

          // SHIFT IS TRACKED SEPARATELY, from the modifier flag every event already carries.
          //
          // Every event carries the live shiftKey, so reading it off whatever arrives next heals the state on the first mouse move.
          const mods = (e) => {
            this.shift = e.shiftKey;
          };
          window.addEventListener("keydown", (e) => {
            mods(e);
            if (e.code === "Space") {
              e.preventDefault();
              if (!e.repeat) this._hopAt = performance.now();
              return;
            }
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            // Repeats still record.
            // A key held across a pause is re-announced by its own auto-repeat, which is the only way the map can recover for anything that is not a modifier.
            this.keys[e.code] = true;
          });
          window.addEventListener("keyup", (e) => {
            mods(e);
            this.keys[e.code] = false;
          });
          window.addEventListener("pointerdown", mods, true);
          window.addEventListener("pointermove", mods, true);

          if (this.touchOnly) this._initTouch();
        }

        clearHop() {
          this._hopAt = -1;
        }
        releaseHeld() {
          this.keys = Object.create(null);
          this.shift = false; // and the next event that arrives will say whether it is still down
          this.clearHop();
        }

        _initTouch() {
          const joyEl = document.getElementById("joy");
          const hopEl = document.getElementById("hopPad");
          if (!joyEl) return;
          joyEl.style.display = "block";
          if (hopEl) {
            hopEl.style.display = "flex";
            hopEl.addEventListener(
              "touchstart",
              (e) => {
                this._hopAt = performance.now();
                e.preventDefault();
              },
              { passive: false },
            );
          }
          const build = () => {
            if (this._joyManager) this._joyManager.destroy();
            this._joyX = 0;
            this._joyY = 0;
            this._joyManager = nipplejs.create({
              zone: joyEl,
              mode: "static",
              position: { left: "50%", top: "50%" },
              restJoystick: true,
              color: { front: "#ffc061", back: "rgba(255, 192, 97, 0.35)" },
              size: 110,
              threshold: 0.1,
              fadeTime: 150,
            });
            this._joyManager.on("move", (evt) => {
              const d = evt.data;
              if (!d || !d.vector) return;
              // stick depth (0..1) scales direction -> depth is throttle
              const mag = Math.max(
                0,
                Math.min(
                  1,
                  d.force != null
                    ? d.force
                    : Math.hypot(d.vector.x, d.vector.y),
                ),
              );
              this._joyX = clamp(d.vector.x, -1, 1) * mag;
              this._joyY = clamp(d.vector.y, -1, 1) * mag;
            });
            this._joyManager.on("end", () => {
              this._joyX = 0;
              this._joyY = 0;
            });
          };
          build();
          let rebuildT = 0;
          const scheduleRebuild = () => {
            clearTimeout(rebuildT);
            rebuildT = setTimeout(build, 250);
          };
          window.addEventListener("resize", scheduleRebuild);
          window.addEventListener("orientationchange", scheduleRebuild);
        }

        poll() {
          const s = this.state,
            k = this.keys;
          s.pace = 0;
          s.turn = 0;
          s.camSpin = 0;
          s.zoom = 0;
          // Arrows fold straight into pace/turn rather than carrying their own axes: they ARE WASD, in both modes, so there is nothing downstream to reconcile.
          if (k.KeyW || k.ArrowUp) s.pace += 1;
          if (k.KeyS || k.ArrowDown) s.pace -= 1;
          if (k.KeyA || k.ArrowLeft) s.turn += 1;
          if (k.KeyD || k.ArrowRight) s.turn -= 1;
          // Q/E turn whatever you are driving: the camera in fly mode, the animal otherwise.
          // Same sign as A/D, so Q is A and E is D once an animal is selected.
          // With SHIFT they stop turning anything and swing the camera around the target instead.
          if (k.KeyQ) s.camSpin += 1;
          if (k.KeyE) s.camSpin -= 1;
          if (k.Minus) s.zoom += 1;
          if (k.Equal) s.zoom -= 1;
          // pace/turn keep the keyboard's tank meaning; the stick also reports its raw vector so the sim can steer it against the camera instead
          if (this._joyY !== 0) s.pace = this._joyY;
          if (this._joyX !== 0) s.turn = -this._joyX;
          s.stickX = this._joyX;
          s.stickY = this._joyY;
          s.sprint = this.shift;
          // SHIFT lends Q/E to the camera -- but only while you are standing still.
          // Decided after pace is known, which is why it is down here rather than up with the other resets.
          s.camOrbit = s.sprint && !s.pace ? 1 : 0;
          s.hop =
            this._hopAt >= 0 &&
            performance.now() - this._hopAt <= HOP_BUFFER_MS;
          return s;
        }
      }

      // ---- Sound: procedural WebAudio, spatialized per animal --------------
      // Per-species acoustics: `gain` = relative loudness, `ref`/`max`/`roll` = distance falloff (a pig carries far; a mouse is close-range).
      // TWO tables, because a call and a footfall are not the same sound coming from the same animal.
      //

      // What still speaks.
      // Small, high and short -- the five that survived the audition.
      const SPECIES_VOICE = {
        chick: { gain: 0.48, ref: 4, max: 26, roll: 1.7 },
        chicken: { gain: 0.72, ref: 7, max: 50, roll: 1.35 },
        duck: { gain: 0.95, ref: 10, max: 70, roll: 1.1 },
        // ref and roll matter more than gain here: ref 3 with roll 2.2 has thrown away four fifths of the level by eight units, which is as close as anything gets.
        // ref moves out to roughly where you stand, and roll softens.
        // max is unchanged, so they carry no further than before.
        mouse: { gain: 1.5, ref: 7, max: 22, roll: 1.15 },
        sparrow: { gain: 1.5, ref: 8, max: 36, roll: 1.1 },
      };
      const SPECIES_VOICE_DEFAULT = SPECIES_VOICE.chicken;

      // Feet.
      // Every species has them.
      //
      // Level is where the spread lives: a hoof against a chick's foot is a much bigger ratio than a bellow against a peep, because mass lands and lungs do not.
      // Range barely varies and is short throughout: STEP_RANGE culls every footfall at 26 units, so max only shapes the curve inside that.
      // gain here is RELATIVE; STEP_LEVEL below is the one master trim.
      const SPECIES_STEP = {
        // hooves, and the weight behind them
        horse: { gain: 1.0, ref: 6, max: 30, roll: 1.0 },
        cow: { gain: 1.0, ref: 6, max: 30, roll: 1.0 },
        donkey: { gain: 0.92, ref: 6, max: 30, roll: 1.0 },
        pig: { gain: 0.8, ref: 5, max: 26, roll: 1.1 },
        // mid-weight: audible, not heavy
        goat: { gain: 0.6, ref: 5, max: 24, roll: 1.15 },
        sheep: { gain: 0.6, ref: 5, max: 24, roll: 1.15 },
        dog: { gain: 0.5, ref: 4, max: 22, roll: 1.25 },
        turtle: { gain: 0.34, ref: 4, max: 18, roll: 1.4 },
        // birds and the light-footed: a scuff, not a step
        goose: { gain: 0.38, ref: 4, max: 20, roll: 1.35 },
        swan: { gain: 0.38, ref: 4, max: 20, roll: 1.35 },
        turkey: { gain: 0.34, ref: 4, max: 18, roll: 1.4 },
        rooster: { gain: 0.3, ref: 3.5, max: 17, roll: 1.5 },
        chicken: { gain: 0.26, ref: 3.5, max: 16, roll: 1.5 },
        duck: { gain: 0.26, ref: 3.5, max: 16, roll: 1.5 },
        rabbit: { gain: 0.26, ref: 3.5, max: 16, roll: 1.5 },
        frog: { gain: 0.22, ref: 3, max: 14, roll: 1.7 },
        hedgehog: { gain: 0.18, ref: 3, max: 13, roll: 1.8 },
        // audible only if you are standing over them
        chick: { gain: 0.12, ref: 2.5, max: 10, roll: 2.1 },
        sparrow: { gain: 0.12, ref: 2.5, max: 10, roll: 2.1 },
        mouse: { gain: 0.1, ref: 2.5, max: 9, roll: 2.2 },
      };
      const SPECIES_STEP_DEFAULT = SPECIES_STEP.sheep;

      // Not animals in the herd: things out in the dark, heard and never seen.
      // Long reference distances and slow rolloffs, because that is what "far away" sounds like -- a near-flat curve over a large radius, rather than something quiet nearby.
      // The howl reaches past FOG_OPAQUE on purpose.
      // Sound has no fog, and something you can hear from beyond the range you can see is the entire point of it.
      const AMBIENT_AUDIO = {
        owl: { gain: 0.5, ref: 26, max: 170, roll: 0.55 },
        // A crow at night is a fiction -- they are day birds -- but a disturbed rook does call in the dark, and it is the right kind of fiction for this.
        // Well down in the mix.
        // A caw is a bright, hard sound and it wins attention it has not earned; the owl can afford to be louder because a hoot sits under everything.
        // Taken off the gain rather than the curve, so it is quieter near AND far by the same amount and still carries the same distance.
        crow: { gain: 0.3, ref: 22, max: 150, roll: 0.7 },
        howl: { gain: 0.8, ref: 45, max: 280, roll: 0.4 },
      };
      const OWL_AUDIO = AMBIENT_AUDIO.owl;
      const OWL_GAP = [40, 110]; // seconds between hoots
      // How far out the shore sampler looks, and how many directions it looks in.
      const LAP_R = 15;
      const LAP_RAYS = 8;
      // Footstep budget (see FarmSound.step).
      const STEP_GAP = 0.09; // seconds between footfalls, herd-wide: about eleven a second at most
      const STEP_CLOSER = 0.5; // a nearer step takes the slot early only if it is this much nearer, in squared distance
      const STEP_RANGE = 26; // hard range for feet, unrelated to how far a call carries
      const STEP_RANGE2 = STEP_RANGE * STEP_RANGE;
      const STEP_LEVEL = 0.85; // master trim on every footfall, on top of the relative gains above
      // Precompute squared cutoff radii once so the per-emit audible test is a branchless compare with no sqrt.
      for (const T of [SPECIES_VOICE, SPECIES_STEP, AMBIENT_AUDIO])
        for (const k in T) T[k].max2 = T[k].max * T[k].max;

      class FarmSound {
        constructor() {
          this.muted = Store.get("muted", false) === true;
          // The bed is separately silenceable and remembers it.
          // Two different wants: mute kills everything, this kills only the wind and insects, for anyone who would rather have the farm without weather.
          this.bedMuted = Store.get("bedMuted", false) === true;
          // Per-type mute, remembered.
          // Silences that sound everywhere: calls, footsteps, and the audition panel.
          // A mute that leaves half the sound running cannot be told from one that works.
          this.typeMute = new Set(Store.get("muteTypes", []) || []);
          this.ctx = null;
          this.ok = false;
          this.paused = false;
          this._suspendT = 0;
          // The listener is the CAMERA, in both modes and in three dimensions.
          // Not the ground under the target: that keeps loudness independent of zoom, but then the animal you are driving, sixty units away on screen, arrives at your ear as if it were beside you.
          // One model: what is close sounds close, zoom means something, and the picture and the mix agree.
          this._fwd = { x: 0, y: 0, z: -1 }; // last good horizontal facing
          // Listener position cache (world).
          // Emissions test against this so I never build a graph for a source outside its falloff radius.
          this._lx = 0;
          this._ly = 0;
          this._lz = 0;
          // Voice budget: hard cap on concurrent scheduled voices.
          // `_slots` holds their finish times; it's reaped lazily on emit (no timers).
          this._slots = []; // pooled panner+gain, never exceeds maxVoices
          this.maxVoices = 24;
          // Distance at which a voice has lost half its top end to the air.
          // The panner only takes loudness away with range; nothing made a far sound duller than a near one, so every call arrived as if six inches from your ear.
          this.airHalf = 24;
          this._amb = null; // the bed: wind + insects, started once, never stopped
          this._owlT = 25 + Math.random() * 40; // first hoot, staggered off the session start
          this._lapT = 0;
          this._lap = null;
          this._stepT = -1; // when the last footfall was allowed through
          this._stepD2 = 0; // and how far away it was, so a nearer one can take its place
        }
        _setSession(type) {
          if (!("audioSession" in navigator)) return;
          try {
            navigator.audioSession.type = type;
          } catch (e) {}
        }
        start() {
          if (this.ctx) return;
          try {
            this._setSession(this.muted ? "ambient" : "playback");
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            this.ctx = new Ctx();
            if (this.ctx.state === "suspended") this.ctx.resume();
            const sr = this.ctx.sampleRate;
            const buf = this.ctx.createBuffer(1, sr * 2, sr);
            const d = buf.getChannelData(0);
            let last = 0,
              peak = 1e-6;
            for (let i = 0; i < d.length; i++) {
              const w = Math.random() * 2 - 1;
              last = last * 0.92 + w * 0.08;
              d[i] = last;
              if (Math.abs(last) > peak) peak = Math.abs(last);
            }
            // Normalise so the impulse never clips inside the buffer.
            const norm = 0.9 / peak;
            for (let i = 0; i < d.length; i++) d[i] *= norm;
            this._noiseBuf = buf;

            // master -> soft limiter -> out: headroom without clipping on overlap.
            this.master = this.ctx.createGain();
            this.master.gain.value = 1.9;
            const limiter = this.ctx.createDynamicsCompressor();
            limiter.threshold.value = -9;
            limiter.knee.value = 6;
            limiter.ratio.value = 12;
            limiter.attack.value = 0.003;
            limiter.release.value = 0.12;
            this.master.connect(limiter);
            limiter.connect(this.ctx.destination);
            // Up is constant, so it is set ONCE here.
            // setListener runs every frame, and writing (0,1,0) there was three automation events a frame, forever, for a vector that cannot change.
            const L0 = this.ctx.listener;
            if (L0.upX) {
              L0.upX.value = 0;
              L0.upY.value = 1;
              L0.upZ.value = 0;
            }
            // ROOM.
            // Outdoors at night there is no room, but there IS distance: ground, hedges and air return a late, dark, diffuse copy of anything far away.
            // A late, dark, diffuse copy is the strongest cue that a sound is out there rather than in your head.
            // One convolver, shared; the per-voice send is a gain.
            const IR_SECS = 1.3;
            const ir = this.ctx.createBuffer(2, (sr * IR_SECS) | 0, sr);
            for (let ch = 0; ch < 2; ch++) {
              const o = ir.getChannelData(ch);
              // Decaying noise, lowpassed by a one-pole that CLOSES as the tail decays, so the reflections get darker as they get later, the way real ones do.
              let lp = 0;
              for (let i = 0; i < o.length; i++) {
                const u = i / o.length;
                const env = Math.pow(1 - u, 2.6);
                // 8ms of silence first: the first reflection has to travel before it comes back.
                const pre = i < sr * 0.008 ? 0 : 1;
                lp += (Math.random() * 2 - 1 - lp) * (0.35 - 0.28 * u);
                o[i] = lp * env * pre;
              }
            }
            // Room and bed are DECORATION, and they are walled off from the voices on purpose.
            // If either fails, _verb stays null, _slot skips the send, and everything else carries on.
            try {
              this._verb = this.ctx.createConvolver();
              this._verb.buffer = ir;
              this._verbGain = this.ctx.createGain();
              this._verbGain.gain.value = 0.7; // ConvolverNode normalises the IR, so this is a plain wet level
              this._verb.connect(this._verbGain);
              this._verbGain.connect(this.master);
            } catch (e) {
              this._verb = null;
              console.warn("[audio] reverb unavailable:", e);
            }
            try {
              this._buildBed();
            } catch (e) {
              console.warn("[audio] ambience unavailable:", e);
            }
            this._buildVoices();
            this._buildAmbient();
            this.ok = true;
            this.paused = false;
          } catch (e) {
            // Audio is optional, so this stays non-fatal -- but never silent: a silent farm with no reason in the console is a bug report nobody can act on.
            console.warn("[audio] disabled:", e);
            this.ok = false;
          }
        }
        // THE BED.
        // A continuous floor of wind and insects.
        // It also masks: a synthesised call is far harder to pick apart over a bed than in silence.
        // Non-positional on purpose: wind and crickets are everywhere, not over there, and running them through a panner would make the whole field swing when you turn your head.
        // Built once, started once, never stopped -- three sources and four filters, forever.
        // Pausing takes the master down and suspends the context, which takes this with it.
        _buildBed() {
          const c = this.ctx;
          const amb = c.createGain();
          amb.gain.value = this._bedLevel();
          amb.connect(this.master);
          this._amb = amb;

          // LOOP-SAFE NOISE.
          // A noise buffer looped end to start has a step in it at the wrap, and a step is a click -- once every buffer length, forever, under a bed quiet enough that you would hear nothing else.
          // So the generator overruns by a quarter second and crossfades that overrun back across the head: the last sample leads into the first, with no seam.
          // smooth is the one-pole coefficient: 0.08 gives the brown rumble wind is made of, 1 leaves it white for the insects to filter.
          const noise = (secs, smooth) => {
            const n = (c.sampleRate * secs) | 0,
              xf = (c.sampleRate * 0.25) | 0;
            const raw = new Float32Array(n + xf);
            let last = 0,
              peak = 1e-6;
            for (let i = 0; i < raw.length; i++) {
              last += (Math.random() * 2 - 1 - last) * smooth;
              raw[i] = last;
              if (Math.abs(last) > peak) peak = Math.abs(last);
            }
            const b = c.createBuffer(1, n, c.sampleRate),
              o = b.getChannelData(0);
            const norm = 0.9 / peak;
            for (let i = 0; i < n; i++) {
              // The overrun is only READ inside the crossfade.
              const u = i / xf;
              o[i] =
                (i < xf ? raw[i] * u + raw[n + i] * (1 - u) : raw[i]) * norm;
            }
            return b;
          };
          // The sources are KEPT, not dropped on the floor.
          this._bedSrc = [];
          const loop = (buf) => {
            const s = c.createBufferSource();
            s.buffer = buf;
            s.loop = true;
            s.start();
            this._bedSrc.push(s);
            return s;
          };

          // WIND.
          // Brown noise under a lowpass: the rumble is already most of the way there before the filter, which is why this needs one biquad and not a stack.
          // Two LFOs at unrelated rates, one on the filter and one on the level: anything periodic here reads as a loop.
          const windLp = c.createBiquadFilter();
          windLp.type = "lowpass";
          // 240Hz, not 420: above that the wind reads as air moving AT you rather than around you, which is what made it howl.
          windLp.frequency.value = 240;
          windLp.Q.value = 0.7;
          const windGain = c.createGain();
          windGain.gain.value = 0.013; // MIX KNOB -- a quarter of what it was
          loop(noise(7, 0.08)).connect(windLp);
          windLp.connect(windGain);
          windGain.connect(amb);
          const gust = c.createOscillator();
          gust.frequency.value = 0.047;
          const gustAmt = c.createGain();
          gustAmt.gain.value = 70;
          gust.connect(gustAmt);
          gustAmt.connect(windLp.frequency);
          gust.start();
          const swell = c.createOscillator();
          swell.frequency.value = 0.031;
          const swellAmt = c.createGain();
          swellAmt.gain.value = 0.004; // a third of the level at most, not half
          swell.connect(swellAmt);
          swellAmt.connect(windGain.gain);
          swell.start();

          // WIND THROUGH SOMETHING.
          // A hedge, a gap in a wall, the gap under a roof -- in the open, wind has no pitch at all, and it is the things it passes that give it one.
          // Two narrow resonances off the same brown noise, so this costs one source and two biquads and reads as a place rather than as weather.
          for (const [hz, q, lvl, rate] of [
            [178, 9, 0.02, 0.023],
            [317, 12, 0.013, 0.037],
          ]) {
            const bp = c.createBiquadFilter();
            bp.type = "bandpass";
            bp.frequency.value = hz;
            bp.Q.value = q;
            const gn = c.createGain();
            gn.gain.value = lvl;
            windLp.connect(bp); // after the wind's own lowpass, so it rises and falls with the gusts
            bp.connect(gn);
            gn.connect(amb);
            const lfo = c.createOscillator();
            lfo.frequency.value = rate;
            const amt = c.createGain();
            amt.gain.value = lvl * 0.8;
            lfo.connect(amt);
            amt.connect(gn.gain);
            lfo.start();
          }

          // WATER, when there is any.
          // Held at zero and opened by the shore sampler in ambience(), so a farm with no lake in earshot is silent here rather than quietly lapping at nothing.
          // Two swells at rates that do not divide into each other, because sets of waves arrive at their own intervals and a single rate is a machine.
          const lapBp = c.createBiquadFilter();
          lapBp.type = "bandpass";
          lapBp.frequency.value = 620;
          lapBp.Q.value = 1.1;
          this._lap = c.createGain();
          this._lap.gain.value = 0;
          loop(noise(6, 1)).connect(lapBp);
          lapBp.connect(this._lap);
          this._lap.connect(amb);
          for (const [rate, depth] of [
            [0.31, 0.5],
            [0.47, 0.3],
          ]) {
            const lfo = c.createOscillator();
            lfo.frequency.value = rate;
            const amt = c.createGain();
            amt.gain.value = depth;
            lfo.connect(amt);
            amt.connect(lapBp.Q); // the swell moves the WIDTH, so each wave brightens as it breaks
            lfo.start();
          }

          // INSECTS.
          // Low Q on purpose: a narrow band turns noise into a pitch, and a pitch held at 4.5kHz with a 6Hz tremolo is a smoke alarm, not a field.
          const bp = c.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 3600;
          bp.Q.value = 3.5;
          const chirpGain = c.createGain();
          chirpGain.gain.value = 0.009; // MIX KNOB -- set to 0 for a still night
          loop(noise(5, 1)).connect(bp); // white, not the wind's brown: at 4k there is nothing left of brown to filter
          bp.connect(chirpGain);
          chirpGain.connect(amb);
          // Deep enough to cancel the base: the insects have to stop sometimes, or a level low enough not to nag is a permanent hiss.
          // Rates that never line up, so the gaps never fall on a count.
          for (const [rate, depth] of [
            [0.062, 0.006],
            [0.097, 0.004],
          ]) {
            const lfo = c.createOscillator();
            lfo.frequency.value = rate;
            const amt = c.createGain();
            amt.gain.value = depth;
            lfo.connect(amt);
            amt.connect(chirpGain.gain);
            lfo.start();
          }
        }

        // AMBIENCE, once a frame.
        //
        // Two things that cannot live in the bed graph because they depend on WHERE you are and WHEN it is.
        //
        // The owl is placed, not played flat: a hoot that arrives from a bearing, at a distance, is the difference between a night and a sound effect.
        // It is never visible and never explained.
        // The shore sampler asks the same lake field the ground shader draws, so what you hear is what you can see.
        // Five times a second, ~50 noise evaluations.
        // Ramped, never stepped: walking past the end of a lake should fade, and setTargetAtTime is doing the smoothing so nothing here has to run per frame.
        ambience(dt, x, z) {
          if (!this.ok || this.paused) return;
          const now = this.ctx.currentTime;

          // A bird, occasionally, from a bearing.
          // Which bird is a coin toss weighted toward the owl, because the owl belongs to the night and the crow is borrowing it.
          this._owlT -= dt;
          if (this._owlT <= 0) {
            this._owlT = 40 + Math.random() * 70;
            const a = Math.random() * Math.PI * 2,
              d = 45 + Math.random() * 70;
            this.dark(
              Math.random() < 0.65 ? "owl" : "crow",
              x + Math.cos(a) * d,
              z + Math.sin(a) * d,
            );
          }

          this._lapT -= dt;
          if (this._lapT <= 0) {
            this._lapT = 0.2;
            let hits = 0;
            for (let i = 0; i < LAP_RAYS; i++) {
              const a = (i / LAP_RAYS) * Math.PI * 2;
              if (isWater(x + Math.cos(a) * LAP_R, z + Math.sin(a) * LAP_R))
                hits++;
            }
            if (this._lap)
              this._lap.gain.setTargetAtTime(
                (hits / LAP_RAYS) * 0.075,
                now,
                0.9, // slow: a shoreline should arrive, not switch on
              );
          }
        }

        // THINGS IN THE DARK.
        // Built like the animal voices and kept apart from them, because these are not members of the herd: nothing on the farm makes them, and nothing on screen ever will.
        //
        // Deliberately not frightening alone: a snarl is a monster, a long note in the dark is a fact about the world.
        // The menace comes from what the herd does about it.
        _buildAmbient() {
          const V = (d, t, o) => this._vox(d, t, o);
          this._ambient = {
            owl: [(d, t) => this._owl(d, t), (d, t) => this._owlSingle(d, t)],
            crow: [
              (d, t) => this._crow(d, t, 2),
              (d, t) => this._crow(d, t, 3),
            ],
            howl: [
              // LONE.
              // Slides up onto the note, holds most of its length, falls away at the end.
              // The hold is the whole character -- a howl that moves throughout is a dog.
              (d, t) =>
                V(d, t, {
                  glottal: true,
                  tilt: 2.6, // few harmonics: almost a whistle by the time it reaches you
                  f: [300, 470, 455, 300],
                  fT: [0, 0.16, 0.78, 1],
                  dur: 2.6,
                  peak: 0.5,
                  atk: 0.28, // it arrives, rather than starting
                  lp: 1500,
                  open: 0.5,
                  jitter: 4,
                  jitterRate: 9,
                  breath: 0.03,
                  breathHz: 700,
                  vibRate: 5.2,
                  vibDepth: 3.5,
                  formants: [
                    [520, 4, 1.0, 610],
                    [1150, 6, 0.4],
                  ],
                }),
              // HIGHER, SHORTER.
              // A younger animal, or a further one.
              // Breaks upward at the end instead of falling.
              (d, t) =>
                V(d, t, {
                  glottal: true,
                  tilt: 2.9,
                  f: [420, 610, 600, 660],
                  fT: [0, 0.2, 0.7, 1],
                  dur: 1.7,
                  peak: 0.42,
                  atk: 0.2,
                  lp: 1800,
                  open: 0.55,
                  jitter: 5,
                  jitterRate: 11,
                  breath: 0.04,
                  breathHz: 900,
                  vibRate: 6.4,
                  vibDepth: 4,
                  formants: [
                    [700, 4, 1.0, 780],
                    [1500, 7, 0.35],
                  ],
                }),
              // ANSWERED.
              // Two, the second starting before the first has finished and a fourth lower, which is the interval that makes it sound like two animals rather than one with an echo.
              (d, t) => {
                V(d, t, {
                  glottal: true,
                  tilt: 2.6,
                  f: [330, 500, 490, 330],
                  fT: [0, 0.16, 0.8, 1],
                  dur: 2.2,
                  peak: 0.45,
                  atk: 0.24,
                  lp: 1500,
                  open: 0.5,
                  jitter: 4,
                  jitterRate: 9,
                  vibRate: 5.0,
                  vibDepth: 3.5,
                  formants: [[560, 4, 1.0, 640]],
                });
                V(d, t + 1.35, {
                  glottal: true,
                  tilt: 2.8,
                  f: [270, 375, 370, 250],
                  fT: [0, 0.18, 0.78, 1],
                  dur: 2.4,
                  peak: 0.3, // further off than the first
                  atk: 0.3,
                  lp: 1100,
                  open: 0.45,
                  jitter: 3,
                  jitterRate: 8,
                  vibRate: 4.4,
                  vibDepth: 3,
                  formants: [[430, 4, 1.0, 500]],
                });
              },
            ],
          };
        }

        // A caw is the opposite of a hoot in every way, which is why the pair works: harsh where the owl is pure, abrupt where it glides, and repeated where it answers itself.
        //
        // So the roughness is built from three things that a single well-behaved oscillator cannot produce: BIPHONATION: a second voice an octave down, sounding at once.
        // Two pitches together is the most corvid thing available, hence two _vox calls.
        // SIDEBANDS: AM at 70Hz, fast enough to be timbre rather than tremolo.
        //   APERIODICITY -- heavy, fast jitter, so no two cycles are the same length.
        // Stress on the vowel: crAW, not CRAW.
        // The consonant is a short, quieter scrape and the call blooms into the vowel a twentieth of a second later.
        // Stress on the vowel: an attack long enough to be a rise rather than a click, and a pitch contour that arrives from underneath instead of starting sharp.
        // And it is BRIGHT.
        // The energy belongs at 1-2.5kHz with the lowpass well out of the way; a caw that is comfortable to listen to is not a caw.
        _caw(dest, t, f, peak) {
          const body = {
            glottal: true,
            tilt: 1.0, // as buzzy as the source goes: every harmonic survives
            fT: [0, 0.24, 0.72, 1],
            atk: 0.055, // the rise into the vowel, not a click
            hold: 0.05, // and it sits on it before falling away
            open: 0.3,
            jitterRate: 90,
            breathHz: 1500,
            formants: [
              [1250, 3.4, 1.2, 1000], // bright, and closing toward the end: the "aa" into "aw"
              [2500, 5, 0.6],
              [3800, 7, 0.22],
            ],
          };
          this._vox(dest, t, {
            ...body,
            f: [f * 0.82, f * 1.06, f, f * 0.78], // up from under, then away
            dur: 0.34,
            peak,
            lp: 6000,
            jitter: 42,
            breath: 0.12,
            tremRate: 70, // timbre, not tremolo
            tremDepth: 0.55,
          });
          // The octave below, quieter and a touch late, with its own jitter so the two never lock together.
          this._vox(dest, t + 0.004, {
            ...body,
            f: [f * 0.41, f * 0.53, f * 0.5, f * 0.39], // the same shape an octave down
            dur: 0.31,
            peak: peak * 0.55,
            lp: 4000,
            jitter: 30,
            breath: 0.06,
            tremRate: 61,
            tremDepth: 0.4,
          });
        }

        _crow(dest, t, count) {
          const f = 430 + Math.random() * 70;
          for (let i = 0; i < count; i++)
            this._caw(
              dest,
              t + i * (0.42 + Math.random() * 0.06),
              f * (1 - i * 0.05), // each one a little lower
              0.46 - i * 0.07, // and a little further away
            );
        }

        // One long hoot rather than the pair: the same bird, not answering anything.
        _owlSingle(dest, t) {
          const f = 360 + Math.random() * 70;
          this._tone(dest, t, {
            f0: f,
            f1: f * 0.88,
            dur: 0.9,
            atk: 0.1,
            peak: 0.55,
            lp: 950,
            vibRate: 8,
            vibDepth: 4,
          });
        }

        // A tawny owl: two notes, the second longer and lower, both almost pure tone.
        // Almost no attack and a long tail -- the shape is what makes it an owl rather than a flute, far more than the pitch is.
        _owl(dest, t) {
          const f = 390 + Math.random() * 90;
          this._tone(dest, t, {
            f0: f,
            f1: f * 0.97,
            dur: 0.3,
            atk: 0.06,
            peak: 0.5,
            lp: 1100,
            vibRate: 11,
            vibDepth: 3,
          });
          this._tone(dest, t + 0.52, {
            f0: f * 0.94,
            f1: f * 0.86,
            dur: 0.72,
            atk: 0.09,
            peak: 0.6,
            lp: 1000,
            vibRate: 9,
            vibDepth: 4,
          });
        }

        // In-range test vs the species falloff radius (squared, no sqrt), on the same geometry the panner uses.
        _audible(prof, x, y, z) {
          const dx = x - this._lx,
            dy = y - this._ly,
            dz = z - this._lz;
          return dx * dx + dy * dy + dz * dz <= prof.max2;
        }
        // Concurrency guard and node pool in one.
        // A slot is reused only once its voice has finished, so the graph is capped at maxVoices and an overlapping call is dropped rather than queued.
        _slot(dur, x, y, z, prof) {
          const now = this.ctx.currentTime;
          const S = this._slots;
          let k = -1;
          for (let i = 0; i < S.length; i++)
            if (S[i].end <= now) {
              k = i;
              break;
            }
          if (k < 0) {
            if (S.length >= this.maxVoices) return null; // genuinely over budget
            k = S.length;
            const p = this.ctx.createPanner();
            p.panningModel = "equalpower"; // brighter than HRTF, no rear smear
            p.distanceModel = "inverse";
            // Air, then position, then out.
            // Both hang off the slot and are reused, so a voice still builds nothing but its own oscillators.
            const air = this.ctx.createBiquadFilter();
            air.type = "lowpass";
            air.Q.value = 0.4;
            air.connect(p);
            p.connect(this.master);
            let send = null;
            if (this._verb) {
              send = this.ctx.createGain();
              send.connect(this._verb);
            }
            S.push({ end: 0, p, air, send, g: null });
          }
          const s = S[k];
          s.end = now + dur;
          // The panner is pooled; the input gain deliberately is not.
          // Each voice builds its own oscillators and filters feeding this node, so a permanently-live gain would accumulate input connections forever.
          // Disconnecting the previous one orphans that whole subgraph in a single call.
          if (s.g) s.g.disconnect();
          s.g = this.ctx.createGain();
          s.g.connect(s.air); // dry: air -> panner -> master
          if (s.send) s.g.connect(s.send); // wet: -> the shared convolver, when there is one
          const p = s.p;
          p.refDistance = prof.ref;
          p.maxDistance = prof.max;
          p.rolloffFactor = prof.roll;
          if (p.positionX) {
            p.positionX.value = x;
            p.positionY.value = y;
            p.positionZ.value = z;
          } else if (p.setPosition) p.setPosition(x, sy, z);
          s.g.gain.value = prof.gain;
          // DISTANCE, in the two ways it is heard.
          // Air takes the top end first: one halving of cutoff per airHalf units, which is why a far cow is a low moan and a near one has edges on it.
          const dx = x - this._lx,
            dz = z - this._lz;
          const dist = Math.sqrt(dx * dx + dz * dz);
          s.air.frequency.value = Math.max(
            700,
            16000 * Math.pow(0.5, dist / this.airHalf),
          );
          if (s.send) {
            // Only the dry path goes through the panner, so the direct sound falls off with distance and the reverb does not.
            // The send therefore carries the same attenuation, and only the wet/dry RATIO climbs with range.
            // So the send is scaled by the same attenuation the panner is about to apply, and only the RATIO of wet to dry climbs with distance.
            // That is what distance actually sounds like.
            // prof.gain is not applied here: the send is fed from s.g, which already carries it.
            const d = Math.max(dist, prof.ref);
            const att = prof.ref / (prof.ref + prof.roll * (d - prof.ref));
            const w = Math.min(1, dist / prof.max);
            s.send.gain.value = att * (0.05 + 0.35 * w);
          }
          return s.g;
        }
        // FOOTSTEPS ARE BUDGETED, and the budget is spent on the nearest.
        //
        // One animal's steps are spaced by its gait; fifty animals inside earshot are spaced by nothing.
        // A global floor fixes the density but hands the budget to whoever asked first that frame, so a footfall inside the floor still gets through if it is clearly nearer than the one holding the slot.
        // Near steps interrupt far ones; far ones wait.
        //
        // Range is separate from the voice falloff: a call can carry a hundred units and feet do not.
        step(type, x, y, z, strength = 0.6) {
          if (!this.ok || this.muted || this.paused || this.typeMute.has(type))
            return;
          const dx = x - this._lx,
            dz = z - this._lz,
            d2 = dx * dx + dz * dz;
          if (d2 > STEP_RANGE2) return;
          const now = this.ctx.currentTime;
          if (now - this._stepT < STEP_GAP && d2 > this._stepD2 * STEP_CLOSER)
            return;
          this._stepT = now;
          this._stepD2 = d2;
          const prof = SPECIES_STEP[type] || SPECIES_STEP_DEFAULT;
          if (!this._audible(prof, x, y, z)) return;
          const p = this._slot(0.16, x, y, z, prof);
          if (!p) return;
          const fn = this._steps[type] || this._steps.pig;
          fn(p, now + 0.001, strength * STEP_LEVEL);
        }

        // Spatial voices: a short synth graph -> 3D PannerNode at the animal.
        _tone(dest, t, o) {
          const c = this.ctx;
          const osc = c.createOscillator();
          osc.type = o.type || "sine";
          osc.frequency.setValueAtTime(o.f0, t);
          if (o.f1)
            osc.frequency.exponentialRampToValueAtTime(
              Math.max(1, o.f1),
              t + (o.glide || o.dur),
            );
          let node = osc;
          if (o.bp) {
            const f = c.createBiquadFilter();
            f.type = "bandpass";
            f.frequency.value = o.bp;
            f.Q.value = o.q || 3;
            osc.connect(f);
            node = f;
          } else if (o.lp) {
            const f = c.createBiquadFilter();
            f.type = "lowpass";
            f.frequency.value = o.lp;
            osc.connect(f);
            node = f;
          }
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(o.peak, t + (o.atk || 0.02));
          g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
          node.connect(g).connect(dest);
          if (o.vibRate) {
            const l = c.createOscillator();
            l.frequency.value = o.vibRate;
            const lg = c.createGain();
            lg.gain.value = o.vibDepth;
            l.connect(lg).connect(osc.frequency);
            l.start(t);
            l.stop(t + o.dur + 0.03);
          }
          osc.start(t);
          osc.stop(t + o.dur + 0.03);
        }
        _noise(dest, t, o) {
          const c = this.ctx;
          const n = c.createBufferSource();
          n.buffer = this._noiseBuf;
          n.playbackRate.value = 0.8 + Math.random() * 0.4;
          const f = c.createBiquadFilter();
          f.type = o.type || "bandpass";
          f.frequency.value = o.freq;
          f.Q.value = o.q || 1;
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(o.peak, t + (o.atk || 0.01));
          g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
          n.connect(f).connect(g).connect(dest);
          n.start(t);
          n.stop(t + o.dur + 0.02);
        }
        // A glottal-pulse source instead of a raw sawtooth.
        // Vocal folds put out roughly -12 dB/oct (amplitude ~1/n^2) against a sawtooth's -6, which is why straight oscillators sound synthetic.
        // tilt is that exponent.
        // Cached.
        _glottal(tilt = 2.0) {
          if (!this._waves) this._waves = new Map();
          const key = tilt.toFixed(2);
          let w = this._waves.get(key);
          if (!w) {
            const N = 48;
            const real = new Float32Array(N),
              imag = new Float32Array(N);
            for (let n = 1; n < N; n++) imag[n] = 1 / Math.pow(n, tilt);
            w = this.ctx.createPeriodicWave(real, imag);
            this._waves.set(key, w);
          }
          return w;
        }
        _vox(dest, t, o) {
          const c = this.ctx,
            dur = o.dur;
          const src = c.createOscillator();
          if (o.glottal) src.setPeriodicWave(this._glottal(o.tilt || 2.0));
          else src.type = o.type || "sawtooth";
          const f = o.f || [o.f0, o.f1 || o.f0];
          src.frequency.setValueAtTime(f[0], t);
          for (let i = 1; i < f.length; i++) {
            // fT lets a contour dwell (e.g.
            // a moo holds, then falls away)
            const frac = o.fT ? o.fT[i] : i / (f.length - 1);
            src.frequency.exponentialRampToValueAtTime(
              Math.max(1, f[i]),
              t + dur * frac,
            );
          }
          if (o.vibRate) {
            const l = c.createOscillator();
            l.frequency.value = o.vibRate;
            const lg = c.createGain();
            lg.gain.value = o.vibDepth;
            l.connect(lg).connect(src.frequency);
            l.start(t);
            l.stop(t + dur + 0.05);
          }

      /* ====================================================================

         ====================================================================
         Every material here that changes three's shaders does it by string surgery: find an anchor such as "#include <project_vertex>" and splice code around it.
         String.replace has one terrible property for that job -- when the anchor is missing it returns the input unchanged and says nothing.
         A three.js upgrade that renames or moves one chunk would then give you a black floor, or shadows that stand up, or no fog, with no error anywhere, days after the upgrade.
         So every patch goes through this.
         Same chaining shape as String.replace, same first-occurrence semantics, but a missing anchor throws with the patch's name and the exact text it looked for.
         All 33 anchors in the file use it, and every material is compiled at boot (see init), so a broken anchor stops the page on the load screen instead of shipping a quietly wrong frame.
         Compile time only -- the allocation here is per program, never per frame.
         ==================================================================== */
      function patch(src, where) {
        return {
          src,
          replace(find, text) {

                `shader patch "${where}": anchors must be plain strings`,

            if (this.src.indexOf(find) === -1)
              throw new Error(
                `shader patch "${where}": three.js no longer contains ${JSON.stringify(find)}`,
              );

            return this;

      // Tube swept along a Catmull-Rom curve (r0->r1), indexed for the batch.
      function taperedTube(points, r0, r1, radial, tubular) {
        const curve = new THREE.CatmullRomCurve3(
          points.map((p) => new THREE.Vector3(p[0], p[1], p[2])),
        );
        const frames = curve.computeFrenetFrames(tubular, false);

          nor = [],
          uv = [],
          index = [];

        for (let i = 0; i <= tubular; i++) {
          const u = i / tubular;
          curve.getPointAt(u, P);
          const N = frames.normals[i],
            B = frames.binormals[i];
          const r = THREE.MathUtils.lerp(r0, r1, u);
          for (let j = 0; j <= radial; j++) {
            const ang = (j / radial) * Math.PI * 2;
            const cx = -Math.cos(ang),
              sx = Math.sin(ang);
            const nx = cx * N.x + sx * B.x,
              ny = cx * N.y + sx * B.y,
              nz = cx * N.z + sx * B.z;
            pos.push(P.x + r * nx, P.y + r * ny, P.z + r * nz);
            nor.push(nx, ny, nz);
            uv.push(u, j / radial);
          }

        for (let i = 1; i <= tubular; i++)
          for (let j = 1; j <= radial; j++) {
            const a = (radial + 1) * (i - 1) + (j - 1);
            const b = (radial + 1) * i + (j - 1);
            const c = (radial + 1) * i + j;
            const d = (radial + 1) * (i - 1) + j;
            index.push(a, b, d, b, c, d);
          }

        // Cap each end with a triangle fan around a centre vertex, with the flat normal pointing along the curve so the cap shades like a real end instead of inheriting the wall's normal.
        const capEnd = (u, sign) => {
          curve.getPointAt(u, P);
          const T = curve.getTangentAt(u).multiplyScalar(sign);
          const r = THREE.MathUtils.lerp(r0, r1, u);
          const k = sign > 0 ? tubular : 0;
          const N = frames.normals[k],
            B = frames.binormals[k];
          const centre = pos.length / 3;
          pos.push(P.x, P.y, P.z);
          nor.push(T.x, T.y, T.z);
          uv.push(0.5, 0.5);
          const ring = [];
          for (let j = 0; j < radial; j++) {
            const ang = (j / radial) * Math.PI * 2;
            const cx = -Math.cos(ang),
              sx = Math.sin(ang);
            ring.push(pos.length / 3);
            pos.push(
              P.x + r * (cx * N.x + sx * B.x),
              P.y + r * (cx * N.y + sx * B.y),
              P.z + r * (cx * N.z + sx * B.z),
            );
            nor.push(T.x, T.y, T.z);
            uv.push(0.5 + 0.5 * cx, 0.5 + 0.5 * sx);
          }
          for (let j = 0; j < radial; j++) {
            const a = ring[j],
              b = ring[(j + 1) % radial];
            // The ring winds clockwise about +T (three.js sets binormal = tangent x normal, so N x B = T and cross(p_j, p_j+1) = -T).
            // The fan must therefore be reversed at the tip to face +T and left as-is at the base to face -T, or the caps are back-face culled and the tube still looks open.
            if (sign > 0) index.push(centre, b, a);
            else index.push(centre, a, b);

        capEnd(0, -1); // base
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
        g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
        g.setIndex(index);

      }

      // Outward face planes of the icosphere the bodies are built from, as (nx, ny, nz, d) with n.x = d.
      // Cached PER DETAIL: a detail-1 head is far coarser than a detail-2 body (facets dip ~6.6% below the sphere vs ~1.8%), so a cap must be snapped to the planes of the mesh it sits on.
      const _icoPl = new Map();
      function icoPlanes(detail = 2) {
        let cached = _icoPl.get(detail);
        if (cached) return cached;
        const g = new THREE.IcosahedronGeometry(1, detail); // non-indexed
        const p = g.attributes.position,
          out = [];
        const a = new THREE.Vector3(),
          b = new THREE.Vector3(),
          c = new THREE.Vector3(),
          n = new THREE.Vector3(),
          e1 = new THREE.Vector3(),
          e2 = new THREE.Vector3();
        for (let i = 0; i < p.count; i += 3) {
          a.fromBufferAttribute(p, i);
          b.fromBufferAttribute(p, i + 1);
          c.fromBufferAttribute(p, i + 2);
          n.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a)).normalize();
          if (n.dot(a) < 0) n.negate(); // face outward
          out.push(n.x, n.y, n.z, n.dot(a));
        }
        g.dispose();
        cached = new Float32Array(out);
        _icoPl.set(detail, cached);
        return cached;

      // Distance from the centre to the FACETED surface along unit dir p.
      // The icosphere is convex and contains the origin, so the ray leaves through exactly one facet: the nearest positive plane crossing.
      function icoRadius(px, py, pz, detail = 2) {
        const P = icoPlanes(detail);
        let best = Infinity;
        for (let i = 0; i < P.length; i += 4) {
          const den = P[i] * px + P[i + 1] * py + P[i + 2] * pz;
          if (den > 1e-6) {
            const t = P[i + 3] / den;
            if (t < best) best = t;
          }
        }
        return best === Infinity ? 1 : best;

      // A smooth ellipsoid cap sits up to 1.8% proud of the facet centres and reads as a peeling sticker; matching the host's tessellation seats it flat.
      // The outline is perturbed by wrapped harmonics so no two spots are the same round blob.
      // Vertices are in body-local space, relative to the ellipsoid centre.
      function ellipsoidCap(
        dir,
        angRad,
        radii,
        lift,
        detail = 2,
        seg = 20,
        rings = 4,

            angRad *

                0.17 * Math.sin(3 * th + a2) +

          uvs.push(uu, vv);

              0.5 + 0.5 * f * Math.cos(th),
