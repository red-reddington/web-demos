        segment(parent, a, b, radius, material, seg = 6) {
          const p1 = new THREE.Vector3(a[0], a[1], a[2]);
          const p2 = new THREE.Vector3(b[0], b[1], b[2]);
          const d = new THREE.Vector3().subVectors(p2, p1);
          const len = d.length();
          const { geom, fold } = canon(
            new THREE.CylinderGeometry(radius, radius * 0.88, len, seg),
          );
          const node = new THREE.Object3D();
          node.position.copy(p1).add(p2).multiplyScalar(0.5);
          node.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            d.normalize(),
          );
          node.scale.set(fold[0], fold[1], fold[2]);
          parent.add(node);
          node.userData.animal = this;
          registry.add({
            node,
            geom,
            roughness: material.roughness,
            color: material.color,
            overlay: false,
          });
          return node;
        }

        // Tapered tail; curve baked in parent-local so it wags rigidly with tailRoot.

        // Tapered tail; curve baked in parent-local so it wags rigidly with tailRoot.
        tube(parent, points, r0, r1, material, radial = 6, tubular = 32) {
          const geom = taperedTube(points, r0, r1, radial, tubular);
          const node = new THREE.Object3D();
          parent.add(node);
          node.userData.animal = this;
          registry.add({
            node,
            geom,
            roughness: material.roughness,
            color: material.color,
            overlay: false,
          });
          return node;
        }

        // ---- Distinctive feet (ankle-local: +X fwd, -Y down, Z lateral) ----- Ankle sits hoofSize*0.62 above ground, so each foot drops a short tarsus to the ground, then lays toes/web from its base.

        // THE TARSUS IS A SOCKET, like the hoof.
        // Hung from the ankle with its top face on the pivot, against the shin's bottom face, it would be two bones hinged at a shared face, which the knee's comment explains cannot be closed: every bird would open a wedge at the ankle on each stride.
        // So it rises past the pivot by the joint's own socket depth and is a little wider than the shin, so the shin's end is buried at every angle its species reaches.
        // The flare at the top is the knobbly intertarsal joint every bird has.
        // Ten sides, to match the shin: a hexagon's flat faces sit inside the circle the shin's corners trace.
        _tarsus(ankle, s, mat, shankR, socketK) {
          const drop = s * 0.62; // ankle height above ground
          const sb = shankR * 0.92, // the shin where it meets the foot (see leg)
            socket = sb * socketK,
            rim = sb * 1.18;
          this.part(
            new THREE.CylinderGeometry(
              rim,
              shankR * 0.9,
              drop + socket,
              LEG_SEG,
            ),
            mat,
            ankle,
            [0, (socket - drop) * 0.5, 0],
          );
          return -drop; // ground plane in ankle-local space -- unchanged, the foot still lands
        }

        _webFoot(ankle, s, mat, k, shankR, socketK) {
          // Duck/goose: shank to the ground, then a flat forward web + toes.
          const gy = this._tarsus(ankle, s, mat, shankR, socketK);
          const w = s * 0.85 * k,
            len = s * 2.1 * k;
          // web: a cone flattened to a thin plate, heel under the ankle, wide end fanning forward.
          // Lifted a hair so it rests on the ground.
          this.part(
            new THREE.ConeGeometry(w, len, 7),
            mat,
            ankle,
            [len * 0.5, gy + s * 0.06, 0],
            [0, 0, Math.PI / 2],
            [0.16, 1, 1.0],
          );
          // three toe ridges fanning across the web from the tarsus base
          const heel = [0, gy + s * 0.07, 0];
          const r = s * 0.12 * k;
          for (const dz of [-0.6, 0, 0.6])
            this.segment(
              ankle,
              heel,
              [len * (dz ? 0.82 : 0.96), gy + s * 0.07, dz * w],
              r,
              mat,
            );
        }

        _birdFoot(ankle, s, mat, k, back, shankR, socketK) {
          // Chicken/chick: shank to the ground, then splayed toes at ground.
          const gy = this._tarsus(ankle, s, mat, shankR, socketK);
          const L = s * 1.7 * k,
            S = s * 0.95 * k,
            r = s * 0.17 * k;
          const heel = [0, gy, 0];
          this.segment(ankle, heel, [L * 0.82, gy, -S], r, mat);
          this.segment(ankle, heel, [L, gy, 0], r, mat);
          this.segment(ankle, heel, [L * 0.82, gy, S], r, mat);
          if (back)
            this.segment(ankle, heel, [-L * 0.42, gy, 0], r * 0.85, mat);
        }

        _rabbitFoot(ankle, s, mat, k, sb) {
          // Long flat plantigrade hind foot extending forward from the heel.
          const gy = -s * 0.28;
          // THE HOCK.
          // The foot is a flat ellipsoid whose top barely reached the ankle pivot, so the back of the shin's end stood proud of it even at rest, and the hop folds this joint further than any other.
          // A heel knob centred ON the pivot swallows the shin's end at every angle -- centred, so the hinge's rotation cannot carry the end out of it -- and it is the hock a rabbit really has.
          // Sized by the same containment check as the sockets: 1.15x the shin radius clears 110% of the hop's deepest bend with the icosahedron's facet sag allowed for.
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            mat,
            ankle,
            [0, 0, 0],
            [0, 0, 0],
            [sb * 1.15 * 1.1, sb * 1.15, sb * 1.15],
          );
          const len = s * 3.4 * k,
            w = s * 0.85 * k;
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            mat,
            ankle,
            [len * 0.26, gy, 0],
            [0, 0, 0],
            [len * 0.5, s * 0.4, w],
          );
          for (const dz of [-0.5, 0, 0.5]) // toe tips at the front
            this.part(
              new THREE.IcosahedronGeometry(1, 1),
              mat,
              ankle,
              [len * 0.72, gy, dz * w * 0.8],
              [0, 0, 0],
              [s * 0.5, s * 0.34, s * 0.34],
            );
        }

        leg({
          x,
          z,
          upper,
          lower,
          upperRadius,
          lowerRadius,
          upperMat,
          lowerMat,
          hoofMat,
          hoofSize,
          phase = 0,
          foot = "hoof", // "hoof" | "web" | "bird" | "rabbit" | "none"
          footMat,
          footSize = 1,
          footBack = true, // bird: include the rear toe
          // THE ANKLE'S REAL RANGE, radians.
          // It levels the foot by turning -(hip + knee), and on a hind leg the knee adds 62% on top of the hip's swing -- so the worst case is 1.62 x legSwing, not the "22 degrees" this file once assumed: 35 for the dog, 33 the horse, 32 the pig, donkey and goose.
          // Sized for the worst leg (hindness is decided after build).
          // A species whose pose code drives the ankle itself passes its own range.
          ankleMax = FLIGHT[this.type]
            ? Math.max(1.62 * this.legSwing, -FLY_FOLD_ANKLE) // a flier folds its feet back in the air
            : 1.62 * this.legSwing,
        }) {
          // Socket depth, in shin radii, for everything that holds the shin's end below.
          // The shin's end is a disc; tilted by the bend its raised edge climbs sb*sin(bend), so the socket must rise past the pivot by more than that.
          // 10% over the real range, 20% over the edge, and never shallower than the 0.42 that was here.
          // Checked numerically for every species against the real shapes (taper, ten facets, the hoof's z-stretch): all covered.
          // || 0.42: a species missing its legSwing entry would make this NaN, and NaN geometry is invisible.
          // Capped at a right angle: past it the raised edge climbs no higher (sin falls back), and a flier's folded ankle is right there.
          const socketK =
            Math.max(
              0.42,
              1.2 * Math.sin(Math.min(ankleMax * 1.1, Math.PI / 2)),
            ) || 0.42;
          const hip = new THREE.Group();
          hip.position.set(x, upper + lower + hoofSize * 0.62, z);
          this.group.add(hip);
          // THE THIGH HANGS PAST THE KNEE, and the shin slides up inside it.
          //
          // Two bones hinged at a shared face cannot be closed: bend them and the faces part, and the wedge has to be plugged by something rotationally symmetric -- a sphere -- which is round where the leg is faceted and so stands proud of every flat face.
          // That shows as a pair of lumps.
          // An overlap has no such problem.
          // The thigh continues past the pivot as a short skirt; the shin is a little narrower and its top sits inside that skirt; and the joint is covered by material rather than by a patch.
          // Nothing needs to be rotationally symmetric, because nothing is being plugged.
          // What is left on the outside is a small lip where the skirt ends, which is what a knee looks like anyway.
          // And no knuckle part is needed: one fewer part on every leg of every animal.
          //
          // The clearance is what sets the range: the shin's axis shifts sideways by skirt * sin(bend) at the skirt's rim, so it stays hidden while that is under the 15% gap.
          // That covers 28 degrees against the 13 a walk actually uses, and the 30 of a rabbit's deepest tuck -- which happens folded under the body mid-hop.
          const jr = upperRadius * 0.9, // the thigh where it passes the knee
            skirt = jr * 0.32;
          this.part(
            new THREE.CylinderGeometry(upperRadius, jr, upper + skirt, LEG_SEG),
            upperMat,
            hip,
            [0, -(upper + skirt) * 0.5, 0],
          );
          const knee = new THREE.Group();
          knee.position.y = -upper;
          hip.add(knee);
          // Rises above the pivot by the same skirt length, so the top of it is buried whichever way the knee goes.
          this.part(
            new THREE.CylinderGeometry(
              jr * 0.85,
              lowerRadius * 0.92,
              lower + skirt,
              LEG_SEG,
            ),
            lowerMat,
            knee,
            [0, (skirt - lower) * 0.5, 0],
          );
          const ankle = new THREE.Group();
          ankle.position.y = -lower;
          knee.add(ankle);
          const fm = footMat || hoofMat;
          if (foot === "web")
            this._webFoot(ankle, hoofSize, fm, footSize, lowerRadius, socketK);
          else if (foot === "bird")
            this._birdFoot(
              ankle,
              hoofSize,
              fm,
              footSize,
              footBack,
              lowerRadius,
              socketK,
            );
          else if (foot === "rabbit")
            this._rabbitFoot(ankle, hoofSize, fm, footSize, lowerRadius * 0.92);
          else if (foot === "none") {
            /* bare ankle */
          } else {
            // THE HOOF IS A SOCKET the shin stands in, for the same reason the thigh is a skirt over the shin.
            //
            // The ankle turns further than the knee ever does, so this is the joint most likely to crack open, not the least.
            // So the hoof rises past the ankle pivot and is a little wider than the shin that enters it.
            // The shin's end is then buried at every angle, and what shows is a hoof the leg goes into, which is what a hoof is.
            // Depth comes from the species' real range (socketK, above); a fixed 0.42 only covered 25 degrees, and eleven species bend further than that on the back stride.
            // The base may not be narrower than the shin it holds: tapering inside it lets the lowered edge of the shin's end out through the side.
            // Only the turtle hit that, and a stumpier foot suits it.
            const sb = lowerRadius * 0.92, // the shin where it meets the foot
              socket = sb * socketK,
              rim = Math.max(hoofSize * 0.72, sb * 1.18);
            const hoof = this.part(
              new THREE.CylinderGeometry(
                rim,
                Math.max(hoofSize, sb * 1.12),
                hoofSize * 0.62 + socket,
                LEG_SEG,
              ),
              hoofMat,
              ankle,
              [0, -hoofSize * 0.31 + socket * 0.5, 0],
            );
            hoof.scale.z *= 1.28;
          }
          const rec = { hip, knee, ankle, phase };
          this.legs.push(rec);
          return rec;
        }
      }

      class Animal extends Rig {
        constructor(type) {
          super();
          this.type = type;
          this.group = new THREE.Group();
          this.legs = [];
          this.eyes = [];
          this.ears = [];
          this.wings = [];

          const M = CONFIG.movement,
            A = CONFIG.animation;
          this.speed = M.speed[type];
          this.sprint = M.sprint;
          this.turnSpeed = M.turnSpeed;
          this.gaitFrequency = M.gait[type];
          this.legSwing = A.legSwing[type];
          this.bodyBob = A.bodyBob[type];
          this.bodySway = A.bodySway[type];
          this.breathAmount = A.breathing[type];

          this.phase = rand(0, Math.PI * 2);
          this.breathPhase = rand(0, Math.PI * 2);
          this.eyeColor = pick(CONFIG.eyes.colors);

          this.lastPosition = new THREE.Vector3();
          this._lastYaw = 0; // heading last pose, so turning in place can drive the legs
          this._slip = 0; // stride-phase worth of drift taken on planted feet
          this._catch = 0; // stride phase left in a catch step, 0 when none
          this._lastStepT = -1; // last audible footfall time (footstep debounce)
          this._simPhase = 0; // stagger offset so LOD refreshes spread over frames
          this.initialized = false;
          this.bodyRoot = null;
          this.headRoot = null;
          this.tailRoot = null;
          this._baseY = 0;
          this.jumpY = 0;
          this.jumpV = 0;
          // Flight plan: null for everything that cannot fly, one preallocated object for what can (see place).
          // aloft means exactly _fl.on -- set by takeOff, cleared by _touchDown.
          // NOT "airborne": the rabbit and the frog already own that name for their hop.
          this._fl = null;
          this._locoGain = 1; // per-frame forward-speed multiplier (hop lunges)
          this._speedN = 0; // speed as a fraction of this animal's own walk, smoothed
          // Self-propelled impulse, world units/sec, along the body axis.
          // It is NOT _locoGain: that one multiplies stick input, and a lunge has to keep carrying the animal after the stick is centred.
          this._surge = 0;
          this._surgeSign = 1; // which way that impulse points (see lunge)
          this._driveSign = 1; // which way this animal last travelled, +1/-1
          // Accumulated stride phase.
          // Integrated from distance covered rather than read off the clock, so it only advances when the animal actually gets somewhere.
          this._gaitPhase = this.phase;
          this._sink = 0; // current draught, world units (see applyFloat)
          this._poseT = -1; // simTime of the last pose; -1 = never posed
          this.beh = BEHAVIOUR[type] || BEH_DEFAULT;
          this._tx = null; // wander target, world xz (null = none yet)
          this._tz = null;
          this.vocalCooldown = rand(4, VOCAL_GAP[1]); // stagger the first one
          this._alertT = 0; // seconds left standing and staring
          this._alertIn = 0; // seconds until this one notices (see ALERT_RIPPLE)
          this._alertYaw = 0; // where it will look
          this._stallBest = Infinity; // closest this animal has got to the current target
          this._stall = 0; // seconds since that last improved
          this._pause = rand(0, this.beh.p[1]); // stagger the first move
          // Waterfowl and amphibians are free to enter a lake; everyone else is turned back at the bank (see move()).
          this.swims = SWIMMERS.has(type);
          this._avgSpeed = 0; // EMA of speed, so the lunge pulse doesn't feed back

          this.blinkTimer = rand(CONFIG.blink.first[0], CONFIG.blink.first[1]);
          this.blinking = false;
          this.blinkProgress = 0;

          // grazing
          this.moving = false;
          this.grazeCfg = GRAZE[type] || GRAZE.pig;
          this.grazeState = 0; // 0 idle, 1 lowering, 2 seeking, 3 raising
          this.grazeAmt = 0;
          this.grazeDur = 0;
          this.grazeTimer2 = 0;
          this.grazeCooldown = rand(4, 14);
          this._grazePosed = false;
          this.neckPivot = null;
          this._neckReady = false;

          // vocalizing (own schedule, independent of grazing)
        }

        blink(dt) {
          if (!this.eyes.length) return;
          if (!this.blinking) {
            this.blinkTimer -= dt;
            if (this.blinkTimer <= 0) {
              this.blinking = true;
              this.blinkProgress = 0;
            }
          } else {
            this.blinkProgress += dt / CONFIG.blink.duration;
            if (this.blinkProgress >= 1) {
              this.blinkProgress = 1;
              this.blinking = false;
              this.blinkTimer = rand(
                CONFIG.blink.interval[0],
                CONFIG.blink.interval[1],
              );
            }
          }
          const close = this.blinking
            ? Math.sin(this.blinkProgress * Math.PI)
            : 0;
          const amount = THREE.MathUtils.lerp(
            1,
            CONFIG.blink.closedScale,
            close,
          );
          const eyes = this.eyes;
          for (let i = 0; i < eyes.length; i++)
            eyes[i].mesh.scale.y = eyes[i].scaleY * amount;
        }

        // Turn toward a world point and walk at it.
        // Returns true on arrival.
        // Same shape as the thumbstick path: the turn is clamped to turnSpeed so nothing pivots faster than it can.
        steerTo(x, z, dt) {
          const p = this.group.position;
          const dx = x - p.x,
            dz = z - p.z;
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d < 0.6) return true;
          const want = Math.atan2(-dz, dx);
          let diff = want - this.group.rotation.y;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff)); // to [-PI, PI]
          const step = this.turnSpeed * dt;
          this.rotate(
            THREE.MathUtils.clamp(diff / Math.max(step, 1e-6), -1, 1),
            dt,
          );
          const align = 0.25 + 0.75 * Math.max(0, Math.cos(diff));
          // ease to a stop on approach, so they don't stab at the target
          this.move(align * Math.min(1, d / 2.5), 0, dt, 1);
          return false;
        }

        // Pick somewhere to go.
        // Called once per pause per animal, so the O(n) neighbour scan here runs well under once a frame across the whole herd.
        pickTarget(herd) {
          const b = this.beh,
            p = this.group.position;
          const reach = rand(b.r[0], b.r[1]);
          let ax = Math.cos(rand(0, Math.PI * 2)),
            az = Math.sin(rand(0, Math.PI * 2));

          // Cohesion.
          // Steer toward the centroid of nearby OWN SPECIES, which is what turns 95 random walkers into flocks and herds.
          // Without it the whole thing reads as a screensaver.
          if (b.s > 0.01) {
            let cx = 0,
              cz = 0,
              n = 0;
            const R2 = 26 * 26;
            for (let i = 0; i < herd.length; i++) {
              const o = herd[i];
              if (o === this || o.type !== this.type) continue;
              const ox = o.group.position.x - p.x,
                oz = o.group.position.z - p.z;
              const d2 = ox * ox + oz * oz;
              if (d2 > R2 || d2 < 1e-4) continue;
              cx += ox;
              cz += oz;
              n++;
            }
            if (n) {
              const l = Math.hypot(cx, cz) || 1;
              // blend, don't replace: they drift toward the group while still exploring, so a flock wanders as a loose body rather than collapsing onto a point
              ax += (cx / l) * b.s * 1.6;
              az += (cz / l) * b.s * 1.6;
            }
          }

          const l = Math.hypot(ax, az) || 1;
          let tx = p.x + (ax / l) * reach,
            tz = p.z + (az / l) * reach;

          // Water preference.
          // Swimmers aim for it, everyone else avoids it -- a land animal targeting a lake would just grind against the bank, since move() turns it back there anyway.
          const wet = isWater(tx, tz);
          if (this.swims) {
            // Look for water, and look FAR ENOUGH to find any.
            // Lakes average 28u across at ~9% cover, so a pond is typically tens of units away; searching only the animal's own roam radius meant a duck never reached one.
            const onWater = isWater(p.x, p.z);
            if (!onWater ? Math.random() < b.w : Math.random() < b.w * 0.8) {
              // Once afloat it hunts a nearby wet spot instead, so it paddles around the pond rather than immediately marching back out.
              const reachW = onWater ? 9 : WATER_SEEK;
              for (let k = 0; k < 12; k++) {
                const a2 = rand(0, Math.PI * 2),
                  r2 = rand(3, reachW);
                const qx = p.x + Math.cos(a2) * r2,
                  qz = p.z + Math.sin(a2) * r2;
                if (isWater(qx, qz)) {
                  tx = qx;
                  tz = qz;
                  break;
                }
              }
            }
          } else if (wet) {
            const d = dryNear(tx, tz);
            tx = d.x;
            tz = d.z;
          }
          this._tx = tx;
          this._tz = tz;
        }

        // One decision + one step of movement.
        // Paused animals do nothing, which is exactly when graze() takes over on its own.
        think(dt, herd) {
          if (this._alertT > 0) {
            if (this._alertIn > 0) this._alertIn -= dt;
            else {
              this._alertT -= dt;
              // Turn onto the bearing and do nothing else.
              // No target and no step, so `moving` falls to false through the usual speed measurement.
              // Slower than a normal turn: this is a head coming up, not a course correction.
              let d = this._alertYaw - this.group.rotation.y;
              d = Math.atan2(Math.sin(d), Math.cos(d));
              const step = this.turnSpeed * dt * 0.55;
              this.group.rotation.y += clamp(d, -step, step);
              // Whatever it was walking to is abandoned; standing for ten seconds would have tripped the stall detector anyway.
              this._tx = null;
              return;
            }
          }
          if (this._pause > 0) {
            this._pause -= dt;
            return;
          }
          if (this._tx === null) {
            this.pickTarget(herd);
            this._stallBest = Infinity;
            this._stall = 0;
          }
          if (this.steerTo(this._tx, this._tz, dt)) {
            this._tx = null;
            this._pause = rand(this.beh.p[0], this.beh.p[1]);
            return;
          }
          // GIVE UP.
          // The solver can separate a jam but not end one: both animals walk at a point on the far side of the other, so it undoes exactly what they walked.
          // The geometry is already right -- touching, not overlapping -- so the mistake is in the ERRAND, and that is what gets dropped.
          // Progress is measured against the closest this animal has been, not the last frame: being shoved backwards and re-walking the same ground would otherwise read as progress.
          const p = this.group.position;
          const ex = this._tx - p.x,
            ez = this._tz - p.z;
          const d = Math.sqrt(ex * ex + ez * ez); // not Math.hypot: this runs per animal per substep, and its overflow guard buys nothing at farm scale
          if (d < this._stallBest - this.speed * STALL_TIME * STALL_FRAC) {
            this._stallBest = d;
            this._stall = 0;
          } else if ((this._stall += dt) > STALL_TIME) {
            // The pause matters as much as the new target: it lets whatever was in the way clear out before this one picks a bearing.
            this._tx = null;
            this._pause = rand(0.4, 1.4);
          }
        }

        // Settle a swimmer into the water.
        // Applied AFTER update(), since three motion paths set position.y (walk, rabbit hop, frog hop).
        // The submerged half needs no clipping: the ground is opaque and drawn after the animals, so anything below y=0 is depth-occluded by the water.
        applyFloat(t, dt) {
          const p = this.group.position;
          // Airborne it floats on nothing: the sink eases out on take-off and back in on landing.
          const target =
            !this.aloft && isWater(p.x, p.z) ? this._floatDepth : 0;
          // exponential approach, so wading in and climbing out are both smooth
          this._sink += (target - this._sink) * approach(FLOAT_RATE, dt);
          if (this._sink < 1e-4) return;
          // a slow bob once afloat, scaled by how settled it actually is
          const afloat = this._sink / Math.max(this._floatDepth, 1e-4);
          p.y -=
            this._sink -
            Math.sin(t * 1.1 + this.phase) * 0.02 * this.group.scale.x * afloat;
        }

        // How much of this animal's weight the water is carrying, 0..1.
        // applyFloat already maintains _sink every frame, so this is a divide and no water query.
        // Being CONTINUOUS is the point: it lets a bird in the shallows crossfade between land and water behaviour rather than snapping across the shoreline.
        // In a FLIGHT (see FLIGHT).
        // Deliberately not called airborne: Rabbit and Frog keep a plain airborne property for their hop, and a getter of that name here would make it read-only -- and would make every flight guard in the game loop fire on a hopping rabbit.
        get aloft() {
          return this._fl !== null && this._fl.on;
        }

        // FLIGHT POSE.
        // The sim step works out pitch, glide and tuck from the path; this only applies them, plus the wingbeat, which is animation and so advances with the view's dt.
        // THE HEAD IS LEFT ALONE.
        // graze lifts it out of the grass on take-off -- leaving the ground is one of its exits, the same one a jump takes -- and after that it rides the body's gentle pitch.
        // Writing a counter-pitch here as well made the head snap the moment graze let go.
        // Owns the wings for the duration (flapWings stands down while aloft).
        _flightPose(t, dt) {
          const fl = this._fl,
            S = fl.spec;
          const br = this.bodyRoot;
          if (br) br.rotation.set(0, 0, fl.pitch);
          // Legs trailed back flat (see FLY_FOLD_*): thigh back at the hip, knee nearly straight, foot turned back at the ankle to lie behind.
          const tuck = fl.tuck,
            legs = this.legs;
          for (let li = 0; li < legs.length; li++) {
            const leg = legs[li];
            leg.hip.rotation.z = FLY_FOLD_HIP * tuck;
            leg.knee.rotation.z = (leg.hind ? 1 : -1) * FLY_FOLD_KNEE * tuck;
            leg.ankle.rotation.z = FLY_FOLD_ANKLE * tuck;
          }
          const W = this.wings;
          if (W.length) {
            fl.beat += dt * S.flapHz * 6.283185307179586;
            const flap = 0.25 + S.flapAmp * (0.5 - 0.5 * Math.cos(fl.beat)),
              held = 0.95 + 0.05 * Math.sin(fl.beat * 0.5);
            const open = flap + (held - flap) * fl.glide;
            for (let wi = 0; wi < W.length; wi++) {
              const w = W[wi];
              w.group.rotation.set(-w.side * open, w.group.rotation.y, w.baseZ);
            }
          }
        }

        // NECK STRETCHED FORWARD in flight, on graze's own pivot -- and so it must run AFTER graze.
        // On a frame graze posed (a bird taking off mid-bite, still lifting its head out of the grass) graze has just written fresh absolute values, and the reach is added on top; on every other frame this writes absolute values itself.
        // Adding to its own last frame instead would run away.
        // The reach fades in as graze lets go (1 - grazeAmt), so the head comes up and then goes out.
        // The neck is held horizontal in the WORLD, cancelling the body's pitch, and the head is set so the bill stays level: world head pitch = pitch + (reach - pitch*w) - reach = pitch*(1 - w).
        _flightNeck() {
          const piv = this.neckPivot,
            hr = this.headRoot;
          if (!piv || !hr) return;
          const fl = this._fl,
            w = fl.neck * (1 - this.grazeAmt);
          // The species' fraction of this bird's own graze swing, floored at horizontal: graze goes on down to the grass, and a flying bird's head drooping below level looks broken.
          // Never upward.
          const target = Math.min(
            0,
            Math.max(fl.spec.neck * this._neckTarget, this._neckFloor),
          );
          const reach = target * w,
            rot = reach - fl.pitch * w;
          if (this._grazePosed) {
            piv.rotation.z += rot;
            hr.rotation.z -= reach;
          } else {
            piv.rotation.z = rot;
            hr.rotation.z = -reach;
          }
        }

        get afloat() {
          return this._floatDepth
            ? Math.min(1, this._sink / this._floatDepth)
            : 0;
        }

        // Standing and staring at something.
        // Not merely told to: an animal that has been told but has not noticed yet is still grazing.
        get alerted() {
          return this._alertT > 0 && this._alertIn <= 0;
        }

        // Told there is something, and which way it is.
        // The yaw is stored rather than the point, because nothing is ever there to look at -- only a direction.
        alert(yaw, hold, delay) {
          this._alertYaw = yaw;
          this._alertT = hold;
          this._alertIn = delay;
        }

        // How far a hanging tail has streamed back, 0 at rest and `max` flat out.
        //
        // A standing horse's tail hangs; a galloping one carries it out behind.
        // Keyed to speed as a fraction of the animal's OWN walk, so the same call means the same thing for a donkey and a horse, and squared so a stroll barely moves it and only a real run swings it up.
        // The floor at 0.3 keeps it still while an animal shuffles or is shoved by a neighbour.
        tailLift(max) {
          const n = THREE.MathUtils.clamp((this._speedN - 0.3) / 1.6, 0, 1);
          return n * n * max;
        }

        // On the ground, i.e. not mid-hop and not on the way back down.
        // Both halves are needed: jumpY alone reads as grounded at the top of the arc and again on the frame of the launch, before the velocity has moved it.
        get grounded() {
          return this.jumpY <= 0 && this.jumpV <= 0;
        }

        // The HOP button, taken while afloat.
        // There is no ground to push off, so each swimmer answers it in its own way (see Flier and Frog).
        // Returns true if it consumed the press; false leaves it buffered, which is how a species declines while its previous stroke is still running.
        waterAction(_afloat) {
          return false;
        }

        // Set a lunge's strength and lock in its direction.
        // Species call this rather than writing _surge, so the aiming rule lives in one place: a lunge goes where the animal is facing.
        // The sign is captured at the press and then held, so turning mid-glide steers the animal without flipping it end for end.
        lunge(speed) {
          this._surge = speed;
          this._surgeSign = this._driveSign || 1;
        }

        // Spend the lunge: a decaying glide that needs no stick input, so a beat or a kick coasts on after the button is long released.
        // Same shoreline rule as move() -- swimmers pass, everyone else can't.
        applySurge(dt) {
          if (this._surge <= 1e-3) {
            this._surge = 0;
            return;
          }
          const p = this.group.position,
            a = this.group.rotation.y,
            d = this._surge * this._surgeSign * dt;
          const nx = p.x + Math.cos(a) * d,
            nz = p.z - Math.sin(a) * d;
          if (this.swims || !isWater(nx, nz)) {
            p.x = nx;
            p.z = nz;
          }
          this._surge *= Math.exp(-SURGE_DECAY * dt);
        }

        move(forward, sideways, dt, boost) {
          const speed = this.speed * boost; // boost: 1 = base .. this.sprint = full sprint
          // Which way along its own axis this animal is travelling.
          // Recorded here rather than read off the input, so it is right for every caller -- the stick, the keys and the herd's own steering alike.
          if (Math.abs(forward) > 1e-3) this._driveSign = forward < 0 ? -1 : 1;
          let fx = forward,
            sz = sideways;
          const lenSq = fx * fx + sz * sz;
          if (lenSq > 1) {
            const inv = 1 / Math.sqrt(lenSq);
            fx *= inv;
            sz *= inv;
          }
          const angle = this.group.rotation.y,
            sin = Math.sin(angle),
            cos = Math.cos(angle);
          const lg = this._locoGain || 1; // hop lunge: surge airborne, ease on plant
          const nx =
            this.group.position.x + (fx * cos + sz * sin) * speed * dt * lg;
          const nz =
            this.group.position.z + (-fx * sin + sz * cos) * speed * dt * lg;
          // Don't walk into the lake.
          // Ducks, geese and frogs may; a cow may not.
          // One water query per sim step for the ONE animal being driven, since the rest of the herd never translates.
          // Axes are tested separately so a blocked animal SLIDES along the shoreline instead of sticking to it.
          if (this.swims || !isWater(nx, nz)) {
            this.group.position.x = nx;
            this.group.position.z = nz;
          } else {
            if (!isWater(nx, this.group.position.z)) this.group.position.x = nx;
            if (!isWater(this.group.position.x, nz)) this.group.position.z = nz;
          }
        }
        rotate(amount, dt) {
          this.group.rotation.y += amount * this.turnSpeed * dt;
        }

        updateMotion(t, dt) {
          if (!this.initialized) {
            this.lastPosition.copy(this.group.position);
            this._lastYaw = this.group.rotation.y;
            this.initialized = true;
          }
          const dx = this.group.position.x - this.lastPosition.x;
          const dz = this.group.position.z - this.lastPosition.z;
          const idt = 1 / Math.max(dt, 0.0001); // once: both rates below divide by the same step
          const speed = Math.sqrt(dx * dx + dz * dz) * idt;
          this.lastPosition.copy(this.group.position);
          // Measure speed as a fraction of THIS animal's own walk, so the test means the same thing for a mouse and a cow.
          const walkN = speed / Math.max(this.speed, 0.001);
          // TURNING IS FOOTWORK TOO.
          // Measured from ground covered alone, a pivot on the spot covers none: the stride froze and the animal rotated on locked legs, like a plate spun on a table.
          // Nothing alive turns like that -- a cow pivoting has to pick its feet up and put them down somewhere else, or it falls over.
          // So yaw rate counts as effort, relative to this animal's OWN turnSpeed for the same reason walk is relative to its own walk.
          // At 0.8, a full-rate pivot is most of a walk's cadence and the AI's usual 0.55-rate turn is about half: a shuffle, not a march.
          // Below the start threshold (0.14) a small correction still happens on planted feet, which is also what animals do.
          // Wrapped, because rotation.y accumulates without bound.
          // One divide and one round, exact at any magnitude -- not atan2(sin, cos), which is three transcendentals per refreshed animal per frame to do the same thing.
          let dyaw = this.group.rotation.y - this._lastYaw;
          dyaw -= 6.283185307179586 * Math.round(dyaw / 6.283185307179586);
          this._lastYaw = this.group.rotation.y;
          const turnN =
            ((Math.abs(dyaw) * idt) / Math.max(this.turnSpeed, 0.001)) * 0.8;
          // Combined, not maxed, so walking round a bend steps a little faster than walking straight -- the outside legs really are covering more ground.
          // A wedged animal that is neither moving nor turning still gets zero, so the cure for walking in place below is untouched.
          const norm = Math.sqrt(walkN * walkN + turnN * turnN);
          // Hysteresis, or a creeping animal flickers across the threshold.
          const moving = norm > (this.moving ? 0.07 : 0.14);
          this.moving = moving;

          // IN THE AIR, nothing below this line applies: no walk cycle (a bird crossing the field at five metres a second would otherwise WALK through the sky), no catch steps, no turning footwork.
          // The flight pose owns the body; height is its jumpY as ever.
          if (this._fl !== null && this._fl.on) {
            this.moving = false;
            this._slip = 0;
            this._catch = 0;
            this._flightPose(t, dt);
            this.group.position.y = this._baseY + this.jumpY;
            return;
          }

          // BRACE, THEN STEP.
          // Below the walk threshold an animal can still be moving -- a neighbour's separation push drifts it at 0.05-0.2 of a walk -- and gliding there on planted feet is skating.
          // Nothing alive does that.
          // Lowering the threshold is not the cure either: a slow drift would then play as slow-motion walking, which looks worse.
          // What an animal actually does is lean on its feet until the body has drifted too far over them, then lift one and put it down under itself again.
          // So drift below the threshold is banked, in the same units the stride uses -- phase the gait WOULD have advanced -- and once about a sixth of a step (one step is PI) has built up, one catch step plays: its own tempo, not tied to the drift, with a bell-shaped swing that starts and ends at rest so it neither pops in from the idle pose nor snaps back out to it.
          // The bank leaks, so the sub-millimetre shuffling of the contact solver never adds up to a step; only drift that is really going somewhere does.
          // Measured: a cow drifting at a tenth of a walk steps every 2s, about 1s of it planted; near the walk threshold it steps almost continuously, so there is no seam where catch steps hand over to walking.
          // this.moving is left meaning "walking": grazing, idle poses and the rest of the animal must not think a catch step is a walk.
          let animate = moving,
            intensity = THREE.MathUtils.clamp(norm, 0, 1.25),
            rate = intensity; // stride phase per second, over gaitFrequency
          if (moving) {
            this._slip = 0;
            this._catch = 0;
          } else if (this._catch > 0) {
            const CATCH_RATE = 0.6; // a catch step at 60% of walking cadence
            const prog = 1 - this._catch / Math.PI;
            animate = true;
            rate = CATCH_RATE;
            intensity = CATCH_RATE * Math.sin(Math.PI * Math.min(1, prog));
          } else {
            this._slip =
              this._slip * Math.exp(-0.15 * dt) +
              this.gaitFrequency * norm * dt;
            if (this._slip > 0.55) {
              this._slip = 0;
              this._catch = Math.PI;
            }
          }
          // Kept, smoothed, because more than the gait wants to know how hard this animal is working.
          // Eased so a tail does not snap up on the frame a collision shoves the animal sideways.
          this._speedN += (norm - this._speedN) * approach(5, dt);

          const breath = Math.sin(
            t * CONFIG.animation.breathSpeed + this.breathPhase,
          );
          if (this.bodyRoot) {
            this.bodyRoot.scale.x = 1 - breath * this.breathAmount * 0.2;
            this.bodyRoot.scale.y = 1 + breath * this.breathAmount;
            this.bodyRoot.scale.z = 1 - breath * this.breathAmount * 0.12;
          }

          // How afloat this animal is, 0..1.
          // The walk-to-swim blend is TWO MULTIPLIES and no new state: no swim system, no second animation set, no extra water query.
          // It lags one frame (applyFloat runs after update), which at an approach rate of 3/s is well under a pixel.
          const afloat = this.afloat;
          const land = 1 - afloat;

          if (animate) {
            // Stride advances with GROUND COVERED, not wall-clock time.
            // This is the cure for walking in place: a wedged animal covers no distance, so its stride phase stops advancing, no foot crosses into contact, and no step can fire.
            // It also removes foot-sliding, since cadence now tracks speed.
            const dPhase = this.gaitFrequency * rate * dt;
            this._gaitPhase += dPhase;
            if (this._catch > 0)
              this._catch = Math.max(0, this._catch - dPhase);
            const gait = this._gaitPhase;
            // Each of these was being evaluated two or three times over, on adjacent lines.
            const sg = Math.sin(gait),
              sh = Math.sin(gait * 0.5),
              i1 = Math.min(intensity, 1);
            this._baseY = Math.abs(sg) * this.bodyBob * i1 * land;
            // ONE rotation.set() per node, never an axis at a time.
            // Every single-axis write to an Euler fires three's change callback, which rebuilds the node's quaternion from all three angles -- six trig calls -- and throws away the previous rebuild.
            // Three separate writes cost three rebuilds and keep one.
            const br = this.bodyRoot;
            if (br) {
              const ry = sh * 0.11 * afloat * i1;
              br.rotation.set(
                sg * this.bodySway * 0.45 * land,
                ry,
                sh * this.bodySway * land,
              );
              if (this.neckMount) this.neckMount.rotation.y = -ry * 0.8;
            }
            const hr = this.headRoot;
            if (hr)
              hr.rotation.set(
                -sg * this.bodySway * 0.28 * land,
                hr.rotation.y, // not driven here; graze owns it
                -sh * this.bodySway * 0.75 * land,
              );
            const swing = this.legSwing * i1,
              kneeAmp = this.legSwing * 0.62,
              legs = this.legs;
            for (let li = 0; li < legs.length; li++) {
              const leg = legs[li];
              const sp = Math.sin(gait + leg.phase);
              const hipZ = sp * swing,
                kneeZ = (leg.hind ? 1 : -1) * Math.max(0, sp) * kneeAmp;
              leg.hip.rotation.z = hipZ;
              leg.knee.rotation.z = kneeZ;
              leg.ankle.rotation.z = -(hipZ + kneeZ); // from the locals, not read back off the Eulers
              if (this.jumpY <= 0 && leg._prevSin > 0 && sp <= 0 && SOUND) {
                const gap = 0.34 - 0.18 * i1;
                if (t - (this._lastStepT || -1) >= gap) {
                  this._lastStepT = t;
                  const lx = leg.hip.position.x,
                    lz = leg.hip.position.z;
                  const a = this.group.rotation.y,
                    cs = Math.cos(a),
                    sn = Math.sin(a),
                    sc = this.group.scale.x;
                  SOUND.step(
                    this.type,
                    this.group.position.x + (lx * cs + lz * sn) * sc,
                    0.06,
                    this.group.position.z + (-lx * sn + lz * cs) * sc,
                    0.35 + 0.4 * i1,
                  );
                }
              }
              leg._prevSin = sp;
            }
          } else if (!restSettled(this, true)) {
            // RELAX IN TIME, not in calls.
            // Not lerp(x, 0, 0.08)-style, a fixed fraction per CALL: this runs once per pose refresh, and the pose LOD refreshes a distant animal every 2nd or 4th frame, so a far animal's legs would settle four times slower in real seconds than a near one's, and everything twice as fast at 120Hz as at 60.
            // Decaying by exp(-rate * dt) makes the result depend only on elapsed time, however it is sliced.
            // Same rates as the rabbit's relaxation: bob 10/s, posture 7/s, legs 8/s.
            // Computed once, not per axis.
            // Settled, none of this runs (see restSettled).
            const kB = Math.exp(-10 * dt),
              kP = Math.exp(-7 * dt),
              kL = Math.exp(-8 * dt);
            this._baseY *= kB;
            const br = this.bodyRoot;
            if (br)
              br.rotation.set(
                br.rotation.x * kP,
                br.rotation.y * kP,
                br.rotation.z * kP,
              );
            if (this.neckMount) this.neckMount.rotation.y *= kP;
            const hr = this.headRoot;
            if (hr)
              hr.rotation.set(
                hr.rotation.x * kP,
                hr.rotation.y,
                hr.rotation.z * kP,
              );
            const legs = this.legs;
            for (let li = 0; li < legs.length; li++) {
              const leg = legs[li];
              leg.hip.rotation.z *= kL;
              leg.knee.rotation.z *= kL;
              leg.ankle.rotation.z *= kL;
            }
          }
          this.group.position.y = this._baseY + this.jumpY;
        }

        update(t, dt) {
          this.updateMotion(t, dt);
          this.blink(dt);
        }

        // One-time: insert a neck bone at the shoulder, reparent the head onto it.
        // Per frame only grazeAmount drives it.
        _ensureNeck() {
          if (this._neckReady) return;
          this._neckReady = true;
          const hr = this.headRoot;
          if (!hr) return;
          const g = this.grazeCfg;
          const Sx = g.neckBase[0],
            Sy = g.neckBase[1];
          const Hx = hr.position.x,
            Hy = hr.position.y,
            Hz = hr.position.z;

          const pivot = new THREE.Group();
          pivot.position.set(Sx, Sy, Hz);
          // Onto the mount, not the group: the re-parent is permanent, so hanging it on the group would silently undo the shoulder offset.
          (this.neckMount || this.group).add(pivot);
          pivot.add(hr); // re-parents; head keeps world rest pose
          hr.position.set(Hx - Sx, Hy - Sy, 0);
          this.neckPivot = pivot;

          // If there's a visible neck (goat), hang it on the same bone so it swings down with the head instead of poking up.
          if (this.neckRoot) {
            const nx = this.neckRoot.position.x,
              ny = this.neckRoot.position.y,
              nz = this.neckRoot.position.z;
            pivot.add(this.neckRoot);
            this.neckRoot.position.set(nx - Sx, ny - Sy, nz);
          }

          // Swing+lower the neck so the head origin reaches the ground; drop solved from geometry, so any neck length reaches.
          const L1 = Math.hypot(Hx - Sx, Hy - Sy);
          const a1rest = Math.atan2(Hy - Sy, Hx - Sx);
          const reach = Math.min(g.reach, L1 * 0.92);
          const c = reach / L1;
          const sMag = Math.sqrt(Math.max(0, 1 - c * c));
          const theta = -Math.acos(Math.max(-1, Math.min(1, c))); // head swings down-forward
          let drop = Sy - g.gy - L1 * sMag; // lower pivot so head origin reaches gy
          drop = Math.max(0, Math.min(drop, Sy - 0.25));
          this._neckY0 = Sy;
          this._neckDrop = drop;
          this._neckTarget = theta - a1rest;
          // Flight: the swing that brings this neck exactly to horizontal.
          // The floor for FLIGHT.neck, and the tuning aid: _neckFloor / _neckTarget is the fraction at which this bird's neck goes flat.
          this._neckFloor = Math.min(0, -a1rest);
        }

        // Independent, self-scheduling grazing via the IK chain.
        // Runs AFTER update() so it composes on top of the idle pose.
        // Only head/neck move.
        graze(t, dt) {
          if (!this.headRoot) return;
          this._ensureNeck();
          const hr = this.headRoot,
            g = this.grazeCfg;

          if (this.grazeState === 0) {
            this.grazeCooldown -= dt;
            if (
              this.grazeCooldown <= 0 &&
              !this.moving &&
              this.grounded &&
              !this.alerted
            ) {
              this.grazeState = 1;
              this.grazeDur = rand(2.5, 5.5);
            }
          }
          // Walking off already interrupts a graze; leaving the ground has to as well, or the head stays buried in grass that is now a foot below it.
          // State 3 is the retract, the same exit taken when the animal decides to move: the head comes up rather than snapping.
          if (
            (this.moving || !this.grounded || this.alerted) &&
            this.grazeState !== 0 &&
            this.grazeState !== 3
          )
            this.grazeState = 3;

          const target = this.grazeState === 1 || this.grazeState === 2 ? 1 : 0;
          if (this.grazeState === 2) {
            this.grazeTimer2 -= dt;
            if (this.grazeTimer2 <= 0) this.grazeState = 3;
          }
          this.grazeAmt +=
            (target - this.grazeAmt) *
            approach(target > this.grazeAmt ? 3.2 : 4.0, dt);
          if (this.grazeState === 1 && this.grazeAmt > 0.985) {
            this.grazeState = 2;
            this.grazeTimer2 = this.grazeDur;
          }
          if (this.grazeState === 3 && this.grazeAmt < 0.02) {
            this.grazeState = 0;
            this.grazeAmt = 0;
            this.grazeCooldown = rand(8, 20);
          }

          const amt = this.grazeAmt;
          if (amt < 0.002) {
            if (this._grazePosed) {
              this.neckPivot.rotation.z = 0;
              this.neckPivot.position.y = this._neckY0;
              hr.rotation.set(hr.rotation.x, 0, 0);
              this._grazePosed = false;
            }
            return;
          }
          this._grazePosed = true;

          const ph = this.phase;
          let pitchBase, pitchOsc, yawOsc;
          switch (g.style) {
            case "peck":
              pitchBase = 0.5;
              pitchOsc = -Math.max(0, Math.sin(t * 7.5 + ph)) * 0.35;
              yawOsc = Math.sin(t * 0.7 + ph) * 0.5;
              break;
            case "sniff":
              pitchBase = 0.3;
              pitchOsc = Math.sin(t * 10.0 + ph) * 0.08;
              yawOsc = Math.sin(t * 5.5 + ph) * 0.6;
              break;
            case "root":
              pitchBase = -0.35;
              pitchOsc = Math.sin(t * 3.2 + ph) * 0.12;
              yawOsc = Math.sin(t * 1.7 + ph) * 0.7;
              break;
            default:
              pitchBase = 0.3;
              pitchOsc = Math.sin(t * 2.0 + ph) * 0.06;
              yawOsc = Math.sin(t * 1.1 + ph) * 0.5;
              break;
          }
          this.neckPivot.position.y = this._neckY0 - this._neckDrop * amt; // lower the neck straight down (stays inside body)
          this.neckPivot.rotation.z = this._neckTarget * amt; // neck swings the head down onto the ground
          // face-into-grass + peck/sniff on z, seek sway on y: one quaternion rebuild, not two
          hr.rotation.set(
            hr.rotation.x,
            yawOsc * g.yaw * amt,
            (pitchBase + pitchOsc) * amt,
          );
        }

        place(o, scale) {
          // A neck's base is bolted to the shoulders while its head must stay steady.
          // neckMount hangs off the body so the base follows it; the head hangs off the group so it does not.
          // Done here rather than in nineteen build() methods, so no species can be missed.
          if (this.bodyRoot && (this.neckRoot || this.headRoot)) {
            const mount = new THREE.Group();
            this.bodyRoot.add(mount);
            if (this.neckRoot) mount.add(this.neckRoot);
            if (this.headRoot) mount.add(this.headRoot);
            this.neckMount = mount;
          }
          // WHICH LEGS ARE HIND, decided once, here, for the same reason.
          //
          // A quadruped's front leg flexes at the carpus and its lower half swings BACK.
          // The hind leg's big joint is the hock, and it flexes the other way -- which is the whole reason a horse reads as having its back knees on backwards.
          // Driving all four from one sign is the single most obvious thing wrong with a four-legged walk.
          // Split at the midpoint of the animal's own legs rather than at x = 0, because species place their legs at their own offsets and several sit a hair off centre.
          // Two legs or fewer means a bird, and a bird's visible backward joint is its ankle -- the hock again -- so those bend as hind legs too.
          const L = this.legs;
          if (L.length > 2) {
            let lo = Infinity,
              hi = -Infinity;
            for (const l of L) {
              const x = l.hip.position.x;
              if (x < lo) lo = x;
              if (x > hi) hi = x;
            }
            const mid = (lo + hi) * 0.5;
            for (const l of L) l.hind = l.hip.position.x < mid;
          } else for (const l of L) l.hind = true;

          this.group.position.set(o.x || 0, 0, o.z || 0);
          this.group.rotation.y = o.rotation || 0;
          this.group.scale.setScalar(scale);
          this.lastPosition.copy(this.group.position);
          // One-time cull sphere from part-node world positions (geometry is in the batch), padded for thickness + shadow reach.
          // Oversize is cheap; undersize would pop.
          this.group.updateMatrixWorld(true);
          const box = new THREE.Box3(),
            v = new THREE.Vector3();
          const gx = this.group.position.x,
            gy = this.group.position.y,
            gz = this.group.position.z;
          let hz = 0,
            hy = 0; // lateral/vertical half-extents (bodies are symmetric there)
          // Fore/aft is measured SIGNED, because animals are not symmetric front-to-back.
          // A cow's head reaches further forward than its rump reaches back, so folding both into one symmetric capsule would pad the tail end by as much as the head needs.
          let minX = Infinity,
            maxX = -Infinity;
          // A tail is soft and swishes about: it should never shove another animal, and letting it into the footprint stretches the collision capsule well past the rump.
          // Keep tails OUT of the footprint but still IN the cull box, or a wagging tail pops at the edge of the screen.
          let tailNodes = null;
          if (this.tailRoot) {
            tailNodes = new Set();
            this.tailRoot.traverse((n) => tailNodes.add(n));
          }
          this.group.traverse((n) => {
            if (n.userData && n.userData.animal) {
              const e = n.matrixWorld.elements;
              const px = e[12],
                py = e[13],
                pz = e[14];
              box.expandByPoint(v.set(px, py, pz)); // cull box: everything
              if (tailNodes && tailNodes.has(n)) return; // ...footprint: no tail
              // transformed unit-box half-extent per world axis (handles any part rotation), added to the part's centre offset -- so a body ellipsoid centred at z=0 contributes its full width.
              const ex = Math.abs(e[0]) + Math.abs(e[4]) + Math.abs(e[8]);
              const ey = Math.abs(e[1]) + Math.abs(e[5]) + Math.abs(e[9]);
              const ez = Math.abs(e[2]) + Math.abs(e[6]) + Math.abs(e[10]);
              const lx = px - gx; // spawn frame is axis-aligned (ry = 0)
              if (lx - ex < minX) minX = lx - ex;
              if (lx + ex > maxX) maxX = lx + ex;
              const ry2 = Math.abs(py - gy) + ey,
                rz = Math.abs(pz - gz) + ez;
              if (rz > hz) hz = rz;
              if (ry2 > hy) hy = ry2;
            }
          });
          // How far this animal settles when afloat.
          // Derived from the height I'm already measuring, so it scales with the species for free.
          this._floatDepth = FLOAT_FRAC * (hy || scale);
          const spanX = maxX > minX ? (maxX - minX) * 0.5 : 0;
          this._footprint = {
            halfX: spanX || scale,
            halfZ: hz || scale,
            halfY: hy || scale,
            // where the capsule's centre sits along the body axis, relative to the group origin (positive = forward)
            offX: maxX > minX ? (maxX + minX) * 0.5 : 0,
          };
          if (box.isEmpty()) {
            this._cullR = 3 * scale;
            this._cullDY = scale;
          } else {
            const sph = box.getBoundingSphere(new THREE.Sphere());
            this._cullR = sph.radius + 1.4 * scale + 0.6;
            this._cullDY = sph.center.y - this.group.position.y;
          }

          // FREEZE THE PARTS.
          // Every refreshed animal gets updateMatrixWorld(true), and three's default matrixAutoUpdate recomposes each node's LOCAL matrix from position, quaternion and scale on every one of those calls.
          // Only the joint GROUPS animate; a part -- a wool clump, a hoof, a tail tube -- keeps the transform it was built with for life, so that recompose produced the same matrix every time, for most nodes of every animal.
          // Frozen, a part skips straight to matrixWorld = parent * local, which is the half of the work that actually changes.
          // Safe because place() is the last statement of every species constructor (all 20), no species subclasses another, and the only part nodes touched after construction are EYES (blinking scales them) -- checked by searching every field, array and local that holds a node returned from part/overlay/eye/segment/tube.
          // Eyes stay live.
          // userData.animal is set by exactly those three creators, never on a group.
          // Build-time, so the Set and the closure here cost nothing that matters.
          const eyeNodes = new Set();
          for (let i = 0; i < this.eyes.length; i++)
            eyeNodes.add(this.eyes[i].mesh);
          this.group.traverse((n) => {
            if (n.userData.animal && !eyeNodes.has(n)) {
              n.updateMatrix();
              n.matrixAutoUpdate = false;
            }
          });

          // HEIGHT, for flight clearance: the highest point any part reaches.
          // Each part is a unit shape carried by its world matrix, and a unit shape's vertical half-extent is at most the length of that matrix's y row -- exact for a sphere, generous for the rest, which is the right way to be wrong when the number decides what a bird flies over.
          let top = 0;
          this.group.traverse((n) => {
            if (!n.userData.animal) return;
            const e = n.matrixWorld.elements;
            const h =
              e[13] + Math.sqrt(e[1] * e[1] + e[5] * e[5] + e[9] * e[9]);
            if (h > top) top = h;
          });
          this._height = Math.max(0, top - this.group.position.y);
          // One plan per flier, for life: a flight allocates nothing.
          const spec = FLIGHT[this.type];
          if (spec)
            this._fl = {
              spec,
              on: false,
              t: 0,
              T: 0,
              x0: 0,
              z0: 0,
              x1: 0,
              z1: 0,
              D: 0,
              ux: 0,
              uz: 0,
              vA: 0,
              vC: 0,
              kA: 0,
              kC: 0,
              H: 0,
              y0: 0,
              y1: 0,
              tV1: 0,
              tP: 0,
              tV2: 0,
              yaw0: 0,
              dyaw: 0,
              yaw1: 0,
              beat: 0,
              flyIn: -1,
              fleeYaw: NaN,
              // pose state, written by the sim step and only read by the view
              u: 0,
              pitch: 0,
              glide: 0,
              tuck: 0,
              neck: 0,
            };
        }
      }

      /* ---------------------------- PIG ---------------------------------- */

      /* Wings.
         Six of nineteen species have them, so they are not the base class's business.
         Chicken, Chick, Duck, Goose, Sparrow and Rooster extend this instead of Animal. */
      class Flier extends Animal {
        // Wing = flat panel hinged at the shoulder, hanging down the flank.
        // Rotating the pivot about X swings it out and up (open/flap).
        addWing(side, o) {
          const g = new THREE.Group();
          g.position.set(o.x || 0, o.y, side * o.z);
          g.rotation.z = side * (o.tuck ?? 0.06); // slight resting tuck
          (o.parent || this.bodyRoot).add(g);
          const thin = o.thin ?? o.chord * 0.4;
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            o.mat,
            g,
            [-(o.sweep || 0), -o.len * 0.42, side * (o.out ?? 0.02)],
            [0, 0, 0],
            [o.chord, o.len, thin],
          );
          if (o.tipMat)
            // primaries: a smaller darker panel toward the tip
            this.part(
              new THREE.IcosahedronGeometry(1, 1),
              o.tipMat,
              g,
              [
                -(o.sweep || 0) - o.chord * 0.25,
                -o.len * 0.82,
                side * (o.out ?? 0.04),
              ],
              [0, 0, 0],
              [o.chord * 0.62, o.len * 0.42, thin * 0.92],
            );
          this.wings.push({ group: g, side, baseZ: g.rotation.z });
          return g;
        }

        // Command a flap bout: flapWings already owns this state for its idle scheduler, so a deliberate flap is the same path with the timer forced.
        flap(amp, dur, beats) {
          this._flapDur = this._flapLeft = dur;
          this._flapBeats = beats;
          this._flapAmp = amp;
        }

        // Afloat, HOP becomes a wing beat.
        // A duck flapping on open water skitters FORWARD, so this is a lunge and not merely a pose.
        waterAction(afloat) {
          const W = this.wings;
          if (!W || !W.length) return false; // wingless: decline, as the base does
          if (this._flapLeft > 0) return false; // mid-beat -- this IS the cooldown
          // Harder and quicker than the idle bout (up to 1.55 rad over 0.4-0.75s): it has to read as effort, not preening.
          this.flap(1.9, 0.4, 3);
          this.lunge(this.speed * SURGE_GAIN * afloat);
          return true;
        }

        // Bird idle: occasional flap bout (open about X) + small baseline.
        // No-op when wingless.
        flapWings(t, dt) {
          const W = this.wings;
          if (!W || !W.length) return;
          if (this.aloft) return; // _flightPose owns the wings in the air
          if (this._flapWait === undefined) this._flapWait = rand(2, 7);
          let bout = 0;
          if (this._flapLeft > 0) {
            this._flapLeft -= dt;
            const p = 1 - Math.max(this._flapLeft, 0) / this._flapDur; // 0->1
            const env = Math.sin(Math.min(p, 1) * Math.PI); // ease in/out
            const beat =
              0.5 - 0.5 * Math.cos(p * Math.PI * 2 * this._flapBeats);
            bout = env * this._flapAmp * beat; // >=0: wings open and return
            if (this._flapLeft <= 0) {
              this._flapLeft = 0;
              this._flapWait = rand(3, 9); // schedule the next one
            }
          } else if (this.initialized && !this.moving) {
            this._flapWait -= dt;
            if (this._flapWait <= 0) {
              this._flapDur = this._flapLeft = rand(0.4, 0.75);
              this._flapBeats = 2 + ((Math.random() * 3) | 0); // 2-4 beats
              this._flapAmp = rand(0.8, 1.55); // radians of open (up to ~88 deg)
            }
          }
          // baseline: a light pump while walking, a shallow breath while idle
          const idle = this.moving
            ? (0.5 - 0.5 * Math.cos(t * this.gaitFrequency * 2 + this.phase)) *
              0.14
            : Math.max(0, Math.sin(t * 1.6 + this.phase)) *
              (this.initialized ? 0.06 : 0.02);
          const open = idle + bout; // >= 0 total raise angle
          for (let wi = 0; wi < W.length; wi++) {
            const w = W[wi];
            // swing out & up about the forward axis, keeping the resting tuck -- one quaternion rebuild
            w.group.rotation.set(-w.side * open, w.group.rotation.y, w.baseZ);
          }
        }
      }

      /* Ballistic hop, for the two species that move that way. */
      class Hopper extends Animal {
        // C1 hop trajectory at phase `cycle` in [0,1): a ballistic parabola while airborne, and a cubic-hermite cushion on the ground whose end slopes MATCH the parabola's launch and land velocities.
        // The position therefore has no velocity corners anywhere, which is the source of the mechanical snap.
        // Returns { y, vN, airT }: height, normalised vertical velocity (-1..1), and how airborne it is (0 ground, 1 apex).
        _hopArc(cycle, height, A) {
          const cap = 0.06 * height; // shallow cushion; also the ground offset
          const e = 0.006,
            raw = hopY(cycle, height, A, cap),
            vy =
              (hopY(cycle + e, height, A, cap) -
                hopY(cycle - e, height, A, cap)) /
              (2 * e);
          // Offset up by cap so the lowest point of the arc sits at y=0: the body never dips below ground, and a constant offset adds no velocity corner (the motion stays smooth).
          const o = _HOP_ARC; // written in place; see its declaration
          o.y = raw + cap;
          o.vN = THREE.MathUtils.clamp(vy / ((4 * height) / A), -1, 1);
          o.airT = THREE.MathUtils.clamp(raw / Math.max(height, 1e-4), 0, 1);
          return o;
        }
        // Forward-speed multiplier for a leap: near-constant while airborne, eased on the ground, with soft edges so horizontal motion never snaps.
        // Mean is ~1, so top speed is unchanged.
        _hopLunge(cycle, A) {
          const edge = 0.07;
          const gate = smooth01(0, edge, cycle) - smooth01(A - edge, A, cycle);
          const floor = 0.15;
          return floor + ((1 - floor) / A) * gate;
        }
      }

      class Pig extends Animal {
        constructor(o = {}) {
          super("pig");
          const C = CONFIG.species.pig;
          const scale = rand(
            C.scale * (1 - C.variation),
            C.scale * (1 + C.variation),
          );
          this.L = rand(0.96, 1.04);
          this.H = rand(0.96, 1.04);
          this.W = rand(0.96, 1.04);
          this.headSize = rand(0.94, 1.06);
          this.legSize = rand(0.95, 1.05);
          this.earSize = rand(0.92, 1.08);
          this.snoutSize = rand(0.94, 1.06);
          const c = pick([
            [0xd48681, 0xb86664, 0xe39a95],
            [0xe09b96, 0xc97974, 0xe9aaa5],
            [0x8f6553, 0x704b3c, 0xa97967],
            [0x5e493f, 0x48352f, 0x74584c],
            [0x85827d, 0x66635f, 0x99958f],
            [0x4e4d4a, 0x383735, 0x62605c],
            [0xc9b99e, 0xa99880, 0xd6c7ad],
          ]);
          this.bodyMat = mat(tint(c[0]), 0.88);
          this.darkMat = mat(tint(c[1]), 0.92);
          this.snoutMat = mat(tint(c[2]), 0.85);
          this.hoofMat = mat(0x292526, 1);
          this.eyeMat = mat(this.eyeColor, CONFIG.eyes.roughness);
          this.build();
          this.place(o, scale);
        }
        build() {
          this.bodyRoot = new THREE.Group();
          this.group.add(this.bodyRoot);
          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.bodyMat,
            this.bodyRoot,
            [0, 1.38, 0],
            [0, 0, 0],
            [1.65 * this.L, 0.72 * this.H, 0.82 * this.W],
          );
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.darkMat,
            this.bodyRoot,
            [0, 1.05, 0],
            [0, 0, 0],
            [1.38 * this.L, 0.55 * this.H, 0.7 * this.W],
          );

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(1.42 * this.L, 1.63 * this.H, 0);
          this.group.add(this.headRoot);
          const headRadiusX = 0.82 * 1.05 * this.headSize;
          this.part(
            new THREE.IcosahedronGeometry(0.82, 1),
            this.bodyMat,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.05 * this.headSize, 0.95 * this.headSize, 0.9 * this.headSize],
          );

          const snoutLength = 0.32 * this.snoutSize;
          const snout = new THREE.Group();
          snout.position.set(
            headRadiusX - CONFIG.surface.snoutFaceInset + snoutLength * 0.5,
            -0.16 * this.headSize,
            0,
          );
          this.headRoot.add(snout);
          this.part(
            new THREE.CylinderGeometry(0.34, 0.38, 0.32, 8),
            this.snoutMat,
            snout,
            [0, 0, 0],
            [0, 0, Math.PI / 2 - 0.2],
            [this.snoutSize, this.snoutSize, this.snoutSize],
          );

          const ez = 0.485 * this.headSize;
          this.eye(
            new THREE.SphereGeometry(0.085, 8, 6),
            this.eyeMat,
            this.headRoot,
            [0.49 * this.headSize, 0.15 * this.headSize, ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );
          this.eye(
            new THREE.SphereGeometry(0.085, 8, 6),
            this.eyeMat,
            this.headRoot,
            [0.49 * this.headSize, 0.15 * this.headSize, -ez],
            [0, 0, 0],
            [1, 1, 0.7],
          );

          this.pigEar(0.6 * this.headSize, 1);
          this.pigEar(-0.6 * this.headSize, -1);

          const upper = 0.49 * this.legSize,
            lower = 0.43 * this.legSize;
          const legs = [
            [0.85 * this.L, 0.37 * this.W, Math.PI * 1.5],
            [-0.85 * this.L, 0.37 * this.W, 0],
            [0.85 * this.L, -0.37 * this.W, Math.PI * 0.5],
            [-0.85 * this.L, -0.37 * this.W, Math.PI],
          ];
          for (const [x, z, phase] of legs)
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.18,
              lowerRadius: 0.15,
              upperMat: this.bodyMat,
              lowerMat: this.bodyMat,
              hoofMat: this.hoofMat,
              hoofSize: 0.18,
              phase,
            });

          this.tailRoot = new THREE.Group();
          this.tailRoot.position.set(-1.55 * this.L, 1.53 * this.H, 0);
          // Tails hang off bodyRoot, not group, or the body sways out from under them and they detach at the rump.
          // bodyRoot sits at the group origin, so the rest pose is unchanged.
          this.bodyRoot.add(this.tailRoot); // rides the body, not the world
          const p = [
            [0, 0, 0],
            [-0.26, 0.0, 0],
            [-0.5, 0.14, 0.02],
            [-0.56, 0.38, 0.05],
            [-0.42, 0.52, 0.03],
            [-0.24, 0.46, -0.02],
            [-0.21, 0.3, -0.05],
          ];
          this.tube(this.tailRoot, p, 0.075, 0.03, this.darkMat, 6, 20);
        }
        pigEar(z, side) {
          const ear = new THREE.Group();
          ear.position.set(0, 0.57 * this.headSize, z);
          ear.rotation.x = side * 0.52;
          this.headRoot.add(ear);
          this.part(
            new THREE.ConeGeometry(0.3 * this.earSize, 0.62 * this.earSize, 4),
            this.darkMat,
            ear,
          );
          this.ears.push({ group: ear, side, baseZ: ear.rotation.z });
        }
        update(t, dt) {
          super.update(t, dt);
          for (const ear of this.ears)
            ear.group.rotation.z =
              ear.baseZ + Math.sin(t * 1.5 + this.phase + ear.side) * 0.045;
          if (this.tailRoot)
            this.tailRoot.rotation.z =
              Math.sin(t * 1.3 + this.phase) * (this.initialized ? 0.12 : 0.03);
        }
      }

      /* ---------------------------- SHEEP -------------------------------- */

          const legs = [
            [0.62 * this.L, 0.38 * this.W, Math.PI * 1.5],
            [-0.62 * this.L, 0.38 * this.W, 0],
            [0.62 * this.L, -0.38 * this.W, Math.PI * 0.5],
            [-0.62 * this.L, -0.38 * this.W, Math.PI],
          ];
          for (const [x, z, phase] of legs)
            this.leg({
              x,
              z,
              upper,
              lower,
              upperRadius: 0.095,
              lowerRadius: 0.075,
              upperMat: this.skin,
              lowerMat: this.skin,
              hoofMat: this.hoof,
              hoofSize: 0.14,
              phase,
            });
        }
        sheepEar(side) {
          const ear = new THREE.Group();
          ear.position.set(
            -0.1,
            0.36 * this.headSize,
            side * 0.42 * this.headSize,
          );
          ear.rotation.x = 0.08;
          ear.rotation.y = side * 1.2;
          this.headRoot.add(ear);
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.skin,
            ear,
            [0, -0.04, 0],
            [0, 0, 0],
            [0.34 * this.earSize, 0.18 * this.earSize, 0.14 * this.earSize],
          );
          const innerHalfDepth =
            CONFIG.surface.sheepEarInnerDepth * this.earSize;
          const innerCenterZ =
            0.14 * this.earSize -
            innerHalfDepth +
            CONFIG.surface.sheepEarInnerGap;
          this.overlay(
            new THREE.IcosahedronGeometry(1, 1),
            this.innerMat,
            ear,
            [0.03, -0.04, side * innerCenterZ],
            [0, 0, 0],
            [0.22 * this.earSize, 0.09 * this.earSize, innerHalfDepth],
          );
          this.ears.push({
            group: ear,
            side,
            baseX: ear.rotation.x,
            baseY: ear.rotation.y,
            baseZ: ear.rotation.z,
          });
        }
        update(t, dt) {
          super.update(t, dt);
          const ears = this.ears;
          for (let ei = 0; ei < ears.length; ei++) {
            const ear = ears[ei];
            ear.group.rotation.set(
              ear.baseX + Math.sin(t * 1.15 + this.phase + ear.side) * 0.035,
              ear.baseY + Math.sin(t * 1.35 + this.phase) * 0.025,
              ear.baseZ +
                ear.side * Math.sin(t * 1.55 + this.phase + ear.side) * 0.035,
            );
          }
          if (this.headRoot)
            this.headRoot.rotation.y =
              Math.sin(t * 0.9 + this.phase) *
              (this.initialized ? 0.03 : 0.018);
        }
      }

          this.part(
            new THREE.IcosahedronGeometry(1, 2),
            this.fur,
            this.bodyRoot,
            [0, 1.03, 0],
            [0, 0, 0],
            [1.02 * this.L, 0.84 * this.H, 0.64 * this.W],
          );
          this.part(
            new THREE.IcosahedronGeometry(1, 1),
            this.furLight,
            this.bodyRoot,
            [0.53 * this.L, 1.05 * this.H, 0],
            [0, 0, 0],
            [0.56 * this.L, 0.67 * this.H, 0.57 * this.W],
          );

          this.headRoot = new THREE.Group();
          this.headRoot.position.set(0.8 * this.L, 1.5 * this.H, 0);
          this.group.add(this.headRoot);
          this.part(
            new THREE.IcosahedronGeometry(0.53, 1),
            this.fur,
            this.headRoot,
            [0, 0, 0],
            [0, 0, 0],
            [1.02 * this.headSize, 1.0 * this.headSize, 0.9 * this.headSize],
          );
          this.part(
            new THREE.IcosahedronGeometry(0.25, 1),
            this.furLight,
            this.headRoot,
            [0.39 * this.headSize, -0.12 * this.headSize, 0],
            [0, 0, 0],

            new THREE.SphereGeometry(0.07, 7, 5),
            this.eyeMat,
            this.headRoot,
            [0.28 * this.headSize, 0.14 * this.headSize, 0.32 * this.headSize],
            [0, 0, 0],
            [1, 1, 0.72],
