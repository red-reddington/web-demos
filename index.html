<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Red Reddington's Web Demos</title>

    <link rel="icon" type="image/png" href="RRfavicon.png" />
    <link rel="apple-touch-icon" href="RRfavicon.png" />
    <link rel="apple-touch-icon" type="image/png" href="RRfavicon.png" />

    <meta
      name="apple-mobile-web-app-title"
      content="Red Reddington's Web Demos"
    />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/x-icon" href="RRfavicon.ico" />

    <style>
      :root {
        --bg: #0f1115;
        --panel: #1a1d24;
        --panel-hover: #20242d;
        --border: #2a2f3a;
        --text: #e6e6e6;
        --muted: #9aa3b2;
        --accent: #4c8bf5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      header {
        text-align: center;
        padding: 40px 20px 10px;
      }

      header img {
        width: 32px;
        height: 32px;
        vertical-align: middle;
        mix-blend-mode: lighten;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        display: inline-block;
        vertical-align: middle;
      }

      p {
        opacity: 0.65;
        margin-top: 8px;
      }

      .toolbar {
        width: min(1200px, calc(100dvw - 40px));
        margin: 0 auto;
        padding: 0 20px;
      }

      .search-bar {
        display: flex;
        justify-content: center;
        margin: 20px 0;
      }

      .search-bar input {
        width: min(500px, 100%);
        padding: 12px 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }

      .search-bar input:focus {
        border-color: var(--accent);
      }

      .filters,
      .sort-bar {
        text-align: center;
      }

      .filters {
        margin: 20px 0;
      }

      .sort-bar {
        margin: 10px 0 20px;
      }

      .filters button,
      .sort-bar button {
        margin: 5px;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #1f232b;
        color: #ccc;
        cursor: pointer;
        opacity: 0.55;

        transition:
          opacity 0.15s ease,
          background 0.15s ease,
          transform 0.1s ease;
      }

      .filters button.active,
      .sort-bar button.active {
        background: var(--accent);
        color: white;
        opacity: 1;
        border-color: var(--accent);
      }

      .filters button:hover:not(.active),
      .sort-bar button:hover:not(.active) {
        opacity: 0.8;
        background: #262b34;
      }

      .filters button:active,
      .sort-bar button:active {
        transform: scale(0.96);
      }

      .filters button:focus-visible,
      .sort-bar button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ------------------------- */
      /* RANGE SLIDER */
      /* ------------------------- */

      .range-container {
        max-width: min(300px, 80dvw);
        margin: 0 auto 20px;
        text-align: center;
      }

      .range-labels {
        font-size: 12px;
        opacity: 0.6;
      }

      .range-slider {
        position: relative;
        height: 32px;
      }

      .range-slider input[type="range"] {
        position: absolute;
        width: 100%;
        height: 32px;
        top: 50%;
        left: 0;
        margin: 2px 0;
        transform: translateY(-50%);
        pointer-events: none;
        -webkit-appearance: none;
        background: none;
      }

      .range-slider input[type="range"]::-webkit-slider-thumb {
        pointer-events: all;
        width: 16px;
        height: 16px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        -webkit-appearance: none;
      }

      .range-slider .track {
        position: absolute;
        height: 4px;
        background: #333;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        border-radius: 2px;
      }

      .range-slider .range {
        position: absolute;
        height: 4px;
        background: var(--accent);
        top: 50%;
        transform: translateY(-50%);
        border-radius: 2px;
      }

      /* ------------------------- */
      /* GRID */
      /* ------------------------- */

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

        gap: 16px;

        width: min(1200px, calc(100dvw - 40px));

        margin: 0 auto;

        padding: 20px;
      }

      /* ------------------------- */
      /* CARD */
      /* ------------------------- */

      .card {
        display: block;
        overflow: hidden;

        border-radius: 12px;

        background: var(--panel);

        color: inherit;
        text-decoration: none;

        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }

      .card:hover {
        transform: translateY(-4px);

        background: var(--panel-hover);

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .thumb {
        position: relative;

        width: 100%;

        aspect-ratio: 16 / 9;

        overflow: hidden;

        background: #2a2f3a;

        border-bottom: 1px solid #0003;
      }

      .thumb img,
      .thumb video {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;
      }

      .thumb img {
        z-index: 1;
      }

      .thumb video {
        z-index: 2;

        opacity: 0;

        transition: opacity 0.2s ease;

        pointer-events: none;

        will-change: opacity;
      }

      .card.preview-active {
        box-shadow: 0 0 0 4px rgba(76, 139, 245, 0.75) !important;
        z-index: 10;
        transition: box-shadow 80ms ease-out;
      }

      .card.preview-active .thumb video {
        opacity: 1;
      }

      .content {
        padding: 12px;
      }

      .tag {
        font-size: 11px;
        opacity: 0.5;
        margin-bottom: 6px;
      }

      .title {
        font-weight: 600;
        margin-bottom: 6px;
      }

      .desc {
        font-size: 13px;
        opacity: 0.7;
      }

      .date {
        font-size: 11px;
        opacity: 0.45;
        margin-top: 8px;
      }

      .empty {
        text-align: center;
        opacity: 0.6;
        padding: 50px 20px;
      }

      .footer {
        text-align: center;
        margin: 40px 0;
        opacity: 0.6;
        font-size: 14px;
      }

      .footer a {
        color: inherit;
        text-decoration: none;
      }

      .footer a:hover {
        opacity: 0.8;
      }

      @media (hover: none) {
        .card:hover {
          transform: none;
          box-shadow: none;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <img src="RRfavicon.png" alt="Red Reddington" />

      <h1>Red Reddington's Web Demos</h1>

      <p>
        High-performance Three.js demos, browser AI experiments, procedural
        systems, and games
      </p>
    </header>

    <div class="toolbar">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search demos..."
          autocomplete="off"
        />
      </div>

      <div class="filters" id="filters"></div>

      <div class="sort-bar" id="sortBar">
        <button data-sort="az">A–Z</button>
        <button data-sort="za">Z–A</button>
        <button data-sort="date-desc">Newest</button>
        <button data-sort="date-asc">Oldest</button>
      </div>

      <div class="range-container">
        <div class="range-labels" id="rangeLabel"></div>

        <div class="range-slider">
          <div class="track"></div>

          <div class="range" id="rangeFill"></div>

          <input type="range" id="minDate" step="1" />
          <input type="range" id="maxDate" step="1" />
        </div>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <footer class="footer">
      <a href="https://github.com/red-reddington/web-demos" target="_blank">
        Source code on GitHub
      </a>
    </footer>

    <script>
      /*************************
       * STATE
       *************************/

      const state = {
        filter: "All",
        sort: "date-desc",
        search: "",
        minDate: null,
        maxDate: null,
      };

      let allDemos = [];
      let sortedDates = [];
      let categoryTotals = {};

      /*************************
       * DOM CACHE
       *************************/

      const DOM = {
        grid: document.getElementById("grid"),
        filters: document.getElementById("filters"),

        sortButtons: [...document.querySelectorAll("#sortBar button")],

        searchInput: document.getElementById("searchInput"),

        minDate: document.getElementById("minDate"),
        maxDate: document.getElementById("maxDate"),

        rangeFill: document.getElementById("rangeFill"),
      };

      /*************************
       * URL SYNC
       *************************/

      let urlQueued = false;

      function scheduleURLUpdate() {
        if (urlQueued) return;

        urlQueued = true;

        requestAnimationFrame(() => {
          updateURL();
          urlQueued = false;
        });
      }

      function setState(patch, { skipURL = false } = {}) {
        Object.assign(state, patch);

        normalizeState();

        render();

        if (!skipURL) {
          scheduleURLUpdate();
        }
      }

      /*************************
       * URL HELPERS
       *************************/

      function getParam(name, fallback = "") {
        const params = new URLSearchParams(window.location.search);

        return params.get(name) || fallback;
      }

      function updateURL() {
        const params = new URLSearchParams();

        if (state.filter !== "All") {
          params.set("category", state.filter);
        }

        if (state.sort !== "date-desc") {
          params.set("sort", state.sort);
        }

        if (state.search) {
          params.set("search", state.search);
        }

        if (state.minDate !== sortedDates[0]) {
          params.set("minDate", formatDateParam(state.minDate));
        }

        if (state.maxDate !== sortedDates.at(-1)) {
          params.set("maxDate", formatDateParam(state.maxDate));
        }

        const query = params.toString();

        const url = query ? `${location.pathname}?${query}` : location.pathname;

        history.replaceState(null, "", url);
      }

      /*************************
       * DATE HELPERS
       *************************/

      function formatDateParam(ts) {
        const d = new Date(ts);

        return (
          d.getFullYear() +
          String(d.getMonth() + 1).padStart(2, "0") +
          String(d.getDate()).padStart(2, "0")
        );
      }

      function parseDateParam(value, endOfDay = false) {
        if (!value || !/^\d{8}$/.test(value)) {
          return null;
        }

        const y = +value.slice(0, 4);
        const m = +value.slice(4, 6) - 1;
        const d = +value.slice(6, 8);

        return new Date(
          y,
          m,
          d,
          endOfDay ? 23 : 0,
          endOfDay ? 59 : 0,
          endOfDay ? 59 : 0,
          endOfDay ? 999 : 0,
        ).getTime();
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
      }

      /*************************
       * SORT HELPERS
       *************************/

      const sortFn = {
        az: (a, b) => a.title.localeCompare(b.title),

        za: (a, b) => b.title.localeCompare(a.title),

        "date-asc": (a, b) => a.ts - b.ts,

        "date-desc": (a, b) => b.ts - a.ts,
      };

      /*************************
       * PREVIEW MANAGER
       *************************/

      const PreviewManager = {
        activeVideo: null,

        stop() {
          if (this.activeVideo) {
            this.activeVideo.pause();
            this.activeVideo = null;
          }
          document.querySelectorAll(".card.preview-active").forEach((card) => {
            card.classList.remove("preview-active");
          });
        },

        activate(video, card) {
          // ← pass card too
          if (this.activeVideo && this.activeVideo !== video) {
            this.stop();
          }

          this.activeVideo = video;

          // Ensure the card gets the class (in case stop() removed it)
          if (card) {
            card.classList.add("preview-active");
            void card.offsetWidth; // force repaint
          }

          video.play().catch(() => {});
        },
      };

      /*************************
       * HOVER + TOUCH PREVIEW HANDLERS
       *************************/

      const hoverTimers = new WeakMap();

      function attachPreviewHandlers(card, video, preview) {
        if (!video || !preview) return;

        let loaded = false;

        // Desktop Hover
        const startPreview = async () => {
          if (!loaded) {
            video.src = `./thumbs/${preview}`;
            loaded = true;
          }
          try {
            await video.play();
            card.classList.add("preview-active");
          } catch (e) {}
        };

        const stopPreview = () => {
          card.classList.remove("preview-active");
          video.pause();
        };

        card.addEventListener("mouseenter", () => {
          const timer = setTimeout(startPreview, 120);
          hoverTimers.set(card, timer);
        });

        card.addEventListener("mouseleave", () => {
          const timer = hoverTimers.get(card);
          if (timer) clearTimeout(timer);
          stopPreview();
        });

        // === MOBILE TOUCH ===
        card.addEventListener(
          "touchstart",
          (e) => {
            if (PreviewManager.activeVideo === video) {
              // Second tap → navigate
              PreviewManager.stop();
              return;
            }

            // First touch → preview
            e.preventDefault();
            e.stopImmediatePropagation();

            if (!video.src) {
              video.src = `./thumbs/${preview}`;
            }

            card.classList.add("preview-active");
            PreviewManager.activate(video, card);
          },
          { passive: false },
        );
      }

      // ==================== GLOBAL SETUP ====================

      // Touch outside cards
      document.addEventListener(
        "touchstart",
        (e) => {
          if (!e.target.closest(".card")) {
            PreviewManager.stop();
          }
        },
        { passive: true },
      );

      // Visibility cleanup (background tab, etc.)
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") PreviewManager.stop();
      });
      window.addEventListener("pagehide", () => PreviewManager.stop());

      // Intersection Observer
      const previewObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              const video = entry.target.querySelector("video");
              if (video && PreviewManager.activeVideo === video) {
                PreviewManager.stop();
              }
            }
          });
        },
        { threshold: 0.18, rootMargin: "-20px 0px" },
      );

      function observeCards() {
        previewObserver.disconnect();
        document
          .querySelectorAll(".card")
          .forEach((card) => previewObserver.observe(card));
      }

      function normalizeState() {
        if (!sortedDates.length) return;

        if (!sortFn[state.sort]) {
          state.sort = "date-desc";
        }

        const categories = new Set(["All", ...allDemos.map((d) => d.category)]);

        if (!categories.has(state.filter)) {
          state.filter = "All";
        }

        if (state.minDate == null) {
          state.minDate = sortedDates[0];
        }

        if (state.maxDate == null) {
          state.maxDate = sortedDates.at(-1);
        }

        state.minDate = Math.max(state.minDate, sortedDates[0]);

        state.maxDate = Math.min(state.maxDate, sortedDates.at(-1));
      }

      function hydrateStateFromURL() {
        state.filter = getParam("category", "All");

        state.sort = getParam("sort", "date-desc");

        state.search = getParam("search", "").trim();

        const min = parseDateParam(getParam("minDate"));

        const max = parseDateParam(getParam("maxDate"), true);

        state.minDate = min ?? sortedDates[0];

        state.maxDate = max ?? sortedDates.at(-1);
      }

      /*************************
       * INIT
       *************************/

      fetch("./data.json")
        .then((r) => {
          if (!r.ok) {
            throw new Error("Failed to load data.json");
          }

          return r.json();
        })

        .then((demos) => {
          allDemos = demos.map((d) => {
            const ts = new Date(d.created).getTime();

            return {
              ...d,

              ts,

              _hay: (
                d.title +
                d.description +
                d.category +
                d.folder
              ).toLowerCase(),
            };
          });

          if (!allDemos.length) {
            throw new Error("No demos in data.json");
          }

          sortedDates = allDemos.map((d) => d.ts).sort((a, b) => a - b);

          categoryTotals = allDemos.reduce(
            (acc, d) => {
              acc.All++;

              acc[d.category] = (acc[d.category] || 0) + 1;

              return acc;
            },
            { All: 0 },
          );

          hydrateStateFromURL();

          normalizeState();

          setupUI();

          render();

          scheduleURLUpdate();
        })

        .catch((err) => {
          console.error(err);

          DOM.grid.innerHTML = `
                  <div class="empty">
                    Failed to load demos.
                    Please try again later.
                  </div>
                `;
        });

      /*************************
       * UI SETUP
       *************************/

      function setupUI() {
        setupSearch();
        setupFilters();
        setupSort();
        setupDateSlider();
      }

      function setupSearch() {
        const input = DOM.searchInput;

        if (!input) return;

        input.value = state.search;

        input.addEventListener("input", () => {
          setState({
            search: input.value.trim(),
          });
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            input.value = "";

            setState({
              search: "",
            });
          }
        });
      }

      function setupFilters() {
        const el = DOM.filters;

        if (!el) return;

        const cats = ["All", ...new Set(allDemos.map((d) => d.category))].sort(
          (a, b) => (a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b)),
        );

        for (const cat of cats) {
          const btn = document.createElement("button");

          btn.dataset.cat = cat;

          btn.textContent = cat;

          btn.type = "button";

          btn.onclick = () => {
            setState({
              filter: cat,
            });
          };

          el.appendChild(btn);
        }
      }

      function setupSort() {
        for (const btn of DOM.sortButtons) {
          btn.onclick = () => {
            const sort = btn.dataset.sort;

            if (!sortFn[sort]) return;

            setState({
              sort,
            });
          };
        }
      }

      function setupDateSlider() {
        const min = DOM.minDate;
        const max = DOM.maxDate;
        const fill = DOM.rangeFill;

        if (!min || !max || !fill || !sortedDates.length) {
          return;
        }

        min.min = max.min = 0;

        min.max = max.max = sortedDates.length - 1;

        let minIdx = 0;
        let maxIdx = sortedDates.length - 1;

        for (let i = 0; i < sortedDates.length; i++) {
          if (sortedDates[i] >= state.minDate) {
            minIdx = i;
            break;
          }
        }

        for (let i = sortedDates.length - 1; i >= 0; i--) {
          if (sortedDates[i] <= state.maxDate) {
            maxIdx = i;
            break;
          }
        }

        min.value = String(minIdx);
        max.value = String(maxIdx);

        const update = () => {
          let a = +min.value;
          let b = +max.value;

          if (a > b) {
            [a, b] = [b, a];
          }

          setState(
            {
              minDate: sortedDates[a],
              maxDate: sortedDates[b],
            },
            { skipURL: true },
          );

          const span = sortedDates.length - 1 || 1;

          const left = (a / span) * 100;

          const width = ((b - a) / span) * 100;

          fill.style.left = left + "%";

          fill.style.width = width + "%";

          scheduleURLUpdate();
        };

        min.oninput = update;
        max.oninput = update;

        update();
      }

      /*************************
       * FILTER + SORT
       *************************/

      let memo = {
        key: "",
        result: [],
      };

      function getFilteredSorted() {
        const key = JSON.stringify({
          filter: state.filter,
          sort: state.sort,
          search: state.search,
          minDate: state.minDate,
          maxDate: state.maxDate,
        });

        if (memo.key === key) {
          return memo.result;
        }

        const search = state.search.toLowerCase();

        let result = allDemos.filter((d) => {
          const matchesCat =
            state.filter === "All" || d.category === state.filter;

          const matchesDate = d.ts >= state.minDate && d.ts <= state.maxDate;

          const matchesSearch = !search || d._hay.includes(search);

          return matchesCat && matchesDate && matchesSearch;
        });

        result.sort(sortFn[state.sort] || sortFn["date-desc"]);

        memo = {
          key,
          result,
        };

        return result;
      }

      /*************************
       * RENDER
       *************************/

      function render() {
        const grid = DOM.grid;

        if (!grid) return;

        // Clean slate on every render (critical for correctness)
        PreviewManager.stop();

        const filtered = getFilteredSorted();

        updateFilterLabels(filtered.length);

        updateSortUI();

        if (!filtered.length) {
          grid.innerHTML = `
                  <div class="empty">
                    No demos found.
                  </div>
                `;

          return;
        }

        const frag = document.createDocumentFragment();

        for (const demo of filtered) {
          const card = document.createElement("a");

          card.className = "card";

          card.href = `./${demo.folder}/index.html`;

          card.target = "_blank";

          card.rel = "noopener noreferrer";

          const thumb = document.createElement("div");

          thumb.className = "thumb";

          if (demo.thumb) {
            const img = document.createElement("img");

            img.loading = "lazy";

            img.decoding = "async";

            img.src = `./thumbs/${demo.thumb}`;

            img.alt = demo.title;

            thumb.appendChild(img);
          }

          let video = null;

          if (demo.preview) {
            video = document.createElement("video");

            video.muted = true;

            video.loop = true;

            video.playsInline = true;

            video.preload = "none";

            video.disablePictureInPicture = true;

            video.setAttribute("muted", "");

            video.setAttribute("playsinline", "");

            thumb.appendChild(video);
          }

          const content = document.createElement("div");

          content.className = "content";

          content.innerHTML = `
                  <div class="tag">
                    ${demo.category}
                  </div>

                  <div class="title">
                    ${demo.title}
                  </div>

                  <div class="desc">
                    ${demo.description}
                  </div>

                  <div class="date">
                    ${formatDate(demo.created)}
                  </div>
                `;

          card.appendChild(thumb);

          card.appendChild(content);

          frag.appendChild(card);

          if (video && demo.preview) {
            attachPreviewHandlers(card, video, demo.preview);
          }
        }

        grid.innerHTML = "";

        grid.appendChild(frag);

        // Re-observe after DOM update
        observeCards();
      }

      function updateSortUI() {
        for (const btn of DOM.sortButtons) {
          btn.classList.toggle("active", btn.dataset.sort === state.sort);
        }
      }

      function updateFilterLabels(currentCount = null) {
        const buttons = DOM.filters.querySelectorAll("button");

        for (const b of buttons) {
          const cat = b.dataset.cat;

          const total = categoryTotals[cat] ?? 0;

          let label = cat;

          if (total) {
            if (currentCount != null && cat === state.filter) {
              label += ` (${currentCount}/${total})`;
            } else {
              label += ` (${total})`;
            }
          }

          if (b.textContent !== label) {
            b.textContent = label;
          }

          b.classList.toggle("active", cat === state.filter);
        }
      }
    </script>
  </body>
</html>
