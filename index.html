<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Reddington's Web Demos</title>

    <link rel="icon" type="image/png" href="RRfavicon.png" />
    <link rel="apple-touch-icon" href="RRfavicon.png" />
    <link rel="apple-touch-icon" type="image/png" href="RRfavicon.png" />
    <meta
      name="apple-mobile-web-app-title"
      content="Red Reddington's Web Demos"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="RRfavicon.ico" />

    <style>
      :root {
        --bg: #0f1115;
        --surface: #1a1d24;
        --surface-hover: #20242d;
        --border: #2a2f3a;
        --text: #e6e6e6;
        --muted: #9aa3b2;
        --accent: #4c8bf5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overflow-y: scroll;
      }
      header {
        text-align: center;
        padding: 40px 20px 16px;
      }
      header img {
        width: 32px;
        height: 32px;
        vertical-align: middle;
        mix-blend-mode: lighten;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        display: inline-block;
        vertical-align: middle;
        margin-left: 8px;
      }
      header p {
        color: var(--muted);
        margin-top: 8px;
        font-size: 15px;
      }
      .toolbar {
        width: min(1200px, 100% - 40px);
        margin: 0 auto 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .search-input {
        width: min(500px, 100%);
        padding: 12px 20px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
      }
      .btn {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #1f232b;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.1s ease;
      }
      .btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .range-module {
        width: min(320px, 90vw);
        text-align: center;
        position: relative;
        height: 56px;
      }
      .range-labels {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        font-variant-numeric: tabular-nums;
        min-height: 16px;
      }
      .range-track-container {
        position: relative;
        height: 28px;
        display: flex;
        align-items: center;
      }
      .range-track-bg {
        position: absolute;
        width: 100%;
        height: 4px;
        background: var(--border);
        border-radius: 999px;
      }
      .range-track-fill {
        position: absolute;
        height: 4px;
        background: var(--accent);
        border-radius: 999px;
        will-change: left, width;
      }
      .range-input {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 2px;
        left: 0;
        margin: 0;
        -webkit-appearance: none;
        background: transparent;
        pointer-events: none;
      }
      .range-input::-webkit-slider-thumb {
        pointer-events: auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        border: 3px solid var(--accent);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        cursor: grab;
        -webkit-appearance: none;
        margin-top: -9px;
        position: relative;
        z-index: 10;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        width: min(1200px, 100% - 40px);
        margin: 0 auto;
        padding: 0 0 60px 0;
      }
      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
        font-size: 15px;
        display: none;
      }
      .empty-state.visible {
        display: block;
      }
      .card {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        content-visibility: auto;
        contain-intrinsic-size: 320px;
        transform: translateZ(0);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        background: var(--surface-hover);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      }
      .card-visual {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: var(--border);
        border-bottom: 1px solid rgba(0, 0, 0, 0.2);
      }
      .card-visual img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      .card-visual video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      .card.is-previewing video {
        opacity: 1;
      }
      .card.is-previewing {
        box-shadow: 0 0 0 3px rgba(76, 139, 245, 0.6);
        z-index: 10;
      }
      .card.target-highlight {
        animation: pulse 2s cubic-bezier(0.23, 1, 0.32, 1);
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(76, 139, 245, 0.8);
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      .card-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card-meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .card-cat {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }
      .card-date {
        font-size: 11px;
        color: var(--muted);
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 6px;
        line-height: 1.3;
      }
      .card-desc {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 16px;
        flex-grow: 1;
      }
      .related-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
      }
      .related-pill {
        font-size: 11px;
        padding: 4px 10px;
        background: rgba(76, 139, 245, 0.1);
        color: var(--accent);
        border-radius: 999px;
        border: 1px solid rgba(76, 139, 245, 0.2);
        transition: all 0.1s ease;
      }
      .related-pill:hover {
        background: var(--accent);
        color: #fff;
      }
      footer {
        text-align: center;
        padding: 40px 0;
        color: var(--muted);
        font-size: 14px;
      }
      footer a {
        color: inherit;
        text-decoration: none;
      }
      @media (hover: none) and (pointer: coarse) {
        .card:hover {
          transform: none;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="RRfavicon.png" alt="" aria-hidden="true" />
      <h1>Red Reddington's Web Demos</h1>
      <p>
        High-performance Three.js demos, browser AI experiments, procedural
        systems, and games
      </p>
    </header>

    <nav class="toolbar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search demos..."
        autocomplete="off"
      />
      <div class="btn-group" id="filterGroup"></div>
      <div class="btn-group" id="sortGroup">
        <button class="btn active" data-sort="date-desc">Newest</button>
        <button class="btn" data-sort="date-asc">Oldest</button>
        <button class="btn" data-sort="az">A–Z</button>
        <button class="btn" data-sort="za">Z–A</button>
      </div>
      <div class="range-module">
        <div class="range-labels" id="rangeLabel">Loading timeline...</div>
        <div class="range-track-container">
          <div class="range-track-bg"></div>
          <div class="range-track-fill" id="rangeFill"></div>
          <input type="range" class="range-input" id="minDate" step="1" />
          <input type="range" class="range-input" id="maxDate" step="1" />
        </div>
      </div>
    </nav>

    <main>
      <div class="grid" id="grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state">
        No results found. Try adjusting your search terms or filters.
      </div>
    </main>

    <footer>
      <a href="https://github.com/red-reddington/web-demos" target="_blank"
        >Source code on GitHub</a
      >
    </footer>

    <template id="card-tpl">
      <a class="card" target="_blank" rel="noopener noreferrer">
        <div class="card-visual">
          <img loading="lazy" decoding="async" src="" alt="" />
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="card-cat"></span><span class="card-date"></span>
          </div>
          <h2 class="card-title"></h2>
          <p class="card-desc"></p>
          <div class="related-group"></div>
        </div>
      </a>
    </template>

    <script>
      "use strict";

      const DOM = {
        grid: document.getElementById("grid"),
        emptyState: document.getElementById("emptyState"),
        searchInput: document.getElementById("searchInput"),
        filterGroup: document.getElementById("filterGroup"),
        sortGroup: document.getElementById("sortGroup"),
        minDate: document.getElementById("minDate"),
        maxDate: document.getElementById("maxDate"),
        rangeFill: document.getElementById("rangeFill"),
        rangeLabel: document.getElementById("rangeLabel"),
        cardTpl: document.getElementById("card-tpl").content,
      };

      const fmtDate = new Intl.DateTimeFormat("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric",
      });
      const debounce = (fn, delay) => {
        let t;
        return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...a), delay);
        };
      };
      const toYMD = (ts) => {
        const d = new Date(ts);
        return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, "0")}${String(d.getUTCDate()).padStart(2, "0")}`;
      };
      const fromYMD = (ymd) => {
        if (!ymd || ymd.length !== 8) return NaN;
        return Date.UTC(
          +ymd.slice(0, 4),
          +ymd.slice(4, 6) - 1,
          +ymd.slice(6, 8),
        );
      };

      const Sorters = {
        az: (a, b) => a.title.localeCompare(b.title),
        za: (a, b) => b.title.localeCompare(a.title),
        "date-asc": (a, b) => a.ts - b.ts,
        "date-desc": (a, b) => b.ts - a.ts,
      };
      const db = [];
      const dbMap = new Map();
      const sortedDates = [];
      const catCounts = new Map([["All", 0]]);
      const resultsPool = [];
      let lastFilterKey = "";
      let cachedView = [];
      let renderPending = false;
      let lastFilterState = null;

      const state = {
        filter: "All",
        sort: "date-desc",
        search: "",
        minIdx: 0,
        maxIdx: 0,
        set(updates) {
          let changed = false;
          for (const k in updates) {
            if (this[k] !== updates[k]) {
              this[k] = updates[k];
              changed = true;
            }
          }
          if (changed) {
            debouncedURLSync();
            if (!renderPending) {
              renderPending = true;
              requestAnimationFrame(render);
            }
          }
        },
      };

      const VideoController = {
        timer: null,
        play(card, src) {
          const visual = card.querySelector(".card-visual");
          let vid = visual.querySelector("video");
          if (!vid) {
            vid = document.createElement("video");
            vid.muted = vid.loop = vid.playsInline = true;
            visual.appendChild(vid);
          }
          if (!vid.src) vid.src = `./thumbs/${src}`;
          card.classList.add("is-previewing");
          vid.play().catch(() => {});
        },
        stop(card) {
          card.classList.remove("is-previewing");
          const vid = card.querySelector("video");
          if (vid) vid.pause();
        },
      };

      function computeView() {
        const key = `${state.filter}|${state.sort}|${state.search}|${state.minIdx}|${state.maxIdx}`;
        if (key === lastFilterKey) return cachedView;
        const query = state.search.toLowerCase().trim();
        resultsPool.length = 0;
        for (let i = 0; i < db.length; i++) {
          const item = db[i];
          if (
            (state.filter === "All" || item.category === state.filter) &&
            item.ts >= sortedDates[state.minIdx] &&
            item.ts <= sortedDates[state.maxIdx] &&
            (!query || item._haystack.includes(query))
          ) {
            resultsPool.push(item);
          }
        }
        resultsPool.sort(Sorters[state.sort]);
        lastFilterKey = key;
        cachedView = resultsPool;
        return resultsPool;
      }

      function render() {
        renderPending = false;
        const view = computeView();
        let ref = DOM.grid.firstElementChild;
        for (let i = 0; i < view.length; i++) {
          const node = view[i].el;
          if (node.parentNode !== DOM.grid || node !== ref)
            DOM.grid.insertBefore(node, ref);
          ref = node.nextElementSibling || null;
        }
        let node = ref;
        while (node) {
          const next = node.nextElementSibling;
          DOM.grid.removeChild(node);
          node = next;
        }
        DOM.emptyState.classList.toggle("visible", view.length === 0);
        updateUIControls(view.length);
      }

      function updateUIControls(matchCount) {
        DOM.filterGroup.querySelectorAll(".btn").forEach((btn) => {
          const cat = btn.dataset.cat;
          const total = catCounts.get(cat);
          const active = cat === state.filter;
          btn.classList.toggle("active", active);
          btn.textContent =
            active && total
              ? `${cat} (${matchCount}/${total})`
              : total
                ? `${cat} (${total})`
                : cat;
        });
        DOM.sortGroup
          .querySelectorAll(".btn")
          .forEach((btn) =>
            btn.classList.toggle("active", btn.dataset.sort === state.sort),
          );
        if (sortedDates.length) {
          const span = sortedDates.length - 1 || 1;
          DOM.rangeFill.style.left = `${(state.minIdx / span) * 100}%`;
          DOM.rangeFill.style.width = `${((state.maxIdx - state.minIdx) / span) * 100}%`;
          DOM.rangeLabel.textContent = `${fmtDate.format(sortedDates[state.minIdx])} — ${fmtDate.format(sortedDates[state.maxIdx])}`;
          DOM.minDate.value = state.minIdx;
          DOM.maxDate.value = state.maxIdx;
        }
      }

      const debouncedURLSync = debounce(() => {
        const p = new URLSearchParams();
        if (state.filter !== "All") p.set("category", state.filter);
        if (state.sort !== "date-desc") p.set("sort", state.sort);
        if (state.search) p.set("search", state.search);
        if (state.minIdx > 0) p.set("start", toYMD(sortedDates[state.minIdx]));
        if (state.maxIdx < sortedDates.length - 1)
          p.set("end", toYMD(sortedDates[state.maxIdx]));
        history.replaceState(
          null,
          "",
          p.toString() ? `?${p.toString()}` : location.pathname,
        );
      }, 250);

      function hydrateURL() {
        const p = new URLSearchParams(location.search);
        let minIdx = 0,
          maxIdx = sortedDates.length - 1;
        const minTs = fromYMD(p.get("start"));
        const maxTs = fromYMD(p.get("end"));
        if (!isNaN(minTs))
          minIdx = Math.max(
            0,
            sortedDates.findIndex((ts) => ts >= minTs),
          );
        if (!isNaN(maxTs)) {
          const idx = sortedDates.findLastIndex((ts) => ts <= maxTs);
          maxIdx = idx === -1 ? sortedDates.length - 1 : idx;
        }
        state.set({
          filter: catCounts.has(p.get("category")) ? p.get("category") : "All",
          sort: Sorters[p.get("sort")] ? p.get("sort") : "date-desc",
          search: p.get("search") || "",
          minIdx,
          maxIdx,
        });
        DOM.searchInput.value = state.search;
      }

      function setupEvents() {
        // Ensure videos stop when the user leaves the tab
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            document.querySelectorAll(".card.is-previewing").forEach((c) => {
              VideoController.stop(c);
            });
          }
        });

        // Desktop Hover
        DOM.grid.addEventListener("mouseover", (e) => {
          const card = e.target.closest(".card");
          if (!card || !card.dataset.preview) return;
          clearTimeout(VideoController.timer);
          VideoController.timer = setTimeout(
            () => VideoController.play(card, card.dataset.preview),
            140,
          );
        });

        DOM.grid.addEventListener("mouseout", (e) => {
          const card = e.target.closest(".card");
          if (!card) return;
          clearTimeout(VideoController.timer);
          if (!e.relatedTarget || !card.contains(e.relatedTarget))
            VideoController.stop(card);
        });

        // Mobile Touch Support
        DOM.grid.addEventListener(
          "touchstart",
          (e) => {
            // 1. Check if the user touched a "related-pill"
            const pill = e.target.closest(".related-pill");
            if (pill) {
              // If it's a pill, do nothing here and let the click handler take over.
              // We do NOT call e.preventDefault() so the native link behavior works.
              return;
            }

            // 2. Otherwise, look for the card
            const card = e.target.closest(".card");
            if (!card) return;

            // 3. If we are already previewing this card, allow the click to navigate
            if (card.classList.contains("is-previewing")) return;

            // 4. Otherwise, prevent default to stop instant navigation
            e.preventDefault();

            // 5. Cleanup other cards and play this one
            document
              .querySelectorAll(".card.is-previewing")
              .forEach((c) => VideoController.stop(c));

            if (card.dataset.preview) {
              VideoController.play(card, card.dataset.preview);
            }
          },
          { passive: false },
        );

        // Add a listener to close when touching empty space in the grid
        document.addEventListener("touchstart", (e) => {
          if (!e.target.closest(".card")) {
            document
              .querySelectorAll(".card.is-previewing")
              .forEach((c) => VideoController.stop(c));
          }
        });

        DOM.grid.addEventListener("click", (e) => {
          const pill = e.target.closest(".related-pill");
          if (pill) {
            e.preventDefault();
            e.stopPropagation();
            const targetItem = dbMap.get(pill.dataset.target);
            if (!targetItem || !targetItem.el) return;
            lastFilterState = {
              filter: state.filter,
              minIdx: state.minIdx,
              maxIdx: state.maxIdx,
              search: state.search,
            };
            state.set({
              filter: "All",
              minIdx: 0,
              maxIdx: sortedDates.length - 1,
              search: "",
            });
            setTimeout(() => {
              targetItem.el.scrollIntoView({
                behavior: "smooth",
                block: "center",
              });
              targetItem.el.classList.remove("target-highlight");
              void targetItem.el.offsetWidth;
              targetItem.el.classList.add("target-highlight");
            }, 30);
            showUndoToast();
          }
        });

        let activeToast = null;

        function showUndoToast() {
          if (activeToast) {
            activeToast.remove();
          }

          const toast = document.createElement("div");
          toast.style.cssText = `position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1d24; color:#fff; padding:10px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,0.6); font-size:14px; z-index:10000; display:flex; align-items:center; gap:12px; white-space:nowrap;`;
          toast.innerHTML = `Filters cleared to show related demo <button style="background:none; border:none; color:#4c8bf5; font-weight:600; cursor:pointer; padding:0 4px;">Undo</button>`;

          const cleanup = () => {
            clearTimeout(timer);
            if (activeToast === toast) {
              toast.remove();
              activeToast = null;
            }
          };

          const timer = setTimeout(cleanup, 7000);

          document.body.appendChild(toast);
          activeToast = toast;

          toast.querySelector("button").onclick = () => {
            if (lastFilterState) state.set(lastFilterState);
            cleanup();
          };
        }

        DOM.searchInput.addEventListener("input", (e) =>
          state.set({ search: e.target.value.trim() }),
        );
        DOM.filterGroup.addEventListener("click", (e) => {
          if (e.target.matches(".btn"))
            state.set({ filter: e.target.dataset.cat });
        });
        DOM.sortGroup.addEventListener("click", (e) => {
          if (e.target.matches(".btn"))
            state.set({ sort: e.target.dataset.sort });
        });
        const handleRange = () => {
          let a = +DOM.minDate.value,
            b = +DOM.maxDate.value;
          state.set({ minIdx: Math.min(a, b), maxIdx: Math.max(a, b) });
        };
        DOM.minDate.addEventListener("input", handleRange);
        DOM.maxDate.addEventListener("input", handleRange);
      }

      async function boot() {
        try {
          const res = await fetch("./data.json");
          if (!res.ok) throw new Error();
          const raw = await res.json();
          raw.forEach((d) => {
            d.ts = new Date(d.created).getTime();
            d._haystack = (
              d.title +
              d.description +
              d.category +
              d.folder
            ).toLowerCase();
            db.push(d);
            dbMap.set(d.folder, d);
            sortedDates.push(d.ts);
            catCounts.set(d.category, (catCounts.get(d.category) || 0) + 1);
            catCounts.set("All", catCounts.get("All") + 1);
          });
          sortedDates.sort((a, b) => a - b);
          DOM.minDate.max = DOM.maxDate.max = sortedDates.length - 1;

          db.forEach((item) => {
            const node = DOM.cardTpl.cloneNode(true);
            const card = node.querySelector(".card");
            card.href = `./${item.folder}/index.html`;
            if (item.preview) card.dataset.preview = item.preview;
            node.querySelector("img").src = `./thumbs/${item.thumb}`;
            node.querySelector(".card-cat").textContent = item.category;
            node.querySelector(".card-date").textContent = fmtDate.format(
              item.ts,
            );
            node.querySelector(".card-title").textContent = item.title;
            node.querySelector(".card-desc").textContent = item.description;
            if (item.related) {
              const group = node.querySelector(".related-group");
              item.related.forEach((id) => {
                const rel = dbMap.get(id);
                if (rel) {
                  const pill = document.createElement("button");
                  pill.className = "related-pill";
                  pill.textContent = rel.title;
                  pill.dataset.target = id;
                  group.appendChild(pill);
                }
              });
            }
            item.el = card;
            DOM.grid.appendChild(card);
          });

          const frag = document.createDocumentFragment();
          Array.from(catCounts.keys())
            .sort((a, b) =>
              a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b),
            )
            .forEach((cat) => {
              const btn = document.createElement("button");
              btn.className = "btn";
              btn.dataset.cat = cat;
              btn.textContent = cat;
              frag.appendChild(btn);
            });
          DOM.filterGroup.appendChild(frag);
          setupEvents();
          hydrateURL();
        } catch (e) {
          console.error(e);
          DOM.emptyState.classList.add("visible");
        }
      }
      boot();
    </script>
  </body>
</html>
