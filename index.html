<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Red Reddington's Web Demos</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
  }

  header {
    text-align: center;
    padding: 40px 20px 10px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
  }

  p {
    opacity: 0.6;
    margin-top: 8px;
  }

  .filters {
    text-align: center;
    margin: 20px 0;
  }

  .filters button {
    margin: 5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: #1f232b;
    color: #ccc;
    cursor: pointer;
  }

  .filters button.active {
    background: #4c8bf5;
    color: white;
  }

  /* --- Dual Range Slider --- */
  .range-container {
    max-width: 420px;
    margin: 0 auto 20px;
    text-align: center;
  }

  .range-labels {
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 6px;
  }

  .range-slider {
    position: relative;
    height: 32px;
  }

  .range-slider input[type="range"] {
    position: absolute;
    width: 100%;
    height: 32px;
    top: 50%;
	left: 0;
	margin: 2px 0;
    transform: translateY(-50%);
    pointer-events: none;
    -webkit-appearance: none;
    background: none;
  }

  .range-slider input[type="range"]::-webkit-slider-thumb {
    pointer-events: all;
    width: 16px;
    height: 16px;
    margin-top: -6px;
    border-radius: 50%;
    background: #4c8bf5;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .range-slider .track {
    position: absolute;
    height: 4px;
    background: #333;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    border-radius: 2px;
  }

  .range-slider .range {
    position: absolute;
    height: 4px;
    background: #4c8bf5;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
  }

  .card {
    background: #1a1d24;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .thumb {
    width: 100%;
    height: 150px;
    background: #2a2f3a;
	display: none; /* will enable after thumbs are added */
  }

  .content {
    padding: 12px;
  }

  .tag {
    font-size: 11px;
    opacity: 0.5;
    margin-bottom: 6px;
  }

  .title {
    font-weight: 600;
    margin-bottom: 6px;
  }

  .desc {
    font-size: 13px;
    opacity: 0.7;
  }

  .date {
    font-size: 11px;
    opacity: 0.45;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Red Reddington's Web Demos</h1>
  <p>High-performance Three.js experiments, procedural systems, and games</p>
</header>

<div class="filters" id="filters"></div>

<div class="range-container">
  <div class="range-labels" id="rangeLabel"></div>
  <div class="range-slider">
    <div class="track"></div>
    <div class="range" id="rangeFill"></div>
    <input type="range" id="minDate" step="1">
    <input type="range" id="maxDate" step="1">
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
let allDemos = [];
let currentFilter = "All";
let minDate = null;
let maxDate = null;

fetch('./data.json')
  .then(res => res.json())
  .then(demos => {
    allDemos = demos.map(d => ({
      ...d,
      ts: new Date(d.created).getTime()
    }));

    setupFilters();
    setupDateSlider();
    render();
  });

function setupFilters() {
  const filtersEl = document.getElementById('filters');
  const categories = ["All", ...new Set(allDemos.map(d => d.category))];

  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.dataset.cat = cat;
    btn.onclick = () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = cat;
      render();
    };
    filtersEl.appendChild(btn);
  });

  updateFilterLabels();
}

function updateFilterLabels(shownCount = null) {
  const buttons = document.querySelectorAll('.filters button');

  const total = allDemos.length;

  const counts = {
    "All": total,
  };

  for (const d of allDemos) {
    counts[d.category] = (counts[d.category] || 0) + 1;
  }

  buttons.forEach(btn => {
    const cat = btn.dataset.cat;
    const base = counts[cat];

    if (shownCount && cat === currentFilter) {
      btn.textContent = `${cat} (${shownCount}/${base})`;
    } else {
      btn.textContent = `${cat} (${base})`;
    }
  });
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', {
    month: 'short',
    day: 'numeric',
    year: 'numeric'
  });
}

function setupDateSlider() {
  const timestamps = allDemos.map(d => d.ts);
  const sorted = [...timestamps].sort((a,b)=>a-b);

  minDate = sorted[0];
  maxDate = sorted[sorted.length - 1];

  const minInput = document.getElementById('minDate');
  const maxInput = document.getElementById('maxDate');
  const rangeFill = document.getElementById('rangeFill');
  const label = document.getElementById('rangeLabel');

  minInput.min = maxInput.min = 0;
  minInput.max = maxInput.max = sorted.length - 1;

  minInput.value = 0;
  maxInput.value = sorted.length - 1;

  function updateSlider() {
    let minIdx = parseInt(minInput.value);
    let maxIdx = parseInt(maxInput.value);

    if (minIdx > maxIdx) {
      [minIdx, maxIdx] = [maxIdx, minIdx];
      minInput.value = minIdx;
      maxInput.value = maxIdx;
    }

    minDate = sorted[minIdx];
    maxDate = sorted[maxIdx];

    const pctMin = (minIdx / (sorted.length - 1)) * 100;
    const pctMax = (maxIdx / (sorted.length - 1)) * 100;

    rangeFill.style.left = pctMin + "%";
    rangeFill.style.width = (pctMax - pctMin) + "%";

    label.textContent =
      formatDate(new Date(minDate).toISOString()) +
      " — " +
      formatDate(new Date(maxDate).toISOString());

    render();
  }

  minInput.oninput = updateSlider;
  maxInput.oninput = updateSlider;

  updateSlider();
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = allDemos.filter(d =>
    (currentFilter === "All" || d.category === currentFilter) &&
    d.ts >= minDate &&
    d.ts <= maxDate
  );

  updateFilterLabels(filtered.length);

  filtered.forEach(demo => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `./${demo.folder}/index.html`;
    a.target = "_blank";

    a.innerHTML = `
      <div class="thumb"></div>
      <div class="content">
        <div class="tag">${demo.category}</div>
        <div class="title">${demo.title}</div>
        <div class="desc">${demo.description}</div>
        <div class="date">${formatDate(demo.created)}</div>
      </div>
    `;

    grid.appendChild(a);
  });
}
</script>

</body>
</html>
