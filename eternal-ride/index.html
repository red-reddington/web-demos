          gltfLoader.load(
            url,
            (gltf) => resolve(gltf.scene),
            undefined,
            (err) => {
              console.warn("GLB failed:", url, err);
              resolve(null);
            },
          );
        });
      }

      // ============================================================================
      // ============================================================================
      // COCKPIT DASHBOARD HUD (textured plane on the bike's dashboard)
      // ----------------------------------------------------------------------------
      // Renders speed, throttle, in-world clock, trip distance from origin, and an ODO of lifetime distance to a Canvas2D blitted to a small plane in front of the rider.
      //
      // Hot-path discipline:
      // - Canvas redraw gated to REDRAW_HZ.
      // - Change-detection on quantized values: if NOTHING displayed has changed since the last draw, no work is done -- not even the fill. So cruising at constant speed the HUD costs ~zero.
      // - Fixed-width padded strings so glyphs don't reflow as numbers grow.
      // - texture.needsUpdate is only set when a draw actually happened.
      // ============================================================================
      class BikeHUD {
        constructor(parent) {
          const cfg = CONFIG.HUD;

          // Canvas aspect roughly matches the plane (66:54 ≈ 1.22). 512×416 ≈ 1.231 — close enough that glyphs don't visibly stretch.
          this.canvas = document.createElement("canvas");
          this.canvas.width = 512;
          this.canvas.height = 416;
          this.ctx = this.canvas.getContext("2d");

          this.texture = new CanvasTexture(this.canvas);
          this.texture.minFilter = LinearFilter;
          this.texture.magFilter = LinearFilter;
          this.texture.colorSpace = SRGBColorSpace;

          // polygonOffset wins the depth fight with the bezel without millimeter-precise positioning.
          const mat = new MeshBasicMaterial({
            map: this.texture,
            transparent: false,
            depthWrite: true,
            side: DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: -2,
            polygonOffsetUnits: -2,
          });

          const geo = new PlaneGeometry(cfg.WIDTH, cfg.HEIGHT);
          this.mesh = new Mesh(geo, mat);
          this.mesh.position.set(cfg.POS.x, cfg.POS.y, cfg.POS.z);
          this.mesh.rotation.x = cfg.TILT_X;
          parent.add(this.mesh);

          this._refreshT = 0;
          this._refreshInterval = 1 / cfg.REDRAW_HZ;
          this._lastSpeed = -1;
          this._lastOdoTenth = -1;
          this._lastThrottleTwentieth = -1;
          this._lastTimeKey = -1;
          this._lastRunSec = -1;
          this._lastDistMeters = -1;
          this._lastAltDeci = -10000;
          this._lastCardinal = "";

          // Reusable status object -- avoids the per-redraw object literal.
          this._status = {
            timeStr: "--:--",
            runStr: "0:00",
            odoStr: "0.0km",
            distStr: "0m",
            altStr: "+0.0m",
            cardinal: "N",
          };

          // First-frame draw so the HUD shows something while stationary.
          this._draw(0, 0, this._status);
          this.texture.needsUpdate = true;
        }

        /**
         * Hot-path entry.
         * Caller passes raw scalars; all string formatting happens INSIDE the 10 Hz / change-detection gate, so this method allocates zero strings on a steady cruise.
         *
         * @param dt seconds since last frame
         * @param speedMs current speed in m/s
         * @param odoMeters integrated path length, meters
         * @param distMetersRaw straight-line distance from origin, meters
         * @param altMetersRaw ground altitude under bike, meters
         * @param headingRad bike heading, radians
         * @param gameTimeDate the live game-clock Date instance (reused)
         * @param runSeconds session time, seconds
         */
        update(
          dt,
          speedMs,
          odoMeters,
          distMetersRaw,
          altMetersRaw,
          headingRad,
          gameTimeDate,
          runSeconds,
        ) {
          this._refreshT += dt;
          if (this._refreshT < this._refreshInterval) return;
          this._refreshT = 0;

          // ---- Quantization for change-detection ----
          // Each value is quantized to the precision actually shown so a 0.001 m/s jitter doesn't trigger a redraw.
          // The cardinal is a string but it's interned to a fixed 8-element array, so the identity check below is a pointer compare (free).
          const speedKmh = Math.round(speedMs * 3.6);
          const odoTenth = Math.floor(odoMeters / 100); // 0.1 km units
          const throttleFrac = clamp(speedMs / CONFIG.BIKE.SPEED_MAX, 0, 1);
          const throttleTwentieth = Math.floor(throttleFrac * 20);
          const distMeters = Math.round(distMetersRaw); // 1 m precision
          const altDeci = Math.round(altMetersRaw * 10); // 0.1 m
          const cardinal = BikeHUD._cardinalFromHeading(headingRad);
          const tHours = gameTimeDate.getHours();
          const tMins = gameTimeDate.getMinutes();
          const timeKey = tHours * 60 + tMins; // integer, fast compare
          const runSecQ = runSeconds | 0; // 1 s precision

          if (
            speedKmh === this._lastSpeed &&
            odoTenth === this._lastOdoTenth &&
            throttleTwentieth === this._lastThrottleTwentieth &&
            timeKey === this._lastTimeKey &&
            runSecQ === this._lastRunSec &&
            distMeters === this._lastDistMeters &&
            altDeci === this._lastAltDeci &&
            cardinal === this._lastCardinal
          )
            return;

          this._lastSpeed = speedKmh;
          this._lastOdoTenth = odoTenth;
          this._lastThrottleTwentieth = throttleTwentieth;
          this._lastTimeKey = timeKey;
          this._lastRunSec = runSecQ;
          this._lastDistMeters = distMeters;
          this._lastAltDeci = altDeci;
          this._lastCardinal = cardinal;

          // ---- Format strings (only when something actually changed) ----
          // Reuse the same status object across redraws to skip the {x: y, ...} literal allocation; only field writes here.
          const s = this._status;
          // Time hh:mm. padStart returns a fresh string but only on redraw, so under steady-state it's free.
          s.timeStr = `${String(tHours).padStart(2, "0")}:${String(tMins).padStart(2, "0")}`;
          // Run time m:ss.
          const rm = (runSecQ / 60) | 0;
          const rs = runSecQ - rm * 60;
          s.runStr = `${rm}:${String(rs).padStart(2, "0")}`;
          s.odoStr = `${(odoTenth / 10).toFixed(1)}km`;
          // DIST auto-switches at 1 km: "999m" or "1.2km". 1 m precision under 1km, 0.1 km precision above.
          s.distStr =
            distMeters < 1000
              ? `${distMeters}m`
              : `${(distMeters / 1000).toFixed(1)}km`;
          s.cardinal = cardinal;
          // No leading "+" on altitude -- real instrument clusters show a bare number, with "-" only when negative. toFixed() already emits the "-" itself, so a plain format is all that's needed.
          s.altStr = `${(altDeci / 10).toFixed(1)}m`;

          this._draw(speedKmh, throttleFrac, s);
          this.texture.needsUpdate = true;
        }

        /**
         * 8-sector cardinal from heading in radians.
         * Convention (matches Bike.fx/fz): heading 0 = north (-Z), π/2 = east (+X), π = south (+Z), 3π/2 = west (-X).
         */
        static _cardinalFromHeading(headingRad) {
          const TAU = Math.PI * 2;
          const a = ((headingRad % TAU) + TAU) % TAU; // 0..2π
          // Shift by half a sector so each cardinal is centered on its slice.
          const sector = Math.floor((a + Math.PI / 8) / (Math.PI / 4)) % 8;
          return ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][sector];
        }

        _draw(speedKmh, throttleFrac, status) {
          const ctx = this.ctx;
          const w = this.canvas.width;
          const h = this.canvas.height;

          // Dark backlit-LCD backdrop.
          ctx.fillStyle = "#0a0d12";
          ctx.fillRect(0, 0, w, h);

          // ---- Speed (dominant) ----
          ctx.fillStyle = "#7fffd4";
          ctx.font = "bold 180px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const speedY = h * 0.24;
          const speedText = String(speedKmh).padStart(3, " ");
          ctx.fillText(speedText, w / 2 + 60, speedY);

          const speedW = ctx.measureText(speedText).width;
          ctx.fillStyle = "#3a5060";
          ctx.font = "600 22px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "left";
          ctx.fillText("KMH", w / 2 + speedW / 2 + 60, speedY + 48);

          // ---- Throttle bar ----
          const barX = 40;
          const barY = h * 0.46;
          const barW = w - 80;
          const barH = 22;

          ctx.fillStyle = "#15191f";
          ctx.fillRect(barX, barY, barW, barH);

          ctx.strokeStyle = "#2a3038";
          ctx.lineWidth = 2;
          ctx.strokeRect(barX, barY, barW, barH);

          if (throttleFrac > 0) {
            const filled = Math.floor(barW * throttleFrac);
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0.0, "#3eff7a");
            grad.addColorStop(0.6, "#ffd633");
            grad.addColorStop(1.0, "#ff4040");
            ctx.fillStyle = grad;
            ctx.fillRect(barX + 2, barY + 2, filled - 4, barH - 4);
          }

          // ---- Layout split (65% left / 35% right) ----
          const splitX = w * 0.65;

          const leftLabelX = 30;
          const leftValueX = splitX - 14;

          const rightLabelX = splitX + 14;
          const rightValueX = w - 30;

          const rowYs = [h * 0.74, h * 0.91];

          const labelFont = "600 20px 'SF Mono', 'Menlo', monospace";
          const valueFont = "bold 38px 'SF Mono', 'Menlo', monospace";

          const drawCell = (label, value, x_label, x_value, y) => {
            const offset = 14; // tweak this (10–18 usually feels right)

            // ---- LABEL (slightly up) ----
            ctx.fillStyle = "#3a5060";
            ctx.font = labelFont;
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(label, x_label, y - offset);

            // ---- VALUE (slightly down) ----
            ctx.fillStyle = "#cfd8e0";
            ctx.font = valueFont;
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillText(value, x_value, y + offset);
          };

          // ---- Dividers ----
          ctx.strokeStyle = "#161b22";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(20, h * 0.66);
          ctx.lineTo(w - 20, h * 0.66);

          ctx.moveTo(20, h * 0.82);
          ctx.lineTo(w - 20, h * 0.82);

          // vertical split line
          ctx.moveTo(w * 0.65, h * 0.66);
          ctx.lineTo(w * 0.65, h * 0.96);

          ctx.stroke();

          // LEFT (65%)
          drawCell("ODO", status.odoStr, leftLabelX, leftValueX, rowYs[0]);
          drawCell("DST", status.distStr, leftLabelX, leftValueX, rowYs[1]);

          // RIGHT (35%)
          drawCell("RUN", status.runStr, rightLabelX, rightValueX, rowYs[0]);
          drawCell("ALT", status.altStr, rightLabelX, rightValueX, rowYs[1]);

          // ---- Heading pill ----
          const pillH = 78;
          ctx.font = "bold 68px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const headingText = status.cardinal || "N";
          const textW = ctx.measureText(headingText).width;
          const pillW = Math.max(72, textW + 40);

          const pillX = 14;
          const pillY = 14;

          ctx.fillStyle = "#0f1a1c";
          ctx.beginPath();
          ctx.roundRect(pillX, pillY, pillW, pillH, 10);
          ctx.fill();

          ctx.strokeStyle = "#7fffd4";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#7fffd4";
          ctx.fillText(headingText, pillX + pillW / 2, pillY + pillH / 2 + 1);

          // ---- TIME under pill ----
          ctx.fillStyle = "#cfd8e0";
          ctx.font = "bold 38px 'SF Mono', 'Menlo', monospace";
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";

          const timeY = speedY + 48;
          ctx.fillText(status.timeStr, pillX + 4, timeY);
        }
      }

      // ============================================================================
      // BIKE — FIXED POSE + CLAMPED ROLL
      // ============================================================================
      class Bike {
        constructor() {
          this.worldX = 149597870700; // 1 AU Astronomical Unit = avg Earth-Sun distance in metres
          this.worldY = 0;
          this.worldZ = 0;
          this.heading = 0;
          this.turnRate = 0;

          // Cache directional vectors
          this.fx = 0;
          this.fz = -1;
          this.rx = 1;
          this.rz = 0;

          this.speed = CONFIG.BIKE.SPEED_INIT;
          this.lean = 0;
          this.targetLean = 0;
          this.pitch = 0;
          this.roll = 0;
          this.fireCooldown = 0;
          this.frontY = 0;
          this.rearY = 0;
          this.sideY = 0;
          // Water transition state. _waterBlend eases 0..1 (0 = on terrain, 1 = on water); _displayAltY is the bike's true surface height for the HUD (clamped to the waterline when on water).
          // Both smoothed so crossing the shoreline settles over a fraction of a second rather than snapping for a couple of jarring frames.
          this._waterBlend = 0;
          this._displayAltY = 0;

          this.group = new Group();
          this._poseGroup = new Group();
          this.group.add(this._poseGroup);
          this._modelHolder = new Group();
          this._poseGroup.add(this._modelHolder);

          // Headlight rig and HUD are attached to _poseGroup so they bob/lean with the bike's body rather than floating relative to the world.
          this._buildHeadlight();
          this.hud = new BikeHUD(this._poseGroup);

          // Default to day mode. The Game's day/night orchestrator flips this.
          this._isNight = false;
          this.setNightMode(false);
        }

        /**
         * Headlight = lens disc + two stacked additive glow billboards + two volumetric beam cones (inner sharp, outer halo) + a real SpotLight that contributes lighting to the ground + a small reticle Sprite floating where the spot/beam point.
         *
         * Performance: cones use a custom additive shader (no scene-light sampling) and are frustumCulled=false so they pay a fixed cost.
         * The beam material's `discard` for alpha < 0.003 keeps overdraw down.
         */
        _buildHeadlight() {
          // ---- Lens disc (the bright spot at the headlight aperture) ----
          const headlightMat = new MeshBasicMaterial({
            color: 0xffffcc,
            transparent: true,
            depthWrite: false,
          });
          const lens = new Mesh(new CircleGeometry(0.1, 16), headlightMat);
          lens.position.set(0, 0.7, -1.0);
          lens.rotation.y = Math.PI;
          this._poseGroup.add(lens);
          this._headlightMat = headlightMat;

          // ---- Glow halo: two additive billboards stacked behind the lens ----
          const glowTex = Bike._makeGlowTexture();
          const glowInner = new Mesh(
            new PlaneGeometry(0.5, 0.5),
            new MeshBasicMaterial({
              map: glowTex,
              color: 0xffeebb,
              transparent: true,
              blending: AdditiveBlending,
              depthWrite: false,
            }),
          );
          glowInner.position.set(0, 0.31, -0.72);
          glowInner.renderOrder = 5;
          this._poseGroup.add(glowInner);
          this._glowInner = glowInner;

          const glowOuter = new Mesh(
            new PlaneGeometry(1.6, 1.6),
            new MeshBasicMaterial({
              map: glowTex,
              color: 0xffd680,
              transparent: true,
              blending: AdditiveBlending,
              depthWrite: false,
              opacity: 0.6,
            }),
          );
          glowOuter.position.set(0, 0.31, -0.71);
          glowOuter.renderOrder = 4;
          this._poseGroup.add(glowOuter);
          this._glowOuter = glowOuter;

          // ---- Volumetric beam cones ---- Inner cone gives the sharp bright spine; outer gives the soft halo.
          // Apex at origin (translate + rotate the geometry once at build).
          const _makeBeamCone = (length, endRadius, segments) => {
            const g = new ConeGeometry(endRadius, length, segments, 1, true);
            g.translate(0, length / 2, 0);
            g.rotateX(Math.PI / 2);
            return g;
          };

          // Beam shader: length-fade + grazing-angle-fade so the geometric cone silhouette disappears and the mesh reads as airborne glow.
          const _beamMaterial = (color, length, headPow, edgePow) =>
            new ShaderMaterial({
              uniforms: {
                uColor: { value: new Color(color) },
                uIntensity: { value: 0.0 },
                uLen: { value: length },
                uHeadPow: { value: headPow },
                uEdgePow: { value: edgePow },
              },
              vertexShader: `
                varying vec3 vLocal;
                varying vec3 vViewDir;
                void main() {
                  vLocal = position;
                  vec4 wp = modelMatrix * vec4(position, 1.0);
                  vViewDir = normalize(cameraPosition - wp.xyz);
                  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
              `,
              fragmentShader: `
                uniform vec3 uColor;
                uniform float uIntensity;
                uniform float uLen;
                uniform float uHeadPow;
                uniform float uEdgePow;
                varying vec3 vLocal;
                varying vec3 vViewDir;
                void main() {
                  float t = clamp(-vLocal.z / uLen, 0.0, 1.0);
                  float lengthFade = pow(1.0 - t, uHeadPow);
                  vec3 outwardNormal = normalize(vec3(vLocal.x, vLocal.y, 0.0));
                  float edgeFade = pow(abs(dot(outwardNormal, vViewDir)), uEdgePow);
                  edgeFade = mix(1.0, edgeFade, t);
                  float nearFade = smoothstep(0.02, 0.12, t);
                  float a = lengthFade * edgeFade * nearFade * uIntensity;
                  if (a < 0.003) discard;
                  vec3 col = mix(uColor, vec3(1.0), lengthFade * 0.35);
                  gl_FragColor = vec4(col, a);
                }
              `,
              transparent: true,
              depthWrite: false,
              blending: AdditiveBlending,
              side: FrontSide,
            });

          const OUTER_LEN = 30,
            OUTER_R = 5.5;
          const beamOuter = new Mesh(
            _makeBeamCone(OUTER_LEN, OUTER_R, 28),
            _beamMaterial(0xffd680, OUTER_LEN, 1.6, 1.4),
          );
          // Slight forward offset stops the cone from starting inside the bike (prevents the "engulfing" artifact when the camera is near the apex).
          beamOuter.position.set(0, 0.4, -0.7);
          beamOuter.rotation.x = -0.04;
          beamOuter.frustumCulled = false;
          beamOuter.renderOrder = 5;
          this._poseGroup.add(beamOuter);
          this._beamOuter = beamOuter;

          const INNER_LEN = 22,
            INNER_R = 1.6;
          const beamInner = new Mesh(
            _makeBeamCone(INNER_LEN, INNER_R, 24),
            _beamMaterial(0xfff7d6, INNER_LEN, 1.0, 0.9),
          );
          beamInner.position.set(0, 0.4, -0.7);
          beamInner.rotation.x = -0.04;
          beamInner.frustumCulled = false;
          beamInner.renderOrder = 6;
          this._poseGroup.add(beamInner);
          this._beamInner = beamInner;

          // ---- SpotLight (the actual lighting contribution) ---- Visual cones are the VFX; this SpotLight is what lights the ground.
          const spot = new SpotLight(
            0xffeebb,
            0, // intensity set by setNightMode
            60, // distance
            MathUtils.degToRad(26), // angle
            0.7, // penumbra
            0.4, // decay (gentle; physical 2.0 reads too dim)
          );
          spot.position.set(0, 0.4, -0.7);
          spot.target.position.set(0, -0.4, -30.0);
          spot.castShadow = false;
          this._poseGroup.add(spot);
          this._poseGroup.add(spot.target);
          this._headlightSpot = spot;

          // ---- Reticle ----
          // The reticle is the GUN's aim cursor, not a headlight indicator -- the weapon fires day and night, so the reticle is ALWAYS visible, not gated by setNightMode.
          // It rides the headlight-aim target because the gun and the headlight converge on the same point.
          const crossTex = new CanvasTexture(Bike._createCrosshairCanvas());
          crossTex.minFilter = LinearFilter;
          crossTex.magFilter = LinearFilter;
          const crossMat = new SpriteMaterial({
            map: crossTex,
            transparent: true,
            depthTest: false,
          });
          this._reticle = new Sprite(crossMat);
          this._reticle.scale.set(1.2, 1.2, 1);
          this._reticle.position.set(0, 0.4, -30.0);
          this._reticle.visible = true;
          this._reticle.renderOrder = 20;
          this._poseGroup.add(this._reticle);
          this._lightTargetX = 0;
          this._lightTargetY = 0.4;
          this._lightTargetZ = -30;
        }

        /**
         * Switch the full headlight rig between day-off and night-on states. All toggles are uniform/property writes (no allocation, no rebuild).
         */
        setNightMode(isNight) {
          this._isNight = isNight;
          if (isNight) {
            this._headlightMat.color.setHex(0xffffff);
            this._headlightMat.opacity = 1.0;
            this._glowInner.material.opacity = 1.0;
            this._glowInner.visible = true;
            this._glowOuter.material.opacity = 0.65;
            this._glowOuter.visible = true;
            this._headlightSpot.intensity = 9;
            this._beamInner.visible = true;
            this._beamInner.material.uniforms.uIntensity.value = 1.6;
            this._beamOuter.visible = true;
            this._beamOuter.material.uniforms.uIntensity.value = 0.45;
          } else {
            this._headlightMat.color.setHex(0xffffaa);
            this._headlightMat.opacity = 0.85;
            this._glowInner.visible = false;
            this._glowOuter.visible = false;
            this._headlightSpot.intensity = 0;
            this._beamInner.visible = false;
            this._beamInner.material.uniforms.uIntensity.value = 0;
            this._beamOuter.visible = false;
            this._beamOuter.material.uniforms.uIntensity.value = 0;
          }
        }

        static _createCrosshairCanvas() {
          // High-visibility reticle: every bright element is drawn on top of a darker, wider "halo" pass.
          // Against a bright sunset sky the dark halo provides contrast; against dark terrain the bright core does.
          // This is why a single flat-red crosshair "disappeared at sunset" -- red on orange is near-zero contrast.
          // The two-pass stroke fixes it for ANY background without needing to know the background color.
          const canvas = document.createElement("canvas");
          canvas.width = 128;
          canvas.height = 128;
          const ctx = canvas.getContext("2d");
          const C = 64; // center
          const R = 40; // ring radius

          ctx.lineCap = "round";

          // Draw helper: a shape stroked twice -- dark halo, then bright core.
          const ring = (lw, style) => {
            ctx.strokeStyle = style;
            ctx.lineWidth = lw;
            ctx.beginPath();
            ctx.arc(C, C, R, 0, Math.PI * 2);
            ctx.stroke();
          };
          // Four tick marks (N/E/S/W) from just outside the ring inward.
          const ticks = (lw, style, inset) => {
            ctx.strokeStyle = style;
            ctx.lineWidth = lw;
            const o = R + 12; // outer
            const inn = R - inset; // inner
            ctx.beginPath();
            // vertical
            ctx.moveTo(C, C - o);
            ctx.lineTo(C, C - inn);
            ctx.moveTo(C, C + o);
            ctx.lineTo(C, C + inn);
            // horizontal
            ctx.moveTo(C - o, C);
            ctx.lineTo(C - inn, C);
            ctx.moveTo(C + o, C);
            ctx.lineTo(C + inn, C);
            ctx.stroke();
          };

          // ---- Halo pass (dark, wide) ----
          ctx.globalAlpha = 0.85;
          ring(9, "rgba(0,0,0,0.9)");
          ticks(9, "rgba(0,0,0,0.9)", 8);
          // center dot halo
          ctx.fillStyle = "rgba(0,0,0,0.9)";
          ctx.beginPath();
          ctx.arc(C, C, 6, 0, Math.PI * 2);
          ctx.fill();

          // ---- Core pass (bright, narrow) ----
          ctx.globalAlpha = 1.0;
          ring(4, "#ff5050");
          ticks(4, "#ff5050", 8);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(C, C, 3, 0, Math.PI * 2);
          ctx.fill();

          return canvas;
        }

        static _makeGlowTexture() {
          if (Bike._cachedGlowTex) return Bike._cachedGlowTex;
          const size = 128;
          const c = document.createElement("canvas");
          c.width = c.height = size;
          const g = c.getContext("2d");
          const grad = g.createRadialGradient(
            size / 2,
            size / 2,
            0,
            size / 2,
            size / 2,
            size / 2,
          );
          grad.addColorStop(0.0, "rgba(255,255,255,1.0)");
          grad.addColorStop(0.25, "rgba(255,240,200,0.65)");
          grad.addColorStop(0.6, "rgba(255,200,100,0.18)");
          grad.addColorStop(1.0, "rgba(255,180, 60,0.0)");
          g.fillStyle = grad;
          g.fillRect(0, 0, size, size);
          const tex = new CanvasTexture(c);
          tex.minFilter = LinearFilter;
          tex.magFilter = LinearFilter;
          tex.premultiplyAlpha = true; // iOS linearly-filters straight-alpha canvas textures by bleeding color into the transparent rim; the gradient's colored zero-alpha stops then sample as specks on the magnified additive outer glow. Premultiplied upload makes the rim filter cleanly.
          tex.colorSpace = SRGBColorSpace;
          Bike._cachedGlowTex = tex;
          return tex;
        }

        setModel(subtree) {
          while (this._modelHolder.children.length > 0) {
            this._modelHolder.remove(this._modelHolder.children[0]);
          }
          this._modelHolder.add(subtree);
          this._modelHolder.scale.setScalar(CONFIG.BIKE.MODEL_SCALE);
          this._modelHolder.position.y = CONFIG.BIKE.MODEL_Y_OFFSET;
          this._modelHolder.rotation.y = CONFIG.BIKE.HEADING_CORRECTION;
          subtree.traverse((node) => {
            if (node.isMesh) {
              node.castShadow = false;
              if (node.material && node.material.name === "Mat_Body") {
                node.material = node.material.clone();
                node.material.color.setHex(CONFIG.BIKE.BODY_COLOR);
              }
            }
          });
        }

        attachRider(riderSrc) {
          const rider = riderSrc.clone(true);
          rider.position.set(
            CONFIG.RIDER.POS.x,
            CONFIG.RIDER.POS.y,
            CONFIG.RIDER.POS.z,
          );
          rider.rotation.set(
            CONFIG.RIDER.ROT.x,
            CONFIG.RIDER.ROT.y,
            CONFIG.RIDER.ROT.z,
          );
          rider.scale.setScalar(CONFIG.RIDER.SCALE);
          rider.traverse((node) => {
            if (node.isMesh) {
              // Rider casts shadow (silhouette on the ground sells the sense that the bike+rider is actually IN the world).
              node.castShadow = false;
              node.receiveShadow = false;
              node.frustumCulled = false;
              const mats = Array.isArray(node.material)
                ? node.material
                : [node.material];
              for (const m of mats) if (m) m.depthWrite = true;
            }
          });
          this._modelHolder.add(rider);
        }

        sampleTerrainPose(dt) {
          const halfWB = CONFIG.BIKE.WHEELBASE / 2;
          const halfT = CONFIG.BIKE.HALF_TRACK;

          this.frontY = sampleTerrain(
            this.worldX + this.fx * halfWB,
            this.worldZ + this.fz * halfWB,
          );
          this.rearY = sampleTerrain(
            this.worldX - this.fx * halfWB,
            this.worldZ - this.fz * halfWB,
          );
          this.sideY = sampleTerrain(
            this.worldX + this.rx * halfT,
            this.worldZ + this.rz * halfT,
          );

          // ---- Water-level clamp (smoothed) ----
          // Where terrain dips below the waterline, the bike rides ON the water surface, not down into a submerged trench.
          //
          // frontY/rearY/sideY are RAW sample values, freshly overwritten by sampleTerrain() every frame -- easing them toward the clamp never converges, since each frame resets the value being eased.
          // The smoothing must act on a PERSISTENT field that carries across frames.
          // So:
          // - Clamp the wheel samples HARD (so pitch/roll, derived from them, treat the water as a flat surface -- a clamped sample is just "the ground is the waterline", no easing needed there).
          // - Smooth only worldY, its own persistent field, easing toward the clamped centre height. That removes the crossing jolt -- the vertical position settles instead of snapping.
          const waterY = CONFIG.WATER.LEVEL;
          const _dt = dt || 0.016;
          const k = 1 - Math.exp(-_dt / 0.09); // ~0.09 s settle, fps-independent

          // Hard-clamp the wheel samples up to the waterline.
          if (this.frontY < waterY) this.frontY = waterY;
          if (this.rearY < waterY) this.rearY = waterY;
          if (this.sideY < waterY) this.sideY = waterY;

          // Target centre height from the (now clamped) front/rear samples.
          const targetWorldY = (this.frontY + this.rearY) * 0.5;
          // Ease the PERSISTENT worldY toward it -- this is the only place smoothing belongs, and it carries across frames so it converges.
          this.worldY += (targetWorldY - this.worldY) * k;

          // Cache the TRUE centre ground height (un-clamped) -- the weapon muzzle math needs real terrain, not the water-clamped value.
          this.cachedCenterGroundY = sampleTerrain(this.worldX, this.worldZ);

          // Water blend factor (0 = on terrain, 1 = on water), itself eased.
          // Drives the HUD altitude readout and the camera's water-aware bob.
          // Target is 1 when the true centre ground is below the waterline.
          const onWaterTarget = this.cachedCenterGroundY < waterY ? 1 : 0;
          this._waterBlend += (onWaterTarget - this._waterBlend) * k;
          // HUD altitude: the bike's actual surface height.
          // On water that is the waterline (~0), NOT the submerged terrain -- blend between the true ground height and the water level by the same factor.
          this._displayAltY =
            this.cachedCenterGroundY +
            (waterY - this.cachedCenterGroundY) * this._waterBlend;

          // ---- Pitch & roll: smoothed ----
          // The wheel-sample clamp (max with the waterline) is continuous but NOT smooth -- it has a corner.
          // When a wheel crosses the waterline its value's RATE snaps from "following the terrain slope" to "flat". pitch/roll are built from DIFFERENCES of those samples, so a corner in the samples is a STEP in pitch/roll; hard-assigning them every frame would put that step straight onto the visible bike.
          //
          // So: compute pitch/roll TARGETS, then ease the persistent this.pitch / this.roll toward them -- exactly as this.lean is eased a few lines below.
          // This smooths the clamp corner (and any sharp terrain) without affecting anything physical; pitch/roll are purely visual (they drive _poseGroup.rotation).
          const pitchTarget = Math.atan2(
            this.frontY - this.rearY,
            CONFIG.BIKE.WHEELBASE,
          );
          let rollTarget = Math.atan2(targetWorldY - this.sideY, halfT);
          rollTarget = clamp(
            rollTarget,
            -CONFIG.BIKE.MAX_ROLL,
            CONFIG.BIKE.MAX_ROLL,
          );
          // Same exponential-ease factor k used for worldY above.
          this.pitch += (pitchTarget - this.pitch) * k;
          this.roll += (rollTarget - this.roll) * k;
        }

        update(dt, inputs) {
          const speedFrac =
            (this.speed - CONFIG.BIKE.SPEED_MIN) /
            (CONFIG.BIKE.SPEED_MAX - CONFIG.BIKE.SPEED_MIN);
          const speedFactor =
            CONFIG.BIKE.TURN_RATE_MIN_FACTOR +
            (1 - CONFIG.BIKE.TURN_RATE_MIN_FACTOR) * clamp(speedFrac, 0, 1);
          const targetTurnRate =
            inputs.steer * CONFIG.BIKE.TURN_RATE_MAX * speedFactor;
          const tk = 1 - Math.exp(-CONFIG.BIKE.TURN_LERP * dt);
          this.turnRate += (targetTurnRate - this.turnRate) * tk;
          this.heading += this.turnRate * dt;

          // Calculate trig exactly once per frame here
          this.fx = Math.sin(this.heading);
          this.fz = -Math.cos(this.heading);
          this.rx = Math.cos(this.heading);
          this.rz = Math.sin(this.heading);

          const throttle = clamp(inputs.throttle, -1, 1);
          if (throttle > 0) this.speed += CONFIG.BIKE.ACCEL * throttle * dt;
          else if (throttle < 0)
            this.speed += CONFIG.BIKE.DECEL * throttle * dt;
          this.speed -= CONFIG.BIKE.DRAG * dt;

          // ---- Water deceleration ---------------------------------------------
          // _waterBlend is 0 on land, eases to 1 on open water.
          // On water the bike should slow to a cruising cap of SPEED_MAX * SPEED_MAX_MULT -- but that slowdown must be a FORCE, not a clamp.
          // A hard clamp to the lower cap snaps speed down in a single frame the instant the cap drops below current speed; easing the cap only changes how fast that snap tracks, not that it snaps.
          // So instead: while the bike is above the water cap, apply extra drag proportional to how far over the cap it is.
          // That is a real deceleration -- rate, not teleport -- so coming off full speed onto water bleeds down over ~a second instead of instantly.
          // WATER.DRAG sets how hard it brakes.
          const wb = this._waterBlend;
          if (wb > 0) {
            const waterCap =
              CONFIG.BIKE.SPEED_MAX * CONFIG.WATER.SPEED_MAX_MULT;
            if (this.speed > waterCap) {
              // Brake force scales with the overspeed and with _waterBlend, so it fades in smoothly at the shoreline and eases out as speed approaches the cap (no hard landing at waterCap).
              const over = this.speed - waterCap;
              this.speed -= CONFIG.WATER.DRAG * wb * over * dt;
              if (this.speed < waterCap) this.speed = waterCap;
            }
          }

          this.speed = clamp(
            this.speed,
            CONFIG.BIKE.SPEED_MIN,
            CONFIG.BIKE.SPEED_MAX,
          );

          this.worldX += this.fx * this.speed * dt;
          this.worldZ += this.fz * this.speed * dt;

          this.targetLean =
            -clamp(this.turnRate / CONFIG.BIKE.TURN_RATE_MAX, -1, 1) *
            CONFIG.BIKE.LEAN_MAX;
          this.lean +=
            (this.targetLean - this.lean) *
            Math.min(1, dt * CONFIG.BIKE.LEAN_LERP);

          this.sampleTerrainPose(dt);

          // ---- Headlight aim ----
          // The aim target is a pose-local point set externally each frame by Game.update (it raycasts camera -> mouse/touch NDC and converts the hit into pose-local coords).
          // The spot light, reticle, and beam cones all converge on it.
          if (this._headlightSpot) {
            const tx = this._lightTargetX;
            const ty = this._lightTargetY;
            const tz = this._lightTargetZ;
            this._headlightSpot.target.position.set(tx, ty, tz);
            this._reticle.position.set(tx, ty, tz);
            // Beam cones get yaw (horizontal) AND pitch (vertical) so they track aim in both axes.
            const beamYaw = Math.atan2(tx, Math.abs(tz));
            const beamPitch = Math.atan2(ty - 0.4, Math.abs(tz));
            this._beamInner.rotation.set(beamPitch, -beamYaw, 0);
            this._beamOuter.rotation.set(beamPitch, -beamYaw, 0);
            // Subtle lens-glow drift toward the horizontal aim.
            const glowOff = clamp(tx / 8.0, -1, 1) * 0.05;
            this._glowInner.position.x = glowOff;
            this._glowOuter.position.x = glowOff;
          }

          if (this.fireCooldown > 0) this.fireCooldown -= dt;
        }

        /**
         * Set the aim target in pose-group-local coordinates.
         * The reticle, spotlight, and beam cones converge on (x, y, z).
         * Game.update computes this from the camera + pointer NDC each frame.
         */
        setAim(x, y, z) {
          this._lightTargetX = x;
          this._lightTargetY = y;
          this._lightTargetZ = z;
        }

        // Firing is pointer/tap driven (see Input).
        // HUD elements suppress aim+fire via isOverHud(); the OS cursor hides over the canvas and is restored over HUD or on focus loss; focus loss recenters the reticle.
        tryFire() {
          if (this.fireCooldown > 0) return false;
          this.fireCooldown = CONFIG.BULLET.FIRE_COOLDOWN;
          return true;
        }

        /**
         * Push the bike's current worldX/Y/Z + heading + pitch/lean/roll onto the Object3D hierarchy and force the pose group's world matrix current.
         * Idempotent: calling it twice with the same state is a no-op the second time.
         * Single source of truth for the pose transform -- both the end-of-frame visual update and _fireBullet's aim maths call this, so the matrix is computed once and they cannot disagree.
         */
        syncPose() {
          this.group.position.set(this.worldX, this.worldY, this.worldZ);
          this.group.rotation.set(0, -this.heading, 0);
          // Pitch (X) then roll/lean (Z) - stable for motorcycle ranges
          this._poseGroup.rotation.set(this.pitch, 0, this.lean + this.roll);
          this._poseGroup.updateWorldMatrix(true, false);
        }
        applyVisualTransform() {
          this.syncPose();
        }
      }

      // ============================================================================
      // BULLETS
      // ============================================================================
      class Bullet {
        constructor() {
          this.active = false;
          this.x = 0;
          this.y = 0;
          this.z = 0;
          this.vx = 0;
          this.vy = 0;
          this.vz = 0;
          this.life = 0;
          // Flight origin + precomputed eye-traced target distance (-1 = none, use the substep fallback).
          // Always (re)set by fire(); declared here so the shape is fixed from construction.
          this.ox = 0;
          this.oy = 0;
          this.oz = 0;
          this.targetDist = -1;
        }
        /**
         * @param targetDist optional: distance along the velocity at which this bullet's eye-traced target surface lies. When given (a normal shot, where the camera->reticle line hit the ground), the bullet detonates on reaching that distance
         * -- the impact matches where the player aimed. When omitted (a sky shot, no surface under the crosshair), the bullet falls back to discovering terrain itself via the substep collision march in update().
         */
        fire(x, y, z, vx, vy, vz, targetDist) {
          this.active = true;
          this.x = x;
          this.y = y;
          this.z = z;
          this.vx = vx;
          this.vy = vy;
          this.vz = vz;
          this.life = CONFIG.BULLET.MAX_LIFETIME;
          // Origin kept so update() can measure distance travelled against the precomputed target distance.
          // -1 target == no precomputed hit.
          this.ox = x;
          this.oy = y;
          this.oz = z;
          this.targetDist = targetDist == null ? -1 : targetDist;
        }
        /**
         * Resolve a surface impact at world XZ: snap to the visible surface height (terrain clamped up to the waterline) and compute the surface normal.
         * Shared by both collision paths so a precomputed eye-traced hit and a fallback substep hit produce identical results.
         * Returns {y, nx, ny, nz, onWater}.
         */
        static _surfaceHit(x, z) {
          const waterY = CONFIG.WATER.LEVEL;
          const rawY = sampleTerrain(x, z);
          const onWater = rawY < waterY;
          if (onWater) {
            // Water is flat -- normal is straight up.
            // Deriving it from the submerged seabed gradient would tilt the spark fountain by geometry the player cannot see.
            return { y: waterY, nx: 0, ny: 1, nz: 0, onWater: true };
          }
          // Terrain normal via central differences: sample +/-EPS in X and Z, build the height gradient, take the upward normal (-dh/dx,1,-dh/dz).
          const EPS = 0.5;
          const hxp = sampleTerrain(x + EPS, z);
          const hxn = sampleTerrain(x - EPS, z);
          const hzp = sampleTerrain(x, z + EPS);
          const hzn = sampleTerrain(x, z - EPS);
          const dhdx = (hxp - hxn) / (2 * EPS);
          const dhdz = (hzp - hzn) / (2 * EPS);
          let nx = -dhdx,
            ny = 1,
            nz = -dhdz;
          const nlen = Math.hypot(nx, ny, nz);
          return {
            y: rawY,
            nx: nx / nlen,
            ny: ny / nlen,
            nz: nz / nlen,
            onWater: false,
          };
        }
        update(dt) {
          if (!this.active) return null;

          // ---- Path A: precomputed eye-traced target (the common case) ----
          // A normal shot already knows where the player's eye-line met the surface (Game._traceAim, run once at fire time).
          // The bullet just flies straight to that distance -- no per-frame terrain search, no substep march.
          // Reaching the target distance == impact, snapped to the visible surface so a fast bike can't drift it off.
          if (this.targetDist >= 0) {
            const ndx = this.vx * dt;
            const ndy = this.vy * dt;
            const ndz = this.vz * dt;
            this.x += ndx;
            this.y += ndy;
            this.z += ndz;
            const ddx = this.x - this.ox;
            const ddy = this.y - this.oy;
            const ddz = this.z - this.oz;
            const travelled = Math.hypot(ddx, ddy, ddz);
            if (travelled >= this.targetDist) {
              this.active = false;
              // Snap XZ to the exact target point along the flight line so the burst lands precisely where the eye aimed, then resolve the surface height + normal there.
              const f = this.targetDist / (travelled || 1);
              const hx = this.ox + ddx * f;
              const hz = this.oz + ddz * f;
              const h = Bullet._surfaceHit(hx, hz);
              this.x = hx;
              this.y = h.y;
              this.z = hz;
              return {
                x: hx,
                y: h.y,
                z: hz,
                nx: h.nx,
                ny: h.ny,
                nz: h.nz,
                onWater: h.onWater,
              };
            }
            this.life -= dt;
            if (this.life <= 0) this.active = false;
            return null;
          }

          // ---- Path B: fallback substep collision (sky shots) -------------
          // No precomputed target -- the camera->reticle line never met the surface (aimed at sky / horizon).
          // The bullet discovers terrain itself.
          // Distance-based substepping prevents tunneling: terrain collision is a POINT test, so each step must be short enough to never JUMP OVER a hill.
          // At 970 m/s and 60 fps a bullet covers ~16 m/frame; stepping at <=MAX_STEP metres makes skipping a hill physically impossible.
          // Cost scales with speed but only runs for these rare sky shots, and only while the bullet is alive.
          const MAX_STEP = 1.0; // metres per collision test
          const speed = Math.hypot(this.vx, this.vy, this.vz);
          const frameDist = speed * dt;
          const steps = Math.min(
            256,
            Math.max(2, Math.ceil(frameDist / MAX_STEP)),
          );
          const subDt = dt / steps;

          const ampA = CONFIG.TERRAIN.OCTAVE_A_AMP;
          const ampB = CONFIG.TERRAIN.OCTAVE_B_AMP;
          const maxPossibleHeight = ampA + ampB;
          const waterY = CONFIG.WATER.LEVEL;

          for (let s = 0; s < steps; s++) {
            const prevY = this.y;
            this.x += this.vx * subDt;
            this.y += this.vy * subDt;
            this.z += this.vz * subDt;
            // No gravity -- photon bolts fly in a STRAIGHT line.
            // Terrain collision still works because terrain RISES into the path.

            // Skip the noise math when the bullet is above the max terrain ceiling -- but only if it was above for the WHOLE substep (both ends), so a step crossing the ceiling band is never skipped.
            if (this.y > maxPossibleHeight && prevY > maxPossibleHeight)
              continue;

            // Collide against the VISIBLE surface: terrain clamped up to the waterline (max(terrain, waterline)), so a bullet cannot punch through the water surface to the hidden seabed below.
            const rawY = sampleTerrain(this.x, this.z);
            const tY = rawY < waterY ? waterY : rawY;

            if (this.y <= tY + 0.05) {
              this.active = false;
              const h = Bullet._surfaceHit(this.x, this.z);
              this.y = h.y;
              return {
                x: this.x,
                y: h.y,
                z: this.z,
                nx: h.nx,
                ny: h.ny,
                nz: h.nz,
                onWater: h.onWater,
              };
            }
          }
          this.life -= dt;
          if (this.life <= 0) this.active = false;
          return null;
        }
      }

      // ============================================================================
      // PHOTON TRAILS (the "photon bolt" visual)
      // ----------------------------------------------------------------------------
      // A single instanced quad-strip per shot.
      // ONE ShaderMaterial, ONE InstancedBufferGeometry, ONE draw call for ALL bullets in flight.
      // Per-segment data lives in per-instance attributes that JS updates in-place each frame -- never reallocated.
      // The "head" of each trail marches along the bullet's flight path at BULLET_SPEED, dragging a fading tail behind it; once the head reaches the target, the trail enters a fade phase (no further geometry updates beyond alpha decay).
      //
      // Quads lie in the horizontal plane oriented by the bullet's direction -- not strictly camera-facing, but always visible against the ground and avoids the "shimmer" you get billboard-rotating quads at small distances during fast camera motion.
      // ============================================================================
      const bulletTrailVertexShader = /* glsl */ `
        // instanceOffset is BIKE-RELATIVE (the owning mesh's Group is parked at
        // the bike's world position each frame). So local XZ length == distance
        // from the player -- no playerPositionXZ uniform needed for fog.
        attribute vec3 instanceOffset;
        attribute vec3 instanceDirection;
        attribute vec2 instanceScale;
        attribute vec4 instanceColor;
        attribute float instanceT;
        varying vec4 vColor;
        varying vec2 vUv;
        varying float vFogDepth;
        const float EPS = 1e-5;
        void main() {
          vColor = instanceColor;
          vUv = vec2(uv.x, instanceT);
          // Right = worldUp × forward. If they're collinear (forward straight up/down -- shouldn't happen for ground-aimed bullets but be safe) fall back to a different axis to avoid a NaN normalization.
          vec3 forward = normalize(instanceDirection);
          vec3 worldUp = vec3(0.0, 1.0, 0.0);
          vec3 rawRight = cross(worldUp, forward);
          float rlen = length(rawRight);
          vec3 right = rlen < EPS
            ? normalize(cross(forward, vec3(1.0, 0.0, 0.0)))
            : rawRight / rlen;
          vec3 up = cross(forward, right);
          mat3 rotMatrix = mat3(right, up, forward);
          vec3 localPos = vec3(position.x * instanceScale.x, 0.0, position.y * instanceScale.y);
          vec3 relPos = instanceOffset + rotMatrix * localPos;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(relPos, 1.0);
          vFogDepth = length(relPos.xz);
        }
      `;
      const bulletTrailFragmentShader = /* glsl */ `
        uniform float fogNear;
        uniform float fogFar;
        varying vec4 vColor;
        varying vec2 vUv;
        varying float vFogDepth;
        void main() {
          // Soft fade across the quad width (vUv.x = 0..1 -> 1 at center, 0 at edges).
          float side = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float sideFade = smoothstep(0.0, 0.45, side);
          // Hard front-edge, soft tail. vUv.y = 0 at the head, 1 at the tail.
          float headFall = smoothstep(0.0, 0.15, 1.0 - vUv.y);
          float lengthFade = headFall * (1.0 - pow(vUv.y, 1.5));
          float alpha = vColor.a * sideFade * lengthFade;
          if (alpha <= 0.0001) discard;
          float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
          alpha *= (1.0 - fogFactor);
          if (alpha <= 0.0001) discard;
          gl_FragColor = vec4(vColor.rgb, alpha);
        }
      `;

      /**
       * One trail per fired bullet.
       * The trail's head follows the LIVE Bullet each frame -- so when the bullet's logical update detects a terrain hit and goes inactive, the head locks at the impact point and the trail starts fading there.
       * No autonomous "fly toward predetermined target" simulation: the bullet IS the simulation.
       *
       * Lifecycle: "flying" -- bullet.active == true: head = bullet position.
       * "fading" -- bullet has died (terrain or expiry): head frozen at the last known position, trail retracts and dims.
       */
      class Trail {
        constructor(index, segmentsPerTrail) {
          this.index = index;
          this.segmentCount = segmentsPerTrail;
          this.baseInstance = index * segmentsPerTrail;
          this.active = false;
          this.bullet = null; // owning Bullet (null when fading)
          this.origin = new Vector3(); // muzzle position (fixed for the shot)
          this.head = new Vector3(); // current head world position
          this.direction = new Vector3(); // unit travel direction
          this.distanceTravelled = 0; // |head - origin|
          this.phase = "flying";
          this.fadeProgress = 0;
          this.hitTime = 0;
          // ---- Position history ring buffer ----
          // The ribbon is laid out along the head's ACTUAL recorded path, not extrapolated backward from a single direction vector.
          // Extrapolation makes the tail swing while the trail grows; a recorded path cannot pivot -- every sample is a point the bullet truly occupied.
          //
          // Capacity must hold enough samples to span TRAIL_LENGTH metres of path at ANY framerate.
          // One sample is pushed per frame; at high refresh (e.g. 200 Hz) the bullet advances only ~0.45 m/frame, so covering an 18 m trail needs ~40 samples.
          // Sized generously -- the per-segment lookup is a short linear walk either way, and the memory (a few Float64Arrays per trail) is negligible.
          this._histCap = segmentsPerTrail + 24;
          this._histX = new Float64Array(this._histCap);
          this._histY = new Float64Array(this._histCap);
          this._histZ = new Float64Array(this._histCap);
          // cumulative arc length at each stored sample
          this._histDist = new Float64Array(this._histCap);
          this._histCount = 0; // valid samples
          this._histHead = 0; // ring write cursor
        }
        /** Push the current head world position into the history ring. */
        _pushHistory() {
          const cap = this._histCap;
          const i = this._histHead;
          const prev = (i - 1 + cap) % cap;
          let d = 0;
          if (this._histCount > 0) {
            const dx = this.head.x - this._histX[prev];
            const dy = this.head.y - this._histY[prev];
            const dz = this.head.z - this._histZ[prev];
            d = this._histDist[prev] + Math.hypot(dx, dy, dz);
          }
          this._histX[i] = this.head.x;
          this._histY[i] = this.head.y;
          this._histZ[i] = this.head.z;
          this._histDist[i] = d;
          this._histHead = (i + 1) % cap;
          if (this._histCount < cap) this._histCount++;
        }
        /**
         * Sample the recorded path at `backDist` metres of arc length BEHIND the newest sample (backDist >= 0; 0 = head).
         * Writes the world position into `out`. The history is short (~40 samples) so a linear walk is trivially cheap and allocation-free.
         */
        _sampleHistory(backDist, out) {
          const cap = this._histCap;
          const n = this._histCount;
          const newest = (this._histHead - 1 + cap) % cap;
          const headDist = this._histDist[newest];
          const want = headDist - backDist; // absolute arc length wanted
          // Walk from newest backward to find the bracketing pair.
          let aIdx = newest;
          for (let k = 1; k < n; k++) {
            const idx = (newest - k + cap) % cap;
            if (this._histDist[idx] <= want) {
              const bIdx = (idx + 1) % cap;
              const da = this._histDist[idx];
              const db = this._histDist[bIdx];
              const f = db > da ? (want - da) / (db - da) : 0;
              out.set(
                this._histX[idx] + (this._histX[bIdx] - this._histX[idx]) * f,
                this._histY[idx] + (this._histY[bIdx] - this._histY[idx]) * f,
                this._histZ[idx] + (this._histZ[bIdx] - this._histZ[idx]) * f,
              );
              return;
            }
            aIdx = idx;
          }
          // Past the oldest sample -> clamp to the oldest recorded point.
          out.set(this._histX[aIdx], this._histY[aIdx], this._histZ[aIdx]);
        }
        fire(bullet, origin, direction, now) {
          this.bullet = bullet;
          this.origin.copy(origin);
          this.head.copy(origin);
          // Seed the quad-orientation direction from the bullet's ACTUAL velocity -- the same source update() re-syncs from every flying frame.
          // This makes the bullet velocity the single source of truth for trail orientation; the aim vector never feeds it directly, so a stale or not-yet-updated aim target cannot twist the ribbon.
          // `direction` is kept only as a fallback for a degenerate (zero) velocity, which should not happen for a freshly fired bullet.
          if (bullet) {
            const vx = bullet.vx,
              vy = bullet.vy,
              vz = bullet.vz;
            const vlen = Math.hypot(vx, vy, vz);
            if (vlen > 1e-6) {
              this.direction.set(vx / vlen, vy / vlen, vz / vlen);
            } else {
              this.direction.copy(direction).normalize();
            }
          } else {
            this.direction.copy(direction).normalize();
          }
          this.distanceTravelled = 0;
          this.phase = "flying";
          this.fadeProgress = 0;
          this.hitTime = 0;
          this.active = true;
          // Reset history and seed it with the muzzle point so a brand-new trail has a valid (zero-length) path from frame one -- no segment ever extrapolates into undefined space on the first shot.
          this._histCount = 0;
          this._histHead = 0;
          this._pushHistory();
        }
        update(
          now,
          offsetAttr,
          dirAttr,
          scaleAttr,
          colorAttr,
          tAttr,
          _trailPos,
          originX,
          originY,
          originZ,
          _segDir,
          muzzleX,
          muzzleY,
          muzzleZ,
        ) {
          if (!this.active) return false;
          const cfg = CONFIG.BULLET_TRAILS;
          if (this.phase === "flying") {
            // If the owning bullet has died, lock the head at its last known position and switch to fading.
            // The Bullet zeros its own velocity on hit so position is the impact point.
            if (!this.bullet || !this.bullet.active) {
              this.phase = "fading";
              this.hitTime = now;
              this.bullet = null;
            } else {
              // Snap head to the bullet's current world position and record it in the path history.
              // The ribbon is built from this recorded path, so it follows exactly where the bullet went -- it cannot swing or pivot as it grows.
              this.head.set(this.bullet.x, this.bullet.y, this.bullet.z);
              const vx = this.bullet.vx,
                vy = this.bullet.vy,
                vz = this.bullet.vz;
              const vlen = Math.hypot(vx, vy, vz) || 1;
              this.direction.set(vx / vlen, vy / vlen, vz / vlen);
              this.distanceTravelled = this.origin.distanceTo(this.head);
              this._pushHistory();
            }
          }
          if (this.phase === "fading") {
            const fadeElapsed = now - this.hitTime;
            this.fadeProgress = Math.min(fadeElapsed / cfg.LIFETIME_MS, 1);
            if (this.fadeProgress >= 1) {
              this.active = false;
              this._hideSegments(scaleAttr);
              return false;
            }
          }

          // headDist = how far the trail's HEAD is from the muzzle. tailDist = where the back of the trail sits along the bullet path.
          // While fading, the tail catches up so the trail visibly retracts.
          const headDist = this.distanceTravelled;
          const tailRaw = Math.max(0, headDist - cfg.TRAIL_LENGTH);
          const tailDist =
            this.phase === "fading"
              ? tailRaw + this.fadeProgress * cfg.TRAIL_LENGTH
              : tailRaw;
          const visibleLen = Math.max(headDist - tailDist, 0.01);
          const segmentLength = visibleLen / Math.max(this.segmentCount - 1, 1);
          const fadeMult = 1 - this.fadeProgress;

          // ---- Ribbon anchoring: flying vs fading ----------------------------
          // FLYING: the tail is anchored to the LIVE muzzle, not the world spot the shot left from.
          // The ribbon is drawn as a straight line from the current muzzle to the bullet head, so the photon streak stays visually glued to the gun even when the bike outruns its own shot.
          // A photon flies straight, so a straight muzzle->head ribbon is geometrically the same path the bullet flew -- only its tail endpoint is re-pinned to the moving weapon.
          //
          // FADING: the shot is spent.
          // Anchoring a spent streak to the moving gun would look wrong (it would slide with the bike after impact), so fading reverts to the recorded path history: the streak hangs in the air at the real impact site and retracts along where the bullet actually travelled.
          const flying = this.phase === "flying";
          // Straight-ribbon endpoints (flying only): muzzle (tail) -> head.
          const mx = muzzleX,
            my = muzzleY,
            mz = muzzleZ;
          const hx = this.head.x,
            hy = this.head.y,
            hz = this.head.z;
          // Constant ribbon direction for the flying straight-line case.
          let fDirX = hx - mx,
            fDirY = hy - my,
            fDirZ = hz - mz;
          let fLen = Math.hypot(fDirX, fDirY, fDirZ);
          if (fLen < 1e-4) {
            // Frame-one degenerate case: head still sits on the muzzle, so muzzle->head has no direction.
            // Use the bullet's flight heading (this.direction is kept synced to bullet velocity) instead.
            fDirX = this.direction.x;
            fDirY = this.direction.y;
            fDirZ = this.direction.z;
            fLen = 0;
          } else {
            fDirX /= fLen;
            fDirY /= fLen;
            fDirZ /= fLen;
          }
          // The flying ribbon is a fixed-length comet tail behind the head, NOT a line spanning the whole muzzle->bullet gap (that would let the streak grow to hundreds of metres as the bullet flies out).
          // Tail length = TRAIL_LENGTH, but clamped to fLen so that early in flight -- while the bullet is still closer than TRAIL_LENGTH -- the tail rests exactly on the muzzle and the streak reads as emerging from the gun.
          // Once the bullet is far, the tail is a fixed distance back and the near (muzzle) end has simply detached -- which is correct: a comet tail is not infinitely long.
          const flyTailLen = Math.min(cfg.TRAIL_LENGTH, fLen);
          // Per-segment quad length for the flying straight ribbon.
          const flySegLen = flyTailLen / Math.max(this.segmentCount - 1, 1);

          for (let i = 0; i < this.segmentCount; i++) {
            const t = i / (this.segmentCount - 1);

            if (flying) {
              // t=0 -> head (bullet), t=1 -> tail.
              // Walk straight back from the head toward the muzzle by up to flyTailLen.
              const back = t * flyTailLen;
              _trailPos.set(
                hx - fDirX * back,
                hy - fDirY * back,
                hz - fDirZ * back,
              );
              _segDir.set(fDirX, fDirY, fDirZ);
            } else {
              // Fading: sample the recorded flight path.
              const backDist = t * visibleLen;
              this._sampleHistory(backDist, _trailPos);
              // Per-segment tangent from a slightly newer path sample.
              const aheadBack = Math.max(0, backDist - segmentLength);
              this._sampleHistory(aheadBack, _segDir);
              _segDir.sub(_trailPos);
              if (_segDir.lengthSq() < 1e-10) {
                _segDir.copy(this.direction);
              } else {
                _segDir.normalize();
              }
            }

            const idx = this.baseInstance + i;
            // ---- Rebase to the bike-anchored render origin ----
            // History/ribbon positions are kept in JS float64 world space (exact at 1 AU).
            // The GPU instanceOffset attribute is float32, so writing a raw 1.5e11 world coordinate would quantize the whole trail onto a single ~16 km grid cell and the photon would vanish.
            // Subtracting the per-frame render origin (the bike's world position) here -- the owning Group is positioned at that SAME origin, in float64, on the CPU -- means the GPU only ever sees small local offsets while the trail renders at the right spot.
            offsetAttr.setXYZ(
              idx,
              _trailPos.x - originX,
              _trailPos.y - originY,
              _trailPos.z - originZ,
            );
            dirAttr.setXYZ(idx, _segDir.x, _segDir.y, _segDir.z);
            const width =
              cfg.WIDTH_HEAD + (cfg.WIDTH_TAIL - cfg.WIDTH_HEAD) * t;
            // Quad length: the flying straight ribbon and the fading path ribbon space their segments differently, so each uses its own.
            scaleAttr.setXY(idx, width, flying ? flySegLen : segmentLength);

            // Two-stop gradient HEAD -> MID -> TAIL packed into a piecewise lerp.
            let r, g, b, a;
            if (t < 0.5) {
              const lt = t * 2;
              r = cfg.COLOR_HEAD.r + (cfg.COLOR_MID.r - cfg.COLOR_HEAD.r) * lt;
              g = cfg.COLOR_HEAD.g + (cfg.COLOR_MID.g - cfg.COLOR_HEAD.g) * lt;
              b = cfg.COLOR_HEAD.b + (cfg.COLOR_MID.b - cfg.COLOR_HEAD.b) * lt;
              a = cfg.COLOR_HEAD.a + (cfg.COLOR_MID.a - cfg.COLOR_HEAD.a) * lt;
            } else {
              const lt = (t - 0.5) * 2;
              r = cfg.COLOR_MID.r + (cfg.COLOR_TAIL.r - cfg.COLOR_MID.r) * lt;
              g = cfg.COLOR_MID.g + (cfg.COLOR_TAIL.g - cfg.COLOR_MID.g) * lt;
              b = cfg.COLOR_MID.b + (cfg.COLOR_TAIL.b - cfg.COLOR_MID.b) * lt;
              a = cfg.COLOR_MID.a + (cfg.COLOR_TAIL.a - cfg.COLOR_MID.a) * lt;
            }
            colorAttr.setXYZW(idx, r, g, b, a * fadeMult);
            if (tAttr) tAttr.setX(idx, t);
          }
          return true;
        }
        _hideSegments(scaleAttr) {
          for (let i = 0; i < this.segmentCount; i++) {
            scaleAttr.setXY(this.baseInstance + i, 0, 0);
          }
        }
      }

      class BulletTrailManager {
        constructor(parent) {
          this.parent = parent;
          this.trails = [];
          this.enabled = CONFIG.BULLET_TRAILS.ENABLED;
          if (!this.enabled) return;

          const cfg = CONFIG.BULLET_TRAILS;
          const total = cfg.MAX_TRAILS * cfg.SEGMENTS_PER_TRAIL;
          const geo = new PlaneGeometry(1, 1);

          this.offsetAttr = new InstancedBufferAttribute(
            new Float32Array(total * 3),
            3,
          );
          this.dirAttr = new InstancedBufferAttribute(
            new Float32Array(total * 3),
            3,
          );
          this.scaleAttr = new InstancedBufferAttribute(
            new Float32Array(total * 2),
            2,
          );
          this.colorAttr = new InstancedBufferAttribute(
            new Float32Array(total * 4),
            4,
          );
          this.tAttr = new InstancedBufferAttribute(new Float32Array(total), 1);
          // DynamicDrawUsage lets the GL backend know these update every frame so it can pick the best upload path (no static-buffer staging).
          [
            this.offsetAttr,
            this.dirAttr,
            this.scaleAttr,
            this.colorAttr,
            this.tAttr,
          ].forEach((a) => a.setUsage(DynamicDrawUsage));

          this.material = new ShaderMaterial({
            vertexShader: bulletTrailVertexShader,
            fragmentShader: bulletTrailFragmentShader,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            side: DoubleSide,
            blending: AdditiveBlending,
            uniforms: {
              // Fog uses straight-line distance from the bike in the XZ plane.
              // The shader derives it from the bike-relative instanceOffset (length of local XZ), so no player-position uniform is needed.
              fogNear: { value: 80 },
              fogFar: { value: 200 },
            },
          });

          // Share the base-quad attributes; everything else is per-instance.
          const instGeo = new InstancedBufferGeometry();
          instGeo.index = geo.index;
          instGeo.attributes.position = geo.attributes.position;
          instGeo.attributes.uv = geo.attributes.uv;
          instGeo.attributes.normal = geo.attributes.normal;
          instGeo.setAttribute("instanceOffset", this.offsetAttr);
          instGeo.setAttribute("instanceDirection", this.dirAttr);
          instGeo.setAttribute("instanceScale", this.scaleAttr);
          instGeo.setAttribute("instanceColor", this.colorAttr);
          instGeo.setAttribute("instanceT", this.tAttr);
          instGeo.instanceCount = total;

          this.mesh = new Mesh(instGeo, this.material);
          this.mesh.frustumCulled = false;
          // Render after opaque + headlight beams so the photon glows on top.
          this.mesh.renderOrder = 100000;
          // ---- Bike-anchored render origin ----
          // The mesh lives inside this Group, not directly in the scene.
          // Every frame the Group is moved to the bike's world position (float64 on the CPU).
          // Trail segment offsets are written RELATIVE to that same origin, so the GPU's float32 instanceOffset attribute never sees a huge coordinate -- the photon trail stays pixel-perfect whether the bike is at the origin or 1 AU away.
          // Same precision trick the terrain fan uses for its vertices.
          this._renderGroup = new Group();
          this._renderGroup.add(this.mesh);
          parent.add(this._renderGroup);
          this._originX = 0;
          this._originY = 0;
          this._originZ = 0;

          for (let i = 0; i < cfg.MAX_TRAILS; i++) {
            this.trails.push(new Trail(i, cfg.SEGMENTS_PER_TRAIL));
          }
          // Hot-path scratch reused inside update()
          this._trailScratch = new Vector3();
          this._trailScratch2 = new Vector3();
          // Live muzzle world position, refreshed every frame by the Game.
          // The flying-phase ribbon anchors its TAIL here so the photon streak always visually connects to the gun, even when the bike outruns the bullet (world float64; rebased per segment).
          this._muzzleX = 0;
          this._muzzleY = 0;
          this._muzzleZ = 0;
        }

        /**
         * Set the bike-anchored render origin for this frame.
         * Trail offsets are written relative to (x, 0, z); the render Group is moved here in float64 so world placement is exact at any distance.
         * Fog depth is derived in-shader from the bike-relative offset, so there is no fog uniform to update here.
         */
        setPlayerXZ(x, z) {
          this._originX = x;
          this._originY = 0;
          this._originZ = z;
          if (this._renderGroup) this._renderGroup.position.set(x, 0, z);
        }

        /**
         * Set the live muzzle world position for this frame.
         * Flying trails anchor their tail end here so the photon streak stays connected to the gun barrel as the bike moves -- without this, a sideways shot fired at speed leaves its trail's tail pinned to the dirt where you fired, visually detached from the weapon.
         */
        setMuzzle(x, y, z) {
          this._muzzleX = x;
          this._muzzleY = y;
          this._muzzleZ = z;
        }

        fire(bullet, origin, direction) {
          if (!this.enabled) return null;
          const trail = this.trails.find((t) => !t.active);
          if (!trail) return null;
          trail.fire(bullet, origin, direction, performance.now());
          return trail;
        }

        update() {
          if (!this.enabled) return;
          const now = performance.now();
          let any = false;
          for (const t of this.trails) {
            if (t.active) {
              t.update(
                now,
                this.offsetAttr,
                this.dirAttr,
                this.scaleAttr,
                this.colorAttr,
                this.tAttr,
                this._trailScratch,
                this._originX,
                this._originY,
                this._originZ,
                this._trailScratch2,
                this._muzzleX,
                this._muzzleY,
                this._muzzleZ,
              );
              any = true;
            }
          }
          // Only flag attribute uploads when something actually moved.
          if (any) {
            this.offsetAttr.needsUpdate = true;
            this.dirAttr.needsUpdate = true;
            this.scaleAttr.needsUpdate = true;
            this.colorAttr.needsUpdate = true;
            this.tAttr.needsUpdate = true;
          }
        }
      }

      // ============================================================================
      // PARTICLES
      // ============================================================================
      class ParticleSystem {
        constructor(parent) {
          const C = CONFIG.PARTICLES;
          const geo = new PlaneGeometry(0.32, 0.32);
          const vel = new Float32Array(C.SPARK_MAX * 3);
          const start = new Float32Array(C.SPARK_MAX);
          const life = new Float32Array(C.SPARK_MAX);
          // Per-spark random in [0,1], one fresh value PER PARTICLE (not per burst). iStart is shared by every spark in one explosion -- it is the frame timestamp -- so it cannot seed intra-burst variation; iSeed can, and does, giving every spark in a bunch its own tone.
          const seed = new Float32Array(C.SPARK_MAX);
          // Per-spark palette selector: 0 = fire (terrain hit), 1 = splash (water hit).
          // Per-spark, not a uniform, so a fire burst and a splash burst alive at the same time each keep their own colours.
          const palette = new Float32Array(C.SPARK_MAX);
          start.fill(-99999);
          geo.setAttribute("iVel", new InstancedBufferAttribute(vel, 3));
          geo.setAttribute("iStart", new InstancedBufferAttribute(start, 1));
          geo.setAttribute("iLife", new InstancedBufferAttribute(life, 1));
          geo.setAttribute("iSeed", new InstancedBufferAttribute(seed, 1));
          geo.setAttribute(
            "iPalette",
            new InstancedBufferAttribute(palette, 1),
          );

          const mat = new ShaderMaterial({
            uniforms: {
              uTime: { value: 0 },
              uGravity: { value: 18 },
              uDrag: { value: 1.6 },
              uHot: { value: new Color(C.SPARK_HOT) },
              uMid: { value: new Color(C.SPARK_MID) },
              uCool: { value: new Color(C.SPARK_COOL) },
              uSplashHot: { value: new Color(C.SPLASH_HOT) },
              uSplashMid: { value: new Color(C.SPLASH_MID) },
              uSplashCool: { value: new Color(C.SPLASH_COOL) },
            },
            vertexShader: `
              attribute vec3 iVel;
              attribute float iStart;
              attribute float iLife;
              attribute float iSeed;
              attribute float iPalette;
              uniform float uTime, uGravity, uDrag;
              varying float vAlpha;
              varying float vLifeT;
              varying float vRand;
              varying float vPalette;
              varying vec2 vUv;
              void main() {
                float e = uTime - iStart;
                float alive = step(0.0, e) * step(e, iLife);
                float decay = exp(-uDrag * e);
                vec3 vel = iVel * decay;
                vel.y -= uGravity * e;
                vec3 offset = vel * e;
                float lifeT = 1.0 - (e / iLife);
                // iSeed is a genuine per-spark random -- distinct for every particle even within a single burst -- so both the size jitter and the fire-tone offset vary spark-to-spark.
                float rnd = iSeed;
                float s = mix(0.6, 1.4, rnd) * lifeT;
                // CRITICAL (huge world coords): use modelViewMatrix, NOT modelMatrix then viewMatrix. modelMatrix and viewMatrix are float32 uniforms;
                // at 1 AU each carries a ~1.5e11 translation that is QUANTIZED to ~16 km before reaching the GPU, and multiplying them in-shader is catastrophic float32 cancellation -- it defeats the CPU-side floating-origin rebase entirely (the JS instanceMatrix is small, but modelMatrix is still huge).
                // three.js composes modelViewMatrix on the CPU in float64, so it arrives small and precise.
                // Spark spawn point lives in instanceMatrix (rebased per frame against the bike origin), the launch curve is the local 'offset', and modelViewMatrix maps straight to eye space. This is the same trick the bullet-trail shader uses.
                vec4 mvc = modelViewMatrix * instanceMatrix * vec4(offset, 1.0);
                mvc.xy += position.xy * s;
                gl_Position = projectionMatrix * mvc;
                vAlpha = alive * smoothstep(0.0, 0.15, lifeT);
                // The base quad spans position.xy in [-0.16, 0.16]; forward it to the fragment shader normalised to [-1, 1] so the fragment can shape the particle as a round dot.
                vUv = position.xy / 0.16;
                // Forwarded for the fire gradient: remaining-life fraction (1 fresh -> 0 dying) and a stable per-spark random; both are already computed above, so this costs nothing.
                vLifeT = lifeT;
                vRand = rnd;
                vPalette = iPalette;
              }`,
            fragmentShader: `
              uniform vec3 uHot, uMid, uCool;
              uniform vec3 uSplashHot, uSplashMid, uSplashCool;
              varying float vAlpha;
              varying float vLifeT;
              varying float vRand;
              varying float vPalette;
              varying vec2 vUv;
              void main() {
                // Shape the quad into a soft round spark. Without this the particle fills the whole quad and reads as a hard-edged square.
                // r is the distance from the quad centre; everything past the disc edge is discarded and the remainder fades out toward the rim so the spark is a glowing dot, not a box.
                float r = length(vUv);
                if (r > 1.0) discard;
                float shape = 1.0 - smoothstep(0.35, 1.0, r);
                float a = vAlpha * shape;
                if (a < 0.01) discard;

                // ---- Spark gradient ------------------------------------------
                // Colour temperature falls along three free axes, so the burst reads as fire (or water spray) instead of identical dots:
                //  - radius r : hot core -> cooler rim within each spark.
                //  - vRand    : a stable per-spark offset, so across the burst some sparks run hotter and some cooler.
                //  - vLifeT   : remaining life -- a fresh spark is bright, an old one cools toward the rim colour, exactly like a cooling ember (or a settling droplet).
                // t walks the hot->mid->cool ramp; 0 = core, 1 = cool edge.
                // vPalette picks the ramp per spark: 0 = fire (terrain hit), 1 = splash (water hit). Per-spark so a fire burst and a splash burst on screen together each keep their own colour.
                float t = r * 0.85
                        + (vRand - 0.5) * 0.5
                        + (1.0 - vLifeT) * 0.55;
                t = clamp(t, 0.0, 1.0);
                vec3 hot  = mix(uHot,  uSplashHot,  vPalette);
                vec3 mid  = mix(uMid,  uSplashMid,  vPalette);
                vec3 cool = mix(uCool, uSplashCool, vPalette);
                vec3 col = t < 0.5
                  ? mix(hot, mid, t * 2.0)
                  : mix(mid, cool, (t - 0.5) * 2.0);
                gl_FragColor = vec4(col, a);
              }`,
            transparent: true,
            depthWrite: false,
            // NormalBlending, NOT AdditiveBlending.
            // Additive computes source + destination, so a spark's on-screen colour depends entirely on what is behind it: it reads as its true orange over the dark sky but blows out toward white over the bright lit ground.
