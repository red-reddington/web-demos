            // Normal (alpha) blending makes the spark OCCLUDE the background by its alpha instead of adding to it, so a spark looks like the same colour on every background.
            // The fragment shader emits a soft radial alpha, so alpha blending gives a clean round dot. depthWrite stays false so overlapping sparks in a burst blend over one another in draw order.
            blending: NormalBlending,
          });
          this.mesh = new InstancedMesh(geo, mat, C.SPARK_MAX);
          // Draw sparks AFTER the water (water is renderOrder 1).
          // Both are transparent; without an explicit order a spark can sort behind the semi-transparent water plane and get tinted through it -- which is why sparks over water looked different from sparks over land.
          // A hot debris burst should always composite on top of a water surface, so force it last.
          this.mesh.renderOrder = 2;
          this.mesh.frustumCulled = false;
          const hidden = new Matrix4().makeTranslation(0, -10000, 0);
          for (let i = 0; i < C.SPARK_MAX; i++)
            this.mesh.setMatrixAt(i, hidden);
          this.mesh.instanceMatrix.needsUpdate = true;
          // ---- Bike-anchored render origin (floating origin) ---- instanceMatrix is float32.
          // A raw 1 AU spawn coordinate quantizes every spark onto one ~16 km grid cell -> the explosion renders far from the impact point.
          // So: the mesh lives in a Group that tracks the bike; spark translations are stored RELATIVE to that moving origin.
          //
          // A spark must stay locked to its WORLD impact point while the origin keeps moving with the bike, so the matrix cannot be written just once -- it would drift.
          // Each spark's true world spawn point is kept in float64 JS arrays, and the (small) relative translation of LIVE sparks is rewritten every frame.
          // Cost: <= SPARK_MAX cheap writes, and only while an explosion is on screen.
          this._renderGroup = new Group();
          this._renderGroup.add(this.mesh);
          parent.add(this._renderGroup);
          this._originX = 0;
          this._originY = 0;
          this._originZ = 0;
          // Per-spark world spawn point (float64) + the wall-clock start time, mirrored from the iStart attribute so update() can tell which sparks are still alive without reading back a GPU attribute.
          this._spawnX = new Float64Array(C.SPARK_MAX);
          this._spawnY = new Float64Array(C.SPARK_MAX);
          this._spawnZ = new Float64Array(C.SPARK_MAX);
          this._spawnStart = new Float32Array(C.SPARK_MAX).fill(-99999);
          this._spawnLife = new Float32Array(C.SPARK_MAX);
          this._mat = mat;
          this._write = 0;
          this._uTime = 0;
          this._tmpMat = new Matrix4();
          // Live-spark accounting so update() does ZERO work when nothing is burning -- the common case.
          // _liveCount is recomputed each frame by the rebase loop and lets the NEXT frame early-out if it hit zero.
          // _slotsUsed is a high-water mark: the rebase loop scans only [0, _slotsUsed), so before the ring buffer has filled once it skips the slots that have never held a spark.
          this._liveCount = 0;
          this._slotsUsed = 0;
        }
        /**
         * Spawn `count` sparks at (x, y, z).
         * If (nx, ny, nz) is given, the spray is oriented around that ground normal: the explosion fountains AWAY from the surface (a horizontal hit splashes sideways; a steep hit jets up and out at an angle).
         * Without a normal, the original +Y fountain is used.
         *
         * `palette` selects the colour ramp: 0 = fire (terrain hit), 1 = splash (water hit).
         * It is written per spark, so overlapping land and water bursts each keep their own colours.
         */
        burst(x, y, z, count = 60, nx = 0, ny = 1, nz = 0, palette = 0) {
          const t = this._uTime;
          const C = CONFIG.PARTICLES;
          const g = this.mesh.geometry;
          const vel = g.attributes.iVel;
          const start = g.attributes.iStart;
          const life = g.attributes.iLife;
          const seed = g.attributes.iSeed;
          const paletteAttr = g.attributes.iPalette;

          // Build an orthonormal basis (t1, t2, n).
          // Standard trick: pick the smallest-magnitude component of n to ensure cross product is well-conditioned, then normalize.
          // Done once per burst, not per particle.
          let t1x, t1y, t1z;
          if (Math.abs(nx) < 0.9) {
            // n is not aligned with +X -> cross with +X gives a good tangent.
            t1x = 0;
            t1y = nz;
            t1z = -ny;
          } else {
            // n is mostly +X -> use +Y to break the degeneracy.
            t1x = -nz;
            t1y = 0;
            t1z = nx;
          }
          const t1len = Math.hypot(t1x, t1y, t1z) || 1;
          t1x /= t1len;
          t1y /= t1len;
          t1z /= t1len;
          // t2 = n × t1 (also unit length since n and t1 are unit & orthogonal).
          const t2x = ny * t1z - nz * t1y;
          const t2y = nz * t1x - nx * t1z;
          const t2z = nx * t1y - ny * t1x;

          for (let k = 0; k < count; k++) {
            const i = this._write;
            this._write = (this._write + 1) % C.SPARK_MAX;
            // Generate a velocity in normal-aligned space: tangential = uniform in disc of radius TAN_SPREAD normal = OUT_BASE + uniform[0, OUT_RAND] Then transform into world space with the basis.
            const TAN_SPREAD = 7;
            const OUT_BASE = 3,
              OUT_RAND = 9;
            const a = (Math.random() - 0.5) * 2 * TAN_SPREAD;
            const b = (Math.random() - 0.5) * 2 * TAN_SPREAD;
            const c = OUT_BASE + Math.random() * OUT_RAND;
            const vx = a * t1x + b * t2x + c * nx;
            const vy = a * t1y + b * t2y + c * ny;
            const vz = a * t1z + b * t2z + c * nz;
            vel.setXYZ(i, vx, vy, vz);
            start.setX(i, t);
            // Fresh per-spark random: distinct for every particle in the burst, so each spark gets its own size and fire tone.
            seed.setX(i, Math.random());
            // Palette: same for the whole burst, but written per spark so an earlier burst of the other kind keeps its colours.
            paletteAttr.setX(i, palette);
            const sparkLife = 0.6 + Math.random() * 0.5;
            life.setX(i, sparkLife);
            // Record the TRUE world spawn point (float64) so update() can rewrite the spark's bike-relative translation every frame without it drifting.
            // Mirror start/life for the alive test.
            this._spawnX[i] = x;
            this._spawnY[i] = y;
            this._spawnZ[i] = z;
            this._spawnStart[i] = t;
            this._spawnLife[i] = sparkLife;
            // Initial matrix: world spawn minus the current render origin.
            this._tmpMat.makeTranslation(
              x - this._originX,
              y - this._originY,
              z - this._originZ,
            );
            this.mesh.setMatrixAt(i, this._tmpMat);
            // High-water mark: update()'s rebase loop need never scan past the highest slot index ever written.
            if (i + 1 > this._slotsUsed) this._slotsUsed = i + 1;
          }
          // A burst guarantees sparks are now live, so the next update() runs its rebase loop regardless of last frame's count (the loop then recomputes _liveCount exactly).
          this._liveCount += count;
          vel.needsUpdate = true;
          start.needsUpdate = true;
          life.needsUpdate = true;
          seed.needsUpdate = true;
          paletteAttr.needsUpdate = true;
          this.mesh.instanceMatrix.needsUpdate = true;
        }
        /**
         * Per-frame tick.
         * Advances the shader clock, repositions the bike-anchored render origin, and rewrites the bike-relative translation of every spark still alive so they stay locked to their true world impact point as the origin moves.
         * Dead sparks are skipped; if nothing is alive, no GPU upload happens.
         */
        update(elapsed, originX, originY, originZ) {
          this._uTime = elapsed;
          this._mat.uniforms.uTime.value = elapsed;

          this._originX = originX;
          this._originY = originY;
          this._originZ = originZ;

          // Nothing alive -> nothing to rebase.
          // The common case (the player is not currently shooting) costs a single integer compare and returns.
          // No 320-slot scan, no group repositioning that nothing would use.
          if (this._liveCount === 0) return;

          if (this._renderGroup)
            this._renderGroup.position.set(originX, originY, originZ);

          // Rewrite live sparks relative to the (moved) origin.
          // The spark's shader-side motion offset is unchanged -- only the spawn-point translation is rebased, so the explosion stays world-stable.
          // Scan only [0, _slotsUsed): slots above the high-water mark have never held a spark. _liveCount is recomputed here so the NEXT frame can early-out the moment the last spark dies.
          let live = 0;
          for (let i = 0; i < this._slotsUsed; i++) {
            const e = elapsed - this._spawnStart[i];
            if (e < 0 || e > this._spawnLife[i]) continue; // dead / unused
            live++;
            this._tmpMat.makeTranslation(
              this._spawnX[i] - originX,
              this._spawnY[i] - originY,
              this._spawnZ[i] - originZ,
            );
            this.mesh.setMatrixAt(i, this._tmpMat);
          }
          this._liveCount = live;
          if (live > 0) this.mesh.instanceMatrix.needsUpdate = true;
        }
      }

      // ============================================================================
      // INPUT
      // ============================================================================
      // Every interactive overlay element.
      // A pointer over any of these must NOT fire the weapon, must NOT drive the reticle, and must show the normal OS cursor.
      // The selector is matched with closest() so a click landing on a child (e.g. an SVG <path> inside a button) still counts.
      const HUD_SELECTOR =
        "#splash, #pauseOverlay, #stats, #helpPanel, " +
        "#helpBtn, #muteBtn, #fullscreenBtn";
      const isOverHud = (el) =>
        !!(el && el.closest && el.closest(HUD_SELECTOR));

      class Input {
        constructor() {
          this.keys = Object.create(null);
          this.firePressed = false;
          this._joySteer = 0;
          this._joyThrottle = 0;
          this.state = { steer: 0, throttle: 0, fire: false };
          this.touchOnly = isTouchOnly();
          // Pointer aim in normalized device coords (-1..1, Y up).
          // The aim system raycasts camera -> NDC to place the reticle.
          // Defaults to (0, 0) -- straight ahead -- so aim is sane before any input.
          this.aimNdcX = 0;
          this.aimNdcY = 0;
          // True while the desktop pointer sits over a HUD element OR the window/tab has lost focus.
          // While suppressed, the reticle snaps back to center and the weapon won't fire.
          // The game canvas hides the OS cursor (the reticle IS the cursor); HUD elements and the blurred state restore the normal cursor.
          this.aimSuppressed = false;

          window.addEventListener("keydown", (e) => {
            if (e.altKey && e.code.toLowerCase() === "enter") {
              e.preventDefault();
              toggleFullscreen();
              return;
            }
            if (this.keys[e.code]) return;
            this.keys[e.code] = true;
            // Firing is pointer/tap driven; SPACE is swallowed only so the page doesn't scroll on press.
            if (e.code === "Space") {
              e.preventDefault();
            }
          });
          window.addEventListener("keyup", (e) => {
            this.keys[e.code] = false;
          });

          // ---- Pointer aim ---- NDC = (clientX/w)*2-1, with Y flipped to clip-space orientation.
          const setNdc = (clientX, clientY) => {
            this.aimNdcX = (clientX / window.innerWidth) * 2 - 1;
            this.aimNdcY = -((clientY / window.innerHeight) * 2 - 1);
          };
          // Recenter the aim (reticle returns to straight-ahead).
          // Used when the pointer moves onto a HUD element and when focus is lost.
          const recenterAim = () => {
            this.aimNdcX = 0;
            this.aimNdcY = 0;
          };
          this._recenterAim = recenterAim;

          if (!this.touchOnly) {
            // Desktop: mouse moves the aim continuously; left-click fires.
            // While the pointer is over a HUD element, aim+fire is suppressed and the OS cursor restored so the buttons stay usable.
            window.addEventListener("mousemove", (e) => {
              const overHud = isOverHud(e.target);
              this._setAimSuppressed(overHud);
              if (overHud) {
                recenterAim();
                return;
              }
              setNdc(e.clientX, e.clientY);
            });
            window.addEventListener("mousedown", (e) => {
              if (e.button !== 0) return;
              // Clicks on HUD overlays must NOT fire -- they have their own handlers.
              // (closest() walks up from the real target, so a click on an SVG path inside a button is correctly excluded.)
              if (isOverHud(e.target)) return;
              setNdc(e.clientX, e.clientY);
              this.firePressed = true;
            });
            // Focus loss: recenter the reticle and restore the cursor.
            // When focus returns, the next mousemove re-establishes aim.
            // Covers alt-tab, clicking out, and the tab going to the background.
            window.addEventListener("blur", () => {
              recenterAim();
              this._setAimSuppressed(true);
            });
            document.addEventListener("visibilitychange", () => {
              if (document.hidden) {
                recenterAim();
                this._setAimSuppressed(true);
              }
            });
          }
          this._setNdc = setNdc;

          if (this.touchOnly) {
            const help = document.getElementById("helpPanel");
            if (help) {
              help.innerHTML =
                "<b>joystick (lower-left)</b> steer / throttle<br />" +
                "<b>tap / drag right side</b> aim &amp; fire<br />" +
                "Drive forever. Photon bolts detonate where the math says.";
            }
            this._initNipple();
          }
        }

        /**
         * Toggle the aim-suppressed state.
         * Side effect: hides the OS cursor over the game canvas (reticle replaces it) and restores it when suppressed (over HUD / blurred).
         * Cheap -- only touches the DOM when the state actually flips.
         */
        _setAimSuppressed(suppressed) {
          if (this.aimSuppressed === suppressed) return;
          this.aimSuppressed = suppressed;
          // none = reticle-as-cursor; default = normal OS cursor.
          document.body.style.cursor = suppressed ? "default" : "none";
        }

        _initNipple() {
          const joyEl = document.getElementById("joy");
          const fireEl = document.getElementById("firePad");
          if (!joyEl || !fireEl) return;
          joyEl.style.display = "block";
          fireEl.style.display = "block";

          const joy = nipplejs.create({
            zone: joyEl,
            mode: "static",
            position: { left: "50%", top: "50%" },
            restJoystick: true,
            color: { front: "#6ec3ff", back: "rgba(110,195,255,0.12)" },
            size: 110,
            threshold: 0.1,
            fadeTime: 150,
          });
          joy.on("move", (evt) => {
            const v = evt.data && evt.data.vector;
            if (!v) return;
            this._joySteer = clamp(v.x, -1, 1);
            this._joyThrottle = clamp(v.y, -1, 1);
          });
          let joyTouches = 0;
          joyEl.addEventListener(
            "touchstart",
            (e) => {
              joyTouches += e.changedTouches.length;
            },
            { passive: true },
          );
          const onEnd = (e) => {
            joyTouches = Math.max(0, joyTouches - e.changedTouches.length);
            if (joyTouches === 0) {
              this._joySteer = 0;
              this._joyThrottle = 0;
            }
          };
          joyEl.addEventListener("touchend", onEnd, { passive: true });
          joyEl.addEventListener("touchcancel", onEnd, { passive: true });

          // Touch aim: a touch on the fire pad sets the aim NDC at the touch point and fires; dragging updates the aim continuously (swipe to aim).
          // Same NDC formula as desktop mouse.
          fireEl.addEventListener(
            "touchstart",
            (e) => {
              for (const t of e.changedTouches) {
                if (t.target === fireEl) {
                  this._setNdc(t.clientX, t.clientY);
                  this.firePressed = true;
                  break;
                }
              }
            },
            { passive: true },
          );
          fireEl.addEventListener(
            "touchmove",
            (e) => {
              for (const t of e.changedTouches) {
                if (t.target === fireEl) {
                  this._setNdc(t.clientX, t.clientY);
                  break;
                }
              }
            },
            { passive: true },
          );
        }

        poll() {
          this.state.steer = 0;
          this.state.throttle = 0;

          if (this.keys.KeyA || this.keys.ArrowLeft) this.state.steer = -1;
          if (this.keys.KeyD || this.keys.ArrowRight) this.state.steer = 1;
          if (this.keys.KeyW || this.keys.ArrowUp) this.state.throttle = 1;
          if (this.keys.KeyS || this.keys.ArrowDown) this.state.throttle = -1;
          if (this._joySteer !== 0) this.state.steer = this._joySteer;
          if (this._joyThrottle !== 0) this.state.throttle = this._joyThrottle;

          this.state.fire = this.firePressed;
          this.firePressed = false;

          return this.state;
        }
      }

      // ============================================================================
      // SOUND
      // ----------------------------------------------------------------------------
      // Howler wrapper.
      // Loops live in the manifest; the manager exposes the minimal interface needed by this app: play() for one-shots, startLoop()/stopLoop() for sustained sounds, setRate() for engine pitch modulation.
      // ============================================================================
      const SOUND_MANIFEST = {
        shot: { src: assetURL("assets/sounds/gunshot.mp3"), vol: 0.5 },
        // Impact BOOM. Spatial: positioned at the bullet's hit point so it pans + attenuates by where the round lands, not where you stand.
        // Linear falloff to true silence at EXPLODE_RADIUS (300 m) so a hit at the visible fan edge is faint, a hit at your wheel is full. refDistance kept small (muzzle-ish) so near hits stay punchy.
        boom: {
          src: assetURL("assets/sounds/explosion.mp3"),
          vol: 0.8,
          spatial: true,
          refDistance: 12,
          maxDistance: 300, // == CONFIG.BULLET.EXPLODE_RADIUS
          rolloff: 1.0,
        },
        // Player engine: head-centered loop, rate modulated by speed each frame.
        // Started after the splash click so the AudioContext is unlocked (browsers reject autoplay otherwise).
        engine_player: {
          src: assetURL("assets/sounds/engine_loop.mp3"),
          vol: 0.45,
          loop: true,
        },
        // Riding-on-water wash.
        // A continuous loop, like the engine: it runs the whole session and is made audible only by VOLUME, driven each frame from the bike's _waterBlend and speed.
        // Starting volume is 0 so it is silent on land; _tickWater() raises it on water.
        // Volume, not rate -- water has an intensity, not a pitch.
        water_ride: {
          src: assetURL("assets/sounds/water.mp3"),
          vol: 0,
          loop: true,
        },
      };
      class SoundManager {
        constructor() {
          this.sounds = {};
          this.isMuted = localStorage.getItem("td_muted") === "1";
          Howler.mute(this.isMuted);
          for (const k in SOUND_MANIFEST) {
            const c = SOUND_MANIFEST[k];
            const h = new Howl({
              src: [c.src],
              volume: c.vol,
              loop: !!c.loop,
              preload: true,
              onloaderror: () => (h._broken = true),
            });
            if (c.spatial) {
              // Linear model so a source at maxDistance is truly silent (inverse only asymptotes, leaving distant hits faintly audible forever). HRTF gives real left/right placement.
              h.pannerAttr({
                panningModel: "HRTF",
                distanceModel: "linear",
                refDistance: c.refDistance ?? 10,
                maxDistance: c.maxDistance ?? 300,
                rolloffFactor: c.rolloff ?? 1.0,
                coneInnerAngle: 360,
                coneOuterAngle: 360,
                coneOuterGain: 0,
              });
              h._spatial = true;
            }
            this.sounds[k] = h;
          }
          // ---- AUDIO FLOATING ORIGIN ----
          // The listener is PINNED at (0,0,0) for the entire session and never moves.
          // This is the single most important line for spatial audio in this engine: the world runs in float64 out to ~1 AU, but WebAudio's PannerNode is float32 and subtracts (source - listener) INTERNALLY. Feed it world coords ~1e11 and that subtract loses the impact offset entirely (float32 ULP at 1e11 is ~16 m), so pan/distance quantise to garbage -- the same catastrophic cancellation the aim ray fights.
          // Instead: listener stays at origin, and every spatial source is given a BIKE-RELATIVE offset (hit - bike), computed in float64 on our side, always <= 300 m, always origin-centred, always float32-safe. Only the listener ORIENTATION updates per frame (rotation carries no magnitude, so no precision risk).
          Howler.pos(0, 0, 0);
        }
        play(k) {
          if (this.isMuted) return null;
          const h = this.sounds[k];
          if (!h || h._broken) return null;
          try {
            return h.play();
          } catch {
            return null;
          }
        }
        /**
         * Update ONLY the listener orientation to face along the bike heading.
         * Position is never set here -- the listener is pinned at the origin (see constructor). Forward is the bike's unit heading vector; up is world +Y.
         */
        setListenerOrientation(fwdX, fwdZ) {
          try {
            Howler.orientation(fwdX, 0, fwdZ, 0, 1, 0);
          } catch {}
        }
        /**
         * Play a one-shot at a BIKE-RELATIVE offset (rx, ry, rz) = world hit minus bike world position.
         * The caller does the float64 subtract; we hand Howler only the small, origin-centred delta.
         * Howler builds the PannerNode lazily on play, so we set pos immediately AND again on the 'play' event to cover the cold-panner case.
         */
        playAt(k, rx, ry, rz) {
          if (this.isMuted) return null;
          const h = this.sounds[k];
          if (!h || h._broken) return null;
          try {
            const id = h.play();
            if (h._spatial) {
              h.pos(rx, ry, rz, id);
              h.once(
                "play",
                () => {
                  try {
                    h.pos(rx, ry, rz, id);
                  } catch {}
                },
                id,
              );
            }
            return id;
          } catch {
            return null;
          }
        }
        /**
         * Begin a looping sound and return its Howler `id` so the caller can later stop or rate-modulate it.
         * Note: Howler tracks playback natively even when muted.
         * The loop is initialized regardless of global mute state so it's ready when unmuted.
         */
        startLoop(k) {
          const h = this.sounds[k];
          if (!h || h._broken) return null;
          try {
            return h.play();
          } catch {
            return null;
          }
        }
        stopLoop(k, id) {
          if (id == null) return;
          const h = this.sounds[k];
          if (!h) return;
          try {
            h.stop(id);
          } catch {}
        }
        setRate(k, id, rate) {
          if (id == null) return;
          const h = this.sounds[k];
          if (!h) return;
          try {
            h.rate(rate, id);
          } catch {}
        }
        /** Set the volume of one playing stream. Mirrors setRate. */
        setVolume(k, id, vol) {
          if (id == null) return;
          const h = this.sounds[k];
          if (!h) return;
          try {
            h.volume(vol, id);
          } catch {}
        }
        toggleMute() {
          this.isMuted = !this.isMuted;
          Howler.mute(this.isMuted);
          localStorage.setItem("td_muted", this.isMuted ? "1" : "0");
        }
      }
      let SOUND = null;

      // ============================================================================
      // CHASE CAMERA
      // ============================================================================
      class ChaseCamera {
        constructor(camera) {
          this.camera = camera;
          this._bobT = 0;
          this._engT = 0;
          this._pitch = 0;
          this._prevSpeed = 0;
          this._lookMat = new Matrix4();
          this._lookTarget = new Vector3();
          this._tmpQuat = new Quaternion();
          this._forward = new Vector3();
          this._baseUp = new Vector3();
        }

        // Proper chase / cockpit-style camera.
        // Sits HEIGHT above the bike at BACK behind, looks LOOK_AHEAD meters in front.
        // Applies body bob, an engine micro-vibration, and a clean quaternion-based lean roll so it never 180-flips when the camera passes through a heading singularity.
        update(dt, bike) {
          const C = CONFIG.CAMERA;
          const speedFrac = bike.speed / CONFIG.BIKE.SPEED_MAX;

          // Bob + engine vibration. Cheap sin terms scaled by speed.
          const bodyRate = 2.0 + Math.sqrt(Math.max(0, bike.speed)) * 1.1;
          this._bobT += dt * bodyRate;
          let bodyBob = Math.sin(this._bobT) * 0.022 * speedFrac;

          this._engT += dt * 18;
          let engineVib = Math.sin(this._engT) * 0.003 * (0.4 + speedFrac);

          // Water damping.
          // On terrain the camera bob is camouflaged by the bike's real vertical motion over bumps.
          // On FLAT water the bike body is dead-level and still, so a lone sinusoidal camera bob is exposed as an obvious fake sin(). bike._waterBlend eases 0..1; over water the bob is cut to a small residue (a running engine still vibrates a little, but the ride bob has nothing to justify it). 1.0 on land -> 0.25 on open water.
          const bobScale = 1 - 0.75 * (bike._waterBlend || 0);
          bodyBob *= bobScale;
          engineVib *= bobScale;

          const accel = (bike.speed - this._prevSpeed) / Math.max(dt, 1e-3);
          this._prevSpeed = bike.speed;
          const targetPitch = clamp(accel * 0.008, -0.06, 0.06);
          this._pitch += (targetPitch - this._pitch) * Math.min(1, dt * 6);

          // Pulled from the pre-calculated bike cache (set once in bike.update).
          const fx = bike.fx;
          const fz = bike.fz;

          this.camera.position.set(
            bike.worldX - fx * C.BACK,
            bike.worldY + C.HEIGHT + bodyBob + engineVib,
            bike.worldZ - fz * C.BACK,
          );

          this._lookTarget.set(
            bike.worldX + fx * C.LOOK_AHEAD,
            bike.worldY + C.LOOK_HEIGHT + this._pitch * C.LOOK_AHEAD,
            bike.worldZ + fz * C.LOOK_AHEAD,
          );

          // Quaternion-based roll: build the camera's up vector by rotating world-up around the forward axis.
          // Avoids the 180° flip you'd get by smashing camera.rotation.z directly when the look direction crosses through degenerate orientations.
          this._forward
            .subVectors(this._lookTarget, this.camera.position)
            .normalize();
          this._baseUp.set(0, 1, 0);
          const rollAngle = bike.lean * 0.15;
          this._tmpQuat.setFromAxisAngle(this._forward, rollAngle);
          this._baseUp.applyQuaternion(this._tmpQuat);

          this._lookMat.lookAt(
            this.camera.position,
            this._lookTarget,
            this._baseUp,
          );
          this.camera.quaternion.setFromRotationMatrix(this._lookMat);
        }
      }

      // ============================================================================
      // WATER
      // ----------------------------------------------------------------------------
      // A single flat plane at WATER.LEVEL, child of the terrain fan group so it follows the bike and always covers the visible area.
      // It is a STOCK MeshStandardMaterial -- lit by the same scene lights as the terrain -- with one onBeforeCompile injection: three scrolling, mutually-rotated copies of a procedural normal map are summed to give a moving, non- repeating ripple surface.
      // (Ported from the discourse "cheap water" material; the boat / ripple-RT / alpha-mask machinery from that demo is deliberately omitted -- this world has no boat in the water.)
      //
      // The normal map is generated procedurally into a canvas at construction: no network fetch, no external asset, the file stays self-contained.
      // ============================================================================
      class Water extends Mesh {
        constructor() {
          const W = CONFIG.WATER;

          const geo = new PlaneGeometry(W.SIZE * 2, W.SIZE * 2);

          // ---- Normal map: Mirko Kunze's "cheapwater" water_normal.png --------- An OBJECT-SPACE normal map (mqnc/cheapwater).
          // Object-space maps encode the normal in absolute axes, so they MUST be flagged normalMapType: ObjectSpaceNormalMap and loaded with flipY = false -- otherwise three.js treats the bytes as tangent-space and the lighting is wrong.
          // Loaded as a project asset via assetURL().
          //
          // Loaded ASYNCHRONOUSLY: until the image arrives the water renders flat-shaded.
          // IMPORTANT ordering -- flipY, anisotropy, and needsUpdate all act on the IMAGE, so they are only valid once the image has arrived.
          // Setting needsUpdate=true on a still-empty texture makes three.js warn "Texture marked for update but no image data found" every frame until the load lands.
          // So everything image-dependent is done inside the onLoad callback; only image- independent settings (wrap, repeat) are touched synchronously.
          const tiles = (W.SIZE * 2) / W.NORMAL_TILE;
          // Anisotropy is a renderer capability not known at construction; the Game injects it via setAnisotropy().
          // Stash it until the image (and possibly that call) have both happened.
          let pendingAniso = 1;
          let imageLoaded = false;
          const normalTex = new TextureLoader().load(
            assetURL("assets/textures/water_normal.png"),
            (t) => {
              // Image is here now -> safe to touch image-dependent state.
              t.flipY = false;
              t.anisotropy = pendingAniso;
              t.needsUpdate = true;
              imageLoaded = true;
            },
          );
          normalTex.wrapS = normalTex.wrapT = RepeatWrapping;
          normalTex.repeat.set(tiles, tiles);
          // Setter the Game can call regardless of load timing.
          // Built as a local closure here (cannot touch `this` before super()); bound to the instance just after super() below.
          const applyAniso = (maxAniso) => {
            pendingAniso = maxAniso;
            if (imageLoaded) {
              normalTex.anisotropy = maxAniso;
              normalTex.needsUpdate = true;
            }
            // If not loaded yet, the onLoad callback picks up pendingAniso.
          };

          // ---- Sky-tinted reflection environment -------------------------------
          // Water is mostly REFLECTION; with no envMap a MeshStandardMaterial water surface just looks like tinted glossy plastic.
          // A cheap fix is a 6-face cube to reflect, painted as a vertical sky gradient (zenith colour up high, horizon colour low).
          // It is assigned directly as envMap -- NO PMREMGenerator. PMREM's multi-pass roughness convolution is the expensive path; for a smooth gradient (which is already "blurred", no high-frequency detail) the raw cube reflects fine and costs nothing per frame.
          //
          // The faces are tiny canvases (16x16). update() repaints them ONLY when the sky colours have meaningfully shifted (a few times across a day/night cycle), so steady-state cost is zero.
          // The colours are pulled from the SAME uSkyColorLow / uSkyColorHigh the real sky shader uses -- one source of truth, water reflection always agrees with the sky.
          const ENV_FACE = 16;
          const envFaces = [];
          for (let f = 0; f < 6; f++) {
            const c = document.createElement("canvas");
            c.width = c.height = ENV_FACE;
            envFaces.push(c);
          }
          const envCube = new CubeTexture(envFaces);
          // Canvas colours are authored in sRGB; tag the cube so three.js linearises it correctly before the reflection maths (otherwise the reflected sky reads washed-out / too bright).
          envCube.colorSpace = SRGBColorSpace;
          // Paint the six faces from a horizon colour and a zenith colour. Cube face order: +X, -X, +Y(up), -Y(down), +Z, -Z.
          //
          // The whole point of this cube is that flat water REFLECTS THE SKY: when the sky's horizon goes red at sunrise/sunset, the water must show red.
          // A near-flat surface, perturbed by the ripple normals, reflects rays that mostly strike the LOWER part of the side faces and the -Y face -- so those regions must carry the HORIZON colour (uSkyColorLow), which is the live sunrise/sunset tint.
          // The faces are therefore a straight zenith->horizon gradient with no bias: the cube simply is the sky, and the reflection follows it.
          const paintEnv = (lowCol, highCol) => {
            const loR = (lowCol.r * 255) | 0,
              loG = (lowCol.g * 255) | 0,
              loB = (lowCol.b * 255) | 0;
            const hiR = (highCol.r * 255) | 0,
              hiG = (highCol.g * 255) | 0,
              hiB = (highCol.b * 255) | 0;
            const loCss = `rgb(${loR},${loG},${loB})`;
            const hiCss = `rgb(${hiR},${hiG},${hiB})`;
            for (let f = 0; f < 6; f++) {
              const ctx = envFaces[f].getContext("2d");
              if (f === 2) {
                // +Y up face: solid zenith colour.
                ctx.fillStyle = hiCss;
                ctx.fillRect(0, 0, ENV_FACE, ENV_FACE);
              } else if (f === 3) {
                // -Y down face: solid HORIZON colour, slightly darkened.
                // Ripple-tilted rays from flat water frequently sample this face; the sky those rays "see" is the low band near the waterline, i.e. the horizon tint -- so it must follow uSkyColorLow (red at sunrise/sunset), not the zenith.
                ctx.fillStyle = `rgb(${(loR * 0.7) | 0},${
                  (loG * 0.7) | 0
                },${(loB * 0.7) | 0})`;
                ctx.fillRect(0, 0, ENV_FACE, ENV_FACE);
              } else {
                // Side faces: a plain zenith(top)->horizon(bottom) gradient.
                // No bias: the lower part of the face is the horizon colour because that is what the sky looks like near the horizon, and that lower part is exactly what flat water reflects.
                const g = ctx.createLinearGradient(0, 0, 0, ENV_FACE);
                g.addColorStop(0, hiCss);
                g.addColorStop(1, loCss);
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, ENV_FACE, ENV_FACE);
              }
            }
            envCube.needsUpdate = true;
          };
          // Initial paint with a neutral daytime sky so the water is never un-environed for a frame; update() overwrites it immediately.
          paintEnv(new Color(0x6fa2ef), new Color(0x2053ff));

          const mat = new MeshStandardMaterial({
            color: new Color(W.COLOR),
            roughness: W.ROUGHNESS,
            metalness: W.METALNESS,
            transparent: true,
            opacity: W.OPACITY,
            normalMap: normalTex,
            normalMapType: ObjectSpaceNormalMap,
            envMap: envCube,
            envMapIntensity: W.ENV_INTENSITY,
            side: DoubleSide,
          });

          // ---- Animated ripple normals (onBeforeCompile) -----------------------
          // Ported from cheapwater's water material.
          // Replace the stock <normal_fragment_maps> chunk: start from the geometric `normal`, then ADD several rotated, scrolling copies of the normal map.
          // Each layer is turned by an even fraction of a full circle and scrolls in time, so the layers never line up -- the surface ripples and moves without ever visibly repeating.
          // Because the map is OBJECT space, the sampled value is already a usable normal: no tangent-space TBN dance, no axis remap.
          const uTime = { value: 0 };
          const uWorldOffset = { value: new Vector2(0, 0) };
          mat.userData.uTime = uTime;
          mat.userData.uWorldOffset = uWorldOffset;
          mat.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = uTime;
            shader.uniforms.uWorldOffset = uWorldOffset;
            shader.uniforms.uWaveSpeed = { value: W.WAVE_SPEED };
            shader.uniforms.uOverlays = { value: W.NORMAL_OVERLAYS };
            // Cycles of the normal map per world metre, finest layer.
            // The texture .repeat is bypassed (the shader samples with explicit world UVs), so the tiling density is reproduced here instead.
            shader.uniforms.uTileFreq = {
              value: 1 / CONFIG.WATER.NORMAL_TILE,
            };

            // ---- Vertex shader: world->view rotation + world-locked XZ -------
            // vWaterViewRot: world->view rotation for the fragment shader (normalMatrix is vertex-only; same approach GroundFan uses). vWorldXZ: a world-AXIS-ALIGNED, world-LOCKED xz for sampling the ripple normal map.
            // The water plane is a child of the fan group, which is re-positioned to the bike and rotated to heading every frame -- so plane-local UVs are glued to the bike: ripples would scroll AND spin with the player, which reads as fake.
            // PRECISION: a true world xz is ~1.5e11 at 1 AU and would be destroyed by float32.
            // So: mat3(modelMatrix)*position is rotation-only (drops the group's huge translation) giving a small bike-relative, world-axis-aligned xz; the bike's world xz is then added back as a uniform that the CPU has WRAPPED modulo the tile size in float64.
            // The ripple field is thus world-locked (it stays put as the bike drives) and the GPU never sees a large number.
            // Same scheme as the terrain's updateBikeWrap.
            shader.vertexShader =
              "varying mat3 vWaterViewRot;\n" +
              "varying vec2 vWorldXZ;\n" +
              "uniform vec2 uWorldOffset;\n" +
              shader.vertexShader.replace(
                "#include <project_vertex>",
                /* glsl */ `
                #include <project_vertex>
                vWaterViewRot = mat3(viewMatrix);
                vec3 _rotLocal = mat3(modelMatrix) * position;
                vWorldXZ = _rotLocal.xz + uWorldOffset;
                `,
              );

            // ---- Fragment shader: layered scrolling normals -------------------
            shader.fragmentShader =
              "uniform float uTime;\n" +
              "uniform float uWaveSpeed;\n" +
              "uniform int uOverlays;\n" +
              "uniform float uTileFreq;\n" +
              "varying mat3 vWaterViewRot;\n" +
              "varying vec2 vWorldXZ;\n" +
              shader.fragmentShader.replace(
                "#include <normal_fragment_maps>",
                /* glsl */ `
                // Start from the geometric normal, add rotated/scrolling copies of the object-space normal map (cheapwater method).
                //
                // WORLD-LOCKED: the ripple UV is vWorldXZ (a world-axis, world-locked coordinate) scaled by uTileFreq -- NOT the plane-local vNormalMapUv. So the ripple field is pinned to the world: drive forward and the ripples stay put and slide past, which sells real motion instead of scrolling with you.
                //
                // MULTI-SCALE: each overlay layer samples at a DIFFERENT scale -- layer 0 finest, each next layer 2x coarser. A finely-tiled layer mip-averages into flat gray a short way out (that was the "two waters" seam); a coarse layer has far fewer tiles per screen pixel and stays resolved to the horizon.
                // Detail thus REDUCES smoothly with distance instead of vanishing at a line.
                vec2 worldUv = vWorldXZ * uTileFreq;
                vec3 baseNormal = normal;
                for (int i = 0; i < 10; i++) {
                  if (i >= uOverlays) break;
                  float dir = float(i) / float(uOverlays) * 6.2831853;
                  mat2 rot2d = mat2(cos(dir), -sin(dir),
                                    sin(dir),  cos(dir));
                  // Coarser per layer: layer i tiles 2^i times less often.
                  float scale = 1.0 / pow(2.0, float(i));
                  vec2 uvw = rot2d * worldUv * scale
                           + vec2(uTime * uWaveSpeed, dir);
                  vec3 subN = texture2D(normalMap, uvw).rgb * 2.0 - 1.0;
                  subN.xy = rot2d * subN.xy;
                  baseNormal += subN;
                }
                #ifdef FLIP_SIDED
                  baseNormal = -baseNormal;
                #endif
                #ifdef DOUBLE_SIDED
                  baseNormal = baseNormal * faceDirection;
                #endif
                // vWaterViewRot is the fragment-shader-safe equivalent of normalMatrix (see vertex shader above).
                normal = normalize(vWaterViewRot * baseNormal);
                `,
              );
          };

          super(geo, mat);
          this.rotation.x = -Math.PI / 2;
          this.position.y = W.LEVEL;
          this.frustumCulled = false;
          // Drawn AFTER the terrain (renderOrder) so the opaque terrain has already filled depth -- transparent water then blends over only the ground that is actually behind it.
          this.renderOrder = 1;
          this.receiveShadow = false;
          // Bind the load-timing-safe anisotropy setter (built pre-super()).
          this._applyAniso = applyAniso;
          // Bind the env-cube repaint closure + a change-detection cache, so updateSky() only repaints when the sky colours actually moved.
          this._paintEnv = paintEnv;
          this._envLowHash = -1;
          this._envHighHash = -1;
        }

        /**
         * Refresh the reflection environment from the sky's current colours.
         * Called each frame, but only repaints the cube when a colour has meaningfully changed (quantized-hash compare) -- so at a steady time-of-day this is a couple of integer comparisons and nothing else. lowColor/highColor are the sky's live uSkyColorLow / uSkyColorHigh, so the water reflection always matches the sky.
         */
        updateSky(lowColor, highColor) {
          // Quantize to 5 bits/channel -> a cheap integer hash; only a visible shift triggers a repaint.
          const lh =
            ((lowColor.r * 31) | 0) * 1024 +
            ((lowColor.g * 31) | 0) * 32 +
            ((lowColor.b * 31) | 0);
          const hh =
            ((highColor.r * 31) | 0) * 1024 +
            ((highColor.g * 31) | 0) * 32 +
            ((highColor.b * 31) | 0);
          if (lh === this._envLowHash && hh === this._envHighHash) return;
          this._envLowHash = lh;
          this._envHighHash = hh;
          this._paintEnv(lowColor, highColor);
        }

        /**
         * Advance the ripple animation and keep the ripple field world-locked.
         * @param elapsed seconds, for the scroll animation
         * @param worldX,worldZ the bike's world position (== fan group origin)
         *
         * uWorldOffset is the bike world xz, WRAPPED modulo the largest tile period.
         * The vertex shader adds it to the rotation-only local xz to reconstruct a world-locked sample coord; wrapping keeps the value small (float32-safe on the GPU) while -- because every layer's tile period divides the wrap period -- leaving the ripple field perfectly continuous.
         * Wrap is done here in JS float64, exact at any distance.
         */
        update(elapsed, worldX, worldZ) {
          this.material.userData.uTime.value = elapsed;
          // Largest tile period across all overlay layers: finest tile size times 2^(overlays-1) (layer i is 2^i coarser).
          const W = CONFIG.WATER;
          const period = W.NORMAL_TILE * Math.pow(2, W.NORMAL_OVERLAYS - 1);
          const off = this.material.userData.uWorldOffset.value;
          off.set(
            ((worldX % period) + period) % period,
            ((worldZ % period) + period) % period,
          );
        }

        /**
         * Apply the renderer's max anisotropy to the normal map.
         * Safe to call before or after the texture image has loaded -- it stashes the value and the load callback applies it if the image is not in yet.
         * (The max value is a per-renderer capability, so the Game must supply it.)
         */
        setAnisotropy(maxAniso) {
          this._applyAniso(maxAniso);
        }
      }

      // ============================================================================
      // GAME
      // ============================================================================
      class Game {
        constructor(container) {
          this.container = container;
          this.paused = false;
          this.shotsFired = 0;

          this.scene = new Scene();
          this.camera = new PerspectiveCamera(
            CONFIG.CAMERA.FOV,
            window.innerWidth / window.innerHeight,
            CONFIG.CAMERA.NEAR,
            CONFIG.CAMERA.FAR,
          );

          this.renderer = new WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance",
          });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.outputColorSpace = SRGBColorSpace;
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = PCFShadowMap;
          // Clear color is overdrawn by the skybox; keep dark so any 1-pixel gap on the horizon reads as sky rather than as a clear-color edge.
          this.renderer.setClearColor(0x000000, 1);
          container.appendChild(this.renderer.domElement);
          attachKTX2Renderer(this.renderer);

          // ---- Ground fan (terrain) ----
          this._fanGroup = new Group();
          this.scene.add(this._fanGroup);
          this._sizeFanForFOV();
          this.groundFan = new GroundFan();
          this._fanGroup.add(this.groundFan);

          // ---- Water ----
          // Animated water surface (stock MeshStandardMaterial + scrolling procedural normal maps).
          // Child of the fan group, so it follows the bike and always covers the visible area exactly like the terrain. renderOrder 1 -> drawn after the opaque terrain, so its semi- transparent surface blends over ground that is genuinely behind it; the depth buffer rejects terrain in front of it for free.
          this.water = new Water();
          this.water.setAnisotropy(
            this.renderer.capabilities.getMaxAnisotropy(),
          );
          this._fanGroup.add(this.water);

          // ---- Sky system ---- skyGroup translates with the camera each frame so the sky appears infinitely distant; it never rotates, so sun/star DIRECTIONS stay world-consistent.
          // The cloud shader's `cameraPos` uniform anchors its noise pattern to world XZ, so clouds repeat to infinity but don't slide as the camera moves.
          this.skyGroup = new Group();
          this.scene.add(this.skyGroup);

          this.skybox = new Skybox();
          this.skyGroup.add(this.skybox);
          // Sun light belongs in scene ROOT so its shadow camera operates in world coordinates rather than camera-relative.
          this.scene.add(this.skybox.sun);
          this.scene.add(this.skybox.sun.target);

          this.clouds = new Clouds();
          this.skyGroup.add(this.clouds);
          this.stars = new Stars(3000);
          this.stars.setVisible(false); // starts in day mode
          this.skyGroup.add(this.stars);

          // Lens flare.
          // Added as a CHILD OF THE CAMERA: the camera sits at ~1 AU in world space, so sprites positioned in absolute world coordinates would quantise to ~16 km float32 buckets and never land on screen.
          // As a camera child the sprites live at small local coordinates (~100 units) with full precision, and move with the camera for free.
          this.lensFlare = new LensFlare();
          this.camera.add(this.lensFlare);
          // The camera must be in the scene graph for its child (the lens flare) to be traversed and rendered -- three.js only renders objects reachable from the scene root.
          // The camera itself draws nothing, so this is purely to parent the flare.
          this.scene.add(this.camera);

          // ---- Day/night orchestrator ----
          // Fires once whenever the sky crosses sunrise/sunset boundaries.
          // Bike headlight toggles; star visibility; cloud color; hemi / ambient light intensities (which also drive the ground).
          this.skybox.onTimeOfDayChanged = (tod) => {
            const isNight = tod === "Nighttime";
            this.stars.setVisible(isNight);
            this.clouds.setCloudColor(
              isNight ? new Color(0.15, 0.18, 0.3) : new Color(1.0, 1.0, 1.0),
            );
            if (this.bike) this.bike.setNightMode(isNight);
            // Hemi/ambient track time-of-day so the world doesn't glow at midnight.
            this.skybox.hemiLight.intensity = isNight ? 0.18 : 0.5;
            this.skybox.ambientLight.intensity = isNight ? 0.18 : 0.4;
          };

          // ---- Game clock ---- Drives the day/night cycle.
          // TIME_SCALE_MINUTES real minutes = one in-game 24h cycle.
          // Wall-clock would mean ~12h between visible transitions; pointless for a demo.
          // Ticked in update().
          this._gameTime = new Date();
          this._gameTime.setHours(CONFIG.SKY.START_HOUR | 0, 0, 0, 0);
          this._gameTime.setMinutes((CONFIG.SKY.START_HOUR % 1) * 60);
          this._gameTimeScale =
            (24 * 60) / Math.max(0.1, CONFIG.SKY.TIME_SCALE_MINUTES);

          // ---- Distance / time bookkeeping for HUD ----
          // ODO is integrated 3D path length (includes vertical undulation from rolling over hills). DIST is straight-line 2D in update().
          this._runTime = 0;
          this._odoMeters = 0;
          this._lastBikeX = 0;
          this._lastBikeY = 0;
          this._lastBikeZ = 0;
          this._bikeHasLastPos = false;

          // ---- Bike ----
          this.bike = new Bike();
          this.scene.add(this.bike.group);

          this.bullets = [];
          for (let i = 0; i < CONFIG.BULLET.POOL; i++)
            this.bullets.push(new Bullet());
          // Photon-bolt trail manager.
          // The trail IS the visual representation of each bullet -- no separate "ball" sphere.
          // Trails follow their owning Bullet's live position each frame, so when the bullet hits terrain the trail stops AT the impact point and starts fading.
          this.bulletTrails = new BulletTrailManager(this.scene);
          // Scratch vectors reused by _fireBullet so the hot path stays allocation-free even when firing every frame at full cooldown.
          this._sMuzzle = new Vector3();
          this._sTrailTarget = new Vector3();
          // Reticle world position: the aim target transformed from pose-local coords into world space, so the bullet can be aimed muzzle->reticle (not pose-origin->reticle, which misses off-center).
          this._sReticleWorld = new Vector3();
          // Aim scratch: reused every frame for the camera->pointer raycast.
          this._aimNdcVec = new Vector3();
          this._aimOriginLocal = new Vector3();
          this._aimDirLocal = new Vector3();
          this._aimInvPoseMat = new Matrix4();
          // Fire-time aim-trace scratch: the camera->reticle line is traced against the visible surface once per shot to find the TRUE aim point (see _traceAim / _fireBullet).
          // Reused so firing allocates nothing.
          this._sCamWorld = new Vector3();
          this._sAimHit = new Vector3();
          this.particles = new ParticleSystem(this.scene);

          this.chaseCam = new ChaseCamera(this.camera);
          this.input = new Input();

          // ---- Engine sound state ----
          // _engineId is the Howler stream id for the looped engine sound; null = engine is silent (not started yet, or paused).
          // The rate is modulated each frame in update() proportional to bike speed.
          this._engineId = null;
          this._engineLastRate = 1.0;

          // ---- Water-ride sound state ----
          // Same lifecycle as the engine loop: one continuous stream, started after the splash and stopped on pause/blur.
          // Made audible only by VOLUME (water has no pitch), driven by _waterBlend and speed in _tickWater(). _waterLastVol caches the last applied volume so a steady cruise skips redundant Howler calls, exactly as the engine rate is quantized.
          this._waterId = null;
          this._waterLastVol = -1;

          this._loadModels();
          window.addEventListener("resize", () => this._onResize());
        }

        /**
         * Start the engine loop.
         * Called once SOUND is ready (after splash).
         * No-op if already running or if SOUND isn't initialized yet.
         */
        startEngine() {
          if (!SOUND || this._engineId != null) return;
          this._engineId = SOUND.startLoop("engine_player");
          this._engineLastRate = 1.0;
          // Water loop shares the engine's lifecycle: start it here too.
          // It begins silent (manifest vol 0) and _tickWater() fades it in only when the bike is actually on water.
          if (this._waterId == null) {
            this._waterId = SOUND.startLoop("water_ride");
            this._waterLastVol = -1;
            if (this._waterId != null) {
              SOUND.setVolume("water_ride", this._waterId, 0);
            }
          }
        }
        /** Stop the engine loop (e.g., on pause / blur). */
        stopEngine() {
          if (!SOUND) return;
          if (this._engineId != null) {
            SOUND.stopLoop("engine_player", this._engineId);
            this._engineId = null;
          }
          if (this._waterId != null) {
            SOUND.stopLoop("water_ride", this._waterId);
            this._waterId = null;
          }
        }
        /** Set engine pitch from speed. Pre-quantized to avoid Howler churn. */
        _tickEngine() {
          if (!SOUND || this._engineId == null) return;
          // Pitch maps speed/SPEED_MAX → 0.6..1.6 rate. Idle floor 0.6, max 1.6.
          const frac = clamp(this.bike.speed / CONFIG.BIKE.SPEED_MAX, 0, 1);
          const rate = 0.6 + frac * 1.0;
          // Quantized to avoid spamming Howler with sub-cent rate updates. 5% bins keep the modulation smooth-sounding while skipping ~95% of would-be calls during a steady cruise.
          const quant = Math.round(rate * 20) / 20;
          if (quant !== this._engineLastRate) {
            this._engineLastRate = quant;
            SOUND.setRate("engine_player", this._engineId, quant);
          }
        }
        /**
         * Set the water-ride loop volume from how submerged the bike is and how fast it is moving.
         * The loop always plays; only its volume moves.
         *
         * volume = WATER_VOL_MAX * _waterBlend * speedTerm
         *
         * - _waterBlend (0 on land, eased to 1 on open water) gates the sound to water and gives a pop-free shoreline crossfade for free.
         * - speedTerm rises with speed but keeps a small floor so idling on water still has a faint lap, then climbs so a fast crossing has a clear rushing wash -- the audio thus tracks the same speed the water deceleration is bleeding away, which sells the slowdown.
         * Volume is quantized to 5% bins (like the engine rate) so a steady cruise issues no Howler calls at all.
         */
        _tickWater() {
          if (!SOUND || this._waterId == null) return;
          const wb = this.bike._waterBlend || 0;
          const frac = clamp(this.bike.speed / CONFIG.BIKE.SPEED_MAX, 0, 1);
          // speedTerm: 0.25 floor (faint lap at a standstill) -> 1.0 at top speed.
          // Eased (frac*frac) so the wash swells noticeably as the bike picks up rather than rising flatly.
          const speedTerm = 0.25 + 0.75 * frac * frac;
          const vol = CONFIG.WATER.SOUND_VOL_MAX * wb * speedTerm;
          const quant = Math.round(vol * 20) / 20;
          if (quant !== this._waterLastVol) {
            this._waterLastVol = quant;
            SOUND.setVolume("water_ride", this._waterId, quant);
          }
        }

        _sizeFanForFOV() {
          // Pick HALF_ANGLE based on the camera's actual horizontal field of view so the wedge always slightly overhangs what's visible. 1.35× safety on half-HFOV gives comfortable margin for bank, lean, and brief steer-camera lag.
          // Capped at π (full disc).
          const vfov = (CONFIG.CAMERA.FOV * Math.PI) / 180;
          const aspect = window.innerWidth / window.innerHeight;
          const hHalf = Math.atan(Math.tan(vfov / 2) * aspect);
          CONFIG.FAN.HALF_ANGLE = Math.min(Math.PI, hHalf * 1.35);
        }

        async _loadModels() {
          const bikeGlb = await loadGlbAsync(assetURL(CONFIG.BIKE.MODEL_URL));
          if (bikeGlb) this.bike.setModel(bikeGlb.clone(true));
          const riderGlb = await loadGlbAsync(assetURL(CONFIG.RIDER.URL));
          if (riderGlb) this.bike.attachRider(riderGlb);
        }

        _onResize() {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          const oldHalf = CONFIG.FAN.HALF_ANGLE;
          this._sizeFanForFOV();
          if (Math.abs(CONFIG.FAN.HALF_ANGLE - oldHalf) > 0.03) {
            // The wedge angle changed -> the fan needs a new vertex layout.
            // Swap ONLY the geometry on the existing mesh; the ShaderMaterial is unchanged, so this avoids a multi-millisecond shader recompile -- rebuilding the whole GroundFan would force exactly that recompile on every resize.
            const oldGeo = this.groundFan.geometry;
            this.groundFan.geometry = makeFanGeometry();
            oldGeo.dispose();
          }
        }

        update(dt, elapsed) {
          const inputs = this.input.poll();
          this.bike.update(dt, inputs);
          // Establish the bike's pose matrix ONCE per frame, here, right after update() finalised pitch/lean/roll. _fireBullet and the end-of-frame visual transform both read it instead of each recomputing it.
          this.bike.syncPose();

          // ---- Pointer aim ---- Build a camera-space ray from the pointer's NDC, rotate it into world space, transform it into the bike's pose-local space, and intersect the plane z = -30 (where the reticle lives).
          // The hit point, in pose-local coords, becomes the aim target.
          //
          // PRECISION (huge world coords): the naive approach -- ndc.unproject(camera) then .sub(camera.position) -- is BROKEN at 1 AU. unproject() yields a world point ~1.5e11; subtracting the camera position (also ~1.5e11) is catastrophic cancellation: two near-equal float64s differing by only tens of metres leave ~4-5 good digits in the result.
          // The ray direction comes out garbage, so the photon flies sideways -- and because the surviving error drifts with the bike position, it *looks* like it intermittently self-corrects.
          // It never does; it just fluctuates.
          //
          // Instead: a ray DIRECTION depends only on the projection and the camera's ORIENTATION, never its position.
          // Unproject in a translation-free frame (projectionMatrixInverse only) to get a camera-space direction, then rotate it by the camera quaternion.
          // No huge number is ever subtracted, so the direction stays full-precision at any world magnitude.
          {
            const pose = this.bike._poseGroup;
            // NDC -> camera-space direction. unproject with the inverse PROJECTION matrix alone (no view matrix) keeps the camera at the origin, so there is no large translation in play.
            this._aimNdcVec
              .set(this.input.aimNdcX, this.input.aimNdcY, 0.5)
              .applyMatrix4(this.camera.projectionMatrixInverse);
            // Camera-space direction -> world-space direction (rotation only).
            this._aimNdcVec.applyQuaternion(this.camera.quaternion);
            // Transform ray origin (camera pos) + direction into pose-local. applyMatrix4 of a point through the inverse pose matrix is a float64 op; the bike and camera share the same huge offset, so the resulting pose-local origin is small and precise.
            this._aimInvPoseMat.copy(pose.matrixWorld).invert();
            this._aimOriginLocal
              .copy(this.camera.position)
              .applyMatrix4(this._aimInvPoseMat);
            this._aimDirLocal
              .copy(this._aimNdcVec)
              .transformDirection(this._aimInvPoseMat);
            // Intersect pose-local plane z = -30: originLocal.z + t * dirLocal.z = -30
            const dz = this._aimDirLocal.z;
            if (Math.abs(dz) > 1e-6) {
              const t = (-30 - this._aimOriginLocal.z) / dz;
              if (t > 0) {
                const ax = this._aimOriginLocal.x + t * this._aimDirLocal.x;
                const ay = this._aimOriginLocal.y + t * this._aimDirLocal.y;
                // The clamp is a SANITY BACKSTOP, not a gameplay limit.
                // A box tighter than the screen itself projects to at z=-30 would make cursor positions near the corners hit the clamp, so the reticle stops short of the pointer (the "unreachable corners" frustration).
                //
                // At FOV 50 and a wide aspect, an on-screen ray reaches well past +/-40 horizontally and roughly [-26, 32] vertically at 30 m depth.
                // The clamp sits generously past that so every visible pixel is reachable while still rejecting NaN / runaway values from a degenerate (near-parallel) ray.
                this.bike.setAim(clamp(ax, -60, 60), clamp(ay, -34, 40), -30);
              }
            }
          }

          // ---- Distance / time / clock bookkeeping ---- ODO is 3D path length (includes vertical motion from hills), DIST is straight-line 2D from origin (computed in the HUD update).
          // One extra multiply/add per frame for the Y axis -- measurably indistinguishable from the 2D version on any GPU, semantically much closer to a real odometer.
          this._runTime += dt;
          if (this._bikeHasLastPos) {
            const dx = this.bike.worldX - this._lastBikeX;
            const dy = this.bike.worldY - this._lastBikeY;
            const dz = this.bike.worldZ - this._lastBikeZ;
            this._odoMeters += Math.sqrt(dx * dx + dy * dy + dz * dz);
          } else {
            this._bikeHasLastPos = true;
          }
          this._lastBikeX = this.bike.worldX;
          this._lastBikeY = this.bike.worldY;
          this._lastBikeZ = this.bike.worldZ;

          // ---- Game clock ---- Advance in scaled wall-time. setTime(...) on a Date adds ms; the sky update reads the resulting hours+minutes.
          this._gameTime.setTime(
            this._gameTime.getTime() + dt * this._gameTimeScale * 1000,
          );

          // ---- Terrain fan tracks the bike ---- The fan is centered slightly BEHIND the bike along -forward, so the inner-radius vertex pole sits out of view behind the camera.
          //
          // INFINITE TERRAIN: the GPU samples a PERIODIC Perlin noise.
          // The bike origin is passed wrapped modulo each octave's period -- computed in JS float64, so it's exact at any distance -- and the shader adds only the small local fan offset.
          // The GPU therefore never sees a large noise input and stays float32-clean at 1e6 m, 1e9 m, anywhere.
          //
          // gl_Position itself is also fine at huge coords: three.js combines view*model on the CPU in float64 before upload, so the eye-space result is small and precise even when the model translation is huge.
          const fanBackOff = CONFIG.FAN.CENTER_OFFSET_BEHIND;
          const fanX = this.bike.worldX - this.bike.fx * fanBackOff;
          const fanZ = this.bike.worldZ - this.bike.fz * fanBackOff;
          this._fanGroup.position.set(fanX, 0, fanZ);
          this._fanGroup.rotation.y = -this.bike.heading;
          // Push the per-octave wrapped bike origin.
          // Microsecond cost; no per-vertex CPU work -- the GPU does all terrain displacement.
          this.groundFan.updateBikeWrap(fanX, fanZ);

          // ---- Firing / bullets / particles ----
          if (inputs.fire && this.bike.tryFire()) {
            // Muzzle report: tied to tryFire() (which enforces FIRE_COOLDOWN), not to the outer inputs.fire,
            // so trigger-spam cannot chatter the sound faster than the weapon can actually cycle.
            // Played here, independent of bullet flight, so sky shots and over-fan shots are still audible -- only the impact 'boom' is conditional on a visible surface hit.
            if (SOUND) SOUND.play("shot");
            this._fireBullet();
            this.shotsFired++;
          }
          for (const b of this.bullets) {
            if (!b.active) continue;
            const hit = b.update(dt);
            if (hit) {
              // Only detonate if the impact is within the fan -- i.e. on terrain the player can actually see.
              // A bullet can "hit" the infinite analytic terrain far past the fan edge, where no ground is rendered; bursting there would hang sparks in empty space.
              // The bullet itself has already despawned inside update() this frame either way, so a far hit just frees its pool slot silently.
              // Distance is measured from the bike, the moving centre the fan is rebuilt around every frame.
              const hdx = hit.x - this.bike.worldX;
              const hdz = hit.z - this.bike.worldZ;
              const er = CONFIG.BULLET.EXPLODE_RADIUS;
              if (hdx * hdx + hdz * hdz <= er * er) {
                // Lift the burst origin slightly along the hit normal so sparks emerge ABOVE the surface, not from inside it. hit.onWater picks the spark palette: a water hit bursts a cool white/blue spray, a terrain hit the orange fire ramp.
                this.particles.burst(
                  hit.x + hit.nx * 0.1,
                  hit.y + hit.ny * 0.1,
                  hit.z + hit.nz * 0.1,
                  60,
                  hit.nx,
                  hit.ny,
                  hit.nz,
                  hit.onWater ? 1 : 0,
                );
                // Spatial boom at the impact: feed the panner the BIKE-RELATIVE offset (float64 subtract here, small result), never the ~1e11 world coord. hdx/hdz are already computed above for the fan test; reuse them, add the Y delta.
                if (SOUND)
                  SOUND.playAt("boom", hdx, hit.y - this.bike.worldY, hdz);
              }
            }
          }
          // Particles rebase against the bike position (floating origin) so sparks stay float32-precise and world-stable at any distance.
          this.particles.update(
            elapsed,
            this.bike.worldX,
            this.bike.worldY,
            this.bike.worldZ,
          );

          // ---- Photon trails ---- Update first (advance heads / retract tails), then push the bike's world XZ into the fog uniform so distance-based alpha attenuation is computed from the player, not from the world origin.
          if (this.bulletTrails) {
            this.bulletTrails.setPlayerXZ(this.bike.worldX, this.bike.worldZ);
            // Live muzzle world position -- same formula _fireBullet uses to spawn bolts.
            // Flying trails anchor their tail here so the photon streak stays glued to the gun barrel as the bike moves; without this, a shot fired sideways at speed leaves its streak's tail pinned to the dirt, visually detached from the weapon.
            this.bulletTrails.setMuzzle(
              this.bike.worldX + this.bike.fx * CONFIG.BULLET.MUZZLE_FORWARD,
              this.bike.cachedCenterGroundY + CONFIG.BULLET.MUZZLE_HEIGHT,
              this.bike.worldZ + this.bike.fz * CONFIG.BULLET.MUZZLE_FORWARD,
            );
            this.bulletTrails.update();
          }

          // ---- Sky pipeline ----
          // 1. Lock the sky group to the camera so the sky is "infinitely distant" (positions track, rotations don't -- directions stay world-stable, which is what makes stars consistent).
          // 2. Update skybox colors / sun light from the current game clock.
          // 3. Tick clouds/stars uniforms.
          this.skyGroup.position.copy(this.camera.position);
          this.skybox.update(this._gameTime, this.bike.group.position);
          this.clouds.update(dt, this.camera.position);
          this.stars.update(elapsed);

          // ---- Lens flare ---- Two-phase, cheap-test-first. _projectSun() is a handful of arithmetic ops; it decides whether the sun is even on screen.
          // Only then does the camera->sun terrain occlusion march run (up to ~40 sampleTerrain calls).
          // While steering freely the sun is off screen most of the time, so the march is skipped most frames.
          // Daytime-gated; strength fades with sun elevation so the flare eases in/out through dawn/dusk instead of popping.
          {
            const sky = this.skybox;
            let flareStrength = 0;
            const isDay = sky._timeOfDay && sky._timeOfDay !== "Nighttime";
            if (
              isDay &&
              this.lensFlare._projectSun(this.camera, sky._sunDirection)
            ) {
              // Sun elevation 0..42deg -> ramp 0..1 over the first ~14deg so the flare is full strength once the sun is properly up.
              flareStrength = Math.max(0, Math.min(1, sky.sunElevation / 14));
              if (flareStrength > 0) {
                // Occlusion: march camera -> sun against the visible surface.
                // If the ray dips below terrain within the local reach, the sun is blocked -> kill the flare.
                // Reuses _surfaceHeight, the same analytic-terrain probe the bullet aim trace uses.
                const cam = this.camera.position;
                const sd = sky._sunDirection;
                const STEP = 6;
                const REACH = 240; // only nearby terrain can occlude
                for (let d = STEP; d <= REACH; d += STEP) {
                  if (
                    cam.y + sd.y * d <
                    this._surfaceHeight(cam.x + sd.x * d, cam.z + sd.z * d)
                  ) {
                    flareStrength = 0;
                    break;
                  }
                }
              }
            }
            this.lensFlare.update(flareStrength);
          }

          this.water.update(elapsed, this.bike.worldX, this.bike.worldZ);
          // Refresh the water's reflection environment from the sky's live gradient colours. skybox.update() above has already set these for this frame; updateSky() only repaints the env cube when a colour actually shifted, so this is near-free at a steady time of day.
          this.water.updateSky(
            this.skybox.material.uniforms.uSkyColorLow.value,
            this.skybox.material.uniforms.uSkyColorHigh.value,
          );

          // ---- Terrain lighting ---- Nothing to do here.
          // The GroundFan is a stock MeshStandardMaterial (with injected noise displacement + a per-pixel analytical normal), so it is lit by the real scene lights -- the sun DirectionalLight, the AmbientLight, the HemisphereLight, and the bike's headlight SpotLight -- automatically.
          // The day/night orchestrator already animates those lights' colours and intensities; the ground tracks them for free, no per-frame uniform push.

          // ---- Final bike visual transform + camera ----
          this.bike.applyVisualTransform();
          this.chaseCam.update(dt, this.bike);

          // ---- Audio listener orientation ----
          // Listener POSITION is pinned at origin (see SoundManager ctor); only orientation tracks the bike each frame so spatial sources (the impact boom) pan correctly as you turn. bike.fx/fz are the unit heading vector, already maintained every frame.
          if (SOUND) SOUND.setListenerOrientation(this.bike.fx, this.bike.fz);

          // ---- Engine pitch + water wash ----
          this._tickEngine();
          this._tickWater();

          // ---- Cockpit HUD ---- Pass raw scalars; BikeHUD.update() does change-detection BEFORE any string formatting, so a steady cruise allocates ZERO strings per frame.
          // The Date instance and run-time integer are also pre-computed here so they're shared by both the HUD and any future consumers (e.g. timed events).
          if (this.bike.hud) {
            const tripMeters = Math.sqrt(
              this.bike.worldX * this.bike.worldX +
                this.bike.worldZ * this.bike.worldZ,
            );
            this.bike.hud.update(
              dt,
              this.bike.speed,
              this._odoMeters,
              tripMeters,
              // Water-clamped surface height: reads ~0 on water, true ground on land -- NOT the submerged terrain under the waterline.
              this.bike._displayAltY,
              this.bike.heading,
              this._gameTime,
              this._runTime,
            );
          }
        }

        /**
         * Visible surface height at a world XZ: terrain clamped up to the waterline, identical to the bullet's collision surface.
         * A plain method, not a per-call closure, so a shot allocates nothing.
         */
        _surfaceHeight(x, z) {
          const ty = sampleTerrain(x, z);
          const waterY = CONFIG.WATER.LEVEL;
          return ty < waterY ? waterY : ty;
        }

        /**
         * Trace the player's eye-line against the visible surface.
         *
         * The reticle is a point on a fixed 30 m plane; the line the player is actually aiming along is camera -> reticle, EXTENDED.
         * This walks that line until it crosses below the visible surface -- max(terrain, waterline), the same surface the bullet collides with and the same one the player sees -- and refines the crossing by bisection.
         *
         * Why not the bullet's per-substep collision march: that exists to stop a 970 m/s bullet skipping a hill BETWEEN FRAMES.
         * This is a single ray walked once, at fire time, gated by the 0.18 s fire cooldown -- so a coarse 2 m step (terrain features are ~95 m wide, far wider) cannot skip a hill, and one bisection pass nails the crossing to well under a metre.
         * Cost is a few dozen sampleTerrain calls per TRIGGER PULL, not per frame.
         *
         * @param camX,camY,camZ ray origin (camera world position)
         * @param dirX,dirY,dirZ unit ray direction (camera -> reticle)
         * @param out Vector3 to receive the hit point
         * @returns the distance camera->hit, or -1 if the line never meets the surface within range (a sky / horizon shot)
         */
        _traceAim(camX, camY, camZ, dirX, dirY, dirZ, out) {
          const STEP = 2.0; // coarse march; << terrain feature width (~95 m)
          const MAX_DIST = CONFIG.BULLET.MAX_RANGE; // no point past the trail
          let prevD = 0;
          let prevAbove = camY > this._surfaceHeight(camX, camZ); // ray above surface here
          // The camera normally starts above ground; if it somehow starts below (clipped into a hill) there is no meaningful trace.
          if (!prevAbove) return -1;
          for (let d = STEP; d <= MAX_DIST; d += STEP) {
            const px = camX + dirX * d;
            const py = camY + dirY * d;
            const pz = camZ + dirZ * d;
            const above = py > this._surfaceHeight(px, pz);
            if (!above) {
              // Crossed the surface between prevD and d. Bisect to refine.
              let lo = prevD,
                hi = d;
              for (let i = 0; i < 8; i++) {
                const mid = (lo + hi) * 0.5;
                const mx = camX + dirX * mid;
                const my = camY + dirY * mid;
                const mz = camZ + dirZ * mid;
                if (my > this._surfaceHeight(mx, mz)) lo = mid;
                else hi = mid;
              }
              const hitD = (lo + hi) * 0.5;
              out.set(
                camX + dirX * hitD,
                camY + dirY * hitD,
                camZ + dirZ * hitD,
              );
              return hitD;
            }
            prevD = d;
          }
          return -1; // never met the surface within range -> sky shot
        }

        _fireBullet() {
          const b = this.bullets.find((x) => !x.active);
          if (!b) return;

          // ---- Muzzle (visual origin) ---- The photon leaves the front headlight barrel.
          // The muzzle XZ is locked to the bike's fixed chassis forward (fx, fz) so the visual origin doesn't slide around as the player aims; only the velocity vector below depends on where the reticle is.
          const muzzleX =
            this.bike.worldX + this.bike.fx * CONFIG.BULLET.MUZZLE_FORWARD;
          const muzzleY =
            this.bike.cachedCenterGroundY + CONFIG.BULLET.MUZZLE_HEIGHT;
          const muzzleZ =
            this.bike.worldZ + this.bike.fz * CONFIG.BULLET.MUZZLE_FORWARD;

          // ---- Aim direction: muzzle -> reticle WORLD position ---- The reticle is a POINT in pose-local space.
          // Transform it into WORLD space, then aim from the actual muzzle to that world point so the bolt passes through the reticle from wherever the muzzle physically is (the muzzle is offset from the pose origin).
          //
          // The pose world matrix is already current: Game.update() calls bike.syncPose() once, right after bike.update() finalised this frame's pitch/lean/roll.
          // No need to re-establish it here.
          const pose = this.bike._poseGroup;
          this._sReticleWorld
