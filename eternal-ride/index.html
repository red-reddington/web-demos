    <script type="module">
      import {
        AdditiveBlending,
        AmbientLight,
        BackSide,
        BoxGeometry,
        BufferAttribute,
        BufferGeometry,
        CanvasTexture,
        CircleGeometry,
        Color,
        ConeGeometry,
        CubeTexture,
        DirectionalLight,
        DoubleSide,
        DynamicDrawUsage,
        Euler,
        FrontSide,
        Group,
        HemisphereLight,
        InstancedBufferAttribute,
        InstancedBufferGeometry,
        InstancedMesh,
        LinearFilter,
        MathUtils,
        Matrix4,
        Mesh,
        MeshBasicMaterial,
        MeshLambertMaterial,
        MeshStandardMaterial,
        NormalBlending,
        ObjectSpaceNormalMap,
        PCFShadowMap,
        PerspectiveCamera,
        PlaneGeometry,
        Points,
        Quaternion,
        RepeatWrapping,
        Scene,
        ShaderMaterial,
        SphereGeometry,
        SpotLight,
        Sprite,
        SpriteMaterial,
        SRGBColorSpace,
        TextureLoader,
        Timer,
        Vector2,
        Vector3,
        WebGLRenderer,
      } from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
      import { Howl, Howler } from "howler";
      import nipplejs from "nipplejs";

      // ============================================================================
      // CONFIG
      // ============================================================================
      const CONFIG = {
        ASSET_BASE:
          "https://raw.githubusercontent.com/red-reddington/web-demos/main/eternal-ride/",
        CAMERA: {
          FOV: 50,
          NEAR: 0.1,
          FAR: 1500,
          HEIGHT: 0.74,
          BACK: 0.01,
          LOOK_AHEAD: 25,
          LOOK_HEIGHT: 0.052,
        },
        BIKE: {
          SPEED_MIN: 0,
          SPEED_MAX: 35,
          SPEED_INIT: 14,
          ACCEL: 9,
          DECEL: 18,
          DRAG: 2.5,
          TURN_RATE_MAX: 1.1,
          TURN_RATE_MIN_FACTOR: 0.35,
          TURN_LERP: 5,
          LEAN_MAX: 0.65,
          LEAN_LERP: 7,
          MAX_ROLL: 1.05, // ~60 degrees - prevents inversion
          WHEELBASE: 1.45,
          HALF_TRACK: 0.4,
          HEADING_CORRECTION: -Math.PI,
          MODEL_SCALE: 1.0,
          MODEL_Y_OFFSET: 0.279,
          BODY_COLOR: 0xc83232,
          MODEL_URL: "assets/models/motorcycle_compressed.glb",
        },
        RIDER: {
          URL: "assets/models/arms_compressed.glb",
          POS: { x: 0, y: -0.426, z: 0.44 },
          ROT: { x: -0.55, y: 0, z: 0 },
          SCALE: 0.65,
        },
        BULLET: {
          POOL: 24,
          // Hypersonic bolt. Collision is made safe for any speed by the distance-based substepping in Bullet.update() -- the bullet always advances in <=1 m increments per terrain test, so it cannot tunnel through a hill no matter how fast it travels.
          SPEED: 970,
          GRAVITY: -22,
          MUZZLE_FORWARD: 0.7,
          MUZZLE_HEIGHT: 0.55,
          MUZZLE_PITCH: 0.18,
          FIRE_COOLDOWN: 0.18,
          // The three range limits below are NOT independent magic numbers -- they all derive from one concept, the terrain fan radius, and are computed from FAN.RADIUS in the derivation block right after this CONFIG literal (FAN is declared later, so it cannot be referenced here).
          // Set FAN.RADIUS and these follow; they cannot drift apart.
          // EXPLODE_RADIUS = FAN.RADIUS (detonate only on visible ground) MAX_RANGE = FAN.RADIUS * 1.07 (trail/trace span, slight margin) MAX_LIFETIME = MAX_RANGE / SPEED + 0.05 (despawn just past visible)
          MAX_LIFETIME: null, // derived -- see post-CONFIG block
          MAX_RANGE: null, // derived
          EXPLODE_RADIUS: null, // derived
        },
        // ---- Photon trail (visual only; collision lives in `Bullet`) ----
        // The trail is an instanced quad-strip per shot; one ShaderMaterial, one InstancedBufferGeometry, one draw call for ALL bullets in flight.
        // Per-segment uniforms come from per-instance attributes that the JS updates in-place each frame -- no allocation in the hot loop.
        BULLET_TRAILS: {
          ENABLED: true,
          MAX_TRAILS: 16,
          SEGMENTS_PER_TRAIL: 16,
          TRAIL_LENGTH: 18,
          LIFETIME_MS: 280,
          BULLET_SPEED: 110,
          WIDTH_HEAD: 0.04,
          WIDTH_TAIL: 0.14,
          COLOR_HEAD: { r: 1.0, g: 0.95, b: 0.7, a: 1.0 },
          COLOR_MID: { r: 1.0, g: 0.5, b: 0.15, a: 0.55 },
          COLOR_TAIL: { r: 0.3, g: 0.1, b: 0.05, a: 0.05 },
        },
        TERRAIN: {
          OCTAVE_A_SCALE: 95,
          OCTAVE_A_AMP: 2.6,
          OCTAVE_B_SCALE: 200,
          OCTAVE_B_AMP: 5,
          NOISE_SEED: 0x9e3779b9,
        },
        FAN: {
          // ---- Terrain fan geometry -------------------------------------------------
          // A wedge of triangles centered on the bike's forward heading.
          // The fan's CENTER is offset slightly BEHIND the bike (CENTER_OFFSET_BEHIND) so the inner-radius pole — where ring vertices crowd into a single point and float math becomes unstable — sits behind the player and is never visible.
          // The bike rides on the front of the fan; the problematic spot is parked out of view.
          //
          // HALF_ANGLE is overwritten at runtime by _sizeFanForFOV() to match the actual viewport aspect (so a wider window gets a wider wedge).
          // The default below is just a sensible fallback.
          // ---------------------------------------------------------------------------
          RADIUS: 300,
          INNER_RADIUS: 0.5,
          RINGS: 64,
          // ---- Angular tessellation: constant density --
          // The fan is a wedge whose width (HALF_ANGLE) tracks the viewport aspect.
          // ANGULAR RESOLUTION is held constant: SECTOR_DENSITY segments per radian of sweep. makeFanGeometry() then derives the actual sector count from the current HALF_ANGLE,
          // so every triangle subtends the same visual angle and the same on-screen size regardless of aspect ratio -- a portrait phone (narrow wedge) draws proportionally fewer triangles; an ultrawide draws more, exactly as it should.
          // Density is tuned so the FOV-50 case (HALF_ANGLE 1.05 -> 2.1 rad sweep) lands at ~88 sectors.
          SECTOR_DENSITY: 41.9, // sectors per radian of sweep
          SECTORS_MIN: 12, // floor: keeps a usable mesh at any tiny FOV
          SECTORS_MAX: 220, // ceiling: caps cost on a 360-deg full annulus
          HALF_ANGLE: 1.05, // overwritten by _sizeFanForFOV()
          BUFFER_RINGS: 0,
          RAMP_EXP: 2.1,
          // Shift the fan's center BEHIND the bike by this many meters along -forward.
          // Hides the inner-radius singularity behind the camera.
          // Set to 0 to render with center directly under the bike (exposes the pole on certain views).
          CENTER_OFFSET_BEHIND: 1.0,
        },
        // ---- Water -----------------------------------------------------------
        // A single flat plane at the water line, shaded by an animated ripple material (see the Water class).
        // The plane is a child of the terrain fan group, so it inherits the bike-follow position + heading and always covers the visible area.
        WATER: {
          // Slightly below zero so it reads as "sea level".
          // Where terrain dips below this, water shows; where terrain rises above, the ground occludes the plane.
          LEVEL: -0.0001,
          // Water plane half-size.
          // Must sit STRICTLY INSIDE the terrain fan, never beyond it.
          // The fan reaches FAN.RADIUS (300 m) forward; the semi-transparent water is only believable where there is terrain UNDER it.
          // A half-size larger than the fan radius would leave a ring of water with no ground beneath it, showing the sky through and reading as a thin lighter strip at the horizon (the "second water" artifact).
          // Half-size 280 keeps the water's forward edge at 280 m, comfortably under the 300 m fan arc, with margin for the fan being centred ~1 m behind the bike.
          // The square's corners (280*sqrt2 ~= 396 m) fall off to the sides, outside the view frustum / fan wedge, so they are never visible.
          // A smaller plane is also cheaper for normal-map tiling.
          SIZE: 280,
          COLOR: 0x5a75a0, // cheapwater's water tint
          ROUGHNESS: 0.27, // cheapwater's value
          // METALNESS: water has a reflection environment (the sky-tinted cube), so a touch of metalness is correct and makes the sky glint read.
          // Not Kunze's full 1.0 -- the envMap is a soft gradient, not a detailed sky, so a moderate value keeps the reflection believable rather than mirror-hard.
          METALNESS: 0.35,
          OPACITY: 0.82, // semi-transparent: terrain shows through shallows
          // Strength of the sky reflection on the water. 1.0 = full; a little under keeps the water tint (COLOR) reading through the reflection.
          ENV_INTENSITY: 0.85,
          // ---- Riding on water: deceleration ----------------------------------
          // Water is treated as a flat surface (the wheel samples are clamped to the waterline), so there is no depth to model -- riding on it just costs speed.
          // On water the bike slows to a cruising cap of SPEED_MAX * SPEED_MAX_MULT.
          // SPEED_MAX_MULT is the fraction of BIKE.SPEED_MAX still reachable on open water; kept high enough that the bike clearly keeps moving forward (this is a momentum game).
          // DRAG is the braking COEFFICIENT: while above the cap the bike decelerates by DRAG * _waterBlend * (overspeed) per second, an exponential bleed with a time constant of roughly 1/DRAG seconds.
          // ~1.0 gives a ~1 s slowdown from full speed; raise it for a sharper brake, lower it for a longer glide onto the water.
          SPEED_MAX_MULT: 0.52,
          DRAG: 1.1,
          // Peak volume of the riding-on-water wash loop, reached at full speed on open water.
          // Scaled down by _waterBlend and speed each frame in _tickWater().
          // Kept under the engine's 0.45 so the wash sits beneath the engine note rather than masking it.
          SOUND_VOL_MAX: 0.4,
          WAVE_SPEED: 0.03, // normal-map scroll speed (cheapwater's value)
          NORMAL_OVERLAYS: 3, // rotated/scrolling normal-map layers summed (1-10)
          // Metres per normal-map tile for the BASE (finest) layer.
          // The overlay loop derives coarser layers from this (see Water).
          // With the fan-sized plane (720 units) this gives 720/24 = 30 repeats for the finest layer -- fine ripples near the bike -- while the coarser overlay layers carry visible normals to the horizon.
          NORMAL_TILE: 24,
        },
        // ---- In-world cockpit dashboard HUD (textured plane mounted on bike) ----
        HUD: {
          POS: { x: -0.003, y: 0.663, z: -0.265 },
          TILT_X: -0.73,
          WIDTH: 0.066,
          HEIGHT: 0.05,
          REDRAW_HZ: 10,
        },
        // ---- Day/night cycle ----
        // Starts at 2 AM (dead of night so the headlight rig is on from the first frame) and cycles a full 24h every TIME_SCALE_MINUTES real minutes -- 6.
        SKY: {
          TIME_SCALE_MINUTES: 6,
          START_HOUR: 2,
        },
        PARTICLES: {
          SPARK_MAX: 320,
          // Fire palette for the spark gradient: hot core -> mid -> cool rim.
          // The fragment shader ramps between these by radius, per-spark randomness, and remaining life, so a burst reads as fire rather than a field of identical orange dots.
          SPARK_HOT: 0xfff2c0, // white-hot core
          SPARK_MID: 0xff9a2e, // orange body
          SPARK_COOL: 0xc01808, // deep-red rim / dying ember
          // Water-hit palette: a bullet striking the water bursts a cool white/blue spray instead of fire.
          // Same three-stop hot->mid->cool ramp the fire gradient uses -- only the colours change -- so the radius ramp, per-spark variation and life-fade all carry over unchanged (a cooling droplet fades just like a cooling ember).
          // Stylised slightly bluer than real spray for instant readability.
          SPLASH_HOT: 0xffffff, // white spray core
          SPLASH_MID: 0xbfe4ff, // pale cyan
          SPLASH_COOL: 0x3f7fd8, // soft blue droplet edge
        },
      };

      // ---- Derived constants -----------------------------------------------
      // Single source of truth for bullet range: the terrain fan radius.
      // The bullet should detonate only on visible ground, its trail/trace should span the visible world plus a slim margin, and it should despawn just after clearing that span.
      // Deriving all three here -- instead of hand-tuning three separate magic numbers -- means changing FAN.RADIUS alone keeps them consistent; they physically cannot drift apart.
      CONFIG.BULLET.EXPLODE_RADIUS = CONFIG.FAN.RADIUS;
      CONFIG.BULLET.MAX_RANGE = CONFIG.FAN.RADIUS * 1.07;
      CONFIG.BULLET.MAX_LIFETIME =
        CONFIG.BULLET.MAX_RANGE / CONFIG.BULLET.SPEED + 0.05;

      // ============================================================================
      // UTILITIES
      // ============================================================================
      // Prevent iOS Safari double-tap zoom WITHOUT interfering with joystick movement, multi-touch, or normal taps.
      // Only cancel the SECOND tap of a rapid double-tap gesture.
      let __lastTouchEnd = 0;

      document.addEventListener(
        "touchend",
        (e) => {
          const now = performance.now();

          if (now - __lastTouchEnd <= 300) {
            e.preventDefault();
          }

          __lastTouchEnd = now;
        },
        { passive: false },
      );

      const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
      const isTouchOnly = () =>
        ("ontouchstart" in window || navigator.maxTouchPoints > 0) &&
        !matchMedia("(pointer:fine)").matches;
      const assetURL = (p) =>
        /^(https?:)?\/\//i.test(p) ? p : CONFIG.ASSET_BASE + p;

      function toggleFullscreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen)?.call(
            document,
          );
        }
      }

      // ============================================================================
      // TERRAIN -- infinite periodic Perlin noise, precision-perfect at any distance
      // ============================================================================
      // The problem: a vertex shader computes in float32 (~7 significant digits).
      // At worldX = 1.2e7 m, float32 resolves only ~1 m.
      // Two adjacent fan vertices' world-XZ inputs round to the SAME float32 value; the noise function -- wildly nonlinear in its input -- then returns the SAME height for both, and the triangle between them degenerates.
      // That is the "tearing far from origin" bug.
      // It is NOT fixed by more precision; it is fixed by never letting the noise function see a large input.
      //
      // The fix: a noise that is EXACTLY periodic in input space with period P, so noise(x) === noise(x mod P) is an identity.
      // The bike's origin is wrapped modulo P on the CPU (JS float64 -- exact at any magnitude), the small wrapped value is handed to the GPU as a uniform, and the shader adds only the local fan-vertex offset (<= fan radius).
      // The GPU never sees an input larger than ~P + fanRadius/scale, so float32 is always precise.
      //
      // Why no visible seam: P is chosen so P*scale >> fan radius, so the player can never see two copies of the tile at once.
      // Octave A: P=256, scale=95m -> tile is 24,320 m wide vs a ~220 m fan.
      // Invisible.
      //
      // Ashima simplex CANNOT be used here -- its skew step breaks input-space periodicity (shifting by 289 shifts the lattice index by a non-integer).
      // Periodic Perlin (axis-aligned gradient lattice, modular hash) IS exactly periodic by construction.
      // Both the JS and GLSL halves below implement the identical algorithm with identical PCG hash constants and gradient table, so CPU collision and GPU rendering agree bit-for-bit at every point.

      // PCG-style 32-bit integer hash.
      // Same constants in JS and GLSL.
      // JS uses Math.imul for 32-bit-wrapping multiply; >>> 0 keeps values unsigned.
      function _hash11(a) {
        a = a | 0;
        a = a ^ (a >>> 16);
        a = Math.imul(a, 0x7feb352d);
        a = a ^ (a >>> 15);
        a = Math.imul(a, 0x846ca68b);
        a = a ^ (a >>> 16);
        return a >>> 0;
      }
      function _hash22(x, y) {
        return _hash11((_hash11(x >>> 0) + (y >>> 0)) >>> 0);
      }

      // dot(gradient, cornerOffset) for periodic Perlin.
      // The gradient is one of 8 directions chosen by the low 3 bits of the lattice hash.
      // Hoisted to module scope so it is NOT re-created as a closure on every _periodicPerlin() call -- that function runs ~10x per terrain sample and a sample runs many times per bullet per frame, so a per-call closure here is pure churn (V8 may escape-analyse it away, but a hot path should not depend on "may").
      function _perlinGradDot(gx, gy, ox, oy) {
        const h = _hash22(gx, gy) & 7;
        let vx, vy;
        switch (h) {
          case 0:
            vx = 1;
            vy = 1;
            break;
          case 1:
            vx = -1;
            vy = 1;
            break;
          case 2:
            vx = 1;
            vy = -1;
            break;
          case 3:
            vx = -1;
            vy = -1;
            break;
          case 4:
            vx = 1;
            vy = 0;
            break;
          case 5:
            vx = -1;
            vy = 0;
            break;
          case 6:
            vx = 0;
            vy = 1;
            break;
          default:
            vx = 0;
            vy = -1;
            break;
        }
        return vx * ox + vy * oy;
      }

      // Periodic Perlin gradient noise. floor()/fract() of the input, four corner gradients chosen by the modular hash, bicubic-smoothstep blend.
      // Lattice indices are taken mod P, giving exact periodicity.
      // Output ~[-1, 1] after the sqrt(2) scale.
      function _periodicPerlin(x, y, P) {
        const xi = Math.floor(x),
          yi = Math.floor(y);
        const xf = x - xi,
          yf = y - yi;
        // Non-negative modular lattice indices (input may be negative).
        const px = ((xi % P) + P) % P;
        const px1 = (((xi + 1) % P) + P) % P;
        const py = ((yi % P) + P) % P;
        const py1 = (((yi + 1) % P) + P) % P;
        const d00 = _perlinGradDot(px, py, xf, yf);
        const d10 = _perlinGradDot(px1, py, xf - 1.0, yf);
        const d01 = _perlinGradDot(px, py1, xf, yf - 1.0);
        const d11 = _perlinGradDot(px1, py1, xf - 1.0, yf - 1.0);
        const ux = xf * xf * (3 - 2 * xf);
        const uy = yf * yf * (3 - 2 * yf);
        const mx0 = d00 + ux * (d10 - d00);
        const mx1 = d01 + ux * (d11 - d01);
        return (mx0 + uy * (mx1 - mx0)) * PERLIN_NORM;
      }

      // Per-octave noise periods (in lattice units).
      // Period in metres = P*scale.
      // Both chosen >> fan radius so the tiling is never visible; both small enough that the wrapped uniform keeps full float32 precision.
      const TERRAIN_PERIOD_A = 256;
      const TERRAIN_PERIOD_B = 256;

      // Pre-calculate inverse scales to convert divisions into multiplications
      const INV_SCALE_A = 1 / CONFIG.TERRAIN.OCTAVE_A_SCALE;
      const INV_SCALE_B = 1 / CONFIG.TERRAIN.OCTAVE_B_SCALE;

      // Perlin gradient-noise normalization factor: sqrt(2).
      //
      // Raw 2D Perlin output peaks at +/- 1/sqrt(2); multiplying by sqrt(2) rescales it to the conventional ~[-1, 1] range.
      // It is NOT a tunable value -- it is fixed by the algorithm's geometry.
      //
      // CRITICAL: the JS sampler (sampleTerrain, CPU collision) and the GLSL sampler (terrainHeight, GPU render) MUST agree bit-for-bit, or bullets stop hitting where the terrain visually is.
      // So both sides take this ONE literal: JS uses the Number, GLSL gets the identical decimal text interpolated into its template string.
      // Fixed at 8 significant digits.
      // (Deliberately not Math.SQRT2: that has more digits and would silently alter every terrain height relative to the GLSL side.)
      const PERLIN_NORM = 1.41421356;
      const PERLIN_NORM_GLSL = "1.41421356";

      // CPU terrain sample.
      // JS float64 handles any world magnitude natively, so this is exact at 1e9 m.
      // Matches the GPU's terrainHeight() bit-for-bit.
      function sampleTerrain(x, z) {
        const T = CONFIG.TERRAIN;
        return (
          T.OCTAVE_A_AMP *
            _periodicPerlin(
              x * INV_SCALE_A,
              z * INV_SCALE_A,
              TERRAIN_PERIOD_A,
            ) +
          T.OCTAVE_B_AMP *
            _periodicPerlin(x * INV_SCALE_B, z * INV_SCALE_B, TERRAIN_PERIOD_B)
        );
      }

      // GLSL twin.
      // Identical algorithm, identical constants.
      // The caller passes pre-wrapped per-octave sample coords (CPU wraps the bike origin in float64), so periodicPerlin_t() only ever sees small, non-negative inputs and stays float32-clean no matter how far the player has driven.
      const TERRAIN_GLSL = /* glsl */ `
        uint hash11_t(uint a) {
          a ^= a >> 16u;
          a *= 0x7feb352du;
          a ^= a >> 15u;
          a *= 0x846ca68bu;
          a ^= a >> 16u;
          return a;
        }
        uint hash22_t(uint x, uint y) {
          return hash11_t(hash11_t(x) + y);
        }
        float gradDot_t(uint hx, uint hy, float ox, float oy) {
          uint h = hash22_t(hx, hy) & 7u;
          float gx, gy;
          if      (h == 0u) { gx =  1.0; gy =  1.0; }
          else if (h == 1u) { gx = -1.0; gy =  1.0; }
          else if (h == 2u) { gx =  1.0; gy = -1.0; }
          else if (h == 3u) { gx = -1.0; gy = -1.0; }
          else if (h == 4u) { gx =  1.0; gy =  0.0; }
          else if (h == 5u) { gx = -1.0; gy =  0.0; }
          else if (h == 6u) { gx =  0.0; gy =  1.0; }
          else              { gx =  0.0; gy = -1.0; }
          return gx * ox + gy * oy;
        }
        float periodicPerlin_t(vec2 v, float P) {
          float xi = floor(v.x), yi = floor(v.y);
          float xf = v.x - xi,   yf = v.y - yi;
          // Inputs are kept non-negative by CPU-side wrapping, so mod() here returns the correct non-negative lattice index.
          float px  = mod(xi,       P);
          float px1 = mod(xi + 1.0, P);
          float py  = mod(yi,       P);
          float py1 = mod(yi + 1.0, P);
          float d00 = gradDot_t(uint(px),  uint(py),  xf,       yf      );
          float d10 = gradDot_t(uint(px1), uint(py),  xf - 1.0, yf      );
          float d01 = gradDot_t(uint(px),  uint(py1), xf,       yf - 1.0);
          float d11 = gradDot_t(uint(px1), uint(py1), xf - 1.0, yf - 1.0);
          float ux = xf * xf * (3.0 - 2.0 * xf);
          float uy = yf * yf * (3.0 - 2.0 * yf);
          float mx0 = mix(d00, d10, ux);
          float mx1 = mix(d01, d11, ux);
          return mix(mx0, mx1, uy) * ${PERLIN_NORM_GLSL};
        }
        // sampleA / sampleB are the pre-wrapped, pre-divided noise coords for each octave (relativeXZ * invScale + wrappedBikeOrigin).
        float terrainHeight(vec2 sampleA, vec2 sampleB) {
          return ${CONFIG.TERRAIN.OCTAVE_A_AMP.toFixed(4)} *
                   periodicPerlin_t(sampleA, ${TERRAIN_PERIOD_A.toFixed(1)}) +
                 ${CONFIG.TERRAIN.OCTAVE_B_AMP.toFixed(4)} *
                   periodicPerlin_t(sampleB, ${TERRAIN_PERIOD_B.toFixed(1)});
        }
      `;

      // ============================================================================
      // SKY (Skybox + Clouds + Stars + day-night sun)
      // ----------------------------------------------------------------------------
      // Three meshes (skybox cube, cloud plane, star points) that live in a "skyGroup" the caller positions at the camera every frame -- so the sky appears infinitely distant -- but never rotated.
      // Because the group is never rotated, sun/star directions are world-space by construction.
      //
      // Precision Guardrails for Infinite Scale:
      // 1. The cloud shader takes a modulo-wrapped version of the world cameraXZ position so that cloud patterns remain world-locked without destroying the fragment shader's float32 noise precision at astronomical scales.
      // 2. The skybox vertex shader evaluates using local vertex vectors rather than world-space transforms to avoid catastrophic float32 cancellation.
      //
      // Hot-path: per-frame updates ONLY copy()/set()/lerp() into pre-allocated Vector3/Color objects.
      // The cube shader's `gl_Position = pos.xyww` trick pushes the sky to the far plane regardless of cube size, so the cube is tiny in memory (BoxGeometry(1)) but rendered as if infinite.
      // ============================================================================
      const SkyShader = {
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            // CRITICAL: Use local 'position', NOT 'modelMatrix * position'. At massive world coordinates, adding the camera translation collapses float32 precision and destroys the sun dot-product.
            vWorldPosition = position;

            vec4 pos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            gl_Position = pos.xyww;
          }
        `,
        fragmentShader: `
          precision mediump float;
          varying vec3 vWorldPosition;
          uniform float uSunAzimuth;
          uniform float uSunElevation;
          uniform vec3 uSunColor;
          uniform vec3 uSkyColorLow;
          uniform vec3 uSkyColorHigh;
          uniform float uSunSize;
          uniform bool uIsNight;

          // ---- Cheap value noise (2 octaves) for the moon surface ----------
          // The moon is a SOFT, low-contrast mottle -- a cloudy pale disc, not sharp maria -- so two octaves will work. Runs only for pixels inside the moon disc at night.
          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
              u.y
            );
          }

          void main() {
            vec3 direction = normalize(vWorldPosition);
            vec3 skyColor = mix(uSkyColorLow, uSkyColorHigh,
                                clamp(direction.y * 0.5 + 0.5, 0.0, 1.0));
            float azimuth = radians(uSunAzimuth);
            float elevation = radians(uSunElevation);
            vec3 sunDirection = normalize(vec3(
              cos(elevation) * sin(azimuth),
              sin(elevation),
              cos(elevation) * cos(azimuth)
            ));
            float d = dot(direction, sunDirection);

            if (!uIsNight) {
              // ---- Day: plain bright sun disc ----
              float sunIntensity = pow(max(d, 0.0), 1000.0 / uSunSize);
              gl_FragColor = vec4(skyColor + uSunColor * sunIntensity, 1.0);
              return;
            }

            // ---- Night: textured moon -------------------------------------
            // The moon sits where the sun-disc dot is near 1. angle is the angular distance from the moon centre; the disc has angular radius MOON_R. Outside that plus a halo margin -> just sky.
            float angle = acos(clamp(d, -1.0, 1.0));
            const float MOON_R = 0.045;   // angular radius of the disc
            const float HALO_R = 0.063;   // outer reach of the soft glow
            if (angle > HALO_R) {
              gl_FragColor = vec4(skyColor, 1.0);
              return;
            }

            // Faint outer halo: a TIGHT, subtle lift just past the rim.
            float halo = 1.0 - smoothstep(MOON_R, HALO_R, angle);
            vec3 moonTint = vec3(0.92, 0.95, 1.0); // cool blue-white
            vec3 color = skyColor + moonTint * halo * halo * 0.045;

            if (angle < MOON_R) {
              // Disc-local UV frame: build right/forward axes around the moon direction so the surface pattern is stable on the disc.
              vec3 up = abs(sunDirection.y) < 0.99
                ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
              vec3 right = normalize(cross(up, sunDirection));
              vec3 fwd = cross(sunDirection, right);
              vec2 uv = vec2(dot(direction, right), dot(direction, fwd))
                        / MOON_R;                 // -1..1 across the disc
              float r = length(uv);

              // Soft cloudy surface: 2 octaves of value noise. Higher frequency + LOW contrast gives a fine even haze rather than big dark blobs.
              float n = vnoise(uv * 3.4 + vec2(4.0, 1.5)) * 0.6
                      + vnoise(uv * 7.2 + vec2(9.0, 6.0)) * 0.4;
              // Tight compression around near-white -> a bright disc with only a gentle mottle.
              float surface = 0.93 + (n - 0.5) * 0.16;

              // Limb darkening: gentle.
              float limb = smoothstep(1.0, 0.55, r);
              vec3 moon = moonTint * surface * (0.82 + 0.18 * limb);

              // Soft anti-aliased disc edge -- no hard discard, so the rim melts into the sky/halo.
              float edge = 1.0 - smoothstep(0.93, 1.0, r);
              color = mix(color, moon, edge);
            }

            gl_FragColor = vec4(color, 1.0);
          }
        `,
      };

      // Cloud shader: world-locked simplex noise drifting on uTime. cameraPos.xz gets divided into the UV so a point in world space always samples the same cloud-noise position regardless of where the camera is.
      // The horizon fade keeps clouds from appearing on the horizon line; no radial edge vignette (deliberately omitted per request).
      const CloudsShader = {
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;

            // ---- Dome bend ---------------------------------------------------
            // A FLAT cloud plane stops at a hard rim. With the plane 400 units above the camera and a rim radius of 15000, that rim sits at elevation atan(400/15000) ~= 1.5 deg ABOVE the true horizon -- so you see the plane's edge as a dark band hanging over the horizon line.
            //
            // Fix: droop the rim DOWN into a shallow paraboloid so it passes BELOW the horizon and is occluded by the ground. position.xy is the plane (local +-1); position.z is its normal (0). rho is the normalised distance from centre (0 centre .. ~1 rim).
            //
            // Drop amount, derived -- not eyeballed:
            //   plane local->world scale = 15000, world height above cam = 400.
            //   Local-Y displacement d -> world drop 15000*d.
            //   Target rim world height ~= -2000 (about 7.6 deg BELOW horizon, safely under the ground silhouette at any normal camera pitch).
            //   Total world drop = 400 - (-2000) = 2400 -> d_rim = 2400/15000.
            // Paraboloid d = d_rim * rho^2: flat and undistorted overhead, curving down only as it approaches the rim.
            const float D_RIM = 0.16;            // 2400 / 15000
            float rho2 = dot(position.xy, position.xy); // = rho^2 (rim ~= 1)
            float drop = D_RIM * rho2;
            // The mesh is rotated x=+90deg, which maps the plane's local +Z axis to world -Y. So sinking the rim DOWNWARD in the world means displacing toward local +Z (verified: local +Z -> world -Y).
            vec3 domePos = vec3(position.xy, position.z + drop);

            vec4 pos = projectionMatrix * modelViewMatrix * vec4(domePos, 1.0);
            // Force to the far plane (depth = w/w = 1): clouds always render at infinity. The dome bend changes only the on-screen x,y of the rim -- never depth -- so there is no depth-fight with terrain.
            gl_Position = pos.xyww;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uCloudColor;
          uniform vec3 cameraPos;
          varying vec2 vUv;
          vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}
          float snoise(vec2 v){
            const vec4 C = vec4(0.211324865405187,0.366025403784439,
                                -0.577350269189626,0.024390243902439);
            vec2 i = floor(v + dot(v,C.yy));
            vec2 x0 = v - i + dot(i,C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
            vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1;
            i = mod(i, 289.0);
            vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0))
                                    + i.x + vec3(0.0,i1.x,1.0));
            vec3 m = max(0.5 - vec3(dot(x0,x0),dot(x12.xy,x12.xy),
                                    dot(x12.zw,x12.zw)), 0.0);
            m = m*m; m = m*m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
            vec3 g;
            g.x  = a0.x  * x0.x + h.x * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
          }
          void main() {
            // World-locked UV: cameraPos drifts the sample, so a fixed world direction always lands on the same cloud-noise sample regardless of camera translation. uTime adds slow drift on top.
            vec2 cloudUV = vUv * 6.0 + vec2(
              cameraPos.x / 1000.0 + uTime / 100.0,
              cameraPos.z / 1000.0
            );
            float n = snoise(cloudUV * 3.0 + uTime / 50.0) * 0.6
                    + snoise(cloudUV * 6.0 + uTime / 40.0) * 0.3
                    + snoise(cloudUV * 12.0 + uTime / 30.0) * 0.1;
            float cloudDensity = smoothstep(0.1, 0.9, 0.5 * n + 0.5);
            // Soft fade as the cloud plane meets the horizon at vUv.y → {0,1}.
            float horizonFade = smoothstep(0.0, 0.3, 1.0 - abs(vUv.y - 0.5) * 2.0);
            float a = cloudDensity * horizonFade * 0.7;
            if (a < 0.01) discard;
            gl_FragColor = vec4(uCloudColor, a);
          }
        `,
      };

      // Stars: GPU-side twinkle (per-vertex sin(time*freq + phase) modulates gl_PointSize).
      // The vDepth-based "refl" smoothstep softly fades stars that are behind the camera but visible through the skybox geometry.
      const StarsShader = {
        vertexShader: `
          attribute float size;
          attribute vec3 color;
          attribute float phase;
          attribute float freq;
          varying vec3 vColor;
          varying float vDepth;
          uniform float time;
          void main() {
            vColor = color;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            vDepth = mv.z;
            float twinkle = sin(time * freq + phase) * 0.2 + 0.8;
            gl_PointSize = size * twinkle;
            vec4 pos = projectionMatrix * mv;
            pos.z = pos.w * 0.999999;
            gl_Position = pos;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vDepth;
          void main() {
            vec2 c = gl_PointCoord - vec2(0.5);
            float d = length(c) * 2.0;
            float core = (1.0 - smoothstep(0.0, 0.2, d)) * 0.8;
            float glow = (1.0 - smoothstep(0.2, 0.5, d)) * 0.1;
            float b = core + glow;
            vec3 finalColor = mix(vec3(1.0), vColor, 0.8) * 0.6;
            float refl = smoothstep(0.0, -1000.0, vDepth) * 0.5;
            gl_FragColor = vec4(finalColor, b * refl);
          }
        `,
      };

      /**
       * Skybox cube with the gl_Position.z = w trick (pinned to far plane).
       * Owns a DirectionalLight that the caller adds to scene root for shadows.
       * `update(date)` advances the sun position and recolors the sky from the supplied JS Date; emits onTimeOfDayChanged when crossing sunrise/sunset.
       */
      class Skybox extends Mesh {
        constructor() {
          const geometry = new BoxGeometry(1, 1, 1);
          const material = new ShaderMaterial({
            vertexShader: SkyShader.vertexShader,
            fragmentShader: SkyShader.fragmentShader,
            uniforms: {
              uSunAzimuth: { value: 216 },
              uSunElevation: { value: 25 },
              uSunColor: { value: new Color(0xffe5b0) },
              uSkyColorLow: { value: new Color(0x6fa2ef) },
              uSkyColorHigh: { value: new Color(0x2053ff) },
              uSunSize: { value: 1 },
              uIsNight: { value: false },
            },
            side: BackSide,
            depthWrite: false,
            fog: false,
          });
          super(geometry, material);

          // Visually infinite via the depth trick — actual geom is unit cube.
          this.SKYBOX_SCALE = 100000;
          this.scale.setScalar(this.SKYBOX_SCALE);
          this.frustumCulled = false;

          this.sunElevation = 25;
          this.sunAzimuth = 216;
          this.targetElevation = this.sunElevation;
          this.targetAzimuth = this.sunAzimuth;
          this.lerpSpeed = 0.05;
          this._initialPositionSet = false;
          this._timeOfDay = null;

          // Pre-allocated working storage for the hot path.
          this._sunPosition = new Vector3();
          this._sunDirection = new Vector3();
          this._cWhite = new Color(0xffffff);
          this._cOrange = new Color(0xff4500);
          this._cYellow = new Color(0xffd700);
          this._cRed = new Color(0xff6347);
          this._cDarkRed = new Color(0xd32f2f);
          this._cSkyBlue = new Color(0x87ceeb);
          this._cDarkSky = new Color(0x0d1321);
          this._cNightSky = new Color(0x1c2331);
          this._cMoon = new Color(0xe6e8fa);
          this._cTmpHorizon = new Color();

          // Sun light — owned by skybox but added to scene root by the Game.
          this.sun = new DirectionalLight(0xffe5b0, 1);
          // Shadows OFF.
          // Nothing in the scene casts (bike, rider, terrain all castShadow=false), so a shadow pass would render an empty depth map and only produce frustum-edge artifacts on the ground.
          // The shadow.* config below is left in place, inert, so shadows can be re-enabled later by flipping this one flag back to true.
          this.sun.castShadow = false;
          this.sun.shadow.mapSize.set(2048, 2048);
          this.sun.shadow.radius = 2;
          this.sun.shadow.normalBias = 0.02;
          this.sun.shadow.bias = -0.0002;
          // Tight bike-sized shadow frustum.
          // The light position is shifted to bike + sunDir * 200 every frame, so this 20×20m window stays centered on the rider.
          // Shadow texel size at 2048² is ~1cm -- crisp enough for the bike silhouette.
          const FX = 10,
            FY = 10;
          this.sun.shadow.camera.left = -FX;
          this.sun.shadow.camera.right = FX;
          this.sun.shadow.camera.top = FY;
          this.sun.shadow.camera.bottom = -FY;
          this.sun.shadow.camera.near = 0.5;
          this.sun.shadow.camera.far = 500;
          this.sun.shadow.camera.updateProjectionMatrix();

          // Ambient + hemi inside the skybox group so they move with the camera (intensity-only state; their effect is global so position is moot).
          this.ambientLight = new AmbientLight(0xffffff, 0.4);
          this.hemiLight = new HemisphereLight(0xb6d3ec, 0x7d6840, 0.5);
          this.add(this.ambientLight);
          this.add(this.hemiLight);

          this.onTimeOfDayChanged = null;
          this.updateSunPosition(true);
        }

        /**
         * Derive sky colors, sun angle, and light intensities from a JS Date.
         * Daytime 6:00-21:00, twilight transitions briefly outside.
         */
        update(currentTime, bikePosition) {
          // Daytime 7 AM - 8 PM.
          // Pushed wider than astronomical sunrise/sunset so the headlight rig stays engaged through dawn twilight and re-engages at dusk, rather than cutting out while it still reads as night out the windshield.
          const SUNRISE = 7,
            SUNSET = 20;
          const DARKNESS_START = 19.42,
            DARKNESS_END = 7.58;
          const maxElevation = 42;
          const hours = currentTime.getHours();
          const minutes = currentTime.getMinutes();
          const t_h = hours + minutes / 60;

          const isInDarkTransition =
            (t_h >= DARKNESS_START && t_h <= SUNSET) ||
            (t_h >= SUNRISE && t_h <= DARKNESS_END);
          const isDaytime = t_h >= SUNRISE && t_h <= SUNSET;
          const wasNighttime = this._timeOfDay === "Nighttime";

          let normalizedTime;
          if (isDaytime) {
            normalizedTime = (t_h - SUNRISE) / (SUNSET - SUNRISE);
          } else {
            const nightHour = t_h >= SUNSET ? t_h : t_h + 24;
            normalizedTime = (nightHour - SUNSET) / (24 - SUNSET + SUNRISE);
          }

          let sunElevation =
            Math.cos(Math.PI * (normalizedTime - 0.5)) * maxElevation - 5;
          const sunAzimuth = 180 + 180 * normalizedTime;

          // Day-phase boundaries as fractions of the full daylight span.
          // SUNRISE_END: sunrise occupies [0, this]; SUNSET_START: sunset occupies [this, 1]; midday owns the middle. 0.12/0.88 keeps sunrise/sunset brief and lets midday (blue sky) dominate, as real daylight does.
          // Single source of truth: the phase test AND the horizon-colour lerps below both derive from these, so they can never drift out of sync.
          const SUNRISE_END = 0.12;
          const SUNSET_START = 0.88;
          let timeOfDay = "Nighttime";
          if (isDaytime) {
            if (normalizedTime <= SUNRISE_END) timeOfDay = "Sunrise";
            else if (normalizedTime <= SUNSET_START) timeOfDay = "Midday";
            else timeOfDay = "Sunset";
          }

          const isNowNighttime = timeOfDay === "Nighttime";
          let isInstantTransition = wasNighttime !== isNowNighttime;
          if (!this._initialPositionSet) {
            this._initialPositionSet = true;
            isInstantTransition = true;
          }

          const U = this.material.uniforms;
          if (isDaytime) {
            const normalizedElevation = Math.min(
              sunElevation / maxElevation,
              1,
            );
            // ---- Warmth / darkening factor `t` (0 = full day, 1 = horizon) --
            // Warm light is a LOW-SUN phenomenon. t stays at 0 across the whole broad middle of the day and ramps up only when the sun is genuinely low -- t drives both the SUN COLOUR (white->orange) and the ZENITH COLOUR (blue->near-black), so letting it rise mid-day would tint a high sun orange under a darkened sky.
            // A smoothstep from the horizon up to HORIZON_BAND of max elevation does this: above that band the sun is pure white and the sky full blue; below it the warmth/darkening eases in.
            // The sun only reaches ~42 deg max, so the band is set as a fraction of that.
            const HORIZON_BAND = 0.42; // ramp finishes at 42% of max elevation
            const e = Math.min(normalizedElevation / HORIZON_BAND, 1);
            // smoothstep(0,1,e): 0 at horizon, 1 once clear of the band.
            const climb = e * e * (3 - 2 * e);
            const t = 1 - climb; // 1 at horizon -> 0 through midday
            U.uSunColor.value.lerpColors(this._cWhite, this._cOrange, t);

            this._cTmpHorizon.copy(this._cSkyBlue);
            if (timeOfDay === "Sunrise") {
              // Lerp normalized across the sunrise span [0, SUNRISE_END].
              this._cTmpHorizon
                .copy(this._cYellow)
                .lerp(this._cRed, normalizedTime / SUNRISE_END);
            } else if (timeOfDay === "Sunset") {
              // Lerp normalized across the sunset span [SUNSET_START, 1].
              this._cTmpHorizon
                .copy(this._cRed)
                .lerp(
                  this._cDarkRed,
                  (normalizedTime - SUNSET_START) / (1 - SUNSET_START),
                );
            }
            U.uSkyColorLow.value.copy(this._cTmpHorizon);
            U.uSkyColorHigh.value.lerpColors(this._cSkyBlue, this._cDarkSky, t);

            this.sun.intensity = isInDarkTransition
              ? 0.1
              : Math.min(4, Math.pow(normalizedElevation, 1.2) * 4);
            U.uIsNight.value = false;
          } else {
            // Night: lower sun, moonlight color, cool dark-blue sky gradient.
            sunElevation *= 0.5;
            U.uSunColor.value.copy(this._cMoon).multiplyScalar(1.8);
            U.uSkyColorLow.value.copy(this._cDarkSky);
            U.uSkyColorHigh.value.copy(this._cNightSky);
            this.sun.intensity = 0.5;
            U.uIsNight.value = true;
          }

          this.targetElevation = sunElevation;
          this.targetAzimuth = sunAzimuth;
          this.updateSunPosition(isInstantTransition);

          if (timeOfDay !== this._timeOfDay) {
            if (this.onTimeOfDayChanged) this.onTimeOfDayChanged(timeOfDay);
            this._timeOfDay = timeOfDay;
          }

          // ---- Sun positioning ----
          // The sun is at INFINITY by design.
          // Three.js's DirectionalLight is a parallel-ray source; only its DIRECTION matters for lighting (the position field is just where the shadow-camera frustum is anchored, not where the light "is").
          // The visible sun disc in the skybox fragment shader is also direction-based -- the disc is painted at the far plane regardless of camera position.
          //
          // So: riding away from origin cannot "outrun" the sun -- its world-space direction is fixed by the game clock alone and is identical for the player at world (0, 0) and at world (1e9, 1e9).
          //
          // Bike position biases only the light's position AND its target -- by the SAME bike offset.
          // Both translate together, so the (position - target) direction is preserved (still the astronomical direction).
          // The translation only repositions the shadow camera's view frustum to stay centered on the bike, so shadows render correctly regardless of travel distance.
          if (bikePosition) {
            const sd = this._sunDirection;
            const dist = 200;
            this.sun.position.set(
              bikePosition.x + sd.x * dist,
              bikePosition.y + sd.y * dist,
              bikePosition.z + sd.z * dist,
            );
            this.sun.target.position.set(
              bikePosition.x,
              bikePosition.y,
              bikePosition.z,
            );
            this.sun.target.updateMatrixWorld();
          }
        }

        updateSunPosition(instant = false) {
          if (instant) {
            this.sunElevation = this.targetElevation;
            this.sunAzimuth = this.targetAzimuth;
          } else {
            this.sunElevation +=
              (this.targetElevation - this.sunElevation) * this.lerpSpeed;
            this.sunAzimuth +=
              (this.targetAzimuth - this.sunAzimuth) * this.lerpSpeed;
          }

          // Sun WORLD direction (used by the DirectionalLight). Same azimuth remap as the shader uses below so light and visual disc agree.
          const az = MathUtils.degToRad(((270 - this.sunAzimuth) % 360) - 180);
          const el = MathUtils.degToRad(this.sunElevation);
          const r = 0.5;
          this._sunPosition.set(
            r * Math.cos(el) * Math.sin(az),
            r * Math.sin(el),
            r * Math.cos(el) * Math.cos(az),
          );
          this._sunDirection.copy(this._sunPosition).normalize();

          // SkyGroup doesn't rotate in this app (the bike moves through the world rather than the world rotating around the bike), so the shader azimuth has no heading compensation -- just the same remap applied above for the light.
          this.material.uniforms.uSunAzimuth.value =
            ((270 - this.sunAzimuth) % 360) - 180;
          this.material.uniforms.uSunElevation.value = this.sunElevation;
        }
      }

      /**
       * Engine-native lens flare. Daytime only.
       *
       * Deliberately NOT three.js's Lensflare.js: that class does a copyFramebufferToTexture + extra renderBufferDirect passes EVERY frame for its GPU occlusion query -- a pipeline stall this engine has no reason to pay.
       * Here the flare is just a handful of additive Sprites laid along the screen-space line from the sun to screen centre, and "is the sun blocked" is answered by a single CPU ray march against the analytic terrain (see _surfaceHeight / _traceAim).
       * No framebuffer copies, no extra draw passes, no readback.
       *
       * Positioned in CAMERA-LOCAL space: the flare is a child of the camera, so its sprites live at small coordinates (~100 units) with full float32 precision -- even though the camera itself sits at ~1 AU in world space.
       * Placing sprites in absolute world space would quantise them to ~16 km buckets and the flare would never land on screen.
       * The only world-space input is the sun DIRECTION, which is unit length and therefore precision-safe.
       *
       * Two-phase per frame: _projectSun() does the cheap on-screen test; update() does the sprite work.
       * The game loop runs the expensive terrain-occlusion march only between the two, and only when the sun is actually on screen.
       */
      class LensFlare extends Group {
        // One radial-gradient texture, drawn once to an offscreen canvas.
        // `core` true = the bright sun glow; false = a soft diffuse ghost.
        static _makeTexture(core) {
          const S = 256;
          const c = document.createElement("canvas");
          c.width = c.height = S;
          const ctx = c.getContext("2d");
          const g = ctx.createRadialGradient(
            S / 2,
            S / 2,
            0,
            S / 2,
            S / 2,
            S / 2,
          );
          if (core) {
            g.addColorStop(0.0, "rgba(255,255,255,1)");
            g.addColorStop(0.1, "rgba(255,250,240,0.9)");
            g.addColorStop(0.25, "rgba(255,229,176,0.6)");
            g.addColorStop(0.5, "rgba(255,229,176,0.2)");
            g.addColorStop(1.0, "rgba(255,229,176,0)");
          } else {
            g.addColorStop(0.0, "rgba(255,229,176,0.6)");
            g.addColorStop(0.3, "rgba(255,229,176,0.3)");
            g.addColorStop(0.6, "rgba(255,229,176,0.1)");
            g.addColorStop(1.0, "rgba(255,229,176,0)");
          }
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, S, S);
          const tex = new CanvasTexture(c);
          tex.minFilter = LinearFilter;
          tex.magFilter = LinearFilter;
          return tex;
        }

        constructor() {
          super();
          this.frustumCulled = false;
          // Render last: the flare composites on top of everything.
          this.renderOrder = 999;

          const coreTex = LensFlare._makeTexture(true);
          const ghostTex = LensFlare._makeTexture(false);

          // Element layout: { texture, size (NDC-ish), distance (0 = at sun, 1 = at screen centre) }. One bright core at the sun plus four soft ghosts strung toward centre.
          const defs = [
            { tex: coreTex, size: 0.55, dist: 0.0 },
            { tex: ghostTex, size: 0.11, dist: 0.6 },
            { tex: ghostTex, size: 0.13, dist: 0.7 },
            { tex: ghostTex, size: 0.22, dist: 0.9 },
            { tex: ghostTex, size: 0.13, dist: 1.0 },
          ];
          this._elements = defs.map((d) => {
            const mat = new SpriteMaterial({
              map: d.tex,
              transparent: true,
              blending: AdditiveBlending,
              depthTest: false, // never occluded by geometry; CPU does that
              depthWrite: false,
              fog: false,
            });
            const sp = new Sprite(mat);
            sp.frustumCulled = false;
            // renderOrder must be set per-sprite: three.js does NOT cascade a Group's renderOrder to its children.
            // With depthTest:false the draw order alone decides compositing, so the flare sprites must sort after everything else.
            sp.renderOrder = 999;
            sp.userData.size = d.size;
            sp.userData.dist = d.dist;
            this.add(sp);
            return sp;
          });

          // Scratch -- no per-frame allocation.
          this._sunLocal = new Vector3();
          // Sun's projected position on the z = -D view plane, plus its normalised -1..1 screen coords.
          // Filled by _projectSun().
          this._sunX = 0;
          this._sunY = 0;
          this._ndcX = 0;
          this._ndcY = 0;
          // Cached view-plane half-extents at z = -D. tan(fov/2) only changes on FOV/aspect change, so it is recomputed lazily (see _projectSun) rather than every frame.
          this._D = 100;
          this._halfH = 0;
          this._halfW = 0;
          this._cachedFov = -1;
          this._cachedAspect = -1;
          this.visible = false;
        }

        /**
         * Cheap projection of the sun onto the camera view plane.
         * Does the world->camera-local transform and the perspective projection only -- NO sprite work.
         * Returns true if the sun is in front of the camera and within the on-screen margin.
         *
         * Split out from update() so the game loop can call this FIRST and skip the expensive terrain-occlusion march entirely when the sun is off screen (the common case while steering freely).
         *
         * @param camera the scene camera (this flare's parent)
         * @param sunDir unit world-space direction TO the sun
         */
        _projectSun(camera, sunDir) {
          // World sun direction -> camera-LOCAL direction. transformDirection with the camera's matrixWorldInverse (three.js maintains it for free every frame) does world->local rotation -- no quaternion invert needed.
          this._sunLocal
            .copy(sunDir)
            .transformDirection(camera.matrixWorldInverse);
          // Camera looks down local -Z; the sun is in front only if z < 0.
          if (this._sunLocal.z >= -0.05) return false;
          // Recompute frustum half-extents only when FOV or aspect changed.
          if (
            camera.fov !== this._cachedFov ||
            camera.aspect !== this._cachedAspect
          ) {
            this._halfH = this._D * Math.tan((camera.fov * Math.PI) / 360);
            this._halfW = this._halfH * (camera.aspect || 1);
            this._cachedFov = camera.fov;
            this._cachedAspect = camera.aspect;
          }
          // Scale the local sun direction so its z reaches the -D view plane.
          const k = -this._D / this._sunLocal.z; // > 0
          this._sunX = this._sunLocal.x * k;
          this._sunY = this._sunLocal.y * k;
          this._ndcX = this._sunX / this._halfW;
          this._ndcY = this._sunY / this._halfH;
          return Math.abs(this._ndcX) <= 1.3 && Math.abs(this._ndcY) <= 1.3;
        }

        /**
         * Position and fade the flare sprites.
         * Assumes _projectSun() was called this frame and returned true (the game loop guarantees this ordering).
         * All work is in precision-safe camera-local space.
         *
         * @param strength 0..1 master opacity (daytime + occlusion fade)
         */
        update(strength) {
          if (strength <= 0.001) {
            this.visible = false;
            return;
          }
          this.visible = true;
          // Fade as the sun nears the screen edge.
          const edge =
            1 -
            Math.min(1, Math.max(Math.abs(this._ndcX), Math.abs(this._ndcY)));
          const edgeFade = Math.min(1, edge * 3);
          const D = this._D;
          const halfH = this._halfH;
          for (let i = 0; i < this._elements.length; i++) {
            const sp = this._elements[i];
            const d = sp.userData.dist;
            // Lerp the sun's local point toward the view centre by `dist`.
            sp.position.set(this._sunX * (1 - d), this._sunY * (1 - d), -D);
            // Sprite scale is in local units; size is a fraction of the view-plane height at z = -D.
            const s = sp.userData.size * halfH;
            sp.scale.set(s, s, 1);
            sp.material.opacity = d === 0 ? strength : strength * edgeFade;
          }
        }
      }

      /**
       * Horizontal cloud sheet far above the world.
       * Uniform `cameraPos` drives world-locking; the cloud noise pattern is fixed in world space and the camera flies through it.
       */
      class Clouds extends Mesh {
        constructor() {
          // Subdivided plane: the dome bend in the vertex shader displaces each vertex by a paraboloid, so the mesh needs interior vertices to actually curve.
          // A bare PlaneGeometry(2,2) is one quad (4 corner verts) and would only bend into a flat tilted quad. 64x64 gives a smooth dome; it is still a trivial vertex count and ONE draw call.
          const geometry = new PlaneGeometry(2, 2, 64, 64);
          const material = new ShaderMaterial({
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: AdditiveBlending,
            side: FrontSide,
            uniforms: {
              uTime: { value: 0 },
              uCloudColor: { value: new Color(1, 1, 1) },
              cameraPos: { value: new Vector3() },
            },
            vertexShader: CloudsShader.vertexShader,
            fragmentShader: CloudsShader.fragmentShader,
          });
          super(geometry, material);
          this.frustumCulled = false;
          this.renderOrder = -1;
          this.rotation.x = Math.PI / 2;
          this.position.set(0, 400, 0);
          this.scale.setScalar(15000);
          this._t = 0;
        }
        update(dt, cameraPosition) {
          // Pre-allocated uniforms; only field writes in the hot path.
          this._t += dt;
          this.material.uniforms.uTime.value = this._t;

          // Wrap camera coordinates modulo 100,000 on the CPU (float64).
          // Raw coordinates at massive scales (like 1 AU) would cost the float32 simplex noise in the fragment shader its fractional precision and the clouds would disappear.
          this.material.uniforms.cameraPos.value.set(
            cameraPosition.x % 100000,
            cameraPosition.y,
            cameraPosition.z % 100000,
          );
        }
        setCloudColor(c) {
          this.material.uniforms.uCloudColor.value.copy(c);
        }
        setVisible(v) {
          this.visible = v;
        }
      }

      /**
       * Star field: top hemisphere generated, mirrored to bottom for full sphere.
       * Procedural per-vertex twinkle on GPU.
       * Single Points draw call.
       */
      class Stars extends Points {
        constructor(count = 2000) {
          // Top hemisphere only.
          // Stars below the horizon would be literally underground -- mirroring them to the bottom hemisphere gives every star a twin under the ground that punches through wherever the terrain tessellation is thin, reading as "stars under the dirt".
          // The bottom half of the sphere is left empty by design.
          const top = Stars._gen(count);

          const geometry = new BufferGeometry();
          geometry.setAttribute("position", new BufferAttribute(top.pos, 3));
          geometry.setAttribute("color", new BufferAttribute(top.col, 3));
          geometry.setAttribute("size", new BufferAttribute(top.siz, 1));
          geometry.setAttribute("phase", new BufferAttribute(top.pha, 1));
          geometry.setAttribute("freq", new BufferAttribute(top.frq, 1));

          const material = new ShaderMaterial({
            uniforms: { time: { value: 0 } },
            vertexShader: StarsShader.vertexShader,
            fragmentShader: StarsShader.fragmentShader,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            blending: AdditiveBlending,
          });
          super(geometry, material);
          this.renderOrder = -1;
          this.frustumCulled = false;
          this.matrixAutoUpdate = false;
          this.scale.setScalar(100000); // unit-sphere positions × 100km radius
          this.updateMatrix();
        }
        static _gen(n) {
          const pos = new Float32Array(n * 3);
          const col = new Float32Array(n * 3);
          const siz = new Float32Array(n);
          const pha = new Float32Array(n);
          const frq = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            // Uniform sampling on the top hemisphere via standard inverse CDF.
            const u = Math.random();
            const v = Math.random() * 0.5 + 0.5;
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            pos[i * 3 + 0] = Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = Math.cos(phi);
            pos[i * 3 + 2] = Math.sin(phi) * Math.sin(theta);
            // 15% bluish, 15% yellowish, rest white — sells variety.
            const r = Math.random();
            const c =
              r < 0.15
                ? [0.8, 0.85, 1.0]
                : r < 0.3
                  ? [1.0, 0.95, 0.8]
                  : [1.0, 1.0, 1.0];
            col.set(c, i * 3);
            // Long-tail size distribution: most stars small, rare large ones.
            const sr = Math.random();
            siz[i] =
              sr < 0.01
                ? 40 + Math.random() * 20
                : sr < 0.05
                  ? 25 + Math.random() * 15
                  : sr < 0.2
                    ? 15 + Math.random() * 10
                    : 5 + Math.random() * 5;
            pha[i] = Math.random() * Math.PI * 2;
            frq[i] = 1.0 + Math.random() * 2.0;
          }
          return { pos, col, siz, pha, frq };
        }
        update(elapsed) {
          this.material.uniforms.time.value = elapsed;
        }
        setVisible(v) {
          this.visible = v;
        }
      }

      // ============================================================================
      // GROUND FAN
      // ============================================================================
      function makeFanGeometry() {
        const F = CONFIG.FAN;
        const rings = F.RINGS;
        const halfAngle = F.HALF_ANGLE;
        const innerR = F.INNER_RADIUS;
        const outerR = F.RADIUS;
        const ramp = F.RAMP_EXP;
        const bufferRings = F.BUFFER_RINGS;

        // ---- Sector count from constant angular density ----------------------
        // sectors = density * sweep, so triangle size in screen-degrees is constant across every aspect ratio.
        // The count is driven by the WIDEST sweep any ring uses: buffer rings (if present) sweep a full 2*PI, the rest sweep 2*halfAngle -- the vertex array width must hold whichever is larger.
        // Clamped to [MIN, MAX] so a near-zero FOV still yields a usable mesh and a 360-deg annulus can't explode the count.
        const mainSweep = 2 * halfAngle;
        const widestSweep = bufferRings > 0 ? 2 * Math.PI : mainSweep;
        const sectors = Math.max(
          F.SECTORS_MIN,
          Math.min(F.SECTORS_MAX, Math.round(F.SECTOR_DENSITY * widestSweep)),
        );

        const totalVerts = rings * sectors;
        const positions = new Float32Array(totalVerts * 3);

        for (let i = 0; i < rings; i++) {
          const t = i / (rings - 1);
          const r = innerR + (outerR - innerR) * Math.pow(t, ramp);
          const isBuffer = i < bufferRings;
          const sweepHalf = isBuffer ? Math.PI : halfAngle;
          const sweep = 2 * sweepHalf;
          for (let j = 0; j < sectors; j++) {
            const u = j / (sectors - 1);
            const theta = -sweepHalf + sweep * u;
            const x = r * Math.sin(theta);
            const z = -r * Math.cos(theta);
            const idx = (i * sectors + j) * 3;
            positions[idx + 0] = x;
            positions[idx + 1] = 0;
            positions[idx + 2] = z;
          }
        }

        const indices = [];
        // If the fan covers a full 360° (halfAngle ≈ π), wrap sector indexing so the ring closes seamlessly behind the bike.
        // Without this the last sector and the first would not be connected and a thin seam would appear directly behind the player at θ = ±π.
        const isFullAnnulus = halfAngle >= Math.PI - 1e-3;
        for (let i = 0; i < rings - 1; i++) {
          const ringIsBuffer = i < bufferRings;
          const nextIsBuffer = i + 1 < bufferRings;
          const wrap = isFullAnnulus || (ringIsBuffer && nextIsBuffer);
          const sectorEnd = wrap ? sectors : sectors - 1;
          for (let j = 0; j < sectorEnd; j++) {
            const j1 = (j + 1) % sectors;
            const a = i * sectors + j;
            const b = i * sectors + j1;
            const c = (i + 1) * sectors + j;
            const d = (i + 1) * sectors + j1;
            indices.push(a, c, b);
            indices.push(b, c, d);
          }
        }

        const geo = new BufferGeometry();
        geo.setAttribute("position", new BufferAttribute(positions, 3));
        geo.setIndex(indices);
        return geo;
      }

      // ==========================================================================
      // GroundFan -- infinite noise terrain, lit by the STOCK three.js pipeline.
      // --------------------------------------------------------------------------
      // The stock MeshStandardMaterial is taken as-is, and onBeforeCompile injects exactly TWO things the stock material can't do on its own, leaving its lighting pipeline intact:
      //
      // 1. VERTEX displacement -- raise each flat fan vertex to the procedural noise height. (The reason a plain material can't be used directly.)
      //
      // 2. PER-FRAGMENT analytical normal -- BEFORE the stock lighting code runs, recompute the surface normal from a 3-tap gradient of the SAME noise, per pixel, and write it into three's own `normal` variable. The stock material then lights THAT normal.
      // A per-VERTEX (Gouraud) normal would let a 30 m near-horizon triangle average all its relief into a flat smear; recomputing per pixel keeps the light play on the slopes, lit by three's real, correctly-balanced sun + ambient + hemi + headlight.
      //
      // Result: GPU noise displacement + genuine per-pixel lighting from every scene light, for the price of two shader-chunk replacements.
      // No custom lighting math to balance, debug, or keep in sync with the sky.
      //
      // Precision: the noise is sampled in a bike-relative frame (mat3(model) * position drops the fan group's huge world translation) and the bike origin is pre-wrapped modulo the noise period on the CPU in float64, so the GPU never sees a large noise input -> float32-clean at any distance.
      // ==========================================================================
      class GroundFan extends Mesh {
        constructor() {
          const geo = makeFanGeometry();

          // Stock PBR material. roughness high / metalness 0 -> matte ground. flatShading off; a smooth per-pixel normal is supplied below.
          // The fan winds inward, so BackSide.
          // Vertex colors carry the grass/rock slope blend (computed per-pixel in the patched shader).
          const mat = new MeshStandardMaterial({
            side: BackSide,
            roughness: 0.95,
            metalness: 0.0,
            color: 0xffffff,
          });

          // Uniforms the injected code needs.
          // Kept on userData so the onBeforeCompile closure and the per-frame updater share them.
          mat.userData.uBikeWrapA = { value: new Vector2(0, 0) };
          mat.userData.uBikeWrapB = { value: new Vector2(0, 0) };
          mat.userData.uGrass = { value: new Color(0x5d7641) };
          mat.userData.uRock = { value: new Color(0x7a6852) };
          // Grass tint endpoints for the procedural albedo texture: a patchy lerp between a darker and a lighter grass breaks up the flat-green "untextured primitive" look.
          // Pulled toward dry/yellow on the light end and deep/shadowed on the dark end.
          mat.userData.uGrassDark = { value: new Color(0x44582f) };
          mat.userData.uGrassLight = { value: new Color(0x7e9150) };

          mat.onBeforeCompile = (shader) => {
            shader.uniforms.uBikeWrapA = mat.userData.uBikeWrapA;
            shader.uniforms.uBikeWrapB = mat.userData.uBikeWrapB;
            shader.uniforms.uGrass = mat.userData.uGrass;
            shader.uniforms.uRock = mat.userData.uRock;
            shader.uniforms.uGrassDark = mat.userData.uGrassDark;
            shader.uniforms.uGrassLight = mat.userData.uGrassLight;

            // ---- VERTEX SHADER ----------------------------------------------
            // Inject the noise sampler + a varying carrying the bike-relative XZ and the camera distance down to the fragment stage.
            shader.vertexShader = shader.vertexShader
              .replace(
                "void main() {",
                /* glsl */ `
                ${TERRAIN_GLSL}
                uniform vec2 uBikeWrapA;
                uniform vec2 uBikeWrapB;
                varying vec2 vRelXZ;
                varying float vTerrainDist;
                // World->view rotation, passed to the fragment shader so it can put the per-pixel analytical normal into view space.
                // (normalMatrix and viewMatrix are not reliably available in the fragment stage; this varying always is. Every vertex writes the identical value, so interpolation is a no-op.)
                varying mat3 vViewRot;
                float _terrainAt(vec2 relXZ) {
                  vec2 sA = relXZ * ${INV_SCALE_A.toFixed(8)} + uBikeWrapA;
                  vec2 sB = relXZ * ${INV_SCALE_B.toFixed(8)} + uBikeWrapB;
                  return terrainHeight(sA, sB);
                }
                void main() {
                `,
              )
              // begin_vertex sets `transformed` (the local position three.js then runs through modelView/projection); it is raised to the noise height here. mat3(modelMatrix)*position is the bike- relative, world-axis-aligned XZ -- small, so float32-precise.
              .replace(
                "#include <begin_vertex>",
                /* glsl */ `
                vec3 _relPos = mat3(modelMatrix) * position;
                vRelXZ = _relPos.xz;
                float _h = _terrainAt(vRelXZ);
                vec3 transformed = vec3(position.x, _h, position.z);
                `,
              )
              // After three.js builds mvPosition, stash its length: that is the precise camera-to-fragment distance (view space is camera-relative), used to anti-alias the normal in the FS.
              .replace(
                "#include <project_vertex>",
                /* glsl */ `
                #include <project_vertex>
                vTerrainDist = length(mvPosition.xyz);
                // viewMatrix is rigid (rotation + translation, no scale), so its upper-3x3 is the world->view rotation AND its own inverse-transpose -- exactly the transform a normal needs.
                vViewRot = mat3(viewMatrix);
                `,
              );

            // ---- FRAGMENT SHADER --------------------------------------------
            // Inject the noise sampler, then extend <normal_fragment_begin> -- the chunk that establishes `normal` for the lighting code.
            // The analytical normal is recomputed per pixel from the noise gradient and handed to the stock lighting, and diffuseColor is tinted by slope in the same block (correct order: <color_fragment> has already run by this point).
            shader.fragmentShader = shader.fragmentShader
              .replace(
                "void main() {",
                /* glsl */ `
                ${TERRAIN_GLSL}
                uniform vec2 uBikeWrapA;
                uniform vec2 uBikeWrapB;
                uniform vec3 uGrass;
                uniform vec3 uRock;
                uniform vec3 uGrassDark;
                uniform vec3 uGrassLight;
                varying vec2 vRelXZ;
                varying float vTerrainDist;
                varying mat3 vViewRot;
                float _terrainAt(vec2 relXZ) {
                  vec2 sA = relXZ * ${INV_SCALE_A.toFixed(8)} + uBikeWrapA;
                  vec2 sB = relXZ * ${INV_SCALE_B.toFixed(8)} + uBikeWrapB;
                  return terrainHeight(sA, sB);
                }
                // World-locked color noise in [0,1]. 'freq' is in cycles per metre. The bike-relative XZ is scaled by freq and offset by the CPU-wrapped bike origin (also scaled), so a fixed point on the ground always samples the same value no matter where the bike has driven -- the texture does not swim.
                // Reuses the periodic Perlin already in TERRAIN_GLSL; period 256 is far larger than any view, so the tiling is never visible.
                float _colorNoise(float freq) {
                  vec2 p = vRelXZ * freq
                         + uBikeWrapA * (${CONFIG.TERRAIN.OCTAVE_A_SCALE.toFixed(1)} * freq);
                  return periodicPerlin_t(p, 256.0) * 0.5 + 0.5;
                }
                void main() {
                `,
              )
              // Per-pixel analytical normal. eps widens with distance so a far pixel averages its noise footprint instead of point- sampling (kills the horizon shimmer/"pixelation" lines).
              // `normal` is three.js's own view-space normal that EVERY light loop reads -- it is overwritten after the stock chunk.
              .replace(
                "#include <normal_fragment_begin>",
                /* glsl */ `
                #include <normal_fragment_begin>
                {
                  float _eps = 0.35 + vTerrainDist * 0.05;
                  float _h0 = _terrainAt(vRelXZ);
                  float _hx = _terrainAt(vRelXZ + vec2(_eps, 0.0));
                  float _hz = _terrainAt(vRelXZ + vec2(0.0, _eps));
                  // World-space up-normal from the height gradient: the TRUE surface normal of the displaced terrain.
                  vec3 _wN = normalize(vec3(_h0 - _hx, _eps, _h0 - _hz));
                  // Into view space, where three's light loops operate, using the world->view rotation passed down from the vertex shader (normalMatrix is a vertex-only built-in -- it does not exist here).
                  vec3 _vN = normalize(vViewRot * _wN);
                  // Orient toward the camera. The fan is ground seen from above, so the lit side ALWAYS faces the eye; flipping the normal to face -vViewPosition is unambiguously correct and sidesteps any BackSide / FLIP_SIDED / winding subtlety.
                  if (dot(_vN, vViewPosition) < 0.0) _vN = -_vN;
                  normal = _vN;
                  // ---- Procedural ground texture ----------------------------
                  // The flat single-green albedo read as an untextured 3D primitive. Break it up with world-locked color noise at two scales:
                  //   - BROAD patches (~0.03 cyc/m, ~33 m features): large dry/lush variation, the "fields" read.
                  //   - FINE grain (~0.9 cyc/m, ~1 m features): close-up detail so ground near the bike isn't a flat sheet.
                  // The fine grain is faded out with distance (it would otherwise alias into shimmer past a few tens of metres) -- near ground gets detail, far ground stays clean.
                  float _patches = _colorNoise(0.03);
                  float _grain   = _colorNoise(0.9);
                  float _grainFade = 1.0 - smoothstep(15.0, 70.0, vTerrainDist);
                  // Base grass: lerp dark<->light grass by the broad patches.
                  vec3 _grass = mix(uGrassDark, uGrassLight,
                                    smoothstep(0.25, 0.75, _patches));
                  // Fine grain modulates brightness +/-12% near the camera.
                  _grass *= 1.0 + (_grain - 0.5) * 0.24 * _grainFade;

                  // Slope blend grass -> rock, from the world normal (pre-orient, so "up" is unambiguous).
                  float _slope = 1.0 - clamp(_wN.y, 0.0, 1.0);
                  vec3 _albedo = mix(_grass, uRock,
                                     smoothstep(0.12, 0.55, _slope));
                  // Apply it to diffuseColor HERE. <color_fragment> has already run (it precedes <normal_fragment_begin> in the stock main()), so writing the tint now -- after the normal is known -- is the correct order. All lighting chunks downstream read this tinted diffuseColor.
                  diffuseColor.rgb = _albedo;
                }
                `,
              );
          };

          super(geo, mat);
          this.frustumCulled = false;
          // No shadows.
          // Nothing in the scene casts (bike + rider are all castShadow=false), so receiving would only paint the sun shadow camera's own frustum-edge / depth-clamp artifact onto the ground -- that dark mid-distance blob.
          this.receiveShadow = false;
        }

        /**
         * Push the per-octave wrapped bike origin to the shader.
         * Called once per frame from Game.update.
         * The wrap is done in JS float64 -- exact at any world magnitude -- so the small uniform the GPU receives is a precise stand-in for the bike's true (possibly enormous) position.
         */
        updateBikeWrap(worldX, worldZ) {
          const T = CONFIG.TERRAIN;
          const PA = TERRAIN_PERIOD_A,
            PB = TERRAIN_PERIOD_B;
          const ax = worldX / T.OCTAVE_A_SCALE;
          const az = worldZ / T.OCTAVE_A_SCALE;
          this.material.userData.uBikeWrapA.value.set(
            ((ax % PA) + PA) % PA,
            ((az % PA) + PA) % PA,
          );
          const bx = worldX / T.OCTAVE_B_SCALE;
          const bz = worldZ / T.OCTAVE_B_SCALE;
          this.material.userData.uBikeWrapB.value.set(
            ((bx % PB) + PB) % PB,
            ((bz % PB) + PB) % PB,
          );
        }
      }

      // ============================================================================
      // GLB LOADER
      // ============================================================================
      const dracoLoader = new DRACOLoader().setDecoderPath(
        "https://www.gstatic.com/draco/v1/decoders/",
      );
      const ktx2Loader = new KTX2Loader().setTranscoderPath(
        "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/libs/basis/",
      );
      const gltfLoader = new GLTFLoader()
        .setDRACOLoader(dracoLoader)
        .setKTX2Loader(ktx2Loader)
        .setMeshoptDecoder(MeshoptDecoder);
      function attachKTX2Renderer(renderer) {
        ktx2Loader.detectSupport(renderer);
      }
      function loadGlbAsync(url) {
        return new Promise((resolve) => {
