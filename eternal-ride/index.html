            .set(
              this.bike._lightTargetX,
              this.bike._lightTargetY,
              this.bike._lightTargetZ,
            )
            .applyMatrix4(pose.matrixWorld);

          // ---- Two-segment aim trace: find the EYE's true target ---------- The reticle is a point on a fixed 30 m plane, so muzzle->reticle and camera->reticle are two different lines that only cross at 30 m.
          // Aiming the bullet along muzzle->reticle made the impact drift off what the crosshair covered (the parallax the player saw as "shots don't land where I aim").
          //
          // Fix: trace the line the player's EYE points along -- camera through reticle -- against the visible surface.
          // That hit point is the true target.
          // The bullet then flies muzzle -> that point: it still leaves the gun barrel (no visual change) but lands exactly where the crosshair was.
          // The trace also hands the bullet its target DISTANCE, so in flight it skips the per-frame terrain search entirely (see Bullet.update path A).
          //
          // camDirX/Y/Z = unit camera -> reticle.
          // The camera world position is precise here (no huge-number subtraction): both endpoints are genuine world points and their difference is a small local vector.
          this._sCamWorld.copy(this.camera.position);
          let camDirX = this._sReticleWorld.x - this._sCamWorld.x;
          let camDirY = this._sReticleWorld.y - this._sCamWorld.y;
          let camDirZ = this._sReticleWorld.z - this._sCamWorld.z;
          const camDirLen = Math.hypot(camDirX, camDirY, camDirZ) || 1;
          camDirX /= camDirLen;
          camDirY /= camDirLen;
          camDirZ /= camDirLen;
          const aimHitDist = this._traceAim(
            this._sCamWorld.x,
            this._sCamWorld.y,
            this._sCamWorld.z,
            camDirX,
            camDirY,
            camDirZ,
            this._sAimHit,
          );
          // aimTarget = the traced surface point if the eye-line hit the ground, else the reticle plane point (a sky shot -- the bullet will fly that way and self-collide via the fallback path).
          const hasAimHit = aimHitDist >= 0;
          const aimTarget = hasAimHit ? this._sAimHit : this._sReticleWorld;

          let dx = aimTarget.x - muzzleX;
          let dy = aimTarget.y - muzzleY;
          let dz = aimTarget.z - muzzleZ;
          const dlen = Math.hypot(dx, dy, dz) || 1;
          dx /= dlen;
          dy /= dlen;
          dz /= dlen;

          // ---- Velocity: inherit the bike's motion, still hit the reticle -- Naive `aimDir * SPEED` fires the bullet in the WORLD frame with no share of the bike's velocity.
          // At ~52 m/s bike vs 90 m/s bullet, a sideways shot then appears to slide backward at nearly full travel speed -- the shot looks "left behind" and you can't see it land.
          // The common approach: the projectile inherits the platform's velocity.
          //
          // But the bullet must STILL pass through the reticle.
          // The bullet flies straight (no gravity), so its world velocity V must point from the muzzle along D = normalize(reticle - muzzle), while also satisfying V = aimDir*SPEED + bikeVel with |aimDir| = 1.
          // Writing V = t*D and substituting: |t*D - bikeVel|^2 = SPEED^2 => t^2 - 2t(D.bikeVel) + (|bikeVel|^2 - SPEED^2) = 0 a quadratic in t (the bullet's true ground speed).
          // The positive root is the launch speed along D; V = t*D is the final velocity.
          //
          // t is real whenever the bike is slower than the bullet (constant term negative -> one +ve, one -ve root).
          // If a future config makes the bike FASTER than the bullet, points outside a rear "Mach cone" become unreachable and the discriminant goes negative; the guard below falls back to plain inheritance so the shot still fires sensibly instead of producing NaN.
          const SPEED = CONFIG.BULLET.SPEED;
          // D = unit muzzle->reticle direction (dx,dy,dz already normalised).
          const bvx = this.bike.fx * this.bike.speed;
          const bvz = this.bike.fz * this.bike.speed;
          // bike has no vertical velocity (worldY isn't velocity-integrated).
          const dDotBv = dx * bvx + dz * bvz; // dy * 0 omitted
          const bvLen2 = bvx * bvx + bvz * bvz;
          const disc = dDotBv * dDotBv - (bvLen2 - SPEED * SPEED);

          let velX, velY, velZ;
          let velAlongAim;
          if (disc >= 0) {
            // Positive root: bullet's true ground speed along D.
            // Velocity is purely along the aim line D, so the precomputed target distance is valid (the bullet reaches the target at distance dlen).
            const t = dDotBv + Math.sqrt(disc);
            velX = dx * t;
            velY = dy * t;
            velZ = dz * t;
            velAlongAim = true;
          } else {
            // Unreachable (bike faster than bullet, aim outside the cone): fall back to plain velocity inheritance.
            // Velocity is NOT along D, so the straight-to-target distance no longer holds -- the bullet must self-collide via the substep fallback instead.
            velX = dx * SPEED + bvx;
            velY = dy * SPEED;
            velZ = dz * SPEED + bvz;
            velAlongAim = false;
          }

          // dlen (the un-normalized muzzle->target length, computed above) is the distance the bullet flies to reach the eye-traced impact point.
          // Pass it as the bullet's target distance only when the eye-line hit a surface AND the velocity runs along the aim line; otherwise pass nothing so the bullet uses its fallback march.
          const useTarget = hasAimHit && velAlongAim;
          b.fire(
            muzzleX,
            muzzleY,
            muzzleZ,
            velX,
            velY,
            velZ,
            useTarget ? dlen : undefined,
          );

          if (this.bulletTrails) {
            this._sMuzzle.set(muzzleX, muzzleY, muzzleZ);
            // Trail seeds its orientation from the bullet's velocity (see BulletTrail.fire); pass the normalised velocity as the fallback direction so the two agree even on a degenerate first frame.
            const vLen = Math.hypot(velX, velY, velZ) || 1;
            this._sTrailTarget.set(velX / vLen, velY / vLen, velZ / vLen);
            this.bulletTrails.fire(b, this._sMuzzle, this._sTrailTarget);
          }
        }

        render() {
          this.renderer.render(this.scene, this.camera);
        }
      }

      // ============================================================================
      // BOOTSTRAP
      // ============================================================================
      function init() {
        window.addEventListener("contextmenu", (e) => e.preventDefault());
        const splash = document.getElementById("splash");
        if (isTouchOnly()) {
          document.getElementById("splashCTA").textContent = "TAP TO START";
        }
        const startGame = () => {
          SOUND = new SoundManager();
          if (Howler.ctx && Howler.ctx.state === "suspended") {
            Howler.ctx.resume().catch(() => {});
          }
          const muteBtn = document.getElementById("muteBtn");
          if (muteBtn && SOUND.isMuted) muteBtn.classList.add("muted");
          splash.classList.add("hidden");
          setTimeout(() => splash.remove(), 600);
          startMainLoop();
        };
        splash.addEventListener("pointerdown", startGame, { once: true });

        document
          .getElementById("fullscreenBtn")
          .addEventListener("click", () => toggleFullscreen());
        const helpBtn = document.getElementById("helpBtn");
        const helpPanel = document.getElementById("helpPanel");
        helpBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          helpPanel.classList.toggle("show");
        });
        document.addEventListener("pointerdown", (e) => {
          if (
            helpPanel.classList.contains("show") &&
            !helpPanel.contains(e.target) &&
            !helpBtn.contains(e.target)
          ) {
            helpPanel.classList.remove("show");
          }
        });
        document.getElementById("muteBtn").addEventListener("click", () => {
          if (!SOUND) return;
          SOUND.toggleMute();
          document
            .getElementById("muteBtn")
            .classList.toggle("muted", SOUND.isMuted);
        });
        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyM" && SOUND) {
            SOUND.toggleMute();
            document
              .getElementById("muteBtn")
              .classList.toggle("muted", SOUND.isMuted);
          }
        });
      }

      function startMainLoop() {
        const container = document.getElementById("container");
        const game = new Game(container);

        // Engine starts running the moment the world is up.
        game.startEngine();

        // Desktop: the reticle is the cursor, so hide the OS pointer over the game.
        // It is restored automatically whenever the pointer crosses onto a HUD element or focus is lost (see Input._setAimSuppressed).
        if (!game.input.touchOnly) {
          document.body.style.cursor = "none";
        }

        const pauseOverlay = document.getElementById("pauseOverlay");
        const pauseHint = document.getElementById("pauseHint");
        if (game.input.touchOnly) pauseHint.textContent = "tap to resume";
        const setPaused = (p) => {
          if (game.paused === p) return;
          game.paused = p;
          pauseOverlay.classList.toggle("show", p);
          // Cut engine on pause so the loop doesn't drone over a frozen scene.
          if (p) game.stopEngine();
          else game.startEngine();
          // Restore the OS cursor while paused (the overlay needs a pointer); re-hide it on resume.
          // Touch devices have no OS cursor to manage.
          if (!game.input.touchOnly) {
            document.body.style.cursor = p ? "default" : "none";
            // Resuming: drop any stale suppression so the next mousemove re-establishes aim cleanly.
            if (!p) game.input._setAimSuppressed(false);
          }
        };
        window.addEventListener("keydown", (e) => {
          if (e.code === "Escape") {
            game.paused ? setPaused(false) : setPaused(true);
            e.preventDefault();
          }
        });
        pauseOverlay.addEventListener("pointerdown", () => {
          if (game.paused) setPaused(false);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) setPaused(true);
        });
        window.addEventListener("blur", () => setPaused(true));

        const statsEl = document.getElementById("stats");
        const statsFps = document.getElementById("statsFps");
        const statsExtra = document.getElementById("statsExtra");
        let fpsAcc = 0,
          fpsFrames = 0,
          extraAcc = 0;
        let lastFps = -1,
          lastDC = -1,
          lastTRI = -1,
          lastGEO = -1,
          lastTEX = -1,
          lastPRG = -1;
        statsEl.addEventListener("pointerdown", (e) => {
          statsEl.classList.toggle("expanded");
          e.preventDefault();
        });
        const fmtN = (n) =>
          n >= 1e6
            ? (n / 1e6).toFixed(1) + "M"
            : n >= 1e3
              ? (n / 1e3).toFixed(1) + "K"
              : String(n);

        const timer = new Timer();
        function tick() {
          requestAnimationFrame(tick);
          timer.update();
          const dt = Math.min(timer.getDelta(), 0.1);
          const elapsed = timer.getElapsed();
          // When paused: do NO simulation AND no GPU render.
          // The canvas keeps the last frame visible (browser doesn't auto-clear it) and the pause overlay sits on top.
          // Saves laptop battery and lets the GPU clock down.
          if (game.paused) return;
          game.update(dt, elapsed);
          game.render();

          {
            fpsAcc += dt;
            fpsFrames++;
            if (fpsAcc >= 0.5) {
              const fps = (fpsFrames / fpsAcc) | 0;
              if (fps !== lastFps) {
                statsFps.textContent = `${fps} fps`;
                lastFps = fps;
              }
              fpsAcc = 0;
              fpsFrames = 0;
            }
            if (statsEl.classList.contains("expanded")) {
              extraAcc += dt;
              if (extraAcc >= 1.0) {
                const r = game.renderer.info.render;
                const m = game.renderer.info.memory;
                const prg = game.renderer.info.programs?.length || 0;
                if (
                  r.calls !== lastDC ||
                  r.triangles !== lastTRI ||
                  m.geometries !== lastGEO ||
                  m.textures !== lastTEX ||
                  prg !== lastPRG
                ) {
                  statsExtra.textContent =
                    `\nDC: ${fmtN(r.calls)}` +
                    `\nTRI: ${fmtN(r.triangles)}` +
                    `\nGEO: ${m.geometries}` +
                    `\nTEX: ${m.textures}` +
                    `\nPRG: ${prg}`;
                  lastDC = r.calls;
                  lastTRI = r.triangles;
                  lastGEO = m.geometries;
                  lastTEX = m.textures;
                  lastPRG = prg;
                }
                extraAcc = 0;
              }
            }
          }
        }
        tick();
      }

      init();
    </script>
  </body>
</html>
